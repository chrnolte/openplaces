[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openplaces"
version = "0.1.0"
authors = [
    {name = "Christoph Nolte", email = "nolte.christoph@gmail.com"},
]
maintainers = [
    {name = "Christoph Nolte", email = "nolte.christoph@gmail.com"},
]
description = "A Python package for place-based geospatial analysis"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
keywords = [
    "geospatial",
    "gis",
    "places",
    "property",
    "parcels",
    "sales",
    "geography",
    "spatial-analysis"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

# Core dependencies - essential for basic functionality
dependencies = [
    "geopandas>=1.0.0",
    "duckdb>=1.5.0",
    "rasterio>=1.3.0",
    "pyproj>=3.5.0",
    "shapely>=2.0.0",
    "pyogrio>=0.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=10.0.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0.3",
    "platformdirs>=4.9.2",
    "python-polylabel>=0.6",
    "openlocationcode>=1.0.1",
    "psutil>=5.9.0",
    "usaddress>=0.5.14",
    "rapidfuzz>=3.0.0"
]

[project.optional-dependencies]
# Statistical analysis and basic ML
analysis = [
    "statsmodels>=0.14.0", 
    "scikit-learn>=1.3.0", 
    "rasterstats>=0.19.0"
]

# Visualization tools
viz = [
    "matplotlib>=3.7.0", 
    "plotly>=5.15.0", 
    "folium>=0.15.0", 
    "altair>=5.0.0",
    "seaborn>=0.12.0",
    "contextily>=1.6.2"
]

# Advanced raster processing
raster = [
    "rioxarray>=0.15.0", 
    "rio-cogeo>=4.0.0", 
    "scikit-image>=0.21.0", 
    "numba>=0.58.0",
    "exactextract>=0.3.0"
]

# Documentation
docs = [
    "sphinx>=7.0.0",
    "pydata-sphinx-theme>=0.16.1",
    "sphinx-design>=0.7.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-autoapi>=3.8.0",
    "sphinxcontrib-mermaid>=2.0.2"
]

# Excel I/O
excel = ["openpyxl>=3.1.0"]

# Cloud storage
cloud = ["rclone>=1.73.1"]

# Browser- and API-driven scrapers (e.g. wi_retr for Wisconsin RETR
# transactions via Playwright; places-fmv2026 for Google-Drive-hosted parcel
# data via gdown). After install, fetch the browser binary:
# `playwright install chromium`
scrape = ["playwright>=1.40.0", "gdown>=5.2.0"]

# ML detectors (floor count, occupancy, roof shape).
# torch/torchvision are intentionally NOT pip dependencies: they must be
# installed via conda (see environment.yml `pytorch`/`torchvision`). Keep
# this empty.
ml = []

# Development and testing tools
dev = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.6.1",
    "jupyter-ruff>=0.2.0",
    "jupyterlab-execute-time>=3.0.0",
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
    "nbstripout>=0.8.2",
    "ipynbname>=2023.2.0.0"
]

# All optional dependencies
all = [
    "openplaces[analysis,viz,raster,docs,excel,cloud,scrape,ml,dev]"
]

# For academic/research workflows
academic = [
    "openplaces[analysis,viz]",
    "jupyter>=1.0.0",
    "matplotlib-scalebar>=0.8.0"
]

[project.urls]
Homepage = "https://github.com/chrnolte/openplaces"
Documentation = "https://openplaces.readthedocs.io/"
Repository = "https://github.com/chrnolte/openplaces.git"
"Bug Tracker" = "https://github.com/chrnolte/openplaces/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openplaces*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
openplaces = [
    "qgis/*.py",
    "core/*.csv",
    "geo/*.csv",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["openplaces"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = [
    "test_*.py",
    "*_test.py"
]

[tool.coverage.run]
source = ["src/openplaces"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
