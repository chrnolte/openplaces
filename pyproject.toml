[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openplaces"
version = "0.1.0"
authors = [
    {name = "Christoph Nolte", email = "nolte.christoph@gmail.com"},
]
maintainers = [
    {name = "Christoph Nolte", email = "nolte.christoph@gmail.com"},
]
description = "A Python package for place-based geospatial analysis"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
keywords = [
    "geospatial",
    "gis",
    "places",
    "property",
    "parcels",
    "sales",
    "geography",
    "spatial-analysis"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

# Core dependencies - essential for basic functionality
dependencies = [
    "geopandas>=1.0.0",
    "rasterio>=1.3.0",
    "pyproj>=3.5.0",
    "shapely>=2.0.0",
    "pyogrio>=0.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=10.0.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
# Statistical analysis and basic ML
analysis = [
    "statsmodels>=0.14.0", 
    "scikit-learn>=1.3.0", 
    "rasterstats>=0.19.0"
]

# Visualization tools
viz = [
    "matplotlib>=3.7.0", 
    "plotly>=5.15.0", 
    "folium>=0.15.0", 
    "altair>=5.0.0",
    "seaborn>=0.12.0"
]

# Advanced raster processing
raster = [
    "rioxarray>=0.15.0", 
    "rio-cogeo>=4.0.0", 
    "scikit-image>=0.21.0", 
    "numba>=0.58.0"
]

# Development and testing tools
dev = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "jupyterlab-code-formatter>=3.0.0",
    "isort>=5.12.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0"
]

# Excel I/O
excel = ["openpyxl>=3.1.0"]

# All optional dependencies
all = [
    "openplaces[analysis,viz,raster,dev,excel]"
]

# For academic/research workflows
academic = [
    "openplaces[analysis,viz]",
    "jupyter>=1.0.0",
    "matplotlib-scalebar>=0.8.0"
]

[project.urls]
Homepage = "https://github.com/chrnolte/openplaces"
Documentation = "https://openplaces.readthedocs.io/"
Repository = "https://github.com/chrnolte/openplaces.git"
"Bug Tracker" = "https://github.com/chrnolte/openplaces/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openplaces*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
openplaces = [
    "config/*.toml",
    "datasets/**/*.toml"
]

[tool.black]
line-length = 88
target-version = ['py312']
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ['openplaces']
force_sort_within_sections = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["openplaces"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = [
    "test_*.py",
    "*_test.py"
]

[tool.coverage.run]
source = ["src/openplaces"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]