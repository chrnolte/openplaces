# environment.yml
# IMPORTANT: Keep dependencies in sync with pyproject.toml
# - Core deps match [project.dependencies]
# - Optional deps match [project.optional-dependencies.*]
# When updating dependencies, update BOTH files!

name: openplaces
channels:
  - conda-forge
dependencies:
  # Python version
  - python>=3.12

  # Core geospatial dependencies (better via conda due to C/C++ libs)
  # KEEP IN SYNC WITH pyproject.toml [project.dependencies]
  - geopandas>=1.0.0
  - duckdb>=1.5.0
  - rasterio>=1.3.0
  - pyproj>=3.5.0
  - shapely>=2.0.0
  - pyogrio>=0.7.0

  # Core non-spatial dependencies
  - numpy>=1.24.0
  - pandas>=2.0.0
  - pyarrow>=10.0.0
  - requests>=2.28.0
  - tqdm>=4.65.0
  - pyyaml>=6.0.3
  - platformdirs>=4.9.2

  # Optional: analysis
  # KEEP IN SYNC WITH pyproject.toml [project.optional-dependencies.analysis]
  - statsmodels>=0.14.0
  - scikit-learn>=1.3.0
  - rasterstats>=0.19.0

  # Optional: viz
  # KEEP IN SYNC WITH pyproject.toml [project.optional-dependencies.viz]
  - matplotlib>=3.7.0
  - plotly>=5.15.0
  - folium>=0.15.0
  - seaborn>=0.12.0
  - contextily>=1.6.2
  - altair>=5.0.0

  # Optional: raster
  # KEEP IN SYNC WITH pyproject.toml [project.optional-dependencies.raster]
  - rioxarray>=0.15.0
  - rio-cogeo>=4.0.0
  - scikit-image>=0.21.0
  - numba>=0.58.0
  - exactextract>=0.3.0

  # Optional: docs
  # KEEP IN SYNC WITH pyproject.toml [project.optional-dependencies.docs]
  - sphinx>=7.0.0
  - pydata-sphinx-theme>=0.16.1
  - sphinx-design>=0.7.0
  - sphinx-copybutton>=0.5.0
  - sphinx-autoapi>=3.8.0
  - sphinxcontrib-mermaid>=2.0.2

  # Optional: excel
  # KEEP IN SYNC WITH pyproject.toml [project.optional-dependencies.excel]
  - openpyxl>=3.1.0

  # Optional: cloud
  # KEEP IN SYNC WITH pyproject.toml [project.optional-dependencies.cloud]
  - rclone>=1.73.1

  # Optional: ml (required for floor/roof/occupancy ML detectors)
  # GPU notes (detectors auto-select via io/enricher/detectors/device.py):
  # - NVIDIA (e.g. Linux cluster): conda-forge picks the CUDA build
  #   automatically when the driver is visible at solve time (__cuda
  #   virtual package). Solve on a GPU node, or pin `pytorch=*=cuda*`
  #   in a cluster env file. Verify with:
  #   python -c "import torch; print(torch.cuda.is_available())"
  # - AMD Radeon on Windows: use the dedicated GPU env built from
  #   environment-rocm.yml (`python dev.py gpu`) with AMD's official
  #   PyTorch-on-Windows ROCm wheels. Never install pip torch into THIS
  #   env (ABI clash with conda packages).
  - pytorch>=2.10.0
  - torchvision>=0.25.0

  # Optional: scrape (browser-driven scrapers, e.g. wi_retr)
  # KEEP IN SYNC WITH pyproject.toml [project.optional-dependencies.scrape]
  # After install, fetch the browser: `playwright install chromium`
  - playwright>=1.40.0

  # Optional: dev tools
  # KEEP IN SYNC WITH pyproject.toml [project.optional-dependencies.dev]
  - jupyter>=1.0.0
  - jupyterlab>=4.6.1
  - jupyter-ruff>=0.2.0
  - jupyterlab_execute_time>=3.0.0
  - ruff>=0.1.0
  - pytest>=7.4.0
  - pytest-cov>=4.1.0
  - pre-commit>=3.5.0
  - nbstripout>=0.8.2
  - ipynbname>=2023.2.0.0

  # Conda-specific packages that enhance development
  - ipython

  # pip for installing packages that are not on conda-forge
  - pip

  - pip:
    - python-polylabel>=0.6
    - openlocationcode>=1.0.1
    - -e .

variables:
  PYTHONUTF8: "1"
  # conda-forge pytorch (even the cpu_mkl build) links some extensions against
  # LLVM libomp.dll, which conflicts with Intel libiomp5md.dll loaded by MKL/numpy.
  # This variable suppresses the fatal error; the two runtimes coexist safely for
  # sequential inference workloads where no mixed-OMP parallelism occurs.
  KMP_DUPLICATE_LIB_OK: "TRUE"
