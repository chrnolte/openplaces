# Recipe: Colombia's national natural parks (Parques Nacionales
# Naturales), 2015 layer, for the year each park was declared.
#
# The current RUNAP (CO_rules-protected-runap-2026) states no declaration
# date; this layer does, inside its resolution text. Read by
# CO_parcel_rules-protected-2026 for the annual protection status
# (Reboredo Segovia et al.: protected in the year before treatment).
#
# Source: Parques.shp in the maintainer's Colombia GIS folder
# (Protection/PARQUES, file dated 2015-09-25), 59 areas, EPSG:4686,
# categories PNN 43, SFF 10, SF 2, RN 2, ANU 1, VP 1. Published by PNN;
# PNN's current terms are CC BY-SA 4.0, the terms in force in 2015 were
# not checked.
#
# resolucion holds the act and its date ("RESOLUCION 9999 DE
# 99/99/9999", "DECRETO 9999 DE ..."); the year is the last four-digit
# year in the text, which skips a resolution number. 57 of 59 have one
# (1974-2014). A park declared after 2015 is in RUNAP only.
#
# The park's name is not an id here (59 rows, none with an id), so rows
# keep a positional index.

description: >-
  Colombia's national natural parks (PNN, 2015 layer): category and the
  year of the declaring act.

admin_id: CO

dataset:
  theme: rules-protected
  source:
    source_id: pnn
    portal_url: "https://www.parquesnacionales.gov.co"
    license: "PNN; current terms CC BY-SA 4.0 (2015 terms not checked)"
    terms_url: "https://portaldatosabiertos-PNNC.hub.arcgis.com"
    redistribution_restricted: false
  version: 2015

uncompressed_file_name: "Parques.shp"

columns:
  protected_area_category: categoria

transformations:
  - output: protected_area_year
    input: resolucion
    type: string
    operation: extract_named
    args:
      pattern: '.*(?<!\d)(?P<year>(?:19|20)\d\d)(?!\d)'
  - output: protected_area_year
    input: protected_area_year
    type: unary
    operation: to_numeric

keep_unnamed_columns: False

save_to:
  data_dir: core
