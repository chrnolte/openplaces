description: >-
  Colombian municipality boundaries from DANE (admin level 3).

admin_id: CO

entity:
  entity_type: admin
  source:
    source_id: dane
    portal_url: "https://experience.arcgis.com/experience/5416979d97fc44ca9830954856784b35/"
    download_url: "https://geoportal.dane.gov.co/descargas/mgn_2025/MGN2025_MPIO_GRAFICO.zip"
  version: 2025

compressed_file_name: "MGN2025_MPIO_GRAFICO.zip"
uncompressed_file_name: "MGN_ADM_MPIO_GRAFICO.shp"

columns:
  name: mpio_cnmbr
  admin3_id_admin1: mpio_cdpmp
  admin2_id_admin1: dpto_ccdgo
  type: mpio_tipo

transformations:
  - output: name
    input: name
    type: string
    operation: title_smart
  - output: type
    input: type
    type: string
    operation: title_smart

keep_unnamed_columns: False


admin_id_crosswalk:
  admin_level: 2
  admin_id_column: admin2_id_admin1
  admin_recipe_id: "admin-spine-2026_admin2"


# Identifiers are not minted here: units the committed spine already names
# keep the code it records (pinned on name, or on the DANE municipality
# code in `admin3_id_admin1` for the siblings that share a name), and
# only units it does not name are assigned. The legacy
# `generate_admin_ids` minted afresh on every run, so this layer could
# never agree with the spine.
create_index:
  function: "openplaces.io.admin_codes.assign_admin_ids"
  args:
    new_admin_id_col: admin3_id
    parent_admin_id_col: admin2_id
    name_col: name

sort_index: True

# The level suffix is what keeps this output apart from the admin2
# recipe's; see the note there.
save_to:
  data_dir: cache
  filename: admin3
