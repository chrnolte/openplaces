# Recipe: consolidated zonal-statistics enrichment for Colombia parcels.
#
# One recipe, one evidence parquet per admin3 (saved next to the harmonized
# CO_parcel-spine-2026 output, same as every enrich recipe), with many
# pipeline steps each contributing one or more evidence columns -- rather
# than one recipe (and one output file) per indicator. This mirrors the
# `places` codebase's checkpoints_CO/ inventory
# the ground truth for exactly which rasters/years/stats are included here:
# every entry below corresponds to one checkpoint file that already existed
# for CO parcels under the old pipeline, just computed here via the
# Enricher/EnrichState step-registry architecture instead.
#
# Three step types are used:
#   - derive_from_spine: parcel-area/coordinate/density stats computed from
#     spine geometry and existing spine columns alone, no raster involved
#     (src/openplaces/io/enricher/derived.py).
#   - zonal_stats: ordinary per-parcel raster sampling
#     (src/openplaces/io/enricher/zonal.py).
#   - vicinity_coverage: for protection and 3-year-deforestation, computes a
#     vicinity-coverage raster on the fly from the raw boolean raster
#     (`source_raster_path`), scoped to just the admin unit being processed
#     -- not a full national precompute like
#     required. The read window is padded by `px_radius` pixels so
#     neighboring admin units are still correctly accounted for at the
#     boundary (see compute_vicinity_coverage's docstring); verified to match
#     the old national-scale output pixel-for-pixel. The generated raster is
#     cached under `{source raster's dir}/vicinity_coverage/{admin_id}/...` and
#     reused on subsequent runs. Generic over any boolean raster -- not
#     specific to protection/deforestation.
#     (src/openplaces/io/enricher/vicinity.py).
#
# SoilGrids rasters are intentionally excluded (out of scope per request).

description: >-
  Consolidated per-parcel zonal-statistics enrichment for Colombia: elevation,
  travel accessibility, nighttime lights, MapBiomas forest/gain/loss/
  deforestation (annual, 1986-2024), protection and 3-year-deforestation
  vicinity coverage (computed on the fly per admin unit), and geometry-derived
  stats (area, centroid, building density). One evidence table per admin3,
  covering every indicator.

stage: enrich
admin_id: CO

entity:
  entity_type: parcel

dataset:
  theme: land-zonal-stats
  source:
    source_id: multi
  version: 2026

# Needed for zonal_stats/vicinity_coverage/derive_from_spine: they all
# operate on parcel polygons.
spine_geom: true

process_by:
  admin_level: 3

