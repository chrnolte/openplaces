# Recipe: static predictors of land value per parcel for Colombia, the
# covariates of Nolte et al. 2023 (Front. Ecol. Environ.) sampled on the
# IGAC parcel spine instead of a 1 km pixel grid.
#
# Separate from CO_parcel_land-zonal-stats-multi-2026, whose 300+ annual
# MapBiomas and protection steps take hours per run and serve the
# deforestation work; this recipe is the ~15 rasters the cost model and
# the impact evaluation share. The same step list runs on the transaction
# spine (CO_transaction_land-value-predictors-2026), so the model's
# training rows and the parcels it predicts on carry identical columns;
# a test asserts the two lists match.
#
# Rasters are sampled at their native resolution with exactextract
# (fractional pixel weighting), not resampled to 1 km as in the paper; a
# small parcel gets a real mean rather than one pixel. Recorded as a
# methodological difference in plans/land-value-model-colombia-and-us-fmv-
# transfer.md, section 3.
#
# Raster layout under the raster root (place these; licences in the plan,
# section 5.1). `DEM/copernicus_30m/...` already exists for the multi
# recipe; the rest mirror the FEE notebook's `R` dict:
#   DEM/copernicus_30m/CO_DEM_copernicus_30m.tif   elevation (m)
#   DEM/copernicus_30m/CO_slope_copernicus_30m.tif slope (deg, gdaldem)
#   access/nelson_2019_travel_time_50k.tif        Nelson et al. 2019
#   access/weiss_2018_accessibility_to_cities.tif  Weiss et al. 2018
#   built/sentinel_built_30_filled.tif            built share (0-1)
#   access/roads_osm_distance_150.tif             distance to OSM roads
#   access/roads_groads_distance_150.tif          distance to gROADS
#   lights/dmsp_stable_lights_avg_2001_2013.tif   DMSP average
#   carbon/baccini_aboveground_biomass.tif        biomass (Mg/ha)
#   forest/hansen_treecover_2000.tif              tree cover share
#   rent/agricultural_rent_km2.tif                local agricultural rent
#   PAs/protection_strict_boolean.tif             national parks +
#                                                 Parque Natural Regional
#
# Municipality covariates (population_density, displaced_share) join by
# link_admin_attribute once CO_population-dane-2018 and
# CO_population-renavi-2021 are ingested (data plan 3.8); the steps are
# listed below disabled so the recipe documents the full predictor set.

description: >-
  Static land-value predictors per Colombia parcel: terrain, travel time,
  built share, road distance, lights, biomass, tree cover, rent, strict PA.

stage: enrich
admin_id: CO

entity:
  entity_type: parcel

dataset:
  theme: land-value-predictors
  source:
    source_id: openplaces
  version: 2026

spine_geom: true

process_by:
  admin_level: 3

pipeline:
  - step: zonal_stats
    raster_path: DEM/copernicus_30m/CO_DEM_copernicus_30m.tif
    raster_key: elevation
    column: elevation
    stat: mean
  - step: zonal_stats
    raster_path: DEM/copernicus_30m/CO_slope_copernicus_30m.tif
    raster_key: slope
    column: slope
    stat: mean
  - step: zonal_stats
    raster_path: access/nelson_2019_travel_time_50k.tif
    raster_key: travel_time_nelson
    column: travel_time_nelson
    stat: mean
  - step: zonal_stats
    raster_path: access/weiss_2018_accessibility_to_cities.tif
    raster_key: travel_time_weiss
    column: travel_time_weiss
    stat: mean
  - step: zonal_stats
    raster_path: built/sentinel_built_30_filled.tif
    raster_key: built_share
    column: built_share
    stat: mean
  - step: zonal_stats
    raster_path: access/roads_osm_distance_150.tif
    raster_key: road_distance_osm
    column: road_distance_osm
    stat: mean
  - step: zonal_stats
    raster_path: access/roads_groads_distance_150.tif
    raster_key: road_distance_groads
    column: road_distance_groads
    stat: mean
  - step: zonal_stats
    raster_path: lights/dmsp_stable_lights_avg_2001_2013.tif
    raster_key: lights_dmsp
    column: lights_dmsp
    stat: mean
  - step: zonal_stats
    raster_path: carbon/baccini_aboveground_biomass.tif
    raster_key: biomass_aboveground
    column: biomass_aboveground
    stat: mean
  - step: zonal_stats
    raster_path: forest/hansen_treecover_2000.tif
    raster_key: tree_cover_share
    column: tree_cover_share
    stat: mean
  - step: zonal_stats
    raster_path: rent/agricultural_rent_km2.tif
    raster_key: agricultural_rent
    column: agricultural_rent
    stat: mean
  - step: zonal_stats
    raster_path: PAs/protection_strict_boolean.tif
    raster_key: protected_strict_share
    column: protected_strict_share
    stat: mean
  - step: link_admin_attribute
    enabled: false
    output: population_density
    recipe_id: CO_population-dane-2018
    attribute: population
    per_km2: true
  - step: link_admin_attribute
    enabled: false
    output: displaced_share
    recipe_id: CO_population-renavi-2021
    attribute: n_expelled
    share_of: population
