# Rural parcels (R_TERRENO) of IGAC's public cadastre, August 2026
# release ("Base Catastral Pública del Gestor IGAC 08-2026 Formato GDB",
# ArcGIS item e9b8fa55ab094fa68b61698c080d3493,
# `CatastroPublicoAgosto2026.gdb.zip`, 8,248,133,826 bytes, downloaded
# 2026-10-17). IGAC publishes the national cadastre monthly; this is the
# newest release on 2026-10-17 and the parcel spine's first IGAC source.
# Older releases fill the municipalities it lacks (`fill_group` in
# CO_parcel-spine-2026): 786 rural municipalities here, 839 across the
# 2020-2022 releases. Antioquia is in none of them.
#
# Licence: CC BY-SA 4.0 (the item's licenseInfo), with IGAC's copyright
# under Ley 23 de 1982; derived products carry the same licence.
#
# `USUARIO_LOG` holds the login of the IGAC staff member who last edited
# a parcel; it is not mapped, and `keep_unnamed_columns` is false, so it
# never reaches an output.

description: >-
  Rural land parcels (R_TERRENO) from Colombia's IGAC public cadastre,
  August 2026 release, per municipality.

admin_id: CO

entity:
  entity_type: parcel
  source:
    source_id: igac
    portal_url: "https://www.igac.gov.co/datos-abiertos/datos-abiertos-geoespaciales"
    download_url: "https://www.arcgis.com/sharing/rest/content/items/e9b8fa55ab094fa68b61698c080d3493/data"
    license: "CC BY-SA 4.0 (IGAC open data); IGAC copyright under Ley 23 de 1982"
    terms_url: "https://www.arcgis.com/sharing/rest/content/items/e9b8fa55ab094fa68b61698c080d3493?f=json"
    redistribution_restricted: false
  version: "202608"

compressed_file_name: "CatastroPublicoAgosto2026.gdb.zip"
uncompressed_file_name: "CatastroPublicoAgosto2026.gdb"
layer: R_TERRENO

process_by:
  admin_level: 3
  admin_id_column: codigo_municipio
  admin_id_crosswalk:
    admin_level: 3
    admin_id_column: admin3_id_admin1
    admin_recipe_id: "admin-spine-2026_admin3"

columns:
  parcel_id_admin3: CODIGO
  parcel_id_admin3_2: CODIGO_ANTERIOR
  admin3_id_admin1: codigo_municipio
  vereda_code: VEREDA_CODIGO
  m2: SHAPE_Area

# Copied to `parcel_id_local`, as in CO_parcel-igac-202202_rural.
transformations:
  - output: parcel_id_local
    type: expression
    expression: "parcel_id_admin3"

keep_unnamed_columns: False

save_to:
  data_dir: cache
  filename: rural
  admin_level: 3
