# Recipe to import CO-AN property data

# Administrative unit identifier: where does this data come from?
description: >-
  Cadastral parcels for Antioquia, Colombia, from the departmental catastro (2018).

admin_id: CO-AN

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: parcel
  # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: catastro
    # Link to portal with metadata
    portal_url:
    # Link to direct download
    download_url:
  version: "2018"

# Filename of compressed file
compressed_file_name: "11.12.18.FullMap.zip"

process_by:
  admin_level: 3
  admin_id_column: MUNICIPIO
  admin_id_transformation:
    - output: admin3_id_admin2_zfill
      type: string
      operation: zfill
      args:
        width: 3
    - input: admin3_id_admin2_zfill
      output: admin3_id_admin1
      type: string
      operation: add_prefix
      args:
        prefix: "05"
  admin_id_crosswalk:
    admin_level: 3
    admin_id_column: admin3_id_admin1
    admin_recipe_id: "admin-spine-2026_admin3"
# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  object_id: OBJECTID_1
  property_id: PK_PREDIOS
  use_group: TIPO
  admin3_id_admin2: MUNICIPIO
  admin4_id_admin3: SECTOR
  admin5_id_admin4: CORREGIMIE
  admin6_id_admin5: BARRIO
  admin7_id_admin6: MANZANA_VE
  n_dwellings: TOTAL_UNID
  street_number: NUMERORADI
  n_buildings: TOTAL_EDIF

keep_unnamed_columns: True

# Derive the country-qualified admin3_id_admin1 (e.g. "05001") from the
# raw, department-scoped admin3_id_admin2 ("1"): zero-pad to 3 digits,
# then prepend Antioquia's 2-digit DANE department prefix.
# admin3_id_admin2_zfill is a disposable intermediate, dropped below.
transformations:
  - input: admin3_id_admin2
    output: admin3_id_admin2_zfill
    type: string
    operation: zfill
    args:
      width: 3
  - input: admin3_id_admin2_zfill
    output: admin3_id_admin1
    type: string
    operation: add_prefix
    args:
      prefix: "05"

drop_columns:
  - admin3_id_admin2_zfill

save_to:
  data_dir: cache
  admin_level: 3
