# Recipe to import Philippine cities and municipalities from the PSGC.
#
# The Philippine Standard Geographic Code is the country's official
# classification, maintained quarterly by the Philippine Statistics
# Authority. As with Brazil, this joins on the official code rather than on
# names: the spine already carries the six-digit PSGC in `admin3_id_admin1`
# for all 1,628 units, and 1,612 of them (99.0%) match exactly.
#
# Two things to know about the codes:
#
# The PSGC moved from six digits to ten. The nine-digit form the API returns
# is the six-digit municipality code plus a three-digit barangay suffix, so
# the first six characters are the historical code the spine holds.
#
# The spine stores the code without its leading zero (`60401` for Aklan's
# Altavas, where the PSGC has `060401`). Matching therefore zero-pads to six
# rather than stripping, which is why the join is 99.0% and not 32%.
#
# The 16 unmatched units are genuine reorganizations rather than bad data:
# Davao Occidental was created out of Davao del Sur in 2013, and Maguindanao
# was split into del Norte and del Sur in 2022 on entering BARMM.

description: >-
  Philippine city and municipality names and PSGC codes (admin level 3).

admin_id: PH

entity:
  entity_type: admin
  source:
    source_id: psa
    portal_url: "https://psa.gov.ph/classification/psgc"
    # The PSA publishes the PSGC as a quarterly spreadsheet whose URL
    # changes each release. This endpoint is a community-maintained
    # machine-readable mirror of that publication, which is worth stating
    # plainly: the authority is the PSA, the convenience is not theirs.
    download_url: "https://psgc.gitlab.io/api/cities-municipalities/"
    license: "PSGC is a public statistical classification published by the PSA"
    terms_url: "https://psa.gov.ph/classification/psgc"
    redistribution_restricted: false
  version: 2026

uncompressed_file_name: "cities-municipalities.json"

columns:
  admin3_id_admin1: code
  name: name
  admin2_id_admin1: provinceCode
  _region_code: regionCode
  _is_city: isCity

keep_unnamed_columns: False

# Both codes need reshaping to meet the spine.
#
# The municipality code: the API returns the ten-digit PSGC as nine digits
# and the spine carries the historical six-digit form, which is its first
# six characters.
#
# The parent code: a city or municipality sits in a province, except in
# Metro Manila, where the 17 of them are independent and the PSGC leaves
# `provinceCode` as the JSON literal `false`. The level-2 layer beside
# this one seats those under NCR itself (see its header), so the parent
# is the province code where there is one and the region code otherwise.
# Coalescing is right where concatenating would be wrong and an outer
# join would duplicate rows: the two columns are alternatives, never
# both.
#
# Either way the spine holds the parent four digits wide with any
# leading zero dropped, so Aklan is `604` rather than `0604` and NCR is
# `1300`, and the code is truncated to four and stripped to match.
# Zero-padding the other way would be the natural instinct and would
# match nothing.
transformations:
  # The source distinguishes the two kinds of unit at this level with a
  # boolean rather than a word.
  - output: type
    input: _is_city
    type: remap
    mapping:
      true: "City"
      false: "Municipality"
  - output: admin3_id_admin1
    input: admin3_id_admin1
    type: string
    operation: substring
    args:
      start: 0
      end: 6
  # Two chartered cities belong to no province and are not in Metro
  # Manila, so the region fallback above would seat them under a region
  # that is not at level 2. Both are enclaves of a province they are
  # administratively separate from, and both are placed with that
  # province here, which is where the spine carried them and where an
  # atlas draws them. Saying so costs 2 cities and 82 barangays if
  # omitted.
  #
  # The City of Isabela is the capital of Basilan (1507) but is
  # administered with Region IX while Basilan sits in BARMM. The City of
  # Cotabato is an enclave of Maguindanao (1538); it voted to join BARMM
  # in 2019, which this PSGC vintage records only in its ten-digit code.
  #
  # Unmapped rows come out missing, which is what makes this usable as
  # the first input of the coalesce below rather than a rewrite of the
  # whole column.
  - output: _province_override
    input: admin3_id_admin1
    type: remap
    mapping:
      "099701": "150700000"
      "129804": "153800000"
  - output: admin2_id_admin1
    type: string
    operation: coalesce
    inputs:
      - _province_override
      - admin2_id_admin1
      - _region_code
    args:
      empty_values: [false]
  - output: admin2_id_admin1
    input: admin2_id_admin1
    type: string
    operation: substring
    args:
      start: 0
      end: 4
  - output: admin2_id_admin1
    input: admin2_id_admin1
    type: string
    operation: lstrip
    args:
      chars: "0"

# The province layer beside this one, not the spine. Reading the spine
# made this recipe depend on the state of a file it also feeds, which
# broke the moment the provinces themselves were replaced; the PSGC
# gives both tiers, so the chain can be self-contained.
admin_id_crosswalk:
  admin_level: 2
  admin_id_column: admin2_id_admin1
  admin_recipe_id: "PH_admin-psa-2026_admin2"

create_index:
  function: "openplaces.io.admin_codes.assign_admin_ids"
  args:
    new_admin_id_col: admin3_id
    parent_admin_id_col: admin2_id
    name_col: name

sort_index: True
