# Recipe: Forsyth County, GA parcel roll.
#
# Source: the county's ArcGIS Hub open-data site
# (`geo-forsythcoga.opendata.arcgis.com`), a bulk GeoJSON export of the
# `Public/Tax_Parcel` layer served from `geo.forsythco.com`.
#
# The richest of the Greater Atlanta county sources: land value, both
# value bases, year built, building areas, floor count, land-use code
# and description, and zoning all in one layer.
#
# CAUTION: do not confuse this county with Forsyth County, NORTH
# CAROLINA. An AGOL layer literally named `Forsyth_County_Tax_Parcels`
# (157,449 features, healthy-looking schema) is the NC county; its
# extent overlap with GA Forsyth is 0.0. Keyword search surfaces the NC
# layer and not this one. Verified by sampling: 60/60 sampled features
# of this layer fall inside GA Forsyth.
#
# NOTE on value basis. Georgia assesses at 40% of fair market value.
# CNTASSDVAL is the assessed (40%) total, while LNDVALUE reads as a
# fair-market land figure (sampled LNDVALUE 195,000 against
# CNTASSDVAL 551,880 on a ~1.38M fair-market parcel). The two are
# therefore on different bases; `value` takes the assessed total and
# `land_value` the land figure as published, unreconciled. Measure
# before relying on their ratio.
#
# FLOOR AREA. The layer follows Esri's tax-parcel schema and carries
# RESFLRAREA ("Residential Floor Area"), BLDGAREA ("Building Area")
# and FLOORCOUNT ("Number of Floors"), none with a field description.
# Measured 2026-09-13 on the bulk export (42,507 rows with both
# areas):
#   - RESFLRAREA x FLOORCOUNT / BLDGAREA has median 0.93 at two
#     floors (IQR 0.88-1.00) and 1.02 at three;
#   - RESFLRAREA falls as floors rise: SF RESIDENTIAL medians 1,910,
#     1,546 and 1,380 sqft at one, two and three floors, while
#     BLDGAREA rises (2,782, 3,302, 3,579). TOWNHOME median 846 at
#     two floors.
# RESFLRAREA therefore reads as the area of one floor, neither living
# area nor a total, and stays unmapped: as a 2D area it would be a
# footprint, which a parcel roll has no registry column for.
# BLDGAREA is the building's area on all floors and is mapped as
# gross_floor_area_sqft, with MEDIUM confidence: that it spans every
# floor is measured, but whether it counts unfinished space (garage,
# unfinished basement) is not. At one floor RESFLRAREA / BLDGAREA has
# median 0.69, so BLDGAREA holds more than that floor there, which
# fits gross area. BLDGAREA is filled on 88.8% of rows, commercial
# ones included (FLEX 99.9%, OFFICE CONDO 99.6%); RESFLRAREA on
# 41.0%. Before 2026-09-13 RESFLRAREA was mapped here instead.

description: >-
  Forsyth County, GA parcel roll (land and assessed values, year built,
  building floor area, land use, zoning, owner, situs) from the county
  open-data bulk GeoJSON export.

admin_id: US-GA-FOR

entity:
  entity_type: parcel
  source:
    source_id: forsythco
    # Checked 2026-08-20 through the ArcGIS Online item this recipe
    # downloads. Its licenseInfo is a compilation-and-accuracy notice, not
    # a licence, and accessInformation names the parties to credit: GIS
    # Department and Tax Assessment Department, Forsyth County Georgia.
    license: "unknown (attribution to Forsyth County GIS / Tax Assessment; no licence stated)"
    redistribution_restricted: null
    portal_url: "https://geo-forsythcoga.opendata.arcgis.com/datasets/tax-parcel"
    download_url: "https://geo-forsythcoga.opendata.arcgis.com/api/download/v1/items/a57125fcac534eb58c1d63325894e6e8/geojson?layers=0"
  version: "2026"

uncompressed_file_name: "forsyth_tax_parcel.geojson"

columns:
  parcel_id_assessor: PARCELID
  address: SITEADDRESS
  owner_name: CNVYNAME
  owner_address: PSTLADDRESS
  owner_city: PSTLCITY
  owner_admin2_id_admin1: PSTLSTATE
  owner_postal_code: PSTLZIP5
  land_value: LNDVALUE
  total_value: CNTASSDVAL
  year_built: RESYRBLT
  gross_floor_area_sqft: BLDGAREA
  use_group: USEDSCRP
  use_group_code: USECD
  zoning_code: ZONING
  tax_neighborhood_code: NGHBRHDCD
  tax_year: TAXYEAR

columns_to_categorical:
  - owner_admin2_id_admin1
  - use_group
  - use_group_code
  - zoning_code
  - tax_neighborhood_code

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
