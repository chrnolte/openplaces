# Recipe to import the Global Administrative Database

# Administrative unit identifier: where does this data come from?
# NULL: global
# US: United States
# US-WI: Wisconsin
# US-WI-DA: Dane county
admin_id: US-WI

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: parcel
   # What is the source and URL of a dataset that identifies each unit?
  source: 
    source_id: wiscedu
    url: "https://web.s3.wisc.edu/parcels/v11_parcels/V11.0.0_Wisconsin_Parcels_2025_10.3_Compressed.zip"
  version: v11

# Path to compressed file (set to stop re-downloading)
# compressed_file_name: "gadm_410-gpkg.zip"
# compressed_file_name: "gadm_410-levels.zip"

# Path to uncompressed file path (set to stop re-downloading)
# uncompressed_file_name: "gadm_410-levels.gpkg"  # Gigabytes

# Layer that identifies top-level administrative units
# layer: ADM_0

# Original columns and how to rename them
# columns:
  # COUNTRY: name
  # GID_0: admin0_id_a3

# Function that returns an indexed version of the input GeoDataFrame
# index_function: "openplaces.admin.index_from_admin0_id_a3"

# Internal filename
# filename: 'admin0'

# Create and save additional geometry layer with simplified coverage
# for quicker plots. Use same filename, with suffix '_simplified'.
# simplify_coverage: 0.2
