# Recipe: Wisconsin statewide parcel database, version 4 (2018), from
# UW-Madison's Statewide Parcel Map Initiative.
#
# A REFERENCE VINTAGE, not a second current parcel layer. The current
# one is US-WI_parcel-wiscedu-v11 (2025), same publisher and the same
# schema; this is the state of the same parcels seven years earlier. It
# is here for the transaction work, for one reason: values near the
# sale. A 2016 sale beside 2025 assessed values says little; this layer
# carries the 2017 tax roll on 95% of its 3,491,038 rows and the 2016
# roll on most of the rest (`TAXROLLYEAR`).
#
# It was first thought to be needed for Eau Claire County as well, whose
# returns matched it at 0.95 and the 2025 layer at 0.40. That was a
# difference in how the two versions store the City of Eau Claire's
# parcel number, not in what they know; the rule under `transformations`
# reads both, and the 2025 layer then matches at 0.938 on its own.
#
# What it does NOT do, which was the hope: recover the early returns of
# counties that "renumbered". Returns of 2014 to 2018 are found here at
# 0.746 statewide against 0.717 in the 2025 layer, so those counties did
# not renumber after 2018. Their early returns are written differently
# (see `simple_pad_last` in geo/ids.py for the three where the rule is
# known).
#
# `exclude_from_auto_discover` keeps it out of every parcel spine and
# out of the transaction spine's parcel links: two vintages of one layer
# merged by overlap would be the same parcels twice.
#
# No download_url: the file was obtained in 2019 and is placed by hand
# into this recipe's external-file folder. The publisher lists current
# and past versions on its parcel data page (portal_url).
#
# The comment in the v11 recipe that `TAXPARCELID` is "empty statewide"
# was checked in three counties only. It is populated in every row here
# and in most counties of v11, and in Bayfield, Columbia and Eau Claire
# it, not `PARCELID`, is the number the transfer returns use.

description: >-
  Wisconsin statewide parcel database, version 4 (2018): a reference
  vintage of the current layer, for values and parcel numbers near older
  sales.

admin_id: US-WI

exclude_from_auto_discover: true

entity:
  entity_type: parcel
  source:
    source_id: wiscedu
    portal_url: "https://www.sco.wisc.edu/parcels/data/"
  version: v4

compressed_file_name: "WI_Parcel_Uncompressed.zip"
uncompressed_file_name: "V4.0.1_Wisconsin_Parcels_2018_10.3_Uncompressed.gdb"

layer: V401_WisconsinParcels_2018

# Same chunking as v11: the geodatabase is too large to read whole.
process_by:
  admin_level: 3
  admin_id_column: PARCELFIPS
  admin_id_transformation:
    # 3-digit county code, prefixed with Wisconsin's FIPS code.
    output: admin3_id_admin1
    type: string
    operation: add_prefix
    args:
      prefix: "55"
  admin_id_crosswalk:
    admin_level: 3
    admin_id_column: admin3_id_admin1
    admin_recipe_id: "admin-openplaces-2026_admin3"

# The v11 mapping, minus what this version lacks (MFLVALUE).
columns:
  parcel_id_admin2: STATEID
  parcel_id_admin3: PARCELID
  parcel_id_tax: TAXPARCELID
  owner_name: OWNERNME1
  owner_name_2: OWNERNME2
  owner_address: PSTLADRESS
  address: SITEADRESS
  address_number: ADDNUM
  address_street_name: STREETNAME
  address_street_type: STREETTYPE
  address_unit_type: UNITTYPE
  address_unit: UNITID
  city: PLACENAME
  postal_code: ZIPCODE
  school_district_name: SCHOOLDIST
  school_district_id: SCHOOLDISTNO
  total_value: CNTASSDVALUE
  land_value: LNDVALUE
  improvement_value: IMPVALUE
  market_value: ESTFMKVALUE
  tax_value_net: NETPRPTA
  tax_value_gross: GRSPRPTA
  tax_year: TAXROLLYEAR
  land_area_ac: ASSDACRES
  area_deed_ac: DEEDACRES
  admin3_name: CONAME
  use_group: PROPCLASS
  source_date: LOADDATE

columns_to_categorical:
  - city
  - school_district_name
  - admin3_name

transformations:
  - type: string
    operation: concat
    inputs: [parcel_id_admin3]
    output: parcel_id_assessor

  # Eau Claire County's two assessors; see the same rule, and what it
  # was measured on, in US-WI_parcel-wiscedu-v11. This version stores
  # the city's 6-digit number bare, that one behind the prefix 221.
  - type: string
    operation: extract_named
    input: parcel_id_admin3
    args:
      pattern: '^(?:221)?(\d{6}[A-Za-z]?)$'
    output: _city_parcel_number
    admin_ids: [US-WI-EC]
  - type: aggregate
    operation: coalesce
    inputs: [_city_parcel_number, parcel_id_tax]
    output: parcel_id_assessor
    admin_ids: [US-WI-EC]

drop_columns:
  - _city_parcel_number

# The per-county rows of US_parcel_id-overrides.csv apply to this
# version as to v11 (they are keyed by source, `wiscedu`).
parcel_id_local:
  source: parcel_id_assessor
  kind: parcel
