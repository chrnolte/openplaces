# Recipe to import the parcel database of the state of Wisconsin, US

description: >-
  Wisconsin statewide parcel database (V11) from UW-Madison's Statewide Parcel Map
  Initiative.

# Administrative unit identifier: where does this data come from?
admin_id: US-WI

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: parcel
   # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: wiscedu
    # URL to download
    download_url: "https://web.s3.wisc.edu/parcels/v11_parcels/V11.0.0_Wisconsin_Parcels_2025_10.3_Uncompressed.zip"
  version: v11

# Name of compressed file (set to skip re-downloading)
compressed_file_name: "V11.0.0_Wisconsin_Parcels_2025_10.3_Uncompressed.zip"

# Name of uncompressed file (set to skip re-extracting)
uncompressed_file_name: "V11.0.0_Wisconsin_Parcels_2025_10.3_Uncompressed.gdb"

# Layer that identifies parcels
layer: V1100_WisconsinParcels_2025

# Column that splits the data into chunks for processing
# (avoids reading very large geodatabase into memory)
process_by:
  admin_level: 3
  admin_id_column: PARCELFIPS
  admin_id_transformation:
    # Get 5-digit county fips code by prefixing 3-digit code with Wisconsin's FIPS code
    output: admin3_id_admin1
    type: string
    operation: add_prefix
    args:
      prefix: "55"
  admin_id_crosswalk:
    admin_level: 3
    admin_id_column: admin3_id_admin1
    admin_recipe_id: "admin-openplaces-2026_admin3"

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  parcel_id_admin2: STATEID
  parcel_id_admin3: PARCELID
  parcel_id_tax: TAXPARCELID
  owner_name: OWNERNME1
  owner_name_2: OWNERNME2
  owner_address: PSTLADRESS
  address: SITEADRESS
  address_number: ADDNUM
  address_street_name: STREETNAME
  address_street_type: STREETTYPE
  address_unit_type: UNITTYPE
  address_unit: UNITID
  city: PLACENAME
  postal_code: ZIPCODE
  school_district_name: SCHOOLDIST
  school_district_id: SCHOOLDISTNO
  total_value: CNTASSDVALUE
  land_value: LNDVALUE
  improvement_value: IMPVALUE
  current_use_value: MFLVALUE
  market_value: ESTFMKVALUE
  tax_value_net: NETPRPTA
  tax_value_gross: GRSPRPTA
  tax_year: TAXROLLYEAR
  land_area_ac: ASSDACRES
  area_deed_ac: DEEDACRES
  admin3_name: CONAME
  use_group: PROPCLASS
  source_date: LOADDATE

# Columns to be cast to categorical (saves space)
columns_to_categorical:
  - city
  - school_district_name
  - admin3_name

# Expose the raw assessor-original parcel id under the canonical name
# parcel_id_assessor (a copy of parcel_id_admin3 -- PARCELID), so it is the
# raw key parcel_id_local derives from (consistent across parcel recipes).
# TAXPARCELID (parcel_id_tax) is empty in Dane, Oconto and Vilas, which is
# why PARCELID is the default source. It is NOT empty statewide, as this
# comment used to say: measured 2026-09-21 it is filled on 0.97 to 1.00 of
# rows in US-WI-BY, -CO, -CR, -EC, -FO and -IA, among others. In Bayfield
# and Columbia it, not PARCELID, is the number Wisconsin's transfer returns
# use; those two take it as their source through the `source` column of
# US_parcel_id-overrides.csv. Eau Claire uses it outside its city, by the
# scoped rule under `transformations`.
transformations:
  - type: string
    operation: concat
    inputs: [parcel_id_admin3]
    output: parcel_id_assessor

  # Eau Claire County has two assessors, and transfer returns name a
  # parcel by whichever one assesses it: the City of Eau Claire's own
  # 6-digit number (a letter may follow) for city parcels, the county's
  # 19-digit TAXPARCELID everywhere else. This layer stores the city
  # number in PARCELID behind the prefix 221 (45.8% of the county's
  # rows, and no other prefix occurs); version 4 stored it bare, which
  # the pattern also accepts. So `parcel_id_assessor` is the city number
  # where PARCELID has that shape and TAXPARCELID otherwise. Measured
  # 2026-09-21 on 40,930 returns of 2014 to 2026: 0.938 find their
  # parcel (0.924 for 2014 to 2016), against 0.000 on PARCELID and 0.408
  # on TAXPARCELID alone. The county's own server
  # (gis.eauclairecounty.gov, Tax_Parcel) was checked and adds nothing:
  # it holds the 28,275 parcels outside the city, with the same 19-digit
  # number.
  - type: string
    operation: extract_named
    input: parcel_id_admin3
    args:
      pattern: '^(?:221)?(\d{6}[A-Za-z]?)$'
    output: _city_parcel_number
    admin_ids: [US-WI-EC]
  - type: aggregate
    operation: coalesce
    inputs: [_city_parcel_number, parcel_id_tax]
    output: parcel_id_assessor
    admin_ids: [US-WI-EC]

drop_columns:
  - _city_parcel_number

# Standardized matching key from the tax parcel number, per county (auto
# conversion; processed per admin3). Connects to WI RETR sales transactions.
parcel_id_local:
  source: parcel_id_assessor
  kind: parcel
