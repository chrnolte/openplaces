# Patch: Florida transaction curation, grading the state's sale
# qualification codes, and the property as it was when it sold.
#
# The grading. The national recipe grades no source's vocabulary; each
# state grades its own here, right after the national grading point.
# The arm's-length confidence carries only the resolution the source
# does: Florida's 34 labels are two "Qualified arm's length" (differing
# in how qualification was established, which is provenance, not
# confidence), about 24 kinds of "Disqualified" (kinds, not degrees),
# and a small middle. So the scale is 0, 0.7 and 1, and a further
# level would have to name the label that justifies it. "Pending" and
# "Removed" are absence of evidence, not weak evidence: they are left
# missing, never a low number that survives a > 0 filter and fails a
# >= 0.5 one. This is one source's own qualification, one component of
# a consumer's arm's-length rule, and is not that rule. Until
# 2026-10-22 these maps sat in the national recipe, where any state's
# two-digit code read as Florida's.
#
# The property as it was when it sold. Florida's DOR roll (US-FL_property-fldor-2026) keeps 22 to 24 yearly
# vintages per county; no other assessor source in the tree holds more
# than one. A hedonic model wants the values and structure at the sale
# date, not today's, and where a county renumbered its parcels the panel
# is the only thing that reaches the older sales at all: six Florida
# counties renumbered (Volusia and Pasco in 2017), and 100% of their
# pre-cutover sales are in the panel, 98-100% in the roll of their own
# sale year, against 0.000 reaching the current parcel layer.
#
# A state rule, so a patch: until 2026-10-19 the two joins sat in the
# national recipe as no-ops outside Florida (`require_panel`), and the
# roll they name was then a declared input of every state's bundle,
# whose notice listed Florida's roll as a source of unrecorded terms
# (the Wisconsin bundle of 2026-10-19). `require_panel` stays, for the
# Florida counties whose roll is not ingested. When a national
# `US_property-panel-2026` exists it replaces the recipe named here.
#
# `property_match_type` is written on every row, not only matched ones,
# because a reader has to be able to tell a value taken from the sale
# year from one taken from a neighboring year, from a county with no
# panel at all. `tax_year` rides along as the vintage actually used. A
# multi-parcel deed has no single `parcel_id_assessor` since the spine's
# fold stopped picking one parcel's (2026-10-01); it reads `no_key`
# here. Reaching the panel per linked parcel is the next step for this
# join (plans/core-schema-and-stage-contracts-review.md, b4). The joins
# assign through `.loc[matched_index, column]`, which relies on the
# spine's unique `transaction_id`.

admin_id: US-FL
stage: curate

entity:
  entity_type: transaction
  source:
    source_id: openplaces
  version: 2026

patches: US_transaction-openplaces-2026
pipeline_patch:
  - insert_after: derive_indicators
    occurrence: 1
    step:
      step: derive_indicators
      indicators:
        - output: sale_arms_length_confidence
          type: value_map
          column: sale_qualification_code
          mapping:
            # Florida DOR SDF (US-FL_transaction-fldor-2026)
            "Qualified arm's length - deed/instrument examination": 1.0
            "Qualified arm's length - documented evidence": 1.0
            "Qualified but excluded - physical/legal characteristics changed after transfer": 0.7
            "Qualified but excluded - legal characteristics changed after transfer": 0.7
            "Qualified - multiple parcels with multiple parcel IDs": 0.7
            "Qualified - single parcel crossing county lines": 0.7
            "Disqualified - transfer to/from financial institution or in lieu of foreclosure": 0.0
            "Disqualified - corrective/quit claim/tax deed or minimal stamps": 0.0
            "Disqualified - cemetery lots or parcels": 0.0
            "Disqualified - reservation of occupancy over 90 days (life estate)": 0.0
            "Disqualified - conveys less than 100% undivided interest": 0.0
            "Disqualified - transfer to/from religious/charitable/benevolent entity": 0.0
            "Disqualified - transfer to/from government agency": 0.0
            "Disqualified - transfer to/from bankruptcy trustee/administrator/executor/guardian/receiver": 0.0
            "Disqualified - transfer to/from utility company": 0.0
            "Disqualified - contract or agreement for deed": 0.0
            "Disqualified - transfer between relatives or corporate affiliates": 0.0
            "Disqualified - trade or exchange of land": 0.0
            "Disqualified - abnormal time between contract and sale date": 0.0
            "Disqualified - incomplete or unbuilt common property": 0.0
            "Disqualified - satisfied payment in full of prior property contract": 0.0
            "Disqualified - atypical amounts of personal property": 0.0
            "Disqualified - atypical costs of sale": 0.0
            "Disqualified - atypical market exposure or motivation/knowledge of participants": 0.0
            "Disqualified - forced transfer or under duress": 0.0
            "Disqualified - consideration differs from documentary stamps": 0.0
            "Disqualified - significantly influenced by non-market financing or lease assumption": 0.0
            "Disqualified - other (duplicate recordings, rehabbed sales; requires DOR approval)": 0.0
            "Disqualified - mortgage fraud per law enforcement notification": 0.0
            "Disqualified - allocated price as part of a package or bulk transaction": 0.0
            # The same state codes, undecoded. Assessor last-sale
            # rows read from the statewide parcel layer
            # (US-FL_parcel-floridagio-2026) carry the two-digit
            # code, not its label: measured 2026-09-21, none of
            # `US-FL-MI`'s 1,401 last-sale rows was graded while
            # 99.7% of its deeds were. Generated from the labels
            # above through the state's code table, so the two
            # spellings cannot disagree. That recipe now ships the
            # label table and decodes at its next ingest; these keys
            # can go once every county has been re-ingested.
            "01": 1.0
            "02": 1.0
            "03": 0.7
            "04": 0.7
            "05": 0.7
            "06": 0.7
            "11": 0.0
            "12": 0.0
            "13": 0.0
            "14": 0.0
            "16": 0.0
            "17": 0.0
            "18": 0.0
            "19": 0.0
            "20": 0.0
            "21": 0.0
            "30": 0.0
            "31": 0.0
            "32": 0.0
            "33": 0.0
            "34": 0.0
            "35": 0.0
            "36": 0.0
            "37": 0.0
            "38": 0.0
            "39": 0.0
            "40": 0.0
            "41": 0.0
            "42": 0.0
            "43": 0.0
        # The two 0.7 groups are different problems a consumer
        # treats differently: a parcel that changed between
        # assessment and sale is a target problem, a deed covering
        # several parcels an area problem the parcel gathers of the national recipe solve
        # (they sum over every parcel the deed covered). The group
        # carries that distinction the scale cannot; pending and
        # removed are named here so a consumer can see why the
        # confidence is missing.
        - output: sale_qualification_group
          type: value_map
          column: sale_qualification_code
          mapping:
            "Qualified arm's length - deed/instrument examination": qualified
            "Qualified arm's length - documented evidence": qualified
            "Qualified but excluded - physical/legal characteristics changed after transfer": qualified_parcel_changed
            "Qualified but excluded - legal characteristics changed after transfer": qualified_parcel_changed
            "Qualified - multiple parcels with multiple parcel IDs": qualified_multi_parcel
            "Qualified - single parcel crossing county lines": qualified_multi_parcel
            "Pending - recorded/discovered in previous 90 days, qualification decision pending": pending
            "Pending - unable to process because of transfer instrument errors": pending
            "Removed - not currently accepted": removed
            # Listed rather than defaulted, so a row with no code at all
            # stays missing instead of reading as disqualified.
            "Disqualified - transfer to/from financial institution or in lieu of foreclosure": disqualified
            "Disqualified - corrective/quit claim/tax deed or minimal stamps": disqualified
            "Disqualified - cemetery lots or parcels": disqualified
            "Disqualified - reservation of occupancy over 90 days (life estate)": disqualified
            "Disqualified - conveys less than 100% undivided interest": disqualified
            "Disqualified - transfer to/from religious/charitable/benevolent entity": disqualified
            "Disqualified - transfer to/from government agency": disqualified
            "Disqualified - transfer to/from bankruptcy trustee/administrator/executor/guardian/receiver": disqualified
            "Disqualified - transfer to/from utility company": disqualified
            "Disqualified - contract or agreement for deed": disqualified
            # Its own group, not 'disqualified': it is the state's
            # record that the parties are related (family or
            # affiliated companies; the code does not say which), the
            # counterpart of Wisconsin's `related_parties_*` groups
            # (US-WI patch).
            "Disqualified - transfer between relatives or corporate affiliates": related_parties
            "Disqualified - trade or exchange of land": disqualified
            "Disqualified - abnormal time between contract and sale date": disqualified
            "Disqualified - incomplete or unbuilt common property": disqualified
            "Disqualified - satisfied payment in full of prior property contract": disqualified
            "Disqualified - atypical amounts of personal property": disqualified
            "Disqualified - atypical costs of sale": disqualified
            "Disqualified - atypical market exposure or motivation/knowledge of participants": disqualified
            "Disqualified - forced transfer or under duress": disqualified
            "Disqualified - consideration differs from documentary stamps": disqualified
            "Disqualified - significantly influenced by non-market financing or lease assumption": disqualified
            "Disqualified - other (duplicate recordings, rehabbed sales; requires DOR approval)": disqualified
            "Disqualified - mortgage fraud per law enforcement notification": disqualified
            "Disqualified - allocated price as part of a package or bulk transaction": disqualified
            # The undecoded state codes; see the confidence map above.
            "01": qualified
            "02": qualified
            "03": qualified_parcel_changed
            "04": qualified_parcel_changed
            "05": qualified_multi_parcel
            "06": qualified_multi_parcel
            "11": disqualified
            "12": disqualified
            "13": disqualified
            "14": disqualified
            "15": removed
            "16": disqualified
            "17": disqualified
            "18": disqualified
            "19": disqualified
            "20": disqualified
            "21": disqualified
            "30": related_parties
            "31": disqualified
            "32": disqualified
            "33": disqualified
            "34": disqualified
            "35": disqualified
            "36": disqualified
            "37": disqualified
            "38": disqualified
            "39": disqualified
            "40": disqualified
            "41": disqualified
            "42": disqualified
            "43": disqualified
            "98": pending
            "99": pending
  - insert_before: keep_registered_columns
    step:
      step: join_temporal_snapshot
      phase_override: >-
        a gather that needs sale_year from derive_sale_period and the
        folded deed rows from aggregate_multi_parcel_sales
      recipe_id: US-FL_property-fldor-2026
      require_panel: true
      # Two stated keys, in order, each compared exactly. First the DOR's
      # statewide STATE_PAR_ID (`parcel_id_admin2`), which the roll and
      # the sales file both state on every row and no county
      # renumbering changed: it reaches the sales of Duval, Hillsborough,
      # Charlotte and Escambia across a change no conversion of the
      # county number reproduces (the maintainer's option ii,
      # 2026-10-24: join on what both sides state, fill nothing). Then
      # the minted county key, which both sides mint by one rule per
      # county and era (the id-overrides tables), for a row the first
      # key is missing on.
      join_key: [parcel_id_admin2, parcel_id_local]
      normalize_key: false
      date_column: sale_year
      vintage_column: tax_year
      direction: backward
      prefix: at_sale_
      match_type_column: property_match_type
      # Each at-sale value says where it came from: `fldor` where the
      # roll of the sale's own year supplied it, `fldor+imputed` where a
      # neighboring year's roll did (the maintainer's decision of
      # 2026-10-24: keep the fallbacks, marked).
      source_token: fldor
      columns: [tax_year, year_built, living_area_sqft, land_area_sqft,
                market_value, land_value, n_dwellings, n_buildings]
  # A sale before the roll's first vintage has no earlier year to take;
  # the nearest later one is the only evidence there is. Restricted to
  # sales already improved at the time, so a bare lot cannot inherit the
  # house that was built on it afterwards, and marked as a forward
  # fallback so the difference is legible. `mark_unmatched` closes the
  # column: after this pass, an empty value would be indistinguishable
  # from a county the step skipped.
  - insert_before: keep_registered_columns
    step:
      step: join_temporal_snapshot
      phase_override: the forward pass of the gather above, same reason
      recipe_id: US-FL_property-fldor-2026
      require_panel: true
      join_key: [parcel_id_admin2, parcel_id_local]
      normalize_key: false
      date_column: sale_year
      vintage_column: tax_year
      direction: forward
      only_unmatched: true
      restrict_to: {column: sale_vacant, equals: "Improved property"}
      prefix: at_sale_
      match_type_column: property_match_type
      mark_unmatched: not_in_panel
      source_token: fldor
      columns: [tax_year, year_built, living_area_sqft, land_area_sqft,
                market_value, land_value, n_dwellings, n_buildings]
