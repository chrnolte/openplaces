# Patch: Florida transaction curation, the property as it was when it sold.
#
# Florida's DOR roll (US-FL_property-fldor-2026) keeps 22 to 24 yearly
# vintages per county; no other assessor source in the tree holds more
# than one. A hedonic model wants the values and structure at the sale
# date, not today's, and where a county renumbered its parcels the panel
# is the only thing that reaches the older sales at all: six Florida
# counties renumbered (Volusia and Pasco in 2017), and 100% of their
# pre-cutover sales are in the panel, 98-100% in the roll of their own
# sale year, against 0.000 reaching the current parcel layer.
#
# A state rule, so a patch: until 2026-10-19 the two joins sat in the
# national recipe as no-ops outside Florida (`require_panel`), and the
# roll they name was then a declared input of every state's bundle,
# whose notice listed Florida's roll as a source of unrecorded terms
# (the Wisconsin bundle of 2026-10-19). `require_panel` stays, for the
# Florida counties whose roll is not ingested. When a national
# `US_property-panel-2026` exists it replaces the recipe named here.
#
# `property_match_type` is written on every row, not only matched ones,
# because a reader has to be able to tell a value taken from the sale
# year from one taken from a neighboring year, from a county with no
# panel at all. `tax_year` rides along as the vintage actually used. A
# multi-parcel deed has no single `parcel_id_assessor` since the spine's
# fold stopped picking one parcel's (2026-10-01); it reads `no_key`
# here. Reaching the panel per linked parcel is the next step for this
# join (plans/core-schema-and-stage-contracts-review.md, b4). The joins
# assign through `.loc[matched_index, column]`, which relies on the
# spine's unique `transaction_id`.

admin_id: US-FL
stage: curate

entity:
  entity_type: transaction
  source:
    source_id: openplaces
  version: 2026

patches: US_transaction-openplaces-2026
pipeline_patch:
  - insert_before: keep_registered_columns
    step:
      step: join_temporal_snapshot
      phase_override: >-
        a gather that needs sale_year from derive_sale_period and the
        folded deed rows from aggregate_multi_parcel_sales
      recipe_id: US-FL_property-fldor-2026
      require_panel: true
      join_key: parcel_id_assessor
      date_column: sale_year
      vintage_column: tax_year
      direction: backward
      prefix: at_sale_
      match_type_column: property_match_type
      columns: [tax_year, year_built, living_area_sqft, land_area_sqft,
                market_value, land_value, n_dwellings, n_buildings]
  # A sale before the roll's first vintage has no earlier year to take;
  # the nearest later one is the only evidence there is. Restricted to
  # sales already improved at the time, so a bare lot cannot inherit the
  # house that was built on it afterwards, and marked as a forward
  # fallback so the difference is legible. `mark_unmatched` closes the
  # column: after this pass, an empty value would be indistinguishable
  # from a county the step skipped.
  - insert_before: keep_registered_columns
    step:
      step: join_temporal_snapshot
      phase_override: the forward pass of the gather above, same reason
      recipe_id: US-FL_property-fldor-2026
      require_panel: true
      join_key: parcel_id_assessor
      date_column: sale_year
      vintage_column: tax_year
      direction: forward
      only_unmatched: true
      restrict_to: {column: sale_vacant, equals: "Improved property"}
      prefix: at_sale_
      match_type_column: property_match_type
      mark_unmatched: not_in_panel
      columns: [tax_year, year_built, living_area_sqft, land_area_sqft,
                market_value, land_value, n_dwellings, n_buildings]
