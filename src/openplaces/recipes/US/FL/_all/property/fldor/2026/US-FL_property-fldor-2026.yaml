# Columns to be cast to categorical (saves space)
columns_to_categorical:
  - roll_type
  - tax_use_group
  - tax_use_subgroup
  - use_group_code
  - use_group_admin3
  - tax_special_assessment
  - market_value_change_code
  - land_unit_code
  - structure_quality_code
  - construction_class
  - last_sale_multi_parcel
  - last_sale_qualification_code
  - last_sale_vacant
  - last_sale_change_code
  - last_sale_2_multi_parcel
  - last_sale_2_qualification_code
  - last_sale_2_vacant
  - last_sale_2_change_code
  - owner_admin2_id_admin1
  - owner_admin2_id_admin1_domicile
  - owner_public_code
  - disaster_code
  - homestead_transfer_flag
  - tax_authority

# Standardized cross-comparable matching key from the raw DOR parcel id --
# links to floridagio's parcel geometry (same DOR PARCEL_ID system) and to
# FL transaction sources.
parcel_id_local:
  source: parcel_id_assessor
  kind: parcel
