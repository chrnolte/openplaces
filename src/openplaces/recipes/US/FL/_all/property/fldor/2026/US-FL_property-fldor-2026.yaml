  market_value_non_homestead_residential: JV_NON_HMSTD_RESD
  assessed_value_non_homestead_residential: AV_NON_HMSTD_RESD
  market_value_residential_and_non_residential: JV_RESD_NON_RESD
  assessed_value_residential_and_non_residential: AV_RESD_NON_RESD
  market_value_classified_use: JV_CLASS_USE
