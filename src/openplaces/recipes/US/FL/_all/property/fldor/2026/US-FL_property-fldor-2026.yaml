# Recipe to import the Florida Department of Revenue's NAL assessment roll

description: >-
  Florida Department of Revenue Name-Address-Legal (NAL) assessment roll,
  the state's raw annual property tax roll extract (2026 schema vintage).

# Administrative unit identifier: where does this data come from?
admin_id: US-FL

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: property
  # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: fldor
    portal_url: "https://floridarevenue.com/property/Pages/DataPortal_RequestAssessmentRollGISData.aspx"
    # No download_url: historical NAL files are obtained by request, not
    # from a stable public URL. Place `{year}F.zip` into this recipe's
    # external-file cache manually; a year without a local file is skipped
    # with a warning rather than raising (see `download_by`).
  version: 2026

# One download partition per year. Each partition is a single statewide zip
# containing all 67 counties' files, already split one CSV per county.
download_by:
  partition: year
  first: 2002
  last: 2026

compressed_file_name: "{year}F.zip"
# The zip's single common top-level folder (e.g. "2025F/") is stripped on
# extraction (see io.unzip's strip-prefix behavior). Some year zips are
# partial (2008 ships 43 of 67 counties, without Alachua), so the
# "already unzipped" signal is Leon (CO_NO 47), present in every year
# roll published so far. A doubly-nested year (2007) keeps one folder
# level after the strip; the ingester falls back to a recursive
# search when this flat path is absent, and the file_pattern below
# absorbs the extra level with its **/.
uncompressed_file_name: "NAL_{year}_47Leon_F.csv"

# Each county already has its own file inside the shared unzip, so it's
# resolved per admin unit by file_pattern instead of splitting one file by
# an in-data admin_id_column. `{partition_id}` is the current download
# partition's id (the year); `{admin3_id_admin2}` is this admin unit's raw
# code, looked up from admin_id_crosswalk (matches the crosswalk's own
# value-column name -- see TableIngester._resolve_file_pattern_path). The
# trailing `*` absorbs the county name spelling in the real filename
# (e.g. `NAL_2025_11Alachua_F.csv`).
process_by:
  admin_level: 3
  file_pattern: "**/NAL_{partition_id}_{admin3_id_admin2}*_F.csv"
  # The leading **/ spans both heap layouts: 2002-2006 zips
  # extract their CSVs at the heap root, 2007+ inside a
  # per-year folder (2007F/...).
  # A county can be absent from one year's roll entirely (Lake is
  # missing from 2017; 2008 ships 43 counties): skip that chunk
  # rather than failing the whole ingest.
  file_pattern_missing: skip
  admin_id_crosswalk:
    # Reuse floridagio's existing CO_NO -> admin3_id crosswalk: same DOR
    # county-numbering system (verified 11 = Alachua in both sources).
    recipe_id: "US-FL_parcel-floridagio-2026_admin3-crosswalk"

# Columns from `openplaces` dictionary for entity -> columns in imported table
# Identifier columns read as text: clerk instrument numbers and
# book/page references are identifiers, and some counties issue
# instrument numbers too large for int64 (pyarrow overflows at
# parquet write when pandas has upcast them to Python ints).
csv_dtype:
  PARCEL_ID: str
  OR_BOOK1: str
  OR_PAGE1: str
  CLERK_NO1: str
  OR_BOOK2: str
  OR_PAGE2: str
  CLERK_NO2: str
  CENSUS_BK: str
  PARCEL_ID_PRV_HMSTD: str
  MP_ID: str
  STATE_PAR_ID: str

