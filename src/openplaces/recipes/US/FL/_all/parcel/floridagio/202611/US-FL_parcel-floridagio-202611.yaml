# Recipe to import the parcel database of the state of Florida, US:
# the release of 2026-11-16.
#
# The May 2026 release stays in US-FL_parcel-floridagio-2026, unchanged;
# this recipe is the November release beside it (the maintainer's
# decision). The version token 202611 follows
# US_landcover-annual-lcms-202410.
#
# Not yet read by any consumer. Every consumer keeps reading the May
# release until the maintainer switches them, and `held: true` below is
# what keeps them there. 202611 ranks above 2026 (version_sort_key),
# and every resolver that picks a parcel recipe for a Florida unit
# takes the newest version: the spine unions and link_by_id discovery,
# but also the single-reference resolvers (find_reference_recipe_id,
# find_entity_recipe_id), which do not read
# `exclude_from_auto_discover`.
# Measured 2026-11-17 on US-FL: on the state and its 67 counties with
# that key alone, the footprint geospine
# (link_to_reference, consolidate_condo_cluster_footprints,
# infer_spine_additions), the building geospine
# (split_outlines_at_parcel_lines), the building spine
# (classify_footprint_priority, reconcile_attributes),
# US_building-openplaces-2026 and US_footprint-cheer-2026
# (collect_link_ids) all moved to this recipe in every unit. `held`
# is read by all of those paths (core.held_recipes). It is a vintage
# hold here, not a terms hold: the source's terms are those of the May
# release. Targeting this recipe by id still ingests it. Removing the
# key is the switch.
#
# Differences from the May release (US-FL_parcel-floridagio-2026): the
# zip unpacks to Cadastral_Statewide.gdb, not CADASTRAL_DOR.gdb.
# Checked 2026-11-18 with pyogrio on both zips: one layer,
# CADASTRAL_DOR, with the same 120 fields in each release. The
# sale-change fields are S_CHNG_CD1 and S_CHNG_CD2 in both (the DOR
# roll CSV calls them SAL_CHNG_CD1 and SAL_CHNG_CD2).
#
# The download URL serves only the current release, under the same
# name for every release. The zip is therefore saved under a name that
# carries the release date, the name the cluster already holds it by,
# so the release a file contains is legible from its name. Each version
# also has its own external and heap folder (.../floridagio/202611/),
# so the two releases cannot overwrite each other. A copy of the zip
# kept beside the May one (in .../floridagio/2026/) has to be moved
# into .../floridagio/202611/ to be found.
#
# Sidecars beside this file are copies of the May release's, under this
# recipe's id, because the loader finds them by recipe id: the admin3
# crosswalk (named below), the use-group remap (link discovery, by
# prefix) and the two last-sale label tables (ingest, by column name).
# The DOR use codes and sale codes are statewide vocabularies; whether
# the November release adds a code is not yet checked.

description: >-
  Florida statewide parcel database from the Florida Geographic Information Office
  (release of 2026-11-16).

# Administrative unit identifier: where does this data come from?
admin_id: US-FL

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: parcel
   # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: floridagio
    portal_url: "https://geodata.floridagio.gov/datasets/efa909d6b1c841d298b0a649e7f71cf2_0/explore"
    # URL to download (takes a while: about 10 GB). It always serves
    # the current release.
    download_url: "https://publicfiles.dep.state.fl.us/otis/gis/data/Cadastral_Statewide.zip"
  version: "202611"

# Kept out of every discovery path until the maintainer moves consumers
# from the May release to this one (see the header).
held: true

# Name of compressed file (set to skip re-downloading), dated by release
compressed_file_name: "Cadastral_Statewide_release-2026-11-16.zip"

# Name of uncompressed file (set to skip re-extracting)
uncompressed_file_name: "Cadastral_Statewide.gdb"

# Layer that identifies parcels (unverified for this release, see the
# header)
layer: CADASTRAL_DOR

# Standardized, locally cross-comparable parcel matching key parcel_id_local
# derives from (consistent across parcel recipes).
parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

# Column that splits the data into chunks for processing
# (avoids reading very large geodatabase into memory)
process_by:
  admin_level: 3
  admin_id_column: CO_NO
  admin_id_crosswalk:
    recipe_id: "US-FL_parcel-floridagio-202611_admin3-crosswalk"

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  parcel_id_admin2: STATE_PAR_
  parcel_id_admin2_2: MP_ID
  parcel_id_admin3_2: ALT_KEY
  parcel_id_assessor: PARCEL_ID
  address: PHY_ADDR1
  address2: PHY_ADDR2
  city: PHY_CITY
  postal_code: PHY_ZIPCD
  legal_description: S_LEGAL
  census_block_id: CENSUS_BK
  land_area_sqft: LND_SQFOOT
  n_buildings: NO_BULDNG
  structure_quality_code: IMP_QUAL
  construction_class: CONST_CLAS
  effective_year_built: EFF_YR_BLT
  year_built: ACT_YR_BLT
  living_area_sqft: TOT_LVG_AR
  n_dwellings: NO_RES_UNT
  use_group_code: DOR_UC
  use_group_admin3: PA_UC
  land_unit_code: LND_UNTS_C
  n_land_units: NO_LND_UNT
  last_inspection_date: DT_LAST_IN
  disaster_code: DISTR_CD
  disaster_year: DISTR_YR
  owner_name: OWN_NAME
  owner_address: OWN_ADDR1
  owner_address2: OWN_ADDR2
  owner_city: OWN_CITY
  owner_admin2_id_admin1: OWN_STATE
  owner_postal_code: OWN_ZIPCD
  owner_admin2_id_admin1_domicile: OWN_STATE_
  owner_public_code: PUBLIC_LND
  tax_use_group: BAS_STRT
  tax_use_subgroup: ATV_STRT
  tax_market_area: MKT_AR
  tax_neighborhood_code: NBRHD_CD
  tax_special_assessment: SPASS_CD
  tax_year: ASMNT_YR
  tax_authority: TAX_AUTH_C
  value_group: GRP_NO
  market_value: JV
  market_value_change: JV_CHNG
  market_value_change_code: JV_CHNG_CD
  assessed_value_school_district: AV_SD
  assessed_value_non_school_district: AV_NSD
  tax_value_school_district: TV_SD
  tax_value_non_school_district: TV_NSD
  new_construction_value: NCONST_VAL
  land_value: LND_VAL
  special_feature_value: SPEC_FEAT_
  last_sale_multi_parcel: M_PAR_SAL1
  last_sale_qualification_code: QUAL_CD1
  last_sale_vacant: VI_CD1
  last_sale_price: SALE_PRC1
  last_sale_year: SALE_YR1
  last_sale_month: SALE_MO1
  last_sale_book: OR_BOOK1
  last_sale_page: OR_PAGE1
  last_sale_clerk_instrument: CLERK_NO1
  last_sale_change_code: S_CHNG_CD1
  last_sale_2_multi_parcel: M_PAR_SAL2
  last_sale_2_qualification_code: QUAL_CD2
  last_sale_2_vacant: VI_CD2
  last_sale_2_price: SALE_PRC2
  last_sale_2_year: SALE_YR2
  last_sale_2_month: SALE_MO2
  last_sale_2_book: OR_BOOK2
  last_sale_2_page: OR_PAGE2
  last_sale_2_clerk_instrument: CLERK_NO2
  last_sale_2_change_code: S_CHNG_CD2

transformations:
  # Florida DOR's assessment-roll edit guide (2026) defines the calculated
  # Improvement Value as Just Value - Land Value - Special Features Value;
  # Cadastral_Statewide has no direct improvement-value field of its own.
  - output: improvement_value
    type: expression
    expression: "market_value - land_value - special_feature_value"
    inputs: [market_value, land_value, special_feature_value]
  # The two ZIP fields are numeric in the geodatabase, so they read as
  # floats and 0 stands for "no ZIP". A ZIP is a code: 0 becomes
  # missing, and the number is written as text, padded to the five
  # digits a numeric field cannot keep (owners' ZIPs in the Northeast
  # start with 0). Left as floats, address assembly rendered 32801.0
  # as '328010'.
  - {type: unary, operation: null_if_equal, input: postal_code,
     args: {value: 0}, output: postal_code}
  - {type: string, operation: zfill, input: postal_code,
     args: {width: 5}, output: postal_code}
  - {type: unary, operation: null_if_equal, input: owner_postal_code,
     args: {value: 0}, output: owner_postal_code}
  - {type: string, operation: zfill, input: owner_postal_code,
     args: {width: 5}, output: owner_postal_code}
