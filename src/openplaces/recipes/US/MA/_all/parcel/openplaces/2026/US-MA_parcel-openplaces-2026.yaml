# Patch: Massachusetts parcel curation.
#
# 1. The occupancy group of a parcel (group_parcel) comes from a fixed
# table of the state's property type codes, written from the code
# definitions (US_parcel-openplaces-2026_group-parcel-ma.csv), not from
# the cohort fill the national recipe uses (the most common NSI group
# among parcels sharing a use label). That fill classed public housing
# as schools and city lots as Multi-Family (Malden's exempt cohort).
# A code the table does not name leaves the group empty. Boston's own
# code list has its own table (US-MA-BOS patch).
#
# 2. No land-use class on street, rail and water polygons that have no
# roll record. MassGIS's tax-parcel layer includes polygons that are not
# tax lots (POLY_TYPE ROW, PRIV_ROW, RAIL_ROW, WATER). Without a roll
# record, reconcile_land_use gave them the class of whatever FEMA or NSI
# footprint reached 10 m2 into them, so street networks and reservoirs
# read Single-Family or Multi-Family (Winchester's 210 ha ROW polygon).
# Measured 2026-10-17 on boston-inner-core and boston-outer-rings: the
# rule blanks 492 classes, 281 of them residential, among them 92 of the
# 94 lots over 20 ha with a residential class and no value. The rows and
# their evidence columns are kept. A polygon of these types that has a
# roll record keeps its class. FEE lots without a roll record are not
# covered here.
#
# 3. Parcels carry the protected open space class. Adds the MassGIS
# OpenSpace evidence (US-MA_parcel_rules-openspace-massgis-2026) to the
# national parcel curate's evidence merge. A state rule because the
# layer covers Massachusetts only; the national recipe stays
# source-agnostic, and its share list names the two canonical columns,
# which other states' deliveries carry empty. Approved by the
# maintainer on 2026-10-17 for the value viewer
# (plans/middlesex-fells-lot-values-findings.md). The columns are
# evidence: no vote, imputation or value step reads them.
# merge_enrichments fills only empty cells.
#
# 4. No land-use class on protected open space that has no roll record.
# A FEE polygon with no roll record (state forest, conservation or
# water-supply land) also took the class of whatever FEMA or NSI
# building reached into it, so a 185 ha reservation read Multi-Family.
# The class is blanked where the lot has no roll record and at least
# half of it is protected open space (MassGIS OpenSpace, item 3, which
# merge_enrichments brings in before the land-use vote; this step runs
# after it). Measured 2026-10-18 on US-MA: 8 lots, 231 ha (6
# Single-Family, 2 Multi-Family; all FEE, all protected in perpetuity).
# The roll test is what keeps houses: 1,132 lots with a roll record and
# a home class lie at least half on protected open space (houses under
# conservation restrictions), and keep their class. The rows and their
# evidence columns are kept.

admin_id: US-MA
stage: curate

entity:
  entity_type: parcel
  source:
    source_id: openplaces
  version: 2026

patches: US_parcel-openplaces-2026
pipeline_patch:
  - replace: impute_from_group_statistic
    step:
      step: translate_descriptions
      output: group_parcel
      columns: [use_group_code]
      keywords: group-parcel-ma
      fill_only: false
  - insert_after: reconcile_land_use
    step:
      step: suppress_where
      phase_override: >-
        the polygon type and the roll's absence decide only after the
        land-use vote has filled the class
      column: [land_use_class]
      indicators:
        - type: in_set
          column: polygon_type
          values: [ROW, WATER, RAIL_ROW, PRIV_ROW]
        - type: in_set
          column: property_source
          values: [none, estimated]
  - insert_after: reconcile_land_use
    step:
      step: suppress_where
      phase_override: >-
        the open space share and the roll's absence decide only after the
        land-use vote has filled the class
      column: [land_use_class]
      indicators:
        - type: numeric_at_least
          column: protected_open_space_share
          min: 0.5
        - type: in_set
          column: property_source
          values: [none, estimated]
  - extend: merge_enrichments
    key: recipes
    values:
      - recipe_id: US-MA_parcel_rules-openspace-massgis-2026
        columns:
          protected_open_space_share_massgis: protected_open_space_share
          protected_open_space_id_massgis: protected_open_space_id
          protected_open_space_site_massgis: protected_open_space_site
          protected_open_space_level_massgis: protected_open_space_level
          protected_open_space_owner_type_massgis: protected_open_space_owner_type
          protected_open_space_purpose_massgis: protected_open_space_purpose
          protected_open_space_public_access_massgis: protected_open_space_public_access
