# Recipe to import the Global Administrative Database

# Administrative unit identifier: where does this data come from?
# NULL: global
# US: United States
# US-WI: Wisconsin
# US-WI-DA: Dane county
admin_id: US-MA

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: parcel
  # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: massgis
    download_url: "https://www.mass.gov/forms/massgis-request-statewide-parcel-data"
  version: 2025

# Filename of compressed file (set to skip re-downloading)
compressed_file_name: "MassGIS_L3_Parcels_gdb.zip"

# Path to uncompressed file path (set to skip re-extracting)
uncompressed_file_name: "MassGIS_L3_Parcels.gdb"

# Layer that identifies parcels
layer: L3_TAXPAR_POLY

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  parcel_id_admin1: LOC_ID
  parcel_id_admin3: MAP_PAR_ID
  source_date: LAST_EDIT
  admin3_id_source: TOWN_ID

# Keep columns that aren't named in the above list
keep_unnamed_columns: True

# Crosswalk (CSV file) from local to `openplaces` admin unit identifiers
admin_id_crosswalk: US-MA_admin3_id_crosswalk_massgis

# Additional layers to import, from the same dataset, but might be for
# a different entity (e.g., property table inside a parcel database)
additional_layers:
  - name: L3_ASSESS
    entity_type: property
    columns:
      property_id_assessor: PROP_ID
      property_id_admin1: MA_PROP_ID
      parcel_id_admin1: LOC_ID
      parcel_id_admin3: MAP_PAR_ID
      street: SITE_ADDR
      city: CITY
      zip: ZIP
      building_value: BLDG_VAL
      land_value: LAND_VAL
      other_value: OTHER_VAL
      total_value: TOTAL_VAL
      assessment_year: FY
      owner_name: OWNER1
      owner_street: OWN_ADDR
      owner_city: OWN_CITY
      owner_state: OWN_STATE
      owner_zip: OWN_ZIP
      lot_size: LOT_SIZE
      lot_size_units: LOT_UNITS
      building_area_m2: BLD_AREA
      residential_area_m2: RES_AREA
      building_style: STYLE
      building_n_units: UNITS
      building_n_rooms: NUM_ROOMS
      year_built: YEAR_BUILT
      usecode: USE_CODE
      zoning: ZONING
      last_sale_date: LS_DATE
      last_sale_price: LS_PRICE
      last_sale_book: LS_BOOK
      last_sale_page: LS_PAGE
      admin3_id_source: TOWN_ID
    keep_unnamed_columns: True
    admin_id_crosswalk: parcel-massgis-town-crosswalk

# Column used to split up dataset
cache_by: admin2_id