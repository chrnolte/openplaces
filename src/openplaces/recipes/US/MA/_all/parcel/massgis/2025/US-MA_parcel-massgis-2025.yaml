# Recipe to import MassGIS standardized parcels and assessments

description: >-
  MassGIS standardized parcels for Massachusetts with linked property assessment records
  (2025).

# Administrative unit identifier: where does this data come from?
admin_id: US-MA

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: parcel
  # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: massgis
    portal_url: "https://www.mass.gov/forms/massgis-request-statewide-parcel-data"
    # MassGIS FAQ (read 2026-10-15 via its Wayback copy of 2026-04-20;
    # mass.gov answers 403 to scripted requests): "the data are in the
    # public domain and therefore can be used by anyone for any
    # purpose." The layer's ArcGIS item
    # (73d4c766167848b795f1048cad3919c7) adds that assessor mapping
    # "is a representation of property boundaries, not an
    # authoritative source."
    license: >-
      Public domain (MassGIS FAQ). Credit requested: "MassGIS (Bureau of
      Geographic Information), Commonwealth of Massachusetts EOTSS".
      Parcel boundaries are not an authoritative boundary record.
    terms_url: "https://www.mass.gov/info-details/massgis-frequently-asked-questions"
    redistribution_restricted: false
    resale_restricted: false
  version: 2025

# Name of compressed file (set to skip re-downloading)
compressed_file_name: "MassGIS_L3_Parcels_gdb.zip"

# Name of uncompressed file (set to skip re-extracting)
uncompressed_file_name: "MassGIS_L3_Parcels.gdb"

# Layer that identifies parcels
layer: L3_TAXPAR_POLY

# Column that splits the data into chunks for processing
# (avoids reading very large geodatabase into memory)
process_by:
  admin_level: 3
  admin_id_column: TOWN_ID
  admin_id_crosswalk:
    recipe_id: "US-MA_parcel-massgis-2025_admin3-crosswalk"

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  parcel_id_admin2: LOC_ID
  parcel_id_assessor: MAP_PAR_ID
  admin3_id_source: TOWN_ID
  source_date: LAST_EDIT
  polygon_type: POLY_TYPE

# Columns to be cast to categorical (saves space)
columns_to_categorical:
  - polygon_type

# Standardized matching key from the MassGIS map-parcel id
# (parcel_id_assessor maps MAP_PAR_ID directly above; a stale
# transformation that rebuilt it from a column no mapping produced was
# removed with the towns-to-admin3 migration). Processed per town.
parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

# Save one file per county (aggregated from town-level processing chunks)
save_to:
  admin_level: 3

# Additional layers to import from the same dataset for a different entity
# (e.g., property table inside a parcel database)
additional_layers:
  - layer: L3_ASSESS
    entity:
      entity_type: property
      source:
        source_id: massgis
      version: 2025
    # Within-source join key: both this layer and the primary parcel entity
    # map LOC_ID to parcel_id_admin2, so a harmonizer that links this layer
    # to the spine should join on that column rather than parcel_id_local
    # (reserved for matching against a genuinely different source).
    layer_key: parcel_id_admin2
    columns:
      property_id_assessor: PROP_ID
      property_id_admin2: MA_PROP_ID
      property_id_cama: CAMA_ID
      parcel_id_admin2: LOC_ID
      parcel_id_assessor: MAP_PAR_ID
      address: SITE_ADDR
      city: CITY
      zip: ZIP
      improvement_value: BLDG_VAL
      land_value: LAND_VAL
      other_value: OTHER_VAL
      total_value: TOTAL_VAL
      assessment_year: FY
      owner_name: OWNER1
      owner_address: OWN_ADDR
      owner_city: OWN_CITY
      owner_admin2_id_admin1: OWN_STATE
      owner_postal_code: OWN_ZIP
      land_area_sqft: LOT_SIZE
      land_area_units: LOT_UNITS
      # BLD_AREA is gross building area and RES_AREA residential living
      # area, both in square feet (residential medians 2,630 and 1,713;
      # RES_AREA <= BLD_AREA on 97.4% of residential rows carrying
      # both). They were mapped to building_area_m2 and
      # residential_area_m2 before: outside the registry, and wrong on
      # the unit. Zeros are kept as published. Measured 2026-09-13 on
      # the 2025 layer, in memory (the table recipe's reader and
      # _preprocess_recipe_data): on residential rows (use codes
      # 101-105, 109, 111, 112) living area > 0 on 98.3%, gross area
      # on 85.4%. About half the gross-area zeros are Boston's, where
      # BLD_AREA is 0 on 96.7% of residential rows; the Boston city
      # recipe supplies it. L3 carries no other building feature (no
      # condition, heating, cooling, garage, basement or amenity
      # field); the city recipes under US/MA/{BOS,CAM,ARL,SOM,FAR}
      # add them for their towns.
      gross_floor_area_sqft: BLD_AREA
      living_area_sqft: RES_AREA
      building_style: STYLE
      n_dwellings: UNITS
      # Measured on the 2025 layer: NUM_ROOMS > 0 on 84.9% of
      # residential (1xx) rows, median 6. STORIES is text: numeric on
      # 80.6% of residential rows (1, 2, 1.75, 1.5, ...), town codes
      # such as 2A or 1T otherwise, which to_numeric below nulls.
      # STORIES_NUM exists in the schema and is empty. L3 carries no
      # bedroom or bath field.
      n_rooms: NUM_ROOMS
      n_stories: STORIES
      year_built: YEAR_BUILT
      # USE_CODE is the town's property type classification code. The
      # crosswalk beside this recipe (_use-group-code-remap.csv, applied
      # by the harmonizer; a code takes its longest matching key, and a
      # row scoped to an admin unit overrides the statewide row) gives
      # it a use group and subgroup. Definitions: MA DOR Division of
      # Local Services, Bureau of Local Assessment, "Property Type
      # Classification Codes, Non-arm's Length Codes and Sales Report
      # Spreadsheet Specifications", revised April 2019. Its coding
      # structure decides the one- and two-digit keys: "the first digit
      # indicates a major classification" (3 commercial, 4 industrial,
      # 9 exempt), so a 3xx, 4xx or 9xx code no row names takes its
      # class; a multiple-use code is 0 followed by the classes in
      # order of importance, so 01x is mixed, primarily residential,
      # and a four-digit 0xxx code (0 and the main use's code, as
      # Cambridge, Medford and Somerville write them) reads the same.
      # Housing that the handbook files under exempt owners is
      # residential here, as housing authority property (970) already
      # was: 945 (private educational, affiliated housing) and 959
      # (charitable, housing). 996 (non-taxable condominium common
      # land) is exempt. Commercial condominium units have no subgroup
      # with the word condominium, which the land-use keyword table
      # reads as the residential Condominium class.
      # Boston writes its own list, "Massachusetts Property
      # Classification System Occupancy Codes" (Boston Assessing
      # Department, read 2026-10-24), and its rows carry admin_id
      # US-MA-BOS. There 995 is "CONDO MAIN (no value)", land use CM,
      # the master record of a condominium, not exempt land as DOR's
      # 995 ("Other, Open Space"): its rows give no use group, only the
      # subgroup "condominium main". Measured 2026-10-24 on US-MA-BOS:
      # 7,037 of the 7,152 lots coded 995 carry condominium units
      # (6,865 residential units only, 40 commercial units only). Other
      # towns write 995 on condominium lots too (Chelsea 124 of 128,
      # Medford 255 of 259, Winthrop 158 of 160), but without a code
      # list of their own, so their 995 stays DOR's exempt. Boston's
      # 983 is a cemetery, 985 an other exempt building, 986 other
      # public land, 925 Metropolitan District Commission land.
      use_group_code: USE_CODE
      zoning: ZONING
      last_sale_date: LS_DATE
      last_sale_price: LS_PRICE
      last_sale_book: LS_BOOK
      last_sale_page: LS_PAGE
      admin3_id_source: TOWN_ID
    transformations:
      - type: unary
        operation: to_numeric
        input: n_stories
        output: n_stories
      # LOT_SIZE is in the unit LOT_UNITS names, one per town: A
      # (acres) on 2,295,001 of the 2025 layer's 2,550,012 rows (313
      # of 351 towns, median 0.26) and S (sqft) on 255,011 (median
      # 18,050). Converted here so land_area_sqft is sqft on every
      # row; the unit column is then dropped, since it would describe
      # the source value rather than the converted one. Before
      # 2026-09-13 acres passed through unconverted.
      - type: remap
        input: land_area_units
        mapping: {"A": 43560, "S": 1}
        output: land_area_sqft_factor
      - type: expression
        expression: "land_area_sqft * land_area_sqft_factor"
        inputs: [land_area_sqft, land_area_sqft_factor]
        output: land_area_sqft
      # Boston's BLD_AREA is a placeholder, 0 or 1, on accounts the city
      # roll gives a real GROSS_AREA (US-MA-BOS_property-bostongov-2026)
      # or none: a 13-story office of 178,130 sq ft carries 0, the
      # Common 1. Emptied here so the city roll's value replaces it and
      # no step reads 1 sq ft as a building. RES_AREA carries the same
      # 1 on exempt accounts with no building (hospital campus lots).
      - type: unary
        operation: null_if_equal
        input: gross_floor_area_sqft
        args: {value: 0}
        output: gross_floor_area_sqft
        admin_ids: [US-MA-BOS]
      - type: unary
        operation: null_if_equal
        input: gross_floor_area_sqft
        args: {value: 1}
        output: gross_floor_area_sqft
        admin_ids: [US-MA-BOS]
      - type: unary
        operation: null_if_equal
        input: living_area_sqft
        args: {value: 1}
        output: living_area_sqft
        admin_ids: [US-MA-BOS]
      # Accounts whose lot key (LOC_ID) names a polygon that is not
      # where their land or building is, listed one by one with the
      # evidence in the sidecar beside the Boston recipe tree: an
      # account moves to the lot it sits on, or to none ('none') where
      # the cadastre draws no polygon for it, so its values reach no
      # parcel instead of piling onto a small neighbor (the garage under
      # the Common put $44.7M on a 75 m2 entrance kiosk). Only listed
      # accounts change; the rest keep LOC_ID. Each town keeps its own
      # sidecar, because account numbers repeat across towns.
      - type: remap_file
        input: property_id_assessor
        crosswalk_id: US-MA-BOS_parcel-massgis-2025_lot-corrections
        output: parcel_id_admin2_corrected
        admin_ids: [US-MA-BOS]
      # Cambridge: a garage with no land area on a 17.6 m2 scrap
      # (44-95, $11.0M land) moves onto the lot that holds it.
      - type: remap_file
        input: property_id_assessor
        crosswalk_id: US-MA-CAM_parcel-massgis-2025_lot-corrections
        output: parcel_id_admin2_corrected
        admin_ids: [US-MA-CAM]
      # Chelsea: a highway viaduct account ($470M) on a 66 m2 scrap.
      - type: remap_file
        input: property_id_assessor
        crosswalk_id: US-MA-CHE_parcel-massgis-2025_lot-corrections
        output: parcel_id_admin2_corrected
        admin_ids: [US-MA-CHE]
      - type: aggregate
        operation: coalesce
        inputs: [parcel_id_admin2_corrected, parcel_id_admin2]
        output: parcel_id_admin2
        admin_ids: [US-MA-BOS, US-MA-CAM, US-MA-CHE]
      - type: unary
        operation: null_if_equal
        input: parcel_id_admin2
        args: {value: none}
        output: parcel_id_admin2
        admin_ids: [US-MA-BOS, US-MA-CAM, US-MA-CHE]
    drop_columns:
      - land_area_sqft_factor
      - land_area_units
      - parcel_id_admin2_corrected
    columns_to_categorical:
      - city
      - zip
      - owner_city
      - owner_postal_code
      - assessment_year
      - use_group_code
      - zoning
    save_to:
      admin_level: 3
