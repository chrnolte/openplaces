# Patch: in Massachusetts, a footprint is a Manufactured Home only where
# a source states it.
#
# The national occupancy vote can reach Manufactured Home on footprint
# shape and value alone: an elongated outline under 185 m2
# (morphology), the keyword-probability score, or a parcel with no
# improvement value. Those signals were calibrated in North Carolina and
# Texas. In Boston and its neighbours the footprint layer (OBM) draws
# each unit of a row of attached houses as its own building, a narrow
# deep box of the same shape as a single-wide, and narrow detached
# houses look the same. Measured 2026-10-18 on boston-inner-core
# (14 towns with Malden and Melrose): 2,021 outlines were Manufactured Home, 81 with a source stating it.
# Of Boston's 1,125, 62% share a wall of 3 m or more with another
# outline. With this guard 81 remain, the 67 on code-103 lots among them. Massachusetts records manufactured homes in its own use code
# (103, group Manufactured Home), so here the vote's Manufactured Home
# stands only where the lot carries that code or the vote's evidence
# includes the assessor keyword, NSI, FEMA, or a manufactured-home park
# or community. Elsewhere it is re-decided right after the vote: a
# secondary footprint is Secondary; a primary one whose class before the
# vote was non-residential (a college, office or church building) gets
# that class back; any other primary one is Single-Family under the same
# conditions as the vote's own residual. North Carolina and Texas are
# untouched.

admin_id: US-MA
stage: curate

entity:
  entity_type: footprint
  source:
    source_id: openplaces
  version: 2026

patches: US_footprint-openplaces-2026
pipeline_patch:
  - insert_after: resolve_by_vote
    occurrence: 3
    step:
      step: resolve_by_vote
      target: occupancy_type
      decisions:
        - class: Secondary
          source: manufactured_home_stated_guard
          min_score: 1
          require: &unstated
            - {type: equals, column: occupancy_type, value: Manufactured Home}
            - type: none_of
              indicators:
                - {type: equals, column: group_parcel, value: Manufactured Home}
                - type: has_token
                  column: occupancy_type_source
                  values: [keyword, nsi, fema, parcel_park, parcel_community]
          indicators:
            - {type: equals, column: priority_on_parcel, value: secondary,
               label: priority}
        - class_column: occupancy_type_prevote
          source: manufactured_home_stated_guard
          min_score: 1
          require: *unstated
          indicators:
            - type: all_of
              label: prevote
              indicators:
                - {type: in_set, column: priority_on_parcel,
                   values: [primary, unknown]}
                - type: none_of
                  indicators:
                    - type: in_set
                      column: occupancy_type_prevote
                      values: [Single-Family, Multi-Family, Manufactured Home,
                               Secondary]
        - class: Single-Family
          source: manufactured_home_stated_guard
          min_score: 1
          require: *unstated
          indicators:
            - type: all_of
              label: dwellings
              indicators:
                - {type: in_set, column: priority_on_parcel,
                   values: [primary, unknown]}
                - {type: equals, column: dwelling_multiplicity, value: single}
                - type: any_of
                  indicators:
                    - type: in_set
                      column: occupancy_type_prevote
                      values: [Single-Family, Multi-Family, Manufactured Home,
                               Secondary]
                    - {type: is_null, column: occupancy_type_prevote}
