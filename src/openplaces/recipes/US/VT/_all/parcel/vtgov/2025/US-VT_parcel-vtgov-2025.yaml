# Recipe to import Vermont's oficial parcel data

description: >-
  Vermont official statewide parcel data (2025).

# Administrative unit identifier: where does this data come from?
admin_id: US-VT

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: parcel
  # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: vtgov
    # Checked 2026-10-22: VCGI's Vermont Open Geodata Policy v1.1 says
    # its data "can be downloaded, shared, and utilized alongside other
    # data resources", and that "direct, non-value added, reproduction
    # ... with intent to sell is prohibited" (a no-resale clause).
    license: "Vermont Open Geodata Policy v1.1: may be downloaded, shared and used; no resale of unmodified copies"
    terms_url: "https://files.vcgi.vermont.gov/other/policies/vermont-open-geodata-policy.html"
    redistribution_restricted: false
    resale_restricted: true
    portal_url: "https://geodata.vermont.gov/pages/parcels"
    # URL to download
    download_url: "https://hub.arcgis.com/api/v3/datasets/09cf47e1cf82465e99164762a04f3ce6_0/downloads/data?format=fgdb&spatialRefId=4326"
  version: 2025

# Name of compressed file (set to skip re-downloading)
compressed_file_name: "VT_Data_-_Statewide_Standardized_Parcel_Data_-_parcel_polygons.gdb.zip"

# Name of uncompressed file (set to skip re-extracting)
uncompressed_file_name: "0d348afd-5a70-4889-810c-74f4fd32cd8a.gdb"

# Layer that identifies parcels
layer: FS_VCGI_OPENDATA_Cadastral_VTPARCELS_poly_standardized_parcels_SP_v1

# Read and process data in chunks
# (avoids reading very large geodatabases into memory)
process_by:
  # Administrative level at which processing is chunked
  admin_level: 3
  # Column in original data used to identify the administrative level
  admin_id_column: TOWN
  # Crosswalk from administrative identifiers in the original data
  # (e.g. county FIPS) to `openplaces` AdminIDs.
  admin_id_crosswalk:
    recipe_id: "US-VT_parcel-vtgov-2025_admin3-crosswalk"

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  parcel_id_assessor: PARCID
  parcel_id_map: MAPID
  parcel_id_admin2: SPAN
  parcel_id_admin2_2: GLIST_SPAN
  address_911: E911ADDR
  town_name: TNAME
  address: LOCAPROP
  owner_name: OWNER1
  owner_name_2: OWNER2
  owner_address: ADDRGL1
  owner_address_2: ADDRGL2
  owner_city: CITYGL
  owner_admin2_id_admin1: STGL
  owner_postal_code: ZIPGL
  legal_description: DESCPROP
  use_group: CAT
  use_subgroup: PROPTYPE
  resident_type: RESCODE
  total_value: REAL_FLV
  land_value: LAND_LV
  improvement_value: IMPRV_LV
  homestead_declared: HSDECL
  homestead_value: HSTED_FLV  
  nonresidential_value: NRES_FLV
  housesite_value: HSITEVAL
  source_year: YEAR

null_value_strings: ["UNKNOWN", "unknown"]

# The join key is the SPAN (School Property Account Number), the
# statewide 11-digit number the grand list, the property transfer tax
# return (US-VT_transaction-vttax-2026) and this layer all carry, so
# a sale reaches its parcel on it exactly. It is written here as
# '999-999-99999' (town code, school code, account); `simple` keeps
# the digits, which is the form the return states it in. The inline
# instruction at US-VT takes precedence over the bundled per-town
# conversions, which were derived for the town parcel id, not SPAN.
# Measured 2026-10-22 on rutland-vt: parcel_id_local filled on 22,823
# of 23,407 parcel rows (97.5%), 22,810 distinct. Condominium units
# and mobile homes on another's land have a SPAN of their own on the
# grand list and no polygon here, so their sales find no parcel (see
# US-VT_transaction-vttax-2026).
parcel_id_local:
  source: parcel_id_admin2
  kind: parcel
  instruction:
    US-VT: {conv: simple}

save_to:
  admin_level: 3
