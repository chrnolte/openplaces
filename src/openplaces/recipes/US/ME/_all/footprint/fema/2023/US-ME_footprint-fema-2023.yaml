# Recipe to import FEMA's USA Structures for Maine (2023)
#
# State-scoped fork of US_footprint-fema-2023, made from the
# Massachusetts fork (US-MA_footprint-fema-2023), whose header gives
# the reason: admin level 3 is the town here, and FEMA's FIPS column
# holds a county code, which names no town. The national recipe's
# FIPS crosswalk therefore matched no row, and every town's file was
# saved without rows (US-ME-PEM, 2026-11). Here each town's footprints
# are cut from the state GDB by its boundary
# (process_by.use_spatial_mask). Source, columns, transformations and
# index match the national recipe, and the outputs land on the same
# entity-keyed paths.

description: >-
  FEMA USA Structures building footprints for Maine, split per town.

admin_id: US-ME

entity:
  entity_type: footprint
  source:
    source_id: fema
    # Work of the U.S. Government, so uncopyrightable in the US by
    # statute (17 U.S.C. 105) rather than by a licence anyone grants.
    license: "public-domain (US Government work, 17 U.S.C. 105)"
    redistribution_restricted: false
    terms_url: null
    # Same download as the national recipe; its header says why the
    # Hub page's layout JSON is scraped.
    portal_url: "https://gis-fema.hub.arcgis.com/pages/usa-structures-data"
    download_url_source: "https://www.arcgis.com/sharing/rest/content/items/8388995e228e4e30a882686ac3ab256e/data?f=json"
    download_url_source_regex: '(https://fema-femadata\.s3\.us-east-1\.amazonaws\.com/Partners/ORNL/USA_Structures/[^"\\<>\s]+/(?:Deliverable[0-9]+{admin2_id_leaf}|{admin2_id_leaf}_Structures_[0-9]+)\.zip)'
  version: 2023

compressed_file_name: "*{admin2_id_leaf}*.zip"
uncompressed_file_name: "{admin2_id_leaf}_Structures.gdb"

# As in the national recipe: a unit with no data is an unfinished or
# broken ingest (recipe.coverage_is_complete).
coverage: complete

download_by:
  admin_level: 2

# Spatial, not FIPS-keyed: admin level 3 is towns here, and the data
# only carries county FIPS.
process_by:
  admin_level: 3
  use_spatial_mask: true

columns:
  building_id_fema: BUILD_ID
  address: PROP_ADDR
  city: PROP_CITY
  occupancy_class: OCC_CLS
  occupancy_type: PRIM_OCC
  height: HEIGHT
  construction_code: B_CODE
  footprint_area_m2: SQMETERS
  footprint_area_sqft: SQFEET
  image_date: IMAGE_DATE
  validation_method: VAL_METHOD
  postal_code: PROP_ZIP
  census_tract_id: CENSUSCODE
  admin3_id_admin1: FIPS

# The national recipe's remap sidecar, so the forks cannot drift.
transformations:
  - output: group
    type: remap_file
    input: occupancy_type
    crosswalk_id: US_footprint-fema-2023_group-remap

columns_to_categorical:
  - occupancy_class
  - occupancy_type
  - group
  - image_date
  - validation_method
  - building_code

create_index:
  function: "openplaces.geo.ids.add_openlocationcode_index"
  args:
    name: footprint_id
