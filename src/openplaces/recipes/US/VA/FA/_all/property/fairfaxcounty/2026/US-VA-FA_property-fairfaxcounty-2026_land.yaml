# Recipe: Fairfax County, VA land table (Tax Administration).
# Supplement of US-VA-FA_property-fairfaxcounty-2026; see that recipe
# for the terms and the join key.
#
# SOURCE. "Real Estate - Land Data" on the County GIS open-data Hub
# (OpenData_A6 layer 3), bulk CSV export, 372,119 rows, 20.4 MB, read
# 2026-09-13 (iasWorld LAND).
#
# WHAT ONE ROW IS. One land line of a parcel (LLINE), with its area
# (SF, ACRES), UNITS and a land-type CODE_DESC (SINGLE DWELLING,
# TWNHSE INT, CONDO COMMERCIAL ...). 367,625 PARIDs; lines sum per
# parcel.
#
# MAPPED. ACRES as area_assessed_ac (filled on 97.7% of lines, > 0 on
# 82.9%: condominium unit lines carry 0). SF is the same area in
# square feet and is not mapped twice. NOT MAPPED: UNITS and
# CODE_DESC (a pricing unit and a land-line type; no registry home).
#
# MEASURED 2026-09-13, summed per parcel: area_assessed_ac on 98.7%
# of the roll's 338,959 residential parcels (> 0 on 82.9%, median
# 0.241 ac). Every land-line PARID is in the roll.

description: >-
  Fairfax County, VA land table (Tax Administration, Hub CSV): assessed
  land area in acres per land line, summed per parcel.

admin_id: US-VA-FA

entity:
  entity_type: property
  source:
    source_id: fairfaxcounty
    # Same terms as the roll; see its TERMS note.
    license: >-
      Fairfax County copyright: reproduction "for internal or personal use"
      is granted; "no part of this material may be published or reproduced
      by any means for commercial sale or use without prior written
      permission of Fairfax County."
    terms_url: "https://www.fairfaxcounty.gov/maps/disclaimer"
    redistribution_restricted: true
    resale_restricted: true
    usage_requirement:
      non_commercial: true
    portal_url: "https://www.arcgis.com/home/item.html?id=f1f0f31844cf49489134f9fa2b8f16f5"
    download_url: "https://hub.arcgis.com/api/v3/datasets/f1f0f31844cf49489134f9fa2b8f16f5_3/downloads/data?format=csv&spatialRefId=4326"
  version: 2026

uncompressed_file_name: "fairfax_real_estate_land.csv"

process_by:
  admin_level: 3

csv_dtype:
  PARID: str

columns:
  parcel_id_assessor: PARID
  area_assessed_ac: ACRES

aggregation_function:
  area_assessed_ac: sum

supplements: US-VA-FA_property-fairfaxcounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel
  # Same conversion as the roll, so both keys agree.
  instruction:
    US-VA-FA:
      conv: simple

save_to:
  data_dir: cache
  filename: land
