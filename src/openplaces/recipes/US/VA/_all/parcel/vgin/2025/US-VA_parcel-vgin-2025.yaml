# Recipe to import the parcel database of the state of Virginia, US
#
# NOTE (2026-09-13): the download URL below is not versioned. It now
# serves VGIN's 2026 Q2 release (file dated 2026-07-01), so a fresh
# download no longer reproduces the 2025 edition. In the 2025
# shapefile VGIN_QPID lost its last digit (Fairfax: 36,875 values over
# 368,742 parcels), so parcel_id_admin2 is not unique here, and this
# recipe declares no parcel_id_local. US-VA_parcel-vgin-2026 reads the
# 2026 geodatabase instead, where VGIN_QPID is whole.

description: >-
  Virginia statewide parcel database from the Virginia Geographic Information Network
  (2025).

# Administrative unit identifier: where does this data come from?
admin_id: US-VA

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: parcel
   # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: vgin
    # URL to download
    download_url: "https://vginmaps.vdem.virginia.gov/download/BaseMapData/SHP/VirginiaParcel.shp.zip"
  version: 2025

# Name of compressed file (set to skip re-downloading)
compressed_file_name: "VirginiaParcel.shp.zip"

# Name of uncompressed file (set to skip re-extracting)
uncompressed_file_name: "VirginiaParcel.shp"

# Column that splits the data into chunks for processing
# (avoids reading very large geodatabase into memory)
process_by:
  admin_level: 3
  admin_id_column: FIPS
  admin_id_crosswalk:
    admin_level: 3
    admin_id_column: admin3_id_admin1
    admin_recipe_id: "admin-openplaces-2026_admin3"

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  parcel_id_assessor: PARCELID
  parcel_id_admin2: VGIN_QPID
  parcel_id_admin3_2: PTM_ID
  source_date: LASTUPDATE
