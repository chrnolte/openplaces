# Patch: Connecticut transaction curation, grading the assessors'
# non-usable sale codes (US-CT_transaction-ctopm-2026).
#
# Connecticut's assessors report every sale of 2,000 USD or more to
# OPM and mark a sale they find unusable with one of 30 codes, from
# OPM's own list ("Non Usable Codes.pdf", attached to data.ct.gov
# dataset 5mzw-sjtu, read 2026-10-21). A sale with no code is one the
# assessor accepted. The ingest writes the code as 'NU:' followed by
# the value as shipped, 'NU:' alone when there is none. A state's
# vocabulary, so a state patch.
#
# Towns spell a code two ways, the number with its label ('07 -
# Change in Property') or the bare number ('7'); both are listed.
# Measured 2026-10-21, statewide: 852,839 of 1,188,997 rows carry no
# code; every code 1 to 30 occurs in both spellings, code 13 in two
# label spellings ('Bankrupcy', 'Bankruptcy'). Values outside the
# list (bare numbers 31 to 88 and 'Single Family', 35 rows statewide,
# none in the torrington-ct towns) map to nothing and stay missing;
# no `default` is set for that reason. Graded shares in those 23
# towns' 99,672 rows: 71.9% at 1.0, 8.8% at 0.7, 19.2% at 0.0.
#
# Grades, on the national scale (0, 0.7, 1):
#   1.0  no code: the assessor accepted the sale.
#   0.7  the code says the assessment no longer describes what sold,
#        not that the price is off market: 05 deed date (signed over
#        six months before the sampling year), 06 a portion of the
#        assessed unit, 07 changed after the assessment date, 12 a
#        non-buildable lot sold to an abutter (as Illinois grades its
#        adjacent-owner box), 17 a parcel in two towns, 23 a zoning
#        change since assessment, 24 plottage (sites combined into one
#        ownership), 26 rehabilitation deferral, 27 crumbling
#        foundation assessment reduction, 28 farm, forest or open
#        space use assessment.
#   0.0  every other code: family (01), love and affection (02),
#        related corporations (03), correcting deed (04), part
#        interest (08), tax sale (09), a will (10), court order (11),
#        bankruptcy (13), foreclosure (14), government agency (15),
#        charitable group (16), in lieu of foreclosure (18), easement
#        (19), cemetery (20), exchange for other assets (21), personal
#        property included (22), other reasons (25), no consideration
#        (29), auction (30).
# Code 25 reads in part "ratio is either way too high or way too
# low": that is the assessor's judgment, graded as stated; no ratio
# is computed here (design limits L7, L29 checked).
#
# Groups: qualified for no code; related_parties for 01 to 03;
# not_a_sale for 04, 10 and 29, which convey without a sale;
# qualified_parcel_changed for 06, 07 and 23; qualified_multi_parcel
# for 17 and 24; disqualified for the remaining 0.0 codes. 05, 12 and
# 26 to 28 get no group, since none of the registry's groups describes
# them; the confidence carries them.

admin_id: US-CT
stage: curate

entity:
  entity_type: transaction
  source:
    source_id: openplaces
  version: 2026

patches: US_transaction-openplaces-2026
pipeline_patch:
  - insert_after: derive_indicators
    occurrence: 1
    step:
      step: derive_indicators
      indicators:
        - output: sale_arms_length_confidence
          type: value_map
          fill_only: true
          column: sale_qualification_code
          mapping:
            "NU:": 1.0
