# Recipe to import Connecticut's parcel data
#
# PARCEL_ID_LOCAL CHANGED (2026-09-13): this recipe declared no
# parcel_id_local before; it now builds the key it shares with the
# CAMA roll US-CT_property-ctgov-2024. Outputs ingested earlier carry
# no such column, so the next CT parcel ingest makes the CT geospine
# sidecars stale: rerun the CT geospine after it.
#
# JOIN KEY. CAMA_Link is '{town code}-{rest}' (fabricated shape
# '99999-999-99'). The town code is the town's five-digit county
# subdivision code, one value per town, and 9 towns drop its leading
# zero here but not in the CAMA table ('1234' against '01234'). So
# parcel_id_local is the town code zero-padded to five digits, a
# dash, then the part after the first dash, converted with 'simple';
# the same steps sit on the property recipe. 19,088 parcels, all in
# Danbury, have no CAMA_Link and so no key. Measured in memory
# against the 2024 CAMA table: 97.10% of keyed parcels find a CAMA
# row and 92.98% of CAMA rows find a parcel (9 zero-dropping towns:
# 97.67% and 98.16%).

description: >-
  Connecticut statewide parcel data from the state open data portal (2024).

# Administrative unit identifier: where does this data come from?
admin_id: US-CT

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: parcel
  # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: ctgov
    portal_url: "https://data.ct.gov/Local-Government/2024-Connecticut-Parcel-and-CAMA-Data/pqrn-qghw/about_data"
    # URL to download
    download_url: "https://data.ct.gov/api/views/pqrn-qghw/files/04df94a2-ab74-4ca2-9ac0-5ac0938439a6?download=true&filename=2024%20Parcel%20Layer.gdb.zip"
  version: 2024

# Name of compressed file (set to skip re-downloading)
compressed_file_name: "2024_Parcel_Layer.gdb.zip"

# Name of uncompressed file (set to skip re-extracting)
uncompressed_file_name: "2024 Basic Parcel Layer.gdb"

# Layer that identifies parcels
layer: Basic_Parcels_2024

# Read and process data in chunks
# (avoids reading very large geodatabases into memory)
process_by:
  # Administrative level at which processing is chunked.
  # Connecticut has no counties; the town is the level-3 unit.
  admin_level: 3
  # Column in original data used to identify the administrative level
  admin_id_column: Town_Name
  # Crosswalk from administrative identifiers in the original data
  # (e.g. county FIPS) to `openplaces` AdminIDs.
  admin_id_crosswalk:
    recipe_id: "US-CT_parcel-ctgov-2024_admin3-crosswalk"

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  address: Location
  parcel_id_admin2: CAMA_Link
  parcel_id_assessor: Parcel_ID
  parcel_id_admin4_2: Link
  type: Parcel_Typ
  address_unit_type: Unit_Type
  source_date: Edit_Date

transformations:
  # Shared parcel key (see JOIN KEY above). The same five steps sit on
  # US-CT_property-ctgov-2024; change both or neither.
  - type: string
    operation: strip
    input: parcel_id_admin2
    output: _cama_link
  - type: string
    operation: extract_named
    input: _cama_link
    output: _town_code
    args:
      pattern: '^(?P<town_code>[^-]+)-'
  - type: string
    operation: zfill
    input: _town_code
    output: _town_code
    args:
      width: 5
  - type: string
    operation: extract_named
    input: _cama_link
    output: _cama_link_rest
    args:
      pattern: '^[^-]+-(?P<rest>.*)$'
  - type: string
    operation: concat
    inputs: [_town_code, _cama_link_rest]
    output: parcel_id_local
    args:
      sep: '-'

drop_columns:
  - _cama_link
  - _town_code
  - _cama_link_rest

# Converts the key assembled above in place. The instruction at
# US-CT outranks the bundled per-town table (fit to other id
# columns) for every town.
parcel_id_local:
  source: parcel_id_local
  kind: parcel
  instruction:
    US-CT:
      conv: simple

save_to:
  # Same level as `process_by`, so nothing is aggregated: the town is the
  # unit that holds the parcel roll, and with no county above it there is
  # no coarser unit to gather towns into.
  admin_level: 3
