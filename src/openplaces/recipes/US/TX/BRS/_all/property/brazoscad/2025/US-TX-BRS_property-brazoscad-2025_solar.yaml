# Recipe: Brazos County, TX certified appraisal roll, improvement
# features member (PACS File #9): has_solar from the district's 'Other
# Feature' attribute. Same download and File #9 row shape as the roll's
# room-count supplements; read US-TX-BRS_property-brazoscad-2025 for the
# source and its terms.
#
# READING. Presence only. A property is true where a row exists and
# missing elsewhere: the attribute lists present features only.
#
# 'Other Feature' is a list of present features, one per row; the row
# reading 'SOLAR PANE' (cut at 10 characters) sets the flag.
#
# MEASURED on the 2025 export (aggregates only; share of properties with
# a value): A is the 58,079 single-family properties (improvement state
# class A, File #7); B, E and M the other residential classes. has_solar
# A 0.5% (B 0.0%, E 0.2%, M 0.0%).

description: >-
  Brazos County, TX certified appraisal roll, improvement features member: has_solar per
  building, reduced to the property.

admin_id: US-TX-BRS

entity:
  entity_type: property
  source:
    source_id: brazoscad
    # Same download as the roll; see its terms note.
    license: >-
      unknown (download page: the district 'claims no responsibility for the
      downloading of this data'; no terms on the data)
    redistribution_restricted: null
    portal_url: "https://brazoscad.org/certified-data-downloads/"
    download_url: "https://brazoscad.org/wp-content/uploads/2025/08/2025-CERTIFIED-EXPORT.zip"
  version: 2025

compressed_file_name: "2025-CERTIFIED-EXPORT.zip"
uncompressed_file_name: "2025-07-23_002022_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features), 87 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  has_solar: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Other Feature' and has_solar == 'SOLAR PANE'

# One row per building.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: remap_conditional
    input: has_solar
    conditions:
      - condition: regex
        pattern: '.'
        output: true
    output: has_solar

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  has_solar: max

supplements: US-TX-BRS_property-brazoscad-2025

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: solar
