# Recipe: Brazos County, TX certified appraisal roll, improvement
# features member (PACS File #9): roof_material from the district's
# 'Roof Covering' attribute. Same download and File #9 row shape as the
# roll's room-count supplements; read US-TX-BRS_property-brazoscad-2025
# for the source and its terms.
#
# READING. The district's code, kept as published (no crosswalk).
# drop_duplicates keeps the first row per building, and the property
# takes the first building's code.
#
# MEASURED on the 2025 export (aggregates only; share of properties with
# a value): A is the 58,079 single-family properties (improvement state
# class A, File #7); B, E and M the other residential classes.
# roof_material A 53.4% (B 46.3%, E 28.1%, M 0.0%), 37 distinct codes.

description: >-
  Brazos County, TX certified appraisal roll, improvement features member: roof_material
  per building, reduced to the property.

admin_id: US-TX-BRS

entity:
  entity_type: property
  source:
    source_id: brazoscad
    # Same download as the roll; see its terms note.
    license: >-
      unknown (download page: the district 'claims no responsibility for the
      downloading of this data'; no terms on the data)
    redistribution_restricted: null
    portal_url: "https://brazoscad.org/certified-data-downloads/"
    download_url: "https://brazoscad.org/wp-content/uploads/2025/08/2025-CERTIFIED-EXPORT.zip"
  version: 2025

compressed_file_name: "2025-CERTIFIED-EXPORT.zip"
uncompressed_file_name: "2025-07-23_002022_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features), 87 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  roof_material: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Roof Covering'

# One row per building.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  roof_material: first

supplements: US-TX-BRS_property-brazoscad-2025

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: roof-material
