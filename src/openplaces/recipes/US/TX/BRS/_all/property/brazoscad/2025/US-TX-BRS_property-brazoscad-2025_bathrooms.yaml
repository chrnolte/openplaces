# Recipe: Brazos County, TX certified appraisal roll, improvement
# features, bathrooms (BCAD). Same member (PACS File #9) as
# US-TX-VIC_property-victoriacad-2026_bedrooms; read its header first.
# This header covers what differs for Brazos.
#
# Brazos's 'Plumbing' attribute is a bath count (median 2), not a
# fixture count, but written in three notations in one field: a plain
# number ('2', '2.5'), full/half with a slash ('2/1', also '2\1',
# meaning two full and one half), and a written half ('2 1/2', '3-1/2').
# Each is parsed separately and folded to full + 0.5 x half, the
# registry's n_bathrooms definition. The query keeps only rows in one of
# the three forms, with a half count of 1 to 4 in the slash form, and
# drops a bare '1/2' (4 rows), which reads either as one half bath or as
# one full and two half.
#
# No n_half_bathrooms: only the slash form separates halves, and it is
# on too few properties (see MEASURED) to clear the 25% bar.
#
# MEASURED on the 2025 export: 'Plumbing' on 43,495 rows over 41,970
# properties. The query drops 39 rows: '1 1/2 EA' (18, 'each' on a
# multi-unit building), '2/5' (16, whose median of 4 bedrooms fits
# neither 2 full and 5 half nor a slip for 2.5 with confidence), a bare
# '1/2' (4) and '1 3/4' (1). The slash form is on 4,858 rows, 7.8% of
# single-family properties. After the row rule, 41,935 properties,
# median 2, p99 5; 16.9% end in .5. The median bath count rises with
# bedrooms (1 for one, 2 for three, 3 for four). Coverage (value above
# 0) is 68.7% of the 58,079 single-family (A) properties, 21.8% of the
# 3,293 multifamily (B), 26.4% of the 3,353 rural improved (E) and 8.7%
# of the 3,745 mobile homes (M).
#
# ROW RULE. 1,192 improvements carry two or more kept rows, 82% of them
# with equal values, so the rows mostly repeat one building's figure
# across its components. drop_duplicates keeps the first row per
# (prop_id, imprv_id), and aggregation_function sums distinct buildings
# to the property. As with bedrooms, disagreeing later rows sit mostly
# on an OPEN PORCH; over the 210 single-family improvements concerned,
# improvement value sits nearer the first row's count in 68%. Summing
# all rows would change 2.84% of properties.

description: >-
  Brazos County, TX certified appraisal roll, improvement features member: bathrooms
  per building (halves as .5), summed to the property.

admin_id: US-TX-BRS

entity:
  entity_type: property
  source:
    source_id: brazoscad
    # Same download as the roll; see its terms note.
    license: >-
      unknown (download page: the district 'claims no responsibility for the
      downloading of this data'; no terms on the data)
    redistribution_restricted: null
    portal_url: "https://brazoscad.org/certified-data-downloads/"
    download_url: "https://brazoscad.org/wp-content/uploads/2025/08/2025-CERTIFIED-EXPORT.zip"
  version: 2025

compressed_file_name: "2025-CERTIFIED-EXPORT.zip"
uncompressed_file_name: "2025-07-23_002022_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features), 87 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Plumbing'
  and n_bathrooms.str.fullmatch(
  "[0-9]+([.][0-9]+)?|[0-9] *[/\\\\] *[1-4]|[0-9] *[ ,-] *1/2",
  na=False)
  and n_bathrooms != '1/2'

# One row per building; see ROW RULE.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  # Notation 1, a plain number: whole baths, or halves as .5.
  - type: string
    operation: extract_named
    input: n_bathrooms
    args:
      pattern: '^(?P<n>\d+(?:\.\d+)?)$'
    output: bath_plain
  # Notation 2, full/half with a slash (either way round): '2/1'.
  - type: string
    operation: extract_named
    input: n_bathrooms
    args:
      pattern: '^(?P<n>\d)\s*[/\\]\s*[1-4]$'
    output: bath_full
  - type: string
    operation: extract_named
    input: n_bathrooms
    args:
      pattern: '^\d\s*[/\\]\s*(?P<n>[1-4])$'
    output: bath_half
  # Notation 3, a written half: '2 1/2', '3-1/2', '1,1/2'.
  - type: string
    operation: extract_named
    input: n_bathrooms
    args:
      pattern: '^(?P<n>\d)\s*[ ,-]\s*1/2$'
    output: bath_text
  - type: unary
    operation: to_numeric
    input: bath_plain
    output: bath_plain
  - type: unary
    operation: to_numeric
    input: bath_full
    output: bath_full
  - type: unary
    operation: to_numeric
    input: bath_half
    output: bath_half
  - type: unary
    operation: to_numeric
    input: bath_text
    output: bath_text
  - type: expression
    expression: "bath_full + 0.5 * bath_half"
    inputs: [bath_full, bath_half]
    output: bath_slash
  - type: expression
    expression: "bath_text + 0.5"
    inputs: [bath_text]
    output: bath_text
  # Exactly one notation matches a kept row, so the sum is that one.
  - type: aggregate
    operation: sum
    inputs: [bath_plain, bath_slash, bath_text]
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id
  - bath_plain
  - bath_full
  - bath_half
  - bath_slash
  - bath_text

aggregation_function:
  n_bathrooms: sum

# Details the roll's properties: joined by link_by_id, skipped
# by the property spine's union.
supplements: US-TX-BRS_property-brazoscad-2025

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
