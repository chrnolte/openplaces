# Recipe: Wichita County, TX certified appraisal roll -- improvement
# features, bedrooms (Wichita Appraisal District). Same member (PACS
# File #9) and row rule as US-TX-VIC_property-victoriacad-2026_bedrooms;
# read its header first.
#
# "Number of Bedrooms" is numeric on every row, codes 1 to 9, median 3,
# with no zero sentinel.
#
# MEASURED on the 2026 export: 42,295 rows over 41,036 properties.
# 93.5% of the 42,417 single-family (A) properties carry it, 75.2% of
# multifamily (B), 75.4% of rural improved (E), 0.7% of mobile homes
# (M); per property median 3, p99 5.
#
# ROW RULE. 80 of 42,213 improvements carry two or more rows (each on a
# separate detail) and 20% of those agree, so the rule was measured
# against the count expected from the improvement's area (median of
# single-row improvements in the same area decile): first row off by
# 0.66 on average, max by 0.66, sum by 1.15. drop_duplicates keeps the
# first row per building; the sum then adds distinct buildings.
#
# Wichita has no rooms attribute. Stories are not in File #9; File #8
# detail types LV15 ("1.5 STORY LV") and LV20 ("2 STORY LV") name them
# on 3.3% and 3.1% of single-family properties, below the 25% floor,
# and reading a plain LV detail as one story would be an inference, so
# no stories recipe exists for this district.

description: >-
  Wichita County, TX certified appraisal roll, improvement features
  member: bedrooms per building, summed to the property.

admin_id: US-TX-WIC

entity:
  entity_type: property
  source:
    source_id: wichitacad
    # Same download as the roll; see its terms note.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://wadtx.com/reports/"
    download_url: "https://wadtx.com/wp-content/uploads/2026/07/2026-CERTIFIED-REAL-ROLL.zip"
  version: 2026

compressed_file_name: "2026-CERTIFIED-REAL-ROLL.zip"
uncompressed_file_name: "2026-07-17_008109_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS 8.0.34 File #9 (Improvement Features).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bedrooms: imprv_attr_cd

query: "imprv_attr_desc == 'Number of Bedrooms'"

# One row per building; see the header's ROW RULE.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: n_bedrooms
    output: n_bedrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_bedrooms: sum

supplements: US-TX-WIC_property-wichitacad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bedrooms
