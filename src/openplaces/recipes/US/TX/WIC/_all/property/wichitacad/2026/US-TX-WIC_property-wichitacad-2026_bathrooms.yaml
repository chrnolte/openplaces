# Recipe: Wichita County, TX certified appraisal roll -- improvement
# features, bathrooms (Wichita Appraisal District). Same member (PACS
# File #9) and row rule as US-TX-VIC_property-victoriacad-2026_bedrooms;
# read its header first. This header covers what differs for Wichita.
#
# Wichita configures a "Baths" attribute: numeric on every row, codes
# 2.0, 1.0, 1.5, 2.5, 3.0 lead, median 2, halves folded in as .5 (the
# registry's n_bathrooms definition; no separate half count, and no
# fixture count, exists).
#
# MEASURED on the 2026 export: 42,757 rows over 41,165 properties.
# 93.6% of the 42,417 single-family (A) properties carry it, 75.2% of
# multifamily (B), 76.5% of rural improved (E), 0.7% of mobile homes
# (M); per property median 2, p99 4.
#
# ROW RULE. 186 of 42,560 improvements carry two or more rows (on
# separate details: living area, second living quarters, a 2-story
# living area) and only 23% of those agree, so the rule was measured
# against the count expected from the improvement's area (median of
# single-row improvements in the same area decile): first row off by
# 0.68 on average, max by 0.68, sum by 1.27. drop_duplicates keeps the
# first row per building; the sum then adds distinct buildings.

description: >-
  Wichita County, TX certified appraisal roll, improvement features
  member: bathrooms per building (halves as .5), summed to the property.

admin_id: US-TX-WIC

entity:
  entity_type: property
  source:
    source_id: wichitacad
    # Same download as the roll; see its terms note.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://wadtx.com/reports/"
    download_url: "https://wadtx.com/wp-content/uploads/2026/07/2026-CERTIFIED-REAL-ROLL.zip"
  version: 2026

compressed_file_name: "2026-CERTIFIED-REAL-ROLL.zip"
uncompressed_file_name: "2026-07-17_008109_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS 8.0.34 File #9 (Improvement Features).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

query: "imprv_attr_desc == 'Baths'"

# One row per building; see the header's ROW RULE.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_bathrooms: sum

supplements: US-TX-WIC_property-wichitacad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
