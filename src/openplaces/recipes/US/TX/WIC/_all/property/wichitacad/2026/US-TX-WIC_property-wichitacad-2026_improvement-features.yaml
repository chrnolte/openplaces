# Recipe: Wichita County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-WIC_property-wichitacad-2026; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2027 (0 is the district's
# blank).
#
# The second-structure living quarters (LVS, LVS2, LVSM, OLVQ) count as
# living area and set has_accessory_dwelling. 'LV BARN' (barndominium
# shell) is not living area.
#
# TYPES. living area: types LV, MA, LV15, LV20, LVM, LVB, LVB20, LV2,
# LVS, LVS2, LVSM, OLVQ. garage: types AG, DG, BIGAR, DGD, AGD, AGBR.
# carport: types CCP. porch: types PCVP, PEP, POP. deck and patio: types
# PCPTO, PPTO. swimming pool: types RSPL. basement (finished and
# unfinished): types UB, FB. finished basement: types FB. solar device:
# types SED. accessory dwelling: types LVS, LVS2, LVSM, OLVQ.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 42,417
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 97.6% (B
# 100.0%, E 86.3%, M 100.0%), per-property median 1467. garage_area_sqft
# A 60.8% (B 27.1%, E 42.5%, M 0.4%), per-property median 468.
# has_garage A 60.8% (B 27.1%, E 42.5%, M 0.4%). garage_type A 60.8% (B
# 27.1%, E 42.5%, M 0.4%), 6 distinct codes. has_carport A 29.8% (B
# 21.2%, E 37.8%, M 10.8%). porch_area_sqft A 88.9% (B 71.5%, E 66.9%, M
# 4.3%), per-property median 102. deck_area_sqft A 43.9% (B 10.0%, E
# 22.0%, M 17.7%), per-property median 200. has_pool A 7.2% (B 6.6%, E
# 10.0%, M 0.0%). basement_area_sqft A 0.3% (B 0.7%, E 0.4%, M 0.0%),
# per-property median 384. has_basement A 0.3% (B 0.7%, E 0.4%, M 0.0%).
# basement_finished_area_sqft A 0.1% (B 0.0%, E 0.2%, M 0.0%),
# per-property median 503.5. has_solar A 3.8% (B 0.1%, E 3.9%, M 0.9%).
# has_accessory_dwelling A 3.7% (B 16.2%, E 6.2%, M 0.2%). quality_grade
# A 97.6% (B 100.0%, E 86.3%, M 100.0%), 20 distinct codes. year_built A
# 97.6% (B 100.0%, E 86.2%, M 100.0%), per-property median 1962.
# effective_year_built A 96.8% (B 99.5%, E 85.2%, M 100.0%),
# per-property median 1980.

description: >-
  Wichita County, TX certified appraisal roll, improvement detail member: living,
  garage, porch and deck areas, class and feature flags per property.

admin_id: US-TX-WIC

entity:
  entity_type: property
  source:
    source_id: wichitacad
    # Same download as the roll; see its terms note.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://wadtx.com/reports/"
    download_url: "https://wadtx.com/wp-content/uploads/2026/07/2026-CERTIFIED-REAL-ROLL.zip"
  version: 2026

compressed_file_name: "2026-CERTIFIED-REAL-ROLL.zip"
uncompressed_file_name: "2026-07-17_008109_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['LV', 'MA', 'LV15', 'LV20',
      'LVM', 'LVB', 'LVB20', 'LV2', 'LVS', 'LVS2', 'LVSM', 'OLVQ']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['AG', 'DG', 'BIGAR', 'DGD',
      'AGD', 'AGBR']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['AG', 'DG', 'BIGAR', 'DGD', 'AGD', 'AGBR']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['AG', 'DG', 'BIGAR',
      'DGD', 'AGD', 'AGBR']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['CCP']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['PCVP', 'PEP', 'POP']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['PCPTO', 'PPTO']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['RSPL']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['UB', 'FB']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['UB', 'FB']
        output: true
    output: has_basement
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['FB']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_finished_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['SED']
        output: true
    output: has_solar
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['LVS', 'LVS2', 'LVSM', 'OLVQ']
        output: true
    output: has_accessory_dwelling
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['LV', 'MA', 'LV15', 'LV20',
      'LVM', 'LVB', 'LVB20', 'LV2', 'LVS', 'LVS2', 'LVSM', 'OLVQ']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['LV', 'MA', 'LV15', 'LV20',
      'LVM', 'LVB', 'LVB20', 'LV2', 'LVS', 'LVS2', 'LVSM', 'OLVQ']) &
      (year_built > 1800) & (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['LV', 'MA', 'LV15',
      'LV20', 'LVM', 'LVB', 'LVB20', 'LV2', 'LVS', 'LVS2', 'LVSM', 'OLVQ']) &
      (effective_year_built > 1800) & (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max
  basement_finished_area_sqft: sum
  has_solar: max
  has_accessory_dwelling: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-WIC_property-wichitacad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
