# Recipe: Fort Bend County, TX appraisal roll (FBCAD).
#
# Why this county gets its own recipe on top of US-TX_parcel-txgio-2025:
# the statewide TxGIO layer ships Fort Bend with *no land use and no year
# built at all* (both 0.0% over 375,100 parcels), which is the largest such
# hole in the coastal-Texas CHEER region. FBCAD's own service supplies both,
# plus living area -- see the measured coverage in the NOTEs below.
#
# NOTE on bulk vs REST, and why this recipe does BOTH. FBCAD publishes a Hub
# bulk export, and it is genuine data (not a 202 stub): 381,525 rows, and
# YEARBUILT/TOTSQFTLVG counts within 0.5% of the live service. But the export
# carries only 33 of the layer's 44 columns. The CAD attributes are a
# service-side join that Hub materializes without, so `Land_State_Code`,
# `Land_Type`, `Land_AG_Code`, `Land_Access`, `Building_SPTB_Code`,
# `Building_Class`, `LEGALLOC`, `DEEDDATE`/`DEEDBOOK`/`DEEDPAGE` and
# `EXEMPTIONS` are simply absent from it -- the Wilson County NC failure
# shape described in _instructions/acquiring_sources.md, caught by the
# equivalence test rather than by inspection.
#
# So: geometry and the base roll come from the bulk export (one request
# instead of ~190 pages), and the eleven joined columns come back through an
# attribute-only REST query. `join_min_match` guards the key: a wrong key
# silently yields mostly-null columns, which is exactly what this pattern
# would otherwise hide.
#
# NOTE on coverage, measured against the live layer rather than a sample.
# A 500-row sample said YEARBUILT was 98.6% populated; the whole layer says
# 75.9% (292,961 of 385,787). Sample first, then confirm on the server.
#   Land_State_Code  99.9%  (385,502)
#   YEARBUILT        75.9%  (292,961)
#   TOTSQFTLVG       75.3%  (290,483)
#
# NOTE: 385,787 features against TxGIO's 375,100 is 1.03x -- inside the
# 0.6-1.5x gate. Service extent covers 99.9% of the Fort Bend admin polygon.
#
# NOTE: no licenseInfo and no accessInformation are published on the AGOL
# item, and https://www.fbcad.org/data-files/ answers 403 to a non-browser
# request. Recorded here as an absence rather than an assumption; the
# sibling "FBCAD Public Parcels May 2026" item carries only "FBCAD.org" as
# access information.
#
# NOTE: `Building_Class` (RA1, RA1+, RA2, RA2+ ...) is the district's
# construction quality/class code, not an architectural style and not a
# HAZUS construction material. It is deliberately left unmapped rather than
# forced into `building_style` or `construction_type`, either of which would
# corrupt a curate-stage vote that reads them. Same for `NBHDCODE` and
# `EXEMPTIONS`: no registry equivalent, so they stay unmapped.

description: >-
  Fort Bend County, TX appraisal roll from FBCAD: state land-use code, year
  built, living area and values the statewide TxGIO layer omits.

admin_id: US-TX-FOB

entity:
  entity_type: parcel
  source:
    source_id: fbcad
    # Checked 2026-08-20 against the ArcGIS REST service this recipe
    # reads: neither copyrightText nor licenseInfo is set on the service
    # or its layer, so the endpoint openplaces actually uses states no
    # terms. Checked and absent, not unexamined -- but this speaks only
    # for that endpoint, not for anything the county may publish
    # elsewhere.
    license: "unknown (service declares no copyright or licence)"
    redistribution_restricted: null
    portal_url: "https://www.fbcad.org/"
    download_url_scraper: arcgis_rest_scraper
  version: 2026

uncompressed_file_name: "fbcad_parcels.geojson"

scraper_options:
  # One request for geometry plus the base roll.
  bulk_url: "https://hub.arcgis.com/api/download/v1/items/1c1da7411ae64b1e99a0669e692afb3c/geojson?layers=0"
  layer_url: "https://services2.arcgis.com/D4saGHECICkCeoJm/arcgis/rest/services/FBCAD_Public_Data/FeatureServer/0"
  # The columns the bulk export drops, fetched attribute-only.
  attribute_join:
    key: QUICKREFID
    fields:
      - Land_State_Code
      - Land_Type
      - Building_SPTB_Code
      - Building_Class
      - DEEDDATE
      - EXEMPTIONS
  # QUICKREFID is 385,779-distinct over 385,787 features, so a correct join
  # matches essentially everything; the bulk snapshot is slightly older
  # (381,525 rows), which is the only expected shortfall.
  join_min_match: 0.95

columns:
  parcel_id_assessor: QUICKREFID
  # Texas Comptroller state category, same vocabulary as TxGIO's
  # STAT_LAND_USE -- hence the crosswalk sidecar beside this recipe.
  use_group_code: Land_State_Code
  year_built: YEARBUILT
  # TOTSQFTLVG is total square feet *living*, i.e. genuine floor area, which
  # is what the registry's area_sqft means. Do not confuse with LANDSIZEFT
  # (lot size) below, which is mapped to area_ac in acres instead.
  area_sqft: TOTSQFTLVG
  area_ac: LANDSIZEAC
  land_value: LANDVALUE
  improvement_value: IMPVALUE
  # The source names this column TOTALVALUE, and it holds exactly that:
  # LANDVALUE + IMPVALUE to the dollar on 100% of Fort Bend parcels. It
  # is `total_value`, not a separate market appraisal -- mapped to
  # `market_value` before, which nothing downstream reads.
  total_value: TOTALVALUE
  address: SITUS
  address_number: SITUSSNO
  address_street: SITUSSNM
  owner_name: OWNERNAME
  owner_address: OADDR1
  owner_city: OWNERCITY
  owner_admin2_id_admin1: OWNERSTATE
  owner_postal_code: OWNERZIP
  legal_description: LEGAL
  last_sale_date: DEEDDATE

columns_to_categorical:
  - use_group_code
  - owner_admin2_id_admin1

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
