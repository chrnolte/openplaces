# Recipe: Fort Bend County, TX appraisal roll, building segments,
# bathrooms (FBCAD). Same member (Segment table), MA-only filter, row
# rule and join key as US-TX-FOB_property-fbcad-2026_bedrooms; read its
# header first. This header covers what differs for baths.
#
# WHAT THE NUMBER IS, AND WHAT IS NOT KNOWN. The segment's Plumbing
# column is a bath count, not a fixture count: on the same MA row its
# median rises with bedrooms (1 bedroom: 1, 3: 2, 4: 3, 5: 4). It is a
# whole number on all but 6 of 287,292 rows (2.5, 3.5, 4.5), and the
# export has no half-bath field. Whether the whole number counts full
# baths only or is a total rounded to whole baths cannot be told from
# the data. It is mapped to n_bathrooms, whose registry definition
# covers a full-bath-only source (the full count), but a total that
# rounds half baths away would read high or low against counties that
# add 0.5 per half bath. This is a question for FBCAD.
#
# MEASURED on the post-certification 2026 export: 287,292 MA rows carry
# Plumbing, on the same rows as bedrooms; by improvement class, 98.2%
# of single-family (A), 69.8% of multifamily (B), 41.1% of rural
# improved (E), 0.4% of mobile homes (M). Values 1 to 13, median 2,
# no zeros.

description: >-
  Fort Bend County, TX Property Data Export, segment table: whole-number
  bath count on each building's main-area segment, summed to the account.

admin_id: US-TX-FOB

entity:
  entity_type: property
  source:
    source_id: fbcad
    # Same download as the roll; see its terms note.
    license: >-
      no terms on the downloads page; GIS page disclaimer: 'as is', no
      liability, user indemnifies FBCAD
    terms_url: "https://www.fbcad.org/gis-data/"
    redistribution_restricted: null
    portal_url: "https://www.fbcad.org/certified-and-supplements-reports/"
    download_url: "https://www.fbcad.org/wp-content/uploads/2026/07/PropertyData-Post2026Cert-Redacted.zip"
  version: 2026

compressed_file_name: "PropertyData-Post2026Cert-Redacted.zip"
uncompressed_file_name: "Property Data Export   Segment/PropertyDataExport4695919.txt"

process_by:
  admin_level: 3

csv_dtype: str

columns:
  n_bathrooms: Plumbing

query: "Type == 'MA' and n_bathrooms == n_bathrooms"

# One row per building, then summed across buildings.
drop_duplicates: [QuickRefID, InstanceID]

transformations:
  # Kept as shipped, "R" included: see the roll's JOIN KEY.
  - type: string
    operation: strip
    input: QuickRefID
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms

drop_columns:
  - QuickRefID
  - InstanceID
  - Type

aggregation_function:
  n_bathrooms: sum

supplements: US-TX-FOB_property-fbcad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
