# Recipe: Fort Bend County, TX appraisal roll, building segments, main
# area features (FBCAD). Same member (the Segment table) and row rule as
# US-TX-FOB_property-fbcad-2026_bedrooms; read its header first.
#
# WHAT IS MAPPED. The building's descriptors sit on its main-area (MA)
# segment row, in FBCAD's own codes (no legend ships with the export):
#   Class       quality_grade (e.g. RA1+, RG2: a residential class with
#               a quality letter, as coded)
#   ExtFinish   exterior_wall (BV, MF, WF, SP and so on)
#   HeatAC      heating_type, as coded (CHA on 97% of MA rows)
#   HeatAC      has_central_air: CHA true; WU, WH, CH, FH and NO false
#               (a wall unit, a heater only, or none); combined codes
#               stay null
#   ActYrBuilt  year_built (the earliest building's; 0 and years
#               outside 1700 to 2026 are nulled)
#   EffYrBuilt  effective_year_built (equals ActYrBuilt on 99.8%)
#   Fireplace   n_fireplaces, from the list of fireplace codes: NONE is
#               0, one code 1, two codes (comma or semicolon) 2, up to 4
#   Foundation  foundation_description (CS, BL, PB and so on, as coded;
#               curate translates it into the coded foundation_type)
# Not mapped: Roof (roof shape and covering joined in one field, in an
# order that varies, with no legend to split them) and Plumbing (read by
# _bathrooms). The export has no construction or frame field.
#
# REDUCTION. One MA row per building (drop_duplicates, as for
# bedrooms); codes take the first building's, flags the max, the
# effective year the max, fireplaces the sum.
#
# MEASURED (2026-09-13): 300,993 MA rows; share of the 278,846
# single-family accounts (an improvement with StateCode A1) with a
# value. quality_grade 99.8%, exterior_wall 99.8%, heating_type 99.7%,
# has_central_air 99.6% (true 98.2%, false 1.5%),
# foundation_description 99.8% (CS on 98%), year_built 99.8% (median
# 2006), effective_year_built 99.6%, n_fireplaces 99.5% (0 on 30.4%).

description: >-
  Fort Bend County, TX Property Data Export, segment table: class,
  exterior finish, heating and air, effective year and fireplaces from
  each main area.

admin_id: US-TX-FOB

entity:
  entity_type: property
  source:
    source_id: fbcad
    # Same download as the roll; see its terms note.
    license: >-
      no terms on the downloads page; GIS page disclaimer: 'as is', no
      liability, user indemnifies FBCAD
    terms_url: "https://www.fbcad.org/gis-data/"
    redistribution_restricted: null
    portal_url: "https://www.fbcad.org/certified-and-supplements-reports/"
    download_url: "https://www.fbcad.org/wp-content/uploads/2026/07/PropertyData-Post2026Cert-Redacted.zip"
  version: 2026

compressed_file_name: "PropertyData-Post2026Cert-Redacted.zip"
uncompressed_file_name: "Property Data Export   Segment/PropertyDataExport4695919.txt"

process_by:
  admin_level: 3

csv_dtype: str

columns:
  quality_grade: Class
  exterior_wall: ExtFinish
  heating_type: HeatAC
  effective_year_built: EffYrBuilt
  year_built: ActYrBuilt
  foundation_description: Foundation

query: "Type == 'MA'"

# One row per building; see the bedrooms recipe's ROW RULE.
drop_duplicates: [QuickRefID, InstanceID]

transformations:
  # Kept as shipped, "R" included: see the roll's JOIN KEY.
  - type: string
    operation: strip
    input: QuickRefID
    output: parcel_id_assessor
  - type: string
    operation: strip
    input: heating_type
    output: heating_type
  - type: string
    operation: strip
    input: foundation_description
    output: foundation_description
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: "year_built.where((year_built >= 1700) & (year_built <= 2026))"
    inputs: [year_built]
    output: year_built
  - type: remap
    input: heating_type
    mapping:
      "CHA": true
      "WU": false
      "WH": false
      "CH": false
      "FH": false
      "NO": false
    output: has_central_air
  # Count the listed codes; NONE (last, so it wins) is 0.
  - type: remap_pattern
    input: Fireplace
    patterns:
      - pattern: '^\s*[A-Za-z]+\s*$'
        value: 1
      - pattern: '^\s*[A-Za-z]+\s*[,;]\s*[A-Za-z]+\s*$'
        value: 2
      - pattern: '^\s*[A-Za-z]+(\s*[,;]\s*[A-Za-z]+){2}\s*$'
        value: 3
      - pattern: '^\s*[A-Za-z]+(\s*[,;]\s*[A-Za-z]+){3}\s*$'
        value: 4
      - pattern: '^\s*[Nn][Oo][Nn][Ee]\s*$'
        value: 0
    output: n_fireplaces
  - type: unary
    operation: to_numeric
    input: n_fireplaces
    output: n_fireplaces

drop_columns:
  - QuickRefID
  - InstanceID
  - Type

aggregation_function:
  quality_grade: first
  exterior_wall: first
  heating_type: first
  foundation_description: first
  has_central_air: max
  effective_year_built: max
  year_built: min
  n_fireplaces: sum

supplements: US-TX-FOB_property-fbcad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: main-area
