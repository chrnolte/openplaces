# Recipe to import the parcel database of the state of Texas, US

description: >-
  Texas statewide parcel database from the Texas Geographic Information Office (2025).

# Administrative unit identifier: where does this data come from?
admin_id: US-TX

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: parcel
   # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: txgio
    # Checked 2026-08-20: the TxGIO site asserts "Content of this site
    # copyright Texas Geographic Information Office and Texas Water
    # Development Board unless otherwise noted" -- a claim over the site,
    # not a licence for the StratMap parcel data this recipe downloads,
    # for which no separate terms were found.
    license: "unknown (site content copyright asserted; no data licence found)"
    terms_url: "https://geographic.texas.gov/"
    redistribution_restricted: null
    portal_url: "https://tnris.org/stratmap/land-parcels.html"
    # URL to download
    download_url: "https://tnris-data-warehouse.s3.us-east-1.amazonaws.com/LCD/collection/stratmap-2025-land-parcels/stratmap25-landparcels_48_lp.zip"
  version: 2025

# Name of compressed file (set to skip re-downloading)
compressed_file_name: "stratmap25-landparcels_48_lp.zip"

# Name of uncompressed file (set to skip re-extracting)
uncompressed_file_name: "stratmap25-landparcels_48.gdb"

# Column that splits the data into chunks for processing
# (avoids reading very large geodatabase into memory)
process_by:
  admin_level: 3
  admin_id_column: FIPS
  admin_id_crosswalk:
    admin_level: 3
    admin_id_column: admin3_id_admin1
    admin_recipe_id: "US_admin-census-2021_admin3"

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  parcel_id_assessor: Prop_ID
  parcel_id_admin2_2: GEO_ID
  legal_description: LEGAL_DESC
  address: SITUS_ADDR
  address_number: SITUS_NUM
  address_street_directional: SITUS_STRE
  address_street: SITUS_ST_1
  address_street_2: SITUS_ST_2
  city: SITUS_CITY
  legal_area: LEGAL_AREA
  legal_area_unit: LGL_AREA_UNIT
  # Both land-use fields are codes, not text, so they land in the *_code
  # slots and the textual use_group/use_subgroup are produced by the
  # sidecar crosswalk below. Mapping them straight to use_group/use_subgroup
  # (as this recipe used to) silently disabled every downstream classifier
  # that matches land-use words: measured on Jefferson, the curate-stage
  # parcel occupancy keywords hit 27 of 122,202 rows (0.0%), against 44.1%
  # for a state whose source ships English (NC nconemap).
  use_group_code: STAT_LAND_USE     # State category; see remap sidecar
  use_subgroup_code: LOC_LAND_USE   # Appraisal-district local code
  year_built: YEAR_BUILT
  owner_name: OWNER_NAME
  owner_name_co: NAME_CARE
  owner_address: MAIL_ADDR
  owner_address_street: MAIL_LINE1
  owner_address_street_2: MAIL_LINE2
  owner_city: MAIL_CITY
  owner_admin2_id_admin1: MAIL_STAT
  owner_postal_code: MAIL_ZIP
  tax_year: TAX_YEAR
  land_value: LAND_VALUE
  improvement_value: IMP_VALUE
  # MKT_VALUE is the parcel's land-plus-structure total, not a separate
  # market appraisal standing beside an assessed one: Texas appraises at
  # market value by statute (Tax Code 23.01), and the data agrees --
  # MKT_VALUE equals LAND_VALUE + IMP_VALUE to the dollar on 93.6% of
  # Kleberg and 100% of Victoria parcels (median ratio 1.000). So it is
  # `total_value`, the column the curated parcel product and the CHEER
  # apportionment actually read. Mapped to `market_value` before, which
  # no code and no downstream recipe consumes, leaving every Texas
  # county with an empty total.
  total_value: MKT_VALUE
  source_date: DATE_ACQ

# The source ships every attribute as text, numbers included. Cast the
# registry-numeric columns at ingest, where the dtype contract belongs --
# left as strings, improvement_value crashed every coastal-Texas county's
# curate until the curate-boundary coercion (see io/curator) papered over
# it; this is the owed root fix.
transformation_patterns:
  - type: unary
    operation: to_numeric
    pattern: "{column}"
    apply_to_columns:
      - land_value
      - improvement_value
      - total_value
      - tax_year
      - legal_area
      - year_built

# Columns to be cast to categorical (saves space)
columns_to_categorical:
  - legal_area_unit
  - use_group_code
  - use_subgroup_code

notes: >-
  STAT_LAND_USE carries the Texas Comptroller state property category. Only
  its first character is statewide-standard (A single-family, B multifamily,
  C vacant, D agricultural, E rural improved, F commercial/industrial,
  G minerals, J utilities, M mobile home, O residential inventory,
  X exempt); the second character is set by the appraisal district and
  varies -- Jefferson alone uses 88 distinct two-character codes, of which
  only A1, A2, B1-B4, C1-C2, D1, D3-D9, E1-E7, F1-F6, J2 and M1 are the
  published sub-codes. The crosswalk is therefore keyed on one character,
  which _apply_remap_csvs truncates to automatically. Validated against the
  independent FEMA structure classification on Jefferson: A is 98.0% Single
  Family (n=74,964), B is 89.7% Multi Family (n=1,193), E is 89.1% Single
  Family, D is 68.4% Agricultural. Known cost of the one-character key:
  A2 (mobile homes) is folded into A (single-family) -- 395 of 78,393 A rows
  in Jefferson, 0.5%. The manufactured-home signal survives in
  use_subgroup_code (Jefferson's local RMH covers 5,819 rows), which a
  per-county crosswalk can recover later.

# Standardized matching key (auto conversion; processed per admin3).
parcel_id_local:
  source: parcel_id_assessor
  kind: parcel
