# Recipe: Taylor County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-TAY_property-taylorcad-2026; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2027 (0 is the district's
# blank).
#
# TYPES. living area: types MA, MA2, MA1.5. garage: types AG, DG, BG.
# carport: types AC, CP. porch: types OP, SP, EP, GP, EPL. deck and
# patio: types PC, WD, AP. swimming pool: types PL. basement (finished
# and unfinished): types LB. solar device: types SO, SOLAR. accessory
# dwelling: types GA.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 45,222
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 99.0% (B
# 99.7%, E 88.4%, M 91.9%), per-property median 1560. garage_area_sqft A
# 66.9% (B 43.5%, E 52.5%, M 1.8%), per-property median 483. has_garage
# A 66.9% (B 43.5%, E 52.6%, M 1.8%). garage_type A 66.9% (B 43.5%, E
# 52.6%, M 1.8%), 3 distinct codes. has_carport A 21.3% (B 22.7%, E
# 31.5%, M 6.2%). porch_area_sqft A 89.5% (B 82.2%, E 74.4%, M 21.3%),
# per-property median 158. deck_area_sqft A 4.5% (B 0.4%, E 4.7%, M
# 6.4%), per-property median 216. has_pool A 3.5% (B 1.7%, E 6.3%, M
# 0.0%). basement_area_sqft A 0.0% (B 0.1%, E 0.2%, M 0.0%),
# per-property median 380. has_basement A 0.0% (B 0.1%, E 0.2%, M 0.0%).
# has_solar A 0.0% (B 0.1%, E 0.0%, M 0.0%). has_accessory_dwelling A
# 1.0% (B 0.9%, E 0.9%, M 0.0%). quality_grade A 99.0% (B 99.7%, E
# 88.4%, M 91.9%), 467 distinct codes. year_built A 99.0% (B 98.1%, E
# 88.0%, M 91.8%), per-property median 1967. effective_year_built A
# 99.0% (B 99.6%, E 88.2%, M 91.7%), per-property median 1967.

description: >-
  Taylor County, TX certified appraisal roll, improvement detail member: living, garage,
  porch and deck areas, class and feature flags per property.

admin_id: US-TX-TAY

entity:
  entity_type: property
  source:
    source_id: taylorcad
    # Same download as the roll; see its terms note.
    license: >-
      download page disclaimer, verbatim: 'The Taylor County Appraisal District has
      developed this product solely for internal use. This product is not developed
      for resale or profit to the general public and resale of data under a personal,
      sole proprietorship, or corporate label is considered out of the care, custody
      and control, of the Taylor County Appraisal District and any applicable
      liability is assumed through fraudulent use of the data.'
    redistribution_restricted: null
    # Marked as on the roll; see its note.
    resale_restricted: true
    portal_url: "https://taylor-cad.org/data-downloads/"
    download_url: "https://taylor-cad.org/wp-content/uploads/2026/07/TaylorCAD_2026_Certified_Appr_Roll_as_of_Certification_31Jul26.zip"
  version: 2026

compressed_file_name: "TaylorCAD_2026_Certified_Appr_Roll_as_of_Certification_31Jul26.zip"
uncompressed_file_name: "2026-07-31_000738_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MA1.5']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['AG', 'DG', 'BG']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['AG', 'DG', 'BG']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['AG', 'DG', 'BG']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['AC', 'CP']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['OP', 'SP', 'EP', 'GP',
      'EPL']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['PC', 'WD', 'AP']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['PL']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['LB']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['LB']
        output: true
    output: has_basement
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['SO', 'SOLAR']
        output: true
    output: has_solar
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['GA']
        output: true
    output: has_accessory_dwelling
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MA1.5']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MA1.5']) &
      (year_built > 1800) & (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MA1.5'])
      & (effective_year_built > 1800) & (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max
  has_solar: max
  has_accessory_dwelling: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-TAY_property-taylorcad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
