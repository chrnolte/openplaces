# Recipe: Taylor County, TX certified appraisal roll, improvement
# features, bathrooms (Taylor CAD). Same member (PACS File #9) as
# US-TX-VIC_property-victoriacad-2026_bedrooms; read its header first.
# This header covers what differs for Taylor.
#
# Taylor's 'Plumbing' attribute mixes two code families. The numeric
# codes (1 to 11) are whole bath counts, not fixture counts: median 2,
# and the bath count rises with bedrooms. The letter codes (A, B, C, D,
# E, F and a few others) are about an eighth of the rows. Read against
# bedrooms, each of A, B, C sits between two numerals (A between 1 and
# 2, B between 2 and 3, C between 3 and 4), which suggests halves (A =
# 1.5 and so on), but that is an inference the district does not
# document. It is NOT encoded: the query keeps numeric codes only, so a
# building coded by letter carries no bath count until the district
# confirms the code table.
#
# Because a numeric code carries no half, the value is the whole-bath
# count; the registry's n_bathrooms says that is what it holds where a
# source publishes no halves. The query keeps codes that are a plain
# number of one or two integer digits, with or without decimals ('2',
# '2.5', '.5'), and not zero. Zero, three-digit, text and letter codes
# are left out (listed in MEASURED). Values the query keeps but that are
# implausible for one building are left for curate's range checks.
#
# MEASURED on the 2026 export: 'Plumbing' on 59,210 rows over 53,131
# properties. The query drops 6,946 rows: the letter codes (B 2,890, A
# 2,684, C 1,005, D 224, E 41, N 19, F 15, I 15, G 2, H 1, S 1) and '0'
# (49). After the row rule, 47,162 properties, median 2, p99 4, no
# halves. Coverage (value above 0) is 87.2% of the 45,222 single-family
# (A) properties, 90.8% of the 1,475 multifamily (B), 73.6% of the 3,709
# rural improved (E) and 87.9% of the 1,105 mobile homes (M). Counting
# letter-coded buildings too, single-family coverage would be 99.0%: the
# letters cost about 12 points.
#
# ROW RULE. 2,624 improvements carry two or more kept rows, 92% of them
# with equal values, so the rows mostly repeat one building's figure
# across its components. drop_duplicates keeps the first row per
# (prop_id, imprv_id), and aggregation_function sums distinct buildings
# to the property. The repeats sit on OPEN PORCH, CANOPY and upper-floor
# details; summing all rows would change 5.45% of properties, and over
# the 155 single-family improvements whose rows disagree, improvement
# value sits nearer the first row's count in 81%.

description: >-
  Taylor County, TX certified appraisal roll, improvement features member: bathrooms
  per building from numeric codes only, summed to the property.

admin_id: US-TX-TAY

entity:
  entity_type: property
  source:
    source_id: taylorcad
    # Same download as the roll; see its terms note.
    license: >-
      download page disclaimer, verbatim: 'The Taylor County Appraisal District has
      developed this product solely for internal use. This product is not developed
      for resale or profit to the general public and resale of data under a personal,
      sole proprietorship, or corporate label is considered out of the care, custody
      and control, of the Taylor County Appraisal District and any applicable
      liability is assumed through fraudulent use of the data.'
    redistribution_restricted: null
    # Marked as on the roll; see its note.
    resale_restricted: true
    portal_url: "https://taylor-cad.org/data-downloads/"
    download_url: "https://taylor-cad.org/wp-content/uploads/2026/07/TaylorCAD_2026_Certified_Appr_Roll_as_of_Certification_31Jul26.zip"
  version: 2026

compressed_file_name: "TaylorCAD_2026_Certified_Appr_Roll_as_of_Certification_31Jul26.zip"
uncompressed_file_name: "2026-07-31_000738_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features), 87 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Plumbing'
  and n_bathrooms.str.fullmatch(
  '(?!0+([.]0+)?$)([0-9]{1,2}([.][0-9]+)?|[.][0-9]+)',
  na=False)

# One row per building; see ROW RULE.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_bathrooms: sum

# Details the roll's properties: joined by link_by_id, skipped
# by the property spine's union.
supplements: US-TX-TAY_property-taylorcad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
