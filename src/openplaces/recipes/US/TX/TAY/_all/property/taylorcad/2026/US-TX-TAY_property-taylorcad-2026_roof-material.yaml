# Recipe: Taylor County, TX certified appraisal roll, improvement
# features member (PACS File #9): roof_material from the district's
# 'Roof Covering' attribute. Same download and File #9 row shape as the
# roll's room-count supplements; read US-TX-TAY_property-taylorcad-2026
# for the source and its terms.
#
# READING. The district's code, kept as published (no crosswalk).
# drop_duplicates keeps the first row per building, and the property
# takes the first building's code.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value): A is the 45,222 single-family properties (improvement state
# class A, File #7); B, E and M the other residential classes.
# roof_material A 98.5% (B 95.2%, E 87.2%, M 91.0%), 15 distinct codes.

description: >-
  Taylor County, TX certified appraisal roll, improvement features member: roof_material
  per building, reduced to the property.

admin_id: US-TX-TAY

entity:
  entity_type: property
  source:
    source_id: taylorcad
    # Same download as the roll; see its terms note.
    license: >-
      download page disclaimer, verbatim: 'The Taylor County Appraisal District has
      developed this product solely for internal use. This product is not developed
      for resale or profit to the general public and resale of data under a personal,
      sole proprietorship, or corporate label is considered out of the care, custody
      and control, of the Taylor County Appraisal District and any applicable
      liability is assumed through fraudulent use of the data.'
    redistribution_restricted: null
    # Marked as on the roll; see its note.
    resale_restricted: true
    portal_url: "https://taylor-cad.org/data-downloads/"
    download_url: "https://taylor-cad.org/wp-content/uploads/2026/07/TaylorCAD_2026_Certified_Appr_Roll_as_of_Certification_31Jul26.zip"
  version: 2026

compressed_file_name: "TaylorCAD_2026_Certified_Appr_Roll_as_of_Certification_31Jul26.zip"
uncompressed_file_name: "2026-07-31_000738_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features), 87 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  roof_material: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Roof Covering'

# One row per building.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  roof_material: first

supplements: US-TX-TAY_property-taylorcad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: roof-material
