# Recipe: Taylor County, TX certified appraisal roll, land detail member
# (PACS File #10, one row per land segment): street frontage. Same
# download as US-TX-TAY_property-taylorcad-2026; read that roll's header
# for the source and its terms.
#
# READING. effective_front is the segment's effective front footage, the
# frontage the district prices a front-foot lot on (adjusted for shape,
# not a surveyed lot line). Zero means the segment is not priced by the
# front foot and is read as missing. Segments whose land type
# description names water (water, lake, river, canal, creek, bay, shore,
# beach, marina) are left out, so a waterfront footage is never read as
# street frontage. A property with several segments takes the largest
# frontage.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value): A is the 45,222 single-family properties (improvement state
# class A, File #7); B, E and M the other residential classes.
# frontage_ft A 91.5% (B 97.6%, E 8.2%, M 5.3%).

description: >-
  Taylor County, TX certified appraisal roll, land detail member: effective street
  frontage per property, in feet.

admin_id: US-TX-TAY

entity:
  entity_type: property
  source:
    source_id: taylorcad
    # Same download as the roll; see its terms note.
    license: >-
      download page disclaimer, verbatim: 'The Taylor County Appraisal District has
      developed this product solely for internal use. This product is not developed
      for resale or profit to the general public and resale of data under a personal,
      sole proprietorship, or corporate label is considered out of the care, custody
      and control, of the Taylor County Appraisal District and any applicable
      liability is assumed through fraudulent use of the data.'
    redistribution_restricted: null
    # Marked as on the roll; see its note.
    resale_restricted: true
    portal_url: "https://taylor-cad.org/data-downloads/"
    download_url: "https://taylor-cad.org/wp-content/uploads/2026/07/TaylorCAD_2026_Certified_Appr_Roll_as_of_Certification_31Jul26.zip"
  version: 2026

compressed_file_name: "TaylorCAD_2026_Certified_Appr_Roll_as_of_Certification_31Jul26.zip"
uncompressed_file_name: "2026-07-31_000738_APPRAISAL_LAND_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #10 (Land Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # land_seg_id
  - [filler, 10] # land_type_cd
  - [land_type_desc, 25]
  - [filler, 5] # state_cd
  - [filler, 1] # land_seg_homesite
  - [filler, 14] # size_acres
  - [filler, 14] # size_square_feet
  - [effective_front, 14]

columns:
  frontage_ft: effective_front

query: >-
  ~land_type_desc.str.upper().str.contains(
  'WATER|LAKE|RIVER|CANAL|CREEK|BAY|SHORE|BEACH|MARINA', na=False)

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: frontage_ft
    output: frontage_ft
  - type: expression
    expression: frontage_ft.where(frontage_ft > 0)
    inputs: [frontage_ft]
    output: frontage_ft

drop_columns:
  - land_type_desc

aggregation_function:
  frontage_ft: max

supplements: US-TX-TAY_property-taylorcad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: frontage
