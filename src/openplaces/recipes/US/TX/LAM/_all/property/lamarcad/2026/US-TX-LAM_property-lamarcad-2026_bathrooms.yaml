# Recipe: Lamar County, TX appraisal roll, improvement features,
# bathrooms (Lamar CAD). Sibling of US-TX-LAM_property-lamarcad-2026;
# see that recipe's header for the download, the pre-certification
# vintage and the join key.
#
# SOURCE MEMBER. PACS File #9, APPRAISAL_IMPROVEMENT_DETAIL_ATTR (87
# characters wide, unchanged in layout 8.0.33): one row per improvement
# detail per attribute.
#
# Lamar's "Plumbing" attribute is a bath count with halves as .5, not a
# fixture count: codes "2", "1", "2.5", "1.5", "3", "4", "3.5", median
# 2, p90 2.5. "0" (32 rows) is nulled as not recorded. A single "52" is
# a keying error left for curate's range checks.
#
# MEASURED on the 2026-04-28 export: 18,651 rows over 17,775
# properties. Of the properties whose improvements carry each state
# class (File #7): 91.2% of 13,664 single-family (A), 80.8% of 574
# multifamily (B), 71.1% of 6,489 rural improved (E), 2.7% of 447
# mobile homes (M).
#
# ROW RULE. 139 of 18,455 improvements carry two or more rows, 47% of
# them equal; most sit on two living-area details (LA+LA) or apartment
# details (APT+APT). The first row per (prop_id, imprv_id) is kept, then
# buildings are summed: first differs from max on 6 property totals,
# and summing within the building would change 114 (0.6%).
#
# NOT MAPPED. "Number of Bedrooms" is on 2,255 properties, 8.8% of
# single-family (A), under the 25% threshold. No room or story
# attribute exists.

description: >-
  Lamar County, TX appraisal roll (April 2026), improvement features
  member: bathrooms per building (halves as .5), summed to the property.

admin_id: US-TX-LAM

entity:
  entity_type: property
  source:
    source_id: lamarcad
    # Same download as the roll; see its terms note.
    license: "unknown (no terms on the Public Info page)"
    redistribution_restricted: null
    portal_url: "https://lamarcad.org/public-info/"
    download_url: "https://lamarcad.org/wp-content/uploads/2026/06/notice-of-Appraised-value-open-records.zip"
  version: 2026

compressed_file_name: "notice-of-Appraised-value-open-records.zip"
uncompressed_file_name: "2026-04-28_000261_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

query: "imprv_attr_desc == 'Plumbing'"

# One row per building; see the header's ROW RULE.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms
  - type: unary
    operation: null_if_equal
    input: n_bathrooms
    args:
      value: 0
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_bathrooms: sum

supplements: US-TX-LAM_property-lamarcad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
