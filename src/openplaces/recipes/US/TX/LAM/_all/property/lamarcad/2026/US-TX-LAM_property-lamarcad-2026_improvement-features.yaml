# Recipe: Lamar County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-LAM_property-lamarcad-2026; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2027 (0 is the district's
# blank).
#
# AG and DG describe themselves only by their code; they are read as
# attached and detached garages (median 483 and 528 sq ft). CNPY is
# described as 'PORCH' and read as one.
#
# TYPES. living area: types LA, MA, AA. garage: types AG, DG, AGF2,
# DGU2, GAR. carport: types CPT, CRPT, CP. porch: types PORCHES, CNPY,
# PR, SP. deck and patio: types WD, PATIO, PC, PO. swimming pool: types
# POOL, POOLTA.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 13,664
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 93.1% (B 3.4%,
# E 78.5%, M 2.9%), per-property median 1515. garage_area_sqft A 48.2%
# (B 10.7%, E 31.6%, M 1.5%), per-property median 473.5. has_garage A
# 48.2% (B 10.7%, E 31.6%, M 1.7%). garage_type A 48.2% (B 10.7%, E
# 31.6%, M 1.7%), 5 distinct codes. has_carport A 30.4% (B 11.3%, E
# 36.5%, M 19.3%). porch_area_sqft A 89.5% (B 92.1%, E 78.5%, M 12.0%),
# per-property median 192. deck_area_sqft A 8.6% (B 1.4%, E 12.2%, M
# 19.8%), per-property median 227. has_pool A 4.2% (B 0.5%, E 5.7%, M
# 0.0%). quality_grade A 93.1% (B 3.4%, E 78.5%, M 2.9%), 51 distinct
# codes. year_built A 46.2% (B 1.8%, E 48.2%, M 1.9%), per-property
# median 1986. effective_year_built A 84.6% (B 3.2%, E 74.7%, M 2.6%),
# per-property median 1980.

description: >-
  Lamar County, TX certified appraisal roll, improvement detail member: living, garage,
  porch and deck areas, class and feature flags per property.

admin_id: US-TX-LAM

entity:
  entity_type: property
  source:
    source_id: lamarcad
    # Same download as the roll; see its terms note.
    license: "unknown (no terms on the Public Info page)"
    redistribution_restricted: null
    portal_url: "https://lamarcad.org/public-info/"
    download_url: "https://lamarcad.org/wp-content/uploads/2026/06/notice-of-Appraised-value-open-records.zip"
  version: 2026

compressed_file_name: "notice-of-Appraised-value-open-records.zip"
uncompressed_file_name: "2026-04-28_000261_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['LA', 'MA', 'AA']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['AG', 'DG', 'AGF2', 'DGU2',
      'GAR']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['AG', 'DG', 'AGF2', 'DGU2', 'GAR']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['AG', 'DG', 'AGF2',
      'DGU2', 'GAR']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['CPT', 'CRPT', 'CP']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['PORCHES', 'CNPY', 'PR',
      'SP']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['WD', 'PATIO', 'PC', 'PO']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['POOL', 'POOLTA']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['LA', 'MA', 'AA']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['LA', 'MA', 'AA']) & (year_built
      > 1800) & (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['LA', 'MA', 'AA']) &
      (effective_year_built > 1800) & (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-LAM_property-lamarcad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
