# Recipe: Victoria County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-VIC_property-victoriacad-2026; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is not mapped here: the county's ..._improvement-detail
# recipe already carries it.
#
# LEFT OUT. CPR ('CARPT/ COV PATIO'), SM3 and CPT name a carport and a
# patio or porch in one type and are read as neither. The enclosed
# garage and porch types that start with MA (MAEG, MAFEG, MAEFP, MAEMP,
# MAEP) are garages and porches here, not living area.
#
# TYPES. living area: types MA_1, MA, MA_1.5, MASF, MA_2, MA2MF, MATD1,
# MATD2, MASB, SM6, MA3MF, MATD1.5, MA2, MA1.5, MAF1.5, MAB1.5, MAF2,
# MA3. garage: types GAR, RG1, RGF, MAEG, DGAR, MAFEG, RGM, EGAR, RGB,
# RGH, RG2. carport: types RC1, SM10. porch: types OP, SM7, SP, EP, OP3,
# OP1, SM1, OP2, MAEFP, MAEMP, MAEP. deck and patio: types SLB, SM5,
# WDK, WDKRA, TPAT, WDKRO, TER. swimming pool: types RP5, RP4, RP3, RP1,
# CP1, CP2. basement (finished and unfinished): types UBAS, BASR.
# finished basement: types BASR.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 28,149
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 95.3% (B
# 99.8%, E 87.5%, M 99.9%), per-property median 1517.5. garage_area_sqft
# A 66.2% (B 25.6%, E 43.7%, M 0.4%), per-property median 496.
# has_garage A 66.2% (B 25.6%, E 43.7%, M 0.4%). garage_type A 66.2% (B
# 25.6%, E 43.7%, M 0.4%), 11 distinct codes. has_carport A 24.5% (B
# 20.8%, E 47.8%, M 16.1%). porch_area_sqft A 82.0% (B 73.7%, E 66.8%, M
# 14.1%), per-property median 110. deck_area_sqft A 28.6% (B 27.4%, E
# 24.2%, M 54.9%), per-property median 180. has_pool A 5.7% (B 6.0%, E
# 7.5%, M 0.0%). basement_area_sqft A 0.0% (B 0.0%, E 0.2%, M 0.0%),
# per-property median 374. has_basement A 0.0% (B 0.0%, E 0.2%, M 0.0%).
# basement_finished_area_sqft A 0.0% (B 0.0%, E 0.0%, M 0.0%),
# per-property median 280. quality_grade A 95.3% (B 99.8%, E 87.5%, M
# 99.9%), 116 distinct codes. effective_year_built A 94.0% (B 99.1%, E
# 87.1%, M 99.8%), per-property median 1991.

description: >-
  Victoria County, TX certified appraisal roll, improvement detail member: living,
  garage, porch and deck areas, class and feature flags per property.

admin_id: US-TX-VIC

entity:
  entity_type: property
  source:
    source_id: victoriacad
    # Same download as the roll; see its terms note.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://victoriacad.org/downloads/"
    download_url: "https://victoriacad.org/wp-content/uploads/2026/07/VCAD-2026-CERTIFIED-ROLL-1.zip"
  version: 2026

compressed_file_name: "VCAD-2026-CERTIFIED-ROLL-1.zip"
uncompressed_file_name: "VCAD 2026 CERTIFIED ROLL/2026-07-28_001892_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MA_1', 'MA', 'MA_1.5',
      'MASF', 'MA_2', 'MA2MF', 'MATD1', 'MATD2', 'MASB', 'SM6', 'MA3MF',
      'MATD1.5', 'MA2', 'MA1.5', 'MAF1.5', 'MAB1.5', 'MAF2', 'MA3']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['GAR', 'RG1', 'RGF', 'MAEG',
      'DGAR', 'MAFEG', 'RGM', 'EGAR', 'RGB', 'RGH', 'RG2']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['GAR', 'RG1', 'RGF', 'MAEG', 'DGAR', 'MAFEG', 'RGM', 'EGAR', 'RGB', 'RGH',
          'RG2']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['GAR', 'RG1', 'RGF',
      'MAEG', 'DGAR', 'MAFEG', 'RGM', 'EGAR', 'RGB', 'RGH', 'RG2']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['RC1', 'SM10']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['OP', 'SM7', 'SP', 'EP',
      'OP3', 'OP1', 'SM1', 'OP2', 'MAEFP', 'MAEMP', 'MAEP']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['SLB', 'SM5', 'WDK', 'WDKRA',
      'TPAT', 'WDKRO', 'TER']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['RP5', 'RP4', 'RP3', 'RP1', 'CP1', 'CP2']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['UBAS', 'BASR']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['UBAS', 'BASR']
        output: true
    output: has_basement
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['BASR']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_finished_area_sqft
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['MA_1', 'MA', 'MA_1.5',
      'MASF', 'MA_2', 'MA2MF', 'MATD1', 'MATD2', 'MASB', 'SM6', 'MA3MF',
      'MATD1.5', 'MA2', 'MA1.5', 'MAF1.5', 'MAB1.5', 'MAF2', 'MA3']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['MA_1', 'MA', 'MA_1.5',
      'MASF', 'MA_2', 'MA2MF', 'MATD1', 'MATD2', 'MASB', 'SM6', 'MA3MF',
      'MATD1.5', 'MA2', 'MA1.5', 'MAF1.5', 'MAB1.5', 'MAF2', 'MA3']) &
      (effective_year_built > 1800) & (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max
  basement_finished_area_sqft: sum
  quality_grade: first
  effective_year_built: min

supplements: US-TX-VIC_property-victoriacad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
