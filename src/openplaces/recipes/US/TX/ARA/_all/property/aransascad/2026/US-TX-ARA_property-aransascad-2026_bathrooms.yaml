# Recipe: Aransas County, TX certified appraisal roll -- improvement
# features, bathrooms (Aransas CAD). Same member (PACS File #9) and row
# rule as US-TX-VIC_property-victoriacad-2026_bedrooms; read its header
# first. This header covers what differs for Aransas.
#
# Aransas's "Plumbing" attribute is a bath count written two ways
# (161 distinct codes, cut at the field's 10 characters):
#   - numbers, 59% of rows: 2, 1, 3, 2.5, 1.5; a total with halves as
#     .5, the registry's n_bathrooms definition;
#   - letter tokens, about 40%: "2 F", "2F", "2F,1H", "1F,1T", "F;H",
#     "2 FULL", where F is a full bath and H a half bath.
# The transformations read a number code as the total, and a token code
# as full + 0.5 x half from the digits before F and before H. Left out
# by the query, so that they count as not recorded:
#   - codes containing T (1F,1T; 2T; about 450 rows): the district's
#     meaning of T (toilet? three-quarter?) is not documented;
#   - codes containing "/" ("2 1/2", "1 3/4") and codes a full 10
#     characters long, which may have lost a token to the cut
#     ("2 FULL, 1");
#   - free text with no count before F or H ("F;H", "1 POWDER",
#     "NONE"), and codes with no nonzero digit ("0").
# A row the query admits always parses to a positive count, because
# link_by_id sums a property whose only rows are null to 0.
# n_half_bathrooms is not mapped: only token codes separate halves, so
# on the number codes the half count is unknown, and a column that is
# zero on one encoding and missing on the other would mislead.
#
# MEASURED on the 2026 export: 10,681 rows over 10,059 properties.
# After cleaning, 53.6% of the 16,816 single-family (A) properties
# carry it, 57.0% of multifamily (B), 42.9% of rural improved (E), 1.0%
# of mobile homes (M); per property median 2, p99 4.5. A few number
# codes write three-quarter baths as .75 (31 properties end in .75), a
# departure from the registry's halves-only definition kept as written
# (see the El Paso bathrooms recipe). Totals above 10 (max 44) are
# keying errors left for curate's range checks.
#
# ROW RULE. 297 of 10,329 improvements carry two or more Plumbing rows
# (each on a separate detail: main area, under-main area, second floor)
# and 51% of those agree, so the rule was measured on the number codes
# against the count expected from the improvement's area (median of
# single-row improvements in the same area decile): first row off by
# 0.98 on average, max by 1.06, sum by 2.45. drop_duplicates keeps the
# first row per building; the sum then adds distinct buildings.

description: >-
  Aransas County, TX certified appraisal roll, improvement features
  member: bathrooms per building (halves as .5), summed to the property.

admin_id: US-TX-ARA

entity:
  entity_type: property
  source:
    source_id: aransascad
    # Same download as the roll; see its terms note.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://aransascad.org/"
    download_url: "https://aransascad.org/wp-content/uploads/2026/07/2026-07-20-Certified-Roll.zip"
  version: 2026

compressed_file_name: "2026-07-20-Certified-Roll.zip"
uncompressed_file_name: "2026-07-20_000723_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS 8.0.34 File #9 (Improvement Features).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

# A number code, or a token code with a count before F or H; see the
# header for what is left out and why.
query: >-
  imprv_attr_desc == 'Plumbing'
  and n_bathrooms.str.len() < 10
  and n_bathrooms.str.contains('^[^T/]*$', na=False)
  and n_bathrooms.str.contains('^[0-9]+(?:[.][0-9]+)?$|[0-9] *[FH]', na=False)
  and n_bathrooms.str.contains('[1-9]', na=False)

# One row per building; see the header's ROW RULE.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  # A number code is the total; token codes leave this null.
  - type: string
    operation: extract_named
    input: n_bathrooms
    args:
      pattern: '^(?P<n>[0-9]+(?:[.][0-9]+)?)$'
    output: bathroom_total
  - type: string
    operation: extract_named
    input: n_bathrooms
    args:
      pattern: '(?P<n>[0-9]+) *F'
    output: full_bathroom_count
  - type: string
    operation: extract_named
    input: n_bathrooms
    args:
      pattern: '(?P<n>[0-9]+) *H'
    output: half_bathroom_count
  - type: unary
    operation: to_numeric
    input: bathroom_total
    output: bathroom_total
  - type: unary
    operation: to_numeric
    input: full_bathroom_count
    output: full_bathroom_count
  - type: unary
    operation: to_numeric
    input: half_bathroom_count
    output: half_bathroom_count
  - type: expression
    expression: "half_bathroom_count * 0.5"
    inputs: [half_bathroom_count]
    output: half_bathroom_equivalent
  # Exactly one encoding fires per row, so the sum is either the number
  # code or full + 0.5 x half; a missing H reads as zero halves.
  - type: aggregate
    operation: sum
    inputs: [bathroom_total, full_bathroom_count, half_bathroom_equivalent]
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id
  - bathroom_total
  - full_bathroom_count
  - half_bathroom_count
  - half_bathroom_equivalent

aggregation_function:
  n_bathrooms: sum

supplements: US-TX-ARA_property-aransascad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
