# Recipe: Aransas County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-ARA_property-aransascad-2026; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2027 (0 is the district's
# blank).
#
# MAS ('UNDER MAIN AREA', the enclosed ground level beneath a raised
# house) is not living area. Boat slips and lifts are not garages,
# carports or elevators.
#
# TYPES. living area: types MA, MA2, MAA, MA3, MHA, MH1, MH2, MH3, MH4,
# MH5, MH6. garage: types GA, DG, GU, DG2, DG3, DG1, GA3, GA2, GA1, GU2,
# GU3. carport: types CP, CPU, CP2, CP1, CP3. porch: types PC, PO, PS,
# PC3, PC2, PG, PO2, PO3, PC1, PS3, PS2, PO1, PS1, PG3, PG2, PG1. deck
# and patio: types PDO, PDC, PDO3, PDO2, PDC3, PDO1, PDC2, PDC1.
# swimming pool: types SWP6, SWP3, SWP5, SWP4, SWP2, SWP1. elevator:
# types EL3, EL1, EL2.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 16,816
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 87.0% (B
# 100.0%, E 86.7%, M 96.8%), per-property median 1402. garage_area_sqft
# A 45.2% (B 35.0%, E 44.8%, M 1.5%), per-property median 528.
# has_garage A 45.3% (B 35.0%, E 44.8%, M 1.5%). garage_type A 45.3% (B
# 35.0%, E 44.8%, M 1.5%), 11 distinct codes. has_carport A 22.8% (B
# 12.0%, E 31.4%, M 24.0%). porch_area_sqft A 71.4% (B 88.0%, E 77.1%, M
# 49.1%), per-property median 248. deck_area_sqft A 24.6% (B 13.0%, E
# 10.5%, M 30.2%), per-property median 256. has_pool A 7.5% (B 4.0%, E
# 3.8%, M 0.0%). has_elevator A 2.2% (B 2.0%, E 0.0%, M 0.0%).
# quality_grade A 87.1% (B 100.0%, E 86.7%, M 97.8%), 440 distinct
# codes. year_built A 86.2% (B 100.0%, E 85.7%, M 93.3%), per-property
# median 1998. effective_year_built A 87.0% (B 100.0%, E 86.7%, M
# 97.9%), per-property median 2005.

description: >-
  Aransas County, TX certified appraisal roll, improvement detail member: living,
  garage, porch and deck areas, class and feature flags per property.

admin_id: US-TX-ARA

entity:
  entity_type: property
  source:
    source_id: aransascad
    # Same download as the roll; see its terms note.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://aransascad.org/"
    download_url: "https://aransascad.org/wp-content/uploads/2026/07/2026-07-20-Certified-Roll.zip"
  version: 2026

compressed_file_name: "2026-07-20-Certified-Roll.zip"
uncompressed_file_name: "2026-07-20_000723_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MAA', 'MA3',
      'MHA', 'MH1', 'MH2', 'MH3', 'MH4', 'MH5', 'MH6']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['GA', 'DG', 'GU', 'DG2',
      'DG3', 'DG1', 'GA3', 'GA2', 'GA1', 'GU2', 'GU3']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['GA', 'DG', 'GU', 'DG2', 'DG3', 'DG1', 'GA3', 'GA2', 'GA1', 'GU2', 'GU3']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['GA', 'DG', 'GU', 'DG2',
      'DG3', 'DG1', 'GA3', 'GA2', 'GA1', 'GU2', 'GU3']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['CP', 'CPU', 'CP2', 'CP1', 'CP3']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['PC', 'PO', 'PS', 'PC3',
      'PC2', 'PG', 'PO2', 'PO3', 'PC1', 'PS3', 'PS2', 'PO1', 'PS1', 'PG3',
      'PG2', 'PG1']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['PDO', 'PDC', 'PDO3', 'PDO2',
      'PDC3', 'PDO1', 'PDC2', 'PDC1']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['SWP6', 'SWP3', 'SWP5', 'SWP4', 'SWP2', 'SWP1']
        output: true
    output: has_pool
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['EL3', 'EL1', 'EL2']
        output: true
    output: has_elevator
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MAA', 'MA3',
      'MHA', 'MH1', 'MH2', 'MH3', 'MH4', 'MH5', 'MH6']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MAA', 'MA3', 'MHA',
      'MH1', 'MH2', 'MH3', 'MH4', 'MH5', 'MH6']) & (year_built > 1800) &
      (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MAA',
      'MA3', 'MHA', 'MH1', 'MH2', 'MH3', 'MH4', 'MH5', 'MH6']) &
      (effective_year_built > 1800) & (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  has_elevator: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-ARA_property-aransascad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
