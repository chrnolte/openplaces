# Recipe: Aransas County, TX certified appraisal roll (Aransas CAD).
# Same PACS 8.0.34 layout, offsets and join-key trap as
# US-TX-VIC_property-victoriacad-2026; see that recipe's header for the
# general shape of this source family. This header covers only what
# differs for Aransas.
#
# SOURCE. No layout spreadsheet ships in the zip. The record width is
# 9,714, the 8.0.34 width, and every mapped field reads as its type at
# the template offsets (prop_val_yr one value, situs_zip 97.8% numeric,
# state codes in the Comptroller vocabulary), so the template stands.
#
# NOTE on coverage, measured on the 2026 export (29,964 rows):
#   land_state_cd   87.9%   imprv_state_cd  64.4%
#   geo_id          99.9%   market_value   100.0%
#
# NOTE on the join key. 81.5% of the roll's zero-stripped prop_ids are
# in TxGIO's Prop_ID and 97.7% of TxGIO's 24,992 Aransas ids are in the
# roll: the roll also carries personal-property and mineral accounts
# that TxGIO leaves out by design.
#
# NEIGHBORHOOD. hood_cd, the district's valuation neighborhood code
# (File #2), is mapped to tax_neighborhood_code as published. MEASURED
# on the 2026 export: A is the 16,816 single-family properties
# (improvement state class A, File #7); B, E and M the other residential
# classes. tax_neighborhood_code A 69.2% (B 86.0%, E 64.8%, M 70.6%),
# 374 distinct codes.

description: >-
  Aransas County, TX certified appraisal roll (PACS 8.0.34 export): state
  land-use codes, legal acreage and market value keyed by property.

admin_id: US-TX-ARA

entity:
  entity_type: property
  source:
    source_id: aransascad
    # Checked 2026-09-12 by fetching the homepage that links the roll:
    # it carries only a site-footer copyright over the website itself
    # and states no terms for the data (aransascad.org/disclaimer/ is
    # 404). Texas appraisal records are public information under the
    # Property Tax Code, but silence is not a grant.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://aransascad.org/"
    download_url: "https://aransascad.org/wp-content/uploads/2026/07/2026-07-20-Certified-Roll.zip"
  version: 2026

compressed_file_name: "2026-07-20-Certified-Roll.zip"
uncompressed_file_name: "2026-07-20_000723_APPRAISAL_INFO.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS 8.0.34 File #2 (Property); offsets as in the Victoria template.
fixed_width:
  - [prop_id, 12]
  - [filler, 5]
  - [prop_val_yr, 5]
  - [filler, 524]
  - [geo_id, 50]
  - [filler, 443]
  - [situs_street_prefx, 10]
  - [situs_street, 50]
  - [filler, 10]
  - [situs_city, 30]
  - [situs_zip, 10]
  - [legal_desc, 255]
  - [filler, 255]
  - [legal_acreage, 16]
  - [abs_subdv_cd, 10]
  - [hood_cd, 10]
  - [filler, 220]
  - [appraised_val, 15]
  - [filler, 801]
  - [imprv_state_cd, 10]
  - [land_state_cd, 10]
  - [filler, 1462]
  - [market_value, 14]
  - [filler, 232]
  - [situs_num, 15]

transformations:
  # legal_acreage carries 4 implied decimals (PACS layout: "Legal
  # Acreage (4 Decimals)"), so it is divided by 10,000.
  - type: unary
    operation: to_numeric
    input: area_ac
    output: area_ac
  - type: expression
    expression: "area_ac / 10000"
    inputs: [area_ac]
    output: area_ac
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor

columns:
  tax_neighborhood_code: hood_cd
  parcel_id_admin2_2: geo_id
  use_group_code: land_state_cd
  use_subgroup_code: imprv_state_cd
  address_number: situs_num
  address_street: situs_street
  city: situs_city
  postal_code: situs_zip
  legal_description: legal_desc
  area_ac: legal_acreage
  # Land-plus-structure market value; see the Victoria template for why
  # this is total_value and not appraised_val.
  total_value: market_value
  tax_year: prop_val_yr

columns_to_categorical:
  - tax_neighborhood_code
  - use_group_code
  - use_subgroup_code

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
