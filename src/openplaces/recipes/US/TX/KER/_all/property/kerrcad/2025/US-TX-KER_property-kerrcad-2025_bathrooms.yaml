# Recipe: Kerr County, TX certified appraisal roll, improvement
# features, bathrooms (KCAD). Same member (PACS File #9) as
# US-TX-VIC_property-victoriacad-2026_bedrooms; read its header first.
# This header covers what differs for Kerr.
#
# Kerr's 'Plumbing' attribute is a bath count with halves folded in as
# .5 (2, 1, 3, 2.5, 1.5 lead; median bath count rises with bedrooms),
# not a fixture count. The query keeps codes that are a plain number of
# one or two integer digits, with or without decimals ('2', '2.5',
# '.5'), and not zero. Zero, three-digit, text and letter codes are left
# out (listed in MEASURED). Values the query keeps but that are
# implausible for one building are left for curate's range checks.
#
# MEASURED on the 2025 export: 'Plumbing' on 18,942 rows over 17,163
# properties. The query drops 511 rows: '0' (487), letter and text codes
# 'MFP' (5), 'PFP', 'S' (4 each), 'C', 'W' (3 each), 'SP', 'HALF BATH',
# '1/2', '31/2' (1 each), and '205' (1). Kept for curate: '24', '12',
# '10' (4 rows). After the row rule, 16,696 properties, median 2, p99 6;
# 14.1% end in .5. The median bath count rises with bedrooms (1 for one,
# 2 for three, 3 for four, 4 for six). Coverage (value above 0) is 80.4%
# of the 15,825 single-family (A) properties, 86.3% of the 336
# multifamily (B), 61.0% of the 4,929 rural improved (E) and 0.4% of the
# 2,470 mobile homes (M).
#
# ROW RULE. 199 improvements carry two or more kept rows and only 52% of
# them agree, so three rules were measured per property: the first row
# per improvement summed across buildings (this recipe), all rows
# summed, and the maximum over all rows. The last two differ from the
# first on 1.16% and 5.70% of properties. The disagreeing rows sit on
# distinct main-area details (MAA, MA2, MA3), and the first row is the
# largest in 82% of them, which reads either as an addition's own count
# (sum) or as a partial repeat (first). Improvement value decides it:
# over the 55 single-family improvements whose rows disagree, the File
# #7 improvement value lies nearer the median value of single-row
# improvements with the first row's count than with the summed count in
# 56%. So drop_duplicates keeps the first row per (prop_id, imprv_id),
# and aggregation_function sums distinct buildings to the property.

description: >-
  Kerr County, TX certified appraisal roll, improvement features member: bathrooms per
  building (halves as .5), summed to the property.

admin_id: US-TX-KER

entity:
  entity_type: property
  source:
    source_id: kerrcad
    # Same download as the roll; see its terms note.
    license: >-
      unknown (no terms found on the exports page or /disclaimer/)
    redistribution_restricted: null
    portal_url: "https://kerrcad.org/appraisal-exports/"
    download_url: "https://kerrcad.org/wp-content/uploads/2025/11/2025-Cert-Export-Files.zip"
  version: 2025

compressed_file_name: "2025-Cert-Export-Files.zip"
uncompressed_file_name: "2025-11-25_004391_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features), 87 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Plumbing'
  and n_bathrooms.str.fullmatch(
  '(?!0+([.]0+)?$)([0-9]{1,2}([.][0-9]+)?|[.][0-9]+)',
  na=False)

# One row per building; see ROW RULE.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_bathrooms: sum

# Details the roll's properties: joined by link_by_id, skipped
# by the property spine's union.
supplements: US-TX-KER_property-kerrcad-2025

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
