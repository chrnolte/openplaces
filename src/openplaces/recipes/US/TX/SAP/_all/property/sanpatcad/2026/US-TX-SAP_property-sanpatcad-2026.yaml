# Recipe: San Patricio County, TX certified appraisal roll (San Patricio
# CAD). Same PACS layout, offsets and join-key trap as
# US-TX-VIC_property-victoriacad-2026; see that recipe's header for the
# general shape of this source family. This header covers only what
# differs for San Patricio.
#
# SOURCE. The download page links an "Appraisal Export Layout 8.0.20"
# PDF from 2018, but the 2026 export is not that version: its header
# record names 8.0.0.34, the record width is 9,714 (the 8.0.34 width),
# and every mapped field reads as its type at the template offsets
# (prop_val_yr one value, situs_zip 91.6% ZIP-shaped, state codes in the
# Comptroller vocabulary, market_value numeric on every row). No layout
# ships in the zip.
#
# NOTE on coverage, measured on the 2026 export (48,963 rows):
#   land_state_cd   84.5%   imprv_state_cd  60.9%
#   geo_id         100.0%   market_value   100.0%
#
# NOTE on the join key. 75.2% of the roll's parcel_id_local values are
# in TxGIO's and 97.5% of TxGIO's 37,762 San Patricio ids are in the
# roll: the roll also carries personal-property (4,342), mineral
# (1,667) and separate mobile-home (1,241) accounts. geo_id matches
# 99.3% of TxGIO's GEO_ID with no normalization.

description: >-
  San Patricio County, TX certified appraisal roll (PACS 8.0.34 export): state
  land-use codes, legal acreage and market value keyed by property.

admin_id: US-TX-SAP

entity:
  entity_type: property
  source:
    source_id: sanpatcad
    # Checked 2026-09-16 by fetching the data-downloads page: it states
    # no terms for the appraisal export (only that the district offers
    # no technical support); its one disclaimer covers the GIS map files
    # (not for legal, engineering or surveying use). No licence, no
    # attribution requirement, nothing on redistribution or resale.
    license: "unknown (no terms stated on the data download page)"
    redistribution_restricted: null
    portal_url: "https://sanpatcad.org/data-downloads/"
    download_url: "https://sanpatcad.org/wp-content/uploads/2026/08/ALL-ENTITIES.zip"
  version: 2026

compressed_file_name: "ALL-ENTITIES.zip"
uncompressed_file_name: "2026-07-27_001687_APPRAISAL_INFO.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS 8.0.34 File #2 (Property); offsets as in the Victoria template.
fixed_width:
  - [prop_id, 12]
  - [filler, 5]
  - [prop_val_yr, 5]
  - [filler, 524]
  - [geo_id, 50]
  - [filler, 443]
  - [situs_street_prefx, 10]
  - [situs_street, 50]
  - [filler, 10]
  - [situs_city, 30]
  - [situs_zip, 10]
  - [legal_desc, 255]
  - [filler, 255]
  - [legal_acreage, 16]
  - [abs_subdv_cd, 10]
  - [hood_cd, 10]
  - [filler, 220]
  - [appraised_val, 15]
  - [filler, 801]
  - [imprv_state_cd, 10]
  - [land_state_cd, 10]
  - [filler, 1462]
  - [market_value, 14]
  - [filler, 232]
  - [situs_num, 15]

transformations:
  # legal_acreage carries 4 implied decimals (PACS layout: "Legal
  # Acreage (4 Decimals)"), so it is divided by 10,000.
  - type: unary
    operation: to_numeric
    input: land_area_ac
    output: land_area_ac
  - type: expression
    expression: "land_area_ac / 10000"
    inputs: [land_area_ac]
    output: land_area_ac
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor

columns:
  tax_neighborhood_code: hood_cd
  parcel_id_admin2_2: geo_id
  use_group_code: land_state_cd
  use_subgroup_code: imprv_state_cd
  address_number: situs_num
  address_street: situs_street
  city: situs_city
  postal_code: situs_zip
  legal_description: legal_desc
  land_area_ac: legal_acreage
  # Land-plus-structure market value; see the Victoria template for why
  # this is total_value and not appraised_val.
  total_value: market_value
  tax_year: prop_val_yr

columns_to_categorical:
  - tax_neighborhood_code
  - use_group_code
  - use_subgroup_code

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
