# Recipe: El Paso County, TX certified appraisal roll -- improvement
# features, bathrooms (El Paso CAD). Same member (PACS File #9) and row
# rule as US-TX-VIC_property-victoriacad-2026_bedrooms; read its header
# first. This header covers what differs for El Paso.
#
# El Paso configures two plumbing attributes, and only one is a bath
# count:
#   - "Plumbing" (read here): a fractional bath total, codes "2.00",
#     "1.00", "2.50", "3.00", "1.50", "1.75" lead; median 1.0 for
#     one-bedroom, 2.0 for three-bedroom and 2.5 for four-bedroom
#     buildings.
#   - "Plumbing - Fixtures" (never read): a fixture count, median 8.
# DEPARTURE from the registry definition: besides halves (.5), the
# district writes three-quarter baths as .75 and quarter baths as .25
# (1.75 on 6,359 rows, 2.75 on 1,398, 2.25 on 492). The registry's
# n_bathrooms counts each half bath as 0.5 and says nothing of these,
# so the values are kept as the district wrote them: a total at most
# 0.25 from full + 0.5 x half. There is no separate half count.
# ".00" (6,650 rows) is left out by the query as not recorded, like the
# bedroom attribute's "0" (the query admits only codes with a nonzero
# digit, because link_by_id sums a property whose only rows are null to
# 0). Codes of 8 and above (about 530 rows: 8.00,
# 11.0, 10.0, 13.0, 20.0, 25.0) look like fixture counts keyed into the
# wrong attribute and are left for curate's range checks.
#
# MEASURED on the 2026 export: 256,812 rows over 244,256 properties.
# After cleaning, 96.3% of the 239,555 single-family (A) properties
# carry it, 79.4% of multifamily (B), 77.3% of rural improved (E), 0.1%
# of mobile homes (M); per property median 2, p99 4.25; 7,841
# properties end in .75 and 896 in .25.
#
# ROW RULE. 1,058 of 255,001 improvements carry two or more rows and
# 59% of those agree, so the rule was measured against the count
# expected from the improvement's area (median of single-row
# improvements in the same area decile): first row off by 0.55 on
# average, max by 1.99, sum by 4.81. drop_duplicates keeps the first row
# per building; the sum then adds distinct buildings.

description: >-
  El Paso County, TX certified appraisal roll, improvement features
  member: bathrooms per building (fractional total), summed to the
  property.

admin_id: US-TX-ELP

entity:
  entity_type: property
  source:
    source_id: elpasocad
    # Same download as the roll; see its terms note.
    license: >-
      public domain per the district ('considered in the public domain
      and is distributed without warranty'); files 'intended for
      development use only'
    terms_url: "https://epcad.org/OpenGovernment"
    redistribution_restricted: null
    portal_url: "https://epcad.org/OpenGovernment"
    download_url: "https://export.epcad.org/datasets/2026_Certified_Export_Files.zip"
  version: 2026

compressed_file_name: "2026_Certified_Export_Files.zip"
uncompressed_file_name: "2026-08-31_003012_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS 8.0.34 File #9 (Improvement Features).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Plumbing'
  and n_bathrooms.str.contains('^[0-9]*[.]?[0-9]+$', na=False)
  and n_bathrooms.str.contains('[1-9]', na=False)

# One row per building; see the header's ROW RULE.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_bathrooms: sum

supplements: US-TX-ELP_property-elpasocad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
