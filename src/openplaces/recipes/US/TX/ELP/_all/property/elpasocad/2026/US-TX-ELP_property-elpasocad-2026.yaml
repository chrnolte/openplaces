# Recipe: El Paso County, TX certified appraisal roll (El Paso Central
# Appraisal District, epcad.org). Same PACS 8.0.34 layout, offsets and
# join-key trap as US-TX-VIC_property-victoriacad-2026; see that
# recipe's header for the general shape of this source family. This
# header covers only what differs for El Paso.
#
# SOURCE. The district's Open Government page links the certified
# export from its own host (export.epcad.org, behind Cloudflare, which
# served the identified client). The layout ships as a separate zip
# ("Appraisal Export Layout - 8.0.34"); every mapped offset matches the
# Victoria template (record width 9,714). The APPRAISAL_INFO member is
# 4.4 GB uncompressed, the largest roll in this family.
#
# NOTE on coverage, measured on the 2026 export (452,068 rows):
#   land_state_cd   90.0%   imprv_state_cd  62.3%
#   geo_id         100.0%   market_value   100.0%
#
# NOTE on the join key. 87.6% of the roll's zero-stripped prop_ids are
# in TxGIO's Prop_ID and 99.8% of TxGIO's 396,734 El Paso ids are in
# the roll: the roll also carries personal-property and mineral
# accounts that TxGIO leaves out by design.
#
# NOTE: the same page also offers an in-house "Property Search" dump
# (tilde-delimited) whose improvement table has living area and year
# built but no room counts; this recipe reads the PACS export instead.
#
# NEIGHBORHOOD. hood_cd, the district's valuation neighborhood code
# (File #2), is mapped to tax_neighborhood_code as published. MEASURED
# on the 2026 export: A is the 239,555 single-family properties
# (improvement state class A, File #7); B, E and M the other residential
# classes. tax_neighborhood_code A 100.0% (B 99.8%, E 98.0%, M 51.8%),
# 3,077 distinct codes.

description: >-
  El Paso County, TX certified appraisal roll (PACS 8.0.34 export): state
  land-use codes, legal acreage and market value keyed by property.

admin_id: US-TX-ELP

entity:
  entity_type: property
  source:
    source_id: elpasocad
    # Checked 2026-09-12 on the Open Government page. Its disclaimer
    # reads: "All information contained herein, is considered in the
    # public domain and is distributed without warranty of any kind",
    # and it describes the export files as "intended for development
    # use only". No resale, redistribution or fee clause and no
    # click-through. Left null rather than false until a person reads
    # "development use only" against the intended use.
    license: >-
      public domain per the district ('considered in the public domain
      and is distributed without warranty'); files 'intended for
      development use only'
    terms_url: "https://epcad.org/OpenGovernment"
    redistribution_restricted: null
    portal_url: "https://epcad.org/OpenGovernment"
    download_url: "https://export.epcad.org/datasets/2026_Certified_Export_Files.zip"
  version: 2026

compressed_file_name: "2026_Certified_Export_Files.zip"
uncompressed_file_name: "2026-08-31_003012_APPRAISAL_INFO.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS 8.0.34 File #2 (Property); offsets as in the Victoria template.
fixed_width:
  - [prop_id, 12]
  - [filler, 5]
  - [prop_val_yr, 5]
  - [filler, 524]
  - [geo_id, 50]
  - [filler, 443]
  - [situs_street_prefx, 10]
  - [situs_street, 50]
  - [filler, 10]
  - [situs_city, 30]
  - [situs_zip, 10]
  - [legal_desc, 255]
  - [filler, 255]
  - [legal_acreage, 16]
  - [abs_subdv_cd, 10]
  - [hood_cd, 10]
  - [filler, 220]
  - [appraised_val, 15]
  - [filler, 801]
  - [imprv_state_cd, 10]
  - [land_state_cd, 10]
  - [filler, 1462]
  - [market_value, 14]
  - [filler, 232]
  - [situs_num, 15]

transformations:
  # legal_acreage carries 4 implied decimals (PACS layout: "Legal
  # Acreage (4 Decimals)"), so it is divided by 10,000.
  - type: unary
    operation: to_numeric
    input: land_area_ac
    output: land_area_ac
  - type: expression
    expression: "land_area_ac / 10000"
    inputs: [land_area_ac]
    output: land_area_ac
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor

columns:
  tax_neighborhood_code: hood_cd
  parcel_id_admin2_2: geo_id
  use_group_code: land_state_cd
  use_subgroup_code: imprv_state_cd
  address_number: situs_num
  address_street: situs_street
  city: situs_city
  postal_code: situs_zip
  legal_description: legal_desc
  land_area_ac: legal_acreage
  # Land-plus-structure market value; see the Victoria template for why
  # this is total_value and not appraised_val.
  total_value: market_value
  tax_year: prop_val_yr

columns_to_categorical:
  - tax_neighborhood_code
  - use_group_code
  - use_subgroup_code

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
