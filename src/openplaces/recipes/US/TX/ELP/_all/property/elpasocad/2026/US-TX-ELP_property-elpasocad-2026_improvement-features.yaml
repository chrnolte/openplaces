# Recipe: El Paso County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-ELP_property-elpasocad-2026; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2027 (0 is the district's
# blank).
#
# LEFT OUT of living area: M ('MAIN', median 173 sq ft, a component
# rather than a floor) and M- ('ADDITION (NO HEAT OR AIR)'). The
# commercial MA1 to MA9 types are left out too.
#
# TYPES. living area: types MA, MU, M+, MG. garage: types G, RG1, DG.
# carport: types C, RC1. porch: types O, SP, DOP, EP, N, P. deck and
# patio: types CPAT, GP, WD, 30P, DCP, TER, 8. swimming pool: types SW,
# SF, SV, SGA, 37, 36. basement (finished and unfinished): types BAS, B,
# MB. finished basement: types MB. solar device: types SLRPNL.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 239,555
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 98.7% (B
# 100.0%, E 82.3%, M 100.0%), per-property median 1510. garage_area_sqft
# A 67.4% (B 31.6%, E 41.6%, M 0.4%), per-property median 420.
# has_garage A 67.4% (B 31.6%, E 41.7%, M 0.4%). garage_type A 67.4% (B
# 31.6%, E 41.7%, M 0.4%), 3 distinct codes. has_carport A 12.0% (B
# 6.3%, E 29.9%, M 6.5%). porch_area_sqft A 85.9% (B 58.0%, E 58.6%, M
# 21.8%), per-property median 77.5. deck_area_sqft A 47.7% (B 24.1%, E
# 29.5%, M 8.4%), per-property median 150. has_pool A 7.8% (B 3.4%, E
# 7.2%, M 0.0%). basement_area_sqft A 0.9% (B 1.5%, E 0.5%, M 0.0%),
# per-property median 490. has_basement A 0.9% (B 1.5%, E 0.5%, M 0.0%).
# basement_finished_area_sqft A 0.2% (B 0.5%, E 0.1%, M 0.0%),
# per-property median 560. has_solar A 0.0% (B 0.0%, E 0.0%, M 0.0%).
# quality_grade A 98.7% (B 100.0%, E 82.3%, M 100.0%), 534 distinct
# codes. year_built A 98.5% (B 99.9%, E 82.2%, M 100.0%), per-property
# median 1991. effective_year_built A 98.6% (B 100.0%, E 82.2%, M
# 99.9%), per-property median 1993.

description: >-
  El Paso County, TX certified appraisal roll, improvement detail member: living,
  garage, porch and deck areas, class and feature flags per property.

admin_id: US-TX-ELP

entity:
  entity_type: property
  source:
    source_id: elpasocad
    # Same download as the roll; see its terms note.
    license: >-
      public domain per the district ('considered in the public domain
      and is distributed without warranty'); files 'intended for
      development use only'
    terms_url: "https://epcad.org/OpenGovernment"
    redistribution_restricted: null
    portal_url: "https://epcad.org/OpenGovernment"
    download_url: "https://export.epcad.org/datasets/2026_Certified_Export_Files.zip"
  version: 2026

compressed_file_name: "2026_Certified_Export_Files.zip"
uncompressed_file_name: "2026-08-31_003012_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MA', 'MU', 'M+', 'MG']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['G', 'RG1', 'DG']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['G', 'RG1', 'DG']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['G', 'RG1', 'DG']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['C', 'RC1']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['O', 'SP', 'DOP', 'EP', 'N',
      'P']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['CPAT', 'GP', 'WD', '30P',
      'DCP', 'TER', '8']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['SW', 'SF', 'SV', 'SGA', '37', '36']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['BAS', 'B', 'MB']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['BAS', 'B', 'MB']
        output: true
    output: has_basement
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MB']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_finished_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['SLRPNL']
        output: true
    output: has_solar
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['MA', 'MU', 'M+', 'MG']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['MA', 'MU', 'M+', 'MG']) &
      (year_built > 1800) & (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['MA', 'MU', 'M+',
      'MG']) & (effective_year_built > 1800) & (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max
  basement_finished_area_sqft: sum
  has_solar: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-ELP_property-elpasocad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
