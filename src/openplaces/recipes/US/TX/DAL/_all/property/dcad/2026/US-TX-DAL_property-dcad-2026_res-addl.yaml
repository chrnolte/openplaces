# Recipe: Dallas County, TX residential additional improvements (DCAD).
# Supplement of US-TX-DAL_property-dcad-2026; see that recipe for the
# download, the terms and the join key.
#
# SOURCE MEMBER. RES_ADDL.CSV: one row per secondary improvement of a
# residential taxable object (garages, carports, sheds, pools, decks),
# keyed ACCOUNT_NUM plus TAX_OBJ_ID and SEQ_NUM, with IMPR_TYP_DESC (the
# district's type list) and AREA_SIZE in square feet. 734,247 rows;
# every TAX_OBJ_ID is in RES_DETAIL. The member is not UTF-8 (a 0xa2
# byte), so it is read as latin-1.
#
# WHAT IS MAPPED, by IMPR_TYP_DESC:
#   garage_area_sqft  AREA_SIZE summed over ATTACHED GARAGE and DETACHED
#                     GARAGE rows (ENCLOSED GARAGE, a garage converted
#                     to living space, is left out)
#   garage_type       the type text of the first garage row
#   has_garage        true where a garage row exists
#   has_carport       true where an ATTACHED or DETACHED CARPORT exists
#   deck_area_sqft    AREA_SIZE summed over DECK and OUTDOOR LIVING AREA
#   basement_area_sqft AREA_SIZE summed over BASEMENT rows
#   n_outbuildings    rows of STORAGE BUILDING, DETACHED GARAGE,
#                     OUTBUILDING, BARN, GREENHOUSE, CABANA and DETACHED
#                     QUARTERS
#   has_accessory_dwelling  true where DETACHED or ATTACHED QUARTERS
#                     exist
# The table lists only improvements that exist, so every flag is true
# where a row says so and null elsewhere, never false; the areas and
# counts are likewise null, not 0, for an account without such a row.
# Pools are not read here: RES_DETAIL's POOL_IND states presence and
# absence (see _res-detail).
#
# MEASURED (2026-09-13): share of the 512,454 single-family (SPTD A11)
# accounts with a value. garage_area_sqft 81.4% (median 440; one
# account sums to 882,617, left for curate's range checks),
# garage_type and has_garage 81.4% (attached on 87% of them),
# has_carport 8.8%, deck_area_sqft 4.5%, basement_area_sqft 0.1%,
# n_outbuildings 24.3% (median 1), has_accessory_dwelling 1.9%.

description: >-
  Dallas County, TX appraisal residential additional improvements (DCAD
  RES_ADDL): garage, carport, deck and basement areas, outbuildings and
  quarters per account.

admin_id: US-TX-DAL

entity:
  entity_type: property
  source:
    source_id: dcad
    # Same download as the roll; see its terms note.
    license: "unknown (as-is, no-warranty disclaimer in the README; no licence terms)"
    terms_url: "https://www.dallascad.org/DataProducts.aspx"
    redistribution_restricted: null
    portal_url: "https://www.dallascad.org/DataProducts.aspx"
    download_url: "https://www.dallascad.org/ViewPDFs.aspx?type=3&id=%5C%5CDCAD.ORG%5CWEB%5CWEBDATA%5CWEBFORMS%5CDATA%20PRODUCTS%5CDCAD2026_CURRENT.ZIP"
  version: 2026

compressed_file_name: "DCAD2026_CURRENT.ZIP"
uncompressed_file_name: "RES_ADDL.CSV"

process_by:
  admin_level: 3

encoding: latin-1
csv_dtype:
  ACCOUNT_NUM: str
  TAX_OBJ_ID: str

columns:
  parcel_id_assessor: ACCOUNT_NUM

transformations:
  - type: unary
    operation: to_numeric
    input: AREA_SIZE
    output: addl_area
  # Masks: 1 on the rows of the named types, null elsewhere, so a
  # product or a sum over them stays null for an account without one.
  - type: remap
    input: IMPR_TYP_DESC
    mapping:
      "ATTACHED GARAGE": 1
      "DETACHED GARAGE": 1
    output: garage_mask
  - type: expression
    expression: "addl_area * garage_mask"
    inputs: [addl_area, garage_mask]
    output: garage_area_sqft
  - type: remap
    input: IMPR_TYP_DESC
    mapping:
      "ATTACHED GARAGE": "ATTACHED GARAGE"
      "DETACHED GARAGE": "DETACHED GARAGE"
    output: garage_type
  - type: remap
    input: IMPR_TYP_DESC
    mapping:
      "ATTACHED GARAGE": true
      "DETACHED GARAGE": true
    output: has_garage
  - type: remap
    input: IMPR_TYP_DESC
    mapping:
      "ATTACHED CARPORT": true
      "DETACHED CARPORT": true
    output: has_carport
  - type: remap
    input: IMPR_TYP_DESC
    mapping:
      "DECK": 1
      "OUTDOOR LIVING AREA": 1
    output: deck_mask
  - type: expression
    expression: "addl_area * deck_mask"
    inputs: [addl_area, deck_mask]
    output: deck_area_sqft
  - type: remap
    input: IMPR_TYP_DESC
    mapping:
      "BASEMENT": 1
    output: basement_mask
  - type: expression
    expression: "addl_area * basement_mask"
    inputs: [addl_area, basement_mask]
    output: basement_area_sqft
  - type: remap
    input: IMPR_TYP_DESC
    mapping:
      "STORAGE BUILDING": 1
      "DETACHED GARAGE": 1
      "OUTBUILDING": 1
      "BARN": 1
      "GREENHOUSE": 1
      "CABANA": 1
      "DETACHED QUARTERS": 1
    output: n_outbuildings
  - type: remap
    input: IMPR_TYP_DESC
    mapping:
      "DETACHED QUARTERS": true
      "ATTACHED QUARTERS": true
    output: has_accessory_dwelling

drop_columns:
  - addl_area
  - garage_mask
  - deck_mask
  - basement_mask

aggregation_function:
  garage_area_sqft: sum
  garage_type: first
  has_garage: max
  has_carport: max
  deck_area_sqft: sum
  basement_area_sqft: sum
  n_outbuildings: sum
  has_accessory_dwelling: max

supplements: US-TX-DAL_property-dcad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel
  # Same conversion and tolerance as the roll, so both keys agree.
  instruction:
    US-TX-DAL:
      conv: "string_lengths: 2 2 4 4 4 & skip_empty: 1"
      tolerance: 0.05

save_to:
  data_dir: cache
  filename: res-addl
