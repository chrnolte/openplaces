# Recipe: Tarrant County, TX certified appraisal roll, improvement
# features member (PACS File #9): foundation_description from the
# district's 'Foundation' attribute. Same download as
# US-TX-TAR_property-tarrantcad-2026; read that roll's header for the
# source and its terms.
#
# READING. The district's code, kept as published (no crosswalk):
# ConcSlab, PierBeamJo, Masonry, Post, Dirt, Stilts, Other. The
# placeholder 'Unassigned' reads as missing. TAD writes this attribute
# mostly on commercial and multifamily buildings, so single-family
# coverage is low. drop_duplicates keeps the first row per building, and
# the property takes the first building's code.
#
# Kept in the district's own words; curate translates them.
# foundation_type stays NSI-coded and is not written here.
#
# JOIN. The roll's parcel_id_local is its geo_id; this member carries
# prop_id only, so it joins the roll on parcel_id_assessor.
#
# MEASURED on the 2026 export, in memory (aggregates only): 48,636
# building rows over 40,247 properties, every one a roll account. A is
# the 599,911 single-family properties (improvement state class A, File
# #7); B, E and M the other residential classes. foundation_description
# A 1.7% (B 18.8%, E 1.6%, M 0.0%), 7 distinct codes.

description: >-
  Tarrant County, TX certified appraisal roll, improvement features
  member: foundation_description per building, reduced to the property.

admin_id: US-TX-TAR

entity:
  entity_type: property
  source:
    source_id: tarrantcad
    # Same download as the roll; see its terms note.
    license: "unknown (tad.org answers 403 to the identified client; terms could not be checked)"
    redistribution_restricted: null
    portal_url: "https://www.tad.org/resources/data-downloads"
  version: 2026

compressed_file_name: "000_Tarrant_All_Taxing_Units.zip"
uncompressed_file_name: "2026-09-09_2026_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features), 87 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  foundation_description: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Foundation'
  and foundation_description != 'Unassigned'

# One row per building.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  foundation_description: first

supplements: US-TX-TAR_property-tarrantcad-2026
# The roll's parcel_id_local is its geo_id; this member carries prop_id
# only.
supplements_key: parcel_id_assessor

save_to:
  data_dir: cache
  filename: foundation-description
