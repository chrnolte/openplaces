# Recipe: Tarrant County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-TAR_property-tarrantcad-2026; read that roll's header for the
# source, the manual download and the terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing. A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component
# (ResG attached, ResDG detached).
#
# MAIN AREA. TAD writes a house's living area as one or more ResMain
# lines (two on 29% of improvements), plus ResAddn (additions), ResUpper
# ('Upper Floor') and ResMH (a mobile home's main area). year_built is
# their yr_built and effective_year_built their depreciation_yr (the
# two differ on 21.7% of ResMain lines), the earliest kept, both missing
# outside 1801 to 2027.
#
# TYPES. living area: ResMain, ResAddn, ResUpper, ResMH. garage: ResG,
# ResDG. carport: ResCP. porch: ResP, ResEP, PorchScree. swimming pool:
# ResSW, SwimPool (priced as a unit, area 0 or 1, so a flag only).
# basement (finished and unfinished): ResB, BasementUn.
#
# LEFT OUT. ResConvGar (a converted garage: living space or storage, the
# file does not say), ResER ('Enclosed Room'), ResS ('Studio'), storage
# sheds, outbuildings, greenhouses, boat docks and courts. Not in this
# member: quality grade (the class code is a type class, 'ResSF' on
# 97.6% of ResMain lines, not a grade; quality_grade and condition come
# from the _supplemental recipe), decks and patios (no residential
# type), fireplaces (only 380 commercial FirePlace properties) and
# stories.
#
# JOIN. The roll's parcel_id_local is its geo_id; this member carries
# prop_id only, so it joins the roll on parcel_id_assessor.
#
# MEASURED on the 2026 export, in memory (aggregates only): 2,715,747
# component rows over 656,919 properties, every one a roll account. A
# is the 599,911 single-family properties (improvement state class A,
# File #7); B, E and M the other residential classes. living_area_sqft
# A 99.8% (B 80.5%, E 98.6%, M 100.0%), per-property median 1809.
# year_built A 99.6% (B 80.4%, E 96.7%, M 99.9%), median 1989;
# effective_year_built A 99.8%, median 1995. garage_area_sqft,
# has_garage and garage_type A 86.7% (B 27.5%, E 73.0%, M 0.1%), median
# 441. has_carport A 6.9% (B 18.4%, E 31.4%, M 0.5%). porch_area_sqft A
# 92.4% (B 65.5%, E 83.8%, M 0.7%), median 114. has_pool A 13.3% (B
# 9.4%, E 30.2%, M 0.0%). basement_area_sqft and has_basement A 0.3% (B
# 0.1%, E 1.4%, M 0.0%), median 650.

description: >-
  Tarrant County, TX certified appraisal roll, improvement detail member:
  living area, year built, garage, porch, pool and basement per property.

admin_id: US-TX-TAR

entity:
  entity_type: property
  source:
    source_id: tarrantcad
    # Same download as the roll; see its terms note.
    license: "unknown (tad.org answers 403 to the identified client; terms could not be checked)"
    redistribution_restricted: null
    portal_url: "https://www.tad.org/resources/data-downloads"
  version: 2026

compressed_file_name: "000_Tarrant_All_Taxing_Units.zip"
uncompressed_file_name: "2026-09-09_2026_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail), 622 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [filler, 10] # Imprv_det_class_cd
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  year_built: yr_built
  effective_year_built: depreciation_yr

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['ResMain', 'ResAddn',
      'ResUpper', 'ResMH']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['ResG', 'ResDG']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['ResG', 'ResDG']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['ResG', 'ResDG']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['ResCP']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['ResP', 'ResEP',
      'PorchScree']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['ResSW', 'SwimPool']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['ResB', 'BasementUn']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['ResB', 'BasementUn']
        output: true
    output: has_basement
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['ResMain', 'ResAddn',
      'ResUpper', 'ResMH']) & (year_built > 1800) & (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['ResMain',
      'ResAddn', 'ResUpper', 'ResMH']) & (effective_year_built > 1800) &
      (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  year_built: min
  effective_year_built: min
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max

supplements: US-TX-TAR_property-tarrantcad-2026
# The roll's parcel_id_local is its geo_id; this member carries prop_id
# only.
supplements_key: parcel_id_assessor

save_to:
  data_dir: cache
  filename: improvement-features
