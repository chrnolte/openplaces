# Recipe: Montgomery County, TX certified appraisal roll, improvement
# features member (PACS File #9): bathrooms from the district's
# 'Plumbing' attribute. Same download as
# US-TX-MON_property-montgomerycad-2026; read that roll's header for the
# source, the manual download and the terms.
#
# ENCODING. MCAD writes several 'Plumbing' rows per building, usually
# all on its main-area detail, each a count followed by a kind:
#   - FB, full baths ('2FB'): on 88.6% of improvements with plumbing;
#   - HB, half baths ('1HB'): 39.7%;
#   - AF ('2AF', 111,062 rows): not documented; it equals FB on only
#     44.3% of the improvements carrying both, and neither FB + HB nor
#     FB + 0.5 x HB, so it is not read;
#   - a bare number ('10', 258,518 rows): a fixture count (median 8 to
#     10 for two full baths), not read.
# n_bathrooms is FB + 0.5 x HB, summed over a building's rows and then
# over the property's buildings. The query keeps FB codes whose count is
# whole or ends in .5 and HB codes, with a nonzero digit; it leaves out
# 150 FB rows with other decimals ('8.2FB', likely fixtures keyed into
# the wrong slot) and 178 '0HB' rows.
#
# ROW RULE. drop_duplicates removes a code repeated on one building
# (0.4% of improvements carry two FB rows, equal on 71%); differing
# rows on one building sum.
#
# MEASURED on the 2026 certified export, in memory (aggregates only):
# 313,771 FB and HB rows after the query and dedup, over 214,011
# properties, every one found in the roll. A is the 244,715
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. n_bathrooms A 85.8% (B 1.9%, E
# 78.6%, M 0.0%); per-property median 2.5, p99 5.5; 43.2% of values end
# in .5. Multifamily (B) and mobile homes (M) carry no FB or HB codes.
# Totals above 10 (max 1,563.5) are left for curate's range checks.

description: >-
  Montgomery County, TX certified appraisal roll, improvement features
  member: bathrooms per building (full plus half as .5), summed to the
  property.

admin_id: US-TX-MON

entity:
  entity_type: property
  source:
    source_id: montgomerycad
    # Same download as the roll; see its terms note.
    license: "unknown (no terms on the exports; portal map viewer: no-warranty disclaimer only)"
    redistribution_restricted: null
    portal_url: "https://mcad-tx.org/appraisal-data-exports"
  version: 2026

compressed_file_name: "Certified Appraisal Roll 2026.zip"
uncompressed_file_name: "2026-08-04_2026_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features), 87 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

# FB and HB codes only; see ENCODING.
query: >-
  imprv_attr_desc == 'Plumbing'
  and n_bathrooms.str.contains('(?i)^[0-9]+(?:[.]5)? ?FB$|^[0-9]+ ?HB$', na=False)
  and n_bathrooms.str.contains('[1-9]', na=False)

# Drops only a code repeated on one building.
drop_duplicates: [prop_id, imprv_id, n_bathrooms]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: string
    operation: extract_named
    input: n_bathrooms
    args:
      pattern: '(?i)^(?P<n>[0-9]+(?:[.]5)?) ?FB$'
    output: full_bathroom_count
  - type: string
    operation: extract_named
    input: n_bathrooms
    args:
      pattern: '(?i)^(?P<n>[0-9]+) ?HB$'
    output: half_bathroom_count
  - type: unary
    operation: to_numeric
    input: full_bathroom_count
    output: full_bathroom_count
  - type: unary
    operation: to_numeric
    input: half_bathroom_count
    output: half_bathroom_count
  - type: expression
    expression: "half_bathroom_count * 0.5"
    inputs: [half_bathroom_count]
    output: half_bathroom_equivalent
  # Exactly one of the two fires per row.
  - type: aggregate
    operation: sum
    inputs: [full_bathroom_count, half_bathroom_equivalent]
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id
  - full_bathroom_count
  - half_bathroom_count
  - half_bathroom_equivalent

aggregation_function:
  n_bathrooms: sum

supplements: US-TX-MON_property-montgomerycad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
