# Recipe: Jefferson County, TX certified appraisal roll (JCAD).
#
# Why: the statewide TxGIO parcel layer carries no building floor area
# for Jefferson. The district's certified roll does, in its improvement
# detail member; this recipe is the property roll those details
# supplement (see its _improvement-detail sibling).
#
# FORMAT. True Automation / PACS "Appraisal Export", layout 8.0.34, the
# same vendor layout as US-TX-VIC_property-victoriacad-2026 (read that
# recipe's header for the format and the prop_id zero-padding trap).
# The ZIP ships the layout spreadsheet ("Appraisal Export Layout -
# 8.0.34.xlsx"), a README and the district's export notes beside the
# data. APPRAISAL_INFO (File #2) is 1.5 GB raw; the reader stops at
# situs_num, the last field mapped.
#
# MEASURED on the 2026 export (154,028 rows, prop_id unique):
# land_state_cd 83.2%, imprv_state_cd 60.8%. The roll also carries
# personal-property and mineral accounts, which TxGIO omits, so the
# key overlap is stated both ways: 98.7% of TxGIO's Jefferson parcel
# ids are in this roll; 78.2% of the roll's ids are in TxGIO, 94.0% of
# those with a land_state_cd.
#
# NOTE: member names carry the export date and the per-export dataset
# id, so the name below is pinned to this vintage.
#
# VALUES. Land and improvement are mapped from the PACS value block
# (land_hstd_val, land_non_hstd_val, imprv_hstd_val,
# imprv_non_hstd_val, ag_use_val, ag_market, timber_use,
# timber_market, then appraised_val; layout positions 1796-1930),
# because 3,204 of Jefferson's parcels carry a market total and no land
# in TxGIO (measured 2026-09-23 on the curated parcels) and the roll
# has the figure. market_value equals land_hstd + land_non_hstd +
# imprv_hstd + imprv_non_hstd + ag_market + timber_market on 514 of 514
# rows sampled from the file's head and middle (nine of them with
# agricultural land). The Victoria recipe's reason for leaving values
# unmapped (TxGIO already has them, the split has to be summed) holds
# where TxGIO does have them; the sum is two aggregate steps.
#
# NOT MAPPED. Owner name and mailing address (py_owner_name and the
# py_addr block) are never read; nothing downstream needs them.

description: >-
  Jefferson County, TX certified appraisal roll (PACS 8.0.34 export): state
  land-use codes, legal acreage, situs and market value keyed by property.

admin_id: US-TX-JEF

entity:
  entity_type: property
  source:
    source_id: jeffersoncad
    # Checked 2026-09-16 by fetching the data download page: a
    # site-footer copyright over the website only, no licence, no
    # attribution requirement, no resale or redistribution clause for
    # the published roll.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://jcad.org/data-download/"
    download_url: "https://jcad.org/wp-content/uploads/2026/07/CERTIFIED-2026_0_PUBLIC.zip"
  version: 2026

compressed_file_name: "CERTIFIED-2026_0_PUBLIC.zip"
uncompressed_file_name: "CERTIFIED-2026_0_PUBLIC/2026-07-21_002178_APPRAISAL_INFO.TXT"
# Only the member read here; the archive unpacks to 5.5 GB otherwise.
extract_members:
  - "2026-07-21_002178_APPRAISAL_INFO.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS 8.0.34 File #2 (Property); same offsets as Victoria's roll.
fixed_width:
  - [prop_id, 12]
  - [filler, 5]
  - [prop_val_yr, 5]
  - [filler, 524]
  - [geo_id, 50]
  - [filler, 443]
  - [situs_street_prefx, 10]
  - [situs_street, 50]
  - [filler, 10]
  - [situs_city, 30]
  - [situs_zip, 10]
  - [legal_desc, 255]
  - [filler, 255]
  - [legal_acreage, 16]
  - [abs_subdv_cd, 10]
  - [hood_cd, 10]
  - [filler, 100]
  # The value block (layout 8.0.34 positions 1796-1915, 15 wide each):
  # what market_value is the sum of. See VALUES in the header.
  - [land_hstd_val, 15]
  - [land_non_hstd_val, 15]
  - [imprv_hstd_val, 15]
  - [imprv_non_hstd_val, 15]
  - [ag_use_val, 15]
  - [ag_market, 15]
  - [timber_use, 15]
  - [timber_market, 15]
  - [appraised_val, 15]
  - [filler, 801]
  - [imprv_state_cd, 10]
  - [land_state_cd, 10]
  - [filler, 1462]
  - [market_value, 14]
  - [filler, 232]
  - [situs_num, 15]

transformations:
  # legal_acreage carries 4 implied decimals (PACS layout: "Legal
  # Acreage (4 Decimals)"), so it is divided by 10,000.
  - type: unary
    operation: to_numeric
    input: land_area_ac
    output: land_area_ac
  - type: expression
    expression: "land_area_ac / 10000"
    inputs: [land_area_ac]
    output: land_area_ac
  # Land and improvement on the market basis market_value is the sum
  # of: land is the homestead and non-homestead land plus agricultural
  # and timber land at market, improvement the homestead and
  # non-homestead improvement. prop_id is unique here, so no ownership
  # scaling (contrast the Cameron recipe).
  - type: unary
    operation: to_numeric
    input: land_value
    output: land_value
  - type: unary
    operation: to_numeric
    input: land_non_hstd_val
    output: land_non_hstd_val
  - type: unary
    operation: to_numeric
    input: ag_market
    output: ag_market
  - type: unary
    operation: to_numeric
    input: timber_market
    output: timber_market
  - type: aggregate
    operation: sum
    inputs: [land_value, land_non_hstd_val, ag_market, timber_market]
    output: land_value
  - type: unary
    operation: to_numeric
    input: improvement_value
    output: improvement_value
  - type: unary
    operation: to_numeric
    input: imprv_non_hstd_val
    output: imprv_non_hstd_val
  - type: aggregate
    operation: sum
    inputs: [improvement_value, imprv_non_hstd_val]
    output: improvement_value
  # Strip the PACS zero-padding so parcel_id_local matches TxGIO's
  # bare form.
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor

drop_columns:
  - land_non_hstd_val
  - imprv_non_hstd_val
  - ag_use_val
  - ag_market
  - timber_use
  - timber_market
  - appraised_val

columns:
  land_value: land_hstd_val
  improvement_value: imprv_hstd_val
  tax_neighborhood_code: hood_cd
  parcel_id_admin2_2: geo_id
  use_group_code: land_state_cd
  use_subgroup_code: imprv_state_cd
  address_number: situs_num
  address_street: situs_street
  city: situs_city
  postal_code: situs_zip
  legal_description: legal_desc
  land_area_ac: legal_acreage
  total_value: market_value
  tax_year: prop_val_yr

columns_to_categorical:
  - tax_neighborhood_code
  - use_group_code
  - use_subgroup_code

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
