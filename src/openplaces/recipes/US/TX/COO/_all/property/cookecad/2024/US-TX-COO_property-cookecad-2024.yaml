# Recipe: Cooke County, TX certified appraisal roll (CCAD). Same PACS
# export family, offsets and join-key trap as
# US-TX-VIC_property-victoriacad-2026: read that recipe's header first.
# This header covers only what differs for Cooke.
#
# Why: the roll is what the room-count supplements beside it detail
# (supplements: this recipe). The statewide TxGIO layer carries no room
# counts.
#
# SOURCE. Cooke CAD publishes through a True Prodigy public portal,
# where files sit behind an anonymous token rather than a stable URL, so
# this recipe has no download_url: place the zip in the recipe's
# external directory by hand. The route, all with the identified client:
# POST
# https://prod-container.trueprodigyapi.com/trueprodigy/cadpublic/auth/token
# with {"office": "Cooke"} for a token; GET
# /public/reportcategory/Appraisal Reports/search to list files; GET
# /public/filedownload/{reportS3ID} with the token as Authorization. The
# newest certified export posted is the 2024 roll (export dated
# 2024-07-30; no 2025 or 2026 export is posted), so this recipe is
# version 2024.
#
# LAYOUT. The export's header record names layout 8.0.0.30 and its
# property records are 9,247 characters wide. Every field mapped below
# sits at the same offset in the 8.0.30, 8.0.31, 8.0.33 and 8.0.34
# layout sheets (compared field by field); the versions differ only
# after situs_num (column 4474), where this recipe stops reading.
#
# MEASURED on the 2024 export (74,431 rows): land_state_cd 44.4%,
# imprv_state_cd 30.9%, geo_id 97.6%, market_value 100.0%. prop_id is
# unique. The roll also carries personal-property and mineral accounts,
# which TxGIO omits by design, so the key overlap is stated both ways:
# of all prop_ids (zero-stripped) 42.8% are in TxGIO's Prop_ID for the
# county, of the 33,046 with a land_state_cd 96.5%, and 98.5% of TxGIO's
# 32,373 ids are found here. The bundled parcel_id_local conversion
# gives the same overlap on both sides.
#
# ROOM COUNTS: supplements _bedrooms and _bathrooms. 'ADDITIONAL ROOMS'
# names room types (UTILITY, STUDY, GAME ROOM ...), cut at 10
# characters, and is not a count (9.7% of single-family properties). No
# stories attribute, and no room-like or storey detail type in File #8
# (its 'BATH HOUSE' details are outbuildings).
#
# NEIGHBORHOOD. hood_cd, the district's valuation neighborhood code
# (File #2), is mapped to tax_neighborhood_code as published. MEASURED
# on the 2024 export: A is the 12,701 single-family properties
# (improvement state class A, File #7); B, E and M the other residential
# classes. tax_neighborhood_code A 99.6% (B 94.0%, E 99.3%, M 99.5%),
# 169 distinct codes.

description: >-
  Cooke County, TX certified appraisal roll (PACS 8.0.30 export): state land-use
  codes, legal acreage and market value keyed by property.

admin_id: US-TX-COO

entity:
  entity_type: property
  source:
    source_id: cookecad
    # Checked 2026-09-12: no licence, resale or redistribution terms
    # found; the portal's /public/config/legal endpoint answers 403 to
    # the anonymous token. No fee.
    license: >-
      unknown (the portal's legal statement answers 403 to the anonymous token; no
      terms found)
    redistribution_restricted: null
    portal_url: "https://www.cookecad.org/"
  version: 2024

compressed_file_name: "2024 Certified Export.zip"
uncompressed_file_name: "2024 CERTIFIED EXPORT/2024-07-30_001801_APPRAISAL_INFO.TXT"

process_by:
  admin_level: 3

# The PACS export is latin-1, not UTF-8.
encoding: latin-1

# PACS File #2 (Property), offsets from the layout sheet; see
# LAYOUT above. Reading stops at situs_num (column 4474).
fixed_width:
  - [prop_id, 12]
  - [filler, 5]
  - [prop_val_yr, 5]
  - [filler, 524]
  - [geo_id, 50]
  - [filler, 443]
  - [situs_street_prefx, 10]
  - [situs_street, 50]
  - [filler, 10]
  - [situs_city, 30]
  - [situs_zip, 10]
  - [legal_desc, 255]
  - [filler, 255]
  - [legal_acreage, 16]
  - [abs_subdv_cd, 10]
  - [hood_cd, 10]
  - [filler, 220]
  - [appraised_val, 15]
  - [filler, 801]
  - [imprv_state_cd, 10]
  - [land_state_cd, 10]
  - [filler, 1462]
  - [market_value, 14]
  - [filler, 232]
  - [situs_num, 15]

transformations:
  # legal_acreage carries 4 implied decimals (PACS layout: "Legal
  # Acreage (4 Decimals)"), so it is divided by 10,000.
  - type: unary
    operation: to_numeric
    input: land_area_ac
    output: land_area_ac
  - type: expression
    expression: "land_area_ac / 10000"
    inputs: [land_area_ac]
    output: land_area_ac
  # Strip the PACS zero-padding so parcel_id_local matches TxGIO's
  # bare form.
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor

columns:
  tax_neighborhood_code: hood_cd
  parcel_id_admin2_2: geo_id
  use_group_code: land_state_cd
  use_subgroup_code: imprv_state_cd
  address_number: situs_num
  address_street: situs_street
  city: situs_city
  postal_code: situs_zip
  legal_description: legal_desc
  land_area_ac: legal_acreage
  # PACS market_value is the district's land-plus-structure total; see
  # the Victoria roll for why it is total_value, not appraised_val.
  total_value: market_value
  tax_year: prop_val_yr

columns_to_categorical:
  - tax_neighborhood_code
  - use_group_code
  - use_subgroup_code

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
