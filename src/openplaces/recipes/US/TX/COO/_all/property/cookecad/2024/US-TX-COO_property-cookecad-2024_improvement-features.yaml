# Recipe: Cooke County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-COO_property-cookecad-2024; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2025 (0 is the district's
# blank).
#
# GA2 ('GARAGE LIVING AREA', a converted garage) counts as living area.
# Porches on barns (POB) are left out.
#
# TYPES. living area: types MAIN, US1, US, ADDN, GA2, LALF, US2,
# US1ADDN. garage: types GA1, GD2, GD1, DG2, DG1, DG3, GD3, RVG, AG.
# carport: types CA2, DC2, CA1, DC1, DC3, CA3, AP. porch: types P02,
# P03, P01, PC7, PC9, PC8, PS6, PS4, PS5, CP2, CP1, CP3. deck and patio:
# types WD2, WD1, WD3, WD4, PATIO. swimming pool: types SPG3, SPL2,
# SPF2, SPG2, SPG. basement (finished and unfinished): types BM1, BM2,
# BM, BM3, BM4. solar device: types SOLAR.
#
# MEASURED on the 2024 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 12,701
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 96.3% (B
# 78.7%, E 90.2%, M 99.1%), per-property median 1620. garage_area_sqft A
# 55.2% (B 24.7%, E 39.2%, M 2.0%), per-property median 528. has_garage
# A 55.2% (B 24.7%, E 39.2%, M 2.0%). garage_type A 55.2% (B 24.7%, E
# 39.2%, M 2.0%), 9 distinct codes. has_carport A 26.3% (B 24.7%, E
# 31.8%, M 18.9%). porch_area_sqft A 86.9% (B 74.0%, E 79.7%, M 40.6%),
# per-property median 200. deck_area_sqft A 24.3% (B 8.0%, E 18.9%, M
# 41.0%), per-property median 252. has_pool A 5.5% (B 0.7%, E 8.4%, M
# 0.0%). basement_area_sqft A 0.3% (B 0.0%, E 0.4%, M 0.0%),
# per-property median 532. has_basement A 0.3% (B 0.0%, E 0.4%, M 0.0%).
# has_solar A 1.5% (B 0.0%, E 0.6%, M 0.0%). quality_grade A 96.3% (B
# 78.7%, E 90.2%, M 99.1%), 108 distinct codes. year_built A 93.2% (B
# 77.3%, E 83.7%, M 86.4%), per-property median 1979.
# effective_year_built A 89.5% (B 72.7%, E 80.6%, M 87.7%), per-property
# median 1984.

description: >-
  Cooke County, TX certified appraisal roll, improvement detail member: living, garage,
  porch and deck areas, class and feature flags per property.

admin_id: US-TX-COO

entity:
  entity_type: property
  source:
    source_id: cookecad
    # Same download as the roll; see its terms note.
    license: >-
      unknown (the portal's legal statement answers 403 to the anonymous token; no
      terms found)
    redistribution_restricted: null
    portal_url: "https://www.cookecad.org/"
  version: 2024

compressed_file_name: "2024 Certified Export.zip"
uncompressed_file_name: "2024 CERTIFIED EXPORT/2024-07-30_001801_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MAIN', 'US1', 'US', 'ADDN',
      'GA2', 'LALF', 'US2', 'US1ADDN']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['GA1', 'GD2', 'GD1', 'DG2',
      'DG1', 'DG3', 'GD3', 'RVG', 'AG']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['GA1', 'GD2', 'GD1', 'DG2', 'DG1', 'DG3', 'GD3', 'RVG', 'AG']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['GA1', 'GD2', 'GD1',
      'DG2', 'DG1', 'DG3', 'GD3', 'RVG', 'AG']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['CA2', 'DC2', 'CA1', 'DC1', 'DC3', 'CA3', 'AP']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['P02', 'P03', 'P01', 'PC7',
      'PC9', 'PC8', 'PS6', 'PS4', 'PS5', 'CP2', 'CP1', 'CP3']) & (imprv_det_area
      > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['WD2', 'WD1', 'WD3', 'WD4',
      'PATIO']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['SPG3', 'SPL2', 'SPF2', 'SPG2', 'SPG']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['BM1', 'BM2', 'BM', 'BM3',
      'BM4']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['BM1', 'BM2', 'BM', 'BM3', 'BM4']
        output: true
    output: has_basement
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['SOLAR']
        output: true
    output: has_solar
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['MAIN', 'US1', 'US', 'ADDN',
      'GA2', 'LALF', 'US2', 'US1ADDN']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['MAIN', 'US1', 'US', 'ADDN',
      'GA2', 'LALF', 'US2', 'US1ADDN']) & (year_built > 1800) & (year_built <=
      2025))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['MAIN', 'US1', 'US',
      'ADDN', 'GA2', 'LALF', 'US2', 'US1ADDN']) & (effective_year_built > 1800)
      & (effective_year_built <= 2025))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max
  has_solar: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-COO_property-cookecad-2024

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
