# Recipe: Cooke County, TX certified appraisal roll, improvement
# features, bathrooms (CCAD). Same member (PACS File #9) as
# US-TX-VIC_property-victoriacad-2026_bedrooms; read its header first.
# This header covers what differs for Cooke.
#
# Cooke's 'BATHROOMS' attribute is a bath total with halves folded in as
# .5 (2, 1.5, 1, 2.5, 3 lead; '.5' alone on a building is one half
# bath), not a fixture count, so there is no separate half count to map.
# The query keeps codes that are a plain number of one or two integer
# digits, with or without decimals ('2', '2.5', '.5'), and not zero.
# Zero, three-digit, text and letter codes are left out (listed in
# MEASURED). Values the query keeps but that are implausible for one
# building are left for curate's range checks.
#
# MEASURED on the 2024 export: 'BATHROOMS' on 18,245 rows over 17,309
# properties. The query drops 4 text rows ('BIDET', '3 FULL', '2 HALF
# BAT', 'CORNER WHI'). After the row rule, 17,308 properties, median 2,
# p99 4.5; 32.7% end in .5. The median bath count rises with bedrooms
# (1.5 for two, 2 for three, 2.5 for four, 3.5 for five). Coverage
# (value above 0) is 94.7% of the 12,701 single-family (A) properties,
# 77.3% of the 150 multifamily (B), 86.3% of the 4,999 rural improved
# (E) and 88.1% of the 756 mobile homes (M).
#
# ROW RULE. 411 improvements carry two or more kept rows and only 47% of
# them agree, so three rules were measured per property: the first row
# per improvement summed across buildings (this recipe), all rows
# summed, and the maximum over all rows. The last two differ from the
# first on 2.29% and 2.38% of properties. The disagreeing rows sit on a
# second MAIN detail or an 'ADDN TO MAIN (HOME)', and the first row is
# the largest in 79% of them, which reads either as an addition's own
# count (sum) or as a partial repeat (first). Improvement value decides
# it: over the 141 single-family improvements whose rows disagree, the
# File #7 improvement value lies nearer the median value of single-row
# improvements with the first row's count than with the summed count in
# 63%. So drop_duplicates keeps the first row per (prop_id, imprv_id),
# and aggregation_function sums distinct buildings to the property.

description: >-
  Cooke County, TX certified appraisal roll, improvement features member: bathrooms
  per building (halves as .5), summed to the property.

admin_id: US-TX-COO

entity:
  entity_type: property
  source:
    source_id: cookecad
    # Same download as the roll; see its terms note.
    license: >-
      unknown (the portal's legal statement answers 403 to the anonymous token; no
      terms found)
    redistribution_restricted: null
    portal_url: "https://www.cookecad.org/"
  version: 2024

compressed_file_name: "2024 Certified Export.zip"
uncompressed_file_name: "2024 CERTIFIED EXPORT/2024-07-30_001801_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features), 87 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

query: >-
  imprv_attr_desc == 'BATHROOMS'
  and n_bathrooms.str.fullmatch(
  '(?!0+([.]0+)?$)([0-9]{1,2}([.][0-9]+)?|[.][0-9]+)',
  na=False)

# One row per building; see ROW RULE.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_bathrooms: sum

# Details the roll's properties: joined by link_by_id, skipped
# by the property spine's union.
supplements: US-TX-COO_property-cookecad-2024

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
