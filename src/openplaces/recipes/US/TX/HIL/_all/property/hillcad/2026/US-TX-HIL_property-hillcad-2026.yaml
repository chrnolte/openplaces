# Recipe: Hill County, TX appraisal roll (Hill CAD). Same PACS 8.0.34
# layout, offsets and join-key trap as US-TX-VIC_property-victoriacad-
# 2026; see that recipe's header for the general shape of this source
# family. This header covers only what differs for Hill.
#
# SOURCE. The district's download page posts the full PACS appraisal
# export as "2026 Hill CAD Data as of 08/27/26": the export header names
# it an "As of Supplement" export, not the certified roll, so values may
# differ slightly from the certified totals. Layout 8.0.34 ships inside
# the zip, and every mapped offset matches the Victoria template
# (checked field by field against the spreadsheet; record width 9,714).
#
# NOTE on coverage, measured on this export (50,228 rows):
#   land_state_cd   77.9%   imprv_state_cd  44.1%
#   geo_id         100.0%   market_value   100.0%
#
# NOTE on the join key. 75.7% of the roll's zero-stripped prop_ids are
# in TxGIO's Prop_ID and 98.4% of TxGIO's 38,620 Hill ids are in the
# roll: the roll also carries personal-property and mineral accounts
# that TxGIO leaves out by design.
#
# NEIGHBORHOOD. hood_cd, the district's valuation neighborhood code
# (File #2), is mapped to tax_neighborhood_code as published. MEASURED
# on the 2026 export: A is the 11,650 single-family properties
# (improvement state class A, File #7); B, E and M the other residential
# classes. tax_neighborhood_code A 99.2% (B 100.0%, E 99.0%, M 99.6%),
# 206 distinct codes.

description: >-
  Hill County, TX appraisal roll (PACS 8.0.34 export, data as of
  2026-08-27): state land-use codes, legal acreage and market value.

admin_id: US-TX-HIL

entity:
  entity_type: property
  source:
    source_id: hillcad
    # Checked 2026-09-12 by fetching the download page: it carries only
    # a site-footer copyright over the website itself and states no
    # terms for the export it publishes (hillcad.org/disclaimer/ is
    # 404). Texas appraisal records are public information under the
    # Property Tax Code, but silence is not a grant.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://hillcad.org/download-data/"
    download_url: "https://hillcad.org/wp-content/uploads/2026/08/2026-Hill-CAD-Data-as-of-082726.zip"
  version: 2026

compressed_file_name: "2026-Hill-CAD-Data-as-of-082726.zip"
uncompressed_file_name: "2026-08-27_000839_APPRAISAL_INFO.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS 8.0.34 File #2 (Property); offsets as in the Victoria template.
fixed_width:
  - [prop_id, 12]
  - [filler, 5]
  - [prop_val_yr, 5]
  - [filler, 524]
  - [geo_id, 50]
  - [filler, 443]
  - [situs_street_prefx, 10]
  - [situs_street, 50]
  - [filler, 10]
  - [situs_city, 30]
  - [situs_zip, 10]
  - [legal_desc, 255]
  - [filler, 255]
  - [legal_acreage, 16]
  - [abs_subdv_cd, 10]
  - [hood_cd, 10]
  - [filler, 220]
  - [appraised_val, 15]
  - [filler, 801]
  - [imprv_state_cd, 10]
  - [land_state_cd, 10]
  - [filler, 1462]
  - [market_value, 14]
  - [filler, 232]
  - [situs_num, 15]

transformations:
  # legal_acreage carries 4 implied decimals (PACS layout: "Legal
  # Acreage (4 Decimals)"), so it is divided by 10,000.
  - type: unary
    operation: to_numeric
    input: land_area_ac
    output: land_area_ac
  - type: expression
    expression: "land_area_ac / 10000"
    inputs: [land_area_ac]
    output: land_area_ac
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor

columns:
  tax_neighborhood_code: hood_cd
  parcel_id_admin2_2: geo_id
  use_group_code: land_state_cd
  use_subgroup_code: imprv_state_cd
  address_number: situs_num
  address_street: situs_street
  city: situs_city
  postal_code: situs_zip
  legal_description: legal_desc
  land_area_ac: legal_acreage
  # Land-plus-structure market value; see the Victoria template for why
  # this is total_value and not appraised_val.
  total_value: market_value
  tax_year: prop_val_yr

columns_to_categorical:
  - tax_neighborhood_code
  - use_group_code
  - use_subgroup_code

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
