# Recipe: Polk County, TX certified appraisal roll, improvement features
# from the improvement detail member (PACS File #8, one row per building
# component). Same download as US-TX-POL_property-polkcad-2026; read
# that roll's header for the source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2027 (0 is the district's
# blank).
#
# TYPES. living area: types MA, MLA, MLS, LS. garage: types AG, DG, BG,
# BG2, BG1, AGU. carport: types CP, CPD, CPDM, CPM, ECPM, ECPDM, MCP,
# MCPD, AC, RVC. porch: types OP, SP, EP, GP. deck and patio: types WD,
# PAT, PC. swimming pool: types PO. basement (finished and unfinished):
# types BTF, BSM, BTS, BTU. finished basement: types BTF. accessory
# dwelling: types GA.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 21,657
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 80.2% (B
# 100.0%, E 79.6%, M 99.8%), per-property median 1416. garage_area_sqft
# A 28.1% (B 9.2%, E 17.9%, M 0.6%), per-property median 552. has_garage
# A 28.1% (B 9.2%, E 17.9%, M 0.6%). garage_type A 28.1% (B 9.2%, E
# 17.9%, M 0.6%), 6 distinct codes. has_carport A 37.7% (B 15.4%, E
# 47.7%, M 12.1%). porch_area_sqft A 72.8% (B 89.2%, E 74.6%, M 55.4%),
# per-property median 264. deck_area_sqft A 34.0% (B 20.0%, E 26.3%, M
# 40.2%), per-property median 208. has_pool A 1.7% (B 3.1%, E 6.2%, M
# 0.0%). basement_area_sqft A 0.1% (B 0.0%, E 0.1%, M 0.0%),
# per-property median 768. has_basement A 0.1% (B 0.0%, E 0.1%, M 0.0%).
# basement_finished_area_sqft A 0.1% (B 0.0%, E 0.0%, M 0.0%),
# per-property median 806. has_accessory_dwelling A 0.0% (B 0.0%, E
# 0.0%, M 0.0%). quality_grade A 80.2% (B 100.0%, E 79.6%, M 99.8%), 130
# distinct codes. year_built A 80.2% (B 100.0%, E 79.6%, M 99.7%),
# per-property median 1985. effective_year_built A 80.2% (B 100.0%, E
# 79.6%, M 99.6%), per-property median 1985.

description: >-
  Polk County, TX certified appraisal roll, improvement detail member: living, garage,
  porch and deck areas, class and feature flags per property.

admin_id: US-TX-POL

entity:
  entity_type: property
  source:
    source_id: polkcad
    # Same download as the roll; see its terms note.
    license: "unknown (no terms on the open-records page)"
    redistribution_restricted: null
    portal_url: "https://polkcad.org/open-records"
    download_url: "https://polkcad.sharepoint.com/:u:/s/PolkCADWebsiteDocumentLibrary/IQCt5JPvlJ8TR5QUbVNI2Xt-AVMpt6wb1ys_TrWHoiQKqhE?download=1"
  version: 2026

compressed_file_name: "2026-Real Data Export.zip"
uncompressed_file_name: "2026-08-05_001616_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MA', 'MLA', 'MLS', 'LS']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['AG', 'DG', 'BG', 'BG2',
      'BG1', 'AGU']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['AG', 'DG', 'BG', 'BG2', 'BG1', 'AGU']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['AG', 'DG', 'BG', 'BG2',
      'BG1', 'AGU']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['CP', 'CPD', 'CPDM', 'CPM', 'ECPM', 'ECPDM', 'MCP', 'MCPD', 'AC', 'RVC']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['OP', 'SP', 'EP', 'GP']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['WD', 'PAT', 'PC']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['PO']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['BTF', 'BSM', 'BTS', 'BTU'])
      & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['BTF', 'BSM', 'BTS', 'BTU']
        output: true
    output: has_basement
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['BTF']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_finished_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['GA']
        output: true
    output: has_accessory_dwelling
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['MA', 'MLA', 'MLS', 'LS']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['MA', 'MLA', 'MLS', 'LS']) &
      (year_built > 1800) & (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['MA', 'MLA', 'MLS',
      'LS']) & (effective_year_built > 1800) & (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max
  basement_finished_area_sqft: sum
  has_accessory_dwelling: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-POL_property-polkcad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
