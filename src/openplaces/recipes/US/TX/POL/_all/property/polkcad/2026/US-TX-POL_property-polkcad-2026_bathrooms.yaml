# Recipe: Polk County, TX certified appraisal roll, improvement
# features, bathrooms (Polk CAD). Same member (PACS File #9) and row
# rule as US-TX-POL_property-polkcad-2026_bedrooms; read its header
# first. This header covers what differs for baths.
#
# Polk's "Plumbing" attribute is a bath count, not a fixture count: the
# codes are decimals ("2.00", "1.00", "1.50", "3.00", "2.50"), median 2,
# with halves already folded in as .5, which is the registry's
# n_bathrooms definition. There is no separate half-bath attribute.
# ".00" (913 rows, 3.4%) is nulled like the bedroom sentinel: 91.6% of
# those buildings also read "0" bedrooms, i.e. nothing was recorded.
# Values of 8 and above (64 rows) are commercial or multi-unit totals,
# left for curate's range checks.
#
# MEASURED on the 2026 certified export: 26,754 rows over 24,839
# properties; a nonzero count on 78.6% of single-family (A), 94.1% of
# multifamily (B), 77.2% of rural improved (E) and 97.8% of mobile homes
# (M). 168 improvements carry two or more rows (78% equal); first
# differs from max on 8 property totals.

description: >-
  Polk County, TX certified appraisal roll, improvement features member:
  bathrooms per building (halves as .5), summed to the property.

admin_id: US-TX-POL

entity:
  entity_type: property
  source:
    source_id: polkcad
    # Same download as the roll; see its terms note.
    license: "unknown (no terms on the open-records page)"
    redistribution_restricted: null
    portal_url: "https://polkcad.org/open-records"
    download_url: "https://polkcad.sharepoint.com/:u:/s/PolkCADWebsiteDocumentLibrary/IQCt5JPvlJ8TR5QUbVNI2Xt-AVMpt6wb1ys_TrWHoiQKqhE?download=1"
  version: 2026

compressed_file_name: "2026-Real Data Export.zip"
uncompressed_file_name: "2026-08-05_001616_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

query: "imprv_attr_desc == 'Plumbing'"

# One row per building, then summed across buildings.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms
  - type: unary
    operation: null_if_equal
    input: n_bathrooms
    args:
      value: 0
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_bathrooms: sum

supplements: US-TX-POL_property-polkcad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
