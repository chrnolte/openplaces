# Recipe: Bee County, TX certified appraisal roll, improvement features
# from the improvement detail member (PACS File #8, one row per building
# component). Same download as US-TX-BEE_property-beecad-2025; read that
# roll's header for the source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2026 (0 is the district's
# blank).
#
# TYPES. living area: types RES FRM, RES BRK, LA. garage: types GAR BAT,
# GAR FDE, GAR FAT, AG, DG, GAR BDE. carport: types CPT FRM, CPT PF,
# CPT, CPT BRK. porch: types PCH FRM, PCH BRK, PORCHES, SCN PCH, PCH.
# deck and patio: types PTO FRM, DECK, PTO BRK. swimming pool: types
# SWIM POOL, POOL.
#
# MEASURED on the 2025 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 7,178 single-family
# properties (improvement state class A, File #7); B, E and M the other
# residential classes. living_area_sqft A 90.1% (B 8.1%, E 72.6%, M
# 5.1%), per-property median 1304. garage_area_sqft A 36.1% (B 6.1%, E
# 29.4%, M 2.6%), per-property median 458.5. has_garage A 36.1% (B 6.1%,
# E 29.4%, M 2.6%). garage_type A 36.1% (B 6.1%, E 29.4%, M 2.6%), 6
# distinct codes. has_carport A 35.6% (B 3.0%, E 36.5%, M 21.0%).
# porch_area_sqft A 80.7% (B 7.1%, E 69.3%, M 39.5%), per-property
# median 112. deck_area_sqft A 20.6% (B 0.0%, E 16.0%, M 22.7%),
# per-property median 220. has_pool A 2.2% (B 7.1%, E 5.6%, M 0.0%).
# quality_grade A 90.1% (B 8.1%, E 72.6%, M 5.1%), 59 distinct codes.
# year_built A 90.0% (B 8.1%, E 72.6%, M 5.1%), per-property median
# 1976. effective_year_built A 90.0% (B 8.1%, E 72.6%, M 5.1%),
# per-property median 1976.

description: >-
  Bee County, TX certified appraisal roll, improvement detail member: living, garage,
  porch and deck areas, class and feature flags per property.

admin_id: US-TX-BEE

entity:
  entity_type: property
  source:
    source_id: beecad
    # Same download as the roll; see its terms note.
    license: >-
      unknown (no terms on the download page)
    redistribution_restricted: null
    portal_url: "https://beecad.org/data-and-records/"
    download_url: "https://beecad.org/wp-content/uploads/2025/09/BEE-CAD-2025-CERTIFIED-APPRAISAL-ROLL-CSV.zip"
  version: 2025

compressed_file_name: "BEE-CAD-2025-CERTIFIED-APPRAISAL-ROLL-CSV.zip"
uncompressed_file_name: "2025-07-25_000292_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['RES FRM', 'RES BRK', 'LA'])
      & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['GAR BAT', 'GAR FDE', 'GAR
      FAT', 'AG', 'DG', 'GAR BDE']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['GAR BAT', 'GAR FDE', 'GAR FAT', 'AG', 'DG', 'GAR BDE']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['GAR BAT', 'GAR FDE', 'GAR
      FAT', 'AG', 'DG', 'GAR BDE']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['CPT FRM', 'CPT PF', 'CPT', 'CPT BRK']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['PCH FRM', 'PCH BRK',
      'PORCHES', 'SCN PCH', 'PCH']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['PTO FRM', 'DECK', 'PTO
      BRK']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['SWIM POOL', 'POOL']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['RES FRM', 'RES BRK', 'LA']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['RES FRM', 'RES BRK', 'LA']) &
      (year_built > 1800) & (year_built <= 2026))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['RES FRM', 'RES BRK',
      'LA']) & (effective_year_built > 1800) & (effective_year_built <= 2026))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-BEE_property-beecad-2025

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
