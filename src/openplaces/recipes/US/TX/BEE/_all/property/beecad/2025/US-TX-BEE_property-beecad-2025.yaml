# Recipe: Bee County, TX certified appraisal roll (BCAD). Same PACS
# export family, offsets and join-key trap as
# US-TX-VIC_property-victoriacad-2026: read that recipe's header first.
# This header covers only what differs for Bee.
#
# Why: the roll is what the room-count supplements beside it detail
# (supplements: this recipe). The statewide TxGIO layer carries no room
# counts.
#
# SOURCE. For 2026 the district posts PDFs only. The file below is named
# 'CSV' but is a PACS fixed-width export of the 2025 roll (export dated
# 2025-07-25), so this recipe is version 2025. It ships an 8.0.31 layout
# sheet, but its header names 8.0.0.30 and its records are 9,247 wide,
# the 8.0.30 width.
#
# LAYOUT. The export's header record names layout 8.0.0.30 and its
# property records are 9,247 characters wide. Every field mapped below
# sits at the same offset in the 8.0.30, 8.0.31, 8.0.33 and 8.0.34
# layout sheets (compared field by field); the versions differ only
# after situs_num (column 4474), where this recipe stops reading.
#
# MEASURED on the 2025 export (31,264 rows): land_state_cd 58.8%,
# imprv_state_cd 37.9%, geo_id 100.0%, market_value 100.0%. Two rows
# carry no tax year and one prop_id repeats. The roll also carries
# personal-property and mineral accounts, which TxGIO omits by design,
# so the key overlap is stated both ways: of all prop_ids
# (zero-stripped) 50.6% are in TxGIO's Prop_ID for the county, of the
# 18,390 with a land_state_cd 84.9%, and 95.3% of TxGIO's 16,596 ids are
# found here. The bundled parcel_id_local conversion gives the same
# overlap on both sides.
#
# ROOM COUNTS: supplement _bathrooms only. 'Number Bedrooms' is free
# text on 27 properties; no rooms or stories attribute, and no room-like
# or storey detail type in File #8.

description: >-
  Bee County, TX certified appraisal roll (PACS 8.0.30 export): state land-use codes,
  legal acreage and market value keyed by property.

admin_id: US-TX-BEE

entity:
  entity_type: property
  source:
    source_id: beecad
    # Checked 2026-09-12: no licence, resale or redistribution terms on
    # the download page; the charges PDF there applies to Public
    # Information Act requests, not the posted files.
    license: >-
      unknown (no terms on the download page)
    redistribution_restricted: null
    portal_url: "https://beecad.org/data-and-records/"
    download_url: "https://beecad.org/wp-content/uploads/2025/09/BEE-CAD-2025-CERTIFIED-APPRAISAL-ROLL-CSV.zip"
  version: 2025

compressed_file_name: "BEE-CAD-2025-CERTIFIED-APPRAISAL-ROLL-CSV.zip"
uncompressed_file_name: "2025-07-25_000292_APPRAISAL_INFO.TXT"

process_by:
  admin_level: 3

# The PACS export is latin-1, not UTF-8.
encoding: latin-1

# PACS File #2 (Property), offsets from the layout sheet; see
# LAYOUT above. Reading stops at situs_num (column 4474).
fixed_width:
  - [prop_id, 12]
  - [filler, 5]
  - [prop_val_yr, 5]
  - [filler, 524]
  - [geo_id, 50]
  - [filler, 443]
  - [situs_street_prefx, 10]
  - [situs_street, 50]
  - [filler, 10]
  - [situs_city, 30]
  - [situs_zip, 10]
  - [legal_desc, 255]
  - [filler, 255]
  - [legal_acreage, 16]
  - [abs_subdv_cd, 10]
  - [hood_cd, 10]
  - [filler, 220]
  - [appraised_val, 15]
  - [filler, 801]
  - [imprv_state_cd, 10]
  - [land_state_cd, 10]
  - [filler, 1462]
  - [market_value, 14]
  - [filler, 232]
  - [situs_num, 15]

transformations:
  # legal_acreage carries 4 implied decimals (PACS layout: "Legal
  # Acreage (4 Decimals)"), so it is divided by 10,000.
  - type: unary
    operation: to_numeric
    input: land_area_ac
    output: land_area_ac
  - type: expression
    expression: "land_area_ac / 10000"
    inputs: [land_area_ac]
    output: land_area_ac
  # Strip the PACS zero-padding so parcel_id_local matches TxGIO's
  # bare form.
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor

columns:
  parcel_id_admin2_2: geo_id
  use_group_code: land_state_cd
  use_subgroup_code: imprv_state_cd
  address_number: situs_num
  address_street: situs_street
  city: situs_city
  postal_code: situs_zip
  legal_description: legal_desc
  land_area_ac: legal_acreage
  # PACS market_value is the district's land-plus-structure total; see
  # the Victoria roll for why it is total_value, not appraised_val.
  total_value: market_value
  tax_year: prop_val_yr

columns_to_categorical:
  - use_group_code
  - use_subgroup_code

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
