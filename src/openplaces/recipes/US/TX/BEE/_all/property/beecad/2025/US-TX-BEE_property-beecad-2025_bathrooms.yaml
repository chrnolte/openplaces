# Recipe: Bee County, TX certified appraisal roll, improvement features,
# bathrooms (BCAD). Same member (PACS File #9) as
# US-TX-VIC_property-victoriacad-2026_bedrooms; read its header first.
# This header covers what differs for Bee.
#
# Bee's 'Plumbing' attribute is free text, and most of it is a bath
# total: '1BATH', '2BATHS', '1.5BATH', '3.5BATHS', and a written half
# run into the digit, '11/2BATHS' or '1-1/2BATHS', which means 1.5, not
# eleven halves. The query keeps those two forms, one digit with an
# optional .5 or a written half, and the transformations fold them to
# the registry's n_bathrooms (halves as .5). Utility words ('SEWER',
# 'NOWATER', 'SPPLBG'), odd forms ('1.3BATHS', '11/1BATH', '1/2BATH',
# '3BD/2BATH') are left out (see MEASURED). 'Number Baths' holds
# restroom counts ('2RR', '8RST') on 1.2% of single-family properties
# and is not mapped; 'Number Bedrooms' (27 properties, free text) is too
# thin.
#
# MEASURED on the 2025 export: 'Plumbing' on 4,370 rows over 4,300
# properties; the query keeps 4,330 bath-coded rows and drops 40. After
# the row rule, 4,273 properties, median 1, p99 3; 7.1% end in .5.
# Coverage (value above 0) is 53.1% of the 7,178 single-family (A)
# properties, 25.3% of the 99 multifamily (B), 19.4% of the 2,032 rural
# improved (E) and 0.0% of the 877 mobile homes (M).
#
# ROW RULE. 49 improvements carry two or more kept rows, 78% of them
# with equal values, so the rows mostly repeat one building's figure
# across its components. drop_duplicates keeps the first row per
# (prop_id, imprv_id), and aggregation_function sums distinct buildings
# to the property. Summing all rows would change 1.15% of properties.

description: >-
  Bee County, TX certified appraisal roll, improvement features member: bathrooms per
  building (halves as .5), summed to the property.

admin_id: US-TX-BEE

entity:
  entity_type: property
  source:
    source_id: beecad
    # Same download as the roll; see its terms note.
    license: >-
      unknown (no terms on the download page)
    redistribution_restricted: null
    portal_url: "https://beecad.org/data-and-records/"
    download_url: "https://beecad.org/wp-content/uploads/2025/09/BEE-CAD-2025-CERTIFIED-APPRAISAL-ROLL-CSV.zip"
  version: 2025

compressed_file_name: "BEE-CAD-2025-CERTIFIED-APPRAISAL-ROLL-CSV.zip"
uncompressed_file_name: "2025-07-25_000292_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features), 87 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Plumbing'
  and n_bathrooms.str.fullmatch('[1-9]([.]5)?BATHS?|[1-9]-?1/2BATHS?', na=False)

# One row per building; see ROW RULE.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  # '2BATHS', '1.5BATH': the number before BATH.
  - type: string
    operation: extract_named
    input: n_bathrooms
    args:
      pattern: '^(?P<n>[1-9](?:\.5)?)BATHS?$'
    output: bath_whole
  # '11/2BATHS', '1-1/2BATHS': one digit, then a written half.
  - type: string
    operation: extract_named
    input: n_bathrooms
    args:
      pattern: '^(?P<n>[1-9])-?1/2BATHS?$'
    output: bath_half_form
  - type: unary
    operation: to_numeric
    input: bath_whole
    output: bath_whole
  - type: unary
    operation: to_numeric
    input: bath_half_form
    output: bath_half_form
  - type: expression
    expression: "bath_half_form + 0.5"
    inputs: [bath_half_form]
    output: bath_half_form
  # Exactly one form matches a kept row, so the sum is that one.
  - type: aggregate
    operation: sum
    inputs: [bath_whole, bath_half_form]
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id
  - bath_whole
  - bath_half_form

aggregation_function:
  n_bathrooms: sum

# Details the roll's properties: joined by link_by_id, skipped
# by the property spine's union.
supplements: US-TX-BEE_property-beecad-2025

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
