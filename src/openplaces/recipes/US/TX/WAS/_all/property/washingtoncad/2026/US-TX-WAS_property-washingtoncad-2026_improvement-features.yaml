# Recipe: Washington County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-WAS_property-washingtoncad-2026; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2027 (0 is the district's
# blank).
#
# TYPES. living area: types MA, MA2, MAA, MA3, MA4, LQ. garage: types
# GA, DG, AG. carport: types CP. porch: types OP, SP. deck and patio:
# types UPC, WD, RWD, CO, UPB, UPP. swimming pool: types SWM. basement
# (finished and unfinished): types BSMTU, BSMTF, BSMT. finished
# basement: types BSMTF. accessory dwelling: types LQ.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 9,766 single-family
# properties (improvement state class A, File #7); B, E and M the other
# residential classes. living_area_sqft A 95.9% (B 100.0%, E 88.7%, M
# 99.6%), per-property median 1679. garage_area_sqft A 56.1% (B 28.0%, E
# 40.1%, M 0.7%), per-property median 485. has_garage A 56.1% (B 28.0%,
# E 40.1%, M 0.7%). garage_type A 56.1% (B 28.0%, E 40.1%, M 0.7%), 3
# distinct codes. has_carport A 11.1% (B 16.7%, E 15.0%, M 5.4%).
# porch_area_sqft A 86.9% (B 88.6%, E 80.0%, M 13.2%), per-property
# median 144. deck_area_sqft A 62.7% (B 66.7%, E 61.3%, M 76.7%),
# per-property median 261. has_pool A 5.3% (B 4.5%, E 12.2%, M 0.1%).
# basement_area_sqft A 0.0% (B 0.0%, E 0.0%, M 0.0%), per-property
# median 1446. has_basement A 0.0% (B 0.0%, E 0.0%, M 0.0%).
# basement_finished_area_sqft A 0.0% (B 0.0%, E 0.0%, M 0.0%).
# has_accessory_dwelling A 1.3% (B 0.8%, E 6.1%, M 0.2%). quality_grade
# A 95.9% (B 100.0%, E 88.7%, M 99.6%), 152 distinct codes. year_built A
# 81.9% (B 86.4%, E 77.3%, M 84.8%), per-property median 1993.
# effective_year_built A 95.6% (B 90.9%, E 88.4%, M 98.2%), per-property
# median 2000.

description: >-
  Washington County, TX certified appraisal roll, improvement detail member: living,
  garage, porch and deck areas, class and feature flags per property.

admin_id: US-TX-WAS

entity:
  entity_type: property
  source:
    source_id: washingtoncad
    # Same download as the roll; see its terms note.
    license: >-
      no licence; download page disclaimer: 'By clicking the links below, the user
      acknowledges they have read this disclaimer and accepts the limitations of the
      data contained herein.'
    redistribution_restricted: null
    portal_url: "https://washingtoncad.org/downloads/"
    download_url: "https://washingtoncad.org/wp-content/uploads/2026/07/2026-Certified-Appraisal-Roll.zip"
  version: 2026

compressed_file_name: "2026-Certified-Appraisal-Roll.zip"
uncompressed_file_name: "2026-07-21_002016_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MAA', 'MA3',
      'MA4', 'LQ']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['GA', 'DG', 'AG']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['GA', 'DG', 'AG']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['GA', 'DG', 'AG']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['CP']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['OP', 'SP']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['UPC', 'WD', 'RWD', 'CO',
      'UPB', 'UPP']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['SWM']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['BSMTU', 'BSMTF', 'BSMT']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['BSMTU', 'BSMTF', 'BSMT']
        output: true
    output: has_basement
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['BSMTF']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_finished_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['LQ']
        output: true
    output: has_accessory_dwelling
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MAA', 'MA3',
      'MA4', 'LQ']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MAA', 'MA3', 'MA4',
      'LQ']) & (year_built > 1800) & (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MAA',
      'MA3', 'MA4', 'LQ']) & (effective_year_built > 1800) &
      (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max
  basement_finished_area_sqft: sum
  has_accessory_dwelling: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-WAS_property-washingtoncad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
