# Recipe: Atascosa County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-ATA_property-atascosacad-2026; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2027 (0 is the district's
# blank).
#
# TYPES. living area: types MA, MAA, ADDN, MA2, MA3, GUEST HOUS. garage:
# types AG, GAR, DG, DGAR, AGU, DGU. carport: types DCP, ACP, CARPORT.
# porch: types OP, EP, SCP. deck and patio: types DECK, PAT, PATIO, WD.
# swimming pool: types PL. basement (finished and unfinished): types
# BASEMENT. solar device: types SOLAR. accessory dwelling: types GUEST
# HOUS, GAPT.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 15,031
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 90.0% (B
# 100.0%, E 88.2%, M 100.0%), per-property median 1512. garage_area_sqft
# A 25.9% (B 24.6%, E 18.7%, M 0.7%), per-property median 483.
# has_garage A 25.9% (B 24.6%, E 18.7%, M 0.7%). garage_type A 25.9% (B
# 24.6%, E 18.7%, M 0.7%), 6 distinct codes. has_carport A 34.4% (B
# 35.9%, E 40.6%, M 11.7%). porch_area_sqft A 73.6% (B 83.2%, E 74.0%, M
# 39.6%), per-property median 219. deck_area_sqft A 34.7% (B 18.6%, E
# 29.4%, M 49.5%), per-property median 160. has_pool A 2.9% (B 1.2%, E
# 5.5%, M 0.1%). basement_area_sqft A 0.0% (B 0.0%, E 0.1%, M 0.0%),
# per-property median 1390. has_basement A 0.0% (B 0.0%, E 0.1%, M
# 0.0%). has_solar A 0.1% (B 0.0%, E 0.0%, M 0.0%).
# has_accessory_dwelling A 1.5% (B 0.0%, E 2.7%, M 0.1%). quality_grade
# A 90.0% (B 100.0%, E 88.2%, M 100.0%), 246 distinct codes. year_built
# A 89.9% (B 100.0%, E 88.2%, M 100.0%), per-property median 1993.
# effective_year_built A 90.0% (B 100.0%, E 88.2%, M 100.0%),
# per-property median 1998.

description: >-
  Atascosa County, TX certified appraisal roll, improvement detail member: living,
  garage, porch and deck areas, class and feature flags per property.

admin_id: US-TX-ATA

entity:
  entity_type: property
  source:
    source_id: atascosacad
    # Same download as the roll; see its terms note.
    license: "unknown (footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://atascosacad.com/data-export/"
    download_url: "https://atascosacad.com/wp-content/uploads/2026/07/2026-ATASCOSA-CERTIFIED-EXPORT.zip"
  version: 2026

compressed_file_name: "2026-ATASCOSA-CERTIFIED-EXPORT.zip"
# The zip's single top folder is stripped on extraction.
uncompressed_file_name: "2026-07-20_003275_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MA', 'MAA', 'ADDN', 'MA2',
      'MA3', 'GUEST HOUS']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['AG', 'GAR', 'DG', 'DGAR',
      'AGU', 'DGU']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['AG', 'GAR', 'DG', 'DGAR', 'AGU', 'DGU']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['AG', 'GAR', 'DG', 'DGAR',
      'AGU', 'DGU']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['DCP', 'ACP', 'CARPORT']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['OP', 'EP', 'SCP']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['DECK', 'PAT', 'PATIO',
      'WD']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['PL']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['BASEMENT']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['BASEMENT']
        output: true
    output: has_basement
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['SOLAR']
        output: true
    output: has_solar
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['GUEST HOUS', 'GAPT']
        output: true
    output: has_accessory_dwelling
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['MA', 'MAA', 'ADDN', 'MA2',
      'MA3', 'GUEST HOUS']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['MA', 'MAA', 'ADDN', 'MA2',
      'MA3', 'GUEST HOUS']) & (year_built > 1800) & (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['MA', 'MAA', 'ADDN',
      'MA2', 'MA3', 'GUEST HOUS']) & (effective_year_built > 1800) &
      (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max
  has_solar: max
  has_accessory_dwelling: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-ATA_property-atascosacad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
