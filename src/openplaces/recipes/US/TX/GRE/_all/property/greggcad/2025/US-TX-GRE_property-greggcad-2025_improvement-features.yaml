# Recipe: Gregg County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-GRE_property-greggcad-2025; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2026 (0 is the district's
# blank).
#
# Gregg's SP is a screen porch; SP1 to SP3 are pools.
#
# TYPES. living area: types MA, ADDN, MA2, MA1.5, ADDN-FRM, GST HSE,
# MA3, MA4, MASP, HSE, RES, FRAME-ADDN. garage: types AGF2, AGF1, DGU2,
# DGF2, DGU1, AGU1, AGU2, DGF1, GAR, DETGAR, DGU3. carport: types CP,
# CP-MTL. porch: types OP, SP, GP, EP, SCREEN-POR. deck and patio: types
# PC, PO, WD, WOOD-DECK. swimming pool: types SP2, SP1, SP3, POOL,
# POOL-16X36. basement (finished and unfinished): types BASE. accessory
# dwelling: types GST HSE, GAPT.
#
# MEASURED on the 2025 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 35,661
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 98.7% (B
# 95.4%, E 91.5%, M 99.5%), per-property median 1695. garage_area_sqft A
# 56.1% (B 7.2%, E 36.5%, M 0.5%), per-property median 484. has_garage A
# 56.6% (B 7.3%, E 37.1%, M 0.7%). garage_type A 56.6% (B 7.3%, E 37.1%,
# M 0.7%), 11 distinct codes. has_carport A 32.1% (B 26.7%, E 43.7%, M
# 20.8%). porch_area_sqft A 86.0% (B 68.5%, E 67.9%, M 7.6%),
# per-property median 118. deck_area_sqft A 53.2% (B 47.0%, E 36.7%, M
# 9.7%), per-property median 234. has_pool A 7.3% (B 0.5%, E 11.3%, M
# 0.0%). basement_area_sqft A 0.2% (B 0.1%, E 0.6%, M 0.0%),
# per-property median 560.5. has_basement A 0.2% (B 0.1%, E 0.6%, M
# 0.0%). has_accessory_dwelling A 0.9% (B 0.2%, E 2.5%, M 0.1%).
# quality_grade A 98.7% (B 92.9%, E 91.3%, M 98.8%), 273 distinct codes.
# year_built A 98.7% (B 98.6%, E 90.7%, M 99.0%), per-property median
# 1974. effective_year_built A 98.7% (B 99.2%, E 91.5%, M 99.6%),
# per-property median 1974.

description: >-
  Gregg County, TX certified appraisal roll, improvement detail member: living, garage,
  porch and deck areas, class and feature flags per property.

admin_id: US-TX-GRE

entity:
  entity_type: property
  source:
    source_id: greggcad
    # Same download as the roll; see its terms note.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://gcad.org/downloads/"
    download_url: "https://gcad.org/wp-content/uploads/sites/24/2025/09/2025_gcad_certified_real_appraisal_data.zip"
  version: 2025

compressed_file_name: "2025_gcad_certified_real_appraisal_data.zip"
uncompressed_file_name: "2025-07-22_004063_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MA', 'ADDN', 'MA2', 'MA1.5',
      'ADDN-FRM', 'GST HSE', 'MA3', 'MA4', 'MASP', 'HSE', 'RES', 'FRAME-ADDN'])
      & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['AGF2', 'AGF1', 'DGU2',
      'DGF2', 'DGU1', 'AGU1', 'AGU2', 'DGF1', 'GAR', 'DETGAR', 'DGU3']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['AGF2', 'AGF1', 'DGU2', 'DGF2', 'DGU1', 'AGU1', 'AGU2', 'DGF1', 'GAR',
          'DETGAR', 'DGU3']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['AGF2', 'AGF1', 'DGU2',
      'DGF2', 'DGU1', 'AGU1', 'AGU2', 'DGF1', 'GAR', 'DETGAR', 'DGU3']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['CP', 'CP-MTL']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['OP', 'SP', 'GP', 'EP',
      'SCREEN-POR']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['PC', 'PO', 'WD',
      'WOOD-DECK']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['SP2', 'SP1', 'SP3', 'POOL', 'POOL-16X36']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['BASE']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['BASE']
        output: true
    output: has_basement
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['GST HSE', 'GAPT']
        output: true
    output: has_accessory_dwelling
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['MA', 'ADDN', 'MA2', 'MA1.5',
      'ADDN-FRM', 'GST HSE', 'MA3', 'MA4', 'MASP', 'HSE', 'RES', 'FRAME-ADDN']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['MA', 'ADDN', 'MA2', 'MA1.5',
      'ADDN-FRM', 'GST HSE', 'MA3', 'MA4', 'MASP', 'HSE', 'RES', 'FRAME-ADDN'])
      & (year_built > 1800) & (year_built <= 2026))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['MA', 'ADDN', 'MA2',
      'MA1.5', 'ADDN-FRM', 'GST HSE', 'MA3', 'MA4', 'MASP', 'HSE', 'RES',
      'FRAME-ADDN']) & (effective_year_built > 1800) & (effective_year_built <=
      2026))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max
  has_accessory_dwelling: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-GRE_property-greggcad-2025

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
