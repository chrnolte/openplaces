# Recipe: Gregg County, TX certified appraisal roll, tax year 2025 --
# improvement features, bathrooms (Gregg Appraisal District). Same
# member (PACS File #9, 87 characters wide in 8.0.30 as in 8.0.34) and
# row rule as US-TX-VIC_property-victoriacad-2026_bedrooms; read its
# header first. This header covers what differs for Gregg.
#
# Gregg's "Plumbing" attribute is a bath count, not the fixture count
# Victoria's attribute of the same name holds: codes 2, 1, 2.5, 1.5, 3,
# 4, 3.5 lead, numeric median 2, with halves folded in as .5 (the
# registry's n_bathrooms definition; no separate half count exists).
# The query keeps positive numbers only, which leaves out codes
# starting "-" (3 rows) and "0" (1 row). A row the query admits must
# parse, because link_by_id sums a property whose only rows are null to
# 0. 3 codes above 10 are keying errors left for curate's range checks.
#
# MEASURED on the 2025 export: 38,072 rows over 37,198 properties.
# After cleaning, 93.6% of the 35,661 single-family (A) properties
# carry it, 92.9% of multifamily (B), 67.8% of rural improved (E), 1.5%
# of mobile homes (M); per property median 2, p99 4.5.
#
# ROW RULE. 117 of 37,911 improvements carry two or more rows, and 50%
# of those agree, so the rule was measured against the count expected
# from the improvement's area (median of single-row improvements in the
# same area decile): first row off by 0.72 on average, max by 0.70, sum
# by 2.82. drop_duplicates keeps the first row per building; the sum
# then adds distinct buildings.

description: >-
  Gregg County, TX certified appraisal roll 2025, improvement features
  member: bathrooms per building (halves as .5), summed to the property.

admin_id: US-TX-GRE

entity:
  entity_type: property
  source:
    source_id: greggcad
    # Same download as the roll; see its terms note.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://gcad.org/downloads/"
    download_url: "https://gcad.org/wp-content/uploads/sites/24/2025/09/2025_gcad_certified_real_appraisal_data.zip"
  version: 2025

compressed_file_name: "2025_gcad_certified_real_appraisal_data.zip"
uncompressed_file_name: "2025-07-22_004063_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Plumbing'
  and n_bathrooms.str.contains('^[0-9]*[.]?[0-9]+$', na=False)
  and n_bathrooms.str.contains('[1-9]', na=False)

# One row per building; see the header's ROW RULE.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_bathrooms: sum

supplements: US-TX-GRE_property-greggcad-2025

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
