# Recipe: McLennan County, TX certified appraisal export, improvement
# features, bathrooms (MCAD). Same member (PACS File #9) and row rule as
# US-TX-MCL_property-mclennancad-2026_bedrooms; read its header first.
#
# FULL AND HALF BATHS are separate attributes here: "22 No of Full
# Baths" ("1 Ba" to "27 Ba"; 17 rows read "2.5 Ba" and are kept as 2.5)
# and "23 No of Half Bath" ("1 Hba" to "6 Hba"). The recipe reads both,
# keeps one row per building per attribute, halves the half-bath count
# and sums, so n_bathrooms = full + 0.5 x half, the registry's
# definition. A building with no half-bath row contributes its full
# count only: the half attribute appears only where a half bath exists
# (15.1% of single-family properties), so a missing row is read as no
# half bath. That reading is not confirmed by the district.
#
# MEASURED on the 2026 certified export: full baths on 80,725 rows over
# 78,199 properties (A 92.1%, B 89.3%, E 80.7%, M 0.2%; median 2); half
# baths on 13,184 rows over 12,998 properties (A 15.1%, B 10.1%, E
# 17.9%). Within one improvement, 184 carry two or more full-bath rows
# (60% equal) and 37 two or more half-bath rows (89% equal).
#
# n_half_bathrooms is not published as its own column: as recorded it
# covers 15.1% of single-family properties, under the 25% threshold,
# and whether a missing row means zero is the open question above.
#
# NOT MAPPED. "31 Bath per Unit" (527 rows, 262 properties) is a
# typical-unit figure, not a building total. "11 Plumbing" is a
# plumbing quality/extras code ("04Non None", "05AFxt Add", "01Avg
# Aver"), not a count.

description: >-
  McLennan County, TX certified appraisal export, improvement features
  member: full plus half bathrooms (halves as .5) per building, summed.

admin_id: US-TX-MCL

entity:
  entity_type: property
  source:
    source_id: mclennancad
    # Same download as the roll; see its terms note.
    license: >-
      site statement: 'considered in the public domain and is distributed
      without warranty of any kind'
    terms_url: "https://www.mclennancad.org/"
    redistribution_restricted: false
    portal_url: "https://www.mclennancad.org/"
    # No download_url: see the roll's header.
  version: 2026

compressed_file_name: "DATA EXPORT 7.29.26.zip"
uncompressed_file_name: "2026-07-29_2026_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

query: >-
  imprv_attr_desc in ['22 No of Full Baths', '23 No of Half Bath']

# One row per building per attribute, then summed to the property.
drop_duplicates: [prop_id, imprv_id, imprv_attr_desc]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: string
    operation: extract_named
    input: n_bathrooms
    args:
      pattern: '^(?P<n>\d+(?:\.\d+)?)'
    output: n_bathrooms
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms
  # A half-bath row counts 0.5 per half bath.
  - type: expression
    expression: >-
      n_bathrooms * (1 - 0.5 * (imprv_attr_desc == '23 No of Half Bath'))
    inputs: [n_bathrooms, imprv_attr_desc]
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_bathrooms: sum

supplements: US-TX-MCL_property-mclennancad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
