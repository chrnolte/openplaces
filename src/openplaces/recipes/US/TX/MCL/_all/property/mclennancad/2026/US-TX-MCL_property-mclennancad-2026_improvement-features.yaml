# Recipe: McLennan County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-MCL_property-mclennancad-2026; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2027 (0 is the district's
# blank).
#
# The basement main areas (MA93 finished, MA94 and MA95 unfinished) are
# basement, not living area.
#
# TYPES. living area: types MA1, MA2, MA91, MAFR, MA3, MA92, MA4, MA5,
# MA6, MA7, MA22, MA8, MA10, MA9, MA12, MA11. garage: types 041, 031,
# 033, 043, 030, 039, 042. carport: types 061, 051, 063, 059, 052, 053,
# 058. porch: types 011, 021, 012, 013, 022, 018, 016, 014, 015. deck
# and patio: types 452, 439, 339. swimming pool: types 449. basement
# (finished and unfinished): types MA93, MA94, MA95. finished basement:
# types MA93.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 76,240
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 96.9% (B
# 99.6%, E 89.3%, M 99.7%), per-property median 1628. garage_area_sqft A
# 62.6% (B 30.1%, E 44.8%, M 0.0%), per-property median 480. has_garage
# A 62.6% (B 30.1%, E 44.8%, M 0.0%). garage_type A 62.6% (B 30.1%, E
# 44.8%, M 0.0%), 7 distinct codes. has_carport A 21.1% (B 28.2%, E
# 30.0%, M 0.4%). porch_area_sqft A 90.3% (B 92.0%, E 78.4%, M 0.6%),
# per-property median 189. deck_area_sqft A 33.5% (B 33.3%, E 25.2%, M
# 0.3%), per-property median 224. has_pool A 6.1% (B 3.8%, E 10.1%, M
# 0.1%). basement_area_sqft A 0.4% (B 0.4%, E 0.4%, M 0.0%),
# per-property median 480. has_basement A 0.4% (B 0.4%, E 0.4%, M 0.0%).
# basement_finished_area_sqft A 0.2% (B 0.2%, E 0.2%, M 0.0%),
# per-property median 652. quality_grade A 96.9% (B 99.6%, E 89.3%, M
# 99.8%), 636 distinct codes. year_built A 96.9% (B 99.5%, E 89.3%, M
# 99.4%), per-property median 1978. effective_year_built A 96.9% (B
# 99.6%, E 89.3%, M 99.8%), per-property median 1978.

description: >-
  McLennan County, TX certified appraisal roll, improvement detail member: living,
  garage, porch and deck areas, class and feature flags per property.

admin_id: US-TX-MCL

entity:
  entity_type: property
  source:
    source_id: mclennancad
    # Same download as the roll; see its terms note.
    license: >-
      site statement: 'considered in the public domain and is distributed
      without warranty of any kind'
    terms_url: "https://www.mclennancad.org/"
    redistribution_restricted: false
    portal_url: "https://www.mclennancad.org/"
    # No download_url: see the roll's header.
  version: 2026

compressed_file_name: "DATA EXPORT 7.29.26.zip"
uncompressed_file_name: "2026-07-29_2026_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MA1', 'MA2', 'MA91', 'MAFR',
      'MA3', 'MA92', 'MA4', 'MA5', 'MA6', 'MA7', 'MA22', 'MA8', 'MA10', 'MA9',
      'MA12', 'MA11']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['041', '031', '033', '043',
      '030', '039', '042']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['041', '031', '033', '043', '030', '039', '042']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['041', '031', '033',
      '043', '030', '039', '042']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['061', '051', '063', '059', '052', '053', '058']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['011', '021', '012', '013',
      '022', '018', '016', '014', '015']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['452', '439', '339']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['449']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MA93', 'MA94', 'MA95']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['MA93', 'MA94', 'MA95']
        output: true
    output: has_basement
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MA93']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_finished_area_sqft
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['MA1', 'MA2', 'MA91', 'MAFR',
      'MA3', 'MA92', 'MA4', 'MA5', 'MA6', 'MA7', 'MA22', 'MA8', 'MA10', 'MA9',
      'MA12', 'MA11']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['MA1', 'MA2', 'MA91', 'MAFR',
      'MA3', 'MA92', 'MA4', 'MA5', 'MA6', 'MA7', 'MA22', 'MA8', 'MA10', 'MA9',
      'MA12', 'MA11']) & (year_built > 1800) & (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['MA1', 'MA2', 'MA91',
      'MAFR', 'MA3', 'MA92', 'MA4', 'MA5', 'MA6', 'MA7', 'MA22', 'MA8', 'MA10',
      'MA9', 'MA12', 'MA11']) & (effective_year_built > 1800) &
      (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max
  basement_finished_area_sqft: sum
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-MCL_property-mclennancad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
