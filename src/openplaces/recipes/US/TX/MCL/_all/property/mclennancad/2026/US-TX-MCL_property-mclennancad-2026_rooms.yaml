# Recipe: McLennan County, TX certified appraisal export, improvement
# features, rooms (MCAD). Same member (PACS File #9) and row rule as
# US-TX-MCL_property-mclennancad-2026_bedrooms; read its header first.
#
# "20 Room Count" holds a plain number on nearly every row (median 6,
# p90 9). A few rows carry a composite code in the form
# rooms/bedrooms/baths ("7/3/2"); the recipe reads the number before the
# first slash. A code whose leading number is followed by anything but a
# slash (a stair code keyed into this attribute on 2 rows) becomes null.
#
# MEASURED on the 2026 certified export: 38,043 rows over 36,756
# properties; A 42.8%, B 61.1%, E 35.6%, M 0.1%. 131 improvements carry
# two or more rows (34% equal); keeping the first per building instead
# of the max changes 25 property totals.

description: >-
  McLennan County, TX certified appraisal export, improvement features
  member: room count per building, summed to the property.

admin_id: US-TX-MCL

entity:
  entity_type: property
  source:
    source_id: mclennancad
    # Same download as the roll; see its terms note.
    license: >-
      site statement: 'considered in the public domain and is distributed
      without warranty of any kind'
    terms_url: "https://www.mclennancad.org/"
    redistribution_restricted: false
    portal_url: "https://www.mclennancad.org/"
    # No download_url: see the roll's header.
  version: 2026

compressed_file_name: "DATA EXPORT 7.29.26.zip"
uncompressed_file_name: "2026-07-29_2026_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_rooms: imprv_attr_cd

query: "imprv_attr_desc == '20 Room Count'"

# One row per building, then summed across buildings.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: string
    operation: extract_named
    input: n_rooms
    args:
      pattern: '^(?P<n>\d+)(?:/|$)'
    output: n_rooms
  - type: unary
    operation: to_numeric
    input: n_rooms
    output: n_rooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_rooms: sum

supplements: US-TX-MCL_property-mclennancad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: rooms
