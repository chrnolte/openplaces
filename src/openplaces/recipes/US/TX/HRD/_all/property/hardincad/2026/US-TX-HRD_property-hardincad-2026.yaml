# Recipe: Hardin County, TX certified appraisal roll (HCAD -- Hardin, not the
# unrelated Harris County "HCAD"). Same PACS 8.0.34 layout, offsets and
# join-key trap as US-TX-VIC_property-victoriacad-2026 -- see that recipe's
# header for the general shape of this source family. This header covers
# only what differs for Hardin.
#
# NOTE: hardin-cad.org also publishes older CSV/PDF "certified roll" exports
# (2019-2021, Real/Personal split) that are NOT this format -- do not confuse
# them with the ZIP export below, which only started appearing in 2022+.
#
# NOTE on row count. The roll is 58,412 rows against TxGIO's 41,635 real
# parcels (1.40x, just inside the 0.6-1.5x equivalence gate), because the
# export also carries personal-property and mineral-interest accounts that
# have no land_state_cd and are absent from TxGIO by design. Restricted to
# rows that carry a land_state_cd (43,659, 1.05x TxGIO -- a real-property
# count, not a padded one), prop_id match rate is 80.5% and geo_id match
# rate is 85.8%, both measured after the same lstrip transform as Victoria's
# recipe. Below-Victoria (94.5%/96.0%) but well above the payoff threshold.
#
# NOTE on coverage, measured on the 2026 export (58,412 rows, all):
#   land_state_cd   74.7%   imprv_state_cd   47.9%
#   geo_id         100.0%   market_value     99.99%
#
# NOTE on the id. Filed as US-TX-HAN until 2026-09-12. The admin-id
# re-mint gave HAN to Harrison County (48203); Hardin (48199) is HRD.
#
# NEIGHBORHOOD. hood_cd, the district's valuation neighborhood code
# (File #2), is mapped to tax_neighborhood_code as published. Hardin
# writes '0' for no neighborhood (on 10,460 of its 22,090 single-family
# properties), so a transformation reads '0' as missing. MEASURED on the
# 2026 export: A is the 22,090 single-family properties (improvement
# state class A, File #7); B, E and M the other residential classes.
# tax_neighborhood_code A 43.1% (B 22.5%, E 24.7%, M 13.0%), 88 distinct
# codes.

description: >-
  Hardin County, TX certified appraisal roll (PACS 8.0.34 export): state
  land-use codes, legal acreage and market value keyed by property.

admin_id: US-TX-HRD

entity:
  entity_type: property
  source:
    source_id: hardincad
    # Checked 2026-08-20 by fetching the download page: it carries only a
    # site-footer copyright over the website itself and states no terms
    # for the appraisal roll it publishes -- no licence, no attribution
    # requirement, nothing about redistribution. Texas appraisal records
    # are public information under the Property Tax Code, which likely
    # explains the silence, but silence is not a grant.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://hardin-cad.org/data-downloads/"
    download_url: "https://hardin-cad.org/wp-content/uploads/2026/08/2026-Certified-Roll.zip"
  version: 2026

compressed_file_name: "2026-Certified-Roll.zip"
uncompressed_file_name: "2026 Certified Roll/2026-08-14_000305_APPRAISAL_INFO.TXT"

process_by:
  admin_level: 3

encoding: latin-1

fixed_width:
  - [prop_id, 12]
  - [filler, 5]
  - [prop_val_yr, 5]
  - [filler, 524]
  - [geo_id, 50]
  - [filler, 443]
  - [situs_street_prefx, 10]
  - [situs_street, 50]
  - [filler, 10]
  - [situs_city, 30]
  - [situs_zip, 10]
  - [legal_desc, 255]
  - [filler, 255]
  - [legal_acreage, 16]
  - [abs_subdv_cd, 10]
  - [hood_cd, 10]
  - [filler, 220]
  - [appraised_val, 15]
  - [filler, 801]
  - [imprv_state_cd, 10]
  - [land_state_cd, 10]
  - [filler, 1462]
  - [market_value, 14]
  - [filler, 232]
  - [situs_num, 15]

transformations:
  # legal_acreage carries 4 implied decimals (PACS layout: "Legal
  # Acreage (4 Decimals)"), so it is divided by 10,000.
  - type: unary
    operation: to_numeric
    input: land_area_ac
    output: land_area_ac
  - type: expression
    expression: "land_area_ac / 10000"
    inputs: [land_area_ac]
    output: land_area_ac
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  # hood_cd '0' is the district's blank, not a neighborhood.
  - type: expression
    expression: "tax_neighborhood_code.where(tax_neighborhood_code != '0')"
    inputs: [tax_neighborhood_code]
    output: tax_neighborhood_code

columns:
  tax_neighborhood_code: hood_cd
  parcel_id_admin2_2: geo_id
  use_group_code: land_state_cd
  use_subgroup_code: imprv_state_cd
  address_number: situs_num
  address_street: situs_street
  city: situs_city
  postal_code: situs_zip
  legal_description: legal_desc
  land_area_ac: legal_acreage
  # PACS `market_value` is the appraisal district's land-plus-structure
  # total (Texas appraises at market value by statute, Tax Code 23.01),
  # and this roll publishes no land/improvement split at all -- so it is
  # `total_value`, the column the curated parcel product and the CHEER
  # apportionment read. Mapped to `market_value` before, which nothing
  # downstream consumes, leaving this county with no value evidence.
  # Deliberately not `appraised_val`, the homestead-capped figure.
  total_value: market_value
  tax_year: prop_val_yr

columns_to_categorical:
  - tax_neighborhood_code
  - use_group_code
  - use_subgroup_code

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
