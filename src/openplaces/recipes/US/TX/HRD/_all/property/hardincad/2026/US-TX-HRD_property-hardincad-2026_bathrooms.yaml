# Recipe: Hardin County, TX certified appraisal roll -- improvement
# features, bathrooms (HCAD). Same member (PACS File #9) and row rule as
# US-TX-VIC_property-victoriacad-2026_bedrooms; read its header first.
# This header covers what differs for Hardin.
#
# Hardin's "Plumbing" attribute holds text codes, cut at the field's 10
# characters: "BATHS (1)", "BATHS (2)", "BATHS (2.5" and so on, where the
# number is a bath count with halves as .5 (the registry's n_bathrooms
# definition). The query keeps codes starting "BATHS (" and the
# transformation reads the number after the parenthesis. Codes outside
# that form are left out: a few "08 BATH FI" rows are fixture counts,
# and foundation words ("CONC SLAB", "ON BLOCKS") were keyed into this
# attribute by mistake.
#
# MEASURED on the 2026 export: "Plumbing" on 5,554 rows over 5,469
# properties, "BATHS (" on 5,442 of them; 23.8% of the 22,090
# single-family (A) properties carry it, 13.7% of rural improved (E),
# 2 of 2,884 mobile homes. Hardin's bedroom attribute is unusable (the
# 10-character cut drops the number from "BEDROOMS (" on 317 of 371
# rows), so no bedroom recipe exists for this district.

description: >-
  Hardin County, TX certified appraisal roll, improvement features member:
  bathrooms per building (halves as .5), summed to the property.

admin_id: US-TX-HRD

entity:
  entity_type: property
  source:
    source_id: hardincad
    # Same download as the roll; see its terms note.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://hardin-cad.org/data-downloads/"
    download_url: "https://hardin-cad.org/wp-content/uploads/2026/08/2026-Certified-Roll.zip"
  version: 2026

compressed_file_name: "2026-Certified-Roll.zip"
uncompressed_file_name: "2026 Certified Roll/2026-08-14_000305_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS 8.0.34 File #9 (Improvement Features).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Plumbing'
  and n_bathrooms.str.startswith('BATHS (')

# One row per building, then summed across buildings.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: string
    operation: extract_named
    input: n_bathrooms
    args:
      pattern: 'BATHS \((?P<n>\d+(?:\.\d+)?)'
    output: n_bathrooms
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_bathrooms: sum

supplements: US-TX-HRD_property-hardincad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
