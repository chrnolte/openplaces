# Recipe: Wise County, TX certified appraisal roll, improvement features
# from the improvement detail member (PACS File #8, one row per building
# component). Same download as US-TX-WIS_property-wisecad-2026; read
# that roll's header for the source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2027 (0 is the district's
# blank).
#
# Wise codes a component's type, material and class in one code (AGB9:
# attached garage, brick, class 9), so every class variant is listed.
# The guest quarters (LA1 to LA4) count as living area. LEFT OUT: CP01
# to CP04 ('CONCRETE', paving) and WDCA, WDCG, WDCL, whose descriptions
# only repeat the code; LP ('LIVING PORCH') is neither porch nor living
# area until its meaning is known.
#
# TYPES. living area: types LA, LS, LA2, LA3, LA1, LA4. garage: types
# AGB9, AGBA, AGBB, AGB8, AGB8+, AGBF, AGB9+, AGF8, AGFA, DGF8, AGF9,
# AGBC, AGFHG, DGF9, AGFB, AGFC, AGFHV, DGBA, DGB9, DGB8, DGFA, DGF7,
# AGBE, DGBB, AGBD, AGFHE, DGT4, AGF9+, AGF8+, DGBF, DGFB, AGFE, DGF6,
# AGF7, DGBC, AGF7+, DGF5, DGB8+, AGB7, DGF8+, DGB9+, DGF7+, DGF4, DGFF,
# AGB7+, DGT2, DGFC, DGFHV, DGBE, AGT4, DGB7, DGB6, AG, DGF9+, DGBD,
# AGFD, AGF6, DGFHG, DGB4, AGF5, DGF2, AGB6, DGFE, DGB5, AGT3, AGFHA,
# DGFD, AGB5, AGT2, DGB7+. carport: types CPMF, CPML, CPMA, CPMG, CPMV,
# CPB8, CPF8, CPB9, CPBA, CPME, CPF9, CPFA, CPF7, CPBB, CPT5, CPFB,
# CPBF, CPT4, CT10, CPBC, CPB7, CPFF, CPFHV, CPT3, CPFE, CPBE, CPT2,
# CPFHG, CPBD, CPF6, CPT1, CPF5, CT06, CPF4, SLBE, CT04, CPFHA, CPB6,
# CPFD, SLBD. porch: types OPB9, OPBA, OPB8, OPF8, OPBB, OPT5, OPB8+,
# OPF9, OPBF, OPFA, OPF7, OPB9+, OPT4, OPT3, OPFHG, OPBC, OPFB, OPFF,
# OPFC, OPFHV, OPT2, OPF8+, OPF7+, EP, OPBE, SPF8, OPB7, OPT1, OPBD,
# OPF9+, SPB8, OPFHE, SPB9, OPFE, OPF6, SPT5, GP, OPB7+, SPBA, SPF7,
# SPF9, SPT4, SPBB, SPFA, SPB8+, OPF5, SPT3, SPB9+, OPFD, SPF8+, OPB6,
# SP, SPF7+, OPF4, SPBF, OP, SPT2, SPB7, SPFB, SPF9+, OPF2, SPFHV, SPT1,
# SPFC, SPBC, OPFHA, SPFHG, SPF6, SPF5, OPB5, SPBE, SPB6, SPFD, SPFE,
# SPB5, OPF3, SPB7+, OPB1, SPB4, SPBD, SPF2. deck and patio: types PCB9,
# PCBA, PCB8, PCBB, PCF8, PCB8+, CPB8+, PCF7, PCB9+, CPF8+, PCT5, PCF9,
# PCFA, PCMA, PCBF, PCBC, CPB9+, PCT4, CPF7+, PCBE, PCT3, PCMG, PCF8+,
# WD06, PCT2, PCF6, CPF9+, PCBD, PCFB, PCF7+, PCF9+, PCT1, WD12, CPB7+,
# WD10, PCFE, PCB7, PCFF, WD08, PCF5, PCF2, PCF3, PCB6, PCB7+, PC, PCB4,
# PCF4, PCFD. swimming pool: types PL40, PL50, PL45, PL35, PL30, PL60,
# PL75, PL25, PL20, PL15, PL10, PL. basement (finished and unfinished):
# types LB. solar device: types SOLAR. accessory dwelling: types LA2,
# LA3, LA1, LA4, GA.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 24,526
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 92.6% (B
# 14.3%, E 94.2%, M 99.8%), per-property median 1836. garage_area_sqft A
# 50.1% (B 20.5%, E 34.8%, M 0.2%), per-property median 484. has_garage
# A 50.1% (B 20.5%, E 34.8%, M 0.2%). garage_type A 50.1% (B 20.5%, E
# 34.8%, M 0.2%), 70 distinct codes. has_carport A 38.2% (B 15.6%, E
# 69.3%, M 20.8%). porch_area_sqft A 77.0% (B 36.6%, E 71.4%, M 35.3%),
# per-property median 190. deck_area_sqft A 5.0% (B 0.9%, E 5.2%, M
# 1.0%), per-property median 222.5. has_pool A 7.3% (B 2.7%, E 12.8%, M
# 0.1%). basement_area_sqft A 0.3% (B 0.4%, E 0.5%, M 0.0%),
# per-property median 800. has_basement A 0.3% (B 0.4%, E 0.5%, M 0.0%).
# has_solar A 0.0% (B 0.0%, E 0.0%, M 0.0%). has_accessory_dwelling A
# 1.2% (B 0.4%, E 2.0%, M 0.0%). quality_grade A 92.6% (B 14.3%, E
# 94.2%, M 99.8%), 80 distinct codes. year_built A 89.8% (B 13.4%, E
# 89.9%, M 96.3%), per-property median 2005. effective_year_built A
# 92.5% (B 14.3%, E 94.1%, M 99.8%), per-property median 2012.

description: >-
  Wise County, TX certified appraisal roll, improvement detail member: living, garage,
  porch and deck areas, class and feature flags per property.

admin_id: US-TX-WIS

entity:
  entity_type: property
  source:
    source_id: wisecad
    # Same download as the roll; see its terms note.
    license: >-
      unknown (download page: 'Wise CAD cannot offer technical support'; no terms on
      the data)
    redistribution_restricted: null
    portal_url: "https://wise-cad.com/data-downloads/"
    download_url: "https://wise-cad.com/wp-content/uploads/2026/08/2026-Certified-Roll.zip"
  version: 2026

compressed_file_name: "2026-Certified-Roll.zip"
uncompressed_file_name: "2026-08-05_003186_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['LA', 'LS', 'LA2', 'LA3',
      'LA1', 'LA4']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['AGB9', 'AGBA', 'AGBB',
      'AGB8', 'AGB8+', 'AGBF', 'AGB9+', 'AGF8', 'AGFA', 'DGF8', 'AGF9', 'AGBC',
      'AGFHG', 'DGF9', 'AGFB', 'AGFC', 'AGFHV', 'DGBA', 'DGB9', 'DGB8', 'DGFA',
      'DGF7', 'AGBE', 'DGBB', 'AGBD', 'AGFHE', 'DGT4', 'AGF9+', 'AGF8+', 'DGBF',
      'DGFB', 'AGFE', 'DGF6', 'AGF7', 'DGBC', 'AGF7+', 'DGF5', 'DGB8+', 'AGB7',
      'DGF8+', 'DGB9+', 'DGF7+', 'DGF4', 'DGFF', 'AGB7+', 'DGT2', 'DGFC',
      'DGFHV', 'DGBE', 'AGT4', 'DGB7', 'DGB6', 'AG', 'DGF9+', 'DGBD', 'AGFD',
      'AGF6', 'DGFHG', 'DGB4', 'AGF5', 'DGF2', 'AGB6', 'DGFE', 'DGB5', 'AGT3',
      'AGFHA', 'DGFD', 'AGB5', 'AGT2', 'DGB7+']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['AGB9', 'AGBA', 'AGBB', 'AGB8', 'AGB8+', 'AGBF', 'AGB9+', 'AGF8', 'AGFA',
          'DGF8', 'AGF9', 'AGBC', 'AGFHG', 'DGF9', 'AGFB', 'AGFC', 'AGFHV', 'DGBA',
          'DGB9', 'DGB8', 'DGFA', 'DGF7', 'AGBE', 'DGBB', 'AGBD', 'AGFHE', 'DGT4',
          'AGF9+', 'AGF8+', 'DGBF', 'DGFB', 'AGFE', 'DGF6', 'AGF7', 'DGBC', 'AGF7+',
          'DGF5', 'DGB8+', 'AGB7', 'DGF8+', 'DGB9+', 'DGF7+', 'DGF4', 'DGFF', 'AGB7+',
          'DGT2', 'DGFC', 'DGFHV', 'DGBE', 'AGT4', 'DGB7', 'DGB6', 'AG', 'DGF9+',
          'DGBD', 'AGFD', 'AGF6', 'DGFHG', 'DGB4', 'AGF5', 'DGF2', 'AGB6', 'DGFE',
          'DGB5', 'AGT3', 'AGFHA', 'DGFD', 'AGB5', 'AGT2', 'DGB7+']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['AGB9', 'AGBA', 'AGBB',
      'AGB8', 'AGB8+', 'AGBF', 'AGB9+', 'AGF8', 'AGFA', 'DGF8', 'AGF9', 'AGBC',
      'AGFHG', 'DGF9', 'AGFB', 'AGFC', 'AGFHV', 'DGBA', 'DGB9', 'DGB8', 'DGFA',
      'DGF7', 'AGBE', 'DGBB', 'AGBD', 'AGFHE', 'DGT4', 'AGF9+', 'AGF8+', 'DGBF',
      'DGFB', 'AGFE', 'DGF6', 'AGF7', 'DGBC', 'AGF7+', 'DGF5', 'DGB8+', 'AGB7',
      'DGF8+', 'DGB9+', 'DGF7+', 'DGF4', 'DGFF', 'AGB7+', 'DGT2', 'DGFC',
      'DGFHV', 'DGBE', 'AGT4', 'DGB7', 'DGB6', 'AG', 'DGF9+', 'DGBD', 'AGFD',
      'AGF6', 'DGFHG', 'DGB4', 'AGF5', 'DGF2', 'AGB6', 'DGFE', 'DGB5', 'AGT3',
      'AGFHA', 'DGFD', 'AGB5', 'AGT2', 'DGB7+']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['CPMF', 'CPML', 'CPMA', 'CPMG', 'CPMV', 'CPB8', 'CPF8', 'CPB9', 'CPBA',
          'CPME', 'CPF9', 'CPFA', 'CPF7', 'CPBB', 'CPT5', 'CPFB', 'CPBF', 'CPT4',
          'CT10', 'CPBC', 'CPB7', 'CPFF', 'CPFHV', 'CPT3', 'CPFE', 'CPBE', 'CPT2',
          'CPFHG', 'CPBD', 'CPF6', 'CPT1', 'CPF5', 'CT06', 'CPF4', 'SLBE', 'CT04',
          'CPFHA', 'CPB6', 'CPFD', 'SLBD']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['OPB9', 'OPBA', 'OPB8',
      'OPF8', 'OPBB', 'OPT5', 'OPB8+', 'OPF9', 'OPBF', 'OPFA', 'OPF7', 'OPB9+',
      'OPT4', 'OPT3', 'OPFHG', 'OPBC', 'OPFB', 'OPFF', 'OPFC', 'OPFHV', 'OPT2',
      'OPF8+', 'OPF7+', 'EP', 'OPBE', 'SPF8', 'OPB7', 'OPT1', 'OPBD', 'OPF9+',
      'SPB8', 'OPFHE', 'SPB9', 'OPFE', 'OPF6', 'SPT5', 'GP', 'OPB7+', 'SPBA',
      'SPF7', 'SPF9', 'SPT4', 'SPBB', 'SPFA', 'SPB8+', 'OPF5', 'SPT3', 'SPB9+',
      'OPFD', 'SPF8+', 'OPB6', 'SP', 'SPF7+', 'OPF4', 'SPBF', 'OP', 'SPT2',
      'SPB7', 'SPFB', 'SPF9+', 'OPF2', 'SPFHV', 'SPT1', 'SPFC', 'SPBC', 'OPFHA',
      'SPFHG', 'SPF6', 'SPF5', 'OPB5', 'SPBE', 'SPB6', 'SPFD', 'SPFE', 'SPB5',
      'OPF3', 'SPB7+', 'OPB1', 'SPB4', 'SPBD', 'SPF2']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['PCB9', 'PCBA', 'PCB8',
      'PCBB', 'PCF8', 'PCB8+', 'CPB8+', 'PCF7', 'PCB9+', 'CPF8+', 'PCT5',
      'PCF9', 'PCFA', 'PCMA', 'PCBF', 'PCBC', 'CPB9+', 'PCT4', 'CPF7+', 'PCBE',
      'PCT3', 'PCMG', 'PCF8+', 'WD06', 'PCT2', 'PCF6', 'CPF9+', 'PCBD', 'PCFB',
      'PCF7+', 'PCF9+', 'PCT1', 'WD12', 'CPB7+', 'WD10', 'PCFE', 'PCB7', 'PCFF',
      'WD08', 'PCF5', 'PCF2', 'PCF3', 'PCB6', 'PCB7+', 'PC', 'PCB4', 'PCF4',
      'PCFD']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['PL40', 'PL50', 'PL45', 'PL35', 'PL30', 'PL60', 'PL75', 'PL25', 'PL20',
          'PL15', 'PL10', 'PL']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['LB']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['LB']
        output: true
    output: has_basement
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['SOLAR']
        output: true
    output: has_solar
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['LA2', 'LA3', 'LA1', 'LA4', 'GA']
        output: true
    output: has_accessory_dwelling
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['LA', 'LS', 'LA2', 'LA3',
      'LA1', 'LA4']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['LA', 'LS', 'LA2', 'LA3', 'LA1',
      'LA4']) & (year_built > 1800) & (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['LA', 'LS', 'LA2',
      'LA3', 'LA1', 'LA4']) & (effective_year_built > 1800) &
      (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max
  has_solar: max
  has_accessory_dwelling: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-WIS_property-wisecad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
