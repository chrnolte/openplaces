# Recipe: Travis County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-TRA_property-traviscad-2026; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. effective_year_built is depreciation_yr, read on the
# living-area components only (quality_grade comes from the county's
# File #9 recipe, not the class code). The depreciation year is the year
# PACS depreciates the component from, the effective year built; the
# property takes the earliest, as year_built does in the Texas
# improvement-detail recipes. year_built is the living-area components'
# yr_built, the earliest kept. Both years read as missing outside 1801
# to 2027 (0 is the district's blank).
#
# Travis prices each storey as its own line (1ST to 5TH, 1/2, RSBLW
# 'Residence Below'), so living area is their sum. Fireplaces (522, 521)
# carry their count in the area field, as the bedroom lines do, and are
# summed into n_fireplaces. The commercial variants (codes ending in C)
# and the flat-value FV lines are left out of areas.
#
# TYPES. living area: types 1ST, 2ND, 3RD, 4TH, 5TH, 1/2, RSBLW. garage:
# types 041, 031, 040, 034, 043, 033, GARAGE BEL. carport: types 061,
# 051, 059, 054, 063, 053, ATT CARPOR. porch: types 011, 012, 631, 630,
# 013, 014, 021, 016, 022, 015, 025. deck and patio: types 612, 512,
# 613, 611, 511, 313, 344, COV TERR, UNC DECK. swimming pool: types 604,
# 602, 605, 603, 609, POOL. basement (finished and unfinished): types
# UBSMT, FBSMT, PBSMT. finished basement: types FBSMT. solar device:
# types 411. elevator: types 477. accessory dwelling: types 483, 283.
# fireplaces: types 522, 521.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 352,880
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 99.4% (B
# 99.3%, E 85.7%, M 100.0%), per-property median 1891. garage_area_sqft
# A 78.8% (B 36.1%, E 40.8%, M 0.1%), per-property median 440.
# has_garage A 78.9% (B 36.1%, E 40.9%, M 0.1%). garage_type A 78.9% (B
# 36.1%, E 40.9%, M 0.1%), 7 distinct codes. has_carport A 7.5% (B
# 27.4%, E 26.3%, M 0.4%). porch_area_sqft A 88.9% (B 65.4%, E 70.3%, M
# 0.9%), per-property median 140. deck_area_sqft A 47.2% (B 65.3%, E
# 35.1%, M 1.1%), per-property median 176. has_pool A 10.8% (B 0.8%, E
# 12.7%, M 0.0%). basement_area_sqft A 0.5% (B 0.7%, E 0.5%, M 0.0%),
# per-property median 578.85. has_basement A 0.5% (B 0.7%, E 0.5%, M
# 0.0%). basement_finished_area_sqft A 0.2% (B 0.4%, E 0.2%, M 0.0%),
# per-property median 624. has_solar A 6.8% (B 0.5%, E 3.5%, M 0.0%).
# has_elevator A 0.3% (B 0.0%, E 0.4%, M 0.0%). has_accessory_dwelling A
# 0.1% (B 0.0%, E 0.7%, M 0.2%). n_fireplaces A 54.2% (B 41.2%, E 38.4%,
# M 0.0%), per-property median 1. year_built A 99.5% (B 99.2%, E 89.1%,
# M 99.8%), per-property median 1999. effective_year_built A 99.5% (B
# 99.3%, E 89.2%, M 100.0%), per-property median 1999.

description: >-
  Travis County, TX certified appraisal roll, improvement detail member: living, garage,
  porch and deck areas, class and feature flags per property.

admin_id: US-TX-TRA

entity:
  entity_type: property
  source:
    source_id: traviscad
    # Same download as the roll; see its terms note.
    license: "unknown (no terms on the data; FAQ: roll 'made available free of charge')"
    terms_url: "https://traviscad.org/faq-items/can-i-get-a-copy-of-the-appraisal-roll/"
    redistribution_restricted: null
    portal_url: "https://traviscad.org/publicinformation"
    download_url: "https://traviscad.org/wp-content/largefiles/2026%20Certified%20Appraisal%20Export%20Supp%200_07182026.zip"
  version: 2026

compressed_file_name: "2026 Certified Appraisal Export Supp 0_07182026.zip"
uncompressed_file_name: "IMP_DET.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  year_built: yr_built
  effective_year_built: depreciation_yr

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['1ST', '2ND', '3RD', '4TH',
      '5TH', '1/2', 'RSBLW']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['041', '031', '040', '034',
      '043', '033', 'GARAGE BEL']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['041', '031', '040', '034', '043', '033', 'GARAGE BEL']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['041', '031', '040',
      '034', '043', '033', 'GARAGE BEL']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['061', '051', '059', '054', '063', '053', 'ATT CARPOR']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['011', '012', '631', '630',
      '013', '014', '021', '016', '022', '015', '025']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['612', '512', '613', '611',
      '511', '313', '344', 'COV TERR', 'UNC DECK']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['604', '602', '605', '603', '609', 'POOL']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['UBSMT', 'FBSMT', 'PBSMT']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['UBSMT', 'FBSMT', 'PBSMT']
        output: true
    output: has_basement
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['FBSMT']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_finished_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['411']
        output: true
    output: has_solar
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['477']
        output: true
    output: has_elevator
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['483', '283']
        output: true
    output: has_accessory_dwelling
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['522', '521']) &
      (imprv_det_area > 0))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: n_fireplaces
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['1ST', '2ND', '3RD', '4TH',
      '5TH', '1/2', 'RSBLW']) & (year_built > 1800) & (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['1ST', '2ND', '3RD',
      '4TH', '5TH', '1/2', 'RSBLW']) & (effective_year_built > 1800) &
      (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max
  basement_finished_area_sqft: sum
  has_solar: max
  has_elevator: max
  has_accessory_dwelling: max
  n_fireplaces: sum
  year_built: min
  effective_year_built: min

supplements: US-TX-TRA_property-traviscad-2026
# Keyed like the roll's other supplements: the roll's
# parcel_id_local is its geo_id, these tables carry
# prop_id only.
supplements_key: parcel_id_assessor

save_to:
  data_dir: cache
  filename: improvement-features
