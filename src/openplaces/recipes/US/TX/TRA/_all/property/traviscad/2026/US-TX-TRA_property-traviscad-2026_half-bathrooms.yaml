# Recipe: Travis County, TX certified appraisal roll -- improvement
# detail, half bathrooms (TCAD). Same member (File #8, IMP_DET.TXT) as
# US-TX-TRA_property-traviscad-2026_bathrooms; read its header first.
#
# Detail type 250 "HALF BATHROOM", count in imprv_det_area. Each is
# already counted as 0.5 in the sibling's n_bathrooms. This table holds
# only the properties that carry a 250 line, so a property without one
# stays null here rather than 0: TCAD folds a half into the BATHROOM
# count instead on 25.3% of buildings with no 250 line, so "no line"
# does not mean "no half bath".
#
# MEASURED on the 2026 certified export: 53,538 rows over 53,452
# improvements and 52,395 properties; count 1 on 95.0% of rows, 2 on
# 4.2%. The query keeps counts above 0 and up to 20, compared as
# fixed-format text (see the bedrooms recipe), dropping 212 zero lines
# and one line above 1,000. Coverage by improvement state class:
# A 14.2%, B 1.6%, E 6.9%, M none.
#
# ROW RULE. 84 improvements carry two or more 250 lines, equal on 70.2%;
# drop_duplicates removes a line repeating the same count on the same
# building, and differing lines sum.

description: >-
  Travis County, TX certified appraisal roll, improvement detail member:
  half-bathroom count lines per building, summed to the property.

admin_id: US-TX-TRA

entity:
  entity_type: property
  source:
    source_id: traviscad
    # Same download as the roll; see its terms note.
    license: "unknown (no terms on the data; FAQ: roll 'made available free of charge')"
    terms_url: "https://traviscad.org/faq-items/can-i-get-a-copy-of-the-appraisal-roll/"
    redistribution_restricted: null
    portal_url: "https://traviscad.org/publicinformation"
    download_url: "https://traviscad.org/wp-content/largefiles/2026%20Certified%20Appraisal%20Export%20Supp%200_07182026.zip"
  version: 2026

compressed_file_name: "2026 Certified Appraisal Export Supp 0_07182026.zip"
uncompressed_file_name: "IMP_DET.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail), 622 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [filler, 10] # Imprv_det_class_cd
  - [filler, 4] # yr_built
  - [filler, 4] # depreciation_yr
  - [imprv_det_area, 15]

columns:
  n_half_bathrooms: imprv_det_area

# Counts above 0 and up to 20, compared as fixed-format text.
query: >-
  imprv_det_type_cd == '250'
  and n_half_bathrooms > '00000000.000000'
  and n_half_bathrooms <= '00000020.000000'

drop_duplicates: [prop_id, imprv_id, n_half_bathrooms]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: n_half_bathrooms
    output: n_half_bathrooms

drop_columns:
  - imprv_det_type_cd
  - imprv_id

aggregation_function:
  n_half_bathrooms: sum

supplements: US-TX-TRA_property-traviscad-2026
# IMP_DET.TXT carries prop_id and no geo_id, while the roll's
# parcel_id_local is built from geo_id (its link to TxGIO parcels). So
# this table joins the roll on the zero-stripped prop_id both carry.
supplements_key: parcel_id_assessor

save_to:
  data_dir: cache
  filename: half-bathrooms
