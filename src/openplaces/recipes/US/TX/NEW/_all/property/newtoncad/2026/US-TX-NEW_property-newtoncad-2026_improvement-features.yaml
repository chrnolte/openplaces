# Recipe: Newton County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-NEW_property-newtoncad-2026; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2027 (0 is the district's
# blank).
#
# The 'MA - <type>' codes (MA - STG, MA - CPT ...) are outbuildings, not
# living area.
#
# TYPES. living area: types MA, MA2. garage: types GA2, GA1, GARAGE, GA
# - W, GA - B, GA - A, GA - V, GA - H, GA - M. carport: types CPT, CPT -
# W, CPT - M, CPT - PF, CPT - M C, CPT - W C, CPT - PF C. porch: types
# PO3, PO1, PO4, PO2, PO2 - S, PO4+, PO4++, PO4P, PO4M, PO1 - W, PO3 -
# W, PO3 - C+, PO1 - CONC, PO3 - W+, PO3 - C, PO3+. deck and patio:
# types DECK, PATIO. swimming pool: types SWIM POOL.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 4,027 single-family
# properties (improvement state class A, File #7); B, E and M the other
# residential classes. living_area_sqft A 91.4% (B 100.0%, E 90.2%, M
# 99.7%), per-property median 1317. garage_area_sqft A 13.0% (B 0.0%, E
# 14.5%, M 0.8%), per-property median 593. has_garage A 13.0% (B 0.0%, E
# 14.5%, M 0.8%). garage_type A 13.0% (B 0.0%, E 14.5%, M 0.8%), 9
# distinct codes. has_carport A 59.1% (B 50.0%, E 67.7%, M 42.1%).
# porch_area_sqft A 85.5% (B 100.0%, E 85.8%, M 79.3%), per-property
# median 344. deck_area_sqft A 2.7% (B 0.0%, E 5.1%, M 1.6%),
# per-property median 157. has_pool A 1.7% (B 0.0%, E 2.7%, M 0.1%).
# quality_grade A 91.4% (B 100.0%, E 90.3%, M 99.8%), 156 distinct
# codes. year_built A 91.4% (B 100.0%, E 90.4%, M 99.8%), per-property
# median 1982. effective_year_built A 91.4% (B 100.0%, E 90.4%, M
# 99.8%), per-property median 2000.

description: >-
  Newton County, TX certified appraisal roll, improvement detail member: living, garage,
  porch and deck areas, class and feature flags per property.

admin_id: US-TX-NEW

entity:
  entity_type: property
  source:
    source_id: newtoncad
    # Same download as the roll; see its terms note.
    license: >-
      unknown (accuracy disclaimer only; no terms on the data)
    redistribution_restricted: null
    portal_url: "https://newtoncad.org/certified-rolls/"
    download_url: "https://newtoncad.org/wp-content/uploads/2026/09/2026-APP-ROLL-NEWTON-CAD.zip"
  version: 2026

compressed_file_name: "2026-APP-ROLL-NEWTON-CAD.zip"
uncompressed_file_name: "2026 APP ROLL NEWTON CAD/2026-07-20_001632_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MA', 'MA2']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['GA2', 'GA1', 'GARAGE', 'GA -
      W', 'GA - B', 'GA - A', 'GA - V', 'GA - H', 'GA - M']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['GA2', 'GA1', 'GARAGE', 'GA - W', 'GA - B', 'GA - A', 'GA - V', 'GA - H',
          'GA - M']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['GA2', 'GA1', 'GARAGE',
      'GA - W', 'GA - B', 'GA - A', 'GA - V', 'GA - H', 'GA - M']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['CPT', 'CPT - W', 'CPT - M', 'CPT - PF', 'CPT - M C', 'CPT - W C',
          'CPT - PF C']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['PO3', 'PO1', 'PO4', 'PO2',
      'PO2 - S', 'PO4+', 'PO4++', 'PO4P', 'PO4M', 'PO1 - W', 'PO3 - W', 'PO3 -
      C+', 'PO1 - CONC', 'PO3 - W+', 'PO3 - C', 'PO3+']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['DECK', 'PATIO']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['SWIM POOL']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['MA', 'MA2']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['MA', 'MA2']) & (year_built >
      1800) & (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['MA', 'MA2']) &
      (effective_year_built > 1800) & (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-NEW_property-newtoncad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
