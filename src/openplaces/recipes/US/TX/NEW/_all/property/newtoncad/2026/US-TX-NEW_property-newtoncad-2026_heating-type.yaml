# Recipe: Newton County, TX certified appraisal roll, improvement
# features member (PACS File #9): heating_type from the district's
# 'Heating/Cooling' attribute. Same download and File #9 row shape as
# the roll's room-count supplements; read
# US-TX-NEW_property-newtoncad-2026 for the source and its terms.
#
# READING. The district's code, kept as published (no crosswalk).
# drop_duplicates keeps the first row per building, and the property
# takes the first building's code.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value): A is the 4,027 single-family properties (improvement state
# class A, File #7); B, E and M the other residential classes.
# heating_type A 83.5% (B 100.0%, E 80.6%, M 92.0%), 7 distinct codes.

description: >-
  Newton County, TX certified appraisal roll, improvement features member: heating_type
  per building, reduced to the property.

admin_id: US-TX-NEW

entity:
  entity_type: property
  source:
    source_id: newtoncad
    # Same download as the roll; see its terms note.
    license: >-
      unknown (accuracy disclaimer only; no terms on the data)
    redistribution_restricted: null
    portal_url: "https://newtoncad.org/certified-rolls/"
    download_url: "https://newtoncad.org/wp-content/uploads/2026/09/2026-APP-ROLL-NEWTON-CAD.zip"
  version: 2026

compressed_file_name: "2026-APP-ROLL-NEWTON-CAD.zip"
uncompressed_file_name: "2026 APP ROLL NEWTON CAD/2026-07-20_001632_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features), 87 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  heating_type: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Heating/Cooling'

# One row per building.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  heating_type: first

supplements: US-TX-NEW_property-newtoncad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: heating-type
