# Recipe: Newton County, TX certified appraisal roll, improvement
# features, bathrooms (NCAD). Same member (PACS File #9) as
# US-TX-VIC_property-victoriacad-2026_bedrooms; read its header first.
# This header covers what differs for Newton.
#
# Newton's 'Plumbing' attribute is a bath count, not a fixture count:
# codes 2, 1, 3, 1.5, 2.5, 4, with halves already folded in as .5 (the
# registry's n_bathrooms definition), so there is no separate half count
# to map. The query keeps codes that are a plain number of one or two
# integer digits, with or without decimals ('2', '2.5', '.5'), and not
# zero. Zero, three-digit, text and letter codes are left out (listed in
# MEASURED). Values the query keeps but that are implausible for one
# building are left for curate's range checks.
#
# MEASURED on the 2026 export: 'Plumbing' on 6,378 rows over 6,027
# properties. The query drops 15 rows: '0' (7), 'YES' (4), 'CHCA' (2),
# 'Y' and '100' (1 each); '12' and '50' (1 each) are kept for curate.
# After the row rule, 6,016 properties, median 2, p99 4; 3.8% end in .5.
# The median bath count rises with bedrooms (1 for one bedroom, 2 for
# three), so this is not a fixture count. Coverage (value above 0) is
# 74.0% of the 4,027 single-family (A) properties, 8 of the 10
# multifamily (B), 66.5% of the 2,409 rural improved (E) and 86.5% of
# the 1,594 mobile homes (M).
#
# ROW RULE. 109 improvements carry two or more kept rows and only 61% of
# them agree, so three rules were measured per property: the first row
# per improvement summed across buildings (this recipe), all rows
# summed, and the maximum over all rows. The last two differ from the
# first on 1.78% and 3.39% of properties. The disagreeing rows sit on a
# second MAIN AREA or SECOND MAIN AREA detail, and the first row is the
# largest in 28% of them, which reads either as an addition's own count
# (sum) or as a partial repeat (first). Improvement value decides it:
# over the 25 single-family improvements whose rows disagree, the File
# #7 improvement value lies nearer the median value of single-row
# improvements with the first row's count than with the summed count in
# 58%. So drop_duplicates keeps the first row per (prop_id, imprv_id),
# and aggregation_function sums distinct buildings to the property.

description: >-
  Newton County, TX certified appraisal roll, improvement features member: bathrooms
  per building (halves as .5), summed to the property.

admin_id: US-TX-NEW

entity:
  entity_type: property
  source:
    source_id: newtoncad
    # Same download as the roll; see its terms note.
    license: >-
      unknown (accuracy disclaimer only; no terms on the data)
    redistribution_restricted: null
    portal_url: "https://newtoncad.org/certified-rolls/"
    download_url: "https://newtoncad.org/wp-content/uploads/2026/09/2026-APP-ROLL-NEWTON-CAD.zip"
  version: 2026

compressed_file_name: "2026-APP-ROLL-NEWTON-CAD.zip"
uncompressed_file_name: "2026 APP ROLL NEWTON CAD/2026-07-20_001632_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features), 87 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Plumbing'
  and n_bathrooms.str.fullmatch(
  '(?!0+([.]0+)?$)([0-9]{1,2}([.][0-9]+)?|[.][0-9]+)',
  na=False)

# One row per building; see ROW RULE.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_bathrooms: sum

# Details the roll's properties: joined by link_by_id, skipped
# by the property spine's union.
supplements: US-TX-NEW_property-newtoncad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
