# Recipe: Victoria County, TX certified appraisal roll (VCAD).
#
# Why: the statewide TxGIO layer ships Victoria with no land use and no year
# built at all (both 0.0% over 45,104 parcels). The district's own certified
# roll carries both.
#
# FORMAT. This is the True Automation / PACS "Appraisal Export", layout
# version 8.0.34 -- a *standard vendor format*, not a Victoria invention, so
# the same field positions parse the roll of any Texas CAD running PACS.
# The ZIP ships the layout spreadsheet ("Appraisal Export Layout - 8.0.34.xlsx")
# alongside the data; read it before changing any offset here. Members
# include APPRAISAL_INFO (this recipe), APPRAISAL_IMPROVEMENT_DETAIL
# (yr_built and area -- see the sibling recipe), APPRAISAL_LAND_DETAIL,
# APPRAISAL_MOBILE_HOME_INFO and APPRAISAL_STATE_CODE.
#
# NOTE on the join key, which is the trap here. PACS zero-pads prop_id to
# 12 characters ("000000028288") while TxGIO ships it bare ("28288"), so
# joining on prop_id as-shipped matches **0.0%** of TxGIO's Victoria
# parcels. Two things follow: the lstrip transformation below restores the
# bare form for parcel_id_local, and geo_id is kept as an independent check
# -- it matches 96.0% of TxGIO's parcel_id_admin2_2 with no normalization
# at all, so a future change that breaks the prop_id path will still be
# visible rather than silent.
#
# NOTE on coverage, measured on the 2026 export (53,405 rows):
#   land_state_cd   81.8%   imprv_state_cd  72.3%
#   geo_id         100.0%   market_value   100.0%
#
# NOTE: the member filenames carry the export date and a per-export
# "dataset_id" ("2026-07-28_001892_APPRAISAL_INFO.TXT"), so the name below
# is pinned to this vintage and will change when the roll is re-exported.
# That is the vendor's documented naming convention, not an accident.
#
# NOTE: values (land/improvement) are deliberately not mapped. TxGIO already
# supplies Victoria's land_value at 99.5% and improvement_value at 77.8%, and
# PACS splits each into homestead / non-homestead components that would have
# to be summed first. The gap this recipe exists to close is land use, not
# values. py_owner_name and the owner address block are likewise not mapped:
# nothing downstream needs them here.

description: >-
  Victoria County, TX certified appraisal roll (PACS 8.0.34 export): state
  land-use codes, legal acreage and market value keyed by property.

admin_id: US-TX-VI

entity:
  entity_type: property
  source:
    source_id: victoriacad
    portal_url: "https://victoriacad.org/downloads/"
    download_url: "https://victoriacad.org/wp-content/uploads/2026/07/VCAD-2026-CERTIFIED-ROLL-1.zip"
  version: 2026

compressed_file_name: "VCAD-2026-CERTIFIED-ROLL-1.zip"
uncompressed_file_name: "VCAD 2026 CERTIFIED ROLL/2026-07-28_001892_APPRAISAL_INFO.TXT"

process_by:
  admin_level: 3

# The PACS export is latin-1, not UTF-8: reading it as UTF-8 dies on the
# first accented owner name (byte 0xc9 at offset 2343 of row 1 here).
encoding: latin-1

# PACS 8.0.34 File #2 (Property). Offsets are 1-based inclusive in the
# layout spreadsheet; the widths below were generated from it rather than
# counted by hand. Coverage stops at situs_num (column 4474) because
# nothing after it is mapped -- the full record is 9,714 characters.
fixed_width:
  - [prop_id, 12]
  - [filler, 5]
  - [prop_val_yr, 5]
  - [filler, 524]
  - [geo_id, 50]
  - [filler, 443]
  - [situs_street_prefx, 10]
  - [situs_street, 50]
  - [filler, 10]
  - [situs_city, 30]
  - [situs_zip, 10]
  - [legal_desc, 255]
  - [filler, 255]
  - [legal_acreage, 16]
  - [abs_subdv_cd, 10]
  - [hood_cd, 10]
  - [filler, 220]
  - [appraised_val, 15]
  - [filler, 801]
  - [imprv_state_cd, 10]
  - [land_state_cd, 10]
  - [filler, 1462]
  - [market_value, 14]
  - [filler, 232]
  - [situs_num, 15]

transformations:
  # Strip the PACS zero-padding so parcel_id_local matches TxGIO's bare form.
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor

columns:
  parcel_id_admin2_2: geo_id
  # The land-side Comptroller state category is the better-populated of the
  # two (81.8% against 72.3%) and is what the crosswalk sidecar keys on.
  use_group_code: land_state_cd
  use_subgroup_code: imprv_state_cd
  address_number: situs_num
  address_street: situs_street
  city: situs_city
  postal_code: situs_zip
  legal_description: legal_desc
  area_ac: legal_acreage
  market_value: market_value
  tax_year: prop_val_yr

columns_to_categorical:
  - use_group_code
  - use_subgroup_code

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
