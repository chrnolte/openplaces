# Recipe: Lavaca County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-LAV_property-lavacacad-2026; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# FLOOR AREA (revised 2026-09-16). living_area_sqft and
# gross_floor_area_sqft both come from this recipe and from nowhere else
# in the family: the sibling ..._improvement-detail recipe used to map
# its MA-prefixed segment sum to gross_floor_area_sqft, which was
# neither figure (it held no garage or enclosed porch, and it counted
# commercial main areas).
# - Lavaca codes every building's main area as MA, MA2 to MA5, MAA or
#   MAAA, commercial ones included: under commercial improvements (state
#   class F) MA carries office, store, warehouse, church, restaurant and
#   similar construction classes (OFF3L, STR2G, WH3A, ...). The type
#   code cannot tell a house from a store, so living area also filters
#   on imprv_det_class_cd, keeping the residential class families
#   only: frame, masonry and brick-masonry houses (F1-F8, M2-M8,
#   BM2-BM8, with or without the C suffix), single- and double-wide
#   mobile homes (SW, DW), apartments (APT), camp houses (CMP),
#   barndominiums (Bardin, Barndim), the district's own MA, ADDN, UB,
#   T1S, GRM and LOFT classes, the bare grades (1A, 2G, 3L, ...) and the
#   blank class ('*'). Every other class family names a commercial or
#   farm building (OFF, STR, WH, GAR, CH, RST, BRN, SHD, MUB, ...) and
#   was seen almost only under commercial or miscellaneous improvement
#   types.
# - living_area_sqft sums the main-area types plus ADDN 'ADDITION -
#   100%', APT 'APARTMENT', MAGAPT (blank description, one row), GRM
#   'GAMEROOM' and LOFT, under that class filter.
# - gross_floor_area_sqft adds, to the living rows, the enclosed parts
#   of the same structure: attached garages finished and unfinished
#   (AGF1-AGF4, AGU1-AGU3; the detached garage types DG*, DGAR and GAR
#   'DETACHED GARAGE - 50%' are not listed), enclosed porches (EP1, EP),
#   GP 'GLASS PORCH' and BASE 'BASEMENT'. These added types are not class
#   filtered, as their classes name the component, not the building.
#   Left out: open and screened porches, patio covers, carports,
#   breezeways, balconies, decks, sheds, barns, detached garages,
#   camp-house types (CMP, CMP2), and the STG and STOR 'STORAGE AREA'
#   types, whose description does not say whether they are enclosed.
# - An area of 0 or 1 reads as missing, as for the other areas.
# - MEASURED 2026-09-16 on the 2026 export, per property with state
#   class A (4,907): living_area_sqft 94.3%, p10/p50/p90 884, 1,491,
#   2,527 (the 2026-09-13 list gave 94.5% and 884, 1,493, 2,536, the
#   old MA-prefix gross 880, 1,488, 2,528); the six properties lost
#   have only a barn, garage or shed class on their MA rows. Under state
#   class F (1,070) living area falls from 76.2% to 16.4%, the
#   commercial main areas dropped. gross_floor_area_sqft A 94.3%,
#   p10/p50/p90 916, 1,632, 2,927; never below living area, equal to it
#   on 62.1%. The MEASURED block below predates this revision for
#   living_area_sqft.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the main-area
# types of the 2026-09-13 living list (MA, MA3, MAAA, MA2, MAA, ADDN,
# MA4, MA5, without the class filter). The class code is the district's
# construction class (quality grade, often with a material or story
# suffix), kept as published; the first main-area component's class
# stands for the property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is not mapped here: the county's ..._improvement-detail
# recipe already carries it.
#
# TYPES. living area: types MA, MA3, MAAA, MA2, MAA, ADDN, MA4, MA5,
# APT, MAGAPT, GRM, LOFT (residential classes only). gross floor area:
# the living-area rows plus types AGF1, AGF2, AGF3, AGF4, AGU1, AGU2,
# AGU3, EP1, EP, GP, BASE. garage: types AGF2, DG3L, AGU2, AGF1, AGU1, DGU, DG3A, DGU2, DG2L,
# DGAR, DGU1, DG3G, AGF3, DG2A, DG2G, GAR, DG3E, AGU3, DGU3, DG2E, DG1A,
# DGF2, DG1G, DG1L, DGF1, AGF4, DG1E, DGF3. carport: types CPT, CP,
# CPT1, CPT2, DCP, CPT3, CRPT, CPT4. porch: types OP, EP1, SP, CP2, OP1,
# OP2, GP, SP1, EP. deck and patio: types PC, WD, PO, PC2, PC3, PC4,
# PC1. swimming pool: types Pool+, POOL. basement (finished and
# unfinished): types BASE.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 4,907 single-family
# properties (improvement state class A, File #7); B, E and M the other
# residential classes. living_area_sqft A 94.5% (B 98.6%, E 91.5%, M
# 99.8%), per-property median 1493. garage_area_sqft A 49.7% (B 18.8%, E
# 41.8%, M 3.0%), per-property median 544. has_garage A 49.7% (B 18.8%,
# E 41.8%, M 3.0%). garage_type A 49.7% (B 18.8%, E 41.8%, M 3.0%), 28
# distinct codes. has_carport A 36.6% (B 36.2%, E 35.9%, M 14.6%).
# porch_area_sqft A 84.5% (B 75.4%, E 78.0%, M 28.1%), per-property
# median 164. deck_area_sqft A 39.5% (B 23.2%, E 44.0%, M 55.3%),
# per-property median 252. has_pool A 3.6% (B 0.0%, E 5.5%, M 0.0%).
# basement_area_sqft A 0.2% (B 0.0%, E 0.0%, M 0.0%), per-property
# median 1084. has_basement A 0.2% (B 0.0%, E 0.0%, M 0.0%).
# quality_grade A 94.4% (B 98.6%, E 91.5%, M 99.8%), 220 distinct codes.
# effective_year_built A 93.9% (B 94.2%, E 91.0%, M 99.2%), per-property
# median 1980.

description: >-
  Lavaca County, TX certified appraisal roll, improvement detail member: living, gross,
  garage, porch and deck areas, class and feature flags per property.

admin_id: US-TX-LAV

entity:
  entity_type: property
  source:
    source_id: lavacacad
    # Same download as the roll; see its terms note.
    license: "unknown"
    redistribution_restricted: null
    portal_url: "https://lavacacad.com/certified-appraisal-rolls/"
    download_url: "https://lavacacad.com/wp-content/uploads/2026/07/2026-certified-roll-1-1.zip"
  version: 2026

compressed_file_name: "2026-certified-roll-1-1.zip"
uncompressed_file_name: "2026-07-23_002730_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  # Floor area, see the header's FLOOR AREA note. Both read
  # quality_grade before the quality_grade step below overwrites it.
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MA', 'MA3', 'MAAA', 'MA2',
      'MAA', 'ADDN', 'MA4', 'MA5', 'APT', 'MAGAPT', 'GRM', 'LOFT']) &
      (quality_grade.isna() |
      quality_grade.str.match('(F|M|BM|SW|DW)[0-9]|[0-9][A-Z]$|APT|MA|ADDN|UB|CMP|T1S|Bardin|Barndim|GRM|LOFT',
      na=False)) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd, quality_grade]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(((imprv_det_type_cd.isin(['MA', 'MA3', 'MAAA',
      'MA2', 'MAA', 'ADDN', 'MA4', 'MA5', 'APT', 'MAGAPT', 'GRM', 'LOFT']) &
      (quality_grade.isna() |
      quality_grade.str.match('(F|M|BM|SW|DW)[0-9]|[0-9][A-Z]$|APT|MA|ADDN|UB|CMP|T1S|Bardin|Barndim|GRM|LOFT',
      na=False))) | imprv_det_type_cd.isin(['AGF1', 'AGF2', 'AGF3', 'AGF4',
      'AGU1', 'AGU2', 'AGU3', 'EP1', 'EP', 'GP', 'BASE'])) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd, quality_grade]
    output: gross_floor_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['AGF2', 'DG3L', 'AGU2',
      'AGF1', 'AGU1', 'DGU', 'DG3A', 'DGU2', 'DG2L', 'DGAR', 'DGU1', 'DG3G',
      'AGF3', 'DG2A', 'DG2G', 'GAR', 'DG3E', 'AGU3', 'DGU3', 'DG2E', 'DG1A',
      'DGF2', 'DG1G', 'DG1L', 'DGF1', 'AGF4', 'DG1E', 'DGF3']) & (imprv_det_area
      > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['AGF2', 'DG3L', 'AGU2', 'AGF1', 'AGU1', 'DGU', 'DG3A', 'DGU2', 'DG2L',
          'DGAR', 'DGU1', 'DG3G', 'AGF3', 'DG2A', 'DG2G', 'GAR', 'DG3E', 'AGU3',
          'DGU3', 'DG2E', 'DG1A', 'DGF2', 'DG1G', 'DG1L', 'DGF1', 'AGF4', 'DG1E',
          'DGF3']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['AGF2', 'DG3L', 'AGU2',
      'AGF1', 'AGU1', 'DGU', 'DG3A', 'DGU2', 'DG2L', 'DGAR', 'DGU1', 'DG3G',
      'AGF3', 'DG2A', 'DG2G', 'GAR', 'DG3E', 'AGU3', 'DGU3', 'DG2E', 'DG1A',
      'DGF2', 'DG1G', 'DG1L', 'DGF1', 'AGF4', 'DG1E', 'DGF3']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['CPT', 'CP', 'CPT1', 'CPT2', 'DCP', 'CPT3', 'CRPT', 'CPT4']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['OP', 'EP1', 'SP', 'CP2',
      'OP1', 'OP2', 'GP', 'SP1', 'EP']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['PC', 'WD', 'PO', 'PC2',
      'PC3', 'PC4', 'PC1']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['Pool+', 'POOL']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['BASE']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['BASE']
        output: true
    output: has_basement
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['MA', 'MA3', 'MAAA', 'MA2',
      'MAA', 'ADDN', 'MA4', 'MA5']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['MA', 'MA3', 'MAAA',
      'MA2', 'MAA', 'ADDN', 'MA4', 'MA5']) & (effective_year_built > 1800) &
      (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  gross_floor_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max
  quality_grade: first
  effective_year_built: min

supplements: US-TX-LAV_property-lavacacad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
