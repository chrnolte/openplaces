# Recipe: Galveston County, TX certified appraisal roll -- improvement
# features, bathrooms (Galveston CAD). Same member (PACS File #9) and
# row rule as US-TX-VIC_property-victoriacad-2026_bedrooms; read its
# header first. This header covers what differs for Galveston.
#
# Galveston's "Plumbing" attribute is a bath total with halves as .5
# (codes 2, 1, 2.5, 3.5, 3, 1.5, 4 lead, median 2; the registry's
# n_bathrooms definition, with no separate half count). Cleaning:
#   - irregular spellings are repaired before parsing: "2,5" (173 rows)
#     and "2 1/2" (98) read as 2.5, "2." as 2;
#   - code "9" (894 rows, on 0.7% of single-family properties) is left
#     out: it sits between 5.5 and nothing, far above the next common
#     code, so it reads as a fixture count or placeholder, not a total;
#   - letter codes (N, B, A, S, FP, CS, HE), zero and unparseable forms
#     ("2..5", "3.5.5", "2/5", about 40 rows) are left out.
# The query admits only the forms above that parse to a positive
# number, so that drop_duplicates keeps a bath row, and because
# link_by_id sums a property whose only rows are null to 0.
#
# Galveston records bedrooms on 0.8% and rooms on 0.3% of single-family
# properties, below the 25% floor, so no recipes exist for them, and
# File #8 has no room-type details.
#
# MEASURED on the 2026 export: 120,979 rows over 115,914 properties.
# After cleaning, 89.3% of the 124,758 single-family (A) properties
# carry it, 64.0% of multifamily (B), 12.2% of rural improved (E), no
# mobile homes (M); per property median 2, p99 4.5. Totals above 10
# (max 64,002) are keying errors left for curate's range checks.
#
# ROW RULE. 1,390 improvements carry two or more rows and 85% of those
# agree, so one row per building is kept, as in the template.

description: >-
  Galveston County, TX certified appraisal roll, improvement features
  member: bathrooms per building (halves as .5), summed to the property.

admin_id: US-TX-GAL

entity:
  entity_type: property
  source:
    source_id: galvestoncad
    # Same download as the roll; see its terms note.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://galvestoncad.org/preliminary-and-certified-roll-export-data/"
    download_url: "https://galvestoncad.org/wp-content/uploads/2026/08/2026-CERTIFIED-ROLL-WEB-EXPORT-W-EXPORT-LAYOUT.zip"
  version: 2026

compressed_file_name: "2026-CERTIFIED-ROLL-WEB-EXPORT-W-EXPORT-LAYOUT.zip"
uncompressed_file_name: "2026-07-20_003459_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS 8.0.34 File #9 (Improvement Features).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Plumbing'
  and n_bathrooms.str.contains('^(?:[0-9]+[.]?|[0-9]*[.,][0-9]+|[0-9]+ 1/2)$', na=False)
  and n_bathrooms.str.contains('[1-9]', na=False)
  and n_bathrooms != '9'

# One row per building, then summed across buildings.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: string
    operation: replace
    input: n_bathrooms
    args:
      old: ","
      new: "."
    output: n_bathrooms
  - type: string
    operation: replace
    input: n_bathrooms
    args:
      old: " 1/2"
      new: ".5"
    output: n_bathrooms
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_bathrooms: sum

supplements: US-TX-GAL_property-galvestoncad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
