# Recipe: Galveston County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-GAL_property-galvestoncad-2026; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2027 (0 is the district's
# blank).
#
# FROG ('FINISHED ROOM OVER GARAGE') counts as living area. CP4
# ('CONCRETE') is paving, not a carport.
#
# TYPES. living area: types MA, MA2, MAA, MA1.5, MAAD, MA3, MA2.5, MA4,
# MA5, MA6, MA7, MA8, MA9, MA10, MA11, MA12, MA13, MA14, MA15, MA16,
# MA17, MA18, MA19, MA20, FROG. garage: types GA, DG, RG2, GARAGE, RG1.
# carport: types CP1, CP3, CP2, CP. porch: types OP, EP, SP. deck and
# patio: types WD, CO, PC, DECK, CCO. swimming pool: types POOL, LPOOL,
# XPOOL, CPOOL. elevator: types ELEV, ELV.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 124,758
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 99.3% (B
# 99.6%, E 13.9%, M 100.0%), per-property median 1833. garage_area_sqft
# A 77.4% (B 32.4%, E 15.6%, M 0.5%), per-property median 462.
# has_garage A 77.5% (B 32.4%, E 15.8%, M 0.5%). garage_type A 77.5% (B
# 32.4%, E 15.8%, M 0.5%), 5 distinct codes. has_carport A 15.4% (B
# 9.0%, E 36.4%, M 11.6%). porch_area_sqft A 90.5% (B 79.3%, E 19.4%, M
# 49.1%), per-property median 145. deck_area_sqft A 18.9% (B 16.9%, E
# 8.6%, M 24.8%), per-property median 301. has_pool A 12.5% (B 7.1%, E
# 2.9%, M 0.0%). has_elevator A 2.2% (B 0.6%, E 0.4%, M 0.0%).
# quality_grade A 99.2% (B 99.6%, E 13.7%, M 100.0%), 561 distinct
# codes. year_built A 88.6% (B 81.3%, E 13.0%, M 86.7%), per-property
# median 2000. effective_year_built A 99.4% (B 99.6%, E 14.2%, M 99.9%),
# per-property median 2004.

description: >-
  Galveston County, TX certified appraisal roll, improvement detail member: living,
  garage, porch and deck areas, class and feature flags per property.

admin_id: US-TX-GAL

entity:
  entity_type: property
  source:
    source_id: galvestoncad
    # Same download as the roll; see its terms note.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://galvestoncad.org/preliminary-and-certified-roll-export-data/"
    download_url: "https://galvestoncad.org/wp-content/uploads/2026/08/2026-CERTIFIED-ROLL-WEB-EXPORT-W-EXPORT-LAYOUT.zip"
  version: 2026

compressed_file_name: "2026-CERTIFIED-ROLL-WEB-EXPORT-W-EXPORT-LAYOUT.zip"
uncompressed_file_name: "2026-07-20_003459_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MAA', 'MA1.5',
      'MAAD', 'MA3', 'MA2.5', 'MA4', 'MA5', 'MA6', 'MA7', 'MA8', 'MA9', 'MA10',
      'MA11', 'MA12', 'MA13', 'MA14', 'MA15', 'MA16', 'MA17', 'MA18', 'MA19',
      'MA20', 'FROG']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['GA', 'DG', 'RG2', 'GARAGE',
      'RG1']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['GA', 'DG', 'RG2', 'GARAGE', 'RG1']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['GA', 'DG', 'RG2',
      'GARAGE', 'RG1']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['CP1', 'CP3', 'CP2', 'CP']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['OP', 'EP', 'SP']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['WD', 'CO', 'PC', 'DECK',
      'CCO']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['POOL', 'LPOOL', 'XPOOL', 'CPOOL']
        output: true
    output: has_pool
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['ELEV', 'ELV']
        output: true
    output: has_elevator
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MAA', 'MA1.5',
      'MAAD', 'MA3', 'MA2.5', 'MA4', 'MA5', 'MA6', 'MA7', 'MA8', 'MA9', 'MA10',
      'MA11', 'MA12', 'MA13', 'MA14', 'MA15', 'MA16', 'MA17', 'MA18', 'MA19',
      'MA20', 'FROG']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MAA', 'MA1.5',
      'MAAD', 'MA3', 'MA2.5', 'MA4', 'MA5', 'MA6', 'MA7', 'MA8', 'MA9', 'MA10',
      'MA11', 'MA12', 'MA13', 'MA14', 'MA15', 'MA16', 'MA17', 'MA18', 'MA19',
      'MA20', 'FROG']) & (year_built > 1800) & (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['MA', 'MA2', 'MAA',
      'MA1.5', 'MAAD', 'MA3', 'MA2.5', 'MA4', 'MA5', 'MA6', 'MA7', 'MA8', 'MA9',
      'MA10', 'MA11', 'MA12', 'MA13', 'MA14', 'MA15', 'MA16', 'MA17', 'MA18',
      'MA19', 'MA20', 'FROG']) & (effective_year_built > 1800) &
      (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  has_elevator: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-GAL_property-galvestoncad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
