# Recipe: Guadalupe County, TX certified appraisal roll -- improvement
# features, bathrooms (Guadalupe Appraisal District). Same member (PACS
# File #9) and row rule as US-TX-VIC_property-victoriacad-2026_bedrooms;
# read its header first. This header covers what differs for Guadalupe.
#
# Guadalupe's "Plumbing" attribute mixes two things on separate rows of
# the same building: utility codes cut at 10 characters (MW-MUNICIP,
# S1-MUNICIP, S2-SEPTIC, RW-RURAL W, WW-WELL WT: water and sewer
# service) and bath totals written "2 BATH", "2.5 BATH", ".5 BATH",
# "2-BATH" or as a bare number. The query keeps only the bath forms and
# the transformation reads the number: a total with halves as .5, the
# registry's n_bathrooms definition, with no separate half count.
# "UNKNOWN", "NONE", ranges ("2-3") and zero are left out: a row the
# query admits always parses to a positive count, because link_by_id
# sums a property whose only rows are null to 0.
#
# The separate "Bath" attribute describes bathroom features (DBL
# VANITY, TUB/SHOWER, GARDEN TUB), not counts, and is not read.
#
# MEASURED on the 2026 export: 109,418 Plumbing rows over 54,207
# properties, of which the bath forms are about 45%. After cleaning,
# 62.2% of the 66,698 single-family (A) properties carry it, 20.0% of
# multifamily (B), 26.5% of rural improved (E), 9.2% of mobile homes
# (M); per property median 2, p99 4.
#
# ROW RULE, measured on the bath rows only. 824 of 44,609 improvements
# carry two or more bath rows and 50% of those agree. Against the count
# expected from the improvement's area (median of single-row
# improvements in the same area decile), the first row is off by 0.55
# on average, the max by 0.58 and the sum by 3.00. drop_duplicates keeps
# the first bath row per building; the sum then adds distinct buildings.

description: >-
  Guadalupe County, TX certified appraisal roll, improvement features
  member: bathrooms per building (halves as .5), summed to the property.

admin_id: US-TX-GUA

entity:
  entity_type: property
  source:
    source_id: guadalupecad
    # Same download as the roll; see its terms note.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://guadalupead.org/certified-appraisal-roll/"
    download_url: "https://guadalupead.org/wp-content/uploads/2026/07/2026-GCO-Certified-Appraisal-Roll-Supp-0.zip"
  version: 2026

compressed_file_name: "2026-GCO-Certified-Appraisal-Roll-Supp-0.zip"
uncompressed_file_name: "2026 GCO Certified Appraisal Roll Supp 0/2026-07-28_016967_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS 8.0.34 File #9 (Improvement Features).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  n_bathrooms: imprv_attr_cd

# Bath rows only, so that drop_duplicates keeps a bath row rather than
# a utility code of the same building.
query: >-
  imprv_attr_desc == 'Plumbing'
  and n_bathrooms.str.contains('^[0-9]*[.]?[0-9]+ *-? *(?:BATH)?$', na=False)
  and n_bathrooms.str.contains('^[0-9.]*[1-9]', na=False)

drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: string
    operation: extract_named
    input: n_bathrooms
    args:
      pattern: '^(?P<n>[0-9]*[.]?[0-9]+)'
    output: n_bathrooms
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  n_bathrooms: sum

supplements: US-TX-GUA_property-guadalupecad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: bathrooms
