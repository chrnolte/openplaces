# Recipe: Guadalupe County, TX certified appraisal roll, improvement
# features member (PACS File #9): has_solar from the district's 'Solar
# Device' attribute. Same download and File #9 row shape as the roll's
# room-count supplements; read US-TX-GUA_property-guadalupecad-2026 for
# the source and its terms.
#
# READING. Presence only. A property is true where a row exists and
# missing elsewhere: the attribute lists present features only.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value): A is the 66,698 single-family properties (improvement state
# class A, File #7); B, E and M the other residential classes. has_solar
# A 2.9% (B 0.0%, E 0.8%, M 0.1%).

description: >-
  Guadalupe County, TX certified appraisal roll, improvement features member: has_solar
  per building, reduced to the property.

admin_id: US-TX-GUA

entity:
  entity_type: property
  source:
    source_id: guadalupecad
    # Same download as the roll; see its terms note.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://guadalupead.org/certified-appraisal-roll/"
    download_url: "https://guadalupead.org/wp-content/uploads/2026/07/2026-GCO-Certified-Appraisal-Roll-Supp-0.zip"
  version: 2026

compressed_file_name: "2026-GCO-Certified-Appraisal-Roll-Supp-0.zip"
uncompressed_file_name: "2026 GCO Certified Appraisal Roll Supp 0/2026-07-28_016967_APPRAISAL_IMPROVEMENT_DETAIL_ATTR.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #9 (Improvement Features), 87 characters wide.
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [imprv_id, 12]
  - [filler, 12] # imprv_det_id
  - [filler, 12] # imprv_attr_id
  - [imprv_attr_desc, 25]
  - [imprv_attr_cd, 10]

columns:
  has_solar: imprv_attr_cd

query: >-
  imprv_attr_desc == 'Solar Device' and has_solar == 'SOLAR PANE'

# One row per building.
drop_duplicates: [prop_id, imprv_id]

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: remap_conditional
    input: has_solar
    conditions:
      - condition: regex
        pattern: '.'
        output: true
    output: has_solar

drop_columns:
  - imprv_attr_desc
  - imprv_id

aggregation_function:
  has_solar: max

supplements: US-TX-GUA_property-guadalupecad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: solar
