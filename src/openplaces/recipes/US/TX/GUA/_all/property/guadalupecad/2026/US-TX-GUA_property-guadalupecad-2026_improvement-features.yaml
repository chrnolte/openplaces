# Recipe: Guadalupe County, TX certified appraisal roll, improvement
# features from the improvement detail member (PACS File #8, one row per
# building component). Same download as
# US-TX-GUA_property-guadalupecad-2026; read that roll's header for the
# source and its terms.
#
# RULE. Each component type below was assigned to a feature from the
# district's own type code and description (listed, never crosswalked).
# Areas are the component's imprv_det_area in square feet, summed over
# the property's components; an area of 0 or 1 reads as missing (some
# districts put 1 in the area of a component valued as a unit). A flag
# is true where the property has a component of that type and missing
# elsewhere: the file lists the components present, never their absence.
# garage_type keeps the district's code of the first garage component.
#
# MAIN AREA. quality_grade is imprv_det_class_cd and
# effective_year_built is depreciation_yr, both read on the living-area
# components only. The class code is the district's construction class
# (quality grade, often with a material or story suffix), kept as
# published; the first living-area component's class stands for the
# property. The depreciation year is the year PACS depreciates the
# component from, the effective year built; the property takes the
# earliest, as year_built does in the Texas improvement-detail recipes.
# year_built is the living-area components' yr_built, the earliest kept.
# Both years read as missing outside 1801 to 2027 (0 is the district's
# blank).
#
# Guadalupe's CP is a covered porch and CPT a covered patio; its
# carports are DC, CARC and CARI.
#
# TYPES. living area: types RES1, UPST, MH, ADDN, DUP1, ADDI, CONDO,
# UPS2, TH, RES2, MA. garage: types AGF, DG, AGU, EG, DGU, CAGF, GAR.
# carport: types DC, CARC, CARI. porch: types CP, SP, EP, DCPR, GP, COP,
# DSP, DEP, OP, DGPD, DOP. deck and patio: types CPT, PT, DECK, DDECK,
# CD, DCD, DCPT, DPT. swimming pool: types POOL, APL. basement (finished
# and unfinished): types BASF, BASE, CBU, CBF. finished basement: types
# BASF, CBF. accessory dwelling: types GAPT.
#
# MEASURED on the 2026 export (aggregates only; share of properties with
# a value, for flags the share where true). A is the 66,698
# single-family properties (improvement state class A, File #7); B, E
# and M the other residential classes. living_area_sqft A 97.5% (B
# 83.7%, E 88.5%, M 99.9%), per-property median 1908. garage_area_sqft A
# 81.1% (B 57.8%, E 42.3%, M 1.7%), per-property median 420. has_garage
# A 81.1% (B 57.8%, E 42.3%, M 1.7%). garage_type A 81.1% (B 57.8%, E
# 42.3%, M 1.7%), 7 distinct codes. has_carport A 11.8% (B 8.0%, E
# 35.5%, M 12.3%). porch_area_sqft A 86.1% (B 72.4%, E 61.3%, M 6.2%),
# per-property median 116. deck_area_sqft A 58.8% (B 27.6%, E 50.9%, M
# 72.7%), per-property median 200. has_pool A 5.9% (B 3.2%, E 8.6%, M
# 0.0%). basement_area_sqft A 0.3% (B 0.0%, E 0.4%, M 0.0%),
# per-property median 622. has_basement A 0.3% (B 0.0%, E 0.4%, M 0.0%).
# basement_finished_area_sqft A 0.2% (B 0.0%, E 0.1%, M 0.0%),
# per-property median 617.5. has_accessory_dwelling A 0.8% (B 0.6%, E
# 2.3%, M 0.0%). quality_grade A 97.5% (B 83.7%, E 88.5%, M 99.9%), 47
# distinct codes. year_built A 97.1% (B 80.6%, E 87.9%, M 96.7%),
# per-property median 2006. effective_year_built A 82.4% (B 81.4%, E
# 80.6%, M 91.4%), per-property median 2009.

description: >-
  Guadalupe County, TX certified appraisal roll, improvement detail member: living,
  garage, porch and deck areas, class and feature flags per property.

admin_id: US-TX-GUA

entity:
  entity_type: property
  source:
    source_id: guadalupecad
    # Same download as the roll; see its terms note.
    license: "unknown (site-footer copyright only; no terms on the data)"
    redistribution_restricted: null
    portal_url: "https://guadalupead.org/certified-appraisal-roll/"
    download_url: "https://guadalupead.org/wp-content/uploads/2026/07/2026-GCO-Certified-Appraisal-Roll-Supp-0.zip"
  version: 2026

compressed_file_name: "2026-GCO-Certified-Appraisal-Roll-Supp-0.zip"
uncompressed_file_name: "2026 GCO Certified Appraisal Roll Supp 0/2026-07-28_016967_APPRAISAL_IMPROVEMENT_DETAIL.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# PACS File #8 (Improvement Detail).
fixed_width:
  - [prop_id, 12]
  - [filler, 4] # prop_val_yr
  - [filler, 12] # imprv_id
  - [filler, 12] # imprv_det_id
  - [imprv_det_type_cd, 10]
  - [filler, 25] # Imprv_det_type_desc
  - [imprv_det_class_cd, 10]
  - [yr_built, 4]
  - [depreciation_yr, 4]
  - [imprv_det_area, 15]

columns:
  quality_grade: imprv_det_class_cd
  year_built: yr_built
  effective_year_built: depreciation_yr

# The class code '*' is the district's blank.
null_value_strings: ['*']

transformations:
  - type: string
    operation: lstrip
    input: prop_id
    args:
      chars: "0"
    output: parcel_id_assessor
  - type: unary
    operation: to_numeric
    input: imprv_det_area
    output: imprv_det_area
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['RES1', 'UPST', 'MH', 'ADDN',
      'DUP1', 'ADDI', 'CONDO', 'UPS2', 'TH', 'RES2', 'MA']) & (imprv_det_area >
      1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: living_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['AGF', 'DG', 'AGU', 'EG',
      'DGU', 'CAGF', 'GAR']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: garage_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['AGF', 'DG', 'AGU', 'EG', 'DGU', 'CAGF', 'GAR']
        output: true
    output: has_garage
  - type: expression
    expression: >-
      imprv_det_type_cd.where(imprv_det_type_cd.isin(['AGF', 'DG', 'AGU', 'EG',
      'DGU', 'CAGF', 'GAR']))
    inputs: [imprv_det_type_cd]
    output: garage_type
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['DC', 'CARC', 'CARI']
        output: true
    output: has_carport
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['CP', 'SP', 'EP', 'DCPR',
      'GP', 'COP', 'DSP', 'DEP', 'OP', 'DGPD', 'DOP']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: porch_area_sqft
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['CPT', 'PT', 'DECK', 'DDECK',
      'CD', 'DCD', 'DCPT', 'DPT']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: deck_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['POOL', 'APL']
        output: true
    output: has_pool
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['BASF', 'BASE', 'CBU',
      'CBF']) & (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['BASF', 'BASE', 'CBU', 'CBF']
        output: true
    output: has_basement
  - type: expression
    expression: >-
      imprv_det_area.where(imprv_det_type_cd.isin(['BASF', 'CBF']) &
      (imprv_det_area > 1))
    inputs: [imprv_det_area, imprv_det_type_cd]
    output: basement_finished_area_sqft
  - type: remap_conditional
    input: imprv_det_type_cd
    conditions:
      - condition: in
        values: ['GAPT']
        output: true
    output: has_accessory_dwelling
  - type: expression
    expression: >-
      quality_grade.where(imprv_det_type_cd.isin(['RES1', 'UPST', 'MH', 'ADDN',
      'DUP1', 'ADDI', 'CONDO', 'UPS2', 'TH', 'RES2', 'MA']))
    inputs: [quality_grade, imprv_det_type_cd]
    output: quality_grade
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: expression
    expression: >-
      year_built.where(imprv_det_type_cd.isin(['RES1', 'UPST', 'MH', 'ADDN',
      'DUP1', 'ADDI', 'CONDO', 'UPS2', 'TH', 'RES2', 'MA']) & (year_built >
      1800) & (year_built <= 2027))
    inputs: [year_built, imprv_det_type_cd]
    output: year_built
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: expression
    expression: >-
      effective_year_built.where(imprv_det_type_cd.isin(['RES1', 'UPST', 'MH',
      'ADDN', 'DUP1', 'ADDI', 'CONDO', 'UPS2', 'TH', 'RES2', 'MA']) &
      (effective_year_built > 1800) & (effective_year_built <= 2027))
    inputs: [effective_year_built, imprv_det_type_cd]
    output: effective_year_built

drop_columns:
  - imprv_det_type_cd
  - imprv_det_area

aggregation_function:
  living_area_sqft: sum
  garage_area_sqft: sum
  has_garage: max
  garage_type: first
  has_carport: max
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_pool: max
  basement_area_sqft: sum
  has_basement: max
  basement_finished_area_sqft: sum
  has_accessory_dwelling: max
  quality_grade: first
  year_built: min
  effective_year_built: min

supplements: US-TX-GUA_property-guadalupecad-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvement-features
