# Recipe to import counties for the United States (2025)

description: >-
  U.S. county boundaries from Census TIGER/Line 2025 (admin level 3).

# Administrative unit identifier: where does this data come from?
admin_id: US

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: admin
   # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: census
    # Work of the U.S. Government, so uncopyrightable in the US by
    # statute (17 U.S.C. 105) rather than by a licence anyone grants.
    # Checked 2026-08-20: the agency publishes no terms page because it
    # does not need one.
    license: "public-domain (US Government work, 17 U.S.C. 105)"
    redistribution_restricted: false
    terms_url: null
    portal_url: "https://www2.census.gov/geo/tiger/TIGER2025/"
    download_url: "https://www2.census.gov/geo/tiger/TIGER2025/COUNTY/tl_2025_us_county.zip"
  version: 2025

# Name of compressed file (set to skip re-downloading)
compressed_file_name: "tl_2025_us_county.zip"

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  name: NAME
  name_long: NAMELSAD
  admin3_id_admin1: GEOID
  admin3_id_ansi: COUNTYNS
  admin2_id_leaf: STUSPS
  admin2_id_admin1: STATEFP
  stats_area_id: CSAFP
  stats_area_id_metro: CBSAFP
  stats_area_id_legal: LSAD

# Filter query to select rows
# Keeps 50 states and DC (territories are in `admin1` according to ISO)
# Territories are excluded by the FIPS ceiling. The six New England
# states are excluded because their level 3 is towns, not counties:
# their governing units are Census county subdivisions, ingested per
# state from the same TIGER COUSUB layer that feeds
# US_admin-census-2025_admin4. Leaving their counties in gives every one
# of them an empty admin3_id -- there is no level-3 county in the spine
# to match -- which used to abort this whole national ingest, and with
# it every downstream admin map.
# CT 09, ME 23, MA 25, NH 33, RI 44, VT 50.
query: >-
  admin2_id_admin1 <= '56'
  and admin2_id_admin1 not in ['09', '23', '25', '33', '44', '50']

# Function that returns an indexed version of the input GeoDataFrame
# (reconciles local admin-3 units against the global GADM spine; the
# recipe-ID arg also declares the admin-2 dependency to the flow DAG)
create_index:
  function: "openplaces.io.admin.admin3_id_index_from_local"
  args:
    admin2_recipe_id: US_admin-census-2025_admin2

save_to:
  data_dir: cache
  filename: admin3
