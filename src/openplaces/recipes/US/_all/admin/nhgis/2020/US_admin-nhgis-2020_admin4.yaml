# Recipe to import county subdivisions for the United States (NHGIS 2020)

description: >-
  U.S. county subdivision boundaries from NHGIS 2020 census geographies (admin level 4).

# Administrative unit identifier: where does this data come from?
admin_id: US

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: admin
   # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: nhgis
    # Terms verified 2026-08-20 at the terms_url below, and they are a
    # "legally binding agreement", not an open licence: "You will not
    # redistribute the data without permission." A subset may be
    # published to meet a journal requirement; anything else, free or
    # commercial, needs NHGIS approval. Citation required:
    # IPUMS NHGIS, University of Minnesota, www.nhgis.org
    #
    # Third source found with terms narrower than the Apache-2.0 grant,
    # after GADM and GISCO. Matters most where NHGIS feeds a published
    # admin spine rather than a local build.
    license: "no redistribution without permission; citation required"
    terms_url: "https://www.nhgis.org/citation-and-use-nhgis-data"
    redistribution_restricted: true
    portal_url: "https://data2.nhgis.org/main"
  version: 2020

# Name of compressed file (set to skip re-downloading)
compressed_file_name: "nhgis*_shapefile_tl2020_us_cty_sub_2020.zip"

# Name of uncompressed file (set to skip re-extracting)
uncompressed_file_name: "US_cty_sub_2020.shp"

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  name: NAME
  name_long: NAMELSAD
  admin4_id_admin1: GEOID
  admin4_id_admin3: COUSUBFP
  admin4_id_ansi: COUSUBNS
  admin4_id_nhgis: GISJOIN
  admin2_id_admin1: STATEFP
  type_source: CLASSFP
  functional_status: FUNCSTAT
  stats_area_id_legal: LSAD

# Filter query to select rows
# Keeps 50 states and DC (territories are in `admin1` according to ISO)
# And remove erroneous polygons near Dennis town, Barnstable, MA
query: "admin2_id_admin1 <= '56' and name != 'County subdivisions not defined'"

transformations:
  # Get county FIPS: first 5 characters of county subdivision FIPS
  - output: admin3_id_admin1
    type: string
    operation: substring
    input: admin4_id_admin1
    args:
      start: 0
      end: 5

# Translate `admin_id` information from source to `openplaces` admin_ids
admin_id_crosswalk:
  admin_level: 3
  admin_id_column: admin3_id_admin1
  admin_recipe_id: "US_admin-nhgis-2020_admin3"

# Function that returns an indexed version of the input GeoDataFrame
# (usually a custom function designed for a specific indexing case)
# Function to give the GeoDataFrame an index
create_index:
  function: "openplaces.io.admin_codes.assign_admin_ids"
  args:
    new_admin_id_col: admin4_id
    parent_admin_id_col: admin3_id

save_to:
  data_dir: cache
  filename: admin4
