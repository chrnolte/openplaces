# Recipe to import land-only counties for the United States (2025, 500k)

description: >-
  U.S. county boundaries clipped to the shoreline, Census cartographic
  boundary files 2025 at 1:500,000 (admin level 3).

# Land-only boundaries for drawing, not for joining. The Census
# cartographic boundary files are TIGER/Line generalized in the interior
# and clipped to the shoreline, so the Great Lakes and coastal waters sit
# outside the polygons that TIGER draws out to the state water
# boundaries. AWATER still reports the TIGER water area and does not
# describe the clipped geometry. Pass geom='land' to get_admin() to read
# this layer. It is withdrawn from auto-discovery so that no spine, join
# or clip takes its polygons: generalizing and clipping at the shore
# would move shoreline and island points out of their unit.

admin_id: US

exclude_from_auto_discover: true

entity:
  entity_type: admin
  source:
    source_id: censuscb
    # Work of the U.S. Government, so uncopyrightable in the US by
    # statute (17 U.S.C. 105) rather than by a licence anyone grants.
    license: "public-domain (US Government work, 17 U.S.C. 105)"
    redistribution_restricted: false
    terms_url: null
    portal_url: "https://www.census.gov/geographies/mapping-files/time-series/geo/cartographic-boundary.html"
    download_url: "https://www2.census.gov/geo/tiger/GENZ2025/shp/cb_2025_us_county_500k.zip"
  version: 2025

compressed_file_name: "cb_2025_us_county_500k.zip"

columns:
  name: NAME
  name_long: NAMELSAD
  admin3_id_admin1: GEOID
  admin3_id_ansi: COUNTYNS
  admin2_id_leaf: STUSPS
  admin2_id_admin1: STATEFP
  stats_area_id_legal: LSAD

# The six New England states are left out because their level 3 is
# towns (the per-state recipes of this source), as in the TIGER recipe.
# CT 09, ME 23, MA 25, NH 33, RI 44, VT 50.
query: >-
  admin2_id_admin1 <= '56'
  and admin2_id_admin1 not in ['09', '23', '25', '33', '44', '50']

create_index:
  function: "openplaces.io.admin.admin3_id_index_from_local"
  args:
    admin2_recipe_id: US_admin-censuscb-2025_admin2

save_to:
  data_dir: core
  filename: admin3
