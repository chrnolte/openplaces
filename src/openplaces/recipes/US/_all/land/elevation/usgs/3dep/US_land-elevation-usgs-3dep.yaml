description: >-
  USGS 3DEP digital elevation model rasters for the United States.

admin_id: US

dataset:
  theme: 'land-elevation'
  source:
    source_id: usgs
    # Work of the U.S. Government, so uncopyrightable in the US by
    # statute (17 U.S.C. 105) rather than by a licence anyone grants.
    # Checked 2026-08-20: the agency publishes no terms page because it
    # does not need one.
    license: "public-domain (US Government work, 17 U.S.C. 105)"
    redistribution_restricted: false
    terms_url: null
    portal_url: "https://www.usgs.gov/3d-elevation-program"
    download_url: "s3://prd-tnm/StagedProducts/Elevation/13/TIFF/USGS_Seamless_DEM_13.vrt"
  version: 3dep
  is_raster: True

resolution: 10

process_by:
  admin_level: 3

save_to:
  data_dir: cache
