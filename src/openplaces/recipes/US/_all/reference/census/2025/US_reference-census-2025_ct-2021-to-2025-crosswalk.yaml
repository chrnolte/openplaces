# Recipe to import Connecticut's 2021-to-2025 admin3/4 crosswalk.
#
# Connecticut is the only US state where TIGER/Line's admin3 geography
# changed between the 2021 and 2025 vintages: the Census Bureau replaced
# eight legacy counties with nine Councils-of-Government-based planning
# regions in 2022 (see
# https://www2.census.gov/geo/pdfs/reference/ct_county_equiv_change.pdf).
# Confirmed the only affected state by diffing every county GEOID
# nationwide between TIGER2021 and TIGER2025.
#
# US_admin-census-2021 stays around because PLACES-FMV-CONUS keys off of
# its admin_ids; this table lets it (or any other downstream consumer)
# translate those into the current US_admin-census-2025 admin_ids for
# Connecticut, where the two vintages disagree.

description: >-
  Connecticut's 2021-to-2025 admin3/4 ID crosswalk (county-to-planning-region change).

admin_id: US

dataset:
  theme: reference
  source:
    source_id: census
    # Work of the U.S. Government, so uncopyrightable in the US by
    # statute (17 U.S.C. 105) rather than by a licence anyone grants.
    # Checked 2026-08-20: the agency publishes no terms page because it
    # does not need one.
    license: "public-domain (US Government work, 17 U.S.C. 105)"
    redistribution_restricted: false
    terms_url: null
    portal_url: "https://www.census.gov/programs-surveys/geography/technical-documentation/county-changes/2020.html"
    download_url: "https://www2.census.gov/geo/docs/reference/ct_change/ct_cou_to_cousub_crosswalk.xlsx"
  version: 2025

compressed_file_name: "ct_cou_to_cousub_crosswalk.xlsx"
# pandas.read_excel requires an int/list-of-int/None header, unlike
# read_csv's 'infer' default the ingester otherwise applies.
header: 0

# Function that returns an indexed version of the input DataFrame
# (resolves each row's old/new COUSUB GEOID against the already-ingested
# US census-2021 and census-2025 admin4 outputs)
create_index:
  function: "openplaces.io.admin.census_2021_to_2025_crosswalk_index"
  args:
    old_admin4_recipe_id: US_admin-census-2021_admin4
    new_admin4_recipe_id: US_admin-census-2025_admin4

save_to:
  data_dir: cache
  filename: ct-2021-to-2025-crosswalk
