# Recipe: BLS CPI-U, US city average, all items (CUUR0000SA0)
#
# The Consumer Price Index for All Urban Consumers, not seasonally
# adjusted, 1982-84 = 100, from the BLS LABSTAT bulk flat file of the
# "all items" CU series. The file is whitespace-padded and
# tab-separated (series_id, year, period, value, footnote_codes); a
# whitespace delimiter reads it without padding in names or values.
# It holds every all-items CU series (areas, seasonal adjustment,
# bases); `query` keeps CUUR0000SA0 only.
#
# Periods: M01 to M12 are months and M13 is the annual average BLS
# publishes; the annual row is kept as published, not recomputed.
#
# Measured 2026-10-18: 1,478 rows, January 1913 to September 2026
# (annual averages from 1913 to 2025). One value is missing: October
# 2025, published as "-" with footnote code X. It is the only
# non-numeric value of any series in the file (62 rows, all 2025
# M10), and to_numeric reads it as missing.
#
# Left unmapped: footnote_codes (filled only on that one row).
#
# Design limits checked: L7, L29. This recipe ingests an index BLS
# publishes, as published; nothing in openplaces builds a price index.

description: >-
  BLS consumer price index, all urban consumers (CPI-U), US city average,
  all items, monthly and annual average, not seasonally adjusted.

admin_id: US

dataset:
  theme: economy-price-consumer
  source:
    source_id: bls
    # Checked 2026-10-18 on the BLS copyright page: "everything that
    # we publish ... is in the public domain" and "You are free to use
    # our public domain material without specific permission, although
    # we do ask that you cite the Bureau of Labor Statistics as the
    # source."
    license: >-
      public-domain (US Government work, 17 U.S.C. 105); BLS asks to be
      cited as the source
    terms_url: "https://www.bls.gov/opub/copyright-information.htm"
    redistribution_restricted: false
    portal_url: "https://www.bls.gov/cpi/data.htm"
    download_url: "https://download.bls.gov/pub/time.series/cu/cu.data.1.AllItems"
  version: "2026"

uncompressed_file_name: "cu.data.1.AllItems.txt"

delimiter: '\s+'

csv_dtype:
  series_id: str
  period: str

columns:
  series_id_bls: series_id
  year: year
  period_bls: period
  consumer_price_index: value

query: 'series_id_bls == "CUUR0000SA0"'

# The value column arrives as text because of the October 2025 "-",
# so cast it after the filter.
transformations:
  - type: unary
    operation: to_numeric
    input: consumer_price_index
    output: consumer_price_index

keep_unnamed_columns: false

save_to:
  data_dir: core
