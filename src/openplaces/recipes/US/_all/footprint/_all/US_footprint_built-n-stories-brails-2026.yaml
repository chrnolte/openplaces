description: >-
  Story-count evidence for U.S. footprints, detected from street-level imagery with
  BRAILS++.

stage: enrich
admin_id: US

entity:
  entity_type: footprint

dataset:
  theme: built-n-stories
  source:
    source_id: brails
  version: 2026

# Imagery is fetched at each footprint's own location, so this step
# needs spine geometry. Since the geospine split the attribute spine
# (`US_footprint-spine-2026`) carries none of its own -- it used to,
# which is why this went undeclared and still worked.
spine_geom: true
image_recipe: image-googlestreetview-2026

process_by:
  admin_level: 3

pipeline:
  - step: detect_n_stories
    column: n_stories_brails
