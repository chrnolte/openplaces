description: >-
  Roof-shape evidence for U.S. footprints, classified from satellite imagery with
  BRAILS++.

stage: enrich
admin_id: US

entity:
  entity_type: footprint

dataset:
  theme: built-roof-shape
  source:
    source_id: brails
  version: 2026

# Imagery is fetched at each footprint's own location, so this step
# needs spine geometry. Since the geospine split the attribute spine
# (`US_footprint-spine-2026`) carries none of its own -- it used to,
# which is why this went undeclared and still worked.
spine_geom: true
image_recipe: image-googlesatellite-z20

process_by:
  admin_level: 3

pipeline:
  - step: classify_roof_shape
    column: roof_shape_brails
