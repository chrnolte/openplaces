# Recipe to import Microsoft building footprints for the United States

description: >-
  Microsoft building footprints for the United States (v2).

# Administrative unit identifier of the geography that the data covers
admin_id: US

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: footprint
   # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: microsoft
    # Link to portal with metadata
    portal_url: "https://github.com/microsoft/USBuildingFootprints"
    # Link to direct download
    download_url: "https://minedbuildings.z5.web.core.windows.net/legacy/usbuildings-v2/{admin2_name}.geojson.zip"
    # Terms verified 2026-08-19 in the portal README: "This data is
    # licensed by Microsoft under the Open Data Commons Open Database
    # License (ODbL)." Share-alike and attribution, as for OBM above.
    license: "ODbL-1.0"
    terms_url: "https://opendatacommons.org/licenses/odbl/1-0/"
    redistribution_restricted: false
  version: v2

# Name of compressed file (set to skip re-downloading)
compressed_file_name: "{admin2_name}.geojson.zip"

# Name of uncompressed file (set to skip re-extracting)
uncompressed_file_name: "{admin2_name}.geojson"

# How is the download data partitioned?
download_by:
  admin_level: 2
  # Transformations needed to obtain the data partition admin identifier
  # used by the source URL (e.g., remove spaces)
  admin_key_transform:
    admin2_name: "remove_spaces"

# Columns to be cast to categorical (saves space)
columns_to_categorical:
  - release
  - capture_dates_range

# Assign administrative IDs using spatial joins/overlays
overlay_admin_ids:
  admin_level: 3
  admin_recipe_id: 'admin-openplaces-2026_admin3'

# Function to give the GeoDataFrame an index
create_index:
  function: "openplaces.geo.ids.add_openlocationcode_index"
  args:
    name: footprint_id

save_to:
  data_dir: cache
  # Split output into per-admin-unit files at this level
  # (1: state, 2: county, 3: town etc.)
  # Column adminX_id must exist in the pre-processed data.
  admin_level: 3
