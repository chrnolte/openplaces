# Recipe: canonical CHEER footprint dataset
#
# Pipeline order:
#   1. Harmonize source entities into the evidence-only US_footprint-spine-2026.
#   2. Enrich the spine with image-derived evidence.
#   3. Curate the evidence into canonical footprint attributes.

description: >-
  Canonical CHEER footprint inventory: harmonized U.S. footprint spine curated with
  image-derived evidence for hurricane modeling.

stage: curate
admin_id: US

entity:
  entity_type: footprint
  source:
    source_id: cheer
  version: 2026

entity_recipe: US_footprint-spine-2026

process_by:
  admin_level: 3

save_to:
  data_dir: share
  # Save as a single combined GeoParquet (attributes + geometry) without sidecars,
  # optimized for external sharing and direct GIS client consumption.
  combined: true

# Occupancy classification config: maps terminology, evidence columns, and thresholds.
occupancy:
  class_map: occupancy-class-map.csv          # recipe-relative; pattern,match_type,occupancy_type
  residential_classes: [Single-Family, Multi-Family, Manufactured Home]
  secondary_class: Secondary
  # Weighted consensus voting across sources: heaviest class wins. Ties fall to
  # the earliest listed entry (NSI-first). Multiple lower-rank agreeing sources
  # can outvote a single higher-rank opponent.
  evidence_mode: vote
  evidence:
    - {column: occupancy_type_building_nsi, label: nsi}   # tiebreak order = NSI-first
    - {column: group_footprint_fema, label: fema}  # FEMA building group
    - {column: group_parcel, label: parcel}              # label used in the conflict summary
    # Overture-implied class has a 0.5 weight: fills missing values as a fallback
    # but serves only as a tiebreaker when higher-weight sources are present.
    - {column: occupancy_type_dwelling_overture, label: overture, weight: 0.5}
  columns:                                   # generic attribute -> this recipe's column
    improvement_value: improvement_value_parcel
    land_value: land_value_parcel
    n_dwellings: n_dwellings
  # Each rule names its output class. The numeric cutoffs are anchored
  # (&name) here and aliased (*name) from the vote decisions below, so every
  # cutoff is stated exactly once even though classify_manufactured_homes
  # reads it here and the vote scores it there. One deliberate cousin lives
  # elsewhere: the harmonize-stage per-parcel candidate count
  # (n_small_elongated_footprints_per_parcel, US_parcel-spine-2026) uses
  # aspect >= 2.0 with the same 185 m2 -- a looser net for counting shapes,
  # not this per-building cutoff; see the comment there.
  rules:
    manufactured_home_geometry:
      aspect_min: &mh_aspect_min 2.5
      area_max_m2: &mh_area_max_m2 185
      class: Manufactured Home
    manufactured_home_value:
      review_max_ratio: &mh_value_share_max 0.025
      class: Manufactured Home
    multi_family_dwellings: {class: Multi-Family}
    single_family_dwellings: {class: Single-Family}

pipeline:
  # Link the curated parcel attributes (occupancy, use group, and community
  # flags) by parcel_id to drive the downstream reconciliation and inference
  # steps. manufactured_home_community seeds impute_occupancy_type below
  # with the parcel lane's one-pass classification; flag_manufactured_home_
  # communities later intentionally overwrites it under the same name with
  # the richer, footprint-occupancy-based refinement (see that step's
  # docstring) -- not a name collision to fix, the final value there is
  # meant to supersede this seed.
  - step: link_curated_entity
    recipe_id: US_parcel-openplaces-2026
    columns:
      use_group_combined: use_group_combined_parcel
      group_parcel: group_parcel
      manufactured_home_community: manufactured_home_community
      group_footprint_fema: group_footprint_fema
      land_use_class: land_use_class_parcel
      # 'rule' marks the parcel lane's own weighted vote, whose inputs include
      # assessor keywords and footprint morphology. Any other token marks a
      # reconcile_land_use fill, voted purely from group_parcel /
      # group_building_nsi / group_footprint_fema -- NSI and FEMA under a
      # second name. Only the rule route may carry weight downstream.
      land_use_class_source: land_use_class_source_parcel

  # Apportion curated parcel values to footprints:
  # - improvement_value is split by footprint overlap-area share (residential splitting
  #   excludes secondary structures; non-residential splits share among all structures).
  # - land_value goes entirely to the principal footprint.
  # - imputed land and improvement values are directly mapped to canonical land_value and
  #   structure_value columns without extra reconciliation.
  - step: apportion_curated_values
    recipe_id: US_parcel-openplaces-2026
    columns:
      improvement_value: improvement_value_parcel
      land_value: land_value_parcel
      year_built: year_built_parcel
      land_value_imputed: land_value
      improvement_value_imputed: structure_value
    land_use_column: land_use_class
    non_residential_classes:
      [Commercial, Retail, Office, Industrial, Institutional, Recreation,
       Agricultural, RV Park]

  # Decide, per admin unit (town), whether the local parcel data has usable
  # improvement values for most of its buildings. A well-covered town keeps
  # its apportioned parcel value everywhere (even for its few individually
  # missing buildings); a poorly-covered town uses the NSI-modeled value
  # everywhere instead (even where a parcel value happens to be present).
  # Blending the two sources building-by-building within one town is what
  # caused errors -- this is a per-town switch, not a per-building pick.
  - step: select_value_source_by_admin_unit
    output: structure_value
    parcel_column: structure_value
    other_column: structure_value_building_nsi

  # Store the pipe-separated list of all overlapping parcels (dominant first),
  # loaded from the persisted spatial overlay link sidecar.
  - step: collect_link_ids
    entity_type: parcel
    column: parcel_id_all

  # Suppress Overture dwelling counts on parcels that have been curated
  # as vacant (trusting the multi-source parcel land-use classification).
  - step: suppress_where
    column: n_dwellings_overture
    condition_column: land_use_class_parcel
    condition_value: Vacant

  # Vote a single-source occupancy class from Overture counts (>=2 is Multi-Family,
  # <=1 is Single-Family) to serve as a low-weight fallback or tiebreaker.
  - step: resolve_by_vote
    target: occupancy_type_dwelling_overture
    decisions:
      - class: Multi-Family
        source: overture
        min_score: 1
        indicators:
          - type: numeric_at_least
            column: n_dwellings_overture
            min: &multi_dwelling_min 2
      - class: Single-Family
        source: overture
        min_score: 1
        indicators:
          - type: numeric_at_most
            column: n_dwellings_overture
            max: &single_dwelling_max 1

  # Reconcile remaining per-row values from competing sources:
  # - land_value is pre-written by apportionment and needs no reconciliation.
  # - structure_value was already decided per admin unit above, not here.
  - step: reconcile_values
    priority:
      n_dwellings: [n_dwellings_overture, n_dwellings_nsi]
      year_built: [year_built_parcel, year_built_block_median_building_nsi]
      postal_code: [postal_code_dwelling_overture]

  # Address reconciliation and postal-city imputation are handled at the
  # harmonization stage on the input spine (reconcile_addresses /
  # impute_postal_city) -- a ZIP code's USPS-preferred city isn't
  # parameter-sensitive, so it's resolved once, upstream of curation.

  # Zero-fill missing overture counts.
  - step: fill_missing_numeric
    columns: [n_dwellings_overture]

  # Infer: derive new features from the reconciled evidence.
  - step: derive_metrics

  # Derivation layer: the named precursors the occupancy vote scores against.
  # Values only, no thresholds -- every cutoff lives in the decisions below,
  # so a given threshold appears exactly once in this recipe.
  - step: derive_indicators
    indicators:
      # Minimum-bounding-rectangle elongation, measured on a locally
      # projected metric copy. The retired geometry fallback measured raw
      # lon/lat instead, where the x axis is compressed by cos(latitude) --
      # roughly 0.82 across North Carolina, skewing every aspect ratio it
      # compared against the 2.5 cutoff.
      - output: aspect_ratio
        type: shape_metric
        metric: aspect_ratio

      # Each occupancy source coerced to the canonical class vocabulary, kept
      # as its own column rather than pooled: per-class reliability differs
      # sharply between sources (parcel is the strongest evidence for
      # single-family and among the weakest for manufactured homes), and
      # pooling would average exactly that signal away.
      - output: occupancy_type_nsi_class
        type: ruleset_class
        column: occupancy_type_building_nsi
        ruleset: occupancy-class-map.csv
      - output: occupancy_type_fema_class
        type: ruleset_class
        column: group_footprint_fema
        ruleset: occupancy-class-map.csv

      # Reviewed-only: unreviewed ruleset rows (MODULAR, bare MH, COMMERCIAL,
      # RETAIL) stay out of the class decision, preserving the gate
      # resolve_occupancy's keyword override already applied.
      - output: occupancy_keyword_class
        type: ruleset_class
        column: use_group_combined_parcel
        ruleset: parcel-occupancy-keywords.csv
        reviewed_only: true

      # Size relative to "somebody's home rather than a shed", judged against
      # how big manufactured homes actually are in this admin unit. The
      # cohort is NSI's own manufactured-home classification rather than the
      # vote's output, so the threshold cannot be moved by the decision it
      # feeds. Emitted as a value/threshold ratio, not a boolean; the vote
      # below applies the cutoff (>= 1.0). The parameters here define the
      # reference statistic (half the cohort's mean area, floored at 25 m2,
      # 90 m2 when fewer than 3 cohort samples), not a class cutoff.
      - output: habitable_size_ratio
        type: cohort_threshold
        value_column: area_m2
        cohort_column: occupancy_type_nsi_class
        cohort_value: Manufactured Home
        fraction: 0.5
        floor: 25
        fallback: 90
        min_samples: 3

  # Impute: fill any dwelling-unit gaps left after reconciliation.
  - step: impute_n_dwellings

  # Determine base occupancy class via weighted consensus voting and fallback rules.
  - step: impute_occupancy_type

  # Apply keyword overrides, value-share flags, and conflict summaries.
  - step: resolve_occupancy
    ruleset: parcel-occupancy-keywords.csv

  # Merge image-derived enrichment columns (e.g. roof shape and story count from BRAILS).
  # roof_shape is a direct, non-reconciled canonical column, so it keeps a
  # provenance sidecar; n_stories_brails is only an intermediate evidence
  # column reconciled into canonical n_stories below (which records its
  # own provenance there), so its own sidecar would be dead weight.
  - step: merge_enrichments
    recipes:
      - recipe_id: US_footprint_built-roof-shape-brails-2026
        record_source: true
        columns:
          roof_shape_brails: roof_shape
      - recipe_id: US_footprint_built-n-stories-brails-2026
        columns:
          n_stories_brails: n_stories_brails
      # CHEER Inventory v0: the same BRAILS attributes, already computed
      # statewide for North Carolina. Absent elsewhere, and merge_enrichments
      # skips a recipe with no evidence for the admin unit, so this changes
      # nothing outside NC. Kept as evidence rather than merged straight onto
      # the canonical names: roof shape has a competing source reconciled
      # below, and the rest are single-source (record_source would be
      # bookkeeping with nothing to reconcile against).
      - recipe_id: US-NC_footprint_building-cheer-v0
        columns:
          roof_shape_building_cheer: roof_shape_building_cheer
          roof_shape_confidence_building_cheer: roof_shape_confidence
          roof_shape_2_building_cheer: roof_shape_2
          roof_shape_confidence_2_building_cheer: roof_shape_confidence_2
          roof_shape_3_building_cheer: roof_shape_3
          roof_shape_confidence_3_building_cheer: roof_shape_confidence_3
          construction_type_building_cheer: construction_type
          has_garage_building_cheer: has_garage
          n_stories_building_cheer: n_stories_building_cheer
          # Kept as evidence, not merged onto canonical foundation_type:
          # it is reconciled behind NSI below.
          foundation_type_building_cheer: foundation_type_building_cheer

  # Reconcile canonical n_stories: direct floor detection first, then NSI's
  # modeled count, then CHEER's -- last because it is the same modeled
  # lineage as NSI rather than an independent observation.
  - step: reconcile_values
    priority:
      n_stories: [n_stories_brails, n_stories_building_nsi, n_stories_building_cheer]
      # Roof shape: our own per-image classification first, then CHEER's
      # statewide run of the same classifier. Both are BRAILS outputs, so
      # this is a coverage cascade, not a quality ranking -- whichever
      # actually ran for the admin unit wins.
      roof_shape: [roof_shape, roof_shape_building_cheer]
      # Foundation: NSI first, CHEER only where NSI is silent. The two
      # agree 65% over 1.57M buildings in 45 NC counties, and CHEER's
      # classes are all informative there (lift over the NSI marginal:
      # Pile 25.5, Pier 18.7, Solid wall 10.2, Basement 2.45), so this is
      # not a blanket judgement against it. It is a guard against a
      # failure mode NSI does not share: CHEER's per-county class shares
      # swing from 1.4% to 94% Basement, and in New Hanover 84% of
      # buildings come back Basement with a lift of 1.07 -- statistically
      # independent of NSI, i.e. the class collapsed and carries no
      # information, on a coast where basements are near-absent. NSI's
      # regional prior cannot collapse that way, so it leads.
      #
      # Residue to know about: ~2% of rows carry a joined value such as
      # 'Slab; Crawl', where several NSI points land on one footprint with
      # differing foundations. reconcile_attributes joins every string
      # column it is not specifically handling, ignoring the registry's
      # per-attribute aggregation (it honors it for numeric columns) --
      # the same reason address_number_dwelling_overture and
      # city_dwelling_overture carry joined values today. Not introduced
      # here and not fixed here: honoring the registry would also move
      # those address columns, and addresses feed the point linkage that
      # the occupancy baseline is measured against.
      foundation_type: [foundation_type_building_nsi, foundation_type_building_cheer]

  # Estimate manufactured home probability using morphology/assessor keywords for voting.
  - step: classify_manufactured_homes
    ruleset: parcel-occupancy-keywords.csv
    update_occupancy: false

  # Occupancy is decided in two steps, because the evidence answers two
  # different questions and almost no source answers both.
  #
  #   1. dwelling multiplicity -- one dwelling (single-family or manufactured)
  #      or several (multi-family)?
  #   2. construction type, among single-dwelling footprints only --
  #      manufactured or site-built?
  #
  # Measured against the CHEER ground truth
  # (scripts/analyze_occupancy_stages.py), sources specialize almost
  # perfectly. Overture's dwelling count is 92% precise for multi-dwelling and
  # carries a lift of 1.03 on question 2 -- i.e. no information at all about
  # construction type, which is expected, since a manufactured home is also
  # one dwelling. Conversely every manufactured-home signal is 0-6% precise
  # for multi-dwelling. Asking one flat three-way vote made these fight each
  # other; split, each is cited once on the question it can answer.
  #
  # The clearest consequence: an aspect ratio at or above 2.5 is 90% precise
  # for Manufactured Home once the population is restricted to single-dwelling
  # footprints, against 26% for multi-dwelling. In the flat vote that signal
  # was competing with dwelling counts and had to be capped; here it is the
  # strongest evidence available.
  - step: resolve_by_vote
    target: dwelling_multiplicity
    preserve_base: false
    default_source: dwelling_vote
    decisions:
      # Listed first so it wins ties: a positive count of two or more
      # dwellings is a specific claim, single-dwelling is the residual.
      - class: multi
        source: multi_dwelling
        min_score: 2
        indicators:
          # 92.3% precise on its own -- the single best signal for this
          # question, and sufficient unaided.
          - type: numeric_at_least
            column: n_dwellings_overture
            min: *multi_dwelling_min
            weight: 2
          # 83.6% precise; assessor keywords naming a multi-unit building.
          # Keywords also beat both modeled sources when they disagree
          # (permits back keyword over NSI 77/23 and over FEMA 80/20;
          # CHEER backs keyword 60/9 and 36/3), justifying the weight.
          - type: equals
            column: occupancy_keyword_class
            value: Multi-Family
            weight: 2
          # NSI and FEMA are near-copies of one another (97.5% identical
          # against permits, 95.8% at the CHEER points, and FEMA is right
          # only a third of the time where NSI is wrong), so their
          # agreement corroborates once rather than voting twice. Counted
          # separately, the pair reached min_score by itself and flipped
          # true single-family homes to Multi-Family wherever FEMA
          # coverage is complete -- measured against CHEER, rows where
          # 'multi' rested on this pair alone were 50% Single-Family.
          - type: any_of
            indicators:
              - {type: equals, column: occupancy_type_nsi_class, value: Multi-Family}
              - {type: equals, column: occupancy_type_fema_class, value: Multi-Family}
          # NSI's unit-count claims split cleanly by specificity against
          # CHEER: the '2 units' duplex guess is 35% Multi-Family (noise),
          # while its 3-plus-unit claims are 80-86% right (evidence). A
          # specific multi-unit claim therefore earns the corroborating
          # second vote that generic NSI/FEMA agreement above
          # deliberately does not.
          - type: keyword
            column: occupancy_type_building_nsi
            pattern: 'MULTI-FAMILY, (?:3-4|5-10|10-19|20-50|50 PLUS) UNITS'

      - class: single
        source: single_dwelling
        min_score: 1
        indicators:
          # Exactly one dwelling, not "at most one": the count is zero-filled
          # upstream, so a bare upper bound would let absent Overture data
          # vote as though it were evidence.
          - type: all_of
            indicators:
              - {type: numeric_at_least, column: n_dwellings_overture, min: 1}
              - type: numeric_at_most
                column: n_dwellings_overture
                max: *single_dwelling_max
          # Every manufactured-home signal is also a single-dwelling signal,
          # and measures 100% precise as one -- a manufactured home is by
          # definition one dwelling. This is exactly the information the flat
          # vote discarded by treating "manufactured" and "single-family" as
          # competitors at this stage rather than as siblings. The NSI/FEMA
          # pairs pool via any_of for the same near-copy reason as in the
          # multi decision above.
          - type: any_of
            indicators:
              - {type: equals, column: occupancy_type_nsi_class, value: Manufactured Home}
              - {type: equals, column: occupancy_type_fema_class, value: Manufactured Home}
          - {type: equals, column: occupancy_keyword_class, value: Manufactured Home}
          - {type: numeric_at_least, column: p_manufactured_home, min: 0.75}
          - type: any_of
            indicators:
              - {type: equals, column: occupancy_type_fema_class, value: Single-Family}
              - {type: equals, column: occupancy_type_nsi_class, value: Single-Family}

  # Question 2. Each decision is gated by question 1's answer, so the three
  # classes partition cleanly instead of competing across populations.
  # base_output snapshots the incoming class (from impute_occupancy_type /
  # resolve_occupancy) so the residual decisions below can refuse to
  # overwrite a positively non-residential base -- permits confirmed
  # ~2,650 New Hanover footprints (churches, retail, warehouses) that the
  # Single-Family residual had claimed, an error CHEER cannot see because
  # the survey labels only residential structures.
  - step: resolve_by_vote
    target: occupancy_type
    base_output: occupancy_type_prevote
    decisions:
      - class: Manufactured Home
        source: manufactured_home
        min_score: 2
        require:
          - {type: equals, column: dwelling_multiplicity, value: single}
          - {type: numeric_at_least, column: area_m2, min: 20}
        indicators:
          # 90% precise within the single-dwelling population; the strongest
          # evidence for this class by a wide margin, hence sufficient alone.
          - type: all_of
            weight: 2
            indicators:
              - {type: numeric_at_least, column: aspect_ratio, min: *mh_aspect_min}
              - {type: numeric_at_most, column: area_m2, max: *mh_area_max_m2}
          - {type: numeric_at_least, column: p_manufactured_home, min: 0.75}
          - {type: equals, column: occupancy_type_nsi_class, value: Manufactured Home}
          - {type: equals, column: occupancy_type_fema_class, value: Manufactured Home}
          - {type: equals, column: occupancy_keyword_class, value: Manufactured Home}
          - type: value_share_below
            value: improvement_value_parcel
            total: [improvement_value_parcel, land_value_parcel]
            max_ratio: *mh_value_share_max
            include_zero: true
          # The parcel lane's park classification, restricted to its rule
          # route. That route carries a hard require on
          # n_small_elongated_footprints_per_parcel >= 4 -- footprint
          # morphology, independent of NSI. Rows filled by reconcile_land_use
          # instead are an NSI/FEMA re-vote under a second name and are
          # excluded by the source check. Read here rather than the joined
          # manufactured_home_community flag, which
          # flag_manufactured_home_communities later overwrites from THIS
          # vote's own output -- scoring that would be a feedback loop.
          - type: all_of
            indicators:
              - type: equals
                column: land_use_class_parcel
                value: Manufactured Home Park
              - {type: equals, column: land_use_class_source_parcel, value: rule}
          # A habitable-size structure on a manufactured-home-community
          # parcel is one of the community's homes, not an accessory
          # building. Weight 2 rests on the pair holding together: the
          # parcel must be a community AND this footprint must be big
          # enough to live in, so it outscores the Secondary residual
          # below while a shed on the same parcel does not.
          - type: all_of
            weight: 2
            indicators:
              - {type: equals, column: manufactured_home_community, value: true}
              - {type: numeric_at_least, column: habitable_size_ratio, min: 1.0}

      - class: Multi-Family
        source: multi_family
        min_score: 1
        require:
          - {type: equals, column: dwelling_multiplicity, value: multi}
          # A positively non-residential base class stands; the carry-through
          # only writes where the base is residential, Secondary, or unknown.
          # Allow-list plus is_null because the vocabulary has no negation.
          - type: any_of
            indicators:
              - type: in_set
                column: occupancy_type_prevote
                values: [Single-Family, Multi-Family, Manufactured Home, Secondary]
              - {type: is_null, column: occupancy_type_prevote}
        indicators:
          # Question 1 already decided this; the indicator simply carries that
          # decision through so the class is written.
          - {type: equals, column: dwelling_multiplicity, value: multi}

      # Single-family is the residual of the single-dwelling group: one
      # dwelling and no manufactured-home evidence is a site-built house.
      # Listed after Manufactured Home, which outscores it wherever real
      # manufactured-home evidence exists.
      - class: Single-Family
        source: single_family
        min_score: 1
        require:
          - {type: equals, column: dwelling_multiplicity, value: single}
          # An accessory structure is not a house, so the residual must not
          # claim it -- the Secondary decision below does. Expressed as an
          # allow-list because the predicate vocabulary has no negation.
          - type: in_set
            column: priority_on_parcel
            values: [primary, unknown]
          # The residual is a claim about houses, so it must not swallow a
          # positively non-residential base class (see the base_output
          # comment on this vote). A missing base still resolves: no
          # evidence contradicts the residual there.
          - type: any_of
            indicators:
              - type: in_set
                column: occupancy_type_prevote
                values: [Single-Family, Multi-Family, Manufactured Home, Secondary]
              - {type: is_null, column: occupancy_type_prevote}
        indicators:
          - {type: equals, column: dwelling_multiplicity, value: single}

      # Accessory structures -- sheds, detached garages -- on a parcel whose
      # principal building is elsewhere. Listed last as the true residual and
      # reached only when nothing above claimed the footprint: a habitable
      # home in a manufactured-home community outscores it via the paired
      # community/size indicator on the Manufactured Home decision, while a
      # shed on that same parcel does not.
      - class: Secondary
        source: secondary
        min_score: 1
        require:
          - {type: equals, column: priority_on_parcel, value: secondary}
        indicators:
          - {type: equals, column: priority_on_parcel, value: secondary}

  # Split Multi-Family into height bands. This is the same weighted vote as
  # every other classification here, not a bespoke cascade: each band
  # requires the pre-refinement class and scores a single story-count bound,
  # and earliest-listed-wins turns three overlapping bounds into a cascade.
  # A two-story building satisfies both the 3 and the 7 bound and takes
  # Low-Rise; a footprint with no story count satisfies none, so no decision
  # is eligible and preserve_base leaves it as plain Multi-Family.
  - step: resolve_by_vote
    target: occupancy_type
    base_output: occupancy_type_base
    default_source: height_band
    decisions:
      - class: Low-Rise Multi-Family
        require:
          - {type: equals, column: occupancy_type_base, value: Multi-Family}
        indicators:
          - {type: numeric_at_most, column: n_stories, max: 3}
      - class: Mid-Rise Multi-Family
        require:
          - {type: equals, column: occupancy_type_base, value: Multi-Family}
        indicators:
          - {type: numeric_at_most, column: n_stories, max: 7}
      - class: High-Rise Multi-Family
        require:
          - {type: equals, column: occupancy_type_base, value: Multi-Family}
        indicators:
          # Any recorded story count at all: the two bands above already
          # claimed everything at 7 stories or fewer, so a count reaching
          # this decision is 8+ by elimination.
          - {type: not_null, column: n_stories}

  # Recompute the manufactured home community flag using final footprint classifications.
  - step: flag_manufactured_home_communities
    min_homes: 3

  # Format: dtypes, then deterministic column order.
  - step: cast_categoricals

  # Round and cast float year_built/n_stories/n_dwellings values to nullable
  # integers. n_stories_building_nsi can be a fractional mean (the
  # attribute registry's aggregation for n_stories, applied when >1 NSI
  # point links to one footprint) and n_dwellings can carry the
  # unrounded 3.5/14.5-unit midpoints impute_n_dwellings's occupancy-class
  # fallback (_OCC_UNITS) assigns to a size range with no exact count
  # evidence; both flow into these canonical columns via reconcile_values
  # above, so they need the same integer cast year_built already got.
  - step: cast_integers
    columns: [year_built, n_stories, n_dwellings]

  # Drop transient intermediate/evidence columns and enforce canonical schema order.
  - step: order_columns
    drop:
      # Restricted-use third-party permit evidence (Shovels): may inform
      # curation but must never appear in published output, whichever
      # branch's steps produced it. Enforced by
      # test_restricted_shovels_columns_are_never_published.
      - occupancy_type_property_shovels
      - occupancy_type_property_shovels_source
      - n_permits_per_footprint
      - n_permits_per_footprint_address
      - occupancy_type_dwelling_overture
      - occupancy_type_dwelling_overture_source
      - occupancy_type_base
      - occupancy_type_prevote
      # Question 1's answer: a scoring intermediate the occupancy decisions
      # gate on, not a published attribute.
      - dwelling_multiplicity
      - dwelling_multiplicity_source
      # Vote inputs: scoring intermediates, not user-facing attributes, so
      # the shared output schema is unchanged by the move to an explicit
      # derivation layer. The occupancy diagnostics in scripts/ need these
      # columns, so comment this block out and re-curate before running
      # analyze_occupancy_stages.py or export_cheer_nsi_conflicts.py.
      - p_manufactured_home
      - aspect_ratio
      - occupancy_type_nsi_class
      - occupancy_type_fema_class
      - occupancy_keyword_class
      - group_parcel
      - land_use_class_source_parcel
      # Evidence-only: postal_city fed into `address`/`city` at harmonize
      # time (impute_postal_city); not needed once it has.
      - postal_city
      - postal_zip5
      - postal_city_acceptable
      - postal_city_unacceptable
      - postal_city_source
      # Redundant with the canonical, reconciled structure_value_per_area.
      - improvement_value_parcel_per_area
