# Recipe: canonical CHEER footprint dataset
#
# Pipeline order:
#   1. Harmonize source entities into the evidence-only US_footprint-spine-2026.
#   2. Enrich the spine with image-derived evidence.
#   3. Curate the evidence into canonical footprint attributes (below):
#      select values, derive metrics, infer groups/occupancy, merge enrichment
#      evidence, resolve occupancy against parcels, refine height, and format.

description: >-
  Canonical CHEER footprint inventory: harmonized U.S. footprint spine curated with
  image-derived evidence for hurricane modeling.

stage: curate
admin_id: US

entity:
  entity_type: footprint
  source:
    source_id: cheer
  version: 2026

entity_recipe: US_footprint-spine-2026

process_by:
  admin_level: 3

save_to:
  data_dir: share
  # Single merged geoparquet (attributes + geometry together, no `_geo`
  # sidecar / synthetic `_join_id`), since this is the terminal CHEER
  # deliverable meant for external sharing and direct GIS tool consumption
  # rather than internal joinable-table processing.
  combined: true

# Occupancy classification config: all geography-specific terminology, evidence
# columns, and thresholds live here so the curator steps stay vocabulary-neutral.
occupancy:
  class_map: occupancy-class-map.csv          # recipe-relative; pattern,match_type,occupancy_type
  residential_classes: [Single-Family, Multi-Family, Manufactured Home]
  secondary_class: Secondary
  # Weighted consensus vote across all present evidence (same residential-bucket
  # granularity as occupancy_type_conflict, so resolution can never contradict
  # the conflict summary): each entry casts its weight for its class, the
  # heaviest class wins, and ties fall to the earliest listed entry — so the
  # ordering below still sets precedence when there is no majority (NSI-first),
  # but two agreeing sources outvote a lone higher-ranked one (e.g. a lone FEMA
  # Multi-Family loses to a parcel+overture Single-Family consensus).
  evidence_mode: vote
  evidence:
    - {column: occupancy_type_building_nsi, label: nsi}   # tiebreak order = NSI-first
    - {column: group_footprint_fema, label: fema}  # FEMA building group (parcel-aggregated, NSI-style vocabulary); provisional rank, see occupancy-evidence-comparison report
    - {column: group_parcel, label: parcel}              # label used in the conflict summary
    # Half a vote: the Overture-implied class (derived below, after
    # n_dwellings_overture's vacant-parcel correction, from the corrected
    # Overture dwelling count alone) loses every 1-vs-1 against real
    # nsi/fema/parcel evidence and still fills the base class when it is the
    # only evidence — but it tips the scale for a real source it agrees with
    # (1.5 beats a lone opposing vote).
    - {column: occupancy_type_dwelling_overture, label: overture, weight: 0.5}
  columns:                                   # generic attribute -> this recipe's column
    improvement_value: improvement_value_parcel
    land_value: land_value_parcel
    n_dwellings: n_dwellings
  rules:                                     # each rule names its output class
    manufactured_home_geometry: {aspect_min: 2.5, area_max_m2: 185, class: Manufactured Home}
    manufactured_home_value: {zero_classifies: true, review_max_ratio: 0.025, class: Manufactured Home}
    multi_family_dwellings: {min_dwellings: 2, class: Multi-Family}
    single_family_dwellings: {max_dwellings: 1, class: Single-Family}
  # Park-aware Secondary: on a manufactured_home_park parcel (set by the parcel
  # curation lane, joined in by link_curated_entity), a footprint at least
  # `habitable_fraction` of the average manufactured-home area counts as a home,
  # not an accessory structure. manufactured_home_avg_m2 is the fallback
  # average when too few homes are classified to estimate it from the data.
  habitable_fraction: 0.5
  habitable_floor_m2: 25
  manufactured_home_avg_m2: 90

pipeline:
  # Link the curated parcel lane FIRST, by the globally-unique parcel_id (see
  # link_curated_entity's entity_key/ref_key docs for why). The footprint
  # spine links against pre-roll-merge ingested parcels (the parcel spine is
  # harmonized after it), so parcel attributes attach here, from the curated
  # parcels: the refined use_group_combined, the modal-NSI occupancy group,
  # the FEMA building occupancy, and the manufactured_home_park flag. These
  # feed the reconciliation, occupancy inference, and vote below.
  - step: link_curated_entity
    recipe_id: US_parcel-openplaces-2026
    columns:
      use_group_combined: use_group_combined_parcel
      group_parcel: group_parcel
      manufactured_home_park: manufactured_home_park
      group_footprint_fema: group_footprint_fema
      n_stories_footprint_fema: n_stories_footprint_fema
      land_use_class: land_use_class_parcel

  # Parcel VALUE columns take the apportioning path instead: re-use the n:m
  # footprint-parcel overlay persisted by the harmonize stage (save_link) and
  # the harmonizer's own apportionment implementation to distribute the
  # curated parcel's values across its footprints (Lochhead et al. 2026,
  # Table 4): improvement_value split by overlap-area share among
  # dwelling-linked footprints (missing on secondary structures), land_value
  # whole on the principal footprint only, year_built as the linked parcels'
  # mean.
  - step: apportion_curated_values
    recipe_id: US_parcel-openplaces-2026
    columns:
      improvement_value: improvement_value_parcel
      land_value: land_value_parcel
      year_built: year_built_parcel

  # Retain the full n:m footprint-parcel membership as a canonical column:
  # all overlapping parcels per footprint (pipe-joined, dominant first —
  # parcel_id is always the first element), collected from the link sidecar
  # persisted by the harmonize overlay (save_link: true). Sliver overlaps
  # below the overlay thresholds stay out (include_below_threshold: false);
  # they remain queryable in the sidecar itself.
  - step: collect_link_ids
    entity_type: parcel
    column: parcel_id_all

  # An Overture address point does not prove a dwelling physically exists (it
  # can be platted/assessed before, or without, construction). The parcel
  # land-use vote already weighs footprint presence, improvement value, and
  # assessor vocabulary together to flag genuinely vacant parcels
  # (US_parcel-openplaces-2026's classify_parcel_land_use) — trust that
  # multi-source decision here rather than re-deriving it from a single
  # footprint-side heuristic.
  - step: suppress_where
    column: n_dwellings_overture
    condition_column: land_use_class_parcel
    condition_value: Vacant

  # Cheap, single-source implied class from the (now vacant-corrected) Overture
  # count alone, at the same >=2-dwellings threshold as
  # occupancy.rules.multi_family_dwellings above. Feeds occupancy.evidence
  # above: a last-resort fallback in impute_occupancy_type, and a
  # conflict-summary participant in resolve_occupancy — never an override of
  # real nsi/fema/parcel evidence.
  - step: resolve_by_vote
    target: occupancy_type_dwelling_overture
    decisions:
      - class: Multi-Family
        source: overture
        min_score: 1
        indicators:
          - {type: numeric_at_least, column: n_dwellings_overture, min: 2}
      - class: Single-Family
        source: overture
        min_score: 1
        indicators:
          - {type: numeric_at_most, column: n_dwellings_overture, max: 1}

  # Reconcile: pick the canonical value from competing source columns.
  - step: reconcile_values
    priority:
      n_dwellings: [n_dwellings_overture, n_dwellings_nsi]
      year_built: [year_built_parcel, year_built_block_median_building_nsi]
      value: [improvement_value_parcel, structure_value_building_nsi]

  # n_dwellings_overture has already done its evidence work above (the
  # overture-implied-class vote, the n_dwellings reconciliation just above);
  # from here on a missing value only means "0 dwellings" for display, so
  # zero-fill and cast to a clean integer count.
  - step: fill_missing_numeric
    columns: [n_dwellings_overture]

  # Infer: derive new features from the reconciled evidence.
  - step: derive_metrics

  # Impute: fill any dwelling-unit gaps left after reconciliation.
  - step: impute_n_dwellings

  # Occupancy base class from the weighted evidence vote (NSI-first tiebreak),
  # then geometry and single-family dwelling fallbacks. Config is in the
  # `occupancy` block above.
  - step: impute_occupancy_type

  # Corrections: reviewed parcel keyword override of the base class, plus the
  # value-share review flag and the NSI-vs-parcel conflict summary. Value- and
  # dwelling-based class assignment now happens in resolve_by_vote below.
  - step: resolve_occupancy
    ruleset: parcel-occupancy-keywords.csv

  # Evidence: merge image-derived enrichment columns (canonical values win).
  # n_stories keeps its evidence name here (n_stories_brails) rather than
  # writing canonical n_stories directly: the reconcile_values step below
  # weighs it against the FEMA-height-derived and NSI-modeled story counts
  # rather than letting direct floor detection win unconditionally.
  - step: merge_enrichments
    recipes:
      - recipe_id: US_footprint_built-roof-shape-brails-2026
        columns:
          roof_shape_brails: roof_shape
      - recipe_id: US_footprint_built-n-stories-brails-2026
        columns:
          n_stories_brails: n_stories_brails

  # Reconcile canonical n_stories: direct floor detection first, then
  # measured-height-derived (FEMA), then NSI's modeled count.
  - step: reconcile_values
    priority:
      n_stories: [n_stories_brails, n_stories_footprint_fema, n_stories_building_nsi]

  # Evidence: estimate manufactured-home probability from assessor labels,
  # footprint morphology, and imagery. Emits the single p_manufactured_home
  # column for the vote below; does not assign occupancy_type itself
  # (update_occupancy: false). Heavy compute is gated to small residential
  # candidates; to turn it off entirely set `enabled: false` here or pass
  # skip_steps=['classify_manufactured_homes'] to curate.
  - step: classify_manufactured_homes
    ruleset: parcel-occupancy-keywords.csv
    update_occupancy: false

  # Reconcile occupancy by weighted vote: low structure value, a parcel
  # manufactured-home keyword, and an NSI manufactured-home use group each vote
  # Manufactured Home, so two of three outvote the single n_dwellings>=2
  # Multi-Family vote. A genuine multi-unit parcel with no manufactured-home
  # evidence still resolves to Multi-Family. `require` is a hard precondition
  # (unlike the weighted indicators below, no combination of the others can
  # substitute for it): a footprint under 20m2 cannot become Manufactured Home
  # here, however strongly the other evidence favors it — it keeps whatever
  # impute_occupancy_type/resolve_occupancy already gave it (Secondary for a
  # non-primary accessory structure).
  - step: resolve_by_vote
    target: occupancy_type
    decisions:
        # `source` is the concise reason recorded in occupancy_type_source for
        # rows this decision wins, replacing the dropped classifier-metadata
        # columns with one categorical label.
      - class: Manufactured Home
        source: manufactured_home
        min_score: 2
        require:
          - type: numeric_at_least
            column: m2
            min: 20
        indicators:
          - type: value_share_below
            value: improvement_value_parcel
            total: [improvement_value_parcel, land_value_parcel]
            max_ratio: 0.025
            include_zero: true
          - type: keyword
            column: use_group_combined_parcel
            pattern: MOBILE|MANUFACTURED|SINGLE WIDE|DOUBLE WIDE
            regex: true
          - type: equals
            column: group_parcel
            value: Manufactured Home
          # Footprint-morphology probability from classify_manufactured_homes.
          # Catches manufactured-home parks whose parcel land-use is a local
          # code the keyword list does not know (e.g. "WVC"): low value + this
          # shape vote reach min_score 2 and outweigh the n_dwellings
          # Multi-Family vote.
          - type: numeric_at_least
            column: p_manufactured_home
            min: 0.5
      - class: Multi-Family
        source: multi_family_dwellings
        min_score: 1
        indicators:
          - type: numeric_at_least
            column: n_dwellings
            min: 2

  # Refine: split Multi-Family into height bands by story count. Writes the
  # canonical occupancy_type in place and keeps the pre-refinement class in
  # occupancy_type_base (both share occupancy_type_source).
  - step: refine_occupancy_height
    # Bands count floors of living area; open ground floors (e.g. first-floor
    # stilts/pilotis, common in coastal flood zones) are not counted.
    multi_family_class: Multi-Family
    bands:
      - {max_stories: 3, class: Low-Rise Multi-Family}
      - {max_stories: 7, class: Mid-Rise Multi-Family}
      - {class: High-Rise Multi-Family}

  # Correction sidecar: recompute the manufactured-home-community flag from the
  # FINAL footprint occupancy (richer than the pre-occupancy parcel pass). A
  # future second parcel pass can fold this back into the parcel dataset.
  - step: flag_manufactured_home_communities
    min_homes: 3

  # Format: dtypes, then deterministic column order (rule-based, from the
  # naming convention + attribute-registry `sort`; no explicit list needed).
  - step: cast_categoricals

  # year_built is reconciled from float evidence (a parcel record or an NSI
  # block-median fallback) but is conceptually a whole year; round and cast
  # to a nullable integer so it displays as e.g. 1964, not 1964.0, while
  # still leaving genuinely missing values as null rather than 0.
  - step: cast_integers
    columns: [year_built]

  # group_parcel and occupancy_type_dwelling_overture (+ its _source sidecar)
  # are transient inputs to occupancy inference/conflict detection; their
  # information is carried by occupancy_type_parcel and occupancy_type_conflict
  # respectively, so drop them from the canonical output. value_per_area is
  # now kept: apportion_curated_values above splits improvement_value_parcel
  # (value's dominant input) across a multi-footprint parcel's footprints
  # before derive_metrics computes the ratio, so it is no longer a flat parcel
  # average. occupancy_type_base, p_manufactured_home, and
  # manufactured_home_park are transient inputs consumed by earlier steps
  # (refine_occupancy_height, the manufactured-home vote, and
  # impute_occupancy_type respectively) and carry no information beyond what's
  # already in occupancy_type/occupancy_type_source. n_stories_brails_source is
  # a noise sidecar merge_enrichments writes while filling the n_stories_brails
  # evidence column; the reconciled n_stories_source (from reconcile_values)
  # already carries that provenance.
  - step: order_columns
    drop:
      - group_parcel
      - occupancy_type_dwelling_overture
      - occupancy_type_dwelling_overture_source
      - occupancy_type_base
      - p_manufactured_home
      - manufactured_home_park
      - n_stories_brails_source
