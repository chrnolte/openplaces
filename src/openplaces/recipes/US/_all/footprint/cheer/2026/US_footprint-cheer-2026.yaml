# Recipe: canonical CHEER footprint dataset
#
# Pipeline order:
#   1. Harmonize source entities into the evidence-only US_footprint-spine-2026.
#   2. Enrich the spine with image-derived evidence.
#   3. Curate the evidence into canonical footprint attributes.

description: >-
  Canonical CHEER footprint inventory: harmonized U.S. footprint spine curated with
  image-derived evidence for hurricane modeling.

stage: curate
admin_id: US

entity:
  entity_type: footprint
  source:
    source_id: cheer
  version: 2026

entity_recipe: US_footprint-spine-2026

process_by:
  admin_level: 3

save_to:
  data_dir: share
  # Save as a single combined GeoParquet (attributes + geometry) without sidecars,
  # optimized for external sharing and direct GIS client consumption.
  combined: true

# Occupancy classification config: maps terminology, evidence columns, and thresholds.
occupancy:
  class_map: occupancy-class-map.csv          # recipe-relative; pattern,match_type,occupancy_type
  residential_classes: [Single-Family, Multi-Family, Manufactured Home]
  secondary_class: Secondary
  # Weighted consensus voting across sources: heaviest class wins. Ties fall to
  # the earliest listed entry (NSI-first). Multiple lower-rank agreeing sources
  # can outvote a single higher-rank opponent.
  evidence_mode: vote
  evidence:
    - {column: occupancy_type_building_nsi, label: nsi}   # tiebreak order = NSI-first
    - {column: group_footprint_fema, label: fema}  # FEMA building group
    - {column: group_parcel, label: parcel}              # label used in the conflict summary
    # Overture-implied class has a 0.5 weight: fills missing values as a fallback
    # but serves only as a tiebreaker when higher-weight sources are present.
    - {column: occupancy_type_dwelling_overture, label: overture, weight: 0.5}
  columns:                                   # generic attribute -> this recipe's column
    improvement_value: improvement_value_parcel
    land_value: land_value_parcel
    n_dwellings: n_dwellings
  rules:                                     # each rule names its output class
    manufactured_home_geometry: {aspect_min: 2.5, area_max_m2: 185, class: Manufactured Home}
    manufactured_home_value: {zero_classifies: true, review_max_ratio: 0.025, class: Manufactured Home}
    multi_family_dwellings: {min_dwellings: 2, class: Multi-Family}
    single_family_dwellings: {max_dwellings: 1, class: Single-Family}
  # Footprints on a manufactured_home_community parcel that meet the habitable
  # size threshold are classified as homes rather than accessory structures.
  habitable_fraction: 0.5
  habitable_floor_m2: 25
  manufactured_home_avg_m2: 90

pipeline:
  # Link the curated parcel attributes (occupancy, use group, and community
  # flags) by parcel_id to drive the downstream reconciliation and inference
  # steps. manufactured_home_community seeds impute_occupancy_type below
  # with the parcel lane's one-pass classification; flag_manufactured_home_
  # communities later intentionally overwrites it under the same name with
  # the richer, footprint-occupancy-based refinement (see that step's
  # docstring) -- not a name collision to fix, the final value there is
  # meant to supersede this seed.
  - step: link_curated_entity
    recipe_id: US_parcel-openplaces-2026
    columns:
      use_group_combined: use_group_combined_parcel
      group_parcel: group_parcel
      manufactured_home_community: manufactured_home_community
      group_footprint_fema: group_footprint_fema
      land_use_class: land_use_class_parcel

  # Apportion curated parcel values to footprints:
  # - improvement_value is split by footprint overlap-area share (residential splitting
  #   excludes secondary structures; non-residential splits share among all structures).
  # - land_value goes entirely to the principal footprint.
  # - imputed land and improvement values are directly mapped to canonical land_value and
  #   structure_value columns without extra reconciliation.
  - step: apportion_curated_values
    recipe_id: US_parcel-openplaces-2026
    columns:
      improvement_value: improvement_value_parcel
      land_value: land_value_parcel
      year_built: year_built_parcel
      land_value_imputed: land_value
      improvement_value_imputed: structure_value
    land_use_column: land_use_class
    non_residential_classes:
      [Commercial, Retail, Office, Industrial, Institutional, Recreation,
       Agricultural, RV Park]

  # Store the pipe-separated list of all overlapping parcels (dominant first),
  # loaded from the persisted spatial overlay link sidecar.
  - step: collect_link_ids
    entity_type: parcel
    column: parcel_id_all

  # Suppress Overture dwelling counts on parcels that have been curated
  # as vacant (trusting the multi-source parcel land-use classification).
  - step: suppress_where
    column: n_dwellings_overture
    condition_column: land_use_class_parcel
    condition_value: Vacant

  # Vote a single-source occupancy class from Overture counts (>=2 is Multi-Family,
  # <=1 is Single-Family) to serve as a low-weight fallback or tiebreaker.
  - step: resolve_by_vote
    target: occupancy_type_dwelling_overture
    decisions:
      - class: Multi-Family
        source: overture
        min_score: 1
        indicators:
          - {type: numeric_at_least, column: n_dwellings_overture, min: 2}
      - class: Single-Family
        source: overture
        min_score: 1
        indicators:
          - {type: numeric_at_most, column: n_dwellings_overture, max: 1}

  # Reconcile values from competing sources:
  # - land_value is pre-written by apportionment and needs no reconciliation.
  # - structure_value is populated by apportionment and falls back to NSI structure
  #   value only if apportionment left it missing.
  - step: reconcile_values
    priority:
      n_dwellings: [n_dwellings_overture, n_dwellings_nsi]
      year_built: [year_built_parcel, year_built_block_median_building_nsi]
      structure_value: [structure_value, structure_value_building_nsi]
      postal_code: [postal_code_dwelling_overture]

  # Address reconciliation and postal-city imputation are handled at the
  # harmonization stage on the input spine (reconcile_addresses /
  # impute_postal_city) -- a ZIP code's USPS-preferred city isn't
  # parameter-sensitive, so it's resolved once, upstream of curation.

  # Zero-fill missing overture counts.
  - step: fill_missing_numeric
    columns: [n_dwellings_overture]

  # Infer: derive new features from the reconciled evidence.
  - step: derive_metrics

  # Impute: fill any dwelling-unit gaps left after reconciliation.
  - step: impute_n_dwellings

  # Determine base occupancy class via weighted consensus voting and fallback rules.
  - step: impute_occupancy_type

  # Apply keyword overrides, value-share flags, and conflict summaries.
  - step: resolve_occupancy
    ruleset: parcel-occupancy-keywords.csv

  # Merge image-derived enrichment columns (e.g. roof shape and story count from BRAILS).
  - step: merge_enrichments
    recipes:
      - recipe_id: US_footprint_built-roof-shape-brails-2026
        columns:
          roof_shape_brails: roof_shape
      - recipe_id: US_footprint_built-n-stories-brails-2026
        columns:
          n_stories_brails: n_stories_brails

  # Reconcile canonical n_stories: direct floor detection first, then NSI's modeled count.
  - step: reconcile_values
    priority:
      n_stories: [n_stories_brails, n_stories_building_nsi]

  # Estimate manufactured home probability using morphology/assessor keywords for voting.
  - step: classify_manufactured_homes
    ruleset: parcel-occupancy-keywords.csv
    update_occupancy: false

  # Reconcile final occupancy: resolve Manufactured Home vs Multi-Family using a
  # weighted consensus vote. Requires a minimum area of 20 m2 for Manufactured Homes.
  - step: resolve_by_vote
    target: occupancy_type
    decisions:
      - class: Manufactured Home
        source: manufactured_home
        min_score: 2
        require:
          - type: numeric_at_least
            column: area_m2
            min: 20
        indicators:
          - type: value_share_below
            value: improvement_value_parcel
            total: [improvement_value_parcel, land_value_parcel]
            max_ratio: 0.025
            include_zero: true
          - type: keyword
            column: use_group_combined_parcel
            pattern: MOBILE|MANUFACTURED|SINGLE WIDE|DOUBLE WIDE
            regex: true
          - type: equals
            column: group_parcel
            value: Manufactured Home
          # Footprint-morphology shape classification probability.
          - type: numeric_at_least
            column: p_manufactured_home
            min: 0.5
      - class: Multi-Family
        source: multi_family_dwellings
        min_score: 1
        indicators:
          - type: numeric_at_least
            column: n_dwellings
            min: 2

  # Classify Multi-Family structures into Low/Mid/High-Rise bands based on story counts.
  - step: refine_occupancy_height
    multi_family_class: Multi-Family
    bands:
      - {max_stories: 3, class: Low-Rise Multi-Family}
      - {max_stories: 7, class: Mid-Rise Multi-Family}
      - {class: High-Rise Multi-Family}

  # Recompute the manufactured home community flag using final footprint classifications.
  - step: flag_manufactured_home_communities
    min_homes: 3

  # Format: dtypes, then deterministic column order.
  - step: cast_categoricals

  # Round and cast float year_built/n_stories/n_dwellings values to nullable
  # integers. n_stories_building_nsi can be a fractional mean (the
  # attribute registry's aggregation for n_stories, applied when >1 NSI
  # point links to one footprint) and n_dwellings can carry the
  # unrounded 3.5/14.5-unit midpoints impute_n_dwellings's occupancy-class
  # fallback (_OCC_UNITS) assigns to a size range with no exact count
  # evidence; both flow into these canonical columns via reconcile_values
  # above, so they need the same integer cast year_built already got.
  - step: cast_integers
    columns: [year_built, n_stories, n_dwellings]

  # Drop transient intermediate/evidence columns and enforce canonical schema order.
  - step: order_columns
    drop:
      - group_parcel
      - occupancy_type_dwelling_overture
      - occupancy_type_dwelling_overture_source
      - occupancy_type_base
      - p_manufactured_home
      - n_stories_brails_source
      # Evidence-only: postal_city fed into `address`/`city` at harmonize
      # time (impute_postal_city); not needed once it has.
      - postal_city
      - postal_zip5
      - postal_city_acceptable
      - postal_city_unacceptable
      - postal_city_source
      # Redundant with the canonical, reconciled structure_value_per_area.
      - improvement_value_parcel_per_area
