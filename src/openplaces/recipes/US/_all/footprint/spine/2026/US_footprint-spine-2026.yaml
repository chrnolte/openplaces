# Recipe: footprint spine harmonization
#
# Merges footprints from multiple sources into a single spine using a
# priority-based IoU identity test: a footprint from a lower-priority source
# is added only if it does not overlap (IoU < overlap_iou_max) with any
# footprint already in the spine.

description: >-
  Harmonized U.S. footprint spine merging OBM, Microsoft, and state footprints
  with parcel, NSI, and dwelling attributes.

stage: harmonize
admin_id: US

entity:
  entity_type: footprint
  source:
    source_id: spine
  version: 2026

process_by:
  admin_level: 3

save_to:
  data_dir: core

pipeline:

  - step: resolve_spine
    sources:
      - recipe_id: footprint-obm-2025
        label: obm
      - recipe_id: US_footprint-microsoft-v2
        label: microsoft
      - auto_discover: true
        entity_type: footprint
    thresholds:
      min_area_m2: 10.0
      overlap_iou_max: 0.02
      elongated_aspect_min: 2.5
      elongated_angle_tol: 15.0
      elongated_long_overlap_min: 0.5
      elongated_lateral_sep_ratio: 2.0
      # IoU alone is insensitive to size mismatch: a small lower-priority
      # candidate (e.g. a US-NC_footprint-ncdps sliver) clipping the edge of a
      # large already-accepted building can have a tiny IoU and still get
      # added, producing spurious duplicates next to large/likely-multi-unit
      # buildings. Give footprints at least buffer_min_area_m2 a size-scaled
      # keep-out zone instead. Starting values -- retune against an affected
      # admin (e.g. US-NC) once real duplicates are visible.
      buffer_min_area_m2: 250.0
      buffer_base_m: 2.0
      buffer_area_scale: 0.5

  - step: link_to_reference
    entity_type: parcel
    source_geometry_type: mixed_type_footprint
    join: spatial_overlay
    thresholds:
      min_fraction_of_largest: 0.1667
      area_intersection_m2_min: 10
      # Some footprint layers are systematically displaced against the parcel
      # layer, so every home on a block straddles its own parcel plus the next
      # one over (footprint-parcel-footprint-parcel chaining), inflating
      # n_parcels_per_footprint for ordinary single-family homes. Snap such a
      # footprint back to its dominant parcel when every minor overlap lands
      # on a parcel that demonstrably has its own building (a genuine shared
      # row-house footprint never does) and stays below chain_fraction_max of
      # the dominant overlap (see snap_chained_links). The full physical
      # overlap remains queryable in the sidecar via its link_chain column.
      snap_chains: true
      chain_fraction_max: 0.75
    sort_by: area_intersection_m2
    # Persist the full n:m footprint-parcel overlay as a link sidecar
    # beside the spine; reloaded instead of recomputed on later runs and
    # consumed by the curate stage's collect_link_ids (parcel_id_all).
    save_link: true

  - step: infer_spine_additions
    entity_type: parcel
    thresholds:
      n_per_group_min: 0.2
      value_per_ha_quantile: 0.05

  - step: resolve_overlaps

  - step: link_to_reference
    recipe_id: US_building-nsi-2022
    source_geometry_type: single_building_point
    join: spatial_point
    remap_id: US_building-nsi-2022_occupancy-type-remap
    thresholds:
      proximity_m: 10
      far_proximity_m: 100
      # NSI carries duplicate points for one structure: a Parcel-sourced
      # record plus an outdated ESRI (or HAZUS/NSI-2015) one at the same
      # location, usually with a wrong occupancy and an inflated value that
      # would win the value-weighted occupancy pick. Flag the low-rank twin
      # (same UBID; 'olc' keys on the ~3 m location cell instead) so the
      # merge onto the spine ignores it; the flagged rows stay on the
      # crosswalk for inspection.
      resolve_duplicates:
        key: building_id_ubid
        ignore_sources: [ESRI, HAZUS/NSI-2015]

  - step: link_to_reference
    recipe_id: dwelling-overture-2025
    source_geometry_type: single_dwelling_point
    join: spatial_point
    thresholds:
      proximity_m: 10
      far_proximity_m: 50
      aggregate_multipoint: true
      dedup_addresses: true

  - step: classify_footprint_priority
    entity_type: parcel

  # Attribution only: aggregate source columns into suffixed evidence columns.
  # Value selection, gap-filling, and occupancy inference run in curation
  # (US_footprint-cheer-2026).
  - step: reconcile_attributes
    sources:
      - entity_type: parcel
        columns:
          # parcel_id (the dominant parcel's globally-unique key, used by the
          # curate stage's link_curated_entity) is attributed automatically by
          # the harmonizer, not requested here. parcel_id_local is kept only
          # for cross-referencing the assessment roll / sales transactions,
          # not as a join key (see summarize_footprint_morphology for why).
          # Parcel VALUE columns (improvement_value, land_value, year_built,
          # n_dwellings) are deliberately NOT attributed here: this overlay
          # runs against pre-roll-merge ingested parcels (the parcel spine is
          # harmonized after this recipe), so those columns would be empty or
          # raw; the curate stage apportions them from the CURATED parcels
          # over this step's persisted link sidecar instead
          # (apportion_curated_values in US_footprint-cheer-2026).
          - parcel_id_local
          - use_group
          - use_subgroup
          - use_group_combined
          - address
      - recipe_id: dwelling-overture-2025
        columns:
          - n_dwellings
          - address_street
          - address_number
          - postal_code
          - city
      - recipe_id: US_building-nsi-2022
        collect_ids: true
        columns:
          - occupancy_type
          - group
          - structure_value
          - year_built_block_median
          - source
          - area_sqft
          - n_stories
          - n_dwellings
