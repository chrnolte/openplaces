# Recipe: footprint spine harmonization (attribute phase)
#
# The attribute half of the split footprint spine: consumes the geometry
# phase's persisted output (US_footprint-geospine-2026, declared as
# entity_recipe and restored by load_geospine) and nothing else. Until
# b3 step 7 (2026-10-26) it also projected the building spine's
# attributes onto the outlines (adopt_entity_attributes), so that its
# consumers read unchanged values; they now read the building spine
# (the parcel chain, street view) or the building curate (the footprint
# curate CHEER ships, through aggregate_from_entities), and the outline
# keeps what is its own: geometry provenance, centroid, area and
# geographic ids (plans/building-spine-consumers-and-footprint-
# projection.md). Keeps the established recipe id: the outline
# enrichments (roof shape, heights) and the footprint curate name it.
# Writes an attribute-only table (save_to: geometry: false): its
# geometry lives with the geospine and is resolved by readers through
# the entity_recipe chain, never duplicated. Rerunning this recipe
# involves no spatial computation at all.

description: >-
  Harmonized U.S. footprint spine: the footprint geospine's outlines with
  their geometry provenance and geographic ids.

stage: harmonize
admin_id: US

entity:
  entity_type: footprint
  source:
    source_id: spine
    # Not an external source: this is an openplaces pipeline product, so
    # it carries whatever its inputs carry and nothing of its own. The
    # applicable terms are derived per output by io.bundle_terms, which
    # walks the dependency graph rather than reading a licence here.
    # Left unrestricted-unknown deliberately: "depends on the inputs" is
    # not "unrestricted".
    license: "derived; inherits the terms of this recipe's inputs"
    redistribution_restricted: null
  version: 2026

entity_recipe: US_footprint-geospine-2026

process_by:
  admin_level: 3

save_to:
  data_dir: core
  geometry: false

pipeline:

  # Restore the geospine's spine, crosswalks, overlays, and prepared
  # references from its persisted output and link sidecars. Which links to
  # restore is read from the geospine recipe's own pipeline, so the two
  # YAMLs cannot drift; a missing or stale sidecar raises with instructions
  # to rerun the geospine rather than silently recomputing geometry here.
  - step: load_geospine
