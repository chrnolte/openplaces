# Recipe: footprint spine harmonization
#
# Merges multiple footprint sources using a priority-based IoU overlap threshold.

description: >-
  Harmonized U.S. footprint spine merging OBM, Microsoft, and state footprints
  with parcel, NSI, and dwelling attributes.

stage: harmonize
admin_id: US

entity:
  entity_type: footprint
  source:
    source_id: spine
  version: 2026

process_by:
  admin_level: 3

save_to:
  data_dir: core

pipeline:

  - step: resolve_spine
    sources:
      - recipe_id: footprint-obm-2025
        label: obm
      - recipe_id: US_footprint-microsoft-v2
        label: microsoft
      - auto_discover: true
        entity_type: footprint
    thresholds:
      min_area_m2: 10.0
      overlap_iou_max: 0.02
      elongated_aspect_min: 2.5
      elongated_angle_tol: 15.0
      elongated_long_overlap_min: 0.5
      elongated_lateral_sep_ratio: 2.0
      # Apply a size-scaled keep-out buffer to prevent small sliver overlaps
      # from generating duplicate footprints next to large buildings.
      buffer_min_area_m2: 250.0
      buffer_base_m: 2.0
      buffer_area_scale: 0.5

  - step: link_to_reference
    entity_type: parcel
    source_geometry_type: mixed_type_footprint
    join: spatial_overlay
    thresholds:
      min_fraction_of_largest: 0.1667
      area_intersection_m2_min: 10
      # Snap displaced footprints back to their dominant parcel to prevent chain-link inflation.
      snap_chains: true
      chain_fraction_max: 0.75
    sort_by: area_intersection_m2
    # Save the n:m footprint-parcel spatial overlay mapping as a sidecar.
    save_link: true

  # A stacked-condo building's real footprint(s) can end up dominant-linked
  # only to the units' shared common-area parcel (the min_fraction_of_largest
  # trim above drops each individual unit's much smaller overlap share),
  # leaving most of the building's own units with no real footprint credit.
  # Recognize the parcel-side cluster and consolidate before
  # infer_spine_additions runs, so it doesn't also generate a redundant
  # per-unit synthetic fallback for whichever units the trimmed real
  # footprint(s) didn't happen to dominate.
  - step: consolidate_condo_cluster_footprints
    entity_type: parcel

  - step: infer_spine_additions
    entity_type: parcel
    thresholds:
      n_per_group_min: 0.2
      value_per_ha_quantile: 0.05

  - step: resolve_overlaps

  # Compute this entity's own centroid lat/long and area (ha) once, right
  # after spine geometry is finalized (including infer_spine_additions's
  # synthetic fallback rows and resolve_overlaps's cleanup), so downstream
  # harmonize and curate steps reuse these columns instead of recomputing
  # them.
  - step: derive_geometry_attributes

  # Assign admin4_id (town/county-subdivision) and Census statistical
  # geography ids directly -- this recipe runs first in the DAG (see
  # US_parcel-spine-2026's summarize_footprint_morphology, which consumes
  # this recipe's output), so US_parcel-spine-2026 can inherit these values
  # per parcel instead of repeating the spatial join.
  - step: link_geographic_ids
    links:
      - admin_level: 4
        output_column: admin4_id
      - recipe_id: US_admin-census-2025_admin4
        output_column: census_subdivision_id
        id_column: admin4_id_admin1
      - recipe_id: US_tile-census-2025_tract
        output_column: census_tract_id
        id_column: census_tract_geoid
      - recipe_id: US_tile-census-2025_blockgroup
        output_column: census_blockgroup_id
        id_column: census_blockgroup_geoid
      - recipe_id: US_tile-census-2025_block
        output_column: census_block_id
        id_column: census_block_geoid
      - recipe_id: US_tile-census-2025_zcta5
        output_column: zcta5_id
        id_column: zcta5_geoid

  - step: link_to_reference
    recipe_id: US_building-nsi-2026
    source_geometry_type: single_building_point
    join: spatial_point
    remap_id: US_building-nsi-2026_occupancy-type-remap
    thresholds:
      proximity_m: 10
      far_proximity_m: 100
      # Resolve NSI duplicate points at the same location by ignoring low-rank duplicates.
      resolve_duplicates:
        key: building_id_ubid
        ignore_sources: [ESRI, HAZUS/NSI-2015]

  - step: link_to_reference
    recipe_id: dwelling-overture-2025
    source_geometry_type: single_dwelling_point
    join: spatial_point
    thresholds:
      proximity_m: 10
      far_proximity_m: 50
      aggregate_multipoint: true
      dedup_addresses: true

  - step: classify_footprint_priority
    entity_type: parcel

  # Attribution only: aggregate source columns into suffixed evidence columns.
  - step: reconcile_attributes
    sources:
      - entity_type: parcel
        columns:
          # Pull basic parcel metadata; skip value columns (improvement_value, land_value,
          # year_built) since they are apportioned in curation from the curated parcels.
          - parcel_id_local
          - use_group
          - use_subgroup
          - use_group_combined
          - address
      - recipe_id: dwelling-overture-2025
        columns:
          - n_dwellings
          - address_street
          - address_number
          - postal_code
          - city
      - recipe_id: US_building-nsi-2026
        collect_ids: true
        columns:
          - occupancy_type
          - group
          - structure_value
          - year_built_block_median
          - source
          - area_sqft
          - n_stories
          - n_dwellings
          # NSI assigns foundation from regional/flood-zone rules, so it is
          # a prior rather than a per-building observation -- but a stable
          # one, which a per-building classifier is not guaranteed to be
          # (see the foundation_type reconciliation in US_footprint-cheer-2026).
          - foundation_type

  # Reconcile a canonical address and extract clean street names to support curation grouping.
  - step: reconcile_addresses
    output_col: address
    sources:
      parcel:
        address_full: address_parcel
      dwelling_overture:
        address_street: address_street_dwelling_overture
        address_number: address_number_dwelling_overture
        city: city_dwelling_overture
        postal_code: postal_code_dwelling_overture
    # Complete state from the run's admin unit (level-2 code) where missing.
    complete_from_admin:
      state: 2
    # Persist the resolved components too, so impute_postal_city below can
    # fill a still-missing city and re-render `address` without re-parsing it.
    number_output_col: address_number
    unit_output_col: address_unit
    city_output_col: city

  # Coalesce ZIP-code evidence by priority: dwelling_overture's parsed ZIP,
  # then the spatially-derived zcta5_id -- a state with no Overture address
  # coverage at all (e.g. Wisconsin, South Carolina) still gets a ZIP-like
  # value from the latter.
  - step: reconcile_postal_code
    sources: [postal_code_dwelling_overture, zcta5_id]
    output_column: postal_code

  # A ZIP code has exactly one USPS-preferred city, so this is imputed here
  # rather than in curate. Reads the coalesced ZIP above for the broadest
  # coverage, and completes `city`/`address` wherever they're still missing.
  - step: impute_postal_city
    column: postal_code

  # Town-scoped address matching key, for id-free linking to sources with no
  # shared parcel id (e.g. the address-fallback pass below).
  - step: derive_address_id_local

  # Independent occupancy_type evidence from NC building permits: APN-based
  # linking first (parcel_id_local, computed by both sides at ingest time),
  # then an address fallback for footprints the APN pass missed. Deliberately
  # not yet added to US_footprint-cheer-2026's occupancy vote -- that vote/
  # kernel mechanism is mid-overhaul on a separate branch; see this recipe's
  # evidence-only mandate above.
  #
  # The address pass runs FIRST and the APN pass SECOND, not the other way
  # round: link_by_id's column-priority rule (_write_prioritized) lets
  # whichever call writes *last* win outright when its own coverage is a
  # majority of the spine (>=50%) -- both passes clear that bar here, so
  # write order, not declaration order, decides which source is "first".
  # Ending on the APN pass makes it the one that wins on rows both sources
  # matched, with the address pass's matches surviving only as a gap-fill
  # for rows the APN pass missed.
  - step: link_by_id
    recipe_id: US_property-spine-2026
    mode: aggregate
    spine_key: address_id_local
    ref_key: address_id_local
    columns:
      occupancy_type_raw: occupancy_type_property_shovels
    ref_sort_by: permit_start_date
    ref_sort_ascending: false
    count_as: n_permits_per_footprint_address

  - step: link_by_id
    recipe_id: US-NC_property-shovels-2026
    mode: aggregate
    spine_key: parcel_id_local
    ref_key: parcel_id_local
    columns:
      occupancy_type_raw: occupancy_type_property_shovels
    ref_sort_by: permit_start_date
    ref_sort_ascending: false
    count_as: n_permits_per_footprint
