# Recipe to import counties for the United States (2024)

# Administrative unit identifier of the highest administrative geography
# that the dataset covers (single files can cover a lower admin level)
admin_id: US

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: building
   # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: microsoft
    # Link to portal with metadata
    portal_url: "https://github.com/microsoft/USBuildingFootprints"
    # Link to direct download
    download_url: "https://minedbuildings.z5.web.core.windows.net/legacy/usbuildings-v2/{admin1_name}.geojson.zip"
  version: v2

# How is the download data partitioned?
download_by: admin1
# Transformations needed to obtain the data partition admin identifier
# used by the source URL (e.g. lowercase, sanitize, etc.)
download_partition_key_transform:
  admin1_name: "remove_spaces"

# Filename of compressed file (set to skip re-downloading)
compressed_file_name: "{admin1_name}.geojson.zip"

# Path to uncompressed file path (set to skip re-extracting)
uncompressed_file_name: "{admin1_name}.geojson"

# Columns to be cast to categorical (saves space)
columns_to_categorical:
  - release
  - capture_dates_range

# Function to give the GeoDataFrame an index
index_function: "openplaces.geo.vector.add_geo_id_index"

