# Recipe: CHEER building harmonization (footprint-based)
#
# Merges footprints from multiple sources into a single spine using a
# priority-based IoU identity test: a footprint from a lower-priority source
# is added only if it does not overlap (IoU < overlap_iou_max) with any
# footprint already in the spine.
#
# Pipeline steps:
#   1  resolve_spine   — OBM → Microsoft → state-specific → FEMA (IoU dedup)
#   2  link_to_reference (parcel, spatial_overlay) — footprint-parcel crosswalk
#   3  infer_spine_additions — add footprints for parcel-only coverage
#   4  resolve_overlaps
#   5  link_to_reference (NSI, spatial_point)
#   6  reconcile_attributes — aggregate parcel + NSI attributes to spine
#   7  infer_attributes — compute area, value-per-area, combined group labels

stage: harmonize
admin_id: US

entity:
  entity_type: building
  source:
    source_id: cheer
  version: 2026

# Admin level at which harmonization is run and output is saved.
process_by:
  admin_level: 3

save_to:
  data_dir: core

pipeline:
  - step: resolve_spine
    sources:
      - recipe_id: building-obm-2025
        label: obm
      - recipe_id: US_building-microsoft-v2
        label: microsoft
      - auto_discover: true   # state-specific recipes inserted here
      - recipe_id: US_building-fema-2023
        label: fema
    thresholds:
      # Maximum IoU for two footprints to be considered distinct buildings.
      overlap_iou_max: 0.02
      # Elongated-duplicate filter: catches mobile homes / trailers displaced
      # sideways rather than overlapping (low IoU despite being the same unit).
      elongated_aspect_min: 2.5      # min OBB length/width ratio
      elongated_angle_tol: 15.0      # max long-axis angle difference (degrees)
      elongated_long_overlap_min: 0.5  # min fraction of long-axis overlap
      elongated_lateral_sep_ratio: 2.0 # max lateral sep as multiple of avg width

  - step: link_to_reference
    entity_type: parcel       # auto-discover best parcel recipe for admin_id
    join: spatial_overlay
    thresholds:
      # Minimum fraction of the largest footprint-parcel overlap to keep
      # a secondary parcel link.
      min_fraction_of_largest: 0.1667
      # Minimum intersection area (m²) to keep a link.
      area_intersection_m2_min: 10

  - step: infer_spine_additions
    entity_type: parcel
    thresholds:
      # Minimum mean footprint count per purpose_group for inference.
      n_per_group_min: 0.2
      # Quantile of improvement_value_per_ha used as the lower bound.
      # Actual threshold value is computed from data at runtime and logged.
      value_per_ha_quantile: 0.05

  - step: resolve_overlaps

  - step: link_to_reference
    recipe_id: US_building-nsi-2022
    join: spatial_point
    remap_id: US_building-nsi-2022_purpose-subgroup-remap

  - step: reconcile_attributes
    sources:
      - entity_type: parcel
        columns:
          - purpose_group
          - purpose_subgroup
          - purpose_group_combined
          - improvement_value
          - land_value
          - year_built
          - address
      - recipe_id: US_building-nsi-2022
        columns:
          - purpose_subgroup
          - openplaces_group
          - structure_value
          - year_built_block_median
          - source
          - area_sqft
          - n_stories

  - step: infer_attributes
    derived:
      - area
      - value_per_sqft
      - openplaces_group_combined
