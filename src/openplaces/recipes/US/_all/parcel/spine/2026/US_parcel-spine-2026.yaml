# Recipe: harmonized U.S. parcel spine.
#
# Auto-discovers and joins local/state tax rolls onto the parcel spine geometry.
# Standalone rolls or statewide GIS tables join by standardized local keys.
# Also merges NSI building groups and footprint morphology summaries.

description: >-
  Harmonized U.S. parcel spine: statewide parcel geometry linked to local tax rolls,
  the NSI building group, and per-parcel footprint morphology.

stage: harmonize
admin_id: US

entity:
  entity_type: parcel
  source:
    source_id: spine
  version: 2026

# Keep geometry for the footprint-morphology spatial assignment and the sidecar.
spine_geom: true

process_by:
  admin_level: 3

save_to:
  data_dir: core

pipeline:
  # Resolve spine geometry and retain primary attributes directly to prevent self-join key collisions.
  - step: resolve_spine
    sources:
      - auto_discover: true
        entity_type: parcel
    keep_columns:
      - parcel_id_local
      - parcel_id_assessor
      - parcel_id_admin2
      - admin4_id
      - use_group
      - use_subgroup
      - improvement_value
      - land_value
      - year_built
      - n_dwellings
      - address
      # Carried on the geometry row, so it survives even where the
      # parcel_id_local join is degenerate (e.g. Pender's all-'0' PINs).
      # Zoning states what may be built, not what is -- kept as evidence
      # for validating whether it *predicts* occupancy, not as a vote input.
      - zoning_code
    # Which ingest source (its own geometry row, or a later null-aware
    # fallback join) supplied each of these key fields -- see the
    # resolve_spine/link_by_id docs for track_provenance.
    track_provenance:
      - use_group
      - improvement_value
      - land_value
      - year_built

  # Compute this entity's own centroid lat/long and area (ha) once, right
  # after spine geometry is finalized (including synthetic fallback rows),
  # so downstream harmonize and curate steps reuse these columns instead
  # of recomputing them.
  - step: derive_geometry_attributes

  # Link discovered assessor tables to the spine, aggregating stacked
  # condominium/unit records (a bundled additional_layers property table,
  # e.g. MassGIS's L3_ASSESS, joins here too -- join_nonnull columns like
  # address/use_group now properly concatenate every unit's value instead of
  # picking one arbitrarily; see link_by_id's aggregate-mode docs).
  - step: link_by_id
    auto_discover: true
    entity_type: parcel
    track_provenance:
      - use_group
      - improvement_value
      - land_value
      - year_built

  # Attach every auto-discovered standalone `property`-entity source (e.g. a
  # county tax roll keyed by parcel_id_local, genuinely 1:n against parcels
  # -- multiple owner/unit rows per parcel) as aggregated evidence: sum for
  # value-like columns, mean/first per the attribute registry's own
  # aggregation for everything else (see link_by_id's aggregate-mode docs).
  # Distinct from the count-only US_property-spine-2026 join below, which
  # only covers additional_layers-bundled property tables (parcel_id_admin2
  # keyed) and never carries these sources' own value columns.
  - step: link_by_id
    auto_discover: true
    entity_type: property
    mode: aggregate

  # Exact per-parcel property/unit count from the harmonized property spine
  # (the authoritative per-unit source, built directly from the same
  # additional_layers tables above without the aggregate-join's lossy
  # single-value collapse -- see US_property-spine-2026). count_as always
  # fills 0 for an unmatched parcel, not NaN; estimate_property_counts below
  # (which needs this run first) treats a 0/missing count alike.
  - step: link_by_id
    recipe_id: US_property-spine-2026
    mode: count
    spine_key: parcel_id_admin2
    ref_key: parcel_id_admin2
    count_as: n_properties_per_parcel

  # Horizontally-separated townhome pattern (observed in Carteret County,
  # NC): >=2 separately-parceled units entirely surrounded by a different,
  # real "land" parcel carrying near-zero land value. Must run before
  # estimate_property_counts below, which never overwrites a property_source
  # this step already set.
  - step: detect_shared_land_groups

  # Vertically-stacked condo buildings platted as many tiny per-unit
  # parcels (observed on the same 4400 Sample Dr complex in Carteret County
  # that motivated the footprint-side consolidation in
  # US_footprint-spine-2026 -- see consolidate_condo_cluster_footprints
  # there). A distinct signal from detect_shared_land_groups above (unit
  # parcel size, not just a near-zero-value hub): reusing that step's own
  # max_group_size would re-admit the WATER/ROW placeholder-parcel false
  # positives it excludes by design.
  - step: detect_condo_building_clusters

  # Attach per-parcel transaction diagnostics from every auto-discovered
  # transaction source scoped to this admin unit: a count, and the most
  # recent sale's price/date. Renaming price/recorded_date on the way in
  # (rather than a follow-up rename_columns) lets _write_prioritized's
  # gap-fill apply directly against last_sale_price/last_sale_date already
  # populated from a parcel source's own fields (FL, MA, NC) instead of
  # blindly overwriting them; states with no native last-sale fields (WI)
  # get these filled entirely from the transaction join. ref_sort_by sorts
  # descending by recorded_date first, since raw transaction tables are not
  # stored in chronological order and the registry's 'first' aggregation for
  # last_sale_price/last_sale_date otherwise picks an arbitrary sale.
  - step: link_by_id
    auto_discover: true
    entity_type: transaction
    mode: aggregate
    columns:
      price: last_sale_price
      recorded_date: last_sale_date
    count_as: n_transactions
    ref_sort_by: recorded_date
    ref_sort_ascending: false

  # Preserve the assessor's raw address/city under their own names before
  # reconcile_addresses's output (same bare names, by default) would
  # otherwise overwrite them in place.
  - step: rename_columns
    columns:
      address: address_original
      city: city_original

  # Direct parcel<->dwelling link: dwelling-overture-2025 points are usually
  # only linked to footprints (below), so this alone catches a dwelling
  # whose footprint was never detected. Same config as the footprint
  # spine's own dwelling link.
  - step: link_to_reference
    recipe_id: dwelling-overture-2025
    source_geometry_type: single_dwelling_point
    join: spatial_point
    thresholds:
      proximity_m: 10
      far_proximity_m: 50
      aggregate_multipoint: true
      dedup_addresses: true

  - step: reconcile_attributes
    sources:
      - recipe_id: dwelling-overture-2025
        columns: [address_street, address_number, postal_code, city]

  # Relay dwelling evidence via each parcel's primary footprint (per
  # classify_footprint_priority on the footprint spine) -- the cleaner,
  # per-building-anchored signal, prioritized above the direct link above
  # in reconcile_addresses below. A no-op wherever a state has no dwelling
  # coverage at all.
  - step: attribute_dwelling_address
    footprint_recipe_id: US_footprint-spine-2026

  # Standardize addresses and generate clean street names for down-stream imputation blocks.
  - step: reconcile_addresses
    sources:
      assessor:
        address_full: address_original
        city: city_original
        # Only some state sources map a genuine site-level postal_code (most
        # only carry the owner's mailing owner_postal_code, which is the
        # wrong field for the property's own city); this role is a no-op
        # wherever a state source didn't map one.
        postal_code: postal_code
      dwelling_footprint:
        address_street: address_street_dwelling_footprint
        address_number: address_number_dwelling_footprint
        city: city_dwelling_footprint
        postal_code: postal_code_dwelling_footprint
      dwelling_overture:
        address_street: address_street_dwelling_overture
        address_number: address_number_dwelling_overture
        city: city_dwelling_overture
        postal_code: postal_code_dwelling_overture
    complete_from_admin:
      state: 2
    # Persist the resolved components too, so impute_postal_city below can
    # fill a still-missing city and re-render `address` without re-parsing it.
    number_output_col: address_number
    unit_output_col: address_unit
    city_output_col: city

  # A ZIP code has exactly one USPS-preferred city, so this is imputed here
  # rather than in curate. Reads the raw assessor ZIP directly (not
  # reconcile_addresses's own, agreement-gated postal_code) for the broadest
  # coverage, and completes `city`/`address` wherever they're still missing.
  - step: impute_postal_city
    column: postal_code

  # Town-scoped address matching key, for linking a reference that carries no
  # parcel_id_local (e.g. MA masslandrecords transactions -- see
  # US_transaction-spine-2026, which joins back onto this key).
  - step: derive_address_id_local

  # Build the combined use_group_combined label from whatever use_group /
  # use_subgroup the link step above attached (via an auto-discovered
  # crosswalk); no-ops when neither reached the spine.
  - step: derive_use_classes

  # Attach the modal NSI building group per parcel (group_building_nsi), the
  # linked-data signal the parcel land-use classifier votes on.
  - step: link_to_reference
    recipe_id: US_building-nsi-2026
    source_geometry_type: single_building_point
    join: spatial_point
    remap_id: US_building-nsi-2026_occupancy-type-remap
    thresholds:
      proximity_m: 10
      far_proximity_m: 100
      # Same colocated-duplicate resolution as the footprint spine's NSI
      # link: ignore the outdated ESRI/HAZUS twin of a Parcel-sourced point
      # (same UBID) when merging NSI evidence onto the parcels.
      resolve_duplicates:
        key: building_id_ubid
        ignore_sources: [ESRI, HAZUS/NSI-2015]

  - step: reconcile_attributes
    sources:
      - recipe_id: US_building-nsi-2026
        # structure_value is required: reconcile picks each parcel's dominant NSI
        # group by summed structure value, so group_building_nsi needs both.
        columns:
          - group
          - structure_value

  # Link FEMA footprints to parcels and assign the dominant FEMA occupancy class by overlap area.
  - step: link_to_reference
    recipe_id: US_footprint-fema-2023
    source_geometry_type: mixed_type_footprint
    join: spatial_overlay
    thresholds:
      area_intersection_m2_min: 10

  - step: reconcile_attributes
    sources:
      - recipe_id: US_footprint-fema-2023
        columns:
          - occupancy_type
          - group
          - height

  # Attach per-parcel footprint morphology (counts of small elongated /
  # manufactured-home-shaped footprints) for the land-use classifier. Joins by
  # the globally-unique parcel_id (see the step's `on` docs for why).
  # min_overlap_m2 excludes a sliver footprint whose only detected parcel
  # candidate happens to be this one.
  # Known, deliberate-until-measured divergence: elongated_aspect_min is 2.0
  # here (a *count* of candidate shapes per parcel, where a looser net is
  # tolerable) while the footprint occupancy vote's per-building geometry
  # indicator uses 2.5 (US_footprint-cheer-2026, mh_aspect_min anchor).
  # Aligning them changes park detection, so it awaits out-of-band evidence.
  - step: summarize_footprint_morphology
    footprint_recipe_id: US_footprint-spine-2026
    small_area_max_m2: 185
    elongated_aspect_min: 2.0
    'on': parcel_id
    min_overlap_m2: 10

  # Classify property_source and, where no property-spine source exists (see
  # the count-only link_by_id step above), estimate a property/unit count
  # from evidence that already implies internal multiplicity
  # (n_dwellings/max_dwellings_per_footprint) rather than leaving a
  # multi-unit parcel looking like a single, unverified property.
  - step: estimate_property_counts
