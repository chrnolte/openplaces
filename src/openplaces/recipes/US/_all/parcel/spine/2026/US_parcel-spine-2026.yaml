# Recipe: harmonized U.S. parcel spine (attribute phase).
#
# The attribute half of the split parcel spine: consumes the geometry
# phase's persisted output (US_parcel-geospine-2026, declared as
# entity_recipe and restored by load_geospine, link tables included) and
# attaches transaction evidence, dwelling/NSI/FEMA attributions, addresses,
# and the derived land-use label. Keeps the established recipe id so
# downstream YAML (curate entity_recipe references) is untouched. Writes an
# attribute-only table (save_to: geometry: false): its geometry lives with
# the geospine and is resolved by readers through the entity_recipe chain.
# Rerunning this recipe involves no spatial computation at all
# (`--reprocess attributes`).

description: >-
  Harmonized U.S. parcel spine attaching tax rolls, transactions, NSI, FEMA,
  and address evidence to the parcel geospine.

stage: harmonize
admin_id: US

entity:
  entity_type: parcel
  source:
    source_id: spine
  version: 2026

entity_recipe: US_parcel-geospine-2026

process_by:
  admin_level: 3

save_to:
  data_dir: core
  geometry: false

pipeline:
  # Restore the geospine's spine, crosswalks, overlays, and prepared
  # references from its persisted output and link sidecars. Which links to
  # restore is read from the geospine recipe's own pipeline, so the two
  # YAMLs cannot drift; a missing or stale sidecar raises with instructions
  # to rerun the geospine rather than silently recomputing geometry here.
  - step: load_geospine

  # Attach per-parcel transaction diagnostics from every auto-discovered
  # transaction source scoped to this admin unit: a count, and the most
  # recent sale's price/date. Renaming price/recorded_date on the way in
  # (rather than a follow-up rename_columns) lets _write_prioritized's
  # gap-fill apply directly against last_sale_price/last_sale_date already
  # populated from a parcel source's own fields (FL, MA, NC) instead of
  # blindly overwriting them; states with no native last-sale fields (WI)
  # get these filled entirely from the transaction join. ref_sort_by sorts
  # descending by recorded_date first, since raw transaction tables are not
  # stored in chronological order and the registry's 'first' aggregation for
  # last_sale_price/last_sale_date otherwise picks an arbitrary sale.
  - step: link_by_id
    auto_discover: true
    entity_type: transaction
    mode: aggregate
    columns:
      price: last_sale_price
      recorded_date: last_sale_date
    count_as: n_transactions
    ref_sort_by: recorded_date
    ref_sort_ascending: false

  # Preserve the assessor's raw address/city under their own names before
  # reconcile_addresses's output (same bare names, by default) would
  # otherwise overwrite them in place.
  - step: rename_columns
    columns:
      address: address_original
      city: city_original

  - step: reconcile_attributes
    sources:
      - recipe_id: dwelling-overture-2025
        columns: [address_street, address_number, postal_code, city]

  # Relay dwelling evidence via each parcel's primary footprint (per
  # classify_footprint_priority on the footprint spine) -- the cleaner,
  # per-building-anchored signal, prioritized above the direct link above
  # in reconcile_addresses below. A no-op wherever a state has no dwelling
  # coverage at all.
  - step: attribute_dwelling_address
    footprint_recipe_id: US_footprint-spine-2026

  # Standardize addresses and generate clean street names for down-stream imputation blocks.
  - step: reconcile_addresses
    sources:
      assessor:
        address_full: address_original
        city: city_original
        # Only some state sources map a genuine site-level postal_code (most
        # only carry the owner's mailing owner_postal_code, which is the
        # wrong field for the property's own city); this role is a no-op
        # wherever a state source didn't map one.
        postal_code: postal_code
      dwelling_footprint:
        address_street: address_street_dwelling_footprint
        address_number: address_number_dwelling_footprint
        city: city_dwelling_footprint
        postal_code: postal_code_dwelling_footprint
      dwelling_overture:
        address_street: address_street_dwelling_overture
        address_number: address_number_dwelling_overture
        city: city_dwelling_overture
        postal_code: postal_code_dwelling_overture
    complete_from_admin:
      state: 2
    # Persist the resolved components too, so impute_postal_city below can
    # fill a still-missing city and re-render `address` without re-parsing it.
    number_output_col: address_number
    unit_output_col: address_unit
    city_output_col: city

  # Coalesce ZIP-code evidence by priority: the assessor's own raw ZIP
  # (most authoritative when present), then dwelling_overture's parsed ZIP,
  # then the spatially-derived zcta5_id -- a state with no assessor ZIP and
  # no Overture address coverage still gets a ZIP-like value from the
  # latter. Overwrites `postal_code` in place; impute_postal_city below
  # reads it the same way it always has.
  - step: reconcile_postal_code
    sources: [postal_code, postal_code_dwelling_overture, zcta5_id]
    output_column: postal_code

  # A ZIP code has exactly one USPS-preferred city, so this is imputed here
  # rather than in curate. Reads the coalesced ZIP above for the broadest
  # coverage, and completes `city`/`address` wherever they're still missing.
  - step: impute_postal_city
    column: postal_code

  # Town-scoped address matching key, for linking a reference that carries no
  # parcel_id_local (e.g. MA masslandrecords transactions -- see
  # US_transaction-spine-2026, which joins back onto this key).
  - step: derive_address_id_local

  # Build the combined use_group_combined label from whatever use_group /
  # use_subgroup the geospine's tax-roll joins attached (via an
  # auto-discovered crosswalk); no-ops when none reached the spine.
  #
  # Each nested pair is coalesced per row, not appended: the raw source
  # code is used only where the crosswalked vocabulary column is empty.
  # 20 recipes map a use_*_code but only 5 ship a crosswalk for it, so
  # without the fallback that code's signal is simply discarded --
  # Galveston County, TX is the measured case (no state category code at
  # all, no crosswalk for its local codes, but 98% coverage of
  # use_subgroup_code). Where the crosswalk did fire the code adds no new
  # label values, so this cannot fragment the cohort statistics keyed on
  # use_group_combined.
  #
  # building_style joins them because in some counties the occupancy
  # signal is only in the structure description, not the land use.
  # Sampson County, NC is the measured case: its use_group is a land
  # *segment* type (HOMESITE / CROPLAND / WOODLAND) that matches no
  # land-use keyword at all, while its style column identifies 6,364
  # manufactured homes the classifier would otherwise never see -- 0% of
  # parcels getting a keyword class versus 15%. Listed last so it only
  # ever extends the assessor's own use label, never displaces it.
  - step: derive_use_classes
    columns:
      - [use_group, use_group_code]
      - [use_subgroup, use_subgroup_code]
      - building_style

  # Attach the modal NSI building group per parcel (group_building_nsi), the
  # linked-data signal the parcel land-use classifier votes on -- from the
  # point crosswalk the geospine persisted.
  - step: reconcile_attributes
    sources:
      - recipe_id: US_building-nsi-2026
        # structure_value is required: reconcile picks each parcel's dominant NSI
        # group by summed structure value, so group_building_nsi needs both.
        columns:
          - group
          - structure_value

  # Assign the dominant FEMA occupancy class by overlap area, from the
  # overlay crosswalk the geospine persisted.
  - step: reconcile_attributes
    sources:
      - recipe_id: US_footprint-fema-2023
        columns:
          - occupancy_type
          - group
          - height

  # Classify property_source and, where no property-spine source exists (see
  # the count-only link_by_id in the geospine), estimate a property/unit
  # count from evidence that already implies internal multiplicity
  # (n_dwellings/max_dwellings_per_footprint) rather than leaving a
  # multi-unit parcel looking like a single, unverified property.
  - step: estimate_property_counts
