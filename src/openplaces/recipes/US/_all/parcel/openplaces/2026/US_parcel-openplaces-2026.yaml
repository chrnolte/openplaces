# Recipe: canonical openplaces parcel dataset.
#
# Curates the harmonized parcel spine into canonical parcel attributes. Its main
# job for the footprint lane is land-use classification: deriving the parcel's
# occupancy group from linked NSI (the modal-NSI inference moved here from the
# footprint recipe) and classifying land use — including manufactured-home park
# vs RV park vs standalone manufactured home, multiple-single-family vs townhome,
# commercial subtypes, and vacant — from the same evidence mix (assessor codes,
# linked-NSI group, footprint morphology, improvement value). Parcels no rule
# claims get a default class voted from group_parcel / group_building_nsi /
# group_footprint_fema (reconcile_land_use below). The footprint curation
# (US_footprint-cheer-2026) consumes this output, so parcels are curated first.

description: >-
  Canonical openplaces parcels: land-use classification (residential subtypes,
  manufactured-home park/RV park/standalone, commercial subtypes, vacant) from
  assessor codes, linked-NSI group, footprint morphology, and improvement value.

stage: curate
admin_id: US

entity:
  entity_type: parcel
  source:
    source_id: openplaces
  version: 2026

entity_recipe: US_parcel-spine-2026

process_by:
  admin_level: 3

save_to:
  data_dir: core

pipeline:
  # Impute the parcel occupancy group from the most common NSI building group per
  # assessor use code (the linked-data imputation moved here from the footprint
  # recipe; it is parcel-level work).
  - step: impute_from_group_statistic
    group_column: use_group_combined
    value_column: group_building_nsi
    statistic: mode
    output: group_parcel

  # How anomalously small (or absent) is this parcel's largest real footprint,
  # relative to other parcels sharing its assessor use code? Log-space z-score:
  # footprint area is heavy-tailed, and comparing within the assessor-use cohort
  # avoids judging a house's footprint against a big-box store's. Feeds the
  # Vacant rule below. A parcel with no real footprint at all
  # (max_footprint_area_m2 missing — see summarize_footprint_morphology, which
  # excludes synthetic parcel-shaped fallback geometries from this column)
  # scores missing here, not an extreme value; n_footprints_per_parcel below
  # (which does count a value-inferred synthetic fallback) is the indicator
  # that catches the "no real footprint" case directly.
  - step: score_relative_to_group
    group_column: use_group_combined
    value_column: max_footprint_area_m2
    output: footprint_area_log_zscore
    transform: log1p
    statistic: zscore

  # Classify parcel land use by weighted indicator voting: multiple independent
  # signals (assessor use keywords, linked-NSI group, footprint counts/shape,
  # improvement value share) each cast a weighted vote, and no single source
  # decides alone for the classes with real competing evidence (min_score 2).
  # The commercial subtypes (Retail/Office/Industrial/Institutional) are the
  # exception at min_score 1: assessor vocabulary is currently the only source
  # granular enough to tell them apart (NSI's own group vocabulary only
  # distinguishes them at the coarse Commercial/Industrial level), so requiring
  # a second corroborating source isn't achievable with today's evidence.
  # Vocabulary-neutral like resolve_by_vote — all class names, keywords, NSI
  # groups, and thresholds live in `rules`, so this step holds no land-use
  # terminology of its own. Rules are ordered most-specific-first so ties are
  # broken toward the more specific class.
  - step: classify_parcel_land_use
    output: land_use_class
    flag_column: manufactured_home_park
    flag_class: Manufactured Home Park
    score_columns:
      Vacant: land_use_vacancy_score
    review_column: land_use_review
    review_margin: 1.0
    rules:
      - class: Manufactured Home Park
        min_score: 2
        indicators:
          - {type: keyword, column: use_group_combined, pattern: 'MOBILE|MANUFACTURED|MH PARK'}
          - {type: in_set, column: group_parcel, values: [Manufactured Home]}
          - {type: count_at_least, column: n_small_elongated_footprints_per_parcel, min: 4}
          # FEMA's dominant-by-area building group on the parcel, an
          # independent 4th vote: catches a park whose assessor use code is
          # too local/generic for the keyword list and whose NSI link missed.
          - {type: in_set, column: group_footprint_fema, values: [Manufactured Home]}

      - class: RV Park
        min_score: 2
        indicators:
          - {type: keyword, column: use_group_combined, pattern: 'RV|CAMPGROUND|RECREATION|MOTORHOME'}
          - {type: in_set, column: group_parcel, values: [Entertainment/Recreation]}
          - {type: count_at_least, column: n_footprints_per_parcel, min: 4}

      # Standalone manufactured home: same keyword/NSI-group evidence as the
      # park rule, minus the >=4-small-elongated-footprints indicator, so a
      # single-unit case naturally scores below the park rule's threshold
      # without needing a separate "at most" count indicator.
      - class: Manufactured Home
        min_score: 2
        indicators:
          - {type: keyword, column: use_group_combined, pattern: 'MOBILE|MANUFACTURED'}
          - {type: in_set, column: group_parcel, values: [Manufactured Home]}
          # Same independent FEMA vote as Manufactured Home Park above.
          - {type: in_set, column: group_footprint_fema, values: [Manufactured Home]}

      # Several detached, non-manufactured-home-shaped structures on one
      # parcel. "multiple houses on one parcel" is literal assessor vocabulary
      # in at least one observed source (MassGIS use-subgroup 109).
      # min_score is 3, not 2: the last two indicators (no small-elongated
      # footprints, group_parcel is Single Family) are true for almost any
      # ordinary single-family parcel regardless of whether it actually has
      # multiple houses, so min_score:2 let this rule fire on those two alone,
      # with neither of the two indicators that actually signal "multiple"
      # (the keyword or the footprint count) required at all. Verified
      # empirically: with min_score:2, 91% of one county's parcels were
      # labeled Multiple Single-Family, including 78% of parcels with a
      # confirmed, unambiguous single footprint. min_score:3 forces at least
      # one genuine multiplicity signal to also be true.
      - class: Multiple Single-Family
        min_score: 3
        indicators:
          - {type: keyword, column: use_group_combined, pattern: 'MULTIPLE HOUSES'}
          - {type: count_at_least, column: n_primary_footprints_per_parcel, min: 2}
          - {type: numeric_at_most, column: n_small_elongated_footprints_per_parcel, max: 0}
          # any_of, not a 4th independent indicator: FEMA backs up group_parcel
          # rather than adding its own vote, so the min_score:3 tuning above
          # (guarding against the two generic indicators over-firing alone)
          # isn't weakened by a source that agrees with group_parcel almost
          # everywhere it's present.
          - type: any_of
            indicators:
              - {type: in_set, column: group_parcel, values: [Single Family]}
              - {type: in_set, column: group_footprint_fema, values: [Single Family]}

      # Explicit townhome/row-house assessor vocabulary, or a single real
      # (non-FEMA) footprint confirmed (by Overture dwelling-point evidence)
      # to either span multiple parcels or itself hold multiple dwellings.
      # min_score is 3 (all 3 indicators), not 2: a single footprint on a
      # residential parcel is the ordinary case, not evidence of a
      # shared-footprint row -- only these signals actually indicate that.
      - class: Townhome
        min_score: 3
        indicators:
          - {type: numeric_at_most, column: n_footprints_per_parcel, max: 1}
          - type: any_of
            indicators:
              - {type: numeric_at_least, column: max_parcels_per_footprint, min: 2}
              - {type: numeric_at_least, column: max_dwellings_per_footprint, min: 2}
              - {type: keyword, column: use_group_combined, pattern: 'TOWNHOUSE|TOWNHOME|ROW HOUSE|ROW-HOUSE'}
          # any_of, same reasoning as Multiple Single-Family above: FEMA
          # corroborates group_parcel without adding an independent 4th vote.
          - type: any_of
            indicators:
              # NSI group vocabulary spells it 'Multi Family' (no hyphen).
              - type: in_set
                column: group_parcel
                values: [Multi Family, Single Family]
              - type: in_set
                column: group_footprint_fema
                values: [Single Family, Multi Family]

      # No real footprint (small/absent relative to cohort, and none at all —
      # not even a value-inferred synthetic fallback), near-zero improvement
      # value share, and/or explicit assessor "vacant" vocabulary.
      - class: Vacant
        min_score: 2
        indicators:
          - {type: numeric_at_most, column: footprint_area_log_zscore, max: -1.5}
          - type: value_share_below
            value: improvement_value
            total: [improvement_value, land_value]
            max_ratio: 0.01
            include_zero: true
          - {type: keyword, column: use_group_combined, pattern: 'VACANT'}
          - {type: numeric_at_most, column: n_footprints_per_parcel, max: 0}

      - class: Retail
        min_score: 1
        indicators:
          - {type: keyword, column: use_group_combined, pattern: 'RETAIL|SHOPPING|SUPERMARKET|STORE'}

      - class: Office
        min_score: 1
        indicators:
          - {type: keyword, column: use_group_combined, pattern: 'OFFICE|BANK'}

      - class: Industrial
        min_score: 1
        indicators:
          - {type: keyword, column: use_group_combined, pattern: 'INDUSTRIAL|MANUFACTURING|WAREHOUSE'}
          - {type: in_set, column: group_parcel, values: [Heavy Industrial, Light Industrial]}

      # Draws from both the `commercial` and `exempt` top-level assessor
      # buckets: municipal/religious/charitable land sits in `exempt`, not
      # `commercial`, in the normalized use_group vocabulary.
      - class: Institutional
        min_score: 1
        indicators:
          - type: keyword
            column: use_group_combined
            pattern: 'HOSPITAL|NURSING|SCHOOL|MUNICIPAL|GOVERNMENT|RELIGIOUS|CHARITABLE|CHURCH|UNIVERSITY|COLLEGE'

      # Catch-all for commercial parcels that don't fit a specific subtype
      # above (e.g. hotel/motel, restaurant, parking garage, golf course).
      # NSI's group vocabulary has no generic 'Commercial' bucket; list the
      # commercial-flavored groups instead.
      - class: Commercial
        min_score: 1
        indicators:
          - type: in_set
            column: group_parcel
            values: [Retail, Wholesale, 'Personal & Repair Services', Bank, Hotel]
          - {type: keyword, column: use_group_combined, pattern: 'COMMERCIAL'}

  # Default land-use class for the parcels no rule above claimed: a vote
  # across the three group-vocabulary evidence columns (each casts one vote;
  # ties break to group_parcel when present, else to the earliest listed
  # column), with the winning group coarsened to the recipe's class
  # vocabulary via the class map. Also writes land_use_class_conflict
  # (grouped source-disagreement summary, e.g. "nsi/parcel: Single Family |
  # fema: Manufactured Home") and saves the most frequent conflicting
  # combinations to the reports directory.
  - step: reconcile_land_use
    output: land_use_class
    columns:
      - {column: group_parcel, label: parcel}
      - {column: group_building_nsi, label: nsi}
      - {column: group_footprint_fema, label: fema}
    tiebreaker: group_parcel
    class_map_id: US_parcel-openplaces-2026_land-use-class-map
    conflict_column: land_use_class_conflict
    report: land-use-evidence-conflicts.csv

  # FEMA USA Structures has no story count, only LiDAR-derived height; derive
  # an approximate story count so the footprint curation lane (US_footprint-
  # cheer-2026) can include it in its n_stories reconciliation.
  - step: derive_stories_from_height

  # Evidence: merge placeslab-fmv2026 fair-market-value predictions and
  # physical predictors (area-weighted crosswalk from the legacy reference
  # parcel dataset). Canonical column names drop the `_fmv2026` product
  # suffix (value suffixes like radius/year/model variant are kept, so e.g.
  # the 2500m/50m coastal-water-share variants stay distinct); land_value
  # additionally drops its `_2010` vintage suffix, landing on the plain
  # registered name.
  - step: merge_enrichments
    recipes:
      - recipe_id: US_parcel_parcel-placeslab-fmv2026
        columns:
          census_tract_id_2016_fmv2026: census_tract_id_2016
          census_blockgroup_id_2016_fmv2026: census_blockgroup_id_2016
          postal_code_2016_fmv2026: postal_code_2016
          precipitation_summer_fmv2026: precipitation_summer
          precipitation_winter_fmv2026: precipitation_winter
          temperature_mean_summer_fmv2026: temperature_mean_summer
          temperature_mean_winter_fmv2026: temperature_mean_winter
          slope_fmv2026: slope
          elevation_fmv2026: elevation
          soil_farmland_local_share_fmv2026: soil_farmland_local_share
          soil_farmland_prime_share_fmv2026: soil_farmland_prime_share
          soil_farmland_statewide_share_fmv2026: soil_farmland_statewide_share
          travel_time_to_city_fmv2026: travel_time_to_city
          land_cover_barren_share_fmv2026: land_cover_barren_share
          land_cover_forest_deciduous_share_fmv2026: land_cover_forest_deciduous_share
          land_cover_forest_evergreen_share_fmv2026: land_cover_forest_evergreen_share
          land_cover_forest_mixed_share_fmv2026: land_cover_forest_mixed_share
          land_cover_shrubland_share_fmv2026: land_cover_shrubland_share
          land_cover_grassland_share_fmv2026: land_cover_grassland_share
          land_cover_pasture_share_fmv2026: land_cover_pasture_share
          land_cover_cropland_share_fmv2026: land_cover_cropland_share
          population_gravity_index_exp_c4_fmv2026: population_gravity_index_exp_c4
          wetland_share_fmv2026: wetland_share
          coastal_water_share_2500m_fmv2026: coastal_water_share_2500m
          coastal_water_share_50m_fmv2026: coastal_water_share_50m
          # flood_depth_fluvial_100yr/flood_depth_pluvial_100yr: not yet in the
          # published placeslab predictors data (raw fld_fr_fath_f100/p100
          # columns absent as of 2026-07-26) -- restore once available.
          lake_frontage_fmv2026: lake_frontage
          river_frontage_fmv2026: river_frontage
          lake_distance_fmv2026: lake_distance
          highway_distance_fmv2026: highway_distance
          paved_road_distance_fmv2026: paved_road_distance
          building_footprint_share_1000m_fmv2026: building_footprint_share_1000m
          building_footprint_share_500m_fmv2026: building_footprint_share_500m
          building_footprint_share_5000m_fmv2026: building_footprint_share_5000m
          conservation_easement_share_fmv2026: conservation_easement_share
          protected_land_share_2010_5000m_fmv2026: protected_land_share_2010_5000m
          # conservation_transaction_share: not yet in the published placeslab
          # predictors data (raw ct_p column absent as of 2026-07-26) --
          # restore once available.
          household_income_median_block_group_2012_2016_fmv2026: household_income_median_block_group_2012_2016
          population_black_share_block_group_2012_2016_fmv2026: population_black_share_block_group_2012_2016
          population_native_american_share_block_group_2012_2016_fmv2026: population_native_american_share_block_group_2012_2016
          population_asian_share_block_group_2012_2016_fmv2026: population_asian_share_block_group_2012_2016
          population_pacific_islander_share_block_group_2012_2016_fmv2026: population_pacific_islander_share_block_group_2012_2016
          population_mixed_race_share_block_group_2012_2016_fmv2026: population_mixed_race_share_block_group_2012_2016
          population_hispanic_share_block_group_2012_2016_fmv2026: population_hispanic_share_block_group_2012_2016
          land_value_per_ha_log_region_nb_2010_fmv2026: land_value_per_ha_log_region_nb
          land_value_per_ha_log_region_nb2_2010_fmv2026: land_value_per_ha_log_region_nb2_2010
          aoa_region_nb_2010_blockgroup_fmv2026: aoa_region_nb_2010_blockgroup
          aoa_region_nb2_2010_blockgroup_fmv2026: aoa_region_nb2_2010_blockgroup

  # Calculate parcel lot area (ha) based on parcel geometry.
  - step: derive_metrics

  # Impute missing land_value for residential parcels using local per-area lot rates.
  - step: impute_land_value
    residential_classes:
      [Single-Family, Multi-Family, Manufactured Home, Manufactured Home Park,
       Multiple Single-Family, Townhome, Condominium]
    footprint_area_column: sum_footprint_area_m2
    parcel_area_column: area_ha
    peer_group_column: use_group_combined
    footprint_ratio_threshold: 0.25
    city_column: city

  - step: cast_categoricals

  - step: order_columns
