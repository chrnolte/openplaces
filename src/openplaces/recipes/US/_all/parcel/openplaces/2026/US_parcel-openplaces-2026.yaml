# Recipe: canonical openplaces parcel dataset.
#
# Curates the harmonized parcel spine into canonical attributes. Main tasks:
# 1. Derive parcel occupancy from linked NSI.
# 2. Classify land-use sub-types (e.g. parks, townhomes, vacant) using assessor,
#    NSI, and footprint shape data. Default classes are voted if no rule fires.

description: >-
  Canonical openplaces parcels: land-use classification (residential subtypes,
  manufactured-home park/RV park/standalone, commercial subtypes, vacant) from
  assessor codes, linked-NSI group, footprint morphology, and improvement value.

stage: curate
admin_id: US

entity:
  entity_type: parcel
  source:
    source_id: openplaces
    # Not an external source: this is an openplaces pipeline product, so
    # it carries whatever its inputs carry and nothing of its own. The
    # applicable terms are derived per output by io.bundle_terms, which
    # walks the dependency graph rather than reading a licence here.
    # Left unrestricted-unknown deliberately: "depends on the inputs" is
    # not "unrestricted".
    license: "derived; inherits the terms of this recipe's inputs"
    redistribution_restricted: null
  version: 2026

entity_recipe: US_parcel-spine-2026

process_by:
  admin_level: 3

save_to:
  # Canonical curated output: shipped self-contained (attributes +
  # geometry) in the share bucket, like US_footprint-cheer-2026. The
  # core bucket is the normalized store for intermediates.
  data_dir: share

pipeline:
  # These parcel_id_assessor values are non-taxable placeholders, not real
  # parcels (found empirically in Carteret County, NC): WATER (water
  # bodies), ROW (road rights-of-way). Confirmed via direct data checks
  # that these rows carry no use code and no value -- unlike e.g. STATE
  # LAND or CALO (Cape Lookout National Seashore), which are real,
  # valuable land despite unusual assessor IDs, and must not be swept in
  # here. Idiosyncratic per source -- see
  # notebooks/01_setup/04_detect_phantom_parcel_ids.ipynb to find
  # candidates in newly ingested counties before adding them. Runs first
  # so these rows never pollute impute_from_group_statistic's cohort
  # statistics.
  - step: exclude_by_value
    column: parcel_id_assessor
    values: [WATER, ROW]

  # Impute parcel occupancy group from the modal NSI building group per assessor use code.
  - step: impute_from_group_statistic
    group_column: use_group_combined
    value_column: group_building_nsi
    statistic: mode
    output: group_parcel

  # Derivation layer: compute every named precursor the vote below scores
  # against. Values only -- no thresholds live here, so each cutoff appears
  # exactly once, in the decision that applies it.
  - step: derive_indicators
    indicators:
      # One ordered keyword vocabulary replacing the twelve inline regexes
      # the rules used to each restate. Because first match wins, a parcel
      # can only ever be assigned one keyword class -- which is what stops
      # the park and standalone manufactured-home patterns (the latter a
      # strict superset of the former) from both claiming the same parcel
      # and being separated by rule order rather than by evidence.
      - output: keyword_class
        type: ruleset_class
        column: use_group_combined
        ruleset: land-use-keywords.csv

      # Log-space z-score of max footprint area within its assessor use
      # cohort. Used to identify vacant parcels.
      - output: footprint_area_log_zscore
        type: group_statistic
        group_column: use_group_combined
        value_column: max_footprint_area_m2
        transform: log1p
        statistic: zscore

      # Real, clipped footprint coverage share of the parcel's own area --
      # footprint_area_m2_in_parcel is bounded to the parcel's own area by
      # construction (unlike footprint_area_m2_dominant/_primary, which
      # credit each footprint's full unclipped area to its one dominant
      # parcel and can push a naive ratio above 1.0).
      - output: footprint_area_share
        type: ratio
        numerator: footprint_area_m2_in_parcel
        denominator: own_area

      # Known caveat: footprint_area_m2_primary is the unclipped,
      # dominant-parcel sum (see summarize_footprint_morphology), so this
      # ratio can read above 1.0 for a footprint straddling a parcel line.
      # No clipped, non-secondary-filtered equivalent exists yet -- prefer
      # footprint_area_share above for any use beyond a non-secondary
      # specific signal.
      - output: footprint_primary_area_share
        type: ratio
        numerator: footprint_area_m2_primary
        denominator: own_area

  # Vote a land-use class from the derived precursors above. Same weighted
  # vote as every other classification in the pipeline (see resolve_by_vote):
  # each decision scores its indicators, the highest eligible score wins, and
  # ties fall to the earliest listed decision.
  - step: resolve_by_vote
    target: land_use_class
    # This vote *is* the classification, not a correction to one: parcels no
    # decision claims stay null for reconcile_land_use to fill below.
    preserve_base: false
    default_source: rule
    flag_column: manufactured_home_community
    flag_class: Manufactured Home Park
    score_columns:
      Vacant: land_use_vacancy_score
    review_column: land_use_review
    review_margin: 1.0
    decisions:
      # Park scale is now a hard precondition rather than one more vote.
      # Previously a parcel with manufactured-home keyword + group evidence
      # but no park-scale footprint count tied this decision against the
      # standalone Manufactured Home below and won purely by being listed
      # first -- contradicting that decision's own "excludes multi-unit
      # parks" intent. The require makes the footprint count decide.
      - class: Manufactured Home Park
        min_score: 2
        require:
          - type: count_at_least
            column: n_small_elongated_footprints_per_parcel
            min: 4
        indicators:
          - {type: equals, column: keyword_class, value: Manufactured Home Park}
          - {type: in_set, column: group_parcel, values: [Manufactured Home]}
          # Dominant FEMA building group on the parcel.
          - {type: in_set, column: group_footprint_fema, values: [Manufactured Home]}

      - class: RV Park
        min_score: 2
        indicators:
          - {type: equals, column: keyword_class, value: RV Park}
          - {type: in_set, column: group_parcel, values: [Entertainment/Recreation]}
          - {type: count_at_least, column: n_footprints_per_parcel, min: 4}

      # Standalone Manufactured Home (excludes multi-unit parks).
      - class: Manufactured Home
        min_score: 2
        indicators:
          - {type: equals, column: keyword_class, value: Manufactured Home}
          - {type: in_set, column: group_parcel, values: [Manufactured Home]}
          - {type: in_set, column: group_footprint_fema, values: [Manufactured Home]}

      # Multiple Single-Family homes on a single parcel.
      # Requires min_score 4 to ensure genuine multiplicity evidence is present.
      - class: Multiple Single-Family
        min_score: 4
        indicators:
          - {type: equals, column: keyword_class, value: Multiple Single-Family}
          - {type: count_at_least, column: n_primary_footprints_per_parcel, min: 2}
          - {type: numeric_at_most, column: n_small_elongated_footprints_per_parcel, max: 0}
          # Backing occupancy classification.
          - type: any_of
            indicators:
              - {type: in_set, column: group_parcel, values: [Single Family]}
              - {type: in_set, column: group_footprint_fema, values: [Single Family]}
          # Minimum land value share to filter out condominiums.
          - type: value_share_at_least
            value: land_value
            total: [land_value, improvement_value]
            min_ratio: 0.01

      # Condominiums: characterized by near-zero land value and non-zero improvement value.
      - class: Condominium
        min_score: 2
        indicators:
          - type: value_share_below
            value: land_value
            total: [land_value, improvement_value]
            max_ratio: 0.01
            include_zero: true
          - type: any_of
            indicators:
              - type: in_set
                column: group_parcel
                values: [Multi Family, Single Family]
              - type: in_set
                column: group_footprint_fema
                values: [Multi Family, Single Family]
          - {type: equals, column: keyword_class, value: Condominium}

      # Townhomes: single-footprint structures genuinely spanning multiple
      # separately-parceled units (horizontally adjacent, each with its own
      # parcel) -- max_parcels_per_footprint confirms that separation
      # directly. max_dwellings_per_footprint alone (multiple confirmed
      # dwellings on ONE footprint, regardless of how many parcels it spans)
      # is deliberately excluded here: that pattern is a vertically-stacked
      # condo/multi-family building on a single parcel, not a townhome --
      # see Condominium below and the vote-based Multi-Family default.
      - class: Townhome
        min_score: 4
        indicators:
          - {type: numeric_at_most, column: n_footprints_per_parcel, max: 1}
          - type: any_of
            indicators:
              - {type: numeric_at_least, column: max_parcels_per_footprint, min: 2}
              - {type: equals, column: keyword_class, value: Townhome}
          - type: any_of
            indicators:
              - type: in_set
                column: group_parcel
                values: [Multi Family, Single Family]
              - type: in_set
                column: group_footprint_fema
                values: [Single Family, Multi Family]
          # Excludes Condominium pattern by requiring a minimal land-value share.
          - type: value_share_at_least
            value: land_value
            total: [land_value, improvement_value]
            min_ratio: 0.01

      # Vacant land based on negligible building area, low improvement value, or keyword evidence.
      - class: Vacant
        min_score: 2
        indicators:
          - {type: numeric_at_most, column: footprint_area_log_zscore, max: -1.5}
          - type: value_share_below
            value: improvement_value
            total: [improvement_value, land_value]
            max_ratio: 0.01
            include_zero: true
          - {type: equals, column: keyword_class, value: Vacant}
          - {type: numeric_at_most, column: n_footprints_per_parcel, max: 0}

      # Vacant in area, not just improvement value: this parcel's total real
      # footprint coverage is a vanishingly small share of its own area --
      # corroborated by near-zero improvement value, so a large, actively-
      # used, low-coverage parcel (e.g. a working farm with one real
      # farmhouse) does not also qualify. Threshold from Carteret County, NC:
      # ordinary Single-Family parcels' footprint-area share has a median of
      # ~12%, a 10th-percentile of ~4%, and even its most extreme 0.1
      # percentile is ~0.03% -- above this rule's 0.05% cutoff, but the real
      # protection against false positives is the improvement-value
      # indicator: every non-Vacant Carteret parcel below this cutoff already
      # has exactly $0 recorded improvement value (i.e. very likely more
      # instances of the same empty-cohort mislabeling the derive_use_classes
      # fix addresses, not genuine developed homes). Catches parcel
      # c2042c90816b4fc9f590b5a2 (a ~51,500-acre national-forest tract with a
      # handful of small structures, footprint_area_share ~7e-6), which the
      # existing Vacant rule cannot: its footprint z-score is computed
      # relative to its own near-empty assessor-use cohort, so a few small
      # structures look anomalously *large* there, not small, and it has
      # some real footprints (n_footprints_per_parcel=9), so Vacant's
      # zero-footprint indicator doesn't fire either.
      - class: Mostly Vacant
        min_score: 2
        indicators:
          - {type: numeric_at_most, column: footprint_area_share, max: 0.0005}
          - type: value_share_below
            value: improvement_value
            total: [improvement_value, land_value]
            max_ratio: 0.01
            include_zero: true

      # The coarse non-residential classes below keep min_score 1 (assessor
      # codes are the only evidence for many of them), but their evidence is
      # now disjoint: keyword_class holds exactly one value per parcel, and
      # no group_parcel value appears in more than one decision's in_set.
      # Previously a bank parcel scored Office and Commercial equally and
      # Office won by list position; the same held for Retail vs Commercial.
      # Making the evidence mutually exclusive removes the tie at its source,
      # which is safer than raising thresholds that would leave keyword-only
      # parcels unclassified.
      - class: Retail
        min_score: 1
        indicators:
          - {type: equals, column: keyword_class, value: Retail}
          - {type: in_set, column: group_parcel, values: [Retail]}

      - class: Office
        min_score: 1
        indicators:
          - {type: equals, column: keyword_class, value: Office}
          - type: in_set
            column: group_parcel
            values: [Bank, Medical Office, Professional Technical Services]

      # Wholesale sits here, not under Commercial: the land-use class map
      # already maps it to Industrial, and having both decisions claim it
      # was a straight contradiction between the rule vote and the crosswalk
      # fallback over the very same raw value.
      - class: Industrial
        min_score: 1
        indicators:
          - {type: equals, column: keyword_class, value: Industrial}
          - type: in_set
            column: group_parcel
            values:
              [Heavy Industrial, Light Industrial, Wholesale,
               Food/Drug/Chemical, Metals/Minerals processing, High Technology,
               Construction]

      # Institutional land-use (hospitals, schools, churches, etc.).
      - class: Institutional
        min_score: 1
        indicators:
          - {type: equals, column: keyword_class, value: Institutional}
          - type: in_set
            column: group_parcel
            values:
              [Hospital, Nursing Home, Institutional Dormitory, Church,
               Government Services, Emergency Response, Average School,
               College/University]

      # Catch-all for commercial parcels (e.g. hotels, garages, restaurants).
      - class: Commercial
        min_score: 1
        indicators:
          - {type: equals, column: keyword_class, value: Commercial}
          - type: in_set
            column: group_parcel
            values: ['Personal & Repair Services', Hotel, Garage]

  # Reconcile default land use via voting across assessor, NSI, and FEMA source classes.
  - step: reconcile_land_use
    output: land_use_class
    columns:
      - {column: group_parcel, label: parcel}
      - {column: group_building_nsi, label: nsi}
      - {column: group_footprint_fema, label: fema}
    tiebreaker: group_parcel
    class_map_id: US_parcel-openplaces-2026_land-use-class-map
    conflict_column: land_use_class_conflict
    report: land-use-evidence-conflicts.csv

  # Derive stories from FEMA LiDAR height.
  - step: derive_stories_from_height

  # Evidence: merge placeslab-fmv2026 fair-market-value predictions and
  # physical predictors (area-weighted crosswalk from the legacy reference
  # parcel dataset). Canonical column names drop the `_fmv2026` product
  # suffix (value suffixes like radius/year/model variant are kept, so e.g.
  # the 2500m/50m coastal-water-share variants stay distinct); land_value
  # additionally drops its `_2010` vintage suffix, landing on the plain
  # registered name.
  - step: merge_enrichments
    recipes:
      - recipe_id: US_parcel_parcel-placeslab-fmv2026
        columns:
          census_tract_id_2016_fmv2026: census_tract_id_2016
          census_blockgroup_id_2016_fmv2026: census_blockgroup_id_2016
          postal_code_2016_fmv2026: postal_code_2016
          precipitation_summer_fmv2026: precipitation_summer
          precipitation_winter_fmv2026: precipitation_winter
          temperature_mean_summer_fmv2026: temperature_mean_summer
          temperature_mean_winter_fmv2026: temperature_mean_winter
          slope_fmv2026: slope
          elevation_fmv2026: elevation
          soil_farmland_local_share_fmv2026: soil_farmland_local_share
          soil_farmland_prime_share_fmv2026: soil_farmland_prime_share
          soil_farmland_statewide_share_fmv2026: soil_farmland_statewide_share
          travel_time_to_city_fmv2026: travel_time_to_city
          land_cover_barren_share_fmv2026: land_cover_barren_share
          land_cover_forest_deciduous_share_fmv2026: land_cover_forest_deciduous_share
          land_cover_forest_evergreen_share_fmv2026: land_cover_forest_evergreen_share
          land_cover_forest_mixed_share_fmv2026: land_cover_forest_mixed_share
          land_cover_shrubland_share_fmv2026: land_cover_shrubland_share
          land_cover_grassland_share_fmv2026: land_cover_grassland_share
          land_cover_pasture_share_fmv2026: land_cover_pasture_share
          land_cover_cropland_share_fmv2026: land_cover_cropland_share
          population_gravity_index_exp_c4_fmv2026: population_gravity_index_exp_c4
          wetland_share_fmv2026: wetland_share
          coastal_water_share_2500m_fmv2026: coastal_water_share_2500m
          coastal_water_share_50m_fmv2026: coastal_water_share_50m
          lake_frontage_fmv2026: lake_frontage
          river_frontage_fmv2026: river_frontage
          lake_distance_fmv2026: lake_distance
          highway_distance_fmv2026: highway_distance
          paved_road_distance_fmv2026: paved_road_distance
          building_footprint_share_1000m_fmv2026: building_footprint_share_1000m
          building_footprint_share_500m_fmv2026: building_footprint_share_500m
          building_footprint_share_5000m_fmv2026: building_footprint_share_5000m
          conservation_easement_share_fmv2026: conservation_easement_share
          protected_land_share_2010_5000m_fmv2026: protected_land_share_2010_5000m
          household_income_median_block_group_2012_2016_fmv2026: household_income_median_block_group_2012_2016
          population_black_share_block_group_2012_2016_fmv2026: population_black_share_block_group_2012_2016
          population_native_american_share_block_group_2012_2016_fmv2026: population_native_american_share_block_group_2012_2016
          population_asian_share_block_group_2012_2016_fmv2026: population_asian_share_block_group_2012_2016
          population_pacific_islander_share_block_group_2012_2016_fmv2026: population_pacific_islander_share_block_group_2012_2016
          population_mixed_race_share_block_group_2012_2016_fmv2026: population_mixed_race_share_block_group_2012_2016
          population_hispanic_share_block_group_2012_2016_fmv2026: population_hispanic_share_block_group_2012_2016
          land_value_per_ha_log_region_nb_2010_fmv2026: land_value_per_ha_log_region_nb
          land_value_per_ha_log_region_nb2_2010_fmv2026: land_value_per_ha_log_region_nb2_2010
          aoa_region_nb_2010_blockgroup_fmv2026: aoa_region_nb_2010_blockgroup
          aoa_region_nb2_2010_blockgroup_fmv2026: aoa_region_nb2_2010_blockgroup

  # Calculate parcel lot area (ha) based on parcel geometry.
  - step: derive_metrics

  # Impute missing land_value for residential parcels using local per-area lot rates.
  - step: impute_land_value
    residential_classes:
      [Single-Family, Multi-Family, Manufactured Home, Manufactured Home Park,
       Multiple Single-Family, Townhome, Condominium]
    footprint_area_column: footprint_area_m2_in_parcel
    parcel_area_column: area_ha
    peer_group_column: use_group_combined
    footprint_ratio_threshold: 0.25
    city_column: city

  - step: cast_categoricals

  - step: order_columns
    drop:
      # Evidence-only: postal_city fed into `address`/`city` at harmonize
      # time (impute_postal_city); not needed once it has.
      - postal_city
      - postal_zip5
      - postal_city_acceptable
      - postal_city_unacceptable
      - postal_city_source
      # Redundant with the direct dwelling link's own _dwelling_overture
      # evidence (same underlying dwelling-overture-2025 source, just
      # relayed via each parcel's primary footprint instead of a direct
      # spatial link); already folded into the reconciled
      # address/address_street/city.
      - address_street_dwelling_footprint
      - address_number_dwelling_footprint
      - city_dwelling_footprint
      - postal_code_dwelling_footprint
      # Internal scoring inputs to classify_parcel_land_use, not meaningful
      # standalone -- same treatment as the footprint recipe's own
      # p_manufactured_home.
      - footprint_area_log_zscore
      # Raw absolute footprint-area building blocks: each footprint's full,
      # unclipped area credited to its one dominant parcel (see
      # summarize_footprint_morphology) -- can exceed the parcel's own area,
      # so not meaningful standalone. footprint_area_share/
      # footprint_primary_area_share (ratios) and footprint_area_m2_in_parcel
      # (the clipped, coverage-safe sum) are the user-facing columns.
      - max_footprint_area_m2
      - footprint_area_m2_dominant
      - footprint_area_m2_primary
      - land_use_vacancy_score
