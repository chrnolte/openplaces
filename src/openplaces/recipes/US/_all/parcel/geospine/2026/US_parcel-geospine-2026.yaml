# Recipe: parcel geospine (geometry phase of the parcel spine).
#
# The geometry half of what used to be one US_parcel-spine-2026 pipeline:
# spine resolution, geographic-id assignment, the shared-land / condo-cluster
# detections, the dwelling/NSI point joins, the FEMA overlay, and the
# footprint-morphology summary. Every link product is persisted as an n:m
# sidecar beside this recipe's output (save_link is default-on), for the
# attribute recipe (US_parcel-spine-2026, entity_recipe -> here) to restore
# via load_geospine.
#
# The tax-roll link_by_id joins ride HERE, not in the attribute recipe,
# because detect_shared_land_groups and detect_condo_building_clusters read
# land_value / improvement_value / use_subgroup -- in counties whose values
# arrive only via a separate roll table, the join is those columns' only
# route (the plan's rule: a cheap step stays in the geometry recipe iff a
# geometry step after it depends on its columns).
#
# Both footprint references deliberately point at US_footprint-spine-2026
# (the footprint ATTRIBUTE recipe), not the footprint geospine:
# link_geographic_ids's inherit_from groups by the parcel_id column that
# only _attribute_polygon_reference (attribute phase) writes, and
# summarize_footprint_morphology reads attribute-phase footprint columns
# (priority_on_parcel, n_dwellings_overture, parcel_id_all,
# area_intersection_m2_parcel) -- its geometry arrives through the reader's
# entity_recipe indirection. So this recipe depends on the footprint
# attribute spine, exactly as the unsplit parcel spine did.

description: >-
  Parcel geometry spine: statewide parcel geometry with tax-roll joins,
  group detections, footprint morphology, and persisted link tables.

stage: harmonize
admin_id: US

entity:
  entity_type: parcel
  source:
    source_id: geospine
    # Not an external source: this is an openplaces pipeline product, so
    # it carries whatever its inputs carry and nothing of its own. The
    # applicable terms are derived per output by io.bundle_terms, which
    # walks the dependency graph rather than reading a licence here.
    # Left unrestricted-unknown deliberately: "depends on the inputs" is
    # not "unrestricted".
    license: "derived; inherits the terms of this recipe's inputs"
    redistribution_restricted: null
  version: 2026

# Keep geometry for the footprint-morphology spatial assignment and the sidecar.
spine_geom: true

process_by:
  admin_level: 3

save_to:
  data_dir: core
  # The normalized geometry store: this output and its link sidecars are
  # what `--reprocess attributes` reuses, so even an aggressive cleanup
  # must not reclaim them (an explicit retention wins over the aggressive
  # core-bucket demotion; see io/cleanup.py).
  retention: keep

pipeline:
  # Resolve spine geometry and retain primary attributes directly to prevent self-join key collisions.
  - step: resolve_spine
    sources:
      - auto_discover: true
        entity_type: parcel
    keep_columns:
      - parcel_id_local
      - parcel_id_assessor
      - parcel_id_admin2
      - admin4_id
      - use_group
      - use_subgroup
      # The raw code columns ride along with their crosswalked twins so
      # they survive a degenerate parcel_id_local join too -- otherwise a
      # county whose land use lives only in the code (and whose id join
      # fails) loses it entirely, which is the combination the fallback
      # in the attribute recipe's derive_use_classes exists to cover.
      - use_group_code
      - use_subgroup_code
      - improvement_value
      - land_value
      - year_built
      - n_dwellings
      - address
      # Carried on the geometry row, so it survives even where the
      # parcel_id_local join is degenerate (e.g. Pender's all-'0' PINs).
      # Zoning states what may be built, not what is -- kept as evidence
      # for validating whether it *predicts* occupancy, not as a vote input.
      - zoning_code
    # Which ingest source (its own geometry row, or a later null-aware
    # fallback join) supplied each of these key fields -- see the
    # resolve_spine/link_by_id docs for track_provenance.
    track_provenance:
      - use_group
      - improvement_value
      - land_value
      - year_built

  # Compute this entity's own centroid lat/long and area (ha) once, right
  # after spine geometry is finalized (including synthetic fallback rows),
  # so downstream harmonize and curate steps reuse these columns instead
  # of recomputing them.
  - step: derive_geometry_attributes

  # Assign admin4_id (town/county-subdivision) and Census statistical
  # geography ids. The footprint spine already resolves these directly
  # (it runs first in the DAG -- see summarize_footprint_morphology below,
  # which consumes its output); inherit_from rolls those up per parcel
  # wherever every footprint on it agrees, so only parcels with no
  # footprint (or disagreeing ones) pay for a fresh spatial join here.
  - step: link_geographic_ids
    inherit_from:
      recipe_id: US_footprint-spine-2026
      group_by: parcel_id
    links:
      - admin_level: 4
        output_column: admin4_id
      - recipe_id: US_admin-census-2025_admin4
        output_column: census_subdivision_id
        id_column: admin4_id_admin1
      - recipe_id: US_tile-census-2025_tract
        output_column: census_tract_id
        id_column: census_tract_geoid
      - recipe_id: US_tile-census-2025_blockgroup
        output_column: census_blockgroup_id
        id_column: census_blockgroup_geoid
      - recipe_id: US_tile-census-2025_block
        output_column: census_block_id
        id_column: census_block_geoid
      - recipe_id: US_tile-census-2025_zcta5
        output_column: zcta5_id
        id_column: zcta5_geoid

  # Link discovered assessor tables to the spine, aggregating stacked
  # condominium/unit records (a bundled additional_layers property table,
  # e.g. MassGIS's L3_ASSESS, joins here too -- join_nonnull columns like
  # address/use_group now properly concatenate every unit's value instead of
  # picking one arbitrarily; see link_by_id's aggregate-mode docs).
  - step: link_by_id
    auto_discover: true
    entity_type: parcel
    track_provenance:
      - use_group
      - improvement_value
      - land_value
      - year_built

  # Second pass over the same discovered assessor tables, on the
  # punctuation-free key, for the rows the standardized one could not
  # reach. Two sources describing one parcel can hold the same id and
  # still never meet on `parcel_id_local`: they may punctuate it
  # differently, and compute_parcel_id_local's duplicate guard may pick a
  # different conversion on each side. NC OneMap is the measured case --
  # it carries the county PIN in `parno` while leaving `altparno` zero
  # filled, so seven eastern counties took **164,983 parcels of land-use
  # text plus 24,929 more as codes** from a layer already on disk and
  # matched 117 of them. On the punctuation-free key the same seven match
  # 189,566 of 195,245 (97.1%).
  #
  # Second, not first, and this ordering is the safety: the key is
  # deliberately lossier (it cannot tell `1-23` from `12-3`), so it only
  # ever fills what the standardized key left behind.
  - step: link_by_id
    auto_discover: true
    entity_type: parcel
    spine_key: parcel_id_alnum
    ref_key: parcel_id_alnum
    track_provenance:
      - use_group
      - improvement_value
      - land_value
      - year_built

  # Third and last pass, for the sources whose own `parcel_id_assessor` is
  # not a punctuation variant of the county PIN but a different id system
  # altogether -- NC OneMap's `altparno` is a tax account number in four
  # eastern counties, so the coalesced key above picks it and matches
  # nothing. Pairing the spine's key against the reference's PIN column
  # specifically recovers Bladen, Gates, Northampton and Pasquotank
  # (~78,000 parcels) that the previous pass left behind.
  - step: link_by_id
    auto_discover: true
    entity_type: parcel
    spine_key: parcel_id_alnum
    ref_key: parcel_id_alnum_pin
    track_provenance:
      - use_group
      - improvement_value
      - land_value
      - year_built

  # Attach every auto-discovered standalone `property`-entity source (e.g. a
  # county tax roll keyed by parcel_id_local, genuinely 1:n against parcels
  # -- multiple owner/unit rows per parcel) as aggregated evidence: sum for
  # value-like columns, mean/first per the attribute registry's own
  # aggregation for everything else (see link_by_id's aggregate-mode docs).
  # Distinct from the count-only US_property-spine-2026 join below, which
  # only covers additional_layers-bundled property tables (parcel_id_admin2
  # keyed) and never carries these sources' own value columns.
  - step: link_by_id
    auto_discover: true
    entity_type: property
    mode: aggregate

  # Exact per-parcel property/unit count from the harmonized property spine
  # (the authoritative per-unit source, built directly from the same
  # additional_layers tables above without the aggregate-join's lossy
  # single-value collapse -- see US_property-spine-2026). count_as always
  # fills 0 for an unmatched parcel, not NaN; estimate_property_counts (in
  # the attribute recipe, which needs this run first) treats a 0/missing
  # count alike.
  - step: link_by_id
    recipe_id: US_property-spine-2026
    mode: count
    spine_key: parcel_id_admin2
    ref_key: parcel_id_admin2
    count_as: n_properties_per_parcel

  # Horizontally-separated townhome pattern (observed in Carteret County,
  # NC): >=2 separately-parceled units entirely surrounded by a different,
  # real "land" parcel carrying near-zero land value. Must run before
  # estimate_property_counts (attribute recipe), which never overwrites a
  # property_source this step already set.
  - step: detect_shared_land_groups

  # Vertically-stacked condo buildings platted as many tiny per-unit
  # parcels (observed on the same 4400 Sample Dr complex in Carteret County
  # that motivated the footprint-side consolidation in
  # US_footprint-geospine-2026 -- see consolidate_condo_cluster_footprints
  # there). A distinct signal from detect_shared_land_groups above (unit
  # parcel size, not just a near-zero-value hub): reusing that step's own
  # max_group_size would re-admit the WATER/ROW placeholder-parcel false
  # positives it excludes by design.
  - step: detect_condo_building_clusters

  # Direct parcel<->dwelling link: dwelling-overture-2025 points are usually
  # only linked to footprints, so this alone catches a dwelling whose
  # footprint was never detected. Same config as the footprint geospine's
  # own dwelling link. The three spatial links below keep their relative
  # order (points before the FEMA overlay): _link_spatial_point's
  # parcel-constrained Pass 3 activates only once an overlay is in state,
  # and the unsplit pipeline always ran these point joins overlay-free.
  - step: link_to_reference
    recipe_id: dwelling-overture-2025
    source_geometry_type: single_dwelling_point
    join: spatial_point
    thresholds:
      proximity_m: 10
      far_proximity_m: 50
      aggregate_multipoint: true
      dedup_addresses: true

  # The modal NSI building group per parcel is attached in the attribute
  # recipe; this computes and persists the point crosswalk it reads.
  - step: link_to_reference
    recipe_id: US_building-nsi-2026
    source_geometry_type: single_building_point
    join: spatial_point
    remap_id: US_building-nsi-2026_occupancy-type-remap
    thresholds:
      proximity_m: 10
      far_proximity_m: 100
      # Same colocated-duplicate resolution as the footprint geospine's NSI
      # link: ignore the outdated ESRI/HAZUS twin of a Parcel-sourced point
      # (same UBID) when merging NSI evidence onto the parcels.
      resolve_duplicates:
        key: building_id_ubid
        ignore_sources: [ESRI, HAZUS/NSI-2015]

  # Link FEMA footprints to parcels; the dominant FEMA occupancy class by
  # overlap area is assigned in the attribute recipe from this crosswalk.
  - step: link_to_reference
    recipe_id: US_footprint-fema-2023
    source_geometry_type: mixed_type_footprint
    join: spatial_overlay
    thresholds:
      area_intersection_m2_min: 10

  # Attach per-parcel footprint morphology (counts of small elongated /
  # manufactured-home-shaped footprints) for the land-use classifier. Joins by
  # the globally-unique parcel_id (see the step's `on` docs for why).
  # min_overlap_m2 excludes a sliver footprint whose only detected parcel
  # candidate happens to be this one.
  # Known, deliberate-until-measured divergence: elongated_aspect_min is 2.0
  # here (a *count* of candidate shapes per parcel, where a looser net is
  # tolerable) while the footprint occupancy vote's per-building geometry
  # indicator uses 2.5 (US_footprint-openplaces-2026, mh_aspect_min anchor).
  # Aligning them changes park detection, so it awaits out-of-band evidence.
  - step: summarize_footprint_morphology
    footprint_recipe_id: US_footprint-spine-2026
    small_area_max_m2: 185
    elongated_aspect_min: 2.0
    'on': parcel_id
    min_overlap_m2: 10
