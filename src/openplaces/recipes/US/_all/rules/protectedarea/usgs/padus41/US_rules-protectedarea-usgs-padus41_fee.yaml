# Recipe: PAD-US 4.1 Fee feature class (land owned outright)
#
# Source: USGS Gap Analysis Project, Protected Areas Database of the
# United States (PAD-US) 4.1, national File Geodatabase
# (PADUS4_1Geodatabase.zip, 1.52 GB; ScienceBase item
# 652d4fc5d34e44db0e2ee45e, published 2025-03-31, DOI
# 10.5066/P96WBCHS). Cite as: U.S. Geological Survey (USGS) Gap
# Analysis Project (GAP), 2024, Protected Areas Database of the United
# States (PAD-US) 4.1: U.S. Geological Survey data release,
# https://doi.org/10.5066/P96WBCHS.
#
# Terms, re-read 2026-10-24: the ScienceBase item's rights field reads
# "Public Domain", and the FGDC metadata's access constraint "These
# data are in the public domain." The use constraint is a liability
# and fitness disclaimer (not for regulatory boundaries or mapping
# below about 1:24,000), not a restriction on use or sharing.
#
# The national geodatabase, not a web service: one file, every state.
# Its Fee and Easement feature classes are ingested as two datasets
# (this recipe and ..._easement) so that land owned outright and land
# under an easement stay distinct; the Combined layer (656,986
# features) mixes them with proclamation, designation and marine
# boundaries that are not ownership.
#
# Measured 2026-10-24 on the 4.1 release: 296,456 Fee polygons;
# Category Fee 290,985, Other 5,471. Own_Type LOC 167,174, STAT
# 63,599, NGO 26,702, PVT 16,369, DIST 12,641, FED 4,452, UNK 4,007,
# JNT 1,421, TERR 50, TRIB 41. GAP_Sts 4: 173,199, 3: 72,900, 2:
# 43,477, 1: 6,880. Pub_Access OA 222,633, UK 38,261, RA 21,231, XA
# 14,331. Date_Est is text: four characters on 71,609, empty or one
# space on 224,847; 224,849 are missing after conversion to a number.
#
# Codes, not labels (gdb_domain_labels: false): the geodatabase's
# domains would turn FED into "Federal" and GAP 1 into a sentence, and
# the easement holder type has no domain at all, so the two layers
# would disagree. The codes are those of the PAD-US Data Manual.
#
# The index is the row's position in the layer (0 to 296,455), which
# is stable within this release only: PAD-US carries no unique id
# (Source_PAID is the contributing source's id, not unique) and the
# OBJECTID is not read. Never join across releases on it.
#
# Unmapped on purpose: Own_Name, Mang_Name (agency codes, finer than
# the types kept), Loc_Own, Loc_Mang, Unit_Nm, Loc_Nm, Loc_Ds (free
# text names, which on private land can name a person), Agg_Src,
# GIS_Src, Access_Src, GAPCdSrc and the other *Src / *Dt provenance
# fields, IUCN_Cat, WDPA_Cd, GIS_Acres (the overlay measures area
# itself), Comments, State_Nm.

description: >-
  USGS PAD-US 4.1 Fee polygons (protected and public land owned
  outright): category, owner and manager type, designation, GAP status,
  public access, year established.

admin_id: US

dataset:
  theme: rules-protectedarea
  source:
    source_id: usgs
    license: >-
      Public domain (ScienceBase item rights: "Public Domain"; FGDC
      metadata: "These data are in the public domain."). Citation
      requested via DOI 10.5066/P96WBCHS; no warranty.
    terms_url: "https://www.sciencebase.gov/catalog/item/652d4fc5d34e44db0e2ee45e"
    redistribution_restricted: false
    resale_restricted: false
    portal_url: "https://www.usgs.gov/programs/gap-analysis-project/science/pad-us-data-download"
    download_url: "https://www.sciencebase.gov/catalog/file/get/652d4fc5d34e44db0e2ee45e?name=PADUS4_1Geodatabase.zip"
  version: padus41

compressed_file_name: "PADUS4_1Geodatabase.zip"
uncompressed_file_name: "PADUS4_1Geodatabase.gdb"
layer: PADUS4_1Fee
gdb_domain_labels: false

columns:
  protected_area_category: Category
  protected_area_owner_type: Own_Type
  protected_area_manager_type: Mang_Type
  protected_area_designation_type: Des_Tp
  protected_area_gap_status: GAP_Sts
  protected_area_public_access: Pub_Access
  protected_area_year_established: Date_Est
  source_date: Src_Date

# Date_Est is text: four digits, or empty or one space when unknown.
transformations:
  - type: unary
    operation: to_numeric
    input: protected_area_year_established
    output: protected_area_year_established

force_2d: true

save_to:
  data_dir: core
  # A dataset's output path follows the dataset, not the recipe id;
  # the filename keeps the Fee and Easement layers in two files.
  filename: fee
