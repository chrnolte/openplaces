# Recipe to import block groups for the United States (2025)
description: >-
  U.S. census block group boundaries (2025), ingested as tiles.

admin_id: US

# Entity: tiles from the 2025 US census
entity:
  entity_type: tile
  source:
    source_id: census
    # Work of the U.S. Government, so uncopyrightable in the US by
    # statute (17 U.S.C. 105) rather than by a licence anyone grants.
    # Checked 2026-08-20: the agency publishes no terms page because it
    # does not need one.
    license: "public-domain (US Government work, 17 U.S.C. 105)"
    redistribution_restricted: false
    terms_url: null
    portal_url: "https://www2.census.gov/geo/tiger/TIGER2025/"
    download_url: "https://www2.census.gov/geo/tiger/TIGER2025/BG/tl_2025_{admin2_id_admin1}_bg.zip"
  version: 2025

# Download is partitioned by state
download_by:
  admin_level: 2
  admin_recipe_id: "US_admin-census-2021_admin2"

# Compressed file name to read
compressed_file_name: "tl_2025_{admin2_id_admin1}_bg.zip"

# Column mapping from TIGER BG shapefiles. census_geo_id (GEOIDFQ) is
# globally unique across geography levels and used as the index;
# census_blockgroup_geoid (GEOID) is the bare 12-digit block-group code
# linkage steps (e.g. link_geographic_ids) read as the output value.
columns:
  census_geo_id: GEOIDFQ
  census_blockgroup_geoid: GEOID

# Extract county FIPS code (5-digit admin3_id used by country)
transformations:
  - output: admin3_id_admin1
    type: string
    operation: substring
    input: census_geo_id
    args:
      start: 9
      end: 14 

# Translate FIPS code to `admin3_id`
admin_id_crosswalk:
  admin_level: 3
  admin_id_column: admin3_id_admin1
  # See the note in US_tile-census-2025_tract.yaml: 2025 TIGER GEOIDs carry
  # Connecticut's planning-region codes, so the 2021 admin recipe matches
  # nothing there and drops the state entirely.
  admin_recipe_id: "US_admin-census-2025_admin3"

# Use census GEOID as index
set_index: census_geo_id

# Save to blockgroup file and aggregate to country
save_to:
  data_dir: cache
  filename: blockgroup
  admin_level: 1