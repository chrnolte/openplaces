# Recipe to import tracts for the United States (2025)
description: >-
  U.S. census tract boundaries (2025), ingested as tiles.

admin_id: US

# Entity: tiles from the 2025 US census
entity:
  entity_type: tile
  source:
    source_id: census
    # Work of the U.S. Government, so uncopyrightable in the US by
    # statute (17 U.S.C. 105) rather than by a licence anyone grants.
    # Checked 2026-08-20: the agency publishes no terms page because it
    # does not need one.
    license: "public-domain (US Government work, 17 U.S.C. 105)"
    redistribution_restricted: false
    terms_url: null
    portal_url: "https://www2.census.gov/geo/tiger/TIGER2025/"
    download_url: "https://www2.census.gov/geo/tiger/TIGER2025/TRACT/tl_2025_{admin2_id_admin1}_tract.zip"
  version: 2025

# Download is partitioned by state
download_by:
  admin_level: 2
  admin_recipe_id: "US_admin-census-2025_admin2"

# Compressed file name to read
compressed_file_name: "tl_2025_{admin2_id_admin1}_tract.zip"

# Column mapping from TIGER tract shapefiles. census_geo_id (GEOIDFQ) is
# globally unique across geography levels and used as the index;
# census_tract_geoid (GEOID) is the bare 11-digit tract code linkage steps
# (e.g. link_geographic_ids) read as the output value.
columns:
  census_geo_id: GEOIDFQ
  census_tract_geoid: GEOID

# Extract the state FIPS code, as the block recipe does. A tract's
# county code matches no admin3 id in New England, where level 3 is the
# town: crosswalked by county, every tract of CT, MA, ME, NH, RI and VT
# was dropped at ingest, and no building there had a tract id.
# Measured 2026-11-04 on US-MA: 0 tract rows in the national file.
# Consumers read the tracts by bounding box at the national scope
# (harmonizer spine._resolve_geographic_reference), never by town.
transformations:
  - output: admin2_id_admin1
    type: string
    operation: substring
    input: census_geo_id
    args:
      start: 9
      end: 11

# Translate FIPS code to `admin2_id`.
admin_id_crosswalk:
  admin_level: 2
  admin_id_column: admin2_id_admin1
  # The nationally-saved census layer, not the harmonized reference.
  # This job is national (save level 1), and admin-openplaces-2026 saves
  # one file per state, so reading it here turns a single input into 52
  # and drags every state's harmonize job into a one-county run. Admin
  # unit-scoped recipes do use the harmonized reference; a national
  # consumer needs a nationally-saved layer.
  admin_recipe_id: "US_admin-census-2025_admin2"

# Use census GEOID as index
set_index: census_geo_id

# Save to tract file and aggregate to country
save_to:
  data_dir: cache
  filename: tract
  admin_level: 1