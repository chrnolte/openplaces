# Recipe to import block groups for the United States (2025)

admin_id: US

entity:
  entity_type: admin
  source:
    source_id: census
    portal_url: "https://www2.census.gov/geo/tiger/TIGER2025/"
    download_url: "https://www2.census.gov/geo/tiger/TIGER2025/BG/tl_2025_{admin2_id_admin1}_bg.zip"
  version: 2025

# Each file is state-specific
compressed_file_name: "tl_2025_{admin2_id_admin1}_bg.zip"

download_by:
  admin_level: 2
  admin_recipe_id: "US_admin-census-2021_admin2"

# Column mapping from TIGER BG shapefiles
columns:
  census_geo_id: GEOIDFQ

transformations:

  - output: admin3_id
    type: string
    operation: substring
    input: census_geo_id
    args:
      start: 0
      end: 5

  - output: admin4_id
    type: string
    operation: substring
    input: census_geo_id
    args:
      start: 0
      end: 11

# Generate hierarchical OpenPlaces IDs
create_index:
  function: "openplaces.io.admin.generate_admin_ids"
  args:
    new_admin_id_col: admin5_id
    parent_admin_id_col: admin4_id
    name_col: admin4_id

save_to:
  data_dir: cache
  filename: admin5