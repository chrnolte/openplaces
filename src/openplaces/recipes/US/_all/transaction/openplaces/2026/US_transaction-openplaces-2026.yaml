# Recipe: canonical openplaces transaction dataset, one row per sale.
#
# Curates the harmonized transaction spine into what every transaction
# consumer needs and none should rebuild: the recorded document behind
# each row, one row per document with the parcels it covered counted and
# their areas summed, and graded sale-quality values a consumer
# thresholds for itself. The hub grades; the consumer sets the cutoff.
# Nothing here removes a sale: a hedonic panel, a vacant-land model and
# a price index each want a different sample, and a row filtered here
# is a row none of them can reconsider.
#
# A filtered product for one use (the Florida single-family panel,
# `US-FL_transaction-openplaces-2026`) lived beside this recipe until
# 2026-09-22 and was retired by the maintainer: it wrote the same output
# path as this one, so whichever ran last silently decided what Florida
# shipped. Its temporal join is here now, guarded by `require_panel`.
# What went with it was a *sample*, not evidence: sales kept only where
# a `verified_single_family` vote passed, one dwelling, no multi-parcel
# deed, 2016 onward. Rebuild that by filtering this recipe's output, or
# see git history for the vote. Bringing the vote back here would mean
# adding a third temporal pass (`direction: exact, offset_years: 1,
# prefix: next_year_`) and keeping it as a graded column, never a
# filter, for the reason stated above.

description: >-
  Recorded sales as one row per deed, with the parcels each covered
  counted and graded sale-quality values for a consumer to threshold.

stage: curate
admin_id: US

entity:
  entity_type: transaction
  source:
    source_id: openplaces
    license: "derived; inherits the terms of this recipe's inputs"
    redistribution_restricted: null
  version: 2026

entity_recipe: US_transaction-spine-2026

process_by:
  admin_level: 3

save_to:
  data_dir: share

pipeline:
  # A recorder states a date, a roll a year and month (or a month-only
  # date); every step below compares sales by year and month.
  - step: derive_sale_period

  # A source published as overlapping rolling windows lists the same
  # recorded document twice. Same key, same row: keep one. The record
  # kind is part of the key so that a deed and the assessor's last-sale
  # record of it are never taken for one row listed twice; columns a
  # county lacks read as missing.
  - step: dedup_transactions
    key_columns:
      - sale_record_kind
      - parcel_id_local
      - parcel_id_assessor
      - sale_year
      - sale_month
      - price
      - sale_book
      - sale_page
      - sale_clerk_instrument
      # The North Carolina recorders' spelling; without it two deeds
      # on one parcel in one month at price 0 would read as one.
      - book
      - page
      # Wisconsin's RETR names its document; MassGIS's last sales sit
      # on property rows with no parcel key of their own.
      - instrument_number
      - property_id_assessor

  # The deed behind each row, spelled per source: Florida records a
  # clerk instrument number for newer sales and an official-record book
  # and page for older ones. Another source adds its own candidate here:
  # the North Carolina county recorders map `book` and `page`. An
  # assessor last-sale row citing a deed's book and page gets a scoped
  # identifier, so it is never counted or aggregated as a second parcel
  # of that deed, while the last-sale rows of one multi-parcel deed
  # still share theirs.
  - step: derive_document_id
    candidates:
      - [sale_clerk_instrument]
      - [instrument_number]
      - [sale_book, sale_page]
      - [book, page]
    scope_column: sale_record_kind
    unscoped_value: deed

  # How many parcels the deed covered, on every row, so the count
  # survives the aggregation below and a consumer can tell an
  # aggregated row from a single-parcel one. On Lake County FL this
  # agrees with the source's own multi-parcel flag on 80,488 rows and
  # finds 32,972 more rows the flag misses.
  - step: count_parcels_per_document
    parcel_column: parcel_id_assessor

  # Graded values, never booleans. The arm's-length confidence carries
  # only the resolution the source does: Florida's 34 labels are two
  # "Qualified arm's length" (differing in how qualification was
  # established, which is provenance, not confidence), about 24 kinds
  # of "Disqualified" (kinds, not degrees), and a small middle. So the
  # scale is 0, 0.7 and 1, and a further level would have to name the
  # label that justifies it. "Pending" and "Removed" are absence of
  # evidence, not weak evidence: they are left missing, never a low
  # number that survives a > 0 filter and fails a >= 0.5 one. This is
  # one source's own qualification, one component of a consumer's
  # arm's-length rule, and is not that rule.
  - step: derive_indicators
    indicators:
      - output: sale_arms_length_confidence
        type: value_map
        column: sale_qualification_code
        mapping:
          # Florida DOR SDF (US-FL_transaction-fldor-2026)
          "Qualified arm's length - deed/instrument examination": 1.0
          "Qualified arm's length - documented evidence": 1.0
          "Qualified but excluded - physical/legal characteristics changed after transfer": 0.7
          "Qualified but excluded - legal characteristics changed after transfer": 0.7
          "Qualified - multiple parcels with multiple parcel IDs": 0.7
          "Qualified - single parcel crossing county lines": 0.7
          "Disqualified - transfer to/from financial institution or in lieu of foreclosure": 0.0
          "Disqualified - corrective/quit claim/tax deed or minimal stamps": 0.0
          "Disqualified - cemetery lots or parcels": 0.0
          "Disqualified - reservation of occupancy over 90 days (life estate)": 0.0
          "Disqualified - conveys less than 100% undivided interest": 0.0
          "Disqualified - transfer to/from religious/charitable/benevolent entity": 0.0
          "Disqualified - transfer to/from government agency": 0.0
          "Disqualified - transfer to/from bankruptcy trustee/administrator/executor/guardian/receiver": 0.0
          "Disqualified - transfer to/from utility company": 0.0
          "Disqualified - contract or agreement for deed": 0.0
          "Disqualified - transfer between relatives or corporate affiliates": 0.0
          "Disqualified - trade or exchange of land": 0.0
          "Disqualified - abnormal time between contract and sale date": 0.0
          "Disqualified - incomplete or unbuilt common property": 0.0
          "Disqualified - satisfied payment in full of prior property contract": 0.0
          "Disqualified - atypical amounts of personal property": 0.0
          "Disqualified - atypical costs of sale": 0.0
          "Disqualified - atypical market exposure or motivation/knowledge of participants": 0.0
          "Disqualified - forced transfer or under duress": 0.0
          "Disqualified - consideration differs from documentary stamps": 0.0
          "Disqualified - significantly influenced by non-market financing or lease assumption": 0.0
          "Disqualified - other (duplicate recordings, rehabbed sales; requires DOR approval)": 0.0
          "Disqualified - mortgage fraud per law enforcement notification": 0.0
          "Disqualified - allocated price as part of a package or bulk transaction": 0.0
          # The same state codes, undecoded. Assessor last-sale rows
          # read from the statewide parcel layer
          # (US-FL_parcel-floridagio-2026) carry the two-digit code, not
          # its label: measured 2026-09-21, none of `US-FL-MI`'s 1,401
          # last-sale rows was graded while 99.7% of its deeds were.
          # Generated from the labels above through the state's code
          # table, so the two spellings cannot disagree. That recipe
          # now ships the label table and decodes at its next ingest;
          # these keys can go once every county has been re-ingested.
          "01": 1.0
          "02": 1.0
          "03": 0.7
          "04": 0.7
          "05": 0.7
          "06": 0.7
          "11": 0.0
          "12": 0.0
          "13": 0.0
          "14": 0.0
          "16": 0.0
          "17": 0.0
          "18": 0.0
          "19": 0.0
          "20": 0.0
          "21": 0.0
          "30": 0.0
          "31": 0.0
          "32": 0.0
          "33": 0.0
          "34": 0.0
          "35": 0.0
          "36": 0.0
          "37": 0.0
          "38": 0.0
          "39": 0.0
          "40": 0.0
          "41": 0.0
          "42": 0.0
          "43": 0.0
      # The two 0.7 groups are different problems a consumer treats
      # differently: a parcel that changed between assessment and sale
      # is a target problem, a deed covering several parcels an area
      # problem the aggregation below solves. The group carries that
      # distinction the scale cannot; pending and removed are named
      # here so a consumer can see why the confidence is missing.
      - output: sale_qualification_group
        type: value_map
        column: sale_qualification_code
        mapping:
          "Qualified arm's length - deed/instrument examination": qualified
          "Qualified arm's length - documented evidence": qualified
          "Qualified but excluded - physical/legal characteristics changed after transfer": qualified_parcel_changed
          "Qualified but excluded - legal characteristics changed after transfer": qualified_parcel_changed
          "Qualified - multiple parcels with multiple parcel IDs": qualified_multi_parcel
          "Qualified - single parcel crossing county lines": qualified_multi_parcel
          "Pending - recorded/discovered in previous 90 days, qualification decision pending": pending
          "Pending - unable to process because of transfer instrument errors": pending
          "Removed - not currently accepted": removed
          # Listed rather than defaulted, so a row with no code at all
          # stays missing instead of reading as disqualified.
          "Disqualified - transfer to/from financial institution or in lieu of foreclosure": disqualified
          "Disqualified - corrective/quit claim/tax deed or minimal stamps": disqualified
          "Disqualified - cemetery lots or parcels": disqualified
          "Disqualified - reservation of occupancy over 90 days (life estate)": disqualified
          "Disqualified - conveys less than 100% undivided interest": disqualified
          "Disqualified - transfer to/from religious/charitable/benevolent entity": disqualified
          "Disqualified - transfer to/from government agency": disqualified
          "Disqualified - transfer to/from bankruptcy trustee/administrator/executor/guardian/receiver": disqualified
          "Disqualified - transfer to/from utility company": disqualified
          "Disqualified - contract or agreement for deed": disqualified
          # Its own group, not 'disqualified': it is the state's record
          # that the parties are related (family or affiliated
          # companies; the code does not say which), the counterpart of
          # Wisconsin's `related_parties_*` groups below.
          "Disqualified - transfer between relatives or corporate affiliates": related_parties
          "Disqualified - trade or exchange of land": disqualified
          "Disqualified - abnormal time between contract and sale date": disqualified
          "Disqualified - incomplete or unbuilt common property": disqualified
          "Disqualified - satisfied payment in full of prior property contract": disqualified
          "Disqualified - atypical amounts of personal property": disqualified
          "Disqualified - atypical costs of sale": disqualified
          "Disqualified - atypical market exposure or motivation/knowledge of participants": disqualified
          "Disqualified - forced transfer or under duress": disqualified
          "Disqualified - consideration differs from documentary stamps": disqualified
          "Disqualified - significantly influenced by non-market financing or lease assumption": disqualified
          "Disqualified - other (duplicate recordings, rehabbed sales; requires DOR approval)": disqualified
          "Disqualified - mortgage fraud per law enforcement notification": disqualified
          "Disqualified - allocated price as part of a package or bulk transaction": disqualified
          # The undecoded state codes; see the confidence map above.
          "01": qualified
          "02": qualified
          "03": qualified_parcel_changed
          "04": qualified_parcel_changed
          "05": qualified_multi_parcel
          "06": qualified_multi_parcel
          "11": disqualified
          "12": disqualified
          "13": disqualified
          "14": disqualified
          "15": removed
          "16": disqualified
          "17": disqualified
          "18": disqualified
          "19": disqualified
          "20": disqualified
          "21": disqualified
          "30": related_parties
          "31": disqualified
          "32": disqualified
          "33": disqualified
          "34": disqualified
          "35": disqualified
          "36": disqualified
          "37": disqualified
          "38": disqualified
          "39": disqualified
          "40": disqualified
          "41": disqualified
          "42": disqualified
          "43": disqualified
          "98": pending
          "99": pending
      # Wisconsin RETR (US-WI_transaction-widor-2020 and -2026). The
      # state assigns no qualification. It asks the parties two things
      # instead: what kind of conveyance this is, and how they are
      # related. Each answer is graded on its own and the confidence is
      # the lower of the two, because a transfer is at arm's length
      # only if it is a sale *and* the parties are unrelated. A row
      # missing either answer is left missing, not graded.
      #
      # Conveyance: 1.0 for 'Sale', 0.0 for each of the other 25 types
      # the export uses (gifts, exchanges, transfers into trusts, deeds
      # in satisfaction of a land contract, corrections, ...), whose
      # price is 0 or an estimate: measured on 1.16M rows, 95.1% of
      # sales carry a price and no other type of any size does. Listed
      # by `default`, since the vocabulary is open.
      - output: _conveyance_grade
        type: value_map
        column: [conveyance_type]
        mapping:
          "Sale": 1.0
        default: 0.0
      # Relationship: 1.0 for none. 0.7 for 'Other': the parties say
      # they are related and not how, the one genuinely unclear answer.
      # 0.0 for family (the newer export also names spouses, ex-spouses
      # and parent/child), for partners, shareholders or members, and
      # for a financial relationship. An answer not listed here is left
      # missing rather than guessed at.
      - output: _relationship_grade
        type: value_map
        column: [sale_party_relationship]
        mapping:
          "No relationship": 1.0
          "Other": 0.7
          "Family": 0.0
          "Spouses": 0.0
          "Ex-spouses": 0.0
          "Parent/child or grandparent/grandchild": 0.0
          "Shareholder/partner/member": 0.0
          "Financial": 0.0
      # `fill_only`, so a unit holding another source's grades keeps
      # them. The two scratch columns are unregistered and do not
      # survive keep_registered_columns.
      - output: sale_arms_length_confidence
        type: minimum
        fill_only: true
        columns: [_conveyance_grade, _relationship_grade]
      # Why, in the group: a consumer treats 'the parties are family'
      # differently from 'this was a gift'. A conveyance that is not a
      # sale is `not_a_sale` whoever the parties are; a sale takes its
      # group from the relationship.
      - output: sale_qualification_group
        type: value_map
        fill_only: true
        column: [conveyance_type]
        mapping:
          "Sale": null
        default: not_a_sale
      - output: sale_qualification_group
        type: value_map
        fill_only: true
        column: [sale_party_relationship]
        mapping:
          "No relationship": qualified
          "Other": related_parties_unspecified
          "Family": related_parties_family
          "Spouses": related_parties_family
          "Ex-spouses": related_parties_family
          "Parent/child or grandparent/grandchild": related_parties_family
          "Shareholder/partner/member": related_parties_business
          "Financial": related_parties_financial
      # The spine states the kind (append_last_sales); a spine built
      # before that step has no such column and its rows are deeds.
      - output: sale_record_kind
        type: value_map
        column: sale_record_kind
        mapping:
          deed: deed
          assessor_last_sale: assessor_last_sale
        default: deed

  # A second document for the same parcel at the same price within a
  # month is usually the other leg of a double closing. Whether to
  # count it is a consumer's call, so the earlier leg is flagged here
  # and dropped only in a filtered product.
  - step: collapse_double_closings
    key_column: parcel_id_assessor
    max_gap_months: 1
    output: sale_double_closing_earlier_leg
    within: [sale_record_kind]

  # A county with a recorder's table and a roll reports its latest
  # sales twice. Both rows stay; the last-sale row that repeats a deed
  # (same parcel, year, month and price, exactly) is flagged so that a
  # consumer can keep the deed and drop its echo. On Pitt County NC
  # that is 89.9% of last-sale rows whose parcel has any deed.
  - step: flag_sales_matching_other_kind
    key_column: parcel_id_local

  # Where neither kind carries a parcel id, the document itself is the
  # thing both rows name. Massachusetts is that case: its registry
  # deeds have no `parcel_id_local` at all, so the pass above leaves
  # every MA row unflagged and a consumer cannot tell a MassGIS
  # last-sale row from the registry deed it repeats. Book and page are
  # on both kinds, and `derive_document_id` above already treats a
  # blank or all-zero part as naming no document, so a placeholder
  # cannot fold a county's sales together here either.
  # `fill_only`, so this reaches only what the parcel key could not and
  # never overrules it.
  - step: flag_sales_matching_other_kind
    key_column: [book, page]
    fill_only: true

  # A recorder's nominal consideration is not a price, and which value
  # it uses is the recorder's choice: Florida stamps 100 dollars on a
  # non-market transfer, North Carolina and Wisconsin record 0. The
  # floor is read off the county's own sales as the largest low-price
  # mass point (a value carrying 5% of all rows and 20 times its
  # neighbors), so a consumer can see what "disclosed" meant here.
  # Measured 2026-09-12: Florida's 1.9M SDF sales and 10.7M last sales
  # have mass points at 0 (11%) and 100 (24%), both 0% arm's length,
  # and the 101 to 1,000 band is 28% to 61% arm's length, so the floor
  # sits at the convention itself, not a round number above it.
  # Currituck, Nash and Wilson NC and Wisconsin have 0 alone. The 5%
  # is what keeps real cheap sales that cluster on round numbers out
  # of the floor: Polk's 700 dollar spike is 0.6% of rows and 69%
  # arm's length.
  #
  # The disclosure share is then the share of the county's single-family
  # sales priced above that floor, on every row: a full-disclosure
  # state reads near 1, a county whose assessor withholds prices near 0,
  # and a consumer sets the cutoff below which it will not fit there.
  # The county is the unit being curated, so the group is the table.
  - step: derive_indicators
    indicators:
      - output: sale_nominal_price_floor
        type: nominal_floor
        column: price
      # Restricted on the sale record's own decoded use label: Florida's
      # SDF carries the DOR use code decoded to 'Single Family', and the
      # parcel link's `use_group` is empty for Florida (the DOR code has
      # no crosswalk into the hub vocabulary yet). When it does, this
      # should read `use_group`.
      - output: single_family_sales_disclosure_share
        type: group_share
        column: price
        predicate: above
        threshold_column: sale_nominal_price_floor
        restrict: {column: use_group_code, equals: Single Family}

  # One row per deed. Areas and counts are summed and the other columns
  # taken from the representative parcel, per the registry's rule for
  # each column; the price was never wrong, the denominator was.
  - step: aggregate_multi_parcel_sales

  # Price over the assessed value of everything the deed conveyed, so
  # it comes after the aggregation: a multi-parcel deed's price over
  # one parcel's assessed value was the defect the aggregation removes,
  # and land and improvement values sum across the deed's parcels.
  - step: derive_indicators
    indicators:
      - output: sale_price_to_assessed_ratio
        type: ratio
        numerator: price
        denominator: [land_value, improvement_value]

  # Nothing personal leaves the build. A recorder's table names the
  # parties to every deed, and Wisconsin's RETR is ingested with all 78
  # of its raw columns, among them the names and addresses of grantor,
  # grantee, their agents, the preparer and the tax-bill recipient. An
  # The property as it was when it sold, where a multi-year roll exists.
  # A hedonic model wants the values and structure at the sale date, not
  # today's, and where a county renumbered its parcels the panel is the
  # only thing that reaches the older sales at all: six Florida counties
  # renumbered (Volusia and Pasco in 2017), and 100% of their pre-cutover
  # sales are in the panel, 98-100% in the roll of their own sale year,
  # against 0.000 reaching the current parcel layer.
  #
  # `require_panel` makes this a no-op wherever there is no panel, which
  # is nearly everywhere: Florida's DOR roll keeps 24 yearly vintages,
  # and the other 104 assessor sources in the tree are one vintage each
  # (plans/multi-year-tax-rolls-property-panel.md). When a national
  # `US_property-panel-2026` exists it replaces the recipe named here.
  #
  # `property_match_type` is written on **every** row, not only matched
  # ones, because a reader has to be able to tell a value taken from the
  # sale year from one taken from a neighboring year, from a county with
  # no panel at all. `tax_year` rides along as the vintage actually used.
  - step: join_temporal_snapshot
    recipe_id: US-FL_property-fldor-2026
    require_panel: true
    join_key: parcel_id_assessor
    date_column: sale_year
    vintage_column: tax_year
    direction: backward
    prefix: at_sale_
    match_type_column: property_match_type
    columns: [tax_year, year_built, living_area_sqft, land_area_sqft,
              market_value, land_value, n_dwellings, n_buildings]

  # A sale before the roll's first vintage has no earlier year to take;
  # the nearest later one is the only evidence there is. Restricted to
  # sales already improved at the time, so a bare lot cannot inherit the
  # house that was built on it afterwards, and marked as a forward
  # fallback so the difference is legible. `mark_unmatched` closes the
  # column: after this pass, an empty value would be indistinguishable
  # from a county the step skipped.
  - step: join_temporal_snapshot
    recipe_id: US-FL_property-fldor-2026
    require_panel: true
    join_key: parcel_id_assessor
    date_column: sale_year
    vintage_column: tax_year
    direction: forward
    only_unmatched: true
    restrict_to: {column: sale_vacant, equals: "Improved property"}
    prefix: at_sale_
    match_type_column: property_match_type
    mark_unmatched: not_in_panel
    columns: [tax_year, year_built, living_area_sqft, land_area_sqft,
              market_value, land_value, n_dwellings, n_buildings]

  # allow-list, since no list of names to drop could be complete: a
  # column stays if the attribute registry knows it, or if it is named
  # under `keep` (non-personal source columns the registry has no row
  # for yet). Registered personal attributes (owner, grantor, grantee)
  # are dropped too, unless the person running this chose to keep them
  # on their own installation (`python -m openplaces.config
  # --keep-personal-columns true`), e.g. to tell a sale within a family
  # from one at arm's length in a state whose records state no
  # relationship. No recipe can make that choice, which is why none is
  # made here; and a delivery withholds these columns whatever it was.
  - step: keep_registered_columns
    keep:
      - _join_id
      - source
      - admin3_id
      # Which vintage each at-sale value came from, and how it was
      # reached: exact, a neighboring year, or not at all.
      - property_match_type
      - at_sale_tax_year
      - at_sale_year_built
      - at_sale_living_area_sqft
      - at_sale_land_area_sqft
      - at_sale_market_value
      - at_sale_land_value
      - at_sale_n_dwellings
      - at_sale_n_buildings
      - n_records_per_key
      - parcel_id_alnum
      # Florida SDF
      - tax_use_subgroup
      - value_group
      - tax_market_area
      - submission_id
      - parcel_id_admin2_2
      # Wisconsin RETR
      - conveyance_date
      - property_type
      - property_use_type
      - n_units
      - estimated_value
      - transfer_fee

  - step: cast_categoricals

  - step: order_columns

# What a delivery of this recipe carries, and to whom.
#
# `geometry: false`: a transaction is an event, not a place. Its
# location belongs to the parcel it names (`parcel_id_local`, which the
# canonical table carries so a consumer can join geometry itself), and
# a deed covering several parcels has no single point at all. So the
# bundle is the canonical table and its evidence supplement, with no
# point or boundary file, rather than a centroid invented to fill one.
#
# The column list is every state's, not each state's: a column one
# state lacks is written empty rather than dropped, so both bundles
# share a schema. Wisconsin has no multi-year roll and so no
# `at_sale_*` values (`property_match_type` says `single_vintage`
# there); Florida's `use_group` is empty until the DOR code gets a
# crosswalk, which is why `use_group_code` ships beside it.
#
# Deliberately absent: `grantor` and `grantee`. They are in the curated
# table on an installation that chose to keep them, and
# `export_delivery` refuses a recipe that names a personal attribute
# here, but the list should not have to be corrected by that check.
share:
  columns:
    # What was sold, and where it can be joined
    - parcel_id_local
    - parcel_id_assessor
    - admin3_id
    - sale_document_id
    # The sale itself
    - sale_year
    - sale_month
    - price
    - sale_record_kind
    # Graded, never filtered: the hub grades and the consumer sets the
    # cutoff (see this recipe's header).
    - sale_arms_length_confidence
    - sale_qualification_group
    - n_parcels_per_sale
    - sale_matches_deed
    - sale_double_closing_earlier_leg
    - sale_nominal_price_floor
    - sale_price_to_assessed_ratio
    - single_family_sales_disclosure_share
    # The property, as the current layer describes it
    - use_group
    - use_group_code
    - use_subgroup
    - land_value
    - improvement_value
    - year_built
    - n_dwellings
    # The property as it was when it sold, and how that was reached
    - property_match_type
    - at_sale_tax_year
    - at_sale_year_built
    - at_sale_living_area_sqft
    - at_sale_land_area_sqft
    - at_sale_market_value
    - at_sale_land_value
    - at_sale_n_dwellings
    - at_sale_n_buildings
    # Which rule reached the parcel, so a weak link is visible rather
    # than implied by an empty value column
    - parcel_link_method
  geometry: false
  delivery:
    admin_level: 2
    regions:
      - wisconsin-statewide
      - florida-statewide
