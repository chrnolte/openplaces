# Recipe: harmonized U.S. transaction spine.
#
# Standardizes recorded-sale sources with very different raw schemas
# (New Hanover County NC, Wisconsin DOR RETR, Massachusetts registry of
# deeds) into one table, then attaches parcel attributes as evidence --
# the precursor to a future canonical transaction curation recipe
# (`US_transaction-openplaces-2026`, for hedonic valuation). Unlike the
# parcel spine, sources here are always disjoint by admin scope (one sale
# can't appear in two states' feeds), so assembly is a plain union, not an
# overlap-dedup merge.

description: >-
  Harmonized U.S. transaction spine: recorded sales standardized across
  sources and linked to the parcel(s) sold.

stage: harmonize
admin_id: US

entity:
  entity_type: transaction
  source:
    source_id: spine
    # Not an external source: this is an openplaces pipeline product, so
    # it carries whatever its inputs carry and nothing of its own. The
    # applicable terms are derived per output by io.bundle_terms, which
    # walks the dependency graph rather than reading a licence here.
    # Left unrestricted-unknown deliberately: "depends on the inputs" is
    # not "unrestricted".
    license: "derived; inherits the terms of this recipe's inputs"
    redistribution_restricted: null
  version: 2026

process_by:
  admin_level: 3

save_to:
  data_dir: core

pipeline:
  - step: union_spine_sources
    sources:
      - auto_discover: true
        entity_type: transaction

  # The assessor last-sale lane: one row per recorded last sale on the
  # admin unit's ingested property and parcel tables, marked
  # sale_record_kind = assessor_last_sale (deed rows read 'deed'). It
  # is what gives a state with no recorder's feed any prices at all. A
  # row needs a price and a real date or year; the key is the roll
  # row's own parcel_id_local, so nothing is matched here. A county
  # with both kinds keeps both; the curate stage decides between them.
  # A last-sale field is the most recent sale only: these rows support
  # cross-sectional work, not a repeat-sales index.
  - step: append_last_sales
    entity_types: [property, parcel]

  # Standardize addresses across sources. Each unioned row only ever has one
  # source's columns populated (sources are disjoint by admin scope), so the
  # usual multi-source conflict logic in reconcile_addresses just picks the
  # one present source per row -- no new address-parsing code needed.
  - step: reconcile_addresses
    sources:
      nhcgov:
        address_full: address
        city: city
      widor:
        address_full: address
        city: city
      masslandrecords:
        address_street: street_name
        address_number: street_number
        unit_number: unit_from_description
    number_output_col: address_number
    unit_output_col: address_unit
    # masslandrecords rows get no city_output_col: a MA registry district
    # (admin4_id) can contain several villages that each use their own name
    # as a street address's city (e.g. Newton, MA contains Newton Centre,
    # Waban, ...) -- do not synthesize one from the containing town.

  # The town a record names, as an id. A parcel's address key is scoped
  # by its town (`admin4_id`), and a return that only *names* its
  # municipality ("Saint Germain, Town of", Wisconsin's RETR) gets an
  # empty scope, so its key can match nothing: 0 of Vilas County's
  # 12,203 keyed returns found a parcel by address, 0.759 with the scope
  # ignored. The pattern is this source's spelling; the match against
  # the county's level-4 units is exact and unique or not made (99.15%
  # of 2.76M returns resolve, none ambiguously). A no-op where the
  # pattern does not fit or the state has no level 4 (New England).
  - step: assign_admin_id_from_name
    name_column: city
    level: 4
    name_pattern: '^(?P<name>.*?),?\s+(?P<type>town|village|city)\b(?:\s+of?)?$'

  # Town-scoped fallback matching key for masslandrecords, which carries no
  # parcel_id_local (see US_parcel-spine-2026's own derive_address_id_local
  # step, computed identically there).
  - step: derive_address_id_local

  # NC/WI: transactions already carry parcel_id_local from ingest; discovers
  # and joins every parcel source scoped to the admin unit being processed
  # (auto_discover always runs as mode='aggregate' internally -- a correct
  # generalization of 'attributes' for this 1:1-per-key case too; see
  # link_by_id's own docstring). A no-op for MA rows (parcel_id_local is
  # null there).
  # `area_ha` rides along on every parcel link so that a deed covering
  # several parcels can sum their areas when the curate stage folds
  # its rows into one sale; without it the price would sit over one
  # parcel's area, the defect the aggregation exists to remove.
  # The key every parcel join below uses. A deed for a condo unit
  # states the unit's number, and since the ingest-time split of
  # stacked parcel layers that number is on a property row, not on a
  # parcel row: the lot's parcel row is keyed on the lot. This step
  # looks the number up in the (unit, lot) pairs the split recorded and
  # writes the lot to `lot_id_local`; `parcel_link_key` is the lot where
  # one was found and the record's own number elsewhere. Without it a
  # re-ingested county silently loses every condo sale.
  - step: derive_parcel_link_key

  # `track_provenance` writes a `{col}_source` naming the county source
  # that supplied each value. Not bookkeeping: `io.redaction.withhold`
  # withholds a restricted source's values **per cell** by reading those
  # sidecars, and a canonical column delivered without one can only be
  # withheld by the coarser scope rules, or not at all. Attached values
  # here come from auto-discovered county parcel recipes, which is
  # exactly where a restricted county enters this lane, so the sidecars
  # are what make a delivery of it safe (main verified the mechanism on
  # Edgecombe NC: 30,260 cells reading `withheld` in the public bundle,
  # the same county fully valued in the team twin).
  - step: link_by_id
    auto_discover: true
    entity_type: parcel
    spine_key: parcel_link_key
    ref_key: parcel_id_local
    columns: [use_group, use_subgroup, land_value, improvement_value,
              year_built, n_dwellings, area_ha]
    track_provenance: [use_group, use_subgroup, land_value,
                       improvement_value, year_built, n_dwellings, area_ha]

  # Which rule linked a row, recorded after each pass below. The parcel
  # number is tried first and an exact address key only where it found
  # nothing, and the two are not equally sure: a number names one
  # parcel, an address can sit on a lot that was split since. The label
  # is a fixed word per rule, written once and never changed; it is not
  # a score, and no pass takes an earlier link back.
  # A sale that named a unit and reached the parcel through the unit's
  # lot reads `stacked_units`, the name main's property-to-parcel link
  # table uses for the same rule.
  - step: record_link_method
    label: parcel_id_local
    spine_key: parcel_link_key
    ref_key: parcel_id_local
    auto_discover: true
    entity_type: parcel
    via_column: lot_id_local
    via_label: stacked_units

  # MA: no parcel_id_local on the transaction side; join by address instead.
  # Two passes, most specific first -- link_by_id's existing column-priority
  # behavior (_write_prioritized) makes the second pass a pure gap-fill for
  # whatever the city-inclusive pass left unmatched, so this needs no new
  # join logic.
  # recipe_id is the harmonized parcel spine, not the raw massgis ingest
  # recipe -- address_id_local(_city) only exists once derive_address_id_local
  # has run there.
  # The parcel spine by the standardized parcel id, filling only what
  # the county roll above left (its own values win). This is the link
  # that reaches a source with no addresses, and the only one that
  # carries `area_ha`, which the roll does not have: Florida's SDF
  # names its parcel and nothing else, and on Lake County 97.6% of its
  # keys are in the parcel spine.
  - step: link_by_id
    recipe_id: US_parcel-spine-2026
    mode: attributes
    spine_key: parcel_link_key
    ref_key: parcel_id_local
    fill_only: true
    columns: [use_group, use_subgroup, land_value, improvement_value,
              year_built, n_dwellings, area_ha]
    track_provenance: [use_group, use_subgroup, land_value,
                       improvement_value, year_built, n_dwellings, area_ha]
  - step: record_link_method
    label: parcel_id_local
    spine_key: parcel_link_key
    ref_key: parcel_id_local
    recipe_id: US_parcel-spine-2026
    via_column: lot_id_local
    via_label: stacked_units

  # A sale of a stacked unit takes its values from the unit, not from
  # the lot. The lot's parcel row deliberately carries no summed value
  # (one unit's land value is not the lot's, see io/stacked_units.py),
  # so a condo sale that correctly reached its lot above finds those
  # columns empty: measured on Collier County FL, 288,597 of its
  # 916,076 sales, every one of them with a fully valued property row
  # sitting unread. Joined on the sale's own `parcel_id_local`, which
  # is the unit's account number, not on `parcel_link_key`, and 100% of
  # those sales' keys are in the property spine (Collier and Pinellas).
  # `fill_only`, so a value the parcel side already supplied wins.
  # `area_ha` is deliberately not carried: a unit of airspace has no
  # land area of its own, and the lot's would be a different entity's.
  - step: link_by_id
    recipe_id: US_property-spine-2026
    mode: attributes
    spine_key: parcel_id_local
    ref_key: parcel_id_local
    fill_only: true
    # `use_group_code` rides along because a roll states the use as a
    # code and nothing on the property side produces the decoded
    # `use_group`: Miami-Dade's condominium sales reach their property
    # row and carried no use label at all until this was added. The
    # column holds the decoded text, the ingester having applied the
    # DOR crosswalk sidecar beside the property recipe.
    columns: [use_group, use_subgroup, use_group_code, land_value,
              improvement_value, year_built, n_dwellings]
    track_provenance: [use_group, use_subgroup, use_group_code, land_value,
                       improvement_value, year_built, n_dwellings]
  - step: link_by_id
    recipe_id: US_parcel-spine-2026
    mode: attributes
    spine_key: address_id_local_city
    ref_key: address_id_local_city
    columns: [use_group, use_subgroup, land_value, improvement_value,
              year_built, n_dwellings, area_ha]
    track_provenance: [use_group, use_subgroup, land_value,
                       improvement_value, year_built, n_dwellings, area_ha]
  - step: record_link_method
    label: address_id_local_city
    spine_key: address_id_local_city
    recipe_id: US_parcel-spine-2026
  - step: link_by_id
    recipe_id: US_parcel-spine-2026
    mode: attributes
    spine_key: address_id_local
    ref_key: address_id_local
    columns: [use_group, use_subgroup, land_value, improvement_value,
              year_built, n_dwellings, area_ha]
    track_provenance: [use_group, use_subgroup, land_value,
                       improvement_value, year_built, n_dwellings, area_ha]
  - step: record_link_method
    label: address_id_local
    spine_key: address_id_local
    recipe_id: US_parcel-spine-2026

  # A multi-unit deed sale's address_number (e.g. '704-706', a duplex) never
  # matches a parcel's own single-number address_id_local key via the two
  # link_by_id passes above. Try each individual number instead; a range
  # normally resolves to exactly one parcel -- an ambiguous match (the two
  # numbers resolving to two different parcels) is left unmatched with a
  # warning rather than guessed at.
  - step: link_address_ranges
    recipe_id: US_parcel-spine-2026
    columns: [use_group, use_subgroup, land_value, improvement_value,
              year_built, n_dwellings, area_ha]

  # The rows into the entity's terms, and the ids, last: a transaction
  # is one recorded sale, and the spine is where an entity is
  # established (moved here from US_transaction-openplaces-2026 on
  # 2026-09-29; plans/stage-contract-audit.md: "Transaction ids are
  # minted in the transaction spine, like property ids; curate filters
  # and never re-mints"). After every parcel link above, because the
  # fold below sums the linked area and takes the other columns from
  # the representative parcel.
  #
  # A recorder states a date, a roll a year and month (or a month-only
  # date); every step below compares sales by year and month.
  - step: derive_sale_period

  # A source published as overlapping rolling windows lists the same
  # recorded document twice. Same key, same row: keep one. The record
  # kind is part of the key so that a deed and the assessor's last-sale
  # record of it are never taken for one row listed twice; columns a
  # county lacks read as missing. What this drops is unambiguous: an
  # exact repeat, 15.4% of Lake County FL's rows, all deeds (2026-09-29).
  - step: dedup_transactions
    key_columns:
      - sale_record_kind
      - parcel_id_local
      - parcel_id_assessor
      - sale_year
      - sale_month
      - price
      - sale_book
      - sale_page
      - sale_clerk_instrument
      # The North Carolina recorders' spelling; without it two deeds
      # on one parcel in one month at price 0 would read as one.
      - book
      - page
      # Wisconsin's RETR names its document; MassGIS's last sales sit
      # on property rows with no parcel key of their own.
      - instrument_number
      - property_id_assessor

  # The deed behind each row, spelled per source: Florida records a
  # clerk instrument number for newer sales and an official-record book
  # and page for older ones. Another source adds its own candidate here:
  # the North Carolina county recorders map `book` and `page`. An
  # assessor last-sale row citing a deed's book and page gets a scoped
  # identifier, so it is never counted or aggregated as a second parcel
  # of that deed, while the last-sale rows of one multi-parcel deed
  # still share theirs.
  - step: derive_document_id
    candidates:
      - [sale_clerk_instrument]
      - [instrument_number]
      - [sale_book, sale_page]
      - [book, page]
    scope_column: sale_record_kind
    unscoped_value: deed

  # How many parcels the deed covered, on every row, so the count
  # survives the fold below and a consumer can tell an aggregated row
  # from a single-parcel one. On Lake County FL this agrees with the
  # source's own multi-parcel flag on 80,488 rows and finds 32,972 more
  # rows the flag misses.
  - step: count_parcels_per_document
    parcel_column: parcel_id_assessor

  # One row per deed. Areas and counts are summed and the other columns
  # taken from the representative parcel, per the registry's rule for
  # each column; the price was never wrong, the denominator was. Before
  # the ids, so a deed's id is its document's, without a suffix.
  - step: aggregate_multi_parcel_sales

  # Give each sale an id, once the row is the entity. Until 2026-09-23 a
  # transaction had none: the curated output carried an unnamed
  # RangeIndex, so every county numbered its rows 0, 1, 2, harmless per
  # county and destructive when pooled, because `export_delivery`
  # de-duplicates on the index. The curate stage keeps this index and
  # never re-mints.
  - step: assign_transaction_ids
