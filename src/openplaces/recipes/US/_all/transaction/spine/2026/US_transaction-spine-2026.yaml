# Recipe: harmonized U.S. transaction spine.
#
# Standardizes recorded-sale sources with very different raw schemas
# (New Hanover County NC, Wisconsin DOR RETR, Massachusetts registry of
# deeds, Florida DOR SDF) into one table of recorded sales, and writes
# the link tables that say what each sale conveyed. Unlike the parcel
# spine, sources here are always disjoint by admin scope (one sale can't
# appear in two states' feeds), so assembly is a plain union, not an
# overlap-dedup merge.
#
# The spine carries what the document states (price, dates, kind,
# document references, qualification codes, the number of parcels
# conveyed) and nothing it conveyed. A sale reaches its parcel, its
# property and through them its building or dwelling by link tables
# (`link_transactions`, one row per pair, beside this recipe's output),
# and the curate recipe gathers parcel- and property-level data through
# them. Until 2026-10-01 five `link_by_id` passes stamped use group,
# values and area onto every sale row and the multi-parcel fold took
# those columns from the largest parcel; a deed of unlike parcels then
# wore one parcel's columns as if they were the deed's
# (plans/core-schema-and-stage-contracts-review.md, slice b4).

description: >-
  Harmonized U.S. transaction spine: recorded sales standardized across
  sources, one row per sale, linked to the parcels and properties sold.

stage: harmonize
admin_id: US

entity:
  entity_type: transaction
  source:
    source_id: spine
    # Not an external source: this is an openplaces pipeline product, so
    # it carries whatever its inputs carry and nothing of its own. The
    # applicable terms are derived per output by io.bundle_terms, which
    # walks the dependency graph rather than reading a licence here.
    # Left unrestricted-unknown deliberately: "depends on the inputs" is
    # not "unrestricted".
    license: "derived; inherits the terms of this recipe's inputs"
    redistribution_restricted: null
  version: 2026

process_by:
  admin_level: 3

save_to:
  data_dir: core

pipeline:
  - step: union_spine_sources
    sources:
      - auto_discover: true
        entity_type: transaction

  # The assessor last-sale lane: one row per recorded last sale on the
  # admin unit's ingested property and parcel tables, marked
  # sale_record_kind = assessor_last_sale (deed rows read 'deed'). It
  # is what gives a state with no recorder's feed any prices at all. A
  # row needs a price and a real date or year; the key is the roll
  # row's own parcel_id_local, so nothing is matched here. A county
  # with both kinds keeps both; the curate stage decides between them.
  # A last-sale field is the most recent sale only: these rows support
  # cross-sectional work, not a repeat-sales index.
  - step: append_last_sales
    entity_types: [property, parcel]

  # Standardize addresses across sources. Each unioned row only ever has one
  # source's columns populated (sources are disjoint by admin scope), so the
  # usual multi-source conflict logic in reconcile_addresses just picks the
  # one present source per row -- no new address-parsing code needed.
  - step: reconcile_addresses
    sources:
      nhcgov:
        address_full: address
        city: city
      widor:
        address_full: address
        city: city
    number_output_col: address_number
    unit_output_col: address_unit

  # The town a record names, as an id. A parcel's address key is scoped
  # by its town (`admin4_id`), and a return that only *names* its
  # municipality ("Saint Germain, Town of", Wisconsin's RETR) gets an
  # empty scope, so its key can match nothing: 0 of Vilas County's
  # 12,203 keyed returns found a parcel by address, 0.759 with the scope
  # ignored. The pattern is this source's spelling; the match against
  # the county's level-4 units is exact and unique or not made (99.15%
  # of 2.76M returns resolve, none ambiguously). A no-op where the
  # pattern does not fit or the state has no level 4 (New England).
  - step: assign_admin_id_from_name
    name_column: city
    level: 4
    name_pattern: '^(?P<name>.*?),?\s+(?P<type>town|village|city)\b(?:\s+of?)?$'

  # Town-scoped address matching key for records that carry no
  # parcel_id_local (see US_parcel-spine-2026's own derive_address_id_local
  # step, computed identically there).
  - step: derive_address_id_local

  # The key the parcel link uses. A deed for a condo unit states the
  # unit's number, and since the ingest-time split of stacked parcel
  # layers that number is on a property row, not on a parcel row: the
  # lot's parcel row is keyed on the lot. This step looks the number up
  # in the (unit, lot) pairs the split recorded and writes the lot to
  # `lot_id_local`; `parcel_link_key` is the lot where one was found and
  # the record's own number elsewhere. Without it a re-ingested county
  # silently loses every condo sale.
  - step: derive_parcel_link_key

  # The rows into the entity's terms, and the ids (moved here from
  # US_transaction-openplaces-2026 on 2026-09-29; plans/stage-contract-
  # audit.md: "Transaction ids are minted in the transaction spine, like
  # property ids; curate filters and never re-mints").
  #
  # A recorder states a date, a roll a year and month (or a month-only
  # date); every step below compares sales by year and month.
  - step: derive_sale_period

  # A source published as overlapping rolling windows lists the same
  # recorded document twice. Same key, same row: keep one. The record
  # kind is part of the key so that a deed and the assessor's last-sale
  # record of it are never taken for one row listed twice; columns a
  # county lacks read as missing. What this drops is unambiguous: an
  # exact repeat, 15.4% of Lake County FL's rows, all deeds (2026-09-29).
  - step: dedup_transactions
    key_columns:
      - sale_record_kind
      - parcel_id_local
      - parcel_id_assessor
      - sale_year
      - sale_month
      - price
      - sale_book
      - sale_page
      - sale_clerk_instrument
      # The North Carolina recorders' spelling; without it two deeds
      # on one parcel in one month at price 0 would read as one.
      - book
      - page
      # Wisconsin's RETR names its document; MassGIS's last sales sit
      # on property rows with no parcel key of their own.
      - instrument_number
      - property_id_assessor
    # Compared without punctuation: Florida's DOR respelled every parcel
    # number between two adjacent SDF years in 23 counties (dashes in
    # one file, none in the next), and both copies of each deed then
    # survived this step and were folded as a deed whose parcels
    # disagree, losing its parcel number (`no_key` in curate). An exact
    # comparison of a deterministic rewrite, not a looser match.
    normalize_columns:
      - parcel_id_assessor

  # The deed behind each row, spelled per source: Florida records a
  # clerk instrument number for newer sales and an official-record book
  # and page for older ones. Another source adds its own candidate here:
  # the North Carolina county recorders map `book` and `page`. An
  # assessor last-sale row citing a deed's book and page gets a scoped
  # identifier, so it is never counted or aggregated as a second parcel
  # of that deed, while the last-sale rows of one multi-parcel deed
  # still share theirs.
  - step: derive_document_id
    candidates:
      - [sale_clerk_instrument]
      - [instrument_number]
      - [sale_book, sale_page]
      - [book, page]
    scope_column: sale_record_kind
    unscoped_value: deed

  # How many parcels the deed covered, on every row, so the count
  # survives the fold below and a consumer can tell a multi-parcel sale
  # from a single-parcel one. Counted on the normalized number first:
  # Florida's deed feed spells one parcel with dashes in one vintage and
  # as bare digits in another, and counted on the spelling (as until
  # 2026-10-01) 119,027 of Lake County's 157,087 multi-parcel documents
  # were one parcel twice. On Lake County FL the spelling-based count
  # agreed with the source's own multi-parcel flag on 80,488 rows and
  # found 32,972 more rows the flag misses (2026-09-29).
  - step: count_parcels_per_document
    parcel_column: [parcel_id_local, parcel_id_assessor]

  # One row per deed. The folded row keeps what every member states
  # alike (price, dates, document, kind) and leaves missing what the
  # members state for their own parcel (parcel numbers, address, keys):
  # those become rows of the link table below. Before the ids, so a
  # deed's id is its document's, without a suffix.
  - step: aggregate_multi_parcel_sales

  # Give each sale an id, once the row is the entity. Until 2026-09-23 a
  # transaction had none: the curated output carried an unnamed
  # RangeIndex, so every county numbered its rows 0, 1, 2, harmless per
  # county and destructive when pooled, because `export_delivery`
  # de-duplicates on the index. The curate stage keeps this index and
  # never re-mints.
  - step: assign_transaction_ids

  # What each sale conveyed, as link tables beside this output: one row
  # per (sale, parcel) and one per (sale, property), with the rule that
  # found the pair as a fixed label and, for a deed of several parcels,
  # each parcel's area share of the deed. The passes are exact key
  # matches tried in order, each only for rows no earlier pass reached:
  # the parcel key (the lot, where the record named a unit); the
  # town-scoped and county-scoped address keys, for a registry that
  # carries no parcel number (Massachusetts); the address range
  # ('704-706'), where exactly one parcel matches either half. The
  # property link is the record's own number against the property
  # spine's, which is how a condo sale reaches its unit while the parcel
  # link reaches the lot. `parcel_link_method` on the spine summarizes
  # the table for a reader who wants one column.
  - step: link_transactions
    parcel_recipe_id: US_parcel-spine-2026
    property_recipe_id: US_property-spine-2026

  # A fact on each parcel link, never a score: does the sale's address
  # key belong to an address point inside the linked parcel's own
  # polygon (`address_points_check`: agree, other_parcel,
  # no_point_match, no_points, no_sale_address)? It adds and removes no
  # link. Points come from the first recipe listed that has any for the
  # unit; a state patch puts its own address points first. Last in the
  # pipeline, after any step that rewrites the link table.
  - step: check_parcel_links_by_address_points
    dwelling_recipe_ids: [dwelling-overture-2025]
    parcel_recipe_id: US_parcel-spine-2026
