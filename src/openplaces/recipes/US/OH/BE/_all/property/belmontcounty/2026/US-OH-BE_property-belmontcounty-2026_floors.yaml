# Recipe: Belmont County, OH auditor roll, ISSG Parcel Dwelling Floor
# table. Supplement of US-OH-BE_property-belmontcounty-2026; see that
# recipe for the source and the join key.
#
# One row per floor of a dwelling card. Floor_Type is First Floor,
# Full, 1/2, 1/4 or 3/4 Upper Floor, Attic, Basement, Crawl or Slab.
# Area is the floor's area and Living_Area its finished living area
# (sqft); Cool_Factor is the share of the floor that is cooled, 0 to
# 100 (the layout's words: "the factor of the area that is cooled").
#
# Basement. basement_area_sqft sums Area and
# basement_finished_area_sqft sums Living_Area over Basement rows;
# other rows add 0, so a card whose lowest level is a crawl or slab
# reads 0. has_basement is true on a Basement row and false on a
# Crawl or Slab row: the source records every card's lowest level as
# a floor row, so false is a recorded absence. A property with no
# floor rows stays null.
#
# Cooling. has_central_air is true where any floor has a cooled share
# above 0 and false where every floor records 0. ISSG says "cooled",
# not "central"; Ohio's residential cost schedule prices this
# adjustment per floor area, which is how central air is priced, but
# the source does not name the system.
#
# MEASURED 2026-09-13: 70,291 floor rows over 25,655 parcels, keys
# 99.98% in the roll. On the 14,075 live land-use 510 properties:
# has_basement true 93.2%, false 4.3%, null 2.5%; basement area > 0
# on 93.2% (median 952 sqft); finished basement area > 0 on 15.6%;
# has_central_air true 68.3%, false 30.2%.
#
# foundation_description keeps the lowest-level Floor_Type in the
# source's words (Basement, Crawl, Slab), first row per property; it
# is not translated into foundation_type's letter codes. On the same
# properties: Basement 12,913, Crawl 686, Slab 126, null 350 (2.5%).
# A card with a partial basement over a crawl can read Crawl here
# (about 205 properties); has_basement is true on them.

description: >-
  Belmont County, OH ISSG Parcel Dwelling Floor table: basement area,
  finished basement area and basement and cooling flags per property.

admin_id: US-OH-BE

entity:
  entity_type: property
  source:
    source_id: belmontcounty
    # Same download as the roll; see its terms note.
    license: "unknown (no terms on the downloads page)"
    redistribution_restricted: null
    portal_url: "https://belmontcountyauditor.org/additional-links-property-data-downloads"
    download_url: "https://belmontcountyauditor.org/api/Document/PublicRecordsRequest.zip"
  version: "2026"

compressed_file_name: "PublicRecordsRequest.zip"
uncompressed_file_name: "Parcel Dwelling Floor.xml"

process_by:
  admin_level: 3

columns:
  parcel_id_assessor: Parcel_Number

transformations:
  - type: unary
    operation: to_numeric
    input: Area
    output: floor_area
  - type: unary
    operation: to_numeric
    input: Living_Area
    output: floor_living_area
  - type: unary
    operation: to_numeric
    input: Cool_Factor
    output: cool_factor
  # 1 on Basement rows, 0 on every other floor.
  - type: remap
    input: Floor_Type
    mapping: {Basement: 1}
    default: 0
    output: basement_row
  - type: binary
    operation: multiply
    inputs: [floor_area, basement_row]
    output: basement_area_sqft
  - type: binary
    operation: multiply
    inputs: [floor_living_area, basement_row]
    output: basement_finished_area_sqft
  # Other floor types leave the flag null.
  - type: remap
    input: Floor_Type
    mapping: {Basement: true, Crawl: false, Slab: false}
    output: has_basement
  # The lowest-level floor types in the source's words.
  - type: remap
    input: Floor_Type
    mapping: {Basement: Basement, Crawl: Crawl, Slab: Slab}
    output: foundation_description
  - type: conditional
    operation: greater_than
    input: cool_factor
    args: {threshold: 0}
    output: cooled_row
  - type: remap
    input: cooled_row
    mapping: {0: false, 1: true}
    output: has_central_air

drop_columns:
  - floor_area
  - floor_living_area
  - cool_factor
  - basement_row
  - cooled_row

columns_to_categorical:
  - foundation_description

aggregation_function:
  foundation_description: first
  basement_area_sqft: sum
  basement_finished_area_sqft: sum
  has_basement: max
  has_central_air: max

supplements: US-OH-BE_property-belmontcounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: floors
