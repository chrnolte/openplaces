# Recipe: Belmont County, OH auditor roll, ISSG Parcel Land table.
# Supplement of US-OH-BE_property-belmontcounty-2026; see that recipe
# for the source and the join key.
#
# One row per land line of a parcel (front lot, rear lot, homesite,
# tillable, woodland, ...). Label says how Dim1 and Dim2 are read;
# on 'Effective - Frontage / Depth' lines Dim1 is the effective
# frontage in feet and Dim2 the depth. frontage_ft sums Dim1 over the
# parcel's FR-FRONT LOT lines with that label; rear lots and acreage
# lines add nothing, and a parcel with no front-lot line stays null.
# This is street frontage; the source records no waterfront frontage.
#
# MEASURED 2026-09-13: 82,099 land lines over 61,558 parcels, keys
# 99.91% in the roll; frontage_ft on 80.7% of the 14,075 live
# land-use 510 properties (median 50 ft, p99 168 ft).

description: >-
  Belmont County, OH ISSG Parcel Land table: effective street frontage
  in feet from front-lot land lines, per parcel.

admin_id: US-OH-BE

entity:
  entity_type: property
  source:
    source_id: belmontcounty
    # Same download as the roll; see its terms note.
    license: "unknown (no terms on the downloads page)"
    redistribution_restricted: null
    portal_url: "https://belmontcountyauditor.org/additional-links-property-data-downloads"
    download_url: "https://belmontcountyauditor.org/api/Document/PublicRecordsRequest.zip"
  version: "2026"

compressed_file_name: "PublicRecordsRequest.zip"
uncompressed_file_name: "Parcel Land.xml"

process_by:
  admin_level: 3

columns:
  parcel_id_assessor: Parcel_Number

transformations:
  - type: unary
    operation: to_numeric
    input: Dim1
    output: land_dim1
  # 1 on front-lot lines measured by frontage; other lines null.
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "FR-", value: 1}
    output: front_row
  - type: remap
    input: Label
    mapping: {"Effective - Frontage / Depth": 1}
    output: frontage_row
  - type: unary
    operation: to_numeric
    input: front_row
    output: front_row
  - type: binary
    operation: multiply
    inputs: [land_dim1, front_row]
    output: front_dim1
  - type: binary
    operation: multiply
    inputs: [front_dim1, frontage_row]
    output: frontage_ft

drop_columns:
  - land_dim1
  - front_row
  - frontage_row
  - front_dim1

aggregation_function:
  frontage_ft: sum

supplements: US-OH-BE_property-belmontcounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: land
