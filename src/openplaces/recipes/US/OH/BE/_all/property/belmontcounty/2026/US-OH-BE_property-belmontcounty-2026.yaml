# Recipe: Belmont County, OH auditor roll (ISSG extract, Parcel table).
#
# The tables are XML (one element per row, fields as attributes),
# which the ingester's XML branch reads as text. The recipe has not
# been ingested. The ingester's own reader and
# _preprocess_recipe_data were run on the extract on 2026-09-12.
#
# Source: the auditor's "Property Data Downloads" page (ISSG Inc
# platform) links "Full Real Estate Data (CAMA & Tax in XML format)",
# /api/Document/PublicRecordsRequest.zip (173 MB, 60 XML tables plus
# File Layout.xlsx). A HEAD request returns 404; a GET works. The
# condensed Excel (GIS.zip) carries no room fields. The same ISSG
# layout as Lorain's SQLite copy (US-OH-LO_property-loraincounty-2026);
# three recipes read it: this roll (Parcel.xml), _appraisal (Parcel
# Appraisal.xml) and _dwelling (Parcel Dwelling.xml).
#
# Row shape, measured on the extract dated 2026-09-12: Parcel.xml
# holds 84,090 rows, all tax year 2025; Retired is 'YES' on 21,965,
# and the query keeps the 62,125 live parcels.
# One row is one property. The owner, taxpayer, lender and escrow
# attributes of Parcel.xml are never mapped.
#
# Join key. Parcel_Number is the formatted id '99-99999.999' and
# Parcel_Number_U the same 10 digits unformatted. Unlike most ISSG
# counties, OGRIP keeps Belmont's formatted form: Parcel_Number
# matches 99.5% of 200 sampled ids and Parcel_Number_U 0%, measured
# against the live OGRIP layer on a random sample. The bundled
# conversion for US-OH-BE is a regex that needs the formatted form,
# so parcel_id_assessor is Parcel_Number, untransformed. 8.0% of ids
# start with 0; reading as text keeps it.

description: >-
  Belmont County, OH auditor roll (ISSG extract, Parcel XML table):
  live parcels with tax year and acreage.

admin_id: US-OH-BE

entity:
  entity_type: property
  source:
    source_id: belmontcounty
    # Checked 2026-09-12: no terms, disclaimer, gate or fee on the
    # downloads page or the home page. The site's /public-records page
    # was not read.
    license: "unknown (no terms on the downloads page)"
    redistribution_restricted: null
    portal_url: "https://belmontcountyauditor.org/additional-links-property-data-downloads"
    download_url: "https://belmontcountyauditor.org/api/Document/PublicRecordsRequest.zip"
  version: "2026"

compressed_file_name: "PublicRecordsRequest.zip"
uncompressed_file_name: "Parcel.xml"

process_by:
  admin_level: 3

query: "Retired == 'NO'"

columns:
  parcel_id_assessor: Parcel_Number
  tax_year: Tax_Year
  land_area_ac: Acres

transformations:
  - type: unary
    operation: to_numeric
    input: tax_year
    output: tax_year
  - type: unary
    operation: to_numeric
    input: land_area_ac
    output: land_area_ac

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
