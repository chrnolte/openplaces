# Recipe: Belmont County, OH auditor roll, ISSG Parcel Dwelling
# Feature table. Supplement of US-OH-BE_property-belmontcounty-2026;
# see that recipe for the source and the join key.
#
# One row per sketched feature attached to a dwelling card. Type is
# 'CODE-DESCRIPTION' (some codes repeat the code as the description);
# Area is the feature's area in sqft. Capacity ("car capacity of
# garage") is 0 on every row, so no garage-space count is read.
#
# Read here, by code prefix so a county's own descriptions do not
# matter:
#   garages   any Type naming a GARAGE (attached frame, attached
#             masonry, 1 to 4 car basement garage)
#   carports  any Type naming a CARPORT (shed type, integral)
#   porches   OFP, EFP, OBP, EBP (open or enclosed, frame or brick),
#             their B-prefixed basement-level forms and 2nd-floor
#             forms (OFP2, EFP2, OBP2^2)
#   decks     DECK and PATIO
# Stoops (STPS), canopies, overhangs, attics, rec rooms and the
# SOLAR-SOLARIUM code (a room, not solar panels) are not read.
#
# garage_type keeps the source's Type text on garage rows. has_garage
# and has_carport are true where such a feature is recorded and null
# elsewhere: the table lists features present, never absent ones.
# Detached garages and carports are Parcel Improvement rows (see
# _improvements), which sets the same two flags; garage_area_sqft
# counts attached and basement garages only.
#
# MEASURED 2026-09-13: 88,790 feature rows over 25,448 parcels, keys
# 99.99% in the roll. On the 14,075 live land-use 510 properties: a
# feature row on 98.1%; an attached or basement garage on 40.8%
# (BSG1 2,077, AFG 1,997, BSG2 844, AMG 814, BSG3 13, BSG4 1); porch
# area > 0 on 86.5%; deck or patio area > 0 on 58.2%; carport 2.4%.

description: >-
  Belmont County, OH ISSG Parcel Dwelling Feature table: attached
  garage, carport, porch and deck features per property.

admin_id: US-OH-BE

entity:
  entity_type: property
  source:
    source_id: belmontcounty
    # Same download as the roll; see its terms note.
    license: "unknown (no terms on the downloads page)"
    redistribution_restricted: null
    portal_url: "https://belmontcountyauditor.org/additional-links-property-data-downloads"
    download_url: "https://belmontcountyauditor.org/api/Document/PublicRecordsRequest.zip"
  version: "2026"

compressed_file_name: "PublicRecordsRequest.zip"
uncompressed_file_name: "Parcel Dwelling Feature.xml"

process_by:
  admin_level: 3

columns:
  parcel_id_assessor: Parcel_Number

transformations:
  - type: unary
    operation: to_numeric
    input: Area
    output: feature_area
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*GARAGE", value: 1}
    default: 0
    output: garage_row
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "B?[OE][FB]P2?(\\^2)?-", value: 1}
    default: 0
    output: porch_row
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "(DECK|PATIO)-", value: 1}
    default: 0
    output: deck_row
  - type: unary
    operation: to_numeric
    input: garage_row
    output: garage_row
  - type: unary
    operation: to_numeric
    input: porch_row
    output: porch_row
  - type: unary
    operation: to_numeric
    input: deck_row
    output: deck_row
  - type: binary
    operation: multiply
    inputs: [feature_area, garage_row]
    output: garage_area_sqft
  - type: binary
    operation: multiply
    inputs: [feature_area, porch_row]
    output: porch_area_sqft
  - type: binary
    operation: multiply
    inputs: [feature_area, deck_row]
    output: deck_area_sqft
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*GARAGE", value: true}
    output: has_garage
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*CARPORT", value: true}
    output: has_carport
  # The garage codes found in the extract, kept verbatim; any other
  # Type leaves garage_type null.
  - type: remap
    input: Type
    mapping:
      "AFG-ATTACHED FRAME GARAGE": "AFG-ATTACHED FRAME GARAGE"
      "AMG-ATTACHED MASONRY GARAGE": "AMG-ATTACHED MASONRY GARAGE"
      "BSG1-1 CAR BASEMENT GARAGE": "BSG1-1 CAR BASEMENT GARAGE"
      "BSG2-2 CAR BASEMENT GARAGE": "BSG2-2 CAR BASEMENT GARAGE"
      "BSG3-3 CAR BASEMENT GARAGE": "BSG3-3 CAR BASEMENT GARAGE"
      "BSG4-4 CAR BASEMENT GARAGE": "BSG4-4 CAR BASEMENT GARAGE"
    output: garage_type

drop_columns:
  - feature_area
  - garage_row
  - porch_row
  - deck_row

columns_to_categorical:
  - garage_type

aggregation_function:
  garage_area_sqft: sum
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_garage: max
  has_carport: max
  garage_type: first

supplements: US-OH-BE_property-belmontcounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: features
