# Recipe: Belmont County, OH auditor roll, ISSG Parcel Dwelling table.
# Supplement of US-OH-BE_property-belmontcounty-2026; see that recipe
# for the source and the join key.
#
# Row shape (2025): 26,269 cards over 25,717 parcels (one parcel has
# 61); 99.98% of card keys are on the roll. Of the 14,075 live
# land-use 510 properties, 97.8% have bedrooms above 0, 98.3% baths,
# 98.2% rooms and 98.4% stories. Story_Height runs to 16.0.
#
# One row per dwelling card (Card 1-4). The ISSG dwelling layout is
# the same in every ISSG county: Bed_Rooms, Full_Baths, Half_Baths,
# Total_Rooms and Story_Height (decimal: 1.0, 1.5, 2.0, 3.0). XML
# delivers every attribute as text, so each count is cast to a
# number. Extra_Fixtures counts extra plumbing fixtures, not baths,
# and Plumbing is a category ('99-UNSPECIFIED' on every row here);
# neither is mapped. n_bathrooms folds full + 0.5 x half. No heating
# field: Parcel Dwelling Floor carries only per-floor heated and
# cooled shares (cooling is read in _floors).
#
# Building features (added 2026-09-13), codes verbatim: Living_Area
# (living_area_sqft, the card's finished living area),
# Fireplace_Openings (n_fireplaces; Fireplace_Stacks is not read),
# Year_Remodeled (renovation_year; 0 means none and reads null),
# Year_Effective (effective_year_built), Grade (quality_grade, e.g.
# 'C+5'), Condition (condition, e.g. 'AV-AVERAGE') and Type
# (building_style, e.g. '01-SINGLE FAMILY'). Years take the latest
# card, codes the first.
# MEASURED 2026-09-13 on the 14,075 live land-use 510 properties:
# living area > 0 on 98.6% (median 1,382 sqft), fireplaces > 0 on
# 33.6%, a remodel year on 15.0%, effective year, grade, condition
# and style on 98.6% each. Grades run AA to E with +/- steps (33
# values); conditions are 7 (AV-AVERAGE on 71.5% of these).
#
# year_built (Year_Built, earliest card) is on 98.6% of the same
# properties, median 1940. 0 (0.18% of cards) and one year before
# 1700 read null. 1900 holds 20.9% of cards, about ten times any
# other year, so it likely stands for "old", not a known year.
# n_dwellings is not mapped: Units_Designed is 1 on every card typed
# DUPLEX, TRIPLEX or 4-6 FAMILY, so it does not count units here.

description: >-
  Belmont County, OH ISSG Parcel Dwelling table: rooms, bedrooms, full
  and half baths and story height per card, summed to the property.

admin_id: US-OH-BE

entity:
  entity_type: property
  source:
    source_id: belmontcounty
    # Same download as the roll; see its terms note.
    license: "unknown (no terms on the downloads page)"
    redistribution_restricted: null
    portal_url: "https://belmontcountyauditor.org/additional-links-property-data-downloads"
    download_url: "https://belmontcountyauditor.org/api/Document/PublicRecordsRequest.zip"
  version: "2026"

compressed_file_name: "PublicRecordsRequest.zip"
uncompressed_file_name: "Parcel Dwelling.xml"

process_by:
  admin_level: 3

columns:
  parcel_id_assessor: Parcel_Number
  n_rooms: Total_Rooms
  n_bedrooms: Bed_Rooms
  n_bathrooms: Full_Baths
  n_half_bathrooms: Half_Baths
  n_stories: Story_Height
  living_area_sqft: Living_Area
  n_fireplaces: Fireplace_Openings
  renovation_year: Year_Remodeled
  effective_year_built: Year_Effective
  quality_grade: Grade
  condition: Condition
  building_style: Type
  year_built: Year_Built

transformations:
  # year_built: 0 is nulled by the registry placeholder; years before
  # 1700 or after 2026 are nulled here (1 where valid, else null).
  - type: unary
    operation: to_numeric
    input: year_built
    output: year_built
  - type: conditional
    operation: greater_equal
    input: year_built
    args: {threshold: 1700}
    output: year_after_min
  - type: conditional
    operation: less_equal
    input: year_built
    args: {threshold: 2026}
    output: year_before_max
  - type: binary
    operation: multiply
    inputs: [year_after_min, year_before_max]
    output: year_valid
  - type: remap
    input: year_valid
    mapping: {1: 1}
    output: year_valid
  - type: binary
    operation: multiply
    inputs: [year_built, year_valid]
    output: year_built
  - type: unary
    operation: to_numeric
    input: living_area_sqft
    output: living_area_sqft
  - type: unary
    operation: to_numeric
    input: n_fireplaces
    output: n_fireplaces
  - type: unary
    operation: to_numeric
    input: renovation_year
    output: renovation_year
  - type: unary
    operation: to_numeric
    input: effective_year_built
    output: effective_year_built
  - type: unary
    operation: to_numeric
    input: n_rooms
    output: n_rooms
  - type: unary
    operation: to_numeric
    input: n_bedrooms
    output: n_bedrooms
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms
  - type: unary
    operation: to_numeric
    input: n_half_bathrooms
    output: n_half_bathrooms
  - type: unary
    operation: to_numeric
    input: n_stories
    output: n_stories
  # n_bathrooms = full + 0.5 x half.
  - type: expression
    expression: "n_half_bathrooms * 0.5"
    inputs: [n_half_bathrooms]
    output: half_bathroom_equivalent
  - type: aggregate
    operation: sum
    inputs: [n_bathrooms, half_bathroom_equivalent]
    output: n_bathrooms

drop_columns:
  - half_bathroom_equivalent
  - year_after_min
  - year_before_max
  - year_valid

columns_to_categorical:
  - quality_grade
  - condition
  - building_style

aggregation_function:
  n_rooms: sum
  n_bedrooms: sum
  n_bathrooms: sum
  n_half_bathrooms: sum
  n_stories: max
  living_area_sqft: sum
  n_fireplaces: sum
  renovation_year: max
  effective_year_built: max
  quality_grade: first
  condition: first
  building_style: first
  year_built: min

supplements: US-OH-BE_property-belmontcounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: dwelling
