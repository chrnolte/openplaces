# Recipe: Medina County, OH auditor roll, GovernMax Building extract.
# Supplement of US-OH-ME_property-medinacounty-2026; see that recipe
# for the source route, the terms and the join key.
#
# Source item: CAMA2025p2026, the same zip as _dwelling; this recipe
# reads GovernmaxBuildingExtract (pipe-delimited): one row per section
# of a commercial (Marshall & Swift) building card. ElevatorCount is
# recorded on every section, 0 where there is none, so has_elevator
# is true where any section has an elevator and false otherwise.
# Class (D, C, S, P, A, B) is the Marshall & Swift construction class
# and is construction_description, kept as the county records it
# (curate translates it; it is not construction_type's vocabulary).
# The HVAC and sprinkler codes, whose lists are not in the item, are
# not mapped.
#
# MEASURED 2026-09-13: 8,750 sections over 3,784 properties, keys
# 100% in the roll; an elevator on 1.9% of sections. Only 8 live
# land-use 510 properties have a section here (none with an
# elevator): the flag matters for commercial and apartment classes.
# construction_description is on 100% of sections (D 3,830, C 3,210,
# S 1,234, P 413, A 37, B 26).

description: >-
  Medina County, OH GovernMax Building extract (commercial sections):
  elevator flag per property.

admin_id: US-OH-ME

entity:
  entity_type: property
  source:
    source_id: medinacounty
    # Same publisher and terms as the roll; see its terms note.
    license: >-
      unknown (no licence on the ArcGIS items; auditor download page terms
      unread)
    redistribution_restricted: null
    portal_url: "https://www.arcgis.com/home/item.html?id=81d7b42f6a004919825de3d047d5e09f"
    download_url: "https://www.arcgis.com/sharing/rest/content/items/81d7b42f6a004919825de3d047d5e09f/data"
  version: "2026"

compressed_file_name: "CAMA2025p2026.zip"
uncompressed_file_name: "GovernmaxBuildingExtract.txt"

process_by:
  admin_level: 3

delimiter: "|"
encoding: latin-1
csv_dtype: str

columns:
  parcel_id_assessor: PropertyNumber
  construction_description: Class

transformations:
  - type: string
    operation: replace
    input: parcel_id_assessor
    args: {old: "-", new: ""}
    output: parcel_id_admin3
  - type: unary
    operation: to_numeric
    input: ElevatorCount
    output: elevator_count
  - type: conditional
    operation: greater_than
    input: elevator_count
    args: {threshold: 0}
    output: elevator_row
  - type: remap
    input: elevator_row
    mapping: {0: false, 1: true}
    output: has_elevator

drop_columns:
  - elevator_count
  - elevator_row

columns_to_categorical:
  - construction_description

aggregation_function:
  has_elevator: max
  construction_description: first

supplements: US-OH-ME_property-medinacounty-2026

parcel_id_local:
  source: parcel_id_admin3
  kind: parcel

save_to:
  data_dir: cache
  filename: building
