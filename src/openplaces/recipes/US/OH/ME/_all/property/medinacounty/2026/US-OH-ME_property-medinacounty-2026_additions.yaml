# Recipe: Medina County, OH auditor roll, GovernMax Additions extract.
# Supplement of US-OH-ME_property-medinacounty-2026; see that recipe
# for the source route, the terms and the join key.
#
# Source item: CAMA2025p2026, the same zip as _dwelling; this recipe
# reads GovernmaxAdditionsExtract (pipe-delimited). One row per
# addition sketched onto a dwelling card: AdditionCode with its
# AdditionDescr, and BaseArea in sqft.
#
# Read here (codes matched whole):
#   garages   G (Garage), BsmtG (Basement Garage)
#   carports  CarP
#   porches   OMP, OFP, EFP, EMP (open or enclosed, masonry or frame)
#   decks     WdDk, WDDKVINYL (wood and vinyl deck), Pat (patio)
# Stoops (MStp), canopies (Cnpy), porticos, balconies, living-area
# additions (1sFrA and kin) and the 63x cost lines are not read.
#
# garage_type keeps the code (G or BsmtG). has_garage and has_carport
# are true where such an addition is recorded and null elsewhere: the
# table lists additions present, never absent ones. Detached garages
# and carports are OtherImprovements rows (see _improvements), which
# sets the same two flags; garage_area_sqft counts attached and
# basement garages only. Short codes arrive padded with a trailing
# space and are stripped first.
#
# MEASURED 2026-09-13: 226,966 rows over 67,702 properties, keys 100%
# in the roll. On the 45,167 live land-use 510 properties: garage
# area > 0 and has_garage 83.2% (all code G; BsmtG occurs once in the
# table); porch area > 0 71.7%; deck or patio area > 0 82.3%;
# carport 0.3%.

description: >-
  Medina County, OH GovernMax Additions extract: attached garage,
  carport, porch and deck additions per property.

admin_id: US-OH-ME

entity:
  entity_type: property
  source:
    source_id: medinacounty
    # Same publisher and terms as the roll; see its terms note.
    license: >-
      unknown (no licence on the ArcGIS items; auditor download page terms
      unread)
    redistribution_restricted: null
    portal_url: "https://www.arcgis.com/home/item.html?id=81d7b42f6a004919825de3d047d5e09f"
    download_url: "https://www.arcgis.com/sharing/rest/content/items/81d7b42f6a004919825de3d047d5e09f/data"
  version: "2026"

compressed_file_name: "CAMA2025p2026.zip"
uncompressed_file_name: "GovernmaxAdditionsExtract.txt"

process_by:
  admin_level: 3

delimiter: "|"
encoding: latin-1
csv_dtype: str

columns:
  parcel_id_assessor: PropertyNumber

transformations:
  - type: string
    operation: replace
    input: parcel_id_assessor
    args: {old: "-", new: ""}
    output: parcel_id_admin3
  - type: unary
    operation: to_numeric
    input: BaseArea
    output: addition_area
  # Short codes arrive padded with a trailing space ('G ', 'OMP ').
  - type: string
    operation: strip
    input: AdditionCode
    output: addition_code
  - type: remap_pattern
    input: addition_code
    patterns:
      - {pattern: "(G|BsmtG)$", value: 1}
    default: 0
    output: garage_row
  - type: remap_pattern
    input: addition_code
    patterns:
      - {pattern: "(OMP|OFP|EFP|EMP)$", value: 1}
    default: 0
    output: porch_row
  - type: remap_pattern
    input: addition_code
    patterns:
      - {pattern: "(WdDk|WDDKVINYL|Pat)$", value: 1}
    default: 0
    output: deck_row
  - type: unary
    operation: to_numeric
    input: garage_row
    output: garage_row
  - type: unary
    operation: to_numeric
    input: porch_row
    output: porch_row
  - type: unary
    operation: to_numeric
    input: deck_row
    output: deck_row
  - type: binary
    operation: multiply
    inputs: [addition_area, garage_row]
    output: garage_area_sqft
  - type: binary
    operation: multiply
    inputs: [addition_area, porch_row]
    output: porch_area_sqft
  - type: binary
    operation: multiply
    inputs: [addition_area, deck_row]
    output: deck_area_sqft
  - type: remap
    input: addition_code
    mapping: {G: true, BsmtG: true}
    output: has_garage
  - type: remap
    input: addition_code
    mapping: {CarP: true}
    output: has_carport
  - type: remap
    input: addition_code
    mapping: {G: G, BsmtG: BsmtG}
    output: garage_type

drop_columns:
  - addition_area
  - addition_code
  - garage_row
  - porch_row
  - deck_row

columns_to_categorical:
  - garage_type

aggregation_function:
  garage_area_sqft: sum
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_garage: max
  has_carport: max
  garage_type: first

supplements: US-OH-ME_property-medinacounty-2026

parcel_id_local:
  source: parcel_id_admin3
  kind: parcel

save_to:
  data_dir: cache
  filename: additions
