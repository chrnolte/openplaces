# Recipe: Tuscarawas County, OH auditor roll, ISSG Parcel Dwelling Floor
# table. Supplement of US-OH-TU_property-tuscarawascounty-2021; see that
# recipe for the source and the join key.
#
# One row per floor of a dwelling card. Floor_Type is First Floor, Full,
# 1/2, 1/4 or 3/4 Upper Floor, Attic, Basement, Crawl or Slab. Area is
# the floor's area and Living_Area its finished living area (sqft);
# Cool_Factor is the share of the floor that is cooled, 0 to 100 (the
# layout's words: 'the factor of the area that is cooled').
#
# Basement. basement_area_sqft sums Area and basement_finished_area_sqft
# sums Living_Area over Basement rows; other rows add 0. has_basement is
# true on a Basement row and false on a Crawl or Slab row, null
# otherwise. How often Tuscarawas records crawl and slab rows is not
# known (see below). foundation_description keeps the lowest-level
# Floor_Type (Basement, Crawl or Slab) verbatim, the first listed per
# property; other floor types leave it null.
#
# Cooling. has_central_air is true where any floor has a cooled share
# above 0 and false where every floor records 0. ISSG says 'cooled', not
# 'central'; the source does not name the system.
#
# NOT VALIDATED: the only free Tuscarawas extract is on FTP, which
# neither the downloader nor this pass may fetch, so this recipe follows
# the ISSG layout the other ISSG counties share and has never been run.
# Check it on the first ingest.

description: >-
  Tuscarawas County, OH ISSG Parcel Dwelling Floor table: basement area,
  finished basement area, foundation and basement and cooling flags per
  property.

admin_id: US-OH-TU

entity:
  entity_type: property
  source:
    source_id: tuscarawascounty
    # Same download as the roll; see its terms note.
    license: >-
      unknown (as-is, reference only, no liability; user indemnifies the
      county)
    terms_url: "https://auditor.co.tuscarawas.oh.us/Disclaimer"
    redistribution_restricted: null
    portal_url: "ftp://gis.co.tuscarawas.oh.us/GIS/"
    download_url: "ftp://gis.co.tuscarawas.oh.us/GIS/Public/ExtractXML.zip"
  version: "2021"

compressed_file_name: "ExtractXML.zip"
uncompressed_file_name: "Parcel Dwelling Floor.xml"

process_by:
  admin_level: 3

columns:
  parcel_id_assessor: Parcel_Number

transformations:
  - type: unary
    operation: to_numeric
    input: Area
    output: floor_area
  - type: unary
    operation: to_numeric
    input: Living_Area
    output: floor_living_area
  - type: unary
    operation: to_numeric
    input: Cool_Factor
    output: cool_factor
  # 1 on Basement rows, 0 on every other floor.
  - type: remap
    input: Floor_Type
    mapping:
      "Basement": 1
    default: 0
    output: basement_row
  - type: binary
    operation: multiply
    inputs: [floor_area, basement_row]
    output: basement_area_sqft
  - type: binary
    operation: multiply
    inputs: [floor_living_area, basement_row]
    output: basement_finished_area_sqft
  # Other floor types leave the flag null.
  - type: remap
    input: Floor_Type
    mapping:
      "Basement": true
      "Crawl": false
      "Slab": false
    output: has_basement
  - type: remap
    input: Floor_Type
    mapping:
      "Basement": "Basement"
      "Crawl": "Crawl"
      "Slab": "Slab"
    output: foundation_description
  - type: conditional
    operation: greater_than
    input: cool_factor
    args: {threshold: 0}
    output: cooled_row
  - type: remap
    input: cooled_row
    mapping:
      0: false
      1: true
    output: has_central_air

drop_columns:
  - floor_area
  - floor_living_area
  - cool_factor
  - basement_row
  - cooled_row

columns_to_categorical:
  - foundation_description

aggregation_function:
  basement_area_sqft: sum
  basement_finished_area_sqft: sum
  has_basement: max
  has_central_air: max
  foundation_description: first

supplements: US-OH-TU_property-tuscarawascounty-2021

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: floors
