# Recipe: Ottawa County, OH auditor roll, ISSG Parcel Dwelling
# Feature table. Supplement of US-OH-OT_property-ottawacounty-2026;
# see that recipe for the source, the terms and the join key.
#
# One row per sketched feature attached to a dwelling card and tax
# year (2024 and 2025 stacked; the query keeps the latest). Type is
# 'CODE-DESCRIPTION' (19 codes); Area is the feature's area in sqft.
# Capacity ("car capacity of garage") is above 0 on 0.3% of rows, so
# no garage-space count is read.
#
# Read here, by code:
#   garages   FRG, MSG, BG (frame, masonry, basement garage)
#   carports  CAR (open carport)
#   porches   OFP, EFP, OMP, EMP (open or enclosed, frame or masonry)
#   decks     WDK (wood decks), PAT, STPAT (concrete, brick or
#             stamped patio)
# Stoops, sunrooms, canopies, overhangs, attached utility buildings,
# boat houses and greenhouses are not read.
#
# garage_type keeps the source's Type text on garage rows. has_garage
# and has_carport are true where such a feature is recorded and null
# elsewhere: the table lists features present, never absent ones.
# Detached garages and carports are Parcel Improvement rows (see
# _improvements), which sets the same two flags; garage_area_sqft
# counts attached and basement garages only.
#
# MEASURED 2026-09-13: 65,798 feature rows (2025) over 21,962
# parcels, keys 100.00% in the roll. On the 17,904 live land-use 510
# properties: a feature row on 97.4%; a garage on 51.6% (FRG 7,651,
# MSG 1,437, BG 155; median area 288 sqft); porch area > 0 on 73.5%;
# deck or patio area > 0 on 66.7%; carport 1.3%.

description: >-
  Ottawa County, OH ISSG Parcel Dwelling Feature table: attached
  garage, carport, porch and deck features per property.

admin_id: US-OH-OT

entity:
  entity_type: property
  source:
    source_id: ottawacounty
    # Same download as the roll; see its terms note.
    license: >-
      unknown (as-is, reference only, no liability; users agree to indemnify
      Ottawa County)
    terms_url: "https://auditor.co.ottawa.oh.us/Disclaimer"
    redistribution_restricted: null
    portal_url: "https://auditor.co.ottawa.oh.us/additional-links-property-data-downloads"
    download_url: "https://auditor.co.ottawa.oh.us/api/Document/PublicRecordsExtract.zip"
  version: "2026"

compressed_file_name: "PublicRecordsExtract.zip"
uncompressed_file_name: "Parcel Dwelling Feature.xlsx"

process_by:
  admin_level: 3

csv_dtype: str
# The ingester's read_excel default header='infer' is rejected by
# pandas; the header is the first row.
header: 0

query: "`Tax Year` == `Tax Year`.max()"

columns:
  parcel_id_assessor: Parcel Number U

transformations:
  - type: unary
    operation: to_numeric
    input: Area
    output: feature_area
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "(FRG|MSG|BG)-", value: 1}
    default: 0
    output: garage_row
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "[OE][FM]P-", value: 1}
    default: 0
    output: porch_row
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "(WDK|PAT|STPAT)-", value: 1}
    default: 0
    output: deck_row
  - type: unary
    operation: to_numeric
    input: garage_row
    output: garage_row
  - type: unary
    operation: to_numeric
    input: porch_row
    output: porch_row
  - type: unary
    operation: to_numeric
    input: deck_row
    output: deck_row
  - type: binary
    operation: multiply
    inputs: [feature_area, garage_row]
    output: garage_area_sqft
  - type: binary
    operation: multiply
    inputs: [feature_area, porch_row]
    output: porch_area_sqft
  - type: binary
    operation: multiply
    inputs: [feature_area, deck_row]
    output: deck_area_sqft
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "(FRG|MSG|BG)-", value: true}
    output: has_garage
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "CAR-", value: true}
    output: has_carport
  # The garage codes found in the extract, kept verbatim; any other
  # Type leaves garage_type null.
  - type: remap
    input: Type
    mapping:
      "FRG-FRAME GARAGE": "FRG-FRAME GARAGE"
      "MSG-MASONRY GARAGE": "MSG-MASONRY GARAGE"
      "BG-BASEMENT GARAGE": "BG-BASEMENT GARAGE"
    output: garage_type

drop_columns:
  - feature_area
  - garage_row
  - porch_row
  - deck_row

columns_to_categorical:
  - garage_type

aggregation_function:
  garage_area_sqft: sum
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_garage: max
  has_carport: max
  garage_type: first

supplements: US-OH-OT_property-ottawacounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: features
