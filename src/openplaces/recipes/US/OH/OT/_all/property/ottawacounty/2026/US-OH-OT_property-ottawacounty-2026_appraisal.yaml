# Recipe: Ottawa County, OH auditor roll, ISSG Parcel Appraisal table.
# Supplement of US-OH-OT_property-ottawacounty-2026; see that recipe
# for the source, the terms and the join key.
#
# One row per parcel and tax year (2024 and 2025 stacked); the query
# keeps the latest year. Land Use Code is the Ohio DTE land-use code;
# Land Use (its description) and Class (its broad group) are not
# mapped. Total Appraised Land and Total Appraised Improvement are the
# appraised values. Retired parcels are in this table too and join to
# nothing on the roll. Neighborhood is the assessor's valuation
# neighborhood (tax_neighborhood_code, 1,040 values), on 100% of the
# 17,904 live land-use 510 properties (measured 2026-09-13).

description: >-
  Ottawa County, OH ISSG Parcel Appraisal table: land-use code and
  appraised land and improvement value per property.

admin_id: US-OH-OT

entity:
  entity_type: property
  source:
    source_id: ottawacounty
    # Same download as the roll; see its terms note.
    license: >-
      unknown (as-is, reference only, no liability; users agree to indemnify
      Ottawa County)
    terms_url: "https://auditor.co.ottawa.oh.us/Disclaimer"
    redistribution_restricted: null
    portal_url: "https://auditor.co.ottawa.oh.us/additional-links-property-data-downloads"
    download_url: "https://auditor.co.ottawa.oh.us/api/Document/PublicRecordsExtract.zip"
  version: "2026"

compressed_file_name: "PublicRecordsExtract.zip"
uncompressed_file_name: "Parcel Appraisal.xlsx"

process_by:
  admin_level: 3

csv_dtype: str
# The ingester's read_excel default header='infer' is rejected by
# pandas; the header is the first row.
header: 0

query: "`Tax Year` == `Tax Year`.max()"

columns:
  parcel_id_assessor: Parcel Number U
  use_group_code: Land Use Code
  land_value: Total Appraised Land
  improvement_value: Total Appraised Improvement
  tax_neighborhood_code: Neighborhood

transformations:
  - type: unary
    operation: to_numeric
    input: land_value
    output: land_value
  - type: unary
    operation: to_numeric
    input: improvement_value
    output: improvement_value

columns_to_categorical:
  - use_group_code

aggregation_function:
  land_value: sum
  improvement_value: sum
  tax_neighborhood_code: first

supplements: US-OH-OT_property-ottawacounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: appraisal
