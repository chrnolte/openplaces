# Recipe: Knox County, OH auditor roll, GovernMax Land table.
# Supplement of US-OH-KN_property-knoxcounty-2026; see that recipe for
# the source, the terms and the join key.
#
# MVP1_OH_Land.csv from the same CAMADatabase.zip: one row per land
# line (141,314 over all 44,275 live parcels). LandType is a code
# listed in MVP1_OH_Codes.csv (category 'LandCode'): F 'Front Lot'
# and F2 to F5 'Frontage' are the front-foot lines, RL 'Rear Lot',
# and the rest acreage types (homesite, woods, tillable, road, ...).
# ActualFrontage is filled on front-foot and rear-lot lines only.
# frontage_ft sums ActualFrontage over the F to F5 lines, so it is
# street frontage; rear lots add nothing, and a parcel with no
# front-foot line stays null.
#
# MEASURED 2026-09-13: keys 100% in the roll; frontage_ft on 52.2%
# of the 16,118 live land-use 510 properties (median 67 ft, p99 190
# ft); the rest are valued as acreage (homesite and residual lines).

description: >-
  Knox County, OH GovernMax Land table: street frontage in feet from
  front-foot land lines, per parcel.

admin_id: US-OH-KN

entity:
  entity_type: property
  source:
    source_id: knoxcounty
    # Same download as the roll; see its terms note.
    license: >-
      unknown (no terms next to the auditor's download link; Beacon terms
      unread)
    redistribution_restricted: null
    portal_url: "https://www.knoxcountyauditor.org/"
    download_url: "https://beaconfiledata.blob.core.windows.net/knoxcountyoh/downloads/CAMADatabase.zip?sv=2020-10-02&st=2023-04-11T20%3A18%3A41Z&se=2050-01-01T21%3A18%3A00Z&sr=b&sp=r&sig=d%2BoCtdXId7ZHT4jv2oW1mWSdzuAFGAu4%2FPfCxho6zkI%3D"
  version: "2026"

compressed_file_name: "CAMADatabase.zip"
uncompressed_file_name: "MVP1_OH_Land.csv"

process_by:
  admin_level: 3

encoding: latin-1
csv_dtype: str

columns:
  parcel_id_assessor: PropertyNumber

transformations:
  - type: string
    operation: replace
    input: parcel_id_assessor
    args: {old: "-", new: ""}
    output: parcel_id_admin3
  - type: string
    operation: replace
    input: parcel_id_admin3
    args: {old: ".", new: ""}
    output: parcel_id_admin3
  - type: string
    operation: replace
    input: parcel_id_admin3
    args: {old: " ", new: ""}
    output: parcel_id_admin3
  - type: unary
    operation: to_numeric
    input: ActualFrontage
    output: actual_frontage
  # 1 on front-foot lines; other lines null.
  - type: remap
    input: LandType
    mapping: {F: 1, F2: 1, F3: 1, F4: 1, F5: 1}
    output: front_row
  - type: binary
    operation: multiply
    inputs: [actual_frontage, front_row]
    output: frontage_ft

drop_columns:
  - actual_frontage
  - front_row

aggregation_function:
  frontage_ft: sum

supplements: US-OH-KN_property-knoxcounty-2026

parcel_id_local:
  source: parcel_id_admin3
  kind: parcel

save_to:
  data_dir: cache
  filename: land
