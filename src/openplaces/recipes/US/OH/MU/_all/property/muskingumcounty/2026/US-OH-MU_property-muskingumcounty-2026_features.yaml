# Recipe: Muskingum County, OH auditor roll, ISSG Parcel Dwelling
# Feature table. Supplement of US-OH-MU_property-muskingumcounty-2026;
# see that recipe for the unlinked endpoint, the terms and the key.
#
# One row per sketched feature attached to a dwelling card (all tax
# year 2025; the query keeps the latest year). Type is
# 'CODE-DESCRIPTION' (41 codes); Area is the feature's area in sqft
# and Capacity the "car capacity of garage".
#
# Read here, by code:
#   garages   GR1 to GR9 (frame, brick, stone, basement, integral,
#             concrete block, other)
#   carports  CP1 (frame carport)
#   porches   PR1 to PR5 (open or enclosed, frame or masonry porch;
#             portico)
#   decks     WD1 (wood deck), PT1 to PT3 (concrete, brick, stone
#             patio), TR2 (masonry terrace)
# Stoops, overhangs, canopies, bays, attached sheds, roof extensions,
# balconies, breezeways, basement entrances and greenhouses are not
# read.
#
# n_garage_spaces sums Capacity over garage rows only (carports carry
# a capacity too, not counted); Capacity is 0 on about 3% of garage
# rows, which then add 0. garage_type keeps the source's Type text on
# garage rows. has_garage and has_carport are true where such a
# feature is recorded and null elsewhere: the table lists features
# present, never absent ones. Detached garages and carports are
# Parcel Improvement rows (see _improvements), which sets the same
# two flags; garage_area_sqft and n_garage_spaces count attached,
# integral and basement garages only.
#
# MEASURED 2026-09-13: 98,239 feature rows over 29,927 parcels, keys
# 99.99% in the roll. On the 16,394 live land-use 510 properties: a
# feature row on 93.0%; a garage on 43.2% (GR1 4,705, GR4 1,065, GR5
# 647, GR2 549, GR3 51, GR6 50, GR9 8); garage area > 0 on 36.3%;
# garage spaces > 0 on 42.2% (p99 3); porch area > 0 on 76.6%; deck
# or patio area > 0 on 58.6%; carport 2.5%.

description: >-
  Muskingum County, OH ISSG Parcel Dwelling Feature table: attached
  garage, garage spaces, carport, porch and deck features.

admin_id: US-OH-MU

entity:
  entity_type: property
  source:
    source_id: muskingumcounty
    # Same download as the roll; see its terms note.
    license: >-
      unknown (as-is, reference only, no liability; users agree to
      indemnify Muskingum County)
    terms_url: "https://www.muskingumcountyauditor.org/Disclaimer"
    redistribution_restricted: null
    portal_url: "https://www.muskingumcountyauditor.org/"
    download_url: "https://www.muskingumcountyauditor.org/api/Document/PublicRecordsExtract.zip"
  version: "2026"

compressed_file_name: "PublicRecordsExtract.zip"
uncompressed_file_name: "Parcel Dwelling Feature.xlsx"

process_by:
  admin_level: 3

csv_dtype: str
# The ingester's read_excel default header='infer' is rejected by
# pandas; the header is the first row.
header: 0

query: "`Tax Year` == `Tax Year`.max()"

columns:
  parcel_id_assessor: Parcel Number

transformations:
  - type: unary
    operation: to_numeric
    input: Area
    output: feature_area
  - type: unary
    operation: to_numeric
    input: Capacity
    output: capacity
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "GR[0-9]-", value: 1}
    default: 0
    output: garage_row
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "PR[1-5]-", value: 1}
    default: 0
    output: porch_row
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "(WD1|PT[1-3]|TR2)-", value: 1}
    default: 0
    output: deck_row
  - type: unary
    operation: to_numeric
    input: garage_row
    output: garage_row
  - type: unary
    operation: to_numeric
    input: porch_row
    output: porch_row
  - type: unary
    operation: to_numeric
    input: deck_row
    output: deck_row
  - type: binary
    operation: multiply
    inputs: [feature_area, garage_row]
    output: garage_area_sqft
  - type: binary
    operation: multiply
    inputs: [capacity, garage_row]
    output: n_garage_spaces
  - type: binary
    operation: multiply
    inputs: [feature_area, porch_row]
    output: porch_area_sqft
  - type: binary
    operation: multiply
    inputs: [feature_area, deck_row]
    output: deck_area_sqft
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "GR[0-9]-", value: true}
    output: has_garage
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "CP[0-9]-", value: true}
    output: has_carport
  # The garage codes found in the extract, kept verbatim; any other
  # Type leaves garage_type null.
  - type: remap
    input: Type
    mapping:
      "GR1-GARAGE FRAME": "GR1-GARAGE FRAME"
      "GR2-GARAGE BRICK": "GR2-GARAGE BRICK"
      "GR3-GARAGE STONE": "GR3-GARAGE STONE"
      "GR4-BASEMENT GARAGE": "GR4-BASEMENT GARAGE"
      "GR5-GARAGE INTEGRAL": "GR5-GARAGE INTEGRAL"
      "GR6-GARAGE CONCRETE BLOCK": "GR6-GARAGE CONCRETE BLOCK"
      "GR9-GARAGE OTHER": "GR9-GARAGE OTHER"
    output: garage_type

drop_columns:
  - feature_area
  - capacity
  - garage_row
  - porch_row
  - deck_row

columns_to_categorical:
  - garage_type

aggregation_function:
  garage_area_sqft: sum
  n_garage_spaces: sum
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_garage: max
  has_carport: max
  garage_type: first

supplements: US-OH-MU_property-muskingumcounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: features
