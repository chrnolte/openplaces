# Recipe: Summit County, OH CAMA roll, iasWorld OBY extract
# (SC712_OBY). Supplement of US-OH-SU_property-summitcounty-2026; see
# that recipe for the source and the join key.
#
# One row per yard item: CODE (the Fiscal Office's AEDIT extract lists
# the OBY codes), AREA in sqft and UNT (number of identical units).
# The G10 to G52 codes are garages (AEDIT lists them as GARAGE) priced
# by unit: their AREA is 1, so no garage area is read here.
#
# n_outbuildings counts rows whose code is a detached accessory
# structure, times UNT: garages (G10-G52, RG1, RG2, RG5), utility
# sheds (RS1-RS3), sheds (SH1-SH6), pole buildings (AP1-AP6), barns
# (AB1, AB2, AD1), corn cribs (AC1-AC6), grain bins (AG1, AG2), AH1-
# AH6, lean-to (AL1), detached AM3 and AM4, quonset (AQ1), granary
# (AR1), silos (AS1-AS6), prefabricated building (AX1), boathouses
# (BH1, BH2, RB1, RB2), bath house (BT2), greenhouses (GH1-GH5),
# gazebo (GZ1), kennels (KE1), summer kitchen (SK1) and carport (RC1).
# Paving, fences, pools, decks, porches, patios, canopies, courts,
# mobile homes and commercial items are not counted.
#
# deck_area_sqft sums AREA over wood decks (WD1, SM5) and concrete
# patios (LP3); Summit records decks here, not as additions. WD2 and
# RME are not in the code list and are not read. Porches here (PR1,
# PR2, SM1, SM7) are not added to porch area, which _additions
# carries.
#
# Flags, true where the item is recorded and null elsewhere (the
# table lists what is present): has_pool (RP1-RP5), has_garage
# (garage codes above) and has_carport (RC1). _additions sets the
# garage and carport flags for attached ones.
#
# MEASURED 2026-09-13: 192,714 rows over 139,998 parcels, keys 100% in
# the roll. On the 175,578 land-use 510 properties: an OBY row on
# 63.6%; n_outbuildings > 0 on 39.3% (median 1); deck or patio area
# > 0 on 32.5%; detached garage 31.9%; pool 1.9%; carport 1.7%.

description: >-
  Summit County, OH iasWorld OBY extract: outbuilding count, deck and
  patio area, and pool, detached garage and carport flags.

admin_id: US-OH-SU

entity:
  entity_type: property
  source:
    source_id: summitcounty
    # Same page and terms as the roll; see its terms note.
    license: "unknown (no terms on the Fiscal Office data-downloads page)"
    redistribution_restricted: null
    portal_url: "https://fiscaloffice.summitoh.net/data-downloads"
    download_url: "https://fiscaloffice.summitoh.net/sites/default/files/assets/forms/SC712_OBY.zip"
  version: "2026"

compressed_file_name: "SC712_OBY.zip"
uncompressed_file_name: "SC712_OBY.CSV"

process_by:
  admin_level: 3

encoding: latin-1
csv_dtype: str

columns:
  parcel_id_assessor: PARCEL

transformations:
  - type: unary
    operation: to_numeric
    input: UNT
    output: oby_units
  - type: unary
    operation: to_numeric
    input: AREA
    output: oby_area
  - type: remap_pattern
    input: CODE
    patterns:
      - {pattern: "(G[1-5][02]|RG[125]|RS[1-3]|SH[1-6]|AP[1-6])$", value: 1}
      - {pattern: "(AB[12]|AD1|AC[1-6]|AG[12]|AH[1-6]|AL1|AM[34])$", value: 1}
      - {pattern: "(AQ1|AR1|AS[1-6]|AX1|BH[12]|RB[12]|BT2|GH[1-5])$", value: 1}
      - {pattern: "(GZ1|KE1|SK1|RC1)$", value: 1}
    default: 0
    output: outbuilding_row
  - type: unary
    operation: to_numeric
    input: outbuilding_row
    output: outbuilding_row
  - type: binary
    operation: multiply
    inputs: [outbuilding_row, oby_units]
    output: n_outbuildings
  - type: remap
    input: CODE
    mapping: {WD1: 1, SM5: 1, LP3: 1}
    default: 0
    output: deck_row
  - type: binary
    operation: multiply
    inputs: [oby_area, deck_row]
    output: deck_area_sqft
  - type: remap_pattern
    input: CODE
    patterns:
      - {pattern: "RP[1-5]$", value: true}
    output: has_pool
  - type: remap_pattern
    input: CODE
    patterns:
      - {pattern: "(G[1-5][02]|RG[125])$", value: true}
    output: has_garage
  - type: remap
    input: CODE
    mapping: {RC1: true}
    output: has_carport

drop_columns:
  - oby_units
  - oby_area
  - outbuilding_row
  - deck_row

aggregation_function:
  n_outbuildings: sum
  deck_area_sqft: sum
  has_pool: max
  has_garage: max
  has_carport: max

supplements: US-OH-SU_property-summitcounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: oby
