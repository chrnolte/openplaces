# Recipe: Summit County, OH CAMA roll, iasWorld LAND extract
# (SC709_LAND). Supplement of US-OH-SU_property-summitcounty-2026; see
# that recipe for the source and the join key.
#
# One row per land line. LTYP is the pricing method (F front foot, A
# acreage, S square foot); FROACT is the actual frontage in feet,
# filled on front-foot lines only (FROEF is the effective frontage,
# DPTH the depth). frontage_ft sums FROACT over a parcel's F lines; a
# parcel priced by acreage or square foot has no frontage recorded
# and stays null. The file's parcel column is named 'PARCEL ' (with
# a trailing space).
#
# MEASURED 2026-09-13: 281,562 lines over 257,510 parcels (171,744
# front-foot lines), keys 100% in the roll; frontage on 79.3% of the
# 175,578 land-use 510 properties (median 65 ft, p99 187 ft).

description: >-
  Summit County, OH iasWorld LAND extract: actual street frontage in
  feet from front-foot land lines, per parcel.

admin_id: US-OH-SU

entity:
  entity_type: property
  source:
    source_id: summitcounty
    # Same page and terms as the roll; see its terms note.
    license: "unknown (no terms on the Fiscal Office data-downloads page)"
    redistribution_restricted: null
    portal_url: "https://fiscaloffice.summitoh.net/data-downloads"
    download_url: "https://fiscaloffice.summitoh.net/sites/default/files/assets/forms/SC709_LAND.zip"
  version: "2026"

compressed_file_name: "SC709_LAND.zip"
uncompressed_file_name: "SC709_LAND.CSV"

process_by:
  admin_level: 3

encoding: latin-1
csv_dtype: str

columns:
  parcel_id_assessor: "PARCEL "

transformations:
  - type: unary
    operation: to_numeric
    input: FROACT
    output: land_front
  # 1 on front-foot lines; other lines null.
  - type: remap
    input: LTYP
    mapping: {F: 1}
    output: front_row
  - type: binary
    operation: multiply
    inputs: [land_front, front_row]
    output: frontage_ft

drop_columns:
  - land_front
  - front_row

aggregation_function:
  frontage_ft: sum

supplements: US-OH-SU_property-summitcounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: land
