# Recipe: Summit County, OH CAMA roll, iasWorld ADDN extract
# (SC711_ADDN). Supplement of US-OH-SU_property-summitcounty-2026; see
# that recipe for the source and the join key.
#
# One row per addition line of a dwelling card: LOWER, FIRST and
# SECOND hold the addition code at each level and AREA the line's
# area in sqft. The file's parcel column is 'PARCEL ' (with a
# trailing space).
#
# Codes. Summit publishes no addition code table (its AEDIT extract
# lists none). The codes read here are Tyler iasWorld's residential
# addition codes as Clermont County's AA407 extract publishes them
# (RCADDN), and Summit's areas agree: median first-floor area 440
# sqft for 13 (frame garage), 497 for 23 (masonry garage), 84 and 140
# for 11 and 12 (open and enclosed frame porch), 70 and 140 for 21
# and 22 (open and enclosed masonry porch) and 256 for 30 (carport).
#   garage   13, 23, 43 (integral), at every level
#   porch    11, 12, 21, 22, 45 (screen porch), at every level
#   carport  30 (first floor)
# Codes 29 and 39 (12,442 and 2,394 first-floor lines) have no
# published meaning and are not read. Decks are not read here: Summit
# records them as OBY items (see _oby, which carries deck area).
#
# garage_type keeps the first-floor garage code. has_garage and
# has_carport are true where such a line is recorded and null
# elsewhere. Detached garages and carports are OBY rows (see _oby),
# which sets the same two flags.
#
# MEASURED 2026-09-13: 715,412 lines over 196,323 parcels, keys 100%
# in the roll. On the 175,578 land-use 510 properties: attached
# garage on 50.9% (first-floor 13 on 44.2%, 23 on 6.3%; median area
# 231 sqft over all properties with a card); porch area > 0 on
# 72.6%; carport 0.6%.

description: >-
  Summit County, OH iasWorld ADDN extract: attached garage and porch
  area and garage and carport flags per property.

admin_id: US-OH-SU

entity:
  entity_type: property
  source:
    source_id: summitcounty
    # Same page and terms as the roll; see its terms note.
    license: "unknown (no terms on the Fiscal Office data-downloads page)"
    redistribution_restricted: null
    portal_url: "https://fiscaloffice.summitoh.net/data-downloads"
    download_url: "https://fiscaloffice.summitoh.net/sites/default/files/assets/forms/SC711_ADDN.zip"
  version: "2026"

compressed_file_name: "SC711_ADDN.zip"
uncompressed_file_name: "SC711_ADDN.CSV"

process_by:
  admin_level: 3

encoding: latin-1
csv_dtype: str

columns:
  parcel_id_assessor: "PARCEL "

transformations:
  - type: unary
    operation: to_numeric
    input: AREA
    output: addn_area
  - type: remap
    input: LOWER
    mapping: {"13": 1, "23": 1, "43": 1}
    default: 0
    output: garage_lower
  - type: remap
    input: FIRST
    mapping: {"13": 1, "23": 1, "43": 1}
    default: 0
    output: garage_first
  - type: remap
    input: SECOND
    mapping: {"13": 1, "23": 1, "43": 1}
    default: 0
    output: garage_second
  - type: remap
    input: LOWER
    mapping: {"11": 1, "12": 1, "21": 1, "22": 1, "45": 1}
    default: 0
    output: porch_lower
  - type: remap
    input: FIRST
    mapping: {"11": 1, "12": 1, "21": 1, "22": 1, "45": 1}
    default: 0
    output: porch_first
  - type: remap
    input: SECOND
    mapping: {"11": 1, "12": 1, "21": 1, "22": 1, "45": 1}
    default: 0
    output: porch_second
  - type: aggregate
    operation: sum
    inputs: [garage_lower, garage_first, garage_second]
    output: garage_levels
  - type: aggregate
    operation: sum
    inputs: [porch_lower, porch_first, porch_second]
    output: porch_levels
  - type: binary
    operation: multiply
    inputs: [addn_area, garage_levels]
    output: garage_area_sqft
  - type: binary
    operation: multiply
    inputs: [addn_area, porch_levels]
    output: porch_area_sqft
  - type: conditional
    operation: greater_than
    input: garage_levels
    args: {threshold: 0}
    output: garage_line
  # Lines with no garage leave the flag null.
  - type: remap
    input: garage_line
    mapping: {1: true}
    output: has_garage
  - type: remap
    input: FIRST
    mapping: {"30": true}
    output: has_carport
  - type: remap
    input: FIRST
    mapping: {"13": "13", "23": "23", "43": "43"}
    output: garage_type

drop_columns:
  - addn_area
  - garage_lower
  - garage_first
  - garage_second
  - porch_lower
  - porch_first
  - porch_second
  - garage_levels
  - porch_levels
  - garage_line

columns_to_categorical:
  - garage_type

aggregation_function:
  garage_area_sqft: sum
  porch_area_sqft: sum
  has_garage: max
  has_carport: max
  garage_type: first

supplements: US-OH-SU_property-summitcounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: additions
