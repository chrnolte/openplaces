# Recipe: Seneca County, OH auditor roll, ISSG Parcel Dwelling Feature
# table. Supplement of US-OH-SE_property-senecacounty-2026; see that
# recipe for the source and the join key.
#
# One row per sketched feature attached to a dwelling card. Type is
# 'CODE-DESCRIPTION'; Area is the feature's area in sqft. Capacity ('car
# capacity of garage') is almost never set and is not read. Read here,
# by code:
#   garages   FRG frame, MSG masonry or brick, BGAR basement,
#             FRGE frame garage extension
#   carports  CAR carport
#   porches   OFP, EFP, OMP, EMP (open or enclosed, frame or
#             masonry) and their upper-floor U forms
#   decks     WDK wood deck, MPAT masonry and STPAT stone patio
# Stoops, canopies, overhangs, attached utility buildings, greenhouses
# and summer kitchens are not read.
#
# garage_type keeps the source's Type text on garage rows. has_garage
# and has_carport are true where such a feature is recorded and null
# elsewhere: the table lists features present, never absent ones.
# Detached garages and carports are Parcel Improvement rows (see
# _improvements), which sets the same two flags; garage_area_sqft counts
# the garages listed here only.
#
# MEASURED 2026-09-13 on 2025: 59,693 feature rows over 19,694 parcels,
# keys 99.98% in the roll. On the 11,009 live land-use 510 properties: a
# feature row on 98.9%; a garage on 36.1% (FRG 3,344, MSG 628, BGAR 2,
# FRGE 1); porch area > 0 on 82.4%; deck or patio area > 0 on 56.1%;
# carport 1.6%.

description: >-
  Seneca County, OH ISSG Parcel Dwelling Feature table: attached garage,
  carport, porch and deck features per property.

admin_id: US-OH-SE

entity:
  entity_type: property
  source:
    source_id: senecacounty
    # Same download as the roll; see its terms note.
    license: >-
      unknown (Disclaimer: 'as is' and for reference only; no warranties;
      users agree to indemnify, defend, and hold harmless the county)
    terms_url: "https://senecacountyauditoroh.gov/Disclaimer"
    redistribution_restricted: null
    portal_url: "https://senecacountyauditoroh.gov/cama-data"
    download_url: "https://senecacountyauditoroh.gov/api/Media?p=Documents/PublicRecords.zip"
  version: "2026"

compressed_file_name: "PublicRecords.zip"
uncompressed_file_name: "Parcel Dwelling Feature.xml"

process_by:
  admin_level: 3

query: "Tax_Year == Tax_Year.max()"

columns:
  parcel_id_assessor: Parcel_Number_U

transformations:
  - type: unary
    operation: to_numeric
    input: Area
    output: feature_area
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*(GARAGE|\\bGAR\\b)", value: 1}
    default: 0
    output: garage_row
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "(OFP|EFP|OMP|EMP)U?-", value: 1}
    default: 0
    output: porch_row
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "(WDK|MPAT|STPAT)-", value: 1}
    default: 0
    output: deck_row
  - type: unary
    operation: to_numeric
    input: garage_row
    output: garage_row
  - type: unary
    operation: to_numeric
    input: porch_row
    output: porch_row
  - type: unary
    operation: to_numeric
    input: deck_row
    output: deck_row
  - type: binary
    operation: multiply
    inputs: [feature_area, garage_row]
    output: garage_area_sqft
  - type: binary
    operation: multiply
    inputs: [feature_area, porch_row]
    output: porch_area_sqft
  - type: binary
    operation: multiply
    inputs: [feature_area, deck_row]
    output: deck_area_sqft
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*(GARAGE|\\bGAR\\b)", value: true}
    output: has_garage
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "CAR-", value: true}
    output: has_carport
  # The garage codes found in the extract, kept verbatim; any other
  # Type leaves garage_type null.
  - type: remap
    input: Type
    mapping:
      "FRG-FR GR FRAME GARAGE": "FRG-FR GR FRAME GARAGE"
      "MSG-MG/BG MASONRY/BRICK GARAGE": "MSG-MG/BG MASONRY/BRICK GARAGE"
      "BGAR-BASEMENT GARAGE": "BGAR-BASEMENT GARAGE"
      "FRGE-FR GAR EXT": "FRGE-FR GAR EXT"
    output: garage_type

drop_columns:
  - feature_area
  - garage_row
  - porch_row
  - deck_row

columns_to_categorical:
  - garage_type

aggregation_function:
  garage_area_sqft: sum
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_garage: max
  has_carport: max
  garage_type: first

supplements: US-OH-SE_property-senecacounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: features
