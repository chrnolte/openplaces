# Recipe: Seneca County, OH auditor roll, ISSG Parcel Land table.
# Supplement of US-OH-SE_property-senecacounty-2026; see that recipe for
# the source and the join key.
#
# One row per land line of a parcel. Label says how Dim1 and Dim2 are
# read; on 'Effective - Frontage / Depth' lines Dim1 is the effective
# street frontage in feet and Dim2 the depth. frontage_ft sums Dim1 over
# the parcel's F1-REGULAR LOT, F2-MINUS LOT and F3-APARTMENT SITE lines
# with that label; the two F4-WATERFRONT lines (waterfront, not street
# frontage) and acreage lines add nothing. A parcel with no front-lot
# line stays null.
#
# MEASURED 2026-09-13 on 2025: 64,079 land lines over 34,753 parcels,
# keys 99.85% in the roll; frontage_ft on 99.5% of the 11,009 live
# land-use 510 properties (median 60 ft, p99 212 ft).

description: >-
  Seneca County, OH ISSG Parcel Land table: effective street frontage in
  feet from front-lot land lines, per parcel.

admin_id: US-OH-SE

entity:
  entity_type: property
  source:
    source_id: senecacounty
    # Same download as the roll; see its terms note.
    license: >-
      unknown (Disclaimer: 'as is' and for reference only; no warranties;
      users agree to indemnify, defend, and hold harmless the county)
    terms_url: "https://senecacountyauditoroh.gov/Disclaimer"
    redistribution_restricted: null
    portal_url: "https://senecacountyauditoroh.gov/cama-data"
    download_url: "https://senecacountyauditoroh.gov/api/Media?p=Documents/PublicRecords.zip"
  version: "2026"

compressed_file_name: "PublicRecords.zip"
uncompressed_file_name: "Parcel Land.xml"

process_by:
  admin_level: 3

query: "Tax_Year == Tax_Year.max()"

columns:
  parcel_id_assessor: Parcel_Number_U

transformations:
  - type: unary
    operation: to_numeric
    input: Dim1
    output: land_dim1
  # 1 on front-lot lines measured by frontage; others null.
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "F[123]-", value: 1}
    output: front_row
  - type: remap
    input: Label
    mapping:
      "Effective - Frontage / Depth": 1
    output: frontage_row
  - type: unary
    operation: to_numeric
    input: front_row
    output: front_row
  - type: binary
    operation: multiply
    inputs: [land_dim1, front_row]
    output: front_dim1
  - type: binary
    operation: multiply
    inputs: [front_dim1, frontage_row]
    output: frontage_ft

drop_columns:
  - land_dim1
  - front_row
  - frontage_row
  - front_dim1

aggregation_function:
  frontage_ft: sum

supplements: US-OH-SE_property-senecacounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: land
