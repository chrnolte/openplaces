# Recipe: Lorain County, OH auditor roll, ISSG Parcel_Dwelling_Feature
# table. Supplement of US-OH-LO_property-loraincounty-2026; see that
# recipe for the source, its terms and the join key.
#
# One row per sketched feature attached to a dwelling card. Type is
# 'CODE-GROUP, DESCRIPTION' (24 codes); Area is the feature's area in
# sqft. Capacity ("car capacity of garage") is 0 on every row, so no
# garage-space count is read.
#
# Read here, by code:
#   garages   AFG, AMG (attached or integral garage, frame or masonry)
#   carports  AFC, AFCO, AMC, AMCO (framed or masonry carport)
#   porches   OFP, EFP, OMP, EMP (open or enclosed, frame or masonry)
#   decks     WDDK (wood deck), PATC, PATS (patios), TER (terrace)
# IGD ("deduction for integral garage") marks an integral garage whose
# area the dwelling already carries: it sets has_garage but adds no
# area. DNR and DNS (deck deductions for no railing or stairs) are
# value adjustments of a WDDK row and add no area. Stoops (STP),
# canopies, balconies, attached sheds, greenhouses and overhangs are
# not read.
#
# garage_type keeps the source's Type text on AFG and AMG rows.
# has_garage and has_carport are true where such a feature is
# recorded and null elsewhere: the table lists features present,
# never absent ones. Detached garages and carports are
# Parcel_Improvement rows (see _improvements), which sets the same
# two flags; garage_area_sqft counts attached garages only.
#
# MEASURED 2026-09-13: 325,058 feature rows over 109,867 parcels,
# keys 99.73% in the roll. On the 89,855 live land-use 510
# properties: a feature row on 96.3%; attached garage area on 60.4%
# (AFG 52,018, AMG 2,261; median 330 sqft); has_garage 62.6% (IGD
# included); porch area > 0 on 63.7%; deck or patio area > 0 on
# 69.7%; carport 0.6%.

description: >-
  Lorain County, OH ISSG Parcel_Dwelling_Feature table: attached
  garage, carport, porch and deck features per property.

admin_id: US-OH-LO

entity:
  entity_type: property
  source:
    source_id: loraincounty
    # Same download as the roll; see its terms note.
    license: >-
      unknown (as-is, reference only, no liability; user indemnifies the
      Auditor)
    terms_url: "https://loraincountyauditor.gov/Disclaimer"
    redistribution_restricted: null
    portal_url: "https://loraincountyauditor.gov/"
    download_url: "https://loraincountyauditor.gov/api/Document/Public%20RecordsSqlite.zip"
  version: "2026"

compressed_file_name: "Public RecordsSqlite.zip"
uncompressed_file_name: "extract.db"
layer: Parcel_Dwelling_Feature

process_by:
  admin_level: 3

columns:
  parcel_id_assessor: Parcel_Number_U

transformations:
  - type: unary
    operation: to_numeric
    input: Area
    output: feature_area
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "(AFG|AMG)-", value: 1}
    default: 0
    output: garage_row
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "[OE][FM]P-", value: 1}
    default: 0
    output: porch_row
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "(WDDK|PATC|PATS|TER)-", value: 1}
    default: 0
    output: deck_row
  - type: unary
    operation: to_numeric
    input: garage_row
    output: garage_row
  - type: unary
    operation: to_numeric
    input: porch_row
    output: porch_row
  - type: unary
    operation: to_numeric
    input: deck_row
    output: deck_row
  - type: binary
    operation: multiply
    inputs: [feature_area, garage_row]
    output: garage_area_sqft
  - type: binary
    operation: multiply
    inputs: [feature_area, porch_row]
    output: porch_area_sqft
  - type: binary
    operation: multiply
    inputs: [feature_area, deck_row]
    output: deck_area_sqft
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "(AFG|AMG|IGD)-", value: true}
    output: has_garage
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*CARPORT", value: true}
    output: has_carport
  # The garage codes found in the extract, kept verbatim; any other
  # Type leaves garage_type null.
  - type: remap
    input: Type
    mapping:
      "AFG-ATTACHED/INTEGRAL GARAGE, FRAME CONSTRUCTION": >-
        AFG-ATTACHED/INTEGRAL GARAGE, FRAME CONSTRUCTION
      "AMG-ATTACHED/INTEGRAL GARAGE, MASONRY CONSTRUCTION": >-
        AMG-ATTACHED/INTEGRAL GARAGE, MASONRY CONSTRUCTION
    output: garage_type

drop_columns:
  - feature_area
  - garage_row
  - porch_row
  - deck_row

columns_to_categorical:
  - garage_type

aggregation_function:
  garage_area_sqft: sum
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_garage: max
  has_carport: max
  garage_type: first

supplements: US-OH-LO_property-loraincounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: features
