# Recipe: Brown County, OH auditor roll, ISSG Parcel Land table.
# Supplement of US-OH-BR_property-browncounty-2026; see that recipe
# for the source and the join key.
#
# One row per land line of a parcel (home site, small acreage, site
# value, front lot, cropland, ...). Label says how Dim1 and Dim2 are
# read; on 'Effective - Frontage / Depth' lines Dim1 is the effective
# street frontage in feet and Dim2 the depth. frontage_ft sums Dim1
# over the parcel's FL-FRONT LOT lines with that label (every FL line
# carries it); rear lots and acreage lines add nothing, and a parcel
# with no front-lot line stays null. Brown values most rural and
# village lots by acreage or site value, so frontage is sparse.
#
# MEASURED 2026-09-13: 51,545 land lines over 34,918 parcels, keys
# 99.70% in the roll; frontage_ft on 23.9% of the 11,446 live
# land-use 510 properties (median 66 ft, p99 213 ft).

description: >-
  Brown County, OH ISSG Parcel Land table: effective street frontage in
  feet from front-lot land lines, per parcel.

admin_id: US-OH-BR

entity:
  entity_type: property
  source:
    source_id: browncounty
    # Same download as the roll; see its terms note.
    license: >-
      unknown (as-is, reference only, no liability; user indemnifies the
      county)
    terms_url: "https://realestate.browncountyauditor.org/Disclaimer"
    redistribution_restricted: null
    portal_url: "https://realestate.browncountyauditor.org/property-data-downloads"
    download_url: "https://realestate.browncountyauditor.org/api/Document/ExtractXML.zip"
  version: "2026"

compressed_file_name: "ExtractXML.zip"
uncompressed_file_name: "Parcel Land.xml"

process_by:
  admin_level: 3

columns:
  parcel_id_assessor: Parcel_Number_U

transformations:
  - type: unary
    operation: to_numeric
    input: Dim1
    output: land_dim1
  # 1 on front-lot lines measured by frontage; other lines null.
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "FL-", value: 1}
    output: front_row
  - type: remap
    input: Label
    mapping: {"Effective - Frontage / Depth": 1}
    output: frontage_row
  - type: unary
    operation: to_numeric
    input: front_row
    output: front_row
  - type: binary
    operation: multiply
    inputs: [land_dim1, front_row]
    output: front_dim1
  - type: binary
    operation: multiply
    inputs: [front_dim1, frontage_row]
    output: frontage_ft

drop_columns:
  - land_dim1
  - front_row
  - frontage_row
  - front_dim1

aggregation_function:
  frontage_ft: sum

supplements: US-OH-BR_property-browncounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: land
