# Recipe: Clermont County, OH CAMA roll, LAND table. Supplement of
# US-OH-CL_property-clermontcounty-2026; see that recipe for the
# source and the join key.
#
# One row per land line. LTYPE is the pricing method (A acreage, F
# front foot, G gross, S square foot, U units, per the zip's AEDIT
# table); FRONACT is "Actual Frontage" and FRONEFF "Effective
# Frontage", both in feet and filled on front-foot lines only.
# frontage_ft sums FRONACT over a parcel's LTYPE F lines; a parcel
# priced by acreage or square foot has no frontage recorded and stays
# null.
#
# MEASURED 2026-09-13: 134,091 lines over 101,973 parcels (9,200
# front-foot lines), keys 100% in the roll; frontage on 6.5% of the
# 58,508 land-use 510 properties (median 65 ft, p99 200 ft).

description: >-
  Clermont County, OH CAMA LAND table: actual street frontage in feet
  from front-foot land lines, per parcel.

admin_id: US-OH-CL

entity:
  entity_type: property
  source:
    source_id: clermontcounty
    # Same download as the roll; see its terms note.
    license: "unknown (site Terms of Use: 'as is', no warranty; no data-specific terms)"
    terms_url: "https://www.clermontauditor.org/terms-of-use/"
    redistribution_restricted: null
    portal_url: "https://www.clermontauditor.org/downloads/"
    download_url: "https://www.clermontauditor.org/wp-content/uploads/PublicAccess/CLERMONT_AA407.ZIP"
  version: "2026"

compressed_file_name: "CLERMONT_AA407.ZIP"
uncompressed_file_name: "LAND.DAT"

process_by:
  admin_level: 3

encoding: latin-1
csv_dtype: str

columns:
  parcel_id_assessor: PARID

transformations:
  - type: unary
    operation: to_numeric
    input: FRONACT
    output: land_front
  # 1 on front-foot lines; other lines null.
  - type: remap
    input: LTYPE
    mapping: {F: 1}
    output: front_row
  - type: binary
    operation: multiply
    inputs: [land_front, front_row]
    output: frontage_ft

drop_columns:
  - land_front
  - front_row

aggregation_function:
  frontage_ft: sum

supplements: US-OH-CL_property-clermontcounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: land
