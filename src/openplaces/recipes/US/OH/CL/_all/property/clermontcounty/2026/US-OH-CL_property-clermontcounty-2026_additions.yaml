# Recipe: Clermont County, OH CAMA roll, ADDN table (iasWorld
# additions). Supplement of US-OH-CL_property-clermontcounty-2026; see
# that recipe for the source and the join key.
#
# One row per addition line of a dwelling card (the layout: "Lower
# Level Addition", "First Floor Addition", "Second Floor Addition",
# each a code from the zip's RCADDN table, and AREA, "Area of this
# line", in sqft). A line with a garage at its lower level and a room
# above carries both codes. Read here, at every level where the code
# occurs:
#   garage   13 frame garage, 23 masonry/brick garage, 43 integral
#   porch    11 open frame, 12 enclosed frame, 21 open masonry,
#            22 enclosed masonry, 45 screen porch
#   deck     31 wood deck, 33 concrete/masonry patio, 34 stone or
#            tile patio
#   carport  30 (first floor only)
# Stoops (35), canopies (32), overhangs, bays, attics and living-area
# additions are not read. Each area sums AREA over the levels whose
# code matches, so a deck over a patio adds both.
#
# garage_type keeps the first-floor garage code (13, 23 or 43).
# has_garage and has_carport are true where such a line is recorded
# and null elsewhere: the table lists additions present, never absent
# ones. Detached garages and carports are OBY rows (see _oby), which
# sets the same two flags; garage_area_sqft counts attached ones only.
#
# MEASURED 2026-09-13: 395,137 lines over 72,322 parcels, keys 100%
# in the roll. On the 58,508 land-use 510 properties: garage area > 0
# on 77.1% (median 420 sqft; first-floor code 13 on 41.2%, 23 on
# 29.8%); porch area > 0 on 74.4%; deck or patio area > 0 on 83.0%;
# carport 1.8%.

description: >-
  Clermont County, OH CAMA ADDN table: attached garage, porch, deck and
  patio area and garage and carport flags per property.

admin_id: US-OH-CL

entity:
  entity_type: property
  source:
    source_id: clermontcounty
    # Same download as the roll; see its terms note.
    license: "unknown (site Terms of Use: 'as is', no warranty; no data-specific terms)"
    terms_url: "https://www.clermontauditor.org/terms-of-use/"
    redistribution_restricted: null
    portal_url: "https://www.clermontauditor.org/downloads/"
    download_url: "https://www.clermontauditor.org/wp-content/uploads/PublicAccess/CLERMONT_AA407.ZIP"
  version: "2026"

compressed_file_name: "CLERMONT_AA407.ZIP"
uncompressed_file_name: "ADDN.DAT"

process_by:
  admin_level: 3

encoding: latin-1
csv_dtype: str

columns:
  parcel_id_assessor: PARID

transformations:
  - type: unary
    operation: to_numeric
    input: AREA
    output: addn_area
  - type: remap
    input: LOWER
    mapping: {"13": 1, "23": 1, "43": 1}
    default: 0
    output: garage_lower
  - type: remap
    input: FIRST
    mapping: {"13": 1, "23": 1, "43": 1}
    default: 0
    output: garage_first
  - type: remap
    input: SECOND
    mapping: {"13": 1, "23": 1, "43": 1}
    default: 0
    output: garage_second
  - type: remap
    input: LOWER
    mapping: {"11": 1, "12": 1, "21": 1, "22": 1, "45": 1}
    default: 0
    output: porch_lower
  - type: remap
    input: FIRST
    mapping: {"11": 1, "12": 1, "21": 1, "22": 1, "45": 1}
    default: 0
    output: porch_first
  - type: remap
    input: SECOND
    mapping: {"11": 1, "12": 1, "21": 1, "22": 1, "45": 1}
    default: 0
    output: porch_second
  - type: remap
    input: LOWER
    mapping: {"31": 1, "33": 1, "34": 1}
    default: 0
    output: deck_lower
  - type: remap
    input: FIRST
    mapping: {"31": 1, "33": 1, "34": 1}
    default: 0
    output: deck_first
  - type: remap
    input: SECOND
    mapping: {"31": 1, "33": 1, "34": 1}
    default: 0
    output: deck_second
  - type: aggregate
    operation: sum
    inputs: [garage_lower, garage_first, garage_second]
    output: garage_levels
  - type: aggregate
    operation: sum
    inputs: [porch_lower, porch_first, porch_second]
    output: porch_levels
  - type: aggregate
    operation: sum
    inputs: [deck_lower, deck_first, deck_second]
    output: deck_levels
  - type: binary
    operation: multiply
    inputs: [addn_area, garage_levels]
    output: garage_area_sqft
  - type: binary
    operation: multiply
    inputs: [addn_area, porch_levels]
    output: porch_area_sqft
  - type: binary
    operation: multiply
    inputs: [addn_area, deck_levels]
    output: deck_area_sqft
  - type: conditional
    operation: greater_than
    input: garage_levels
    args: {threshold: 0}
    output: garage_line
  # Lines with no garage leave the flag null.
  - type: remap
    input: garage_line
    mapping: {1: true}
    output: has_garage
  - type: remap
    input: FIRST
    mapping: {"30": true}
    output: has_carport
  - type: remap
    input: FIRST
    mapping: {"13": "13", "23": "23", "43": "43"}
    output: garage_type

drop_columns:
  - addn_area
  - garage_lower
  - garage_first
  - garage_second
  - porch_lower
  - porch_first
  - porch_second
  - deck_lower
  - deck_first
  - deck_second
  - garage_levels
  - porch_levels
  - deck_levels
  - garage_line

columns_to_categorical:
  - garage_type

aggregation_function:
  garage_area_sqft: sum
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_garage: max
  has_carport: max
  garage_type: first

supplements: US-OH-CL_property-clermontcounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: additions
