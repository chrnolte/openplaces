# Recipe: Erie County, OH auditor roll, ISSG Parcel Improvement table.
# Supplement of US-OH-ER_property-eriecounty-2026; see that recipe for
# the source and the join key.
#
# One row per detached improvement on a card. Type is
# 'CODE-DESCRIPTION'; Multiplier is 'the number of identical
# improvements represented by this item'.
#
# n_outbuildings counts rows whose Type names a structure (garage, shed,
# barn, lean-to, pole or other building, roof or picnic shelter, gazebo,
# cabin, cottage, shop, stable, quonset, a house such as a boat, pump,
# milk, poultry, bath or green house, crib, silo, grain bin, granary,
# coop, kennel, carport, concrete stave silo), times Multiplier.
# Commercial rows (COMM, COMMERCIAL, regulator, restroom and ODOT salt
# buildings, guard houses), sound-value items (SV...), pools, towers,
# bleachers, concession stands and press boxes are not counted, nor are
# paving, fencing, docks, patios, decks and porches.
#
# Flags, each true where such an improvement is recorded and null
# elsewhere: has_pool (any POOL type, above ground, outdoor, indoor,
# commercial, wading, enclosure), has_garage (detached frame, block or
# brick garage) and has_carport (detached carport; a CAR SHED is counted
# as a shed, not a carport). has_garage and has_carport are also set by
# _features for attached ones. COTTAGE and SV RES DWELLING rows may be
# the parcel's only dwelling, so no accessory dwelling flag is read.
#
# MEASURED 2026-09-13: 53,089 rows over 26,764 parcels, keys 99.97% in
# the roll. On the 25,796 live land-use 510 properties: an improvement
# row on 73.2%; n_outbuildings > 0 on 68.8% (median 1); pool 6.6%;
# detached garage 27.9%; detached carport 0.8%.

description: >-
  Erie County, OH ISSG Parcel Improvement table: outbuilding count and
  pool, detached garage and carport flags per property.

admin_id: US-OH-ER

entity:
  entity_type: property
  source:
    source_id: eriecounty
    # Same download as the roll; see its terms note.
    license: >-
      unknown (as-is, reference only, no liability; user indemnifies the
      county)
    terms_url: "https://auditor.eriecounty.oh.gov/Disclaimer"
    redistribution_restricted: null
    portal_url: "https://auditor.eriecounty.oh.gov/"
    download_url: "https://auditor.eriecounty.oh.gov/api/Document/PublicRecordsRequest.zip"
  version: "2026"

compressed_file_name: "PublicRecordsRequest.zip"
uncompressed_file_name: "Parcel Improvement.xml"

process_by:
  admin_level: 3

columns:
  parcel_id_assessor: Parcel_Number_U

transformations:
  - type: unary
    operation: to_numeric
    input: Multiplier
    output: multiplier
  # Later patterns win: structures first, then exclusions.
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*(GARAGE|\\bGAR\\b|SHED|BARN|LEAN|BLDG|BDG)", value: 1}
      - {pattern: ".*(BUILDING|SHELTER|SHLTR|GAZEBO|CABIN|COTTAGE|SHOP)", value: 1}
      - {pattern: ".*(STABLE|QUONSET|QUNST|HOUSE|HSE|\\bHS\\b|CRIB|SILO)", value: 1}
      - {pattern: ".*(\\bBIN\\b|GRANARY|GRNRY|COOP|KENNEL|CARPORT|STAVE)", value: 1}
      - {pattern: ".*(GREEN|STORAGE|STRG|HANGER|PRLR|PARLOR|PAVIL|POLE)", value: 1}
      - {pattern: ".*(COMM|\\bCOM\\b|REGULATOR|RESTROOM|ODOT|GUARD)", value: 0}
      - {pattern: ".*(POOL|\\bSV|TOWER|BLEACHERS|CONCESSION|PRESS BOX)", value: 0}
    default: 0
    output: outbuilding_row
  - type: unary
    operation: to_numeric
    input: outbuilding_row
    output: outbuilding_row
  - type: binary
    operation: multiply
    inputs: [outbuilding_row, multiplier]
    output: n_outbuildings
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*POOL", value: true}
    output: has_pool
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*GARAGE", value: true}
    output: has_garage
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*CARPORT", value: true}
    output: has_carport

drop_columns:
  - multiplier
  - outbuilding_row

aggregation_function:
  n_outbuildings: sum
  has_pool: max
  has_garage: max
  has_carport: max

supplements: US-OH-ER_property-eriecounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: improvements
