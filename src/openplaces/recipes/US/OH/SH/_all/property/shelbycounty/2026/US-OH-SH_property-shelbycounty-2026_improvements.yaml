# Recipe: Shelby County, OH auditor roll, ISSG Parcel Improvement table.
# Supplement of US-OH-SH_property-shelbycounty-2026; see that recipe for
# the source and the join key.
#
# One row per detached improvement on a card. Type is
# 'CODE-DESCRIPTION'; Multiplier is 'the number of identical
# improvements represented by this item'.
#
# The table mixes residential and farm outbuildings (numbered codes such
# as 04-SHED, and 499.xxx and 90x.xxx extra-feature codes) with
# commercial cost-code buildings (3xx.xxx to 8xx.xxx, CBD).
#
# n_outbuildings counts rows whose Type names a structure (garage, shed,
# barn, lean-to, pole or utility or storage building, shelter, gazebo,
# cottage, shop, stable, quonset, a house such as a poultry, milk, hen,
# pump, bath or green house, crib, granary, silo, grain bin, coop,
# kennel, carport, hangar, milk parlor), times Multiplier. Not counted:
# commercial cost codes other than 499.xxx, the attached garage codes
# 499.026 to 499.029, CBD and market rows, COMM, club and guard houses,
# water towers, restrooms, pools, mobile homes (MH) and dwellings.
#
# Flags, each true where such an improvement is recorded and null
# elsewhere: has_pool (POOL and SWM POOL rows), has_garage (GARAGE or
# GAR rows except commercial ones) and has_carport (CARPORT rows).
# has_garage and has_carport are also set by _features. No Type names
# detached living quarters (03-BATHHOUSE/COTTAGE does not say which), so
# no accessory dwelling flag is read.
#
# MEASURED 2026-09-13: 44,632 rows over 16,058 parcels, keys 99.79% in
# the roll. On the 14,254 live land-use 510 properties: an improvement
# row on 69.8%; n_outbuildings > 0 on 66.3% (median 1); pool 7.1%;
# garage 24.0%; carport 1.2%.

description: >-
  Shelby County, OH ISSG Parcel Improvement table: outbuilding count and
  pool, detached garage and carport flags per property.

admin_id: US-OH-SH

entity:
  entity_type: property
  source:
    source_id: shelbycounty
    # Same download as the roll; see its terms note.
    license: "unknown (no terms stated on the downloads page)"
    redistribution_restricted: null
    portal_url: "https://realestate.shelbycountyauditors.com/property-data-downloads"
    download_url: "https://shelby-auditor-public.issg.io/api/Document/ExtractXML.zip"
  version: "2026"

compressed_file_name: "ExtractXML.zip"
uncompressed_file_name: "Parcel Improvement.xml"

process_by:
  admin_level: 3

columns:
  parcel_id_assessor: Parcel_Number_U

transformations:
  - type: string
    operation: substring
    input: parcel_id_assessor
    args: {start: 2}
    output: parcel_id_admin3
  - type: unary
    operation: to_numeric
    input: Multiplier
    output: multiplier
  # Later patterns win: structures first, then exclusions.
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*(GARAGE|\\bGAR\\b|SHED|BARN|LEAN|BLDG|BDG)", value: 1}
      - {pattern: ".*(BUILDING|SHELTER|SHLTR|GAZEBO|CABIN|COTTAGE|SHOP)", value: 1}
      - {pattern: ".*(STABLE|QUONSET|QUNST|HOUSE|HSE|\\bHS\\b|CRIB|SILO)", value: 1}
      - {pattern: ".*(\\bBIN\\b|GRANARY|GRNRY|COOP|KENNEL|CARPORT|STAVE)", value: 1}
      - {pattern: ".*(GREEN|STORAGE|STRG|HANGER|PRLR|PARLOR|PAVIL|POLE)", value: 1}
      - {pattern: "(?!499\\.)[3-8]\\d\\d\\.\\d+-", value: 0}
      - {pattern: "499\\.02[6-9]-", value: 0}
      - {pattern: "(CBD|MKT)", value: 0}
      - {pattern: ".*(COMM|CLUB|GRDHSE|TOW\\b|RESTROOM|POOL|\\bMH\\b)", value: 0}
      - {pattern: ".*(DWLG|ATTACHED)", value: 0}
    default: 0
    output: outbuilding_row
  - type: unary
    operation: to_numeric
    input: outbuilding_row
    output: outbuilding_row
  - type: binary
    operation: multiply
    inputs: [outbuilding_row, multiplier]
    output: n_outbuildings
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*POOL", value: true}
    output: has_pool
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*(GARAGE|\\bGAR\\b)", value: true}
      - {pattern: "(?!499\\.)[3-8]\\d\\d\\.\\d+-", value: null}
      - {pattern: ".*COMM", value: null}
    output: has_garage
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*CARPORT", value: true}
    output: has_carport

drop_columns:
  - multiplier
  - outbuilding_row

aggregation_function:
  n_outbuildings: sum
  has_pool: max
  has_garage: max
  has_carport: max

supplements: US-OH-SH_property-shelbycounty-2026

parcel_id_local:
  source: parcel_id_admin3
  kind: parcel

save_to:
  data_dir: cache
  filename: improvements
