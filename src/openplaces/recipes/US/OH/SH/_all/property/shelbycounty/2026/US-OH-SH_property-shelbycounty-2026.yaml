# Recipe: Shelby County, OH auditor roll (ISSG extract, Parcel table).
#
# The tables are XML (one element per row, fields as attributes),
# which the ingester's XML branch reads as text. The recipe has not
# been ingested. The ingester's own reader and
# _preprocess_recipe_data were run on the extract on 2026-09-12.
#
# Source: the auditor's 'Property Data Downloads' page (ISSG Inc
# platform) links 'Full Real Estate Data (CAMA & Tax in XML format)'
# on ISSG's public document host, ExtractXML.zip (99 MB, 57 XML
# tables), and a condensed Excel.
#
# Three recipes read this extract, in the ISSG layout of Lorain's and
# Belmont's recipes: this roll (Parcel.xml), _appraisal (Parcel
# Appraisal.xml: land use and appraised values) and _dwelling (Parcel
# Dwelling.xml).
#
# Row shape, measured on the extract dated 2026-09-11: Parcel.xml
# holds 33,141 rows, all tax year 2025; Retired is 'YES' on 1,437, and
# the query keeps the 31,704 live parcels.
# One row is one property. The owner, taxpayer, lender and escrow
# attributes of Parcel.xml are never mapped.
#
# Join key. Parcel_Number_U is 12 digits (Parcel_Number is
# '99-9999999.999'); OGRIP's LocalParcelID holds 10. Neither
# Parcel_Number_U, the formatted id nor the stripped form matches (0
# of 100 each); Parcel_Number_U without its first two characters
# matches 97 of 100 sampled live ids, measured against the live OGRIP
# layer on a random sample. parcel_id_admin3 carries that form and
# feeds parcel_id_local; parcel_id_assessor keeps the full 12 digits.

description: >-
  Shelby County, OH auditor roll (ISSG extract, Parcel XML table):
  live parcels with tax year and acreage.

admin_id: US-OH-SH

entity:
  entity_type: property
  source:
    source_id: shelbycounty
    # Checked 2026-09-12: the 'Property Data Downloads' page states no
    # terms, disclaimer or gate.
    license: "unknown (no terms stated on the downloads page)"
    redistribution_restricted: null
    portal_url: "https://realestate.shelbycountyauditors.com/property-data-downloads"
    download_url: "https://shelby-auditor-public.issg.io/api/Document/ExtractXML.zip"
  version: "2026"

compressed_file_name: "ExtractXML.zip"
uncompressed_file_name: "Parcel.xml"

process_by:
  admin_level: 3

query: "Retired == 'NO'"

columns:
  parcel_id_assessor: Parcel_Number_U
  tax_year: Tax_Year
  area_ac: Acres

transformations:
  - type: unary
    operation: to_numeric
    input: tax_year
    output: tax_year
  - type: string
    operation: substring
    input: parcel_id_assessor
    args: {start: 2}
    output: parcel_id_admin3
  - type: unary
    operation: to_numeric
    input: area_ac
    output: area_ac

parcel_id_local:
  source: parcel_id_admin3
  kind: parcel

save_to:
  data_dir: cache
