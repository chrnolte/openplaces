# Recipe: Huron County, OH auditor roll, ISSG Parcel Land table.
# Supplement of US-OH-HU_property-huroncounty-2026; see that recipe for
# the source and the join key.
#
# One row per land line of a parcel. Label says how Dim1 and Dim2 are
# read; on 'Effective - Frontage / Depth' lines Dim1 is the effective
# street frontage in feet and Dim2 the depth. frontage_ft sums Dim1 over
# the parcel's F-FRONT lines with that label; R-REAR lines and the
# EAF-EASEMENT- FRONTAGE lines add nothing. A parcel with no front-lot
# line stays null.
#
# MEASURED 2026-09-13 on 2025: 69,928 land lines over 39,564 parcels,
# keys 99.81% in the roll; frontage_ft on 89.8% of the 10,924 live
# land-use 510 properties (median 66 ft, p99 185 ft).

description: >-
  Huron County, OH ISSG Parcel Land table: effective street frontage in
  feet from front-lot land lines, per parcel.

admin_id: US-OH-HU

entity:
  entity_type: property
  source:
    source_id: huroncounty
    # Same download as the roll; see its terms note.
    license: "unknown (property-line disclaimer only; no terms on the extract)"
    redistribution_restricted: null
    portal_url: "https://huroncountyauditor.org/"
    download_url: "https://huron-auditor-public.issg.io/api/Document/PublicRecords.zip?e=t0YMq1"
  version: "2026"

compressed_file_name: "PublicRecords.zip"
uncompressed_file_name: "Parcel Land.xml"

process_by:
  admin_level: 3

query: "Tax_Year == Tax_Year.max()"

columns:
  parcel_id_assessor: Parcel_Number_U

transformations:
  - type: unary
    operation: to_numeric
    input: Dim1
    output: land_dim1
  # 1 on front-lot lines measured by frontage; others null.
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "F-", value: 1}
    output: front_row
  - type: remap
    input: Label
    mapping:
      "Effective - Frontage / Depth": 1
    output: frontage_row
  - type: unary
    operation: to_numeric
    input: front_row
    output: front_row
  - type: binary
    operation: multiply
    inputs: [land_dim1, front_row]
    output: front_dim1
  - type: binary
    operation: multiply
    inputs: [front_dim1, frontage_row]
    output: frontage_ft

drop_columns:
  - land_dim1
  - front_row
  - frontage_row
  - front_dim1

aggregation_function:
  frontage_ft: sum

supplements: US-OH-HU_property-huroncounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: land
