# Recipe: Huron County, OH auditor roll, ISSG Parcel Dwelling Feature
# table. Supplement of US-OH-HU_property-huroncounty-2026; see that
# recipe for the source and the join key.
#
# One row per sketched feature attached to a dwelling card. Type is
# 'CODE-DESCRIPTION'; Area is the feature's area in sqft. Capacity ('car
# capacity of garage') is almost never set and is not read. Read here,
# by code:
#   garages   any Type naming a GARAGE or GAR: GF frame, GB
#             brick, BG basement, GP pole, the unfinished
#             AGFU, AGBU, GFU, GBU and a few detached DGFU
#   carports  CAR carport
#   porches   OFP, EFP, OBP, EBP and PORT (a two-story OFP)
#   decks     WDDK wood deck, CPAT concrete, BPAT brick, PAT
#             patio
# Stoops, overhangs, canopies, trim, roof extensions, bay windows,
# breezeways, balconies, basement entrances, sheds, ceilings, cellars
# and attached greenhouses are not read.
#
# garage_type keeps the source's Type text on garage rows. has_garage
# and has_carport are true where such a feature is recorded and null
# elsewhere: the table lists features present, never absent ones.
# Detached garages and carports are Parcel Improvement rows (see
# _improvements), which sets the same two flags; garage_area_sqft counts
# the garages listed here only.
#
# MEASURED 2026-09-13 on 2025: 67,741 feature rows over 19,461 parcels,
# keys 99.96% in the roll. On the 10,924 live land-use 510 properties: a
# feature row on 99.1%; a garage on 47.1% (GF 4,419, GB 443, BG 234,
# AGFU 38, others 12; garage area > 0 on 45.2%); porch area > 0 on
# 79.9%; deck or patio area > 0 on 66.2%; carport 1.3%.

description: >-
  Huron County, OH ISSG Parcel Dwelling Feature table: attached garage,
  carport, porch and deck features per property.

admin_id: US-OH-HU

entity:
  entity_type: property
  source:
    source_id: huroncounty
    # Same download as the roll; see its terms note.
    license: "unknown (property-line disclaimer only; no terms on the extract)"
    redistribution_restricted: null
    portal_url: "https://huroncountyauditor.org/"
    download_url: "https://huron-auditor-public.issg.io/api/Document/PublicRecords.zip?e=t0YMq1"
  version: "2026"

compressed_file_name: "PublicRecords.zip"
uncompressed_file_name: "Parcel Dwelling Feature.xml"

process_by:
  admin_level: 3

query: "Tax_Year == Tax_Year.max()"

columns:
  parcel_id_assessor: Parcel_Number_U

transformations:
  - type: unary
    operation: to_numeric
    input: Area
    output: feature_area
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*(GARAGE|\\bGAR\\b)", value: 1}
    default: 0
    output: garage_row
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "(OFP|EFP|OBP|EBP|PORT)-", value: 1}
    default: 0
    output: porch_row
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "(WDDK|CPAT|PAT|BPAT)-", value: 1}
    default: 0
    output: deck_row
  - type: unary
    operation: to_numeric
    input: garage_row
    output: garage_row
  - type: unary
    operation: to_numeric
    input: porch_row
    output: porch_row
  - type: unary
    operation: to_numeric
    input: deck_row
    output: deck_row
  - type: binary
    operation: multiply
    inputs: [feature_area, garage_row]
    output: garage_area_sqft
  - type: binary
    operation: multiply
    inputs: [feature_area, porch_row]
    output: porch_area_sqft
  - type: binary
    operation: multiply
    inputs: [feature_area, deck_row]
    output: deck_area_sqft
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: ".*(GARAGE|\\bGAR\\b)", value: true}
    output: has_garage
  - type: remap_pattern
    input: Type
    patterns:
      - {pattern: "CAR-", value: true}
    output: has_carport
  # The garage codes found in the extract, kept verbatim; any other
  # Type leaves garage_type null.
  - type: remap
    input: Type
    mapping:
      "GF-GARAGE FRAME": "GF-GARAGE FRAME"
      "GB-GARAGE BRICK": "GB-GARAGE BRICK"
      "BG-BASEMENT GARAGE": "BG-BASEMENT GARAGE"
      "AGFU-ATACHD GAR FRM UNFIN": "AGFU-ATACHD GAR FRM UNFIN"
      "GP-GARAGE POLE UNFIN": "GP-GARAGE POLE UNFIN"
      "AGBU-ATACHD GAR BRK UNFIN": "AGBU-ATACHD GAR BRK UNFIN"
      "GFU-GARAGE FRAME UNFNSHD": "GFU-GARAGE FRAME UNFNSHD"
      "DGFU-DTACHD GAR FRM UNFIN": "DGFU-DTACHD GAR FRM UNFIN"
      "GBU-GARAGE BRICK UNFNSHD": "GBU-GARAGE BRICK UNFNSHD"
    output: garage_type

drop_columns:
  - feature_area
  - garage_row
  - porch_row
  - deck_row

columns_to_categorical:
  - garage_type

aggregation_function:
  garage_area_sqft: sum
  porch_area_sqft: sum
  deck_area_sqft: sum
  has_garage: max
  has_carport: max
  garage_type: first

supplements: US-OH-HU_property-huroncounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: features
