# Recipe: Union County, OH auditor roll (ARC TB_ARC_Parcels table).
#
# Source: the county's ArcGIS Enterprise portal ("Union County GIS
# Enterprise Data Portal", www8.co.union.oh.us/mapunionoh) lists
# Document Link items for pipe-delimited, quoted text zips on
# www2.co.union.oh.us/propertyinfofile/, the Appraisal Research
# Corporation (ARC) CAMA tables TB_ARC_*. This recipe reads
# TB_ARC_Parcels; the _floors supplement reads TB_ARC_DwellingFloors
# (room and bath counts) and the _dwellings supplement TB_ARC_Dwellings
# (story height). The auditor's public search is Schneider Beacon,
# which challenges the openplaces User-Agent; these files do not.
#
# Row shape, measured on the files dated 2026-09-10: 42,387 rows, one
# per distinct Parcel (41,057 real estate 'RE', 1,330 manufactured
# homes 'MMH' taxed as personal property on their own id). One row is
# one property. ParcelRetirementStatus is blank on 41,079 rows and
# holds a retirement note on the rest; the query keeps the live ones.
# The Mailing Address 1/2 blocks and Deeded Name are never mapped.
#
# Columns. Class Number is the Ohio DTE land-use code (3 digits on
# every row); Class Code is its R/A/C/E/I/U letter, not mapped.
# AppraisedMarketLandValue is above zero on 87.5% of rows and
# AppraisedImprovementsValue on 66.2%. Total_Acres is above zero on
# only 40.4% and is not mapped.
#
# Parcel characteristics (added 2026-09-13). Neighborhood Code is
# tax_neighborhood_code (454 codes, listed in TB_ARC_CodeSets).
# Topography_*, Utilities_PU/PR_Sewer and Utilities_PU/PR_Water are
# True/False columns; topography, sewer_type and water_source join
# the true ones in the source's labels (Level, High, Low, Rolling,
# Standard; PU_Sewer, PR_Sewer; PU_Water, PR_Water; PU public, PR
# private). All False means not recorded and reads null.
# MEASURED 2026-09-13 on the 14,779 live land-use 510 properties:
# tax_neighborhood_code 100%; topography 53.4% (Standard 5,357,
# Level 1,774, Rolling 699); sewer_type 47.4% (PU_Sewer 4,935,
# PR_Sewer 2,050); water_source 47.0% (PU_Water 4,701, PR_Water
# 2,239).
#
# Join key. Parcel is 13 digits (MMH ids '999999A999999') and matches
# OGRIP's LocalParcelID as shipped on 157 of 200 sampled roll ids and
# 171 of 200 sampled floor-row ids, measured against the live OGRIP
# layer on a random sample. OGRIP's Union ids include placeholders
# ('ROW', '?'), which accounts for part of the gap. No transformation
# is applied.

description: >-
  Union County, OH auditor roll (ARC TB_ARC_Parcels table): land-use
  code, appraised land and improvement value and situs per property.

admin_id: US-OH-UN

entity:
  entity_type: property
  source:
    source_id: unioncounty
    # Checked 2026-09-12: the portal items carry no licenseInfo or
    # accessInformation, and the download host shows no terms, fee or
    # resale clause. The Beacon disclaimer could not be read.
    license: "unknown (no licence on the portal items; no terms on the download host)"
    redistribution_restricted: null
    portal_url: "https://www8.co.union.oh.us/mapunionoh/"
    download_url: "https://www2.co.union.oh.us/propertyinfofile/TB_ARC_Parcels.zip"
  version: "2026"

compressed_file_name: "TB_ARC_Parcels.zip"
uncompressed_file_name: "TB_ARC_Parcels/TB_ARC_Parcels.txt"

process_by:
  admin_level: 3

delimiter: "|"
encoding: latin-1
csv_dtype: str

query: "ParcelRetirementStatus.isna()"

columns:
  parcel_id_assessor: Parcel
  use_group_code: Class Number
  land_value: AppraisedMarketLandValue
  improvement_value: AppraisedImprovementsValue
  address_number: Property Address Number
  city: Property Address City
  postal_code: Property Address Zip Code
  tax_neighborhood_code: Neighborhood Code

transformations:
  # Topography and utilities are True/False columns, several of which
  # may be true; the true ones are joined by a space, in the source's
  # own labels. A parcel with none true stays null.
  - type: remap
    input: Topography_Level
    mapping: {"True": "Level "}
    output: topo_level
  - type: remap
    input: Topography_High
    mapping: {"True": "High "}
    output: topo_high
  - type: remap
    input: Topography_Low
    mapping: {"True": "Low "}
    output: topo_low
  - type: remap
    input: Topography_Rolling
    mapping: {"True": "Rolling "}
    output: topo_rolling
  - type: remap
    input: Topography_Standard
    mapping: {"True": "Standard "}
    output: topo_standard
  - type: string
    operation: concat
    inputs: [topo_level, topo_high, topo_low, topo_rolling, topo_standard]
    output: topography
  - type: remap
    input: Utilities_PU_Sewer
    mapping: {"True": "PU_Sewer "}
    output: sewer_public
  - type: remap
    input: Utilities_PR_Sewer
    mapping: {"True": "PR_Sewer "}
    output: sewer_private
  - type: string
    operation: concat
    inputs: [sewer_public, sewer_private]
    output: sewer_type
  - type: remap
    input: Utilities_PU_Water
    mapping: {"True": "PU_Water "}
    output: water_public
  - type: remap
    input: Utilities_PR_Water
    mapping: {"True": "PR_Water "}
    output: water_private
  - type: string
    operation: concat
    inputs: [water_public, water_private]
    output: water_source
  - type: string
    operation: strip
    input: topography
    output: topography
  - type: string
    operation: strip
    input: sewer_type
    output: sewer_type
  - type: string
    operation: strip
    input: water_source
    output: water_source
  - type: unary
    operation: null_if_equal
    input: topography
    args: {value: ""}
    output: topography
  - type: unary
    operation: null_if_equal
    input: sewer_type
    args: {value: ""}
    output: sewer_type
  - type: unary
    operation: null_if_equal
    input: water_source
    args: {value: ""}
    output: water_source
  - type: string
    operation: concat
    inputs:
      - Property Address Direction
      - Property Address Street
      - Property Address Street Suffix
    args: {sep: " "}
    output: address_street
  - type: string
    operation: strip
    input: address_street
    output: address_street
  - type: unary
    operation: to_numeric
    input: land_value
    output: land_value
  - type: unary
    operation: to_numeric
    input: improvement_value
    output: improvement_value

drop_columns:
  - topo_level
  - topo_high
  - topo_low
  - topo_rolling
  - topo_standard
  - sewer_public
  - sewer_private
  - water_public
  - water_private

columns_to_categorical:
  - use_group_code
  - topography
  - sewer_type
  - water_source

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
