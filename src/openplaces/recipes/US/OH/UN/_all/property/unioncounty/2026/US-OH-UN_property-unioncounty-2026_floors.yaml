# Recipe: Union County, OH auditor roll, ARC TB_ARC_DwellingFloors
# table. Supplement of US-OH-UN_property-unioncounty-2026; see that
# recipe for the source, the terms and the join key.
#
# Row shape, measured on the file dated 2026-09-10: 60,580 rows, one
# per floor of a dwelling (1st Story, Basement, 2nd Story, Half Story,
# Attic, ...), over 24,862 DwellingIDs on 24,739 Parcels, 2.44 floors
# per dwelling. ARC records the room and bath counts on the floor
# rows, so the dwelling's counts are the sum of its floors and the
# property's the sum of its dwellings; every row carries Parcel, so
# the recipe's sum per property does both at once.
#
# Measured, summed per dwelling:
#   Room Count        93.4% above zero, median 7
#   Bedroom Count     98.1% above zero, median 3
#   Extra Full Bath   99.4% above zero, median 2
#   Extra Half Bath   50.0% above zero
# 87.1% of the roll's 15,065 land-use 510-530 properties have
# bedrooms here (the rest carry no dwelling).
#
# BATH ENCODING, INFERRED: despite the "Extra" in the names, the full
# and half counts read as totals, not as baths beyond a base bath.
# Summed per dwelling, full baths are 1 on 26%, 2 on 53%, 3 on 15%,
# and fewer than 0.7% of dwellings have none, while Plumbing Base is
# True on 99%. An "extra beyond base" count would leave most
# one-bath houses at 0. This could not be confirmed on the Beacon
# parcel pages (Cloudflare), so a person should spot-check a few
# before relying on it. Extra Fixtures is a separate fixture count
# and is not mapped. n_bathrooms folds full + 0.5 x half.

description: >-
  Union County, OH ARC dwelling-floor table: rooms, bedrooms, full and
  half baths per floor, summed to the property.

admin_id: US-OH-UN

entity:
  entity_type: property
  source:
    source_id: unioncounty
    # Same host and terms as the roll; see its terms note.
    license: "unknown (no licence on the portal items; no terms on the download host)"
    redistribution_restricted: null
    portal_url: "https://www8.co.union.oh.us/mapunionoh/"
    download_url: "https://www2.co.union.oh.us/propertyinfofile/TB_ARC_DwellingFloors.zip"
  version: "2026"

compressed_file_name: "TB_ARC_DwellingFloors.zip"
uncompressed_file_name: "TB_ARC_DwellingFloors/TB_ARC_DwellingFloors.txt"

process_by:
  admin_level: 3

delimiter: "|"
encoding: latin-1
csv_dtype: str

columns:
  parcel_id_assessor: Parcel
  n_rooms: Room Count
  n_bedrooms: Bedroom Count
  n_bathrooms: Extra Full Bath
  n_half_bathrooms: Extra Half Bath

transformations:
  - type: unary
    operation: to_numeric
    input: n_rooms
    output: n_rooms
  - type: unary
    operation: to_numeric
    input: n_bedrooms
    output: n_bedrooms
  - type: unary
    operation: to_numeric
    input: n_bathrooms
    output: n_bathrooms
  - type: unary
    operation: to_numeric
    input: n_half_bathrooms
    output: n_half_bathrooms
  # n_bathrooms = full + 0.5 x half, per floor; summed below.
  - type: expression
    expression: "n_half_bathrooms * 0.5"
    inputs: [n_half_bathrooms]
    output: half_bathroom_equivalent
  - type: aggregate
    operation: sum
    inputs: [n_bathrooms, half_bathroom_equivalent]
    output: n_bathrooms

drop_columns:
  - half_bathroom_equivalent

aggregation_function:
  n_rooms: sum
  n_bedrooms: sum
  n_bathrooms: sum
  n_half_bathrooms: sum

supplements: US-OH-UN_property-unioncounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: floors
