# Recipe: Union County, OH auditor roll, ARC
# TB_ARC_DwellingExtraFeatures table. Supplement of
# US-OH-UN_property-unioncounty-2026; see that recipe for the source,
# the terms and the join key.
#
# One row per extra feature priced on a dwelling (25 codes), with
# Code, Code Description and Area in sqft. Read here:
#   porches  OFP, EFP (open, enclosed frame porch), OMP, EMP (open,
#            enclosed masonry porch), PORT (portico / 2-story OFP)
#   decks    WDDK (wood or vinyl deck), CPAT1-CPAT3 (concrete patio),
#            CVP (covered patio)
# Cathedral and vaulted ceilings, bay windows, pergolas, stoops,
# canopies, roof extensions, balconies, breezeways, attached sheds,
# lean-tos and cellars are not read. A property with feature rows but
# none of these reads 0.
#
# MEASURED 2026-09-13: 70,436 rows over 23,097 parcels, keys 99.99%
# in the roll. On the 14,779 live land-use 510 properties: porch area
# > 0 on 76.3% (median 120 sqft), deck or patio area > 0 on 73.2%.

description: >-
  Union County, OH ARC dwelling extra-features table: porch area and
  deck and patio area per property.

admin_id: US-OH-UN

entity:
  entity_type: property
  source:
    source_id: unioncounty
    # Same host and terms as the roll; see its terms note.
    license: "unknown (no licence on the portal items; no terms on the download host)"
    redistribution_restricted: null
    portal_url: "https://www8.co.union.oh.us/mapunionoh/"
    download_url: "https://www2.co.union.oh.us/propertyinfofile/TB_ARC_DwellingExtraFeatures.zip"
  version: "2026"

compressed_file_name: "TB_ARC_DwellingExtraFeatures.zip"
uncompressed_file_name: "TB_ARC_DwellingExtraFeatures/TB_ARC_DwellingExtraFeatures.txt"

process_by:
  admin_level: 3

delimiter: "|"
encoding: latin-1
csv_dtype: str

columns:
  parcel_id_assessor: Parcel

transformations:
  - type: unary
    operation: to_numeric
    input: Area
    output: item_area
  - type: remap
    input: Code
    mapping: {OFP: 1, EFP: 1, OMP: 1, EMP: 1, PORT: 1}
    default: 0
    output: porch_row
  - type: remap
    input: Code
    mapping: {WDDK: 1, CPAT1: 1, CPAT2: 1, CPAT3: 1, CVP: 1}
    default: 0
    output: deck_row
  - type: binary
    operation: multiply
    inputs: [item_area, porch_row]
    output: porch_area_sqft
  - type: binary
    operation: multiply
    inputs: [item_area, deck_row]
    output: deck_area_sqft

drop_columns:
  - item_area
  - porch_row
  - deck_row

aggregation_function:
  porch_area_sqft: sum
  deck_area_sqft: sum

supplements: US-OH-UN_property-unioncounty-2026

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: cache
  filename: features
