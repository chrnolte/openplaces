# Recipe: Jones County, NC parcel roll.
#
# Source: the county's ArcGIS FeatureServer layer (`services3.arcgis.com`,
# org id nJbIFHiSnaX0z0hS, service `Jones_Bitek`), backing the county's Web
# AppBuilder viewer. Caps a single query at 1,000 features
# (`maxRecordCount`), so `arcgis_rest_scraper` pages through it.
#
# NOTE: no year_built field in this layer's schema (verified). Land and
# building value are populated (992/1000 and 545/1000 sampled records
# respectively), so land/building value is included as a bonus.
#
# Values: the layer states both bases on every valued row. Market:
# `marketlandvalue` and `marketvalue`. Present-use (taxable):
# `assessedlandvalue` and `assessedvalue`. `deferredvalue` is the
# amount the present-use program defers. `totalbuildingvalue` is
# `buildingvalue` plus `obxfvalue` and is the same on both bases.
# Measured 2026-11-19 on US-NC-JON: on all 9,333 valued rows
# marketlandvalue = assessedlandvalue + deferredvalue, marketvalue =
# marketlandvalue + totalbuildingvalue, and assessedvalue =
# assessedlandvalue + totalbuildingvalue.
# land_value and total_value take the market figures. The present-use
# land goes to current_use_value, only on rows where it differs from
# the market land (the program's rows); elsewhere it is left missing.
# No use-basis total is carried: it is the market total less
# deferredvalue. Neither assessedvalue nor deferredvalue is mapped.

description: >-
  Jones County, NC parcel roll (market and present-use land values, total
  value, owner, situs, deed reference) from the county's ArcGIS parcel
  layer. No year built is available from this source.

admin_id: US-NC-JON

entity:
  entity_type: parcel
  source:
    source_id: jonescounty
    # Checked 2026-08-20 against the ArcGIS REST service this recipe
    # reads: neither copyrightText nor licenseInfo is set on the service
    # or its layer, so the endpoint openplaces actually uses states no
    # terms. Checked and absent, not unexamined -- but this speaks only
    # for that endpoint, not for anything the county may publish
    # elsewhere.
    license: "unknown (service declares no copyright or licence)"
    redistribution_restricted: null
    portal_url: "https://agdonline.maps.arcgis.com/apps/webappviewer/index.html?id=1a75ffe4b94c46748cd14c475ffc94ad"
    download_url_scraper: arcgis_rest_scraper
  version: "2026"

uncompressed_file_name: "jones_parcels.geojson"

scraper_options:
  layer_url: "https://services3.arcgis.com/nJbIFHiSnaX0z0hS/arcgis/rest/services/Jones_Bitek/FeatureServer/0"
  where: "1=1"
  out_fields: "*"

columns:
  parcel_id_assessor: pin83
  address: formattedpropertyaddress
  owner_name: name1
  owner_name_2: name2
  land_value: marketlandvalue
  improvement_value: totalbuildingvalue
  special_feature_value: obxfvalue
  total_value: marketvalue
  current_use_value: assessedlandvalue
  last_sale_date: deeddate
  last_sale_price: saleprice

transformations:
  - type: string
    operation: concat
    inputs: [deedbook, deedpage]
    args:
      sep: "-"
    output: last_sale_book_page
  # current_use_value only where it differs from the market land: the
  # gap is emptied where it is 0, so adding the land back leaves the
  # cell missing on rows outside the present-use program.
  - type: binary
    operation: subtract
    inputs: [current_use_value, land_value]
    output: _use_gap
  - type: unary
    operation: null_if_equal
    input: _use_gap
    args: {value: 0}
    output: _use_gap
  - type: binary
    operation: add
    inputs: [_use_gap, land_value]
    output: current_use_value

drop_columns:
  - _use_gap

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
