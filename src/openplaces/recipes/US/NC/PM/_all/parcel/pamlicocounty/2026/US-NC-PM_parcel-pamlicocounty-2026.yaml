# Recipe: Pamlico County, NC parcel roll.
#
# Source: the county's ArcGIS FeatureServer layer (`services3.arcgis.com`,
# org id nJbIFHiSnaX0z0hS, service `Pamlico_ParcelService`, layer
# `Parcel_Poly`), reached not through the county's own JS-only map viewer
# (no discoverable REST endpoint) but through the shared AGD organization's
# service directory. Caps a single query at 2,000 features
# (`maxRecordCount`), so `arcgis_rest_scraper` pages through it.
#
# NOTE: the same service also has an address-point layer with a `yearBuilt`
# field (`BuildingPoints`, layer 0) that looked promising, but it is
# entirely null across all 9,191 records (verified) -- an unpopulated NENA
# E911-schema field, not real data. Not used. Land and building value in
# this parcel layer are populated (977/1000 and 638/1000 sampled records
# respectively), so land/building value is included as a bonus.
#
# NOTE: this county needs a `conv: simple` row in
# US_parcel_id-overrides.csv, scoped to this source_id. The bundled
# default for US-NC-PM (`pattern: Sx-[S.]x(-Sx)(-Sx)(-Sx)`) expects a
# separator-delimited id; this layer's PIN has no separators and no
# fixed width, mixing bare 10-digit keys with 13-digit ones carrying a
# 3-digit suffix ('9999999999' alongside '9999999999000'). The dashed
# pattern matched nothing, so parcel_id_local came out null for every
# row -- and since last_sale_price and the value fields reach the
# parcel spine only through the parcel_id_local join (they are not in
# the spine's keep_columns), the whole roll was silently dropped rather
# than erroring. `simple` recovers 99.9% of rows at 17,086 distinct
# keys against 17,087 raw distinct values, i.e. one added duplicate,
# far inside the 0.5% guard. The mixed widths are left as they are:
# padding the short form to 13 would assume a '000' suffix this source
# never states.
#
# NOTE: NC OneMap needs its own override row here too, scoped to
# `source_id: nconemap` at US-NC-PM. Its ALTPARNO for this county is not
# a parcel id at all but a 4-digit block code -- 140 distinct values
# across 17,109 parcels -- so no conversion can make a usable key of it
# (the same defect as Carteret's truncated ALTPARNO, and the reason the
# coverage guard in compute_parcel_id_local warns separately when a
# fallback resolves to far fewer keys than rows). The row points
# `source` at parcel_id_admin3 (PARNO) instead, which under `simple`
# gives 17,086 distinct keys meeting 99.7% of this roll.

description: >-
  Pamlico County, NC parcel roll (assessed land/building/total values,
  owner, situs, most recent sale) from the county's ArcGIS parcel layer. No
  year built is available from this source.

admin_id: US-NC-PM

entity:
  entity_type: parcel
  source:
    source_id: pamlicocounty
    portal_url: "https://pamlicocounty.org/online_services/gis_mapping_service.php"
    download_url_scraper: arcgis_rest_scraper
  version: "2026"

uncompressed_file_name: "pamlico_parcels.geojson"

scraper_options:
  layer_url: "https://services3.arcgis.com/nJbIFHiSnaX0z0hS/arcgis/rest/services/Pamlico_ParcelService/FeatureServer/5"
  where: "1=1"
  out_fields: "*"

columns:
  parcel_id_assessor: PIN
  address: SITUS_ADDR
  owner_name: OWNER_NAME
  owner_name_2: OWNER_NAME2
  owner_address: OWNER_ADDR
  owner_city: OWNER_CITY
  owner_admin2_id_admin1: OWNER_STATE
  owner_postal_code: OWNER_ZIP
  legal_description: LEGAL_DESC
  last_sale_date: SALEDATE
  last_sale_price: SALE_AMT
  land_value: LAND_VAL
  improvement_value: BLDG_VAL
  total_value: TOTAL_VAL

transformations:
  - type: string
    operation: concat
    inputs: [DEEDBOOK, DEEDPAGE]
    args:
      sep: "-"
    output: last_sale_book_page

columns_to_categorical:
  - owner_admin2_id_admin1

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
