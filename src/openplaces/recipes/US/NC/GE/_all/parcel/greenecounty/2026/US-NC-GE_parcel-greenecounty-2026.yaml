# Recipe: Greene County, NC parcel roll.
#
# Source: the county's ArcGIS FeatureServer layer (hosted by GIS vendor AGD,
# org id nJbIFHiSnaX0z0hS), backing its public parcel viewer (BIS
# Consultants CAMA schema). Caps a single query at 1,000 features
# (`maxRecordCount`), so `arcgis_rest_scraper` pages through it.
#
# NOTE: the schema also has a `LAND_VALUE`/`HOUSE_VALUE` pair that reads as
# the obvious mapping, but both are 0 across every sampled record --
# apparently a stale/unused legacy pair. `CURRENT_LAND_VALUE`/
# `CURRENT_BLDG_VALUE` are the real, populated fields (995/1000 and
# 657/1000 sampled records) and are used instead. No year_built field
# exists anywhere in this layer's very wide (180+ field) schema.

description: >-
  Greene County, NC parcel roll (assessed land/building/total values,
  owner, situs, deed reference) from the county's ArcGIS parcel layer. No
  year built is available from this source.

admin_id: US-NC-GE

entity:
  entity_type: parcel
  source:
    source_id: greenecounty
    portal_url: "https://greenecountygis.com/"
    download_url_scraper: arcgis_rest_scraper
  version: "2026"

uncompressed_file_name: "greene_parcels.geojson"

scraper_options:
  layer_url: "https://services3.arcgis.com/nJbIFHiSnaX0z0hS/arcgis/rest/services/Greene_Service/FeatureServer/4"
  where: "1=1"
  out_fields: "*"

columns:
  parcel_id_assessor: pin
  address: PROPERTY_LOCATION
  owner_name: OWNER_NAME_1
  owner_name_2: OWNER_NAME_2
  owner_address: MAILING_ADDRESS_1
  owner_city: CITY
  owner_admin2_id_admin1: STATE_OR_COUNTRY
  owner_postal_code: ZIP_CODE
  last_sale_date: DEED_DATE
  land_value: CURRENT_LAND_VALUE
  improvement_value: CURRENT_BLDG_VALUE
  value: TOTAL_ASSESSED
  subdivision: SUBDIVISION

transformations:
  - type: string
    operation: concat
    inputs: [DEED_BOOK, DEED_PAGE]
    args:
      sep: "-"
    output: last_sale_book_page

columns_to_categorical:
  - owner_admin2_id_admin1

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
