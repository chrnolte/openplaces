# Recipe: Wilson County, NC parcel roll.
#
# Source: the county's own ArcGIS Server (`gis.wilson-co.com`, on-prem,
# not ArcGIS Online), service `Open_gov/Opengov_Address_Taxparcels`. Caps
# a single query at 2,000 features (`maxRecordCount`), so
# `arcgis_rest_scraper` pages through it.
#
# NOTE: a bulk download exists for this layer and is deliberately NOT
# used -- the one county in this batch where bulk is the wrong choice.
# The service is registered as an ArcGIS Online item
# (059aeeb406a34f05b55e6ab05aeb0101), and the Hub download API does
# return a ~273 MB GeoJSON for it, but that export carries only the base
# geometry: PIN, CACRES and OBJECTID are populated and every CAMA field
# is null. Measured on the real export -- 42,097 rows, of which just 341
# had a value in SalesAmount, LandFMVCur or PhysicalStreetAddress, i.e.
# 0.8%, against 44.2% for SalesAmount when the same fields are read
# through the REST layer. The layer is a join/view that the live service
# resolves per query and Hub materializes without, so the two are not
# interchangeable here. Paging costs ~22 sequential requests; getting
# the attributes at all is worth them.
#
# The lesson generalizes: before switching any layer to a Hub bulk URL,
# compare a populated field's fill rate between the export and the REST
# layer, not just the feature count.
#
# The richest CAMA join of the nine counties added in this pass --
# values in both assessed and fair-market form, year built, finished
# area, story count, sale instrument and qualification code.
#
# IMPORTANT: this is an *address*-keyed parcel layer, not a parcel-keyed
# one, and it carries genuine duplicate parcels: 43,538 features against
# NC OneMap's 43,196, with PIN resolving to only 3,644 distinct values
# per 4,000 sampled rows. A parcel with several addresses appears
# several times, each row repeating the same geometry and the same CAMA
# attributes. This is not an ingest defect to fix here -- the raw field
# has exactly that many distinct values, so the id conversion adds no
# duplicates of its own and the guard in compute_parcel_id_local passes.
# It does mean the spine's link_by_id keeps one arbitrary row per key
# (its 'attributes' mode drops duplicates), which is harmless while the
# duplicated rows agree, and that per-parcel counts taken directly off
# this table will overcount. Deduplicating on PIN before use is the safe
# habit.
#
# Join key: PIN ('9999-99-9999.000'), which matches NC OneMap's own
# parcel_id_local on 98.3% of sampled rows under the bundled `simple`
# conversion, so no id-override row is needed.
#
# NOTE on the sale date: DateSold is an integer in 'YYYYMMDD' form
# (20011009), not a date and not an epoch offset. Mapping it to
# last_sale_date would store a bare number that pandas reads as
# nanoseconds since 1970, so it is deliberately left unmapped and the
# clean DeedYear field (98.2% populated) carries the sale year instead.
# Recovering the full date needs a string round-trip this recipe layer
# cannot express today.
#
# NOTE on values: the layer publishes both an assessed family
# (Land/Improve/TotalASVCur) and a fair-market family
# (Land/Improve/TotalFMVCur). The fair-market split is mapped to
# land_value/improvement_value and its total to market_value; the
# assessed total becomes `value`, matching how the other NC recipes use
# that column.
#
# Building features, MEASURED 2026-09-13 in memory (residential =
# ParcelDescrCode2 R, 38,110 rows; per PIN after deduplication the
# rates are 1 to 2 points higher): living_area_sqft (finished area
# summed over the three improvements, median 1,610; above the first
# improvement's area on 1,321 rows) 75.7%, quality grade
# (QualityGradeCode1Imp, 28 codes
# of the form 'C+05') 80.6%, HVAC description (HVACDesc1Imp, 22
# values) as heating_type 75.3%, has_central_air 74.2% (25,286 true,
# 3,000 false), style (ComponentDesc1Imp, 20 values) 75.4%, effective
# year 75.5%. has_basement and has_garage 75.7% each (235 and 6,766
# true): the Y/N fields are filled on vacant parcels too, so the
# flags are kept only where a finished area exists.
# BasementCompType1Imp reads UBM on 170 rows whose flag says N; the
# flag is trusted. garage_type (AttGarCompType1Imp, codes AC1021 to
# AC1028, attached garages only) 17.6%. FireplaceY_N1Imp (Y on 15,668
# rows) is a flag, not the count n_fireplaces needs, and has no
# registry home. HVACNumberOFUnits1Imp equals the finished area on
# 77% of rows and is not a unit count.

description: >-
  Wilson County, NC parcel roll (market and assessed values, year built, floor
  area, owner, situs, most recent sale) from the county's ArcGIS parcel layer.

admin_id: US-NC-WIL

entity:
  entity_type: parcel
  source:
    source_id: wilsoncounty
    # Checked 2026-08-20 against the ArcGIS REST service this recipe
    # reads: neither copyrightText nor licenseInfo is set on the service
    # or its layer, so the endpoint openplaces actually uses states no
    # terms. Checked and absent, not unexamined -- but this speaks only
    # for that endpoint, not for anything the county may publish
    # elsewhere.
    license: "unknown (service declares no copyright or licence)"
    redistribution_restricted: null
    portal_url: "https://gis.wilson-co.com/"
    download_url_scraper: arcgis_rest_scraper
  version: "2026"

uncompressed_file_name: "wilson_parcels.geojson"

scraper_options:
  layer_url: "https://gis.wilson-co.com/arcgis/rest/services/Open_gov/Opengov_Address_Taxparcels/FeatureServer/0"
  where: "1=1"
  out_fields: "*"

columns:
  parcel_id_assessor: PIN
  address: PhysicalStreetAddress
  city: CityCodeDesc
  owner_name: Name1
  owner_name_2: Name2
  owner_address: TaxpayerAddress1
  owner_address_2: TaxpayerAddress2
  owner_city: TaxpayerCity
  owner_admin2_id_admin1: State
  owner_postal_code: ZIPCode
  legal_description: LegalDescription1
  use_group: Description1
  use_group_code: ParcelDescrCode2
  tax_neighborhood_code: NeighborhoodCodeDesc
  tax_year: TaxYear
  year_built: YearActuallyBuilt1Imp
  n_stories: NumberOfStories1Imp
  # Structure detail: this layer numbers its fields per improvement
  # (1Imp, 2Imp, 3Imp). Year and stories take the first
  # improvement. Room counts are summed over all three below, because
  # a parcel's rooms are those of every dwelling on it (504 parcels
  # carry baths on a second or third improvement). FBT is the full
  # bath count and HBT the half count (18.4% of rows); n_bathrooms
  # folds them as full + 0.5 x half.
  n_bedrooms: NumberofBedrooms1Imp
  n_bathrooms: NumberofFBT1Imp
  n_half_bathrooms: NumberOfHBT1Imp
  quality_grade: QualityGradeCode1Imp
  heating_type: HVACDesc1Imp
  building_style: ComponentDesc1Imp
  garage_type: AttGarCompType1Imp
  effective_year_built: EffYrBuilt
  last_sale_year: DeedYear
  last_sale_price: SalesAmount
  last_sale_doc_type: SalesInstrumentDesc
  last_sale_qualification_code: QualifyCodeDesc
  land_value: LandFMVCur
  improvement_value: ImproveFMVCur
  market_value: TotalFMVCurrent
  total_value: TotalASVCurrent
  current_use_value: LandLUVCur

transformations:
  - type: string
    operation: concat
    inputs: [DeedBook, DeedPage]
    args:
      sep: "-"
    output: last_sale_book_page
  # Sum each room count over the three improvements; min_count keeps a
  # parcel null when no improvement records the count.
  - type: aggregate
    operation: sum
    inputs: [n_bedrooms, NumberofBedrooms2Imp, NumberofBedrooms3Imp]
    output: n_bedrooms
  - type: aggregate
    operation: sum
    inputs: [n_bathrooms, NumberofFBT2Imp, NumberofFBT3Imp]
    output: n_bathrooms
  - type: aggregate
    operation: sum
    inputs: [n_half_bathrooms, NumberOfHBT2Imp, NumberOfHBT3Imp]
    output: n_half_bathrooms
  # n_bathrooms = full + 0.5 x half. The sum keeps a row null only when
  # both counts are, so a missing half count reads as zero halves (9
  # rows carry a half count with no full count and read 0.5 x half).
  - type: expression
    expression: "n_half_bathrooms * 0.5"
    inputs: [n_half_bathrooms]
    output: half_bathroom_equivalent
  - type: aggregate
    operation: sum
    inputs: [n_bathrooms, half_bathroom_equivalent]
    output: n_bathrooms
  # Finished area summed over the three improvements, as the room
  # counts are.
  - type: aggregate
    operation: sum
    inputs: [FinishedArea1Imp, FinishedArea2Imp, finishedArea3Imp]
    output: living_area_sqft
  - type: unary
    operation: null_if_equal
    input: living_area_sqft
    args: {value: 0}
    output: living_area_sqft
  # Basement and attached-garage flags: every improvement slot carries
  # an explicit Y or N, so N is a recorded absence. The parcel flag is
  # the max over the three improvements, kept only where a finished
  # area says a building exists: the layer writes N on vacant parcels
  # too. The garage flag covers attached garages only; a detached
  # garage is not recorded here.
  - type: remap
    input: BasementY_N1Imp
    mapping: {"Y": 1, "N": 0}
    output: basement_1
  - type: remap
    input: BasementY_N2Imp
    mapping: {"Y": 1, "N": 0}
    output: basement_2
  - type: remap
    input: BasementY_N3Imp
    mapping: {"Y": 1, "N": 0}
    output: basement_3
  - type: aggregate
    operation: max
    inputs: [basement_1, basement_2, basement_3]
    output: basement_any
  - type: expression
    expression: "basement_any * living_area_sqft / living_area_sqft"
    inputs: [basement_any, living_area_sqft]
    output: basement_any
  - type: remap
    input: basement_any
    mapping: {1: true, 0: false}
    output: has_basement
  - type: remap
    input: AttachedGarageY_N1Imp
    mapping: {"Y": 1, "N": 0}
    output: garage_1
  - type: remap
    input: AttachedGarageY_N2Imp
    mapping: {"Y": 1, "N": 0}
    output: garage_2
  - type: remap
    input: AttachedGarageY_N3Imp
    mapping: {"Y": 1, "N": 0}
    output: garage_3
  - type: aggregate
    operation: max
    inputs: [garage_1, garage_2, garage_3]
    output: garage_any
  - type: expression
    expression: "garage_any * living_area_sqft / living_area_sqft"
    inputs: [garage_any, living_area_sqft]
    output: garage_any
  - type: remap
    input: garage_any
    mapping: {1: true, 0: false}
    output: has_garage
  # has_central_air from each improvement's HVAC description: true
  # where it names AC or a system that cools (heat pump, gas pack,
  # packaged rooftop unit), false for "No Air Conditioning" (the only
  # value whose code ends in N), null for heat-only descriptions.
  - type: remap
    input: heating_type
    mapping: &central_air
      "Forced Hot Air w/ AC": true
      "Added Air Conditioning": true
      "Heat Pump Electric": true
      "Heat Pump Reversing Cycle": true
      "Gas Pack": true
      "Packaged Rooftop": true
      "No Air Conditioning": false
    output: central_air_1
  - type: remap
    input: HVACDesc2Imp
    mapping: *central_air
    output: central_air_2
  - type: remap
    input: HVACDesc3Imp
    mapping: *central_air
    output: central_air_3
  - type: aggregate
    operation: max
    inputs: [central_air_1, central_air_2, central_air_3]
    output: has_central_air

drop_columns:
  - half_bathroom_equivalent
  - basement_1
  - basement_2
  - basement_3
  - basement_any
  - garage_1
  - garage_2
  - garage_3
  - garage_any
  - central_air_1
  - central_air_2
  - central_air_3

columns_to_categorical:
  - quality_grade
  - heating_type
  - building_style
  - garage_type
  - use_group
  - use_group_code
  - tax_neighborhood_code
  - last_sale_doc_type
  - last_sale_qualification_code
  - owner_admin2_id_admin1

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
