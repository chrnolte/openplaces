# Recipe to import North Carolina building permit records from Shovels

description: >-
  North Carolina statewide building permit records from Shovels (2026),
  used as an independent occupancy_type evidence source for footprints.

# Administrative unit identifier: where does this data come from?
admin_id: US-NC

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: property
  # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: shovels
    # Terms verified 2026-08-20 at the terms_url below. The most
    # restrictive source in the catalog: a customer may not "resell,
    # transfer, distribute, publish, sublicense, or otherwise make
    # available ... the Data", nor "create derivative works of ... the
    # Data (including any datasets, models, data products, or other
    # works that are based on or trained on the Data)". Use is licensed
    # "solely for its internal business purposes", and on termination
    # all copies must be removed.
    #
    # openplaces is not a party to that agreement -- whoever runs this
    # recipe brings their own Shovels account and contracts directly,
    # which is exactly why recipes never embed credentials. But anyone
    # using this data to validate or tune a published classification
    # should read the derivative-works clause first: it is broader than
    # a redistribution ban.
    license: "proprietary; internal use only, no redistribution, no derivative works"
    terms_url: "https://www.shovels.ai/terms"
    redistribution_restricted: true
    portal_url: "https://www.shovels.ai"
    # No download_url: obtained via a data-sharing agreement, not a stable
    # public URL. Place `Permit.parquet` into this recipe's external-file
    # cache manually (see compressed_file_name below).
  version: 2026

# Name of the (already flat, uncompressed) source file. Deliberately not
# also declaring compressed_file_name: that combination would make the
# ingester expect a heap-directory copy produced by unzipping an archive.
# A flat file has no archive to unzip, so downloaded_path must resolve to
# the same external-directory path as data_path (see TableIngester's
# 'the source is a flat file ... fetched directly' comment).
uncompressed_file_name: "Permit.parquet"

# One row per permit (many permits per parcel over time), so this recipe is
# read whole-state in a single pass: parquet source files don't support
# FID-based admin_id_column chunking (`fid`-based selection might not work
# with `parquet`, see TableIngester._read_recipe_data), so admin_id must
# always be ingested at its own top level (US-NC), never a sub-county id
# directly. The per-county split below happens post-hoc at save time from
# the admin3_id column this recipe derives itself.
process_by:
  admin_level: 2

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  permit_id_local: ID
  parcel_id_assessor: APN
  county_fips: COUNTY_FIPS
  county_name: COUNTY
  street_no: STREET_NO
  street: STREET
  city: CITY
  postal_code: ZIPCODE
  jurisdiction: JURISDICTION
  jurisdiction_id: JURISDICTION_ID
  owner_name: OWNER_NAME
  property_legal_owner: PROPERTY_LEGAL_OWNER
  property_owner_type: PROPERTY_OWNER_TYPE
  property_type: PROPERTY_TYPE
  property_type_detail: PROPERTY_TYPE_DETAIL
  area_sqft: PROPERTY_BUILDING_AREA
  year_built: PROPERTY_YEAR_BUILT
  permit_type: TYPE
  permit_subtype: SUBTYPE
  permit_description: DESCRIPTION
  permit_start_date: START_DATE
  permit_end_date: END_DATE
  permit_issue_date: ISSUE_DATE
  permit_file_date: FILE_DATE
  permit_final_date: FINAL_DATE
  is_addition: ADDITION
  is_adu: ADU
  is_bathroom: BATHROOM
  is_battery: BATTERY
  is_demolition: DEMOLITION
  is_electric_meter: ELECTRIC_METER
  is_electrical: ELECTRICAL
  is_ev_charger: EV_CHARGER
  is_fire_sprinkler: FIRE_SPRINKLER
  is_gas: GAS
  is_generator: GENERATOR
  is_grading: GRADING
  is_heat_pump: HEAT_PUMP
  is_hvac: HVAC
  is_kitchen: KITCHEN
  is_new_construction: NEW_CONSTRUCTION
  is_plumbing: PLUMBING
  is_pool_and_hot_tub: POOL_AND_HOT_TUB
  is_remodel: REMODEL
  is_roofing: ROOFING
  is_solar: SOLAR
  is_water_heater: WATER_HEATER
  is_window_door: WINDOW_DOOR

# Resolve openplaces's admin3_id from Shovels' COUNTY name text, NOT
# COUNTY_FIPS: COUNTY_FIPS is unreliable in this source -- verified against
# the raw data that most COUNTY_FIPS values are decoupled from the row's
# actual COUNTY text (e.g. rows with COUNTY='CARTERET', the true FIPS 031,
# are scattered across a dozen unrelated FIPS codes, and FIPS 031 itself
# has zero rows). COUNTY text, by contrast, has all 100 distinct values
# matching real NC county names exactly (verified against
# US_admin-census-2021_admin3's own name list), so it's the trustworthy key.
transformations:
  - output: admin3_id
    type: remap_file
    input: county_name
    # Recipe-owned NC-only COUNTY-name -> admin3_id crosswalk (100 counties,
    # no duplicates), generated from US_admin-census-2021_admin3's own
    # output.
    crosswalk_id: US-NC_property-shovels-2026_county-name-remap
  # Independent occupancy_type evidence, mapped from Shovels' own
  # residential/commercial use classification (see the sidecar remap CSV;
  # property_type_detail and property_type are co-null on every row in the
  # source, so there is no fallback benefit to also mapping property_type).
  - output: occupancy_type_raw
    type: remap_file
    input: property_type_detail
    crosswalk_id: US-NC_property-shovels-2026_occupancy-type-remap

# The source parquet's own embedded pandas index is a leftover per-chunk
# RangeIndex from Shovels' export pipeline (heavily duplicated: only ~435K
# unique values across 4.4M rows), so it can't be used as-is. permit_id_local
# (the source's own record hash) is genuinely unique per row.
set_index: permit_id_local

transformation_patterns:
  - type: unary
    operation: to_numeric
    pattern: "{column}"
    apply_to_columns: [area_sqft, year_built]

columns_to_categorical:
  - property_type
  - property_type_detail
  - property_owner_type
  - occupancy_type_raw
  - county_name
  - permit_type

save_to:
  data_dir: core
  admin_level: 3

# Standardized cross-comparable matching key from the permit's own parcel
# number (APN) -- links these permits to NC parcel/assessment sources that
# share the same county-assigned APN system.
parcel_id_local:
  source: parcel_id_assessor
  kind: parcel
