# Recipe to import the parcel database of the state of North Carolina, US

description: >-
  North Carolina statewide parcel database from NC OneMap (2025).

# Administrative unit identifier: where does this data come from?
admin_id: US-NC

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: parcel
   # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: nconemap
    # Searched 2026-08-20: the portal is an ArcGIS Hub site whose pages
    # render client-side, so no terms document was reachable, and none
    # surfaced by search either. Same result as the ncdps footprints.
    # North Carolina government records are public records (N.C.G.S.
    # ch. 132), which likely explains the absence -- but "none found" is
    # not "none exists".
    license: "unknown"
    redistribution_restricted: null
    portal_url: "https://www.nconemap.gov/pages/parcels"
    # URL to download (takes a while: this is a 2.32G file)
    download_url: "https://dit-cgia-gis-data.s3.amazonaws.com/NCOM-data/parcels/nc-parcels-gdb-most-recent.zip"
  version: 2025

# Name of compressed file (set to skip re-downloading)
compressed_file_name: "nc-parcels-gdb-most-recent.zip"

# Name of uncompressed file (set to skip re-extracting)
uncompressed_file_name: "NC_Parcels_all.gdb"

# Layer to parcel polygons
layer: nc_parcels_poly

# Column that splits the data into chunks for processing
# (avoids reading very large geodatabase into memory)
process_by:
  admin_level: 3
  admin_id_column: stcntyfips
  admin_id_crosswalk:
    admin_level: 3
    admin_id_column: admin3_id_admin1
    admin_recipe_id: "admin-openplaces-2026_admin3"

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  parcel_id_admin2: nparno
  parcel_id_admin3: parno
  parcel_id_assessor: altparno
  address: siteadd
  address_unit: sunit
  city: scity
  subdivision: subdivisio
  legal_description: legdecfull
  use_group: parusedesc
  use_group_code: parusecode
  use_subgroup: parusedsc2
  use_subgroup_code: parusecd2
  owner_name: ownname
  owner_name_2: ownname2
  owner_address: mailadd
  owner_city: mcity
  owner_admin2_id_admin1: mstate
  owner_postal_code: mzip
  has_structure: struct
  n_buildings: structno
  # structyear is 0 (not null) wherever this county's contribution to the
  # statewide layer never recorded a construction year -- nulled generically
  # at ingest (attribute_registry.csv's year_built null_placeholder).
  year_built: structyear
  has_multi_structure: multistruc
  value_type: parvaltype
  total_value: parval
  improvement_value: improvval
  land_value: landval
  last_sale_date: saledate
  last_sale_date_2: saledatetx
  source: sourceagnt
  source_date: transfdate
  source_deed: sourceref
  source_map: mapref

columns_to_categorical:
  - use_group
  - use_group_code
  - use_subgroup
  - use_subgroup_code
  - owner_city
  - value_type
  - source
  - source_date

# Standardized matching key from the assessor parcel number (altparno), per
# county (auto conversion; processed per admin3). Connects these GIS parcels to
# the assessment roll and the sales transactions.
#
# altparno is a county-contributed field and is empty in some counties'
# submissions, which leaves their parcels unjoinable to any local roll.
# Those counties are redirected to another id column by an admin-scoped
# row in US_parcel_id-overrides.csv rather than by changing the default
# here -- see the US-NC-CAT and US-NC-CAB rows, and the note in
# US-NC-CAT_parcel-cravencounty-2026.yaml.
parcel_id_local:
  source: parcel_id_assessor
  kind: parcel