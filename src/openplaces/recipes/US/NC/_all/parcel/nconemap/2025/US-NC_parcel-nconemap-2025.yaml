# Recipe to import the parcel database of the state of North Carolina, US

# Administrative unit identifier: where does this data come from?
admin_id: US-NC

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: parcel
   # What is the source and URL of a dataset that identifies each unit?
  source: 
    source_id: nconemap
    portal_url: "https://www.nconemap.gov/pages/parcels"
    # URL to download (takes a while: this is a 2.32G file)
    download_url: "https://dit-cgia-gis-data.s3.amazonaws.com/NCOM-data/parcels/nc-parcels-gdb-most-recent.zip"
  version: 2025

# Name of compressed file (set to skip re-downloading)
compressed_file_name: "nc-parcels-gdb-most-recent.zip"

# Name of uncompressed file (set to skip re-extracting)
uncompressed_file_name: "NC_Parcels_all.gdb"

# Layer to parcel polygons
layer: nc_parcels_poly

# Column that splits the data into chunks for processing
# (avoids reading very large geodatabase into memory)
process_by:
  admin_level: 3
  admin_id_column: stcntyfips
  admin_id_crosswalk:
    admin_level: 3
    admin_id_column: admin3_id_admin1
    admin_recipe_id: "US_admin-nhgis-2020_admin3"

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  parcel_id_admin2: nparno
  parcel_id_admin3: parno
  parcel_id_admin3_2: altparno
  address: siteadd
  address_unit: sunit
  city: scity
  subdivision: subdivisio
  legal_description: legdecfull
  purpose_group: parusedesc
  purpose_group_code: parusecode
  purpose_subgroup: parusedsc2
  purpose_subgroup_code: parusecd2
  owner_name: ownname
  owner_name_2: ownname2
  owner_address: mailadd
  owner_city: mcity
  owner_admin2_id_admin1: mstate
  owner_postal_code: mzip
  has_structure: struct
  n_buildings: structno
  year_built: structyear
  has_multi_structure: multistruc
  value_type: parvaltype
  value: parval
  improvement_value: improvval
  land_value: landval
  last_sale_date: saledate
  last_sale_date_2: saledatetx
  source: sourceagnt
  source_date: transfdate
  source_deed: sourceref
  source_map: mapref