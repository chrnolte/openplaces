# Recipe: Hertford County, NC parcel roll.
#
# Source: the county's own ArcGIS Server (`gis.hertfordcounty.org`, not
# ArcGIS Online), layer `TaxParcels/MapServer/2` ("Parcels"). Caps a single
# query at 1,000 features (`maxRecordCount`), so `arcgis_rest_scraper`
# pages through it.
#
# NOTE: no year_built field in this layer's schema (verified). Land and
# building value are populated (881/1000 and 550/1000 sampled records
# respectively), so land/building value is included as a bonus, along with
# heated area.
#
# NOTE: this county needs a `conv: simple` row in
# US_parcel_id-overrides.csv, scoped to this source_id. The bundled
# default for US-NC-HY is `pattern: Sx-Sx-Sx`, written for NC OneMap's
# dashed ALTPARNO ('9999-99-9999'); this layer's PIN carries the same
# 10-digit key with no separators at all ('9999999999'), so the dashed
# pattern matches nothing and every row's parcel_id_local came out
# null. That silently cost the county its whole roll: last_sale_price
# and the value fields reach the parcel spine only through the
# parcel_id_local join (they are not in the spine's keep_columns), so a
# null key drops them rather than erroring. `simple` recovers all
# 16,109 rows at 15,752 distinct keys -- exactly the raw PIN's own
# distinct count, so the conversion adds no duplicates.

description: >-
  Hertford County, NC parcel roll (assessed land/building/total values,
  heated area, owner, situs, most recent sale) from the county's ArcGIS
  parcel layer. No year built is available from this source.

admin_id: US-NC-HR

entity:
  entity_type: parcel
  source:
    source_id: hertfordcounty
    # Checked 2026-08-20 against the ArcGIS REST service this recipe
    # reads: neither copyrightText nor licenseInfo is set on the service
    # or its layer, so the endpoint openplaces actually uses states no
    # terms. Checked and absent, not unexamined -- but this speaks only
    # for that endpoint, not for anything the county may publish
    # elsewhere.
    license: "unknown (service declares no copyright or licence)"
    redistribution_restricted: null
    portal_url: "https://gis.hertfordcounty.org/"
    download_url_scraper: arcgis_rest_scraper
  version: "2026"

uncompressed_file_name: "hertford_parcels.geojson"

scraper_options:
  layer_url: "https://gis.hertfordcounty.org/server/rest/services/TaxParcels/MapServer/2"
  where: "1=1"
  out_fields: "*"

columns:
  parcel_id_assessor: PIN
  address: LOCATION_ADDR
  owner_name: PROPERTY_OWNER
  last_sale_date: PKG_SALE_DATE
  last_sale_price: PKG_SALE_PRICE
  land_value: TOTAL_LAND_ASSESSED
  improvement_value: TOTAL_BLDG_ASSESSED
  total_value: TOTAL_PROP_VALUE
  area_sqft: HEATED_AREA
  # LAND_CLASS is the county land-use class (RES / FRM / MAN-HOU / COM /
  # FRST / WTRF), 97% populated. Without it this county reached curate
  # with no use_group at all, and the footprint deliverable with no
  # use_group_combined.
  use_group: LAND_CLASS
  zoning_code: ZONING

transformations:
  - type: string
    operation: concat
    inputs: [DEED_BOOK, DEED_PAGE]
    args:
      sep: "-"
    output: last_sale_book_page

columns_to_categorical:
  - use_group
  - zoning_code

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
