# Recipe: Craven County, NC parcel tax roll.
#
# Source: the county's own bulk CSV export (`gis.cravencountync.gov`), a
# plain no-auth download refreshed regularly (observed 2026-08-05). One row
# per parcel: assessed land/building/total values, owner, situs, and a
# most-recent-sale snapshot. No geometry (attribute roll only).
#
# A companion building-card shapefile from the same portal carries year
# built per structure, keyed to this roll's PID by its own PPRIO field; see
# US-NC-CN_property-cravencounty-2026.yaml.

description: >-
  Craven County, NC parcel tax roll (assessed land/building/total values,
  owner, situs, most recent sale) from the county's bulk CSV export.

admin_id: US-NC-CN

entity:
  entity_type: parcel
  source:
    source_id: cravencounty
    portal_url: "https://gis.cravencountync.gov/downloads-zip-files.aspx"
    download_url: "https://gis.cravencountync.gov/Downloads/CSV_files/parcels.csv"
  version: "2026"

uncompressed_file_name: "parcels.csv"

columns:
  parcel_id_assessor: PID
  owner_name: PANAME
  owner_address: TMADDR
  owner_city: CITYNM
  owner_admin2_id_admin1: TAXSTE
  owner_postal_code: ZIP
  legal_description: LEGDES
  address: FULLADD
  last_sale_date: SALE_DATE
  last_sale_price: SALE_PRICE
  land_value: totlnd
  improvement_value: totbld
  value: totval
  use_group: LUDESC

# Assemble the combined deed book/page reference (registry has no separate
# book/page fields; nhcgov's NC recipe uses the same single-field
# convention).
transformations:
  - type: string
    operation: concat
    inputs: [PABOOK, PAPAGE]
    args:
      sep: "-"
    output: last_sale_book_page

columns_to_categorical:
  - owner_admin2_id_admin1
  - use_group

# Standardized cross-comparable matching key from the assessor PID (auto
# per-county conversion; falls back to `simple` if Craven has no bundled
# instruction). Connects this roll to the companion property (building-card)
# roll via the same conversion.
parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
