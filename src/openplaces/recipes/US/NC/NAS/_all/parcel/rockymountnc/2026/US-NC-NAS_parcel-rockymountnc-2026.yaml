# Recipe: Nash County, NC parcel roll.
#
# Source: an ArcGIS FeatureServer layer published by the City of Rocky
# Mount, not by Nash County itself -- service
# `City_of_Rocky_Mount_Nash_Parcels`, layer 16
# (`CRMGIS.DBO.Nash_Parcels`), where CRMGIS is the city's GIS. Hence the
# source_id: the county has no comparable public endpoint, and naming
# this `nashcounty` would misattribute it.
#
# Downloaded as one bulk GeoJSON export (~144 MB) from the ArcGIS Hub
# download API rather than by paging the REST layer, which would take
# ~27 sequential 2,000-feature requests against the city's server. The
# REST endpoint backing it is
# services.arcgis.com/4MdqIsNzxG7xyTvf/.../FeatureServer/16.
#
# The Hub export is generated asynchronously and cached. On a cold cache
# the download URL answers 404 for a few minutes while Hub builds the
# file (verified: ready on the sixth poll here); a 404 on first ingest
# means "not built yet", not "gone". Re-run rather than switching to the
# scraper.
#
# Despite the municipal host this is the whole county, not the city's
# share of it: 53,777 features against NC OneMap's 55,324, with the
# layer's extent covering the full county polygon. A second, smaller
# layer in the same organization (`Nash_Parcels_in_the_RMMPO`, 30,478
# features) is the metropolitan-planning-organization subset and is
# deliberately not used -- it covers only 45% of the county.
#
# Because the publisher is a city rather than the county, this endpoint
# is likelier than most to be renamed or retired; check the layer before
# assuming a failed refresh is a network problem.
#
# TAX_PIN is the join key: 99.6% of sampled values match NC OneMap's own
# parcel_id_local for this county under the bundled `simple` conversion,
# so no id-override row is needed. GIS_PIN is the same key maintained on
# the GIS side and agrees less often (92.0%), so the tax-side field
# wins.
#
# NOTE on last_sale_date: SALEDATE is an esriFieldTypeDate, and
# arcgis_rest_scraper writes `f=geojson`, where Esri serializes such a
# field as epoch milliseconds rather than an ISO string (verified:
# 895104000000). It is stored here as that raw millisecond value,
# matching what the existing Gates, Jones, Pender and Chowan recipes
# already produce; this source publishes no string-formatted date to use
# instead. Divide by 1000 before reading it as a timestamp.

description: >-
  Nash County, NC parcel roll (land/building values, year built, floor area,
  owner, situs, most recent sale) from the City of Rocky Mount's parcel layer.

admin_id: US-NC-NAS

entity:
  entity_type: parcel
  source:
    source_id: rockymountnc
    # Checked 2026-08-20 through the ArcGIS Hub API for the dataset this
    # recipe downloads: the item explicitly declares license "none" and
    # carries no access-information text. So the county publishes the
    # data without stating terms -- checked and absent, not unexamined.
    license: "unknown (ArcGIS Hub item declares no licence)"
    redistribution_restricted: null
    portal_url: "https://www.rockymountnc.gov/"
    download_url: "https://hub.arcgis.com/api/v3/datasets/a6969e35769a489085c3fc503d57705f_16/downloads/data?format=geojson&spatialRefId=4326"
  version: "2026"

uncompressed_file_name: "nash_parcels.geojson"

columns:
  parcel_id_assessor: TAX_PIN
  parcel_id_admin3: TAX_PARID
  address: PHYS_ADDR
  city: TAX_CITY
  owner_name: OWNER1
  owner_name_2: OWNER2
  owner_address: MAIL_ADDR1
  legal_description: LEGAL1
  subdivision: SUBDIVNAME
  use_group: PROPTYPE
  use_subgroup: BLDG_TYPE
  tax_neighborhood_code: NBHD
  tax_year: ASMNT_YR
  year_built: R_YR_BUILT
  living_area_sqft: R_SQFT
  n_stories: R_STORY_HT
  # Structure detail, measured on this layer: rooms 65.6%, bedrooms
  # 65.5%, full baths 65.0%, heating 65.5%, effective year 32.3%.
  #
  # Building features, MEASURED 2026-09-13 in memory (residential =
  # PROPTYPE D-Dwelling, 33,277 rows): living_area_sqft (R_SQFT,
  # median 1,604) 99.9%, exterior wall
  # (R_S_TYPE, 15 values) 99.8%, style (R_S_STYLE, 13) 99.9%, heating
  # fuel (R_HEATFUEL, 8) 95.4%, has_central_air 99.6% (28,413 true,
  # 4,728 false), has_basement 83.8% (204 true), effective year
  # 45.4%, remodel year (R_REMOD_YR) 7.7%, frontage_ft 49.0% (median
  # 85). gross_floor_area_sqft is C_SQFT, the commercial section's area:
  # 5.5% of rows; on the 170 parcels that also carry a residential
  # area it covers the commercial part only.
  #
  # R_BASEMENT (FULL / PART / CRAWL / NONE) is foundation_description
  # in the county's words: 83.8% of residential rows (NONE 77.0%,
  # CRAWL 6.2%, FULL and PART 0.6%). NONE says only that there is no
  # basement or crawl space, not which foundation. It also sets
  # has_basement (FULL, PART true; CRAWL, NONE false). R_SYSTEM
  # (FHA, Heat & A/C, ...) is the system behind
  # R_HEATING and is left unmapped; R_ATTIC is filled on 12 rows.
  #
  # Baths: R_FULLBATH is the full count and R_HALFBATH the half count
  # (16.6% of rows, 26.0% of rows with a full bath). n_bathrooms folds
  # them as full + 0.5 x half below.
  n_rooms: R_ROOMS
  n_bedrooms: R_BEDROOMS
  n_bathrooms: R_FULLBATH
  n_half_bathrooms: R_HALFBATH
  heating_type: R_HEATING
  heating_fuel: R_HEATFUEL
  exterior_wall: R_S_TYPE
  building_style: R_S_STYLE
  foundation_description: R_BASEMENT
  gross_floor_area_sqft: C_SQFT
  frontage_ft: LANDWIDTH
  effective_year_built: R_EFF_YR
  renovation_year: R_REMOD_YR
  last_sale_date: SALEDATE
  last_sale_price: SALEPRICE
  last_sale_qualification_code: SALECODE
  land_value: LANDVALUE
  improvement_value: TOT_B_VAL
  total_value: APR_VAL

transformations:
  - type: string
    operation: concat
    inputs: [DEEDBOOK, DEEDPAGE]
    args:
      sep: "-"
    output: last_sale_book_page
  # n_bathrooms = full + 0.5 x half. The sum keeps a row null only when
  # both counts are, so a missing half count reads as zero halves.
  - type: expression
    expression: "n_half_bathrooms * 0.5"
    inputs: [n_half_bathrooms]
    output: half_bathroom_equivalent
  - type: aggregate
    operation: sum
    inputs: [n_bathrooms, half_bathroom_equivalent]
    output: n_bathrooms
  # The area and width fields hold 0 where nothing was recorded.
  - type: unary
    operation: null_if_equal
    input: living_area_sqft
    args: {value: 0}
    output: living_area_sqft
  - type: unary
    operation: null_if_equal
    input: gross_floor_area_sqft
    args: {value: 0}
    output: gross_floor_area_sqft
  - type: unary
    operation: null_if_equal
    input: frontage_ft
    args: {value: 0}
    output: frontage_ft
  # LANDWIDTH is street frontage only where the land is priced by the
  # front foot (LANDTYPE 'F-Front Foot'); on the few gross, square
  # foot and acreage rows it is a width of unstated meaning.
  - type: remap
    input: LANDTYPE
    mapping: {"F-Front Foot": 1}
    output: front_foot_land
  - type: expression
    expression: "frontage_ft * front_foot_land"
    inputs: [frontage_ft, front_foot_land]
    output: frontage_ft
  # R_BASEMENT (now foundation_description) is blank on rows without
  # a dwelling: strip it and null the blank.
  - type: string
    operation: strip
    input: foundation_description
    output: foundation_description
  - type: unary
    operation: null_if_equal
    input: foundation_description
    args:
      value: ""
    output: foundation_description
  # It records the basement explicitly (FULL / PART / CRAWL / NONE):
  # a crawl space is not a basement.
  - type: remap
    input: foundation_description
    mapping:
      "FULL": true
      "PART": true
      "CRAWL": false
      "NONE": false
    output: has_basement
  # R_HEATING states AC presence or absence for every value.
  - type: remap
    input: heating_type
    mapping:
      "CENTRAL WITH A/C": true
      "CENTRAL NO A/C": false
      "NO CENTRAL": false
      "NONE": false
    output: has_central_air

drop_columns:
  - half_bathroom_equivalent
  - front_foot_land

columns_to_categorical:
  - heating_type
  - heating_fuel
  - exterior_wall
  - building_style
  - foundation_description
  - use_group
  - use_subgroup
  - tax_neighborhood_code
  - last_sale_qualification_code

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
