# Recipe: New Hanover County, NC parcel tax roll.
#
# Source: the county's cumulative property-data export `nhclttax`, a ZIP
# containing a fixed-width ASCII flat file (`nhclttax.txt`, 530 bytes/record).
# The fixed-width layout below is the "Text" layout from the county's Tax Data
# File Format document; the widths sum to the 530-byte record length.
#
# This is the assessor attribute roll (one row per parcel, no geometry): assessed
# values, year built, owner, situs, and a most-recent-sale snapshot. It is keyed
# by the parcel PIN and is joinable to the GIS parcels (US-NC_parcel-nconemap)
# downstream.

description: >-
  New Hanover County, NC parcel tax roll (assessed values, owner, situs, most
  recent sale) from the county's fixed-width property data export.

admin_id: US-NC-NE

entity:
  entity_type: parcel
  source:
    source_id: nhcgov
    portal_url: "https://www.nhcgov.com/344/Database-Download"
    download_url: "https://www.nhcgov.com/DocumentCenter/View/11136/nhclttax"
  version: "2026"

# The download is a zip containing the fixed-width text file.
compressed_file_name: "nhclttax.zip"
uncompressed_file_name: "nhclttax.txt"

# Read every field as text (zero-padded ids must keep leading zeros); numeric
# value fields are cast below with parse_currency.
csv_dtype: str

# Fixed-width record layout: [field_name, width] in record order. Fields named
# `filler` are padding and dropped after reading. Widths sum to 530.
fixed_width:
  - [account_status, 1]
  - [type, 1]
  - [mapnumber, 5]
  - [blocknumber, 3]
  - [lotnumber, 3]
  - [sublotnumber, 3]
  - [tax_neighborhood_code, 8]
  - [master_index, 7]
  - [filler, 6]
  - [situs_city_code, 3]
  - [filler, 8]
  - [address_number, 6]
  - [use_subgroup_code, 4]
  - [filler, 2]
  - [exemption_code, 1]
  - [value, 8]
  - [personal_property_value, 8]
  - [filed_late_flag, 1]
  - [filler, 2]
  - [parcel_id_geo, 15]
  - [land_value, 8]
  - [special_feature_value, 8]
  - [improvement_value, 8]
  - [classified_market_value, 8]
  - [last_sale_year, 2]
  - [last_sale_month, 2]
  - [last_sale_qualification_code, 1]
  - [last_sale_doc_type, 2]
  - [last_sale_vacant, 1]
  - [last_sale_book_page, 8]
  - [last_sale_price, 8]
  - [n_sales, 2]
  - [filler, 14]
  - [legal_description_line_1, 27]
  - [legal_description_line_2, 27]
  - [filler, 6]
  - [owner_name, 27]
  - [owner_name_2, 27]
  - [owner_address, 27]
  - [owner_city_state, 27]
  - [owner_postal_code, 6]
  - [owner_name_january_1, 27]
  - [county_code, 2]
  - [address_street_name, 20]
  - [tax_district, 2]
  - [zoning_code, 5]
  # par_land_val / spec_feat_val / par_imp_val: exact duplicates of land_value,
  # special_feature_value, improvement_value above; dropped as padding.
  - [filler, 8]
  - [filler, 8]
  - [filler, 8]
  - [filler, 18]
  - [subdivision_code, 6]
  - [subdivision, 30]
  - [filler, 47]
  - [year_built, 4]
  - [filler, 4]

# Columns are named once, in the fixed-width layout above, using canonical
# openplaces attribute names (see docs: Writing recipes -> Columns): no entity
# (parcel) prefix except on identifiers, no abbreviations. Fields kept under
# working names (mapnumber/blocknumber/lotnumber/sublotnumber, owner_city_state,
# legal_description_line_1/2) feed the transformations below. The parcel id is
# not a single field in this layout (the 15-digit geo PIN `parcel_id_geo` is
# blank for ~90% of records), so it is assembled from the map/block/lot composite.

transformations:
  # Assemble the raw assessor parcel id as `<type><mapnumber>-<block>-<lot>-<sublot>`
  # (e.g. R06116-006-001-000). The standardized matching key parcel_id_local is
  # derived from it below, making the roll joinable to the sales and the GIS
  # parcels.
  - type: string
    operation: concat
    inputs: [type, mapnumber]
    output: parcel_id_assessor
  - type: string
    operation: concat
    inputs: [parcel_id_assessor, blocknumber, lotnumber, sublotnumber]
    args:
      sep: "-"
    output: parcel_id_assessor

  # Assemble the full legal description from its two fixed-width lines. The
  # county hard-wraps the text at exactly 27 chars (mid-word, e.g. `...SQ` +
  # `UARE` -> `SQUARE`), so the lines are joined with no separator.
  - type: string
    operation: concat
    inputs: [legal_description_line_1, legal_description_line_2]
    output: legal_description
  - type: string
    operation: strip
    input: legal_description
    output: legal_description

  # Assemble the situs street address (strip the street number's leading zeros).
  - type: string
    operation: lstrip
    input: address_number
    args:
      chars: "0"
    output: address_number
  - type: string
    operation: concat
    inputs: [address_number, address_street_name]
    args:
      sep: " "
    output: address
  - type: string
    operation: strip
    input: address
    output: address

  # Split the combined owner "CITY   ST" field into city and state.
  - type: string
    operation: strip
    input: owner_city_state
    output: owner_city_state
  - type: string
    operation: substring
    input: owner_city_state
    args:
      start: -2
    output: owner_admin2_id_admin1
  - type: string
    operation: substring
    input: owner_city_state
    args:
      start: 0
      end: -2
    output: owner_city
  - type: string
    operation: strip
    input: owner_city
    output: owner_city

  # last_sale_year is a 2-digit year (fixed-width); expand it to 4 digits
  # using the standard strptime('%y') pivot (00-68 -> 2000-2068, 69-99 ->
  # 1969-1999) rather than the plain to_numeric cast applied to the other
  # numeric fields below.
  - type: unary
    operation: resolve_century
    input: last_sale_year
    output: last_sale_year

# Cast the zero-padded numeric fields (read as text because of `csv_dtype: str`)
# to numbers. Monetary fields go through parse_currency (tolerant of $ and
# commas); plain counts/years go through to_numeric.
transformation_patterns:
  - type: unary
    operation: parse_currency
    pattern: "{column}"
    apply_to_columns:
      - land_value
      - improvement_value
      - total_value
      - special_feature_value
      - personal_property_value
      - classified_market_value
      - last_sale_price
  - type: unary
    operation: to_numeric
    pattern: "{column}"
    apply_to_columns:
      - year_built
      - last_sale_month
      - n_sales

# Standardized cross-comparable matching key derived from parcel_id_assessor
# (auto per-county conversion; New Hanover uses `simple`). Lets this roll connect
# to the GIS parcels and the sales transactions without re-deriving ids.
parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
