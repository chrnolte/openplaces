# Recipe: Hyde County, NC parcel roll.
#
# Source: the county's ArcGIS FeatureServer layer (hosted by GIS vendor AGD,
# org id nJbIFHiSnaX0z0hS), reached not through the county's own JS-only
# map viewer (which exposes no discoverable REST endpoint) but through the
# shared AGD organization's service directory. Caps a single query at
# 1,000 features (`maxRecordCount`), so `arcgis_rest_scraper` pages through
# it.
#
# NOTE: no year_built field in this layer's schema (verified). Land and
# building value are populated (951/1000 and 633/1000 sampled records
# respectively), so land/building value is included as a bonus.

description: >-
  Hyde County, NC parcel roll (assessed land/building/total values, owner,
  situs, deed reference) from the county's ArcGIS parcel layer. No year
  built is available from this source.

admin_id: US-NC-HE

entity:
  entity_type: parcel
  source:
    source_id: hydecounty
    portal_url: "https://www.hydecountync.gov/departments/tax_dept.php"
    download_url_scraper: arcgis_rest_scraper
  version: "2026"

uncompressed_file_name: "hyde_parcels.geojson"

scraper_options:
  layer_url: "https://services3.arcgis.com/nJbIFHiSnaX0z0hS/arcgis/rest/services/Hyde_AGOL/FeatureServer/3"
  where: "1=1"
  out_fields: "*"

columns:
  parcel_id_assessor: pin
  address: PHYSICAL_ADDRESS
  owner_name: PRIMARY_OWNER
  owner_name_2: SECONDARY_OWNER
  owner_address: MAILING_ADDRESS
  owner_city: CITY
  owner_postal_code: ZIP
  legal_description: PROPERTY_DESCRIPTION
  land_value: LAND_VALUE
  improvement_value: BUILDING_VALUE
  special_feature_value: MISC_IMPROV_VALUE
  value: TOTAL_ASSESSED

transformations:
  - type: string
    operation: concat
    inputs: [DEED_BOOK, DEED_PAGE]
    args:
      sep: "-"
    output: last_sale_book_page

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
