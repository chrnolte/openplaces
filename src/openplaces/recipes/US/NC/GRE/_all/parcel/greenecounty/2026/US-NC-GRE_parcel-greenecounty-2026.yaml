# Recipe: Greene County, NC parcel roll.
#
# Source: the county's ArcGIS FeatureServer layer (hosted by GIS vendor AGD,
# org id nJbIFHiSnaX0z0hS), backing its public parcel viewer (BIS
# Consultants CAMA schema). Caps a single query at 1,000 features
# (`maxRecordCount`), so `arcgis_rest_scraper` pages through it.
#
# NOTE: the schema also has a `LAND_VALUE`/`HOUSE_VALUE` pair that reads as
# the obvious mapping, but both are 0 across every sampled record --
# apparently a stale/unused legacy pair. `CURRENT_LAND_VALUE`/
# `CURRENT_BLDG_VALUE` are the real, populated fields (995/1000 and
# 657/1000 sampled records) and are used instead. No year_built field
# exists anywhere in this layer's very wide (180+ field) schema.
#
# Values: CURRENT_LAND_VALUE is the market land; AG_LAND_VALUE is the
# land's present-use value, above 0 only on the program's rows.
# TOTAL_ASSESSED (and CURRENT_TOTAL_VALUE) is the use-basis total:
# measured 2026-11-19 on US-NC-GRE, it equals AG_LAND_VALUE +
# CURRENT_BLDG_VALUE on 2,768 of the 2,771 rows with AG_LAND_VALUE
# above 0, and CURRENT_LAND_VALUE + CURRENT_BLDG_VALUE on 9,864 of the
# other 9,872 valued rows. COST_TOTAL_VALUE equals CURRENT_LAND_VALUE
# + CURRENT_BLDG_VALUE on 12,639 of 12,643 valued rows, so it is the
# market total and goes to total_value. AG_LAND_VALUE goes to
# current_use_value with its 0 emptied. No use-basis total is
# carried.

description: >-
  Greene County, NC parcel roll (market and present-use land values, total
  value, owner, situs, deed reference) from the county's ArcGIS parcel
  layer. No year built is available from this source.

admin_id: US-NC-GRE

entity:
  entity_type: parcel
  source:
    source_id: greenecounty
    # Checked 2026-08-20 against the ArcGIS REST service this recipe
    # reads: neither copyrightText nor licenseInfo is set on the service
    # or its layer, so the endpoint openplaces actually uses states no
    # terms. Checked and absent, not unexamined -- but this speaks only
    # for that endpoint, not for anything the county may publish
    # elsewhere.
    license: "unknown (service declares no copyright or licence)"
    redistribution_restricted: null
    portal_url: "https://greenecountygis.com/"
    download_url_scraper: arcgis_rest_scraper
  version: "2026"

uncompressed_file_name: "greene_parcels.geojson"

scraper_options:
  layer_url: "https://services3.arcgis.com/nJbIFHiSnaX0z0hS/arcgis/rest/services/Greene_Service/FeatureServer/4"
  where: "1=1"
  out_fields: "*"

columns:
  parcel_id_assessor: pin
  address: PROPERTY_LOCATION
  owner_name: OWNER_NAME_1
  owner_name_2: OWNER_NAME_2
  owner_address: MAILING_ADDRESS_1
  owner_city: CITY
  owner_admin2_id_admin1: STATE_OR_COUNTRY
  owner_postal_code: ZIP_CODE
  last_sale_date: DEED_DATE
  land_value: CURRENT_LAND_VALUE
  improvement_value: CURRENT_BLDG_VALUE
  total_value: COST_TOTAL_VALUE
  current_use_value: AG_LAND_VALUE
  subdivision: SUBDIVISION

transformations:
  - type: string
    operation: concat
    inputs: [DEED_BOOK, DEED_PAGE]
    args:
      sep: "-"
    output: last_sale_book_page
  # AG_LAND_VALUE is 0 outside the present-use program.
  - type: unary
    operation: null_if_equal
    input: current_use_value
    args: {value: 0}
    output: current_use_value

columns_to_categorical:
  - owner_admin2_id_admin1

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
