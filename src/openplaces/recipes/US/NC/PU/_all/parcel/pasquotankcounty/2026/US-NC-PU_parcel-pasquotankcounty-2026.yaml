# Recipe: Pasquotank County, NC parcel roll.
#
# Source: the county's ArcGIS FeatureServer layer (`services2.arcgis.com`,
# org id 0sC2n3LxYOcxBOg0), backing its public parcel viewer. The service
# name (`PasquotankCountyNC_20260101`) implies a 2026-01-01 vintage. Caps a
# single query at 2,000 features (`maxRecordCount`), so
# `arcgis_rest_scraper` pages through it.
#
# NOTE: no year_built field in this layer's schema (verified). Land and
# building value are populated (1000/1000 and 577/1000 sampled records
# respectively), so land/building value is included as a bonus.

description: >-
  Pasquotank County, NC parcel roll (assessed land/building/total values,
  owner, situs, deed reference) from the county's ArcGIS parcel layer. No
  year built is available from this source.

admin_id: US-NC-PU

entity:
  entity_type: parcel
  source:
    source_id: pasquotankcounty
    # Checked 2026-08-20 against the ArcGIS REST service this recipe
    # reads: neither copyrightText nor licenseInfo is set on the service
    # or its layer, so the endpoint openplaces actually uses states no
    # terms. Checked and absent, not unexamined -- but this speaks only
    # for that endpoint, not for anything the county may publish
    # elsewhere.
    license: "unknown (service declares no copyright or licence)"
    redistribution_restricted: null
    portal_url: "https://www.arcgis.com/apps/Viewer/index.html?appid=7155a34043534443aaaa3fed8f8a492e"
    download_url_scraper: arcgis_rest_scraper
  version: "2026"

uncompressed_file_name: "pasquotank_parcels.geojson"

scraper_options:
  layer_url: "https://services2.arcgis.com/0sC2n3LxYOcxBOg0/arcgis/rest/services/PasquotankCountyNC_20260101/FeatureServer/0"
  where: "1=1"
  out_fields: "*"

columns:
  parcel_id_assessor: PARCEL_ID
  address: LOCATION
  owner_name: OWNER1
  owner_name_2: OWNER2
  owner_address: MAILING1
  owner_city: CITY
  owner_admin2_id_admin1: STATE
  owner_postal_code: ZIP
  last_sale_date: DEEDDATE
  land_value: CURLAND
  improvement_value: CURBLDG
  total_value: CURTOTAL

transformations:
  - type: string
    operation: concat
    inputs: [DEEDBOOK, DEEDPAGE]
    args:
      sep: "-"
    output: last_sale_book_page

columns_to_categorical:
  - owner_admin2_id_admin1

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
