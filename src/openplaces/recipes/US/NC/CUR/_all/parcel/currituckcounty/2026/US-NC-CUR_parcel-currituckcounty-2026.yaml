# Recipe: Currituck County, NC parcel roll.
#
# Source: an ArcGIS FeatureServer layer (`services8.arcgis.com`, org id
# v4DvNHt6pDh1hCmU) inside the service `Corolla_Greenway_Layers`, layer
# 19 ("Tax Parcels"). The service is named for a greenway project, but
# layer 19 is the county's full tax-parcel layer, not a project subset:
# 27,895 features against NC OneMap's 27,865, with the layer extent
# covering 93% of the county polygon.
#
# A separate, genuinely partial layer in the same organization ("May
# 2021 Currituck Parcels all Protected Open Space Areas", 499 features)
# is not used.
#
# Downloaded as one bulk GeoJSON export (~65 MB) from the ArcGIS Hub
# download API rather than by paging the REST layer, which would take
# ~14 sequential 2,000-feature requests against the county's server. The
# REST endpoint backing it is
# services8.arcgis.com/v4DvNHt6pDh1hCmU/.../FeatureServer/19.
#
# The Hub export is generated asynchronously and cached; on a cold cache
# the download URL can answer 404 for a few minutes while Hub builds the
# file. A 404 on first ingest means "not built yet", not "gone".
#
# Because the hosting service is named for an unrelated project, this
# endpoint is a good candidate for being retired or reorganized; verify
# the layer before treating a failed refresh as a network problem.
#
# Join key: PARCEL_ID, the 15-digit account number, which matches NC
# OneMap's PARNO on 99.8% of sampled rows. No id-override row is needed
# -- the bundled US-NC-CUR conversion keeps PARCEL_ID at 3,833 distinct
# values per 4,000 sampled, exactly the raw field's own distinct count.
#
# NOTE: NC OneMap's own parcel_id_local is empty for this county -- the
# bundled US-NC-CUR conversion (`string_lengths: 4 2 2 7`) nulls out its
# ALTPARNO entirely, the same silent failure documented in the Hertford,
# Northampton and Pamlico recipes. That is left alone here because this
# layer supplies its own geometry and therefore the parcel spine, so the
# join that matters is this roll against itself. It does mean the
# handful of spine rows that fall back to NC OneMap for this county stay
# unjoinable until that conversion is revisited.
#
# NOTE on last_sale_date: SALE_DATE is an esriFieldTypeDate, and
# arcgis_rest_scraper writes `f=geojson`, where Esri serializes such a
# field as epoch milliseconds rather than an ISO string (verified:
# 1133154000000). It is stored here as that raw millisecond value,
# matching what the existing Gates, Jones, Pender and Chowan recipes
# already produce; this source publishes no string-formatted date to use
# instead. Divide by 1000 before reading it as a timestamp.
#
# NOTE: there is no composed situs address in this layer, and the house
# number (LOC_NO) is published as a numeric field, which would reach the
# output as '999.0' rather than '999'. Rather than emit that, the street
# name, type, city and ZIP are mapped as address components and the
# house number is left out; `address` therefore stays unmapped for this
# county and the parcel spine falls back to its dwelling-based address
# sources.

description: >-
  Currituck County, NC parcel roll (land/building values, owner, situs street,
  most recent sale) from the county's ArcGIS tax parcel layer.

admin_id: US-NC-CUR

entity:
  entity_type: parcel
  source:
    source_id: currituckcounty
    # Checked 2026-08-20 twice over: the ArcGIS Hub item for this dataset
    # explicitly declares license "none", and the county's own site was
    # fetched and scanned for licence, resale, redistribution and
    # data-agreement language, which found none either.
    license: "unknown (no terms on the Hub item or the county site)"
    redistribution_restricted: null
    portal_url: "https://www.currituckcountync.gov/departments/geographic-information-systems/"
    download_url: "https://hub.arcgis.com/api/v3/datasets/8348c2c5583e4141b34d7138c222c9a9_19/downloads/data?format=geojson&spatialRefId=4326"
  version: "2026"

uncompressed_file_name: "currituck_parcels.geojson"

# NOTE: LUC is a real land-use code table -- 50 distinct values over 27,895
# parcels, led by 510 (17,431), 500 (5,868), 535 (1,225), 881 (800) and 400
# (515) -- but the layer publishes no description column to crosswalk it
# with, and this is the only county in the Eastern NC region whose land use
# arrives solely as a code. Until the county's own LUC list is obtained and
# added as a `*-remap.csv` sidecar beside this recipe, these codes group
# parcels (cohort statistics use them) but assert no land-use vocabulary:
# `derive_use_classes` withholds the raw-code fallback from
# `use_group_combined_labeled`, which is what the occupancy keyword ruleset
# reads. Do not infer the mapping from correlated evidence -- a crosswalk
# has to be what the county published, not what the data suggests.

columns:
  parcel_id_assessor: PARCEL_ID
  parcel_id_admin3: PIN_1
  address_street_name: LOC_STR
  address_street_type: LOC_TYP
  city: LOC_CITY
  postal_code: LOC_ZIP
  owner_name: OWN1
  owner_name_2: OWN2
  owner_address: MAIL_ADDR1
  owner_city: MAIL_CITY
  owner_admin2_id_admin1: MAIL_STATE
  owner_postal_code: MAIL_ZIP
  legal_description: LEGAL
  subdivision: SUBD_NAME
  use_group_code: LUC
  tax_year: TAXYR
  last_sale_date: SALE_DATE
  last_sale_price: SALE_PRICE
  last_sale_qualification_code: SALE_QUAL
  land_value: LAND_VAL
  improvement_value: BLDG_VAL
  total_value: TOT_VAL
  current_use_value: DEFER_VAL

transformations:
  - type: string
    operation: concat
    inputs: [BOOK, PAGE]
    args:
      sep: "-"
    output: last_sale_book_page

columns_to_categorical:
  - use_group_code
  - last_sale_qualification_code
  - owner_admin2_id_admin1

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
