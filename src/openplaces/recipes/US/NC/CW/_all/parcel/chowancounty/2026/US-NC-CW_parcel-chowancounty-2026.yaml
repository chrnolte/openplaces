# Recipe: Chowan County, NC parcel roll.
#
# Source: the county's ArcGIS FeatureServer layer backing its public parcel
# viewer (hosted by GIS vendor AGD, org id nJbIFHiSnaX0z0hS). The layer holds
# 12,860 parcels but caps a single query at 2,000 features
# (`maxRecordCount`), so `arcgis_rest_scraper` pages through it with
# `resultOffset` and writes the combined result as one GeoJSON file.
#
# NOTE: the layer's schema advertises assessed-value fields (LAND_VAL,
# BLDG_VAL, TOT_VAL, DEF_VAL, OBXF_VAL) but every one of them is 0/null
# across all 12,860 records as of this vintage (verified by direct
# inspection, not just schema presence) -- the CAMA join behind this service
# appears unpopulated. They are intentionally omitted from `columns:` below;
# this recipe does not provide improvement value despite the source
# advertising the field. Revisit if the county's service is fixed.

description: >-
  Chowan County, NC parcel roll (owner, situs, most recent sale) from the
  county's ArcGIS parcel layer. Does not include assessed values: the
  source's value fields are unpopulated (see notes).

admin_id: US-NC-CW

entity:
  entity_type: parcel
  source:
    source_id: chowancounty
    portal_url: "https://www.chowancounty-nc.gov/land-records"
    # Browser-free REST pagination (peer of download_url_source, but for a
    # paginated ArcGIS layer rather than a single static URL). Loaded by path
    # from openplaces/io/scrapers/arcgis_rest_scraper.py.
    download_url_scraper: arcgis_rest_scraper
  version: "2026"

# arcgis_rest_scraper writes directly to this filename; no zip/unzip step.
uncompressed_file_name: "chowan_parcels.geojson"

scraper_options:
  layer_url: "https://services3.arcgis.com/nJbIFHiSnaX0z0hS/arcgis/rest/services/Chowan_Feature_Service/FeatureServer/0"
  where: "1=1"
  out_fields: "*"

columns:
  parcel_id_assessor: PIN
  owner_name: OWNER1
  owner_name_2: OWNER2
  legal_description: PROP_DESC
  address: SITUS_ADDR
  tax_district: TAXCDE
  tax_neighborhood_code: Neighborhood_Code
  last_sale_date: DATE_REC
  last_sale_price: SALE_PRICE
  last_sale_book_page: DEED_BK_PG
  zoning_code: ZONING_CDE
  subdivision: SUBDIVISION
  owner_address: MAILADDRESS1
  owner_address_2: MAILADDRESS2
  owner_city: MAILCITY
  owner_admin2_id_admin1: MAILSTATE
  owner_postal_code: MAILZIPCODE

# Drop the layer's boundary-artifact rows (FCODE/PIN == 'OUTSIDE', 20 of
# 12,860 records: slivers outside any real parcel, all other fields null).
query: "parcel_id_assessor != 'OUTSIDE'"

columns_to_categorical:
  - tax_district
  - tax_neighborhood_code
  - zoning_code
  - owner_admin2_id_admin1

# Standardized cross-comparable matching key from the assessor PIN (auto
# per-county conversion; falls back to `simple` if Chowan has no bundled
# instruction). Connects this roll to future GIS/transaction sources for the
# county.
parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
