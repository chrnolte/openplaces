# Recipe: New Hanover County, NC real estate sales transactions.
#
# Source: the county's annual "Sales" spreadsheets (one per year) on the
# Database Download page. Each year is a separate DocumentCenter file whose
# numeric id is not derivable from the year, so the per-year link is extracted
# from the page HTML with `download_url_source` + a `{year}`-placeholder regex.
#
# The download is a ZIP wrapping `sales_{year}_YTD.xlsx`. Most years' spreadsheets
# have no header row (column order is fixed), so the columns are named positionally
# via `names` with `header: none`. A few years (e.g. 2022) do include a header row;
# every column is read as text (`csv_dtype: str`) so the per-year schemas stay
# uniform regardless, the leaked header row is dropped by `query` below, and the
# typed columns are parsed in `transformations`.

description: >-
  New Hanover County, NC real estate sales transactions from the county's
  annual sales spreadsheets.

admin_id: US-NC-NH

entity:
  entity_type: transaction
  source:
    source_id: nhcgov
    portal_url: "https://www.nhcgov.com/344/Database-Download"
    # Scrape the Database Download page and extract the per-year sales link.
    download_url_source: "https://www.nhcgov.com/344/Database-Download"
    download_url_source_regex: '/DocumentCenter/View/\d+/sales_{year}_YTD'
  version: "2026"

# One download partition per calendar year. 2024+ use the headerless layout
# below; the current year is year-to-date (re-fetch with redownload to refresh).
download_by:
  partition: year
  first: 2017
  last: 2026

# The download is a zip containing the spreadsheet.
compressed_file_name: "sales_{year}_YTD.zip"
uncompressed_file_name: "sales_{year}_YTD.xlsx"

# Read every column as text so per-year schemas are uniform (Excel otherwise
# infers types per file, and a year with a leaked header row would type its whole
# sheet as text); typed columns are parsed in `transformations` below.
csv_dtype: str

# The sheet has no header row; name the 14 columns by position, once, using
# canonical openplaces attribute names directly (see docs: Writing recipes ->
# Columns). No `columns:` block is needed.
sheet_name: 0
header: none
names:
  - parcel_id_assessor
  - tax_district
  - use_group
  - use_subgroup
  - legal_description
  - address
  - city
  - recorded_date
  - price
  - book
  - page
  - doc_type
  - grantor
  - grantee

# Drop a leaked header row (present in some years, e.g. 2022) whose date cell is
# the literal label "SALE DATE". Runs before parsing, while recorded_date is text.
query: "recorded_date != 'SALE DATE'"

# The county lists a handful of sales twice, once per `tax_district`. That column
# is retained (it is a canonical attribute) but left out of the dedupe subset
# below, so the otherwise-identical rows collapse and a recorded deed is counted
# once; a raw full-row dedupe would keep them because they differ in
# `tax_district`.
drop_duplicates:
  - parcel_id_assessor
  - recorded_date
  - price
  - book
  - page
  - doc_type
  - grantor
  - grantee
  - address
  - city
  - use_group
  - use_subgroup
  - legal_description

# Parse the typed columns (read as text above) so every per-year file has the
# same dtypes and the partition aggregate concatenates cleanly.
transformations:
  - type: unary
    operation: to_datetime
    input: recorded_date
    output: recorded_date
  - type: unary
    operation: parse_currency
    input: price
    output: price

# Standardized matching key (kind: tax) linking each sale to its parcel; lets us
# track which parcels have been transacted. New Hanover uses `simple`.
parcel_id_local:
  source: parcel_id_assessor
  kind: tax

# Output: one parquet per year under the cache data directory; integrate the
# per-year files into a single non-redundant _all.parquet.
save_to:
  data_dir: cache

aggregate_by:
  single_file: true
