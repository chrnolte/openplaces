# Recipe: Columbus County, NC parcel roll.
#
# Source: the county's ArcGIS FeatureServer layer
# (`services8.arcgis.com`, org id XW1xe0eCMVrYcKIY), service
# `Columbus_Count_Parcels` (the service name's typo is the county's
# own), layer 24 ("parcels").
#
# 55,344 features against NC OneMap's 51,570.
#
# Downloaded as one bulk GeoJSON export (~74 MB) from the ArcGIS Hub
# download API rather than by paging the REST layer, which would take
# ~28 sequential 2,000-feature requests against the county's server. The
# REST endpoint backing it is
# services8.arcgis.com/XW1xe0eCMVrYcKIY/.../FeatureServer/24.
#
# The Hub export is generated asynchronously and cached; on a cold cache
# the download URL can answer 404 for a few minutes while Hub builds the
# file. A 404 on first ingest means "not built yet", not "gone".
#
# NOTE: roughly 2-6% of rows are placeholders rather than parcels --
# owner reads 'UPDATE IN PROGRESS' with pin, acct, propid and land_class
# all blank, and acres 0. They are left in at ingest rather than
# filtered here: parcel_id_local comes out null for them, so they never
# join to anything downstream, and dropping rows at ingest would hide a
# real property of this source. Expect them in row counts.
#
# NOTE: there is no situs address in this layer at all.
# addr1/addr2/addr3 are the owner's mailing address (addr3 combines city
# and state, e.g. 'WHITEVILLE NC'), so `address` is deliberately
# unmapped and the parcel spine falls back to its dwelling-based address
# sources for this county. There is no sale date either -- `deed`
# ('999/999') is a book/page reference and `history1` a chain of prior
# ones, neither carrying a date.
#
# NOTE: the layer publishes a single combined `taxvalue` with no
# land/building split, so no improvement_value is available *from this
# layer*. It reaches the spine from NC OneMap instead, via the join key
# described below.
#
# Join key: pin ('9999.99-99-9999.000'), 98.1% populated. NC OneMap's
# ALTPARNO -- the field it maps parcel_id_local from by default -- carries
# a short account number here, not this PIN, so the two sources shared no
# key and NC OneMap's assessed values could not reach the spine. Its PARNO
# field does carry the same PIN, so a US_parcel_id-overrides.csv pair
# (`simple` on both sides, NC OneMap redirected to parcel_id_admin3, the
# same shape as the US-NC-CUM and US-NC-PAM rows) joins 49,084 parcels --
# 98.5% of this roll -- and is what supplies improvement_value and
# land_value for Columbus. Without it the spine carried 323 of them.
#
# An earlier version of this note claimed NC OneMap's key was simply empty
# for this county and that no shared key existed. That was wrong: the
# column was populated, just with a different identifier.

description: >-
  Columbus County, NC parcel roll (total assessed value, year built, floor
  area, owner, most recent deed) from the county's ArcGIS parcel layer.

admin_id: US-NC-COL

entity:
  entity_type: parcel
  source:
    source_id: columbuscounty
    # Checked 2026-08-20 twice over: the ArcGIS Hub item for this dataset
    # explicitly declares license "none", and the county's own site was
    # fetched and scanned for licence, resale, redistribution and
    # data-agreement language, which found none either.
    license: "unknown (no terms on the Hub item or the county site)"
    redistribution_restricted: null
    portal_url: "https://www.columbusco.org/departments/tax-administration"
    download_url: "https://hub.arcgis.com/api/v3/datasets/99f93b8dd155429aba26f6473256e876_24/downloads/data?format=geojson&spatialRefId=4326"
  version: "2026"

uncompressed_file_name: "columbus_parcels.geojson"

columns:
  parcel_id_assessor: pin
  parcel_id_tax: acct
  owner_name: owner
  owner_address: addr1
  owner_address_2: addr2
  owner_postal_code: zip
  use_group: land_class
  use_subgroup: bldg_type
  year_built: yrblt
  area_sqft: sqft
  last_sale_price: saleamt
  last_sale_book_page: deed
  total_value: taxvalue

columns_to_categorical:
  - use_group
  - use_subgroup

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
