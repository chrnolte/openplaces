# Recipe: Martin County, NC parcel roll.
#
# Source: the county's own GIS data-download page, a plain shapefile export
# (`gis.martincountyncgov.com`), refreshed regularly (file timestamp
# observed same-day).
#
# NOTE: the shapefile carries only a single combined value field
# (`CURRENT_TO` = current total value) -- no land/building split, so no
# `improvement_value` is available from this source. Also confirmed no
# year_built field in the 25-column schema.

description: >-
  Martin County, NC parcel roll (total assessed value, owner, situs, deed
  reference) from the county's GIS shapefile export. No land/building value
  split is available from this source.

admin_id: US-NC-MAR

entity:
  entity_type: parcel
  source:
    source_id: martincounty
    # Checked 2026-08-20 at the terms_url below: "Martin County provides
    # this data as a public service, as is, as available and without
    # warranties", no fee, and redistribution is permitted -- the county
    # only asks that people prefer its official site for the current
    # version. Users hold the county harmless.
    license: "public data; redistribution permitted, no warranty"
    terms_url: "https://www.martincountync.gov/departments/tax_assessor/gis_downloads.php"
    redistribution_restricted: false
    portal_url: "https://www.martincountync.gov/departments/tax_assessor/gis_downloads.php"
    download_url: "https://gis.martincountyncgov.com/DataDownloads/Parcels.zip"
  version: "2026"

compressed_file_name: "Parcels.zip"
uncompressed_file_name: "Parcels.shp"

columns:
  parcel_id_assessor: PARCEL_ID
  owner_name: OWNER_NAME
  owner_name_2: OWNER_NA_1
  owner_address: MAILING_AD
  owner_city: CITY
  owner_admin2_id_admin1: STATE
  owner_postal_code: ZIP_CODE
  address: PROPERTY_L
  total_value: CURRENT_TO
  last_sale_date: SALE_DATE_
  last_sale_price: SALE_PRICE

transformations:
  - type: string
    operation: concat
    inputs: [DEED_BOOK, DEED_PAGE]
    args:
      sep: "-"
    output: last_sale_book_page

columns_to_categorical:
  - owner_admin2_id_admin1

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
