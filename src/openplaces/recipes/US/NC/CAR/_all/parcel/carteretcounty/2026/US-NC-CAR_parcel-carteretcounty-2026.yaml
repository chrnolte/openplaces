# Recipe: Carteret County, NC parcel roll.
#
# Source: the county's ArcGIS FeatureServer layer
# (`services1.arcgis.com`, org id CsRkg76wVkJL8hZq), service
# `parcel_boundariesAGOLcopy`.
#
# Downloaded as one bulk GeoJSON export (~301 MB -- this layer carries
# ~120 fields per parcel) from the ArcGIS Hub download API rather than
# by paging the REST layer, which would take ~32 sequential
# 2,000-feature requests against the county's server. The REST endpoint
# backing it is
# services1.arcgis.com/CsRkg76wVkJL8hZq/.../FeatureServer/0.
#
# The Hub export is generated asynchronously and cached, and this
# layer's width makes it slower to build than most: the download URL
# answered 404 for several minutes across two separate polling runs
# before the file appeared. A 404 on first ingest means "not built yet",
# not "gone" -- re-run rather than switching to the scraper.
#
# 63,993 features against NC OneMap's 63,768 -- a near-exact match on
# the same parcels, with a CAMA join NC OneMap does not carry:
# land/building values, year built, heated area and a use code with a
# real description.
#
# NOTE: this county needs an id-override row scoped to this source_id,
# and unusually it exists to *undo* one. US_parcel_id-overrides.csv
# already carries a blank-source_id row at US-NC-CAR redirecting
# parcel_id_local to parcel_id_admin3, because NC OneMap's ALTPARNO for
# Carteret is block-level truncated to 8 of the real PIN's 15 digits. A
# blank source_id matches every source at that admin unit, so without a
# more specific row that redirect would also hit this recipe -- which
# publishes no parcel_id_admin3 at all, leaving parcel_id_local null for
# every row. The exact-source row points this recipe back at
# parcel_id_assessor, where BITekPIN carries the full 15-digit PIN and
# matches NC OneMap's own parcel_id_local on 99.3% of sampled rows.
#
# GISPIN is the truncated 8-digit form of the same key (306 distinct
# values per 4,000 sampled) and is deliberately not used; PIN15 is
# identical to BITekPIN.
#
# NOTE on last_sale_date: DDATE is used rather than the SaleDate field.
# arcgis_rest_scraper writes `f=geojson`, where Esri serializes an
# esriFieldTypeDate as epoch milliseconds rather than an ISO string
# (verified: SaleDate comes back as 1455667200000). DDATE is the same
# sale as a plain 'YYYYMMDD' string that parses correctly, and the two
# are populated on exactly the same 81.0% of rows -- so this costs
# nothing.
#
# NOTE: Y_BLT_HOUS uses 0 rather than null for "never recorded" --
# nulled generically at ingest (attribute_registry.csv's year_built
# null_placeholder), the same as Bladen and Sampson.
#
# Building features, MEASURED 2026-09-13 in memory (residential =
# Use_desc naming a residential or dwelling class, 34,247 rows):
# living_area_sqft (HtdSqFt, median
# 1,648) and gross_floor_area_sqft (TOT_SQ_FT, the total area, median
# 2,440; at least the heated area on all but one row, median ratio
# 1.38) 76.3% each; grade (Grade, 16 values such as 'C+') and
# condition (Condition, 11 values, identical to CDU) 76.3%; exterior
# wall (ExWllDes1), roof covering (RCovDes1), heating (HeatDes1) and
# style (DwellingSt) 76.2%; has_central_air 75.4% (25,311 true, 522
# false); n_fireplaces 76.2% (24.5% with one or more). FireplaceC is
# 0 on every row without a building, so the count is kept only on a
# RES building model. has_waterfront is true where the land-use
# description names water frontage (CANALFRONT, SOUNDFRONT,
# OCEANFRONT, the WATERFRONT classes; 7,615 rows, 11.9%), null
# elsewhere: WATER PROXIMITY is near water, not on it, and the
# undecoded W-prefixed codes (WPC, WCC, ...) stay null. Those land
# classes replace the RESIDENTIAL label, so the residential rates
# above leave most waterfront homes out.
#
# foundation_description is FondDes1 in the county's words (Brick,
# Stucco/Stone, Concrete Block, Poured, Slab, Pile, Pier; FondTyp1
# is the same list as codes): 76.1% of residential rows. Brick and
# block name a foundation wall's material; curate translates the
# words into foundation_type.
#
# Not mapped: RStrDes1 (Gable, Hip, ...) is a roof shape;
# CONDO_SQFT is filled only where HtdSqFt already is; BuildingCo is a
# building count (n_buildings), outside this pass.

description: >-
  Carteret County, NC parcel roll (land/building values, year built, heated
  area, owner, situs, most recent sale) from the county's ArcGIS parcel layer.

admin_id: US-NC-CAR

entity:
  entity_type: parcel
  source:
    source_id: carteretcounty
    # Checked 2026-08-20 twice over: the ArcGIS Hub item for this dataset
    # explicitly declares license "none", and the county's own site was
    # fetched and scanned for licence, resale, redistribution and
    # data-agreement language, which found none either.
    license: "unknown (no terms on the Hub item or the county site)"
    redistribution_restricted: null
    portal_url: "https://www.carteretcountync.gov/163/Geographic-Information-Systems"
    download_url: "https://hub.arcgis.com/api/v3/datasets/751a48fa768241aab25477c6d3eb4ec1_0/downloads/data?format=geojson&spatialRefId=4326"
  version: "2026"

uncompressed_file_name: "carteret_parcels.geojson"

columns:
  parcel_id_assessor: BITekPIN
  address: PropertyAd
  city: SITE_CITY
  owner_name: OWNER
  owner_name_2: OWNER2
  owner_address: MAIL_ADDRE
  owner_city: MAIL_CITY
  owner_admin2_id_admin1: MAIL_STATE
  owner_postal_code: MAIL_ZI5
  legal_description: LEGAL_DESC
  subdivision: Subdivisio
  use_group: Use_desc
  use_group_code: Use_code
  tax_neighborhood_code: Neighborho
  year_built: Y_BLT_HOUS
  living_area_sqft: HtdSqFt
  # Structure detail, measured on this layer: bedrooms 70.7%, bathrooms
  # 70.8%. BATHROOMS is fractional here (2.0, 2.5), i.e. it already
  # folds half baths in, unlike the counties that publish full and half
  # counts separately.
  n_bedrooms: BEDROOMS
  n_bathrooms: BATHROOMS
  gross_floor_area_sqft: TOT_SQ_FT
  exterior_wall: ExWllDes1
  heating_type: HeatDes1
  roof_material: RCovDes1
  condition: Condition
  quality_grade: Grade
  building_style: DwellingSt
  n_fireplaces: FireplaceC
  foundation_description: FondDes1
  last_sale_date: DDATE
  last_sale_price: SALE_PRICE
  land_value: LAND_VALUE
  improvement_value: STRUC_VAL
  total_value: Total_EMV

transformations:
  - type: string
    operation: concat
    inputs: [DBOOK, DPAGE]
    args:
      sep: "-"
    output: last_sale_book_page
  # Both area fields hold 0 where no building was recorded.
  - type: unary
    operation: null_if_equal
    input: living_area_sqft
    args: {value: 0}
    output: living_area_sqft
  - type: unary
    operation: null_if_equal
    input: gross_floor_area_sqft
    args: {value: 0}
    output: gross_floor_area_sqft
  # FireplaceC is 0 on every row, parcels without a building included.
  # A zero is a recorded count only on a residential building model
  # (BldgModel RES); elsewhere the count is nulled.
  - type: remap
    input: BldgModel
    mapping: {"RES": 1}
    output: residential_model
  - type: expression
    expression: "n_fireplaces * residential_model"
    inputs: [n_fireplaces, residential_model]
    output: n_fireplaces
  # has_central_air from the heat description: true where it names
  # central heat/AC or a system that cools (heat pump, geothermal, gas
  # pack, commercial HVAC), false for None, null otherwise (minisplit,
  # radiant, steam, space heater).
  - type: remap
    input: heating_type
    mapping:
      "Central Heat/AC": true
      "HEAT PUMP": true
      "Geo Thermal": true
      "GAS PAK": true
      "Comm HVAC": true
      "COMM HVAC": true
      "None": false
      "Comm None": false
    output: has_central_air
  # has_waterfront: true where the land-use class names water
  # frontage, null elsewhere (no class records its absence).
  - type: remap
    input: use_group
    mapping:
      "CANALFRONT": true
      "SOUNDFRONT": true
      "OCEANFRONT": true
      "WATERFRONT PRIMARY": true
      "WATERFRONT RESIDUAL": true
      "WATERFRONT UNDEVELOPED": true
      "WATERFRONT HOMESITE": true
    output: has_waterfront
  # FondDes1 is blank on rows without a building: strip it and null
  # the blank, or it becomes a category of its own.
  - type: string
    operation: strip
    input: foundation_description
    output: foundation_description
  - type: unary
    operation: null_if_equal
    input: foundation_description
    args:
      value: ""
    output: foundation_description

drop_columns:
  - residential_model

columns_to_categorical:
  - exterior_wall
  - heating_type
  - roof_material
  - condition
  - quality_grade
  - building_style
  - foundation_description
  - use_group
  - use_group_code
  - tax_neighborhood_code
  - owner_admin2_id_admin1

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
