# Recipe: Pitt County, NC real estate sales transactions.
#
# Source: the county's `ParcelSalesHistoryPOD` table on its own ArcGIS
# Server (`gis.pittcountync.gov`, layer
# `PittOpenData/Tables/MapServer/8`) -- the full recorded sales history,
# 285,550 rows, rather than the last-sale snapshot the parcel roll
# carries. Companion to US-NC-PI_parcel-pittcounty-2026.yaml, same
# publisher and same key.
#
# Downloaded as one bulk CSV export (~49 MB) from the ArcGIS Hub
# download API rather than by paging the REST table, which at 2,000 rows
# a request would take ~143 sequential requests against the county's own
# server. The Hub export is generated asynchronously and cached; on a
# cold cache the URL can answer 404 for a few minutes while it builds. A
# 404 on first ingest means "not built yet", not "gone".
#
# The export is UTF-8 with a byte-order mark, hence `encoding:
# utf-8-sig` -- read as plain utf-8 the first column name comes through
# as '﻿OBJECTID'.
#
# Join key: PARCEL_NUM, which is the same identifier the parcel recipe
# maps as PARCELNUMBER ('99999', '88888'), so `kind: tax` resolves under
# the bundled US-NC-PI `simple` conversion to exactly the parcels'
# parcel_id_local. The parcel spine's transaction link_by_id step joins
# on that and contributes last_sale_price / last_sale_date /
# n_transactions.
#
# NOTE on coverage: 60.4% of rows carry a positive price; the remaining
# 39.6% are recorded at 0, which for a package sale generally means a
# non-arms-length transfer rather than a missing value. 96.1% carry a
# deed book. 46.5% of sales are from 2000 onward.
#
# NOTE on the placeholder date: 29,394 rows (10.3%) carry the literal
# sentinel 1901-01-02 for "date not recorded", and a further ~2,900 sit
# elsewhere before 1950. The sentinel is nulled below so it cannot
# propagate into last_sale_date as a real-looking 1901 sale; the rows
# themselves are kept, because they are genuine recorded conveyances
# with a deed reference and only the date is unknown. Sorting by
# recorded_date in the spine's aggregate join puts them last either way.
#
# NOT MAPPED, deliberately: `SALE_TYPE` is fully populated with exactly
# two values, SLTYLND (land only) and SLTYPKG (land plus improvements).
# That is a genuinely useful hedonic distinction, but it is a
# description of what the sale conveyed, not a document/instrument type,
# so mapping it onto `doc_type` would misuse a canonical field. The
# attribute registry has no transaction-side equivalent today
# (`last_sale_vacant` is the parcel-side analogue). Left unmapped
# pending a registry decision rather than silently mis-homed. `DEED_REF`
# duplicates book+page and `ROD_LINK` is a deep link into the register
# of deeds; neither has a registry home.

description: >-
  Pitt County, NC recorded real estate sales history (price, date, deed
  book and page) from the county's parcel sales history table.

admin_id: US-NC-PI

entity:
  entity_type: transaction
  source:
    source_id: pittcounty
    portal_url: "https://www.pittcountync.gov/168/Geographic-Information-Systems"
    download_url: "https://hub.arcgis.com/api/v3/datasets/41ab01b55a6c40dab3098106b9b685eb_8/downloads/data?format=csv&spatialRefId=4326"
  version: "2026"

uncompressed_file_name: "pitt_parcel_sales.csv"

encoding: utf-8-sig

# PARCEL_NUM is all digits in this county and pandas would otherwise
# infer it as an integer, against the registry's string type for
# parcel_id_assessor and destroying any leading zero the county adds
# later.
csv_dtype:
  PARCEL_NUM: str

columns:
  parcel_id_assessor: PARCEL_NUM
  recorded_date: SALE_DATE
  price: SALE_PRICE
  book: DEED_BOOK
  page: DEED_PAGE
  # SLTYLND (land only) vs SLTYPKG (land plus improvements), fully
  # populated -- what the sale conveyed, which is why it is not
  # doc_type.
  conveyance_type: SALE_TYPE

transformations:
  # Null the two "date not recorded" sentinels before parsing, so neither
  # survives as a real turn-of-the-century timestamp. The CSV export
  # renders dates as YYYY/MM/DD (the REST table uses YYYY-MM-DD for the
  # same value). Both stand out unambiguously against the genuine old
  # deeds around them -- 1901-01-02 on 29,394 rows and 1900-01-01 on
  # 1,890, where every neighbouring date carries 1 to 3.
  - type: unary
    operation: null_if_equal
    input: recorded_date
    args:
      value: "1901/01/02"
    output: recorded_date

  - type: unary
    operation: null_if_equal
    input: recorded_date
    args:
      value: "1900/01/01"
    output: recorded_date

  - type: unary
    operation: to_datetime
    input: recorded_date
    output: recorded_date

# Standardized matching key linking each sale to its parcel. `kind: tax`
# selects the assessment-roll side of the bundled per-county conversion,
# matching how the New Hanover transaction recipe keys its sales.
columns_to_categorical:
  - conveyance_type

parcel_id_local:
  source: parcel_id_assessor
  kind: tax

save_to:
  data_dir: cache
