# Recipe: Pender County, NC parcel roll.
#
# Source: the county's ArcGIS FeatureServer layer (`services3.arcgis.com`,
# org id nJbIFHiSnaX0z0hS, service `PenderNC_service`). The county also
# runs its own ArcGIS Server (`gis.pendercountync.gov`), but that layer
# carries no assessed-value fields at all; this AGD-hosted layer is the
# richer CAMA-joined source. Caps a single query at 1,000 features
# (`maxRecordCount`), so `arcgis_rest_scraper` pages through it.
#
# NOTE: no year_built field in this layer's schema (verified). Land and
# building value are populated (1957/2000 and 931/2000 sampled records
# respectively), so land/building value is included as a bonus, along with
# heated area.
#
# NOTE: no assessor land-use code either, so `use_group`/`use_subgroup` are
# deliberately unmapped and every use-code-derived indicator downstream is
# inert for this county. Checked all 42 raw fields: `USE_` is populated on 5%
# of parcels with a single value ('U'); `PCL_CLASS` (99% populated) is a tax
# class -- R 50,169 / C 2,110 / E 1,438 plus EX-* and EC-* exemption codes --
# which separates residential from commercial but says nothing about building
# type.
#
# OPEN QUESTION, not yet measured: `ZONE` (98% populated, 31 values) is mapped
# as `zoning_code` and carries categories that bear directly on the
# distinctions the occupancy vote struggles with -- MH (247 parcels, where
# manufactured homes are permitted), RM-CD1/RM-CD2 (265, multi-family), RP/RA
# (33,680, residential). Zoning states what may be built rather than what is,
# but that is an empirical question about predictive value, not a reason to
# dismiss it: unlike group_parcel it is not derived from NSI, so testing it
# against NSI would not be circular. Two things block the test today --
# `zoning_code` does not survive to the curated parcel entity, and this
# recipe's `parcel_id_assessor: PIN` yields '0' for every row (raw PIN samples
# null), so a source join fails. Both are worth fixing before judging zoning.

description: >-
  Pender County, NC parcel roll (assessed land/building/total values,
  heated area, owner, situs, most recent sale) from the county's ArcGIS
  parcel layer. No year built is available from this source.

admin_id: US-NC-PD

entity:
  entity_type: parcel
  source:
    source_id: pendercounty
    portal_url: "https://www.pendercountync.gov/162/GIS"
    download_url_scraper: arcgis_rest_scraper
  version: "2026"

uncompressed_file_name: "pender_parcels.geojson"

scraper_options:
  layer_url: "https://services3.arcgis.com/nJbIFHiSnaX0z0hS/arcgis/rest/services/PenderNC_service/FeatureServer/2"
  where: "1=1"
  out_fields: "*"

columns:
  parcel_id_assessor: PIN
  address: PROPERTY_ADDRESS
  owner_name: NAME
  owner_address: ADDR
  owner_city: CITY
  owner_admin2_id_admin1: STATE
  owner_postal_code: ZIP
  last_sale_date: DATE
  last_sale_price: SALE_PRICE
  land_value: LAND_VALUE
  improvement_value: BUILDING_VALUE
  value: TOTAL_VALUE
  subdivision: SUBDIVISION
  zoning_code: ZONE
  area_sqft: HEAT_SQ_FT

transformations:
  - type: string
    operation: concat
    inputs: [DEED_BOOK, DEED_PAGE]
    args:
      sep: "-"
    output: last_sale_book_page

columns_to_categorical:
  - owner_admin2_id_admin1
  - zoning_code

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
