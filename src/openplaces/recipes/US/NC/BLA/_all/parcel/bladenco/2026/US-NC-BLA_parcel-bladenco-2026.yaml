# Recipe: Bladen County, NC parcel tax roll.
#
# Source: the county's own ArcGIS Server (`gis.bladenco.org`, on-prem, not
# ArcGIS Online), layer `BladenCounty/MapServer/1` ("TaxParcels") -- parcel
# polygons joined to the CAMA assessment roll. The layer holds 33,335
# parcels but caps a single query at 2,000 features (`maxRecordCount`), so
# `arcgis_rest_scraper` pages through it with `resultOffset` and writes the
# combined result as one GeoJSON file.
#
# This is one of the few county rolls in the region that publishes both a
# land/building value split and a construction year (`YearActual`) in its
# public layer -- most neighboring counties' public parcel layers expose
# only a single combined value field, with no year built. `YearActual` uses
# 0 (not null) for "never recorded": 21,755 of 33,335 sampled records are
# exactly 0, vs. 11,580 genuine non-zero years -- nulled generically at
# ingest instead of masquerading as a real construction year
# (attribute_registry.csv's year_built null_placeholder).

description: >-
  Bladen County, NC parcel tax roll (assessed land/building/total values,
  year built, owner, situs, most recent sale) from the county's ArcGIS
  parcel layer.

admin_id: US-NC-BLA

entity:
  entity_type: parcel
  source:
    source_id: bladenco
    # Checked 2026-08-20 against the ArcGIS REST service this recipe
    # reads: neither copyrightText nor licenseInfo is set on the service
    # or its layer, so the endpoint openplaces actually uses states no
    # terms. Checked and absent, not unexamined -- but this speaks only
    # for that endpoint, not for anything the county may publish
    # elsewhere.
    license: "unknown (service declares no copyright or licence)"
    redistribution_restricted: null
    portal_url: "https://gis.bladenco.org/"
    # Browser-free REST pagination (peer of download_url_source, but for a
    # paginated ArcGIS layer rather than a single static URL). Loaded by path
    # from openplaces/io/scrapers/arcgis_rest_scraper.py.
    download_url_scraper: arcgis_rest_scraper
  version: "2026"

# arcgis_rest_scraper writes directly to this filename; no zip/unzip step.
uncompressed_file_name: "bladen_parcels.geojson"

scraper_options:
  layer_url: "https://gis.bladenco.org/server/rest/services/BladenCounty/MapServer/1"
  where: "1=1"
  out_fields: "*"

# Columns are named once from the raw layer fields; DeedBook/DeedPage stay
# under their raw names (not listed here) and feed the concat transformation
# below instead of becoming output columns directly.
columns:
  parcel_id_assessor: PIN
  owner_name: Name1
  owner_name_2: Name2
  legal_description: LegalDescr
  address: PhysStreet
  tax_district: TaxDistric
  tax_neighborhood_code: NeighbCode
  land_value: LandASVCur
  improvement_value: ImproveASV
  total_value: TotalASVCu
  last_sale_price: SalesAmoun
  last_sale_doc_type: SalesInstr
  last_sale_year: DeedYear
  year_built: YearActual
  area_sqft: FinishedAr
  zoning_code: ZONING
  owner_address: OwnerAddre
  owner_city: OwnerCity
  owner_admin2_id_admin1: OwnerState
  owner_postal_code: OwnerZip

# Assemble the combined deed book/page reference (registry has no separate
# book/page fields; nhcgov's NC recipe uses the same single-field
# convention).
transformations:
  - type: string
    operation: concat
    inputs: [DeedBook, DeedPage]
    args:
      sep: "-"
    output: last_sale_book_page

columns_to_categorical:
  - tax_district
  - tax_neighborhood_code
  - zoning_code
  - last_sale_doc_type
  - owner_admin2_id_admin1

# Standardized cross-comparable matching key from the assessor PIN (auto
# per-county conversion; falls back to `simple` if Bladen has no bundled
# instruction). Connects this roll to future GIS/transaction sources for the
# county.
parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
