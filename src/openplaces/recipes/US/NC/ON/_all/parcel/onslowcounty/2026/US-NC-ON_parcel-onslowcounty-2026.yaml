# Recipe: Onslow County, NC parcel roll.
#
# Source: the county's ArcGIS FeatureServer layer
# (`services7.arcgis.com`, org id RLKshC6KfXm2kCVy), service
# `Onslow_County_Parcels_3_6_24`.
#
# Downloaded as one bulk GeoJSON export (~296 MB) from the ArcGIS Hub
# download API rather than by paging the REST layer, which would take
# ~47 sequential 2,000-feature requests against the county's server. The
# REST endpoint backing it is
# services7.arcgis.com/RLKshC6KfXm2kCVy/.../FeatureServer/0.
#
# The Hub export is generated asynchronously and cached. On a cold cache
# the download URL answers 404 for a few minutes while Hub builds the
# file (verified: ready on the fifth poll here); a 404 on first ingest
# means "not built yet", not "gone". Re-run rather than switching to the
# scraper.
#
# 92,945 features against NC OneMap's 94,929 for this county, carrying a
# land/building value split, year built, story height and zoning.
#
# The service name embeds a 2024-03-06 extract date. That is the layer's
# own naming, not a guarantee of staleness -- VALUEYEAR is mapped to
# tax_year so the assessment vintage travels with the data rather than
# being inferred from the URL.
#
# Field names are truncated to 10 characters throughout (PHYSICALAD,
# FINALFULLL, ...), the signature of a shapefile round-trip. The value
# fields come in two families: FINALFULL* / TAXMARKETV are the county
# assessment, MUNIS* the municipal-tax view of the same parcels. The
# county family is mapped; the municipal one is left alone.
#
# Join key: PARID ('000999'), which matches NC OneMap's own
# parcel_id_local for this county on 99.8% of sampled rows under the
# bundled US-NC-ON conversion (`pattern: Dx`, which strips the leading
# zeros both sides share). No id-override row is needed. ALTID
# ('999-99') is the map-and-parcel form and is mapped as
# parcel_id_admin3, where it likewise matches NC OneMap's PARNO on 99.8%
# of rows.
#
# NOTE on last_sale_date: SALEDATE is a string in 'DD-MON-YY' form
# ('01-JAN-99'), which parses correctly but carries a two-digit year, so
# the POSIX pivot applies -- 00-68 resolve to 2000-2068 and 69-99 to
# 1969-1999. A genuine pre-1969 sale would land a century late. Unlike
# the Nash and Currituck layers this at least yields a real date rather
# than an epoch-millisecond integer.
#
# NOTE: LANDUSEDES duplicates LANDUSECOD ('01' in both) rather than
# describing it, so only the code is mapped; the broader PROPERTYTY
# ('R'/'C'/...) carries the usable class distinction and becomes
# use_group.

description: >-
  Onslow County, NC parcel roll (land/building values, year built, zoning,
  owner, situs, most recent sale) from the county's ArcGIS parcel layer.

admin_id: US-NC-ON

entity:
  entity_type: parcel
  source:
    source_id: onslowcounty
    # Checked 2026-08-20 through the ArcGIS Hub API for the dataset this
    # recipe downloads: the item explicitly declares license "none" and
    # carries no access-information text. So the county publishes the
    # data without stating terms -- checked and absent, not unexamined.
    license: "unknown (ArcGIS Hub item declares no licence)"
    redistribution_restricted: null
    portal_url: "https://www.onslowcountync.gov/163/Geographic-Information-Systems"
    download_url: "https://hub.arcgis.com/api/v3/datasets/d97999079b1d47d086489dc4e50a6328_0/downloads/data?format=geojson&spatialRefId=4326"
  version: "2026"

uncompressed_file_name: "onslow_parcels.geojson"

columns:
  parcel_id_assessor: PARID
  parcel_id_admin3: ALTID
  address: PHYSICALAD
  city: PHYSICALCI
  postal_code: PHYSICALZI
  owner_name: OWNER1
  owner_name_2: OWNER2
  owner_address: ADDRLINE1
  owner_city: MAILCITY
  owner_admin2_id_admin1: MAILSTATE
  owner_postal_code: MAILZIP
  legal_description: LEGAL1
  subdivision: SUBDIVISIO
  zoning_code: ZONING
  use_group: PROPERTYTY
  use_group_code: LANDUSECOD
  tax_neighborhood_code: NBHD
  tax_year: VALUEYEAR
  year_built: YEARBUILT
  area_sqft: HEATEDSQUA
  n_stories: STORYHEIGH
  n_buildings: TOTALCARDS
  # Structure detail, measured on this layer: rooms 70.7%, bedrooms
  # 70.6%, full baths 70.6%, heating 70.7%, effective year 44.4%,
  # remodel year 18.4%. BASEMENT is a 0/1 flag here rather than a
  # foundation type, so it maps to has_basement.
  n_rooms: NUMBEROFRO
  n_bedrooms: NUMBEROFBE
  n_bathrooms: NUMBEROFFU
  heating_type: HEATING
  has_basement: BASEMENT
  effective_year_built: EFFECTIVEY
  renovation_year: REMODELED
  last_sale_date: SALEDATE
  last_sale_price: SALEPRICE
  land_value: FINALFULLL
  improvement_value: FINALFULLB
  total_value: TAXMARKETV

transformations:
  - type: string
    operation: concat
    inputs: [SALEBOOK, SALEPAGE]
    args:
      sep: "-"
    output: last_sale_book_page

columns_to_categorical:
  - heating_type
  - use_group
  - use_group_code
  - zoning_code
  - tax_neighborhood_code
  - owner_admin2_id_admin1

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
