# Recipe: Onslow County, NC parcel roll.
#
# Source: the county's ArcGIS FeatureServer layer
# (`services7.arcgis.com`, org id RLKshC6KfXm2kCVy), service
# `Onslow_County_Parcels_3_6_24`.
#
# Downloaded as one bulk GeoJSON export (~296 MB) from the ArcGIS Hub
# download API rather than by paging the REST layer, which would take
# ~47 sequential 2,000-feature requests against the county's server. The
# REST endpoint backing it is
# services7.arcgis.com/RLKshC6KfXm2kCVy/.../FeatureServer/0.
#
# The Hub export is generated asynchronously and cached. On a cold cache
# the download URL answers 404 for a few minutes while Hub builds the
# file (verified: ready on the fifth poll here); a 404 on first ingest
# means "not built yet", not "gone". Re-run rather than switching to the
# scraper.
#
# 92,945 features against NC OneMap's 94,929 for this county, carrying a
# land/building value split, year built, story height and zoning.
#
# The service name embeds a 2024-03-06 extract date. That is the layer's
# own naming, not a guarantee of staleness -- VALUEYEAR is mapped to
# tax_year so the assessment vintage travels with the data rather than
# being inferred from the URL.
#
# Field names are truncated to 10 characters throughout (PHYSICALAD,
# FINALFULLL, ...), the signature of a shapefile round-trip. The value
# fields come in two families: FINALFULL* / TAXMARKETV are the county
# assessment, MUNIS* the municipal-tax view of the same parcels. The
# county family is mapped; the municipal one is left alone.
#
# Join key: PARID ('000999'), which matches NC OneMap's own
# parcel_id_local for this county on 99.8% of sampled rows under the
# bundled US-NC-ONS conversion (`pattern: Dx`, which strips the leading
# zeros both sides share). No id-override row is needed. ALTID
# ('999-99') is the map-and-parcel form and is mapped as
# parcel_id_admin3, where it likewise matches NC OneMap's PARNO on 99.8%
# of rows.
#
# NOTE on last_sale_date: SALEDATE is a string in 'DD-MON-YY' form
# ('01-JAN-99'), which parses correctly but carries a two-digit year, so
# the POSIX pivot applies -- 00-68 resolve to 2000-2068 and 69-99 to
# 1969-1999. A genuine pre-1969 sale would land a century late. Unlike
# the Nash and Currituck layers this at least yields a real date rather
# than an epoch-millisecond integer.
#
# NOTE: LANDUSEDES duplicates LANDUSECOD ('01' in both) rather than
# describing it, so only the code is mapped; the broader PROPERTYTY
# ('R'/'C'/...) carries the usable class distinction and becomes
# use_group.

description: >-
  Onslow County, NC parcel roll (land/building values, year built, zoning,
  owner, situs, most recent sale) from the county's ArcGIS parcel layer.

admin_id: US-NC-ONS

entity:
  entity_type: parcel
  source:
    source_id: onslowcounty
    # Checked 2026-08-20 twice over: the ArcGIS Hub item for this dataset
    # explicitly declares license "none", and the county's own site was
    # fetched and scanned for licence, resale, redistribution and
    # data-agreement language, which found none either.
    license: "unknown (no terms on the Hub item or the county site)"
    redistribution_restricted: null
    portal_url: "https://www.onslowcountync.gov/163/Geographic-Information-Systems"
    download_url: "https://hub.arcgis.com/api/v3/datasets/d97999079b1d47d086489dc4e50a6328_0/downloads/data?format=geojson&spatialRefId=4326"
  version: "2026"

uncompressed_file_name: "onslow_parcels.geojson"

columns:
  parcel_id_assessor: PARID
  parcel_id_admin3: ALTID
  address: PHYSICALAD
  city: PHYSICALCI
  postal_code: PHYSICALZI
  owner_name: OWNER1
  owner_name_2: OWNER2
  owner_address: ADDRLINE1
  owner_city: MAILCITY
  owner_admin2_id_admin1: MAILSTATE
  owner_postal_code: MAILZIP
  legal_description: LEGAL1
  subdivision: SUBDIVISIO
  zoning_code: ZONING
  use_group: PROPERTYTY
  use_group_code: LANDUSECOD
  tax_neighborhood_code: NBHD
  tax_year: VALUEYEAR
  year_built: YEARBUILT
  n_stories: STORYHEIGH
  n_buildings: TOTALCARDS
  # Structure detail, measured on this layer: rooms 70.7%, bedrooms
  # 70.6%, full baths 70.6%, heating 70.7%, effective year 44.4%,
  # remodel year 18.4%.
  #
  # Building features, MEASURED 2026-09-13 in memory (residential =
  # PROPERTYTY R, 82,180 rows): exterior wall (STRUCTURET, 21
  # values), style (STRUCTURES, 13) and heating fuel (HEATINGFUE, 6)
  # 76.7% each; has_central_air 74.2% (60,750 true, 264 false);
  # effective year 21.0%, remodel year 8.2%. quality_grade
  # (COM_GRADE, 5 letter grades) and gross_floor_area_sqft (COM_AREA)
  # come from the commercial section only: 3.2% of rows, none of
  # them residential, never on a row with a dwelling record.
  #
  # BASEMENT is not mapped. It is a code (1 on 64,573 rows, 2 on 21,
  # 3 on 1,221, 4 on 211), not the 0/1 flag this header once called
  # it, so has_basement: BASEMENT read every coded row as true. The
  # layer publishes no domain for it, and codes 3 and 4 sit mostly
  # on beach houses and beach duplexes (764 of 1,432), where a
  # basement is unlikely: the county's code list is needed first.
  # ATTIC (1 on 65,988 rows) is the same kind of code.
  #
  # HEATEDSQUA is not the living area: 28.3% of rows, 39.5% of rows
  # with a dwelling record, median 344 sqft (10th to 90th percentile
  # 160 to 835), correlation 0.32 with the room count. It was mapped
  # to area_sqft while that name meant floor area; it is now left
  # unmapped, being neither living_area_sqft nor
  # gross_floor_area_sqft, and the layer carries no other residential
  # area field.
  #
  # LANDWIDTH (21.3% of rows, median 85) is filled on GROSS land-type
  # rows (19,634 of 19,840), not front-foot ones, so it reads as a
  # lot width, not street frontage, and is not frontage_ft. HEATSYS
  # mixes numeric codes with text and is left unmapped.
  #
  # Baths: NUMBEROFFU is the full count and NUMBEROFHA the half count
  # (25.5% of rows carry a half bath, 35.7% of rows with a full bath).
  # n_bathrooms folds them as full + 0.5 x half below. NUMBEROFFI
  # (median 3) counts extra plumbing fixtures and is not a bath count.
  n_rooms: NUMBEROFRO
  n_bedrooms: NUMBEROFBE
  n_bathrooms: NUMBEROFFU
  n_half_bathrooms: NUMBEROFHA
  heating_type: HEATING
  heating_fuel: HEATINGFUE
  exterior_wall: STRUCTURET
  building_style: STRUCTURES
  quality_grade: COM_GRADE
  gross_floor_area_sqft: COM_AREA
  effective_year_built: EFFECTIVEY
  renovation_year: REMODELED
  last_sale_date: SALEDATE
  last_sale_price: SALEPRICE
  land_value: FINALFULLL
  improvement_value: FINALFULLB
  total_value: TAXMARKETV

transformations:
  - type: string
    operation: concat
    inputs: [SALEBOOK, SALEPAGE]
    args:
      sep: "-"
    output: last_sale_book_page
  # n_bathrooms = full + 0.5 x half. The sum keeps a row null only when
  # both counts are, so a missing half count reads as zero halves.
  - type: expression
    expression: "n_half_bathrooms * 0.5"
    inputs: [n_half_bathrooms]
    output: half_bathroom_equivalent
  - type: aggregate
    operation: sum
    inputs: [n_bathrooms, half_bathroom_equivalent]
    output: n_bathrooms
  # has_central_air from the combined heat/AC description: true where
  # it names central AC, false where it states no AC, null for a
  # heating-only description that says nothing either way.
  - type: remap
    input: heating_type
    mapping:
      "CENTRAL HEAT & A/C": true
      "CENTRAL AC": true
      "FURNACE / CENT AC": true
      "ELECTRIC HT / CENT AC": true
      "NO HEAT, NO AC": false
    output: has_central_air
  # COM_AREA holds 0 where nothing was recorded.
  - type: unary
    operation: null_if_equal
    input: gross_floor_area_sqft
    args: {value: 0}
    output: gross_floor_area_sqft

drop_columns:
  - half_bathroom_equivalent

columns_to_categorical:
  - heating_type
  - heating_fuel
  - exterior_wall
  - building_style
  - quality_grade
  - use_group
  - use_group_code
  - zoning_code
  - tax_neighborhood_code
  - owner_admin2_id_admin1

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
