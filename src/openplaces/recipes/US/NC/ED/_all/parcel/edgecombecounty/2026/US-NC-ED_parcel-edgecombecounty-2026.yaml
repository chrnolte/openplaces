# Recipe: Edgecombe County, NC parcel roll.
#
# Source: the county's own ArcGIS Server (`gis.edgecombecountync.gov`,
# token-free), layer `webmap/MapServer/10` ("Parcels"). Caps a single
# query at 1,000 features (`maxRecordCount`), so `arcgis_rest_scraper`
# pages through it. The tax office's own "Map Downloads" page offers no
# bulk file (GIS-use waiver + paid shapefile purchase only); this layer is
# the free alternative.
#
# NOTE: no year_built field in this layer's schema (verified). landval and
# bldgval are populated (982/1000 and 584/1000 sampled records
# respectively), so land/building value is included as a bonus.

description: >-
  Edgecombe County, NC parcel roll (assessed land/building/total values,
  owner, situs, deed reference) from the county's ArcGIS parcel layer. No
  year built is available from this source.

admin_id: US-NC-ED

entity:
  entity_type: parcel
  source:
    source_id: edgecombecounty
    # Checked 2026-08-20 at the terms_url below. The county sells GIS
    # shapefiles ($25 each with a signed waiver "agreeing not to resale
    # our data", or $200 each for commercial use) -- so its published
    # data product carries a real no-resale condition.
    #
    # This recipe does not use that product: it pages the county's
    # public ArcGIS REST service. Recorded as restricted anyway, because
    # a user should meet the county's stated position before
    # redistributing anything derived from its parcels.
    license: "no resale; signed agreement and fee for the shapefile product"
    terms_url: "https://www.edgecombecountync.gov/businesses/tax_assessor/map_downloads.php"
    redistribution_restricted: true
    portal_url: "https://www.edgecombecountync.gov/businesses/tax_assessor/map_downloads.php"
    download_url_scraper: arcgis_rest_scraper
  version: "2026"

uncompressed_file_name: "edgecombe_parcels.geojson"

scraper_options:
  layer_url: "https://gis.edgecombecountync.gov/arcgis/rest/services/webmap/MapServer/10"
  where: "1=1"
  out_fields: "*"

columns:
  parcel_id_assessor: parcel
  address: address
  owner_name: owner
  owner_city: city
  owner_admin2_id_admin1: st
  owner_postal_code: zip
  legal_description: propdescr
  last_sale_date: deeddate
  last_sale_price: salepr
  last_sale_book_page: bk_pg
  land_value: landval
  improvement_value: bldgval
  total_value: netval
  subdivision: subdivisio
  zoning_code: zone

columns_to_categorical:
  - owner_admin2_id_admin1
  - zoning_code

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
