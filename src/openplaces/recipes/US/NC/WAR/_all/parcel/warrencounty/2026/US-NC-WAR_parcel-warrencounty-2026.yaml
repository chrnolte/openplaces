# Recipe: Warren County, NC parcel roll.
#
# Source: the county's ArcGIS REST service on the ROKtech "ROKMAPS"
# platform (`arcgis5.roktech.net`), layer 4 ("Parcels - Large Scale").
#
# CAUTION: a service literally named `Warren_Service` also exists in the
# AGD-hosted org used by several other counties in this batch
# (services3.arcgis.com/nJbIFHiSnaX0z0hS) -- it is Warren County,
# MISSISSIPPI (confirmed: its spatial reference is EPSG:2255, Mississippi
# Transverse Mercator, and it carries Mississippi Delta agricultural field
# names like CULT_VAL/UNCULT_VAL). Do not use it for this recipe; the
# roktech.net service below was verified to cover Warren County, NC
# (extent centered near -78.1, 36.4).
#
# Caps a single query at 1,000 features (`maxRecordCount`), so
# `arcgis_rest_scraper` pages through it.
#
# NOTE: no year_built field in this layer's 30-field schema (verified; no
# non-spatial CAMA table exists on this service either). Land and building
# value are populated (1000/1000 and 502/1000 sampled records
# respectively), so land/building value is included as a bonus, along with
# heated area.

description: >-
  Warren County, NC parcel roll (assessed land/building/total values,
  heated area, owner, situs, most recent sale) from the county's ArcGIS
  parcel layer. No year built is available from this source.

admin_id: US-NC-WAR

entity:
  entity_type: parcel
  source:
    source_id: warrencounty
    # Checked 2026-08-20 against the ArcGIS REST service this recipe
    # reads: neither copyrightText nor licenseInfo is set on the service
    # or its layer, so the endpoint openplaces actually uses states no
    # terms. Checked and absent, not unexamined -- but this speaks only
    # for that endpoint, not for anything the county may publish
    # elsewhere.
    license: "unknown (service declares no copyright or licence)"
    redistribution_restricted: null
    portal_url: "https://www.warrencountync.com/162/GIS"
    download_url_scraper: arcgis_rest_scraper
  version: "2026"

uncompressed_file_name: "warren_parcels.geojson"

scraper_options:
  layer_url: "https://arcgis5.roktech.net/arcgis/rest/services/Warren/RokMap/MapServer/4"
  where: "1=1"
  out_fields: "*"

columns:
  parcel_id_assessor: NEWPIN
  address: SITUS_ADDRESS
  owner_name: NAME1
  owner_name_2: NAME2
  owner_address: ADDR
  owner_city: CITY
  owner_admin2_id_admin1: STATE
  owner_postal_code: ZIP
  last_sale_date: DEEDDATE
  last_sale_price: SALE_PRICE
  land_value: LAND_VAL
  improvement_value: BLDG_VAL
  total_value: ASSESSED_VAL
  area_sqft: HEATED_AREA

transformations:
  - type: string
    operation: concat
    inputs: [DEEDBOOK, DEEDPAGE]
    args:
      sep: "-"
    output: last_sale_book_page

columns_to_categorical:
  - owner_admin2_id_admin1

parcel_id_local:
  source: parcel_id_assessor
  kind: parcel

save_to:
  data_dir: core
