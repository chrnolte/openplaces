# Patch: New Jersey transaction curation, grading the SR1A usable and
# nonusable deed categories (US-NJ_transaction-njtaxation-2026).
#
# The ingest writes the Division of Taxation's own verdict as one code:
# `U` for a deed usable in the sales-ratio study, `N` and the category
# of N.J.A.C. 18:12-1.1 for a nonusable one (`N25`). The categories
# are the State's, so a state patch. The national recipe's map does not
# know these codes and leaves them missing; this patch fills them. A
# code not listed here (a category the rule may add later) stays
# missing: there is no default.
#
# 1.0: `U`, the assessor and the Division found nothing against the
# sale.
#
# 0.7: categories that disqualify the assessment, not the price. The
# sale may well be at arm's length; it is unusable for a ratio because
# the assessment does not describe what was sold, or the timing is
# off. 5 deed dated before the January preceding the sampling period;
# 6 a portion of the assessed lot (apportionment, split-off); 7
# improved after assessment; 16 assessed in more than one taxing
# district; 19 damaged or demolished after assessment; 24 value
# changed by zoning or approvals after assessment; 27 before a
# revaluation reached the roll; 29 assessment fixed by court order or
# the Freeze Act; 30 several lots that are not one economic unit; 32
# record card error; 33 farmland, exempt or abated; 34 property class
# not the actual use; 36 assessment not municipal practice, or an
# individual ratio so far off that it would distort the municipal
# ratio (the State's ratio, read as a code; openplaces computes none,
# L29).
#
# 0.0: categories that say the price is not a market price. 1 immediate
# family; 2 "love and affection"; 3 corporation and its stockholder or
# affiliate; 4 transfer of convenience; 8 undivided interest; 9 under
# a tax sale certificate or lien; 10 by guardian, trustee, executor or
# administrator; 11 judicial sale; 12 sheriff's sale; 13 bankruptcy,
# receivership, liquidation or short sale; 14 doubtful title, quitclaim;
# 15 to or from a government; 17 to or from a charity; 18 in lieu of
# foreclosure; 20 utility right of way; 21 low or moderate income
# housing; 22 exchange; 23 commercial sale with personalty of unknown
# value; 25 consideration of 100 dollars or less; 26 other, not a
# willing buyer and seller; 28 leaseback; 31 first sale after a bank's
# foreclosure; 35 less than full ownership. The rule's (b) list (1, 3,
# 9, 10, 15, 17, 26, 28, 30, 35) may be used after investigation; a
# deed carrying the code was not, so the code stands.
#
# Group: qualified for `U`; related_parties_family for 1,
# related_parties_business for 3; not_a_sale for 2, 4, 22 and 25;
# qualified_parcel_changed for 6, 7, 19 and 24; qualified_multi_parcel
# for 16 and 30; disqualified for the other 0.0 codes. The other 0.7
# codes get no group, since none of the registry's groups describes
# them; the confidence carries them.
#
# Measured 2026-10-22 on US-NJ-CU (27,305 SR1A deeds, 2019-07 to
# 2026-06): 1.0 on 8,821 (32.3%), 0.7 on 4,811, 0.0 on 13,673; every
# code present is listed, so none is left missing. Categories 22, 27
# and 36 do not occur in the county.

admin_id: US-NJ
stage: curate

entity:
  entity_type: transaction
  source:
    source_id: openplaces
  version: 2026

patches: US_transaction-openplaces-2026
