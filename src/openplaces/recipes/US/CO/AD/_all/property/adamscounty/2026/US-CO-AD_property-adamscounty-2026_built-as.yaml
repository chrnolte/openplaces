# Recipe: Adams County, CO Assessor's Detailed Data Dump, improvements
# built-as table: one row per built-as section of an improvement.
# Same source and terms as US-CO-AD_property-adamscounty-2026; read
# that roll's header first.
#
# LAYOUT. Built_As.TXT, 492 characters (Appraisal_FileLayout.doc,
# IMPROVEMENTS BUILT-AS TABLE); read up to YRREM. 182,056 rows; 268
# account and IMPNO pairs repeat (sections of one improvement), which
# are summed like separate sections.
#
# CODES. BLTASID is a numeric code. Its description and property type
# come from the county's own lookup (Built_As_Codes.TXT, 407 codes,
# each unique), copied verbatim into two sidecars beside this recipe:
# _built-as-style-remap.csv (building_style) and
# _built-as-type-remap.csv (the code's property type: Residential,
# Townhouse, Condo, Multiple Unit, Duplex, Triplex, Mobile Home,
# Commercial or Out Building). Code 0 ('Permit Value *CODE') is a
# valuation placeholder and gets no style.
#
# BATHS. BATHS is a decimal count in half steps (fractions .0 on
# 98,042 residential rows, .5 on 66,939, .75 on 10, .25 on 3). It is NOT
# mapped (user decision, 2026-09-13): checked against the Detail
# table's bathroom fixture lines per improvement, BATHS equals full
# baths (four or more fixtures) + three-fixture baths + 0.5 x
# two-fixture baths on 92.0% of 153,169 improvements, i.e. it counts a
# three-quarter bath as one. n_bathrooms and n_half_bathrooms are
# therefore built from those fixture lines in _detail, weighting a
# three-quarter bath 0.75; this table writes neither.
#
# MAPPING, summed over sections to the account: n_bedrooms BEDROOMS,
# n_rooms ROOMS, n_dwellings UNITS above 0 (UNITS is
# 0 on single-family rows). Areas by the code's property type:
# living_area_sqft is BLTASSF of residential codes (above-grade
# finished area; basements and garages are Detail lines);
# gross_floor_area_sqft is BLTASSF of commercial codes; outbuildings
# count toward neither. Read from non-outbuilding sections only:
# year_built YRBLT (earliest), renovation_year YRREM from 1800 to 2027
# (latest; 20.3% of residential sections), n_stories STORIES above 0
# and at most 30 (largest; one row reads 2021), and the codes, first
# kept: building_style, heating_type HVACTYPE (the county's HVAC
# system, truncated to 20 characters in this file), exterior_wall
# EXTERIOR, roof_material ROOFCOVER, foundation_description FOUNDATION
# (12.4%), construction_description CLASS (the Realware construction
# class letter, 2.7%). has_central_air is true where HVACTYPE names
# cooling ('Cool Air in Heat Duc', 'Central Air to Air', 'Warm and
# Cool Air Zo', 'Cool Air Separate Du', 'Cool Air Seperate Du',
# 'Complete HVAC', 'Refrigerated AC Zone') and missing elsewhere.
# Left unmapped: EFFAGE (an age, 0.4%), CLIMATE (one value),
# INTERIOR, ROOFTYPE, FLOORCOVER, STORYHT, SPRINKLERSF, OTHER, and the
# agricultural and mobile-home dimension fields.
#
# MEASURED: see the validation note at the end of the roll's header.

description: >-
  Adams County, CO Assessor built-as table: rooms, bedrooms, stories,
  years, living area and building codes per property.

admin_id: US-CO-AD

entity:
  entity_type: property
  source:
    source_id: adamscounty
    # Same page and terms as the roll; see its header.
    portal_url: "https://adamscountyco.gov/our-county/elected-officials/assessor/maps-data/"
    download_url: "https://adamscountyco.gov/wp-content/uploads/2026/05/Appraisal_2026_2.zip"
    license: "CC-BY-4.0"
    terms_url: "https://www.arcgis.com/home/item.html?id=59fb004d67a748b19f5faf1dca9d700d"
    redistribution_restricted: false
  version: "2026"

compressed_file_name: "Appraisal_2026_2.zip"
uncompressed_file_name: "Appraisal_2026_2/Built_As.TXT"

process_by:
  admin_level: 3

encoding: latin-1

# Appraisal layout, IMPROVEMENTS BUILT-AS TABLE; read up to YRREM.
fixed_width:
  - [ACCOUNTNO, 8]
  - [filler, 3] # AREAID
  - [filler, 13] # PARCELNB
  - [filler, 6] # IMPNO
  - [BLTASID, 7]
  - [BLTASSF, 12]
  - [HVACTYPE, 20]
  - [filler, 14] # HVACPERC
  - [filler, 15] # CLIMATE
  - [EXTERIOR, 30]
  - [filler, 20] # INTERIOR
  - [STORIES, 14]
  - [filler, 11] # STORYHT
  - [filler, 11] # SPRINKLERSF
  - [filler, 20] # ROOFTYPE
  - [ROOFCOVER, 20]
  - [filler, 20] # FLOORCOVER
  - [FOUNDATION, 20]
  - [ROOMS, 6]
  - [BEDROOMS, 8]
  - [filler, 8] # BATHS, not mapped; see BATHS
  - [UNITS, 11]
  - [filler, 11] # OTHER
  - [CLASS, 10]
  - [filler, 11] # DIAMETER
  - [filler, 11] # CAPACITY
  - [filler, 11] # HORSEPOWER
  - [filler, 11] # HEIGHT
  - [YRBLT, 5]
  - [YRREM, 5]

columns:
  property_id_assessor: ACCOUNTNO
  n_bedrooms: BEDROOMS
  n_rooms: ROOMS
  n_dwellings: UNITS
  n_stories: STORIES
  year_built: YRBLT
  renovation_year: YRREM
  heating_type: HVACTYPE
  exterior_wall: EXTERIOR
  roof_material: ROOFCOVER
  foundation_description: FOUNDATION
  construction_description: CLASS

transformations:
  # Code lookups; see CODES. The sidecar keys read as integers.
  - {type: unary, operation: to_numeric, input: BLTASID, output: BLTASID}
  - type: remap_file
    input: BLTASID
    crosswalk_id: US-CO-AD_property-adamscounty-2026_built-as-style-remap
    output: building_style
  - type: remap_file
    input: BLTASID
    crosswalk_id: US-CO-AD_property-adamscounty-2026_built-as-type-remap
    output: built_as_type
  - {type: unary, operation: null_if_equal, input: building_style,
     args: {value: 'Permit Value  *CODE'}, output: building_style}
  - {type: unary, operation: to_numeric, input: n_bedrooms, output: n_bedrooms}
  - {type: unary, operation: to_numeric, input: n_rooms, output: n_rooms}
  - {type: unary, operation: to_numeric, input: n_dwellings, output: n_dwellings}
  - {type: unary, operation: null_if_equal, input: n_dwellings, args: {value: 0},
     output: n_dwellings}
  - {type: unary, operation: to_numeric, input: BLTASSF, output: BLTASSF}
  - type: expression
    expression: >-
      BLTASSF.where(built_as_type.isin(['Residential', 'Townhouse', 'Condo',
      'Multiple Unit', 'Duplex', 'Triplex', 'Mobile Home']) & (BLTASSF > 0))
    inputs: [BLTASSF, built_as_type]
    output: living_area_sqft
  - type: expression
    expression: "BLTASSF.where((built_as_type == 'Commercial') & (BLTASSF > 0))"
    inputs: [BLTASSF, built_as_type]
    output: gross_floor_area_sqft
  - {type: unary, operation: to_numeric, input: year_built, output: year_built}
  - type: expression
    expression: "year_built.where(built_as_type != 'Out Building')"
    inputs: [year_built, built_as_type]
    output: year_built
  - {type: unary, operation: to_numeric, input: renovation_year,
     output: renovation_year}
  - type: expression
    expression: >-
      renovation_year.where((built_as_type != 'Out Building') &
      (renovation_year >= 1800) & (renovation_year <= 2027))
    inputs: [renovation_year, built_as_type]
    output: renovation_year
  - {type: unary, operation: to_numeric, input: n_stories, output: n_stories}
  - type: expression
    expression: >-
      n_stories.where((built_as_type != 'Out Building') & (n_stories > 0) &
      (n_stories <= 30))
    inputs: [n_stories, built_as_type]
    output: n_stories
  - type: remap_conditional
    input: heating_type
    conditions:
      - condition: in
        values:
          - 'Cool Air in Heat Duc'
          - 'Central Air to Air'
          - 'Warm and Cool Air Zo'
          - 'Cool Air Separate Du'
          - 'Cool Air Seperate Du'
          - 'Complete HVAC'
          - 'Refrigerated AC Zone'
        output: true
    output: has_central_air
  # Codes from sections other than outbuildings; see MAPPING.
  - type: expression
    expression: "building_style.where(built_as_type != 'Out Building')"
    inputs: [building_style, built_as_type]
    output: building_style
  - type: expression
    expression: "heating_type.where(built_as_type != 'Out Building')"
    inputs: [heating_type, built_as_type]
    output: heating_type
  - type: expression
    expression: "exterior_wall.where(built_as_type != 'Out Building')"
    inputs: [exterior_wall, built_as_type]
    output: exterior_wall
  - type: expression
    expression: "roof_material.where(built_as_type != 'Out Building')"
    inputs: [roof_material, built_as_type]
    output: roof_material
  - type: expression
    expression: "foundation_description.where(built_as_type != 'Out Building')"
    inputs: [foundation_description, built_as_type]
    output: foundation_description
  - type: expression
    expression: "construction_description.where(built_as_type != 'Out Building')"
    inputs: [construction_description, built_as_type]
    output: construction_description

drop_columns:
  - built_as_type

aggregation_function:
  n_bedrooms: sum
  n_rooms: sum
  n_dwellings: sum
  living_area_sqft: sum
  gross_floor_area_sqft: sum
  year_built: min
  renovation_year: max
  n_stories: max
  has_central_air: max
  building_style: first
  heating_type: first
  exterior_wall: first
  roof_material: first
  foundation_description: first
  construction_description: first

supplements: US-CO-AD_property-adamscounty-2026
supplements_key: property_id_assessor

save_to:
  data_dir: cache
  filename: built-as
