# Recipe: Boulder County, CO Assessor buildings table, car storage
# sub-areas (garages and carports). Same file as
# US-CO-BO_property-bouldercounty-2026_buildings; read its header for
# why the table is read three times.
#
# ONE ROW. A car storage sub-area of a building section: rows are
# kept once per strap, bld_num, section_num, carStorageType and
# carStorageSF, which removes the copies the basement sub-areas make.
#
# MAPPING. carStorageTypeDscr: 'ATTACHED GARAGE AREA', 'DETACHED
# GARAGE', 'BASEMENT GARAGE AREA', 'GARAGE SET UP AS A WORKSHOP
# (ELEC., ETC.) AREA' and 'GARAGE W/ FINISHED WALLS AREA' are
# garages; 'CARPORT AREA' is a carport; '0' is none.
# garage_area_sqft sums carStorageSF over the garage kinds and
# garage_type keeps the first garage kind's description; has_garage
# and has_carport are true where the kind is present and missing
# elsewhere.
#
# MEASURED: see the validation note at the end of the roll's header.

description: >-
  Boulder County, CO Assessor buildings table, car storage sub-areas:
  garage area and type, garage and carport flags per property.

admin_id: US-CO-BO

entity:
  entity_type: property
  source:
    source_id: bouldercounty
    # Same page and terms as the roll; see its header.
    portal_url: "https://bouldercounty.gov/property-and-land/assessor/data-download/"
    download_url: "https://assessor.boco.solutions/ASR_PublicDataFiles/Buildings.csv"
    license: >-
      unknown (no licence; General Disclaimer 'developed solely for
      internal use only by Boulder County', quoted in full on the roll)
    terms_url: "https://bouldercounty.gov/property-and-land/assessor/data-download/"
    redistribution_restricted: null
  version: "2026"

uncompressed_file_name: "Buildings.csv"

process_by:
  admin_level: 3

csv_dtype: str

columns:
  property_id_assessor: strap
  garage_type: carStorageTypeDscr

# One row per car storage sub-area; see ONE ROW.
drop_duplicates: [property_id_assessor, bld_num, section_num, carStorageType,
                  carStorageSF]

transformations:
  - {type: unary, operation: to_numeric, input: carStorageSF, output: carStorageSF}
  - type: expression
    expression: >-
      carStorageSF.where(garage_type.isin(['ATTACHED GARAGE AREA', 'DETACHED
      GARAGE', 'BASEMENT GARAGE AREA', 'GARAGE SET UP AS A WORKSHOP (ELEC.,
      ETC.) AREA', 'GARAGE W/ FINISHED WALLS AREA']) & (carStorageSF > 0))
    inputs: [carStorageSF, garage_type]
    output: garage_area_sqft
  - type: remap_conditional
    input: garage_type
    conditions:
      - condition: in
        values:
          - 'ATTACHED GARAGE AREA'
          - 'DETACHED GARAGE'
          - 'BASEMENT GARAGE AREA'
          - 'GARAGE SET UP AS A WORKSHOP (ELEC., ETC.) AREA'
          - 'GARAGE W/ FINISHED WALLS AREA'
        output: true
    output: has_garage
  - type: remap_conditional
    input: garage_type
    conditions:
      - condition: in
        values: ['CARPORT AREA']
        output: true
    output: has_carport
  - type: expression
    expression: "garage_type.where(has_garage == True)"
    inputs: [garage_type, has_garage]
    output: garage_type

aggregation_function:
  garage_area_sqft: sum
  garage_type: first
  has_garage: max
  has_carport: max

supplements: US-CO-BO_property-bouldercounty-2026
supplements_key: property_id_assessor

save_to:
  data_dir: cache
  filename: car-storage
