# Recipe to import Turkish districts (ilce) at admin level 3.
#
# Turkey needed a typed query where Brazil and the Philippines did not, and
# the reason is worth recording because it recurs.
#
# A Turkish district and the town at its centre almost always share a name,
# and both link to the province. An untyped harvest therefore returns two
# equally-named candidates under the same parent for most districts: 73% of
# units came back ambiguous and only 13.8% resolved. Restricting to
# `wd:Q1147395` (district of Turkey) removes the collision -- ambiguity
# falls to 4.1%.
#
# That is the opposite of what type filtering did for Colombia, where it
# scored worse than leaving it off. The rule is not "always type" or "never
# type": type when the untyped pool is ambiguous, which it is wherever a
# country names its districts after their central town.
#
# The second half of the fix was vocabulary. Wikidata labels these as
# "Kas ilcesi", "Demre (ilce)" or "Ardanuc Ilcesi" while the spine carries
# the bare name; `ilce`/`ilcesi` mean district. Stripping them took the
# match from 32.6% to 78.4%.
#
# **The stripping is done in the query, not in a transformation**, and the
# reason is the pipeline's order rather than taste: `drop_duplicates` runs
# before transformations, so a name cleaned afterwards is cleaned too late
# for the dedupe to see it. Left uncleaned, a district arrived both as
# "Ibradi ilcesi" and as "Ibradi" and was counted twice: 1,039 rows
# against the 973 districts Turkey has.
#
# The word sits in three places and one pattern cannot take all of them
# without damage. Removing a trailing "ilcesi)" also took the closing
# bracket and left "Bayat (Afyonkarahisar", so the query applies three
# replacements in order: before a bracket ("Yesilyurt Ilcesi (Tokat)"),
# inside one ("Bayat (Afyonkarahisar ilcesi)"), then at the end
# ("Ibradi ilcesi", "Karakecili (ilce)"). A bracketed province is kept,
# because many district names repeat across provinces and the bare name
# would collide.
#
# That leaves 982 rows, 980 once duplicate name-and-province pairs go,
# against 973. The residue is Wikidata modelling rather than anything
# this recipe can reach, and it is nearer the truth than GADM's 929,
# which additionally could not be redistributed.

description: >-
  Turkish district (ilce) names at admin level 3.

admin_id: TR

entity:
  entity_type: admin
  source:
    source_id: tuik
    portal_url: "https://www.tuik.gov.tr/"
    # TUIK is the authority for Turkish administrative divisions. Wikidata
    # is used as the machine-readable route because it exposes the district
    # class directly, under CC0.
    download_url: "https://query.wikidata.org/sparql?query=SELECT%20DISTINCT%20%3Fname%20%3FparentIso%20WHERE%20%7B%20%3Fparent%20wdt%3AP300%20%3FparentIso%20.%20FILTER%28STRSTARTS%28%3FparentIso%2C%20%22TR-%22%29%29%20%3Fitem%20wdt%3AP131%20%3Fparent%20%3B%20wdt%3AP31%20wd%3AQ1147395%20.%20OPTIONAL%20%7B%20%3Fitem%20rdfs%3Alabel%20%3Ftr%20FILTER%28lang%28%3Ftr%29%20%3D%20%22tr%22%29%20%7D%20OPTIONAL%20%7B%20%3Fitem%20rdfs%3Alabel%20%3Fen%20FILTER%28lang%28%3Fen%29%20%3D%20%22en%22%29%20%7D%20BIND%28REPLACE%28REPLACE%28REPLACE%28COALESCE%28%3Ftr%2C%20%3Fen%2C%20%22%22%29%2C%22%5C%5Cs%2A%28%C4%B0l%C3%A7esi%7Cil%C3%A7esi%7C%C4%B0l%C3%A7e%7Cil%C3%A7e%29%5C%5Cs%2A%5C%5C%28%22%2C%20%22%20%28%22%29%2C%22%5C%5Cs%2B%28%C4%B0l%C3%A7esi%7Cil%C3%A7esi%7C%C4%B0l%C3%A7e%7Cil%C3%A7e%29%5C%5C%29%24%22%2C%20%22%29%22%29%2C%22%5C%5Cs%2A%5C%5C%28%3F%28%C4%B0l%C3%A7esi%7Cil%C3%A7esi%7C%C4%B0l%C3%A7e%7Cil%C3%A7e%29%5C%5C%29%3F%24%22%2C%20%22%22%29%20AS%20%3Fname%29%20FILTER%28%3Fname%20%21%3D%20%22%22%29%20%7D"
    license: "CC0 (Wikidata)"
    terms_url: "https://www.wikidata.org/wiki/Wikidata:Licensing"
    redistribution_restricted: false
  version: 2026

# Wikidata content-negotiates: it ignores `format=csv` in the query
# string and serves SPARQL XML regardless, so the format has to be
# asked for by header. Without this the download lands as XML under a
# .csv name and fails to parse thousands of lines in.
download_headers:
  Accept: "text/csv"

uncompressed_file_name: "tr_districts.csv"

columns:
  name: name
  admin2_id_iso: parentIso

keep_unnamed_columns: False

# Two items can survive the query as the same district of the same
# province once the vocabulary is stripped. This runs before the
# transformations, which is why the stripping is done in the query.
drop_duplicates:
  - name
  - admin2_id_iso

# The province layer beside this one, not the spine. Reading the spine
# is why this recipe never ran: the spine's Turkish level 2 carries no
# `admin2_id_iso`, so the join found no key at all, and because
# `get_crosswalk` warns and returns an empty mapping rather than
# raising, nothing said so.
admin_id_crosswalk:
  admin_level: 2
  admin_id_column: admin2_id_iso
  admin_recipe_id: "TR_admin-tuik-2026_admin2"

create_index:
  function: "openplaces.io.admin_codes.assign_admin_ids"
  args:
    new_admin_id_col: admin3_id
    parent_admin_id_col: admin2_id
    name_col: name

sort_index: True
