description: >-
  Overture Maps address points, ingested as dwelling points with street addresses.

admin_id: NULL

entity:
  entity_type: dwelling
  source:
    source_id: overture
    portal_url: "https://overturemaps.org"
    download_url: "s3://overturemaps-us-west-2/release/2026-04-15.0/theme=addresses/type=address/"
  version: 2025

download_by:
  partition: latlon_tile
  tile_size_deg: 1.0
  bbox_column: bbox
  s3_anonymous: true
  s3_region: us-west-2

overlay_admin_ids:
  admin_level: 3
  admin_recipe_id: 'admin-openplaces-2026_admin3'

columns:
  dwelling_id: id
  address_street: street
  address_number: number
  unit_number: unit
  postal_code: postcode
  city: postal_city

set_index: dwelling_id

save_to:
  data_dir: cache
  admin_level: 3
