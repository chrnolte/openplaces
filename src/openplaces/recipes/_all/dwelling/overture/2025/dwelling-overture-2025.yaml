description: >-
  Overture Maps address points, ingested as dwelling points with street addresses.

admin_id: NULL

entity:
  entity_type: dwelling
  source:
    source_id: overture
    portal_url: "https://overturemaps.org"
    download_url: "s3://overturemaps-us-west-2/release/latest/theme=addresses/type=address/"
    # Terms verified 2026-08-19 at the terms_url below. This recipe reads
    # the *addresses* theme, which is not ODbL: it draws on many national
    # open-data sources under CC-BY-4.0, CC0 and equivalents, varying by
    # region, all permissive and all requiring attribution. Overture's
    # *buildings* theme is ODbL -- do not carry this entry across to a
    # buildings recipe without re-checking.
    license: "mixed-permissive (CC-BY-4.0, CC0, national open data); attribution required"
    terms_url: "https://docs.overturemaps.org/attribution/"
    redistribution_restricted: false
  version: 2025

download_by:
  partition: latlon_tile
  tile_size_deg: 1.0
  bbox_column: bbox
  s3_anonymous: true
  s3_region: us-west-2

overlay_admin_ids:
  admin_level: 3
  admin_recipe_id: 'admin-openplaces-2026_admin3'

columns:
  dwelling_id: id
  address_street: street
  address_number: number
  unit_number: unit
  postal_code: postcode
  city: postal_city

set_index: dwelling_id

save_to:
  data_dir: cache
  admin_level: 3
