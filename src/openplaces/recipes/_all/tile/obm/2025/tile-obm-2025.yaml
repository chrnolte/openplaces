# Recipe to import the OpenBuildingMap (OBM) tile grid

description: >-
  OpenBuildingMap (OBM) tile grid, used to resolve download partitions for OBM
  footprints.

# Administrative unit identifier of the geography that the data covers
admin_id: NULL

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: tile
   # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: obm
    # Same source as footprint-obm-2025: OpenBuildingMap, published by
    # GFZ under ODbL-1.0 and itself OSM-derived. Terms verified
    # 2026-08-19 at the portal; share-alike and attribution apply to any
    # derivative database.
    license: "ODbL-1.0"
    terms_url: "https://opendatacommons.org/licenses/odbl/1-0/"
    redistribution_restricted: false
    # Link to portal with metadata
    portal_url: "https://gee-community-catalog.org/projects/obm/"
    # Link to direct download
    download_url: "https://umap.openstreetmap.de/de/datalayer/81684/ac9788a9-c215-417d-a580-cb545acd78b9/"
  version: 2025

# Name of uncompressed file (set to skip re-extracting)
uncompressed_file_name: "ac9788a9-c215-417d-a580-cb545acd78b9.geojson"

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  tile_id: quadkey
  tile_id_2: id
  url: URL
  n_buildings: number_of_buildings

# Keep columns not named in `columns`?
keep_unnamed_columns: True

# Name of column to use as an index
set_index: tile_id

# Persist n:m entity links to admin layers after ingest (tile_id <->
# admin_id crosswalks); used to resolve tiled download partitions of
# recipes with `download_by.tile_recipe_id` pointing here
#
# Linked to openplaces' own harmonized admin layers, not to GADM. A
# GADM link would key a persisted crosswalk on GADM identifiers, which
# openplaces cannot ship: GADM allows academic use but not
# redistribution without prior permission. The harmonized layers cover
# the same units and carry identifiers this project issues itself.
entity_links:
  - recipe_id: admin-openplaces-2026_admin1
  - recipe_id: admin-openplaces-2026_admin2
  - recipe_id: admin-openplaces-2026_admin3
  - recipe_id: US_admin-census-2021_admin2
  - recipe_id: US_admin-census-2021_admin3
