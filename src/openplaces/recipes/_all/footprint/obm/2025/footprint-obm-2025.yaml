# Recipe to import OpenBuildingMap (OBM) building footprints

description: >-
  OpenBuildingMap (OBM) global building footprints, downloaded per tile.

# Administrative unit identifier of the geography that the data covers
admin_id: NULL

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: footprint
   # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: obm
    # Link to portal with metadata
    portal_url: "https://gee-community-catalog.org/projects/obm/"
    # Link to direct download
    download_url: "https://datapub.gfz.de/download/10.5880.GFZ.LKUT.2025.002-Caweb/2025-002_Oostwegel-et-al_data/building.{tile_id}.gpkg.bz2"
    # Terms verified 2026-08-19 at the portal below. OBM conflates
    # OpenStreetMap (23%), Google Open Buildings (59%) and Microsoft
    # Global ML Footprints (18%), and inherits OSM's licence. ODbL is
    # share-alike: a derivative database must itself be ODbL, and must
    # attribute OSM contributors plus Oostwegel, Schorlemmer, Lingner &
    # Evaz Zadeh (2025), DOI 10.5880/GFZ.LKUT.2025.002.
    license: "ODbL-1.0"
    terms_url: "https://opendatacommons.org/licenses/odbl/1-0/"
    # Redistribution is permitted -- conditioned on share-alike and
    # attribution, not forbidden. Contrast GADM, which forbids it.
    redistribution_restricted: false
  version: 2025

# Name of compressed file (set to skip re-downloading)
compressed_file_name: "building.{tile_id}.gpkg.bz2"

# Name of uncompressed file (set to skip re-extracting)
uncompressed_file_name: "building.{tile_id}.gpkg"

# How is the download data partitioned?
download_by:
  partition: tile_id
  tile_recipe_id: tile-obm-2025

# Layer that identifies third-level admin subdivisions (Level 2 in GADM)
layer: building

# Columns from `openplaces` dictionary for entity -> columns in imported table
columns:
  building_id_obm: id
  occupancy: occupancy
  source_date: last_update
  source_id: source_id
  height: height
  floorspace: floorspace
  quadkey: quadkey

# Extract height source from height column (format: 'SOURCE:value', e.g. 'HHT:10.5')
transformations:
  - output: height_source
    type: string
    operation: split_take
    input: height
    args:
      sep: ":"
      index: 0

# Columns to be cast to categorical (saves space)
columns_to_categorical:
  - occupancy
  - height_source: [H, HBET, HHT]  # ordered low to high

# If two polygons overlap substantially, keep the larger one
keep_overlapping_polygons: false

# Assign administrative IDs using spatial joins/overlays
overlay_admin_ids:
  admin_level: 3
  admin_recipe_id: US_admin-census-2021_admin3

# Function to give the GeoDataFrame an index
create_index:
  function: "openplaces.geo.ids.add_openlocationcode_index"
  args:
    name: footprint_id

save_to:
  data_dir: cache
  # Split output into per-admin-unit files at this level
  # (1: state, 2: county, 3: town etc.)
  admin_level: 3
