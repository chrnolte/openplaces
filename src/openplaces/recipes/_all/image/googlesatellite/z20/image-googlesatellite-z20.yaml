description: >-
  Per-building Google satellite imagery at zoom level 20, fetched with the BRAILS++
  scraper (no API key required).

admin_id: NULL

entity:
  entity_type: image
  source:
    source_id: googlesatellite
  version: "z20"
# BRAILS++ Google Satellite scraper (Cetiner, BRAILS++, 2024).
# Downloads per-building satellite imagery at zoom level 20 (no API key needed).
image_scraper: google_satellite
zoom_level: 20

# Recipe ID of the harmonized entity spine to use as input.
entity_recipe: US_footprint-spine-2026

source:
  url: https://mt1.google.com/vt/lyrs=s

process_by:
  admin_level: 4

# No `save_to`: this recipe writes nothing. Google's Static API policy
# prohibits pre-fetching, indexing, storing, or caching its content, so
# imagery has no ingest stage -- `enrich` fetches it in memory per run and
# drops the pixels (io.ingester.image_ingester.fetch_images_in_memory).
# The recipe carries camera configuration only.
