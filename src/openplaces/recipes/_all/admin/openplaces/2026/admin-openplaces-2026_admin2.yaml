# Recipe: Harmonized admin level-2 geometries (states / regions)
#
# See admin-openplaces-2026_admin1.yaml for harmonization strategy.

description: >-
  Harmonized global state and region geometries (admin level 2).

stage: harmonize
admin_id: NULL

entity:
  entity_type: admin
  source:
    source_id: openplaces
    # Not an external source: this is an openplaces pipeline product, so
    # it carries whatever its inputs carry and nothing of its own. The
    # applicable terms are derived per output by io.bundle_terms, which
    # walks the dependency graph rather than reading a licence here.
    # Left unrestricted-unknown deliberately: "depends on the inputs" is
    # not "unrestricted".
    license: "derived; inherits the terms of this recipe's inputs"
    redistribution_restricted: null
  version: 2026

admin_level: 2

# Processed one level-1 unit at a time. This is what
# scopes the run: `Harmonizer` sizes its unit list from
# `process_by.admin_level`, and without it the recipe's null
# admin_id makes every run global regardless of the caller.
process_by:
  admin_level: 1

save_to:
  data_dir: core
  filename: admin2
  # One file per level-1 unit, not one global file: drawing a
  # single town should read its own neighbourhood, not the world.
  admin_level: 1

pipeline:
  - step: discover_sources
  - step: merge_global
  - step: simplify_geometries
    thresholds:
      tolerance: 0.01
