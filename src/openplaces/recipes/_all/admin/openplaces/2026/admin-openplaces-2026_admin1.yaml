# Recipe: Harmonized admin level-1 geometries (countries)
#
# Discovers all stage='ingest' admin recipes at level 1, ranks the ones
# covering each country (most specific, then newest), takes each
# country's polygon from the first that has one, and simplifies a copy
# for visualization. Restricted sources (GADM) are not candidates.
#
# Two sources, split differently: geoBoundaries CGAZ draws sovereign
# states, and Natural Earth's map units fill the dependencies and
# overseas departments CGAZ draws inside them. The step
# carve_lumped_territories gives each such territory the area its
# sovereign's CGAZ polygon lumped in, so no two countries overlap.

description: >-
  Harmonized global country geometries (admin level 1), merging the most specific
  ingested source per country.

stage: harmonize
admin_id: NULL

entity:
  entity_type: admin
  source:
    source_id: openplaces
    # Not an external source: this is an openplaces pipeline product, so
    # it carries whatever its inputs carry and nothing of its own. The
    # applicable terms are derived per output by io.bundle_terms, which
    # walks the dependency graph rather than reading a licence here.
    # Left unrestricted-unknown deliberately: "depends on the inputs" is
    # not "unrestricted".
    license: "derived; inherits the terms of this recipe's inputs"
    redistribution_restricted: null
  version: 2026

admin_level: 1

save_to:
  data_dir: core
  filename: admin1
  # Deliberately not partitioned. Countries are the outermost context, so
  # there is no parent to partition by, and the layer is small enough to
  # hold globally.

pipeline:
  - step: discover_sources
  - step: merge_global
  - step: carve_lumped_territories
  - step: simplify_geometries
    thresholds:
      tolerance: 0.01
