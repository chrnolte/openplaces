# Recipe to import the Global Administrative Database

# Administrative unit identifier: where does this data come from?
# NULL: global
# US: United States
# US-WI: Wisconsin
# US-WI-DA: Dane county
admin_id: NULL

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: admin
   # What is the source and URL of a dataset that identifies each unit?
  source: 
    source_id: gadm
    url: "https://geodata.ucdavis.edu/gadm/gadm4.1/gadm_410-levels.zip"
  version: 4.1

# Path to compressed file (set to skip re-downloading)
# compressed_file_name: "gadm_410-gpkg.zip"
compressed_file_name: "gadm_410-levels.zip"

# Path to uncompressed file path (set to skip re-extracting)
uncompressed_file_name: "gadm_410-levels.gpkg"  # Gigabytes

# Layer that identifies first-level country subdivisions
layer: ADM_2

# Columns from `openplaces` dictionary -> columns in imported table
columns:
  name: NAME_2
  type: ENGTYPE_2 
  admin1_name: NAME_1
  admin0_name: COUNTRY
  name_original: NL_NAME_2
  name_alternatives: VARNAME_2
  type_original: TYPE_2
  admin1_type: TYPE_1 
  admin1_name_original: NL_NAME_1
  admin2_id_gadm: GID_2
  admin2_id_original: CC_2
  admin2_id_hasc: HASC_2
  admin1_id_gadm: GID_1 
  admin0_id_a3: GID_0

# Keep columns that aren't named in the above list
# keep_unnamed_columns: True

# Filter query to select rows
query: "type not in ('Water body', 'Waterbody', 'Water Body')"

# Function that returns an indexed version of the input GeoDataFrame
# (usually a custom function designed for a specific indexing case)
index_function: "openplaces.io.admin.admin2_id_index_from_admin2_gadm"

# Internal filename after import. This is only needed if the filename
# cannot be derived from the reference (admin_id, entity, etc.) alone.
# Use if source file has multiple layers, or if `layer` has a value.
cache_filename: 'admin2'

# Do you want to pre-compute label positions (Poles of Inaccessibility)?
# This is an expensive operation and can take a while with large tables.
compute_poi: True

# Create and save additional geometry layer with simplified coverage
# for quicker plots. Use same filename, with suffix '_simplified'.
simplify_coverage_tolerance: 0.1
