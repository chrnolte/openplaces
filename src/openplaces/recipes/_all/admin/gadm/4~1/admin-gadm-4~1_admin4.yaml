# Recipe to import the Global Administrative Database, Level 4

# (unfinished, as GADM only covers a fraction of the world at Level 3)

description: >-
  GADM level-3 municipality boundaries, ingested as openplaces admin level 4 (partial
  global coverage).

# Administrative unit identifier: where does this data come from?
admin_id: NULL

# Entity: what is the unit of analysis of the imported data?
entity:
  # What is its type? (parcel, property, transaction, person, admin)
  entity_type: admin
   # What is the source and URL of a dataset that identifies each unit?
  source:
    source_id: gadm
    download_url: "https://geodata.ucdavis.edu/gadm/gadm4.1/gadm_410-levels.zip"
    # Terms verified 2026-08-18 at the terms_url below: "The data are
    # freely available for academic use and other non-commercial use.
    # Redistribution or commercial use is not allowed without prior
    # permission." (Austria's data is separately CC-BY-SA 2.0.)
    license: "non-commercial; redistribution requires permission"
    terms_url: "https://gadm.org/license.html"
    redistribution_restricted: true
  version: 4.1

# Name of compressed file (set to skip re-downloading)
# compressed_file_name: "gadm_410-gpkg.zip"
compressed_file_name: "gadm_410-levels.zip"

# Name of uncompressed file (set to skip re-extracting)
uncompressed_file_name: "gadm_410-levels.gpkg"  # Gigabytes

# Layer that identifies first-level country subdivisions
layer: ADM_3

# Columns from `openplaces` dictionary -> columns in imported table
columns:
  name: NAME_3
  type: ENGTYPE_3
  admin3_name: NAME_2
  admin2_name: NAME_1
  admin1_name: COUNTRY
  name_original: NL_NAME_3
  name_alternatives: VARNAME_3
  type_original: TYPE_3
  admin3_name_original: NL_NAME_2
  admin3_name_alternatives: VARNAME_2
  admin2_name_original: NL_NAME_1
  admin3_type: TYPE_2
  admin2_type: TYPE_1
  admin4_id_hasc: HASC_3
  admin4_id_admin1: CC_3
  admin4_id_gadm: GID_3
  admin3_id_gadm: GID_2
  admin2_id_gadm: GID_1
  admin1_id_a3: GID_0

# Values to be interpreted as empty (None)
null_value_strings: ["NA"]

# Filter query to select rows
query: "type not in ('Water body', 'Waterbody', 'Water Body') and not (admin3_name in ('Water body', 'Lake Chiuta', 'Lake Chilwa', 'Lake Malawi', 'Lake Malombe', 'Songkhla Lake   ') or admin3_name.str.startswith('Songkhla Lake') or admin3_name.isnull())"

# Translate `admin_id` information from source to `openplaces` admin_ids
admin_id_crosswalk:
  admin_level: 3
  admin_id_column: admin3_id_gadm
  admin_recipe_id: 'admin-gadm-4~1_admin3'

# Function that returns an indexed version of the input GeoDataFrame
# (usually a custom function designed for a specific indexing case)
create_index:
  function: "openplaces.io.admin_codes.assign_admin_ids"
  args:
    new_admin_id_col: admin4_id
    parent_admin_id_col: admin3_id

# Sort by index?
sort_index: True

save_to:
  data_dir: cache
  filename: admin4
