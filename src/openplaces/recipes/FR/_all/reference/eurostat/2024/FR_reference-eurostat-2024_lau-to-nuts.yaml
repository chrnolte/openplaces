# Recipe to import France's LAU-to-NUTS3 crosswalk (Eurostat, 2024)
#
# NUTS codes are hierarchical by construction (EC Reg. 1059/2003): a
# NUTS3 code truncated by one character is its NUTS2 code, truncated by
# one more is NUTS1 (confirmed against the UK's own ITL data,
# GB_reference-ons-2024_lad-to-nuts.yaml). So this table only needs the
# LAU-to-NUTS3 join Eurostat publishes; NUTS2/NUTS1 are derived by
# truncation, not a second lookup.
#
# Deliberately kept OUT of the admin spine, same as GB's crosswalk: see
# GB_reference-ons-2024_lad-to-nuts.yaml for the rationale.

description: >-
  France's LAU-to-NUTS crosswalk (LAU to NUTS1/2/3), 2024.

admin_id: FR

dataset:
  theme: reference
  source:
    source_id: eurostat
    portal_url: "https://ec.europa.eu/eurostat/web/nuts/local-administrative-units"
    # One workbook covers every NUTS/EFTA/candidate country at once, one
    # sheet per country (selected via `sheet_name` below).
    download_url: "https://ec.europa.eu/eurostat/documents/345175/501971/EU-27-LAU-2024-NUTS-2024.xlsx/12971f56-c035-dbab-4d9f-ff1dcc617bb3"
  version: 2024

compressed_file_name: "eu-27-lau-2024-nuts-2024.xlsx"
sheet_name: FR
# pandas.read_excel requires an int/list-of-int/None header, unlike
# read_csv's 'infer' default the ingester otherwise applies.
header: 0

columns:
  _eu_lau_code: "EU LAU CODE"
  nuts3_id: NUTS3

transformations:
  # National LAU (INSEE) code, stripping the "FR_" country prefix -- same
  # derivation as FR_admin-gisco-2024_admin4.yaml, so the two match.
  - output: admin4_id_admin1
    type: string
    operation: substring
    input: _eu_lau_code
    args:
      start: 3
  - output: nuts2_id
    type: string
    operation: substring
    input: nuts3_id
    args:
      start: 0
      end: 4
  - output: nuts1_id
    type: string
    operation: substring
    input: nuts3_id
    args:
      start: 0
      end: 3

# Keep the derived admin4_id_admin1/nuts{1,2}_id columns (not literal
# `columns:` keys, so dropped by the default reorder otherwise).
keep_unnamed_columns: true

# Function that returns an indexed version of the input DataFrame
# (translates each row's LAU code into the already-ingested FR admin4's
# admin4_id)
create_index:
  function: "openplaces.io.admin.nuts_crosswalk_index_from_admin4"
  args:
    admin4_recipe_id: FR_admin-gisco-2024_admin4

save_to:
  data_dir: cache
