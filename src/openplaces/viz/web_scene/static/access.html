<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Land and building values: access</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- Where the site's token gate sends a visitor without a valid token
     (`access_htaccess`). It names no place and links to no page. The
     contact address comes from the deploy settings (`ACCESS_CONTACT`),
     filled in by `deploy_landing`, never from the repository. -->
<style>
  :root {
    --bg: #05070d;
    --text: #e8eaed;
    --muted: #9aa0a6;
  }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(ellipse 80% 70% at 50% 30%, #13213d 0%, #0a1222 45%, var(--bg) 100%);
    background-color: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 18vh 16px 72px; text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 24px; font-weight: 600; margin: 16px 0 12px; }
  p { color: var(--muted); margin: 0 0 12px; }
  a { color: #9ecbff; }
</style>
</head>
<body>
<main>
  <img src="icon-180.png" alt="">
  <h1>Land and building values</h1>
  <p>These pages are shared by invitation. Open them with the link you received.</p>
  <p>To request access, write to <a href="mailto:{{CONTACT}}">{{CONTACT}}</a>.</p>
</main>
</body>
</html>
