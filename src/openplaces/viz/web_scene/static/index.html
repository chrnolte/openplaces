<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Land &amp; structure value</title>
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(8, 11, 20, 0.78);
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #ff4fd8;
  }
  html, body {
    margin: 0;
    height: 100%;
    /* Night sky: a faint blue glow behind the city, falling to near
       black at the edges, so the scene ends in depth, not flat gray. */
    background: radial-gradient(ellipse 80% 70% at 50% 45%, #13213d 0%, #0a1222 45%, var(--bg) 100%);
    background-color: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* All touch gestures go to the page's own handlers (no browser
     scroll or zoom on the scene). */
  #scene { position: fixed; inset: 0; touch-action: none; }
  .panel {
    box-sizing: border-box;
    position: fixed;
    background: var(--panel);
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }
  #title-panel { top: 16px; left: 16px; max-width: min(420px, calc(100vw - 32px)); padding: 8px 12px; }
  #title-panel h1 { font-size: 17px; margin: 0; }
  #status:empty { display: none; }
  #title-panel { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; }
  #title-panel > :not(#home-link) { grid-column: 2; }
  #place-panel { top: 16px; right: 16px; padding: 8px 12px; max-width: calc(50vw - 24px); }
  #place-panel[hidden] { display: none; }
  /* The compass sits under the places menu, top right. */
  #compass {
    top: 64px;
    right: 16px;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    color: var(--text);
    cursor: pointer;
    display: grid;
    place-items: center;
    font: inherit;
  }
  #compass .needle { grid-area: 1 / 1; font-size: 13px; color: #ff6b6b; line-height: 1; transition: transform 0.1s linear; transform-origin: 50% 70%; }
  #compass .n { grid-area: 1 / 1; font-size: 9px; font-weight: 700; margin-top: 16px; color: var(--muted); }
  #place-panel[hidden] ~ #compass { top: 16px; }
  /* The display controls open above the bottom bar, at the right. */
  #legend-panel {
    right: 16px;
    bottom: 80px;
    width: min(360px, calc(100vw - 32px));
    max-height: calc(100vh - 180px);
    overflow: auto;
  }
  #bottom-bar {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 8px;
    pointer-events: none;
  }
  #bottom-bar > * { pointer-events: auto; }
  #legend-box { position: static; width: min(340px, 100%); margin-right: auto; padding: 8px 12px; }
  #legend-box:not([open]) { width: auto; }
  #legend-box summary { cursor: pointer; font-weight: 600; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  #legend-box summary::before { content: "\25B8"; }
  #legend-box[open] summary::before { content: "\25BE"; }
  #legend-box summary::-webkit-details-marker { display: none; }
  #legend-box summary { list-style: none; }
  #legend-box[open] summary { margin-bottom: 6px; }
  #legend-box summary #palette-switch { margin: 0; gap: 4px; }
  #legend-box summary #palette-switch button { padding: 1px 7px; font-weight: 400; }
  .footnote { color: var(--muted); font-size: 11px; margin: -4px 0 10px; }
  .legend-none { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
  .legend-none span { width: 14px; height: 10px; border-radius: 2px; border: 1px solid rgba(128, 128, 128, 0.5); }
  #home-link {
    grid-row: 1 / span 3;
    align-self: start;
    color: var(--text);
    text-decoration: none;
    font-size: 22px;
    line-height: 1;
    padding: 0 2px;
  }
  #home-link:hover { color: #fff; }
  /* The menu of other places: plain links (viewer.js buildPlaceNav). */
  #place-menu { font-size: 13px; }
  #place-menu summary { cursor: pointer; font-weight: 600; }
  #place-menu .place-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  #place-menu a { color: var(--muted); text-decoration: none; }
  #place-menu a:hover { color: var(--text); }
  #layer-switch, #view-switch, #values-switch, #palette-switch { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  #view-switch:empty, #values-switch:empty { display: none; }
  .switch-label { font-size: 12px; color: var(--muted); align-self: center; }
  #layer-switch button, #view-switch button, #values-switch button, #palette-switch button {
    font: inherit;
    font-size: 12px;
    color: var(--muted);
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    padding: 3px 10px;
    cursor: pointer;
  }
  #layer-switch button::before { content: "\2610  "; }
  #layer-switch button.active::before { content: "\2611  "; }
  #layer-switch button.active, #view-switch button.active, #values-switch button.active, #palette-switch button.active {
    color: var(--text);
    border-color: rgba(255, 255, 255, 0.6);
    background: rgba(255, 255, 255, 0.08);
  }
  .legend { margin-bottom: 10px; }
  .legend:last-child { margin-bottom: 0; }
  .legend-label { font-weight: 600; margin-bottom: 4px; }
  .legend-which { color: var(--muted); font-size: 11px; margin: -2px 0 6px; }
  .legend.hidden canvas, .legend.hidden .legend-ticks { opacity: 0.25; }
  .legend.hidden .legend-label { color: var(--muted); }
  .legend canvas { width: 100%; height: 12px; display: block; border-radius: 2px; }
  .legend-ticks { position: relative; height: 16px; color: var(--muted); font-size: 11px; }
  .legend-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  #about-panel {
    position: static;
    max-width: min(460px, calc(100vw - 32px));
    max-height: 50vh;
    overflow: auto;
    padding: 8px 12px;
  }
  /* Folded controls: the panel hides; the chip stays in the bar. */
  .controls-min #legend-panel { display: none; }
  #controls-chip, #share-chip {
    position: static;
    flex: none;
    font: inherit;
    font-weight: 600;
    color: var(--text);
    border: 0;
    cursor: pointer;
    white-space: nowrap;
    padding: 8px 12px;
  }
  body:not(.controls-min) #controls-chip { outline: 1px solid rgba(255, 255, 255, 0.5); }
  #legend-minimize {
    position: absolute;
    top: 6px;
    right: 8px;
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
  }
  #legend-minimize:hover { color: var(--text); }
  #legend-panel { padding-top: 14px; }
  #about-panel summary { cursor: pointer; font-weight: 600; }
  #about-panel pre { white-space: pre-wrap; font-size: 11px; color: var(--muted); }
  #about-panel[open] { width: min(420px, calc(100vw - 32px)); }
  #notices { font-size: 12.5px; line-height: 1.45; }
  .src-intro { color: var(--muted); margin: 10px 0 4px; }
  .src-layer {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 14px 0 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(128, 128, 128, 0.25);
  }
  .src-list { list-style: none; margin: 0; padding: 0; }
  .src-item { margin: 0 0 10px; }
  .src-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
  .src-name { font-weight: 600; }
  .src-bar { height: 4px; border-radius: 2px; background: rgba(128, 128, 128, 0.2); position: relative; overflow: hidden; }
  .src-bar::after { content: ""; position: absolute; inset: 0; width: var(--w); background: currentColor; opacity: 0.55; border-radius: 2px; }
  .src-share { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
  .src-credit { margin-top: 2px; }
  .src-terms { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .src-terms a { color: inherit; }
  .src-note { color: var(--muted); font-size: 11.5px; margin: 4px 0 0; padding: 6px 8px; border-left: 2px solid rgba(128, 128, 128, 0.4); }
  #status { margin-top: 6px; color: var(--muted); font-size: 12px; }
  .deck-tooltip { font-size: 13px !important; max-width: 320px; }
  /* A clicked feature's tooltip, placed above its anchor by viewer.js. */
  .pinned-tip {
    position: absolute;
    left: 0;
    top: 0;
    margin: 0;
    /* 56px above its anchor, joined to it by .pin-leader. */
    translate: -50% calc(-100% - 56px);
    background: rgba(8, 11, 20, 0.92);
    color: var(--text);
    padding: 10px 28px 10px 12px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
    pointer-events: auto;
    z-index: 2;
  }
  .pinned-tip[hidden] { display: none; }
  /* A thin line from the pinned tooltip down to the point clicked, with
     a dot on it; its foot is placed on the anchor by viewer.js. */
  .pin-leader {
    position: absolute;
    left: 0;
    top: 0;
    width: 1px;
    height: 56px;
    translate: 0 -56px;
    background: rgba(255, 255, 255, 0.75);
    pointer-events: none;
    z-index: 2;
  }
  .pin-leader::after {
    content: "";
    position: absolute;
    left: -3px;
    bottom: -3px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(8, 11, 20, 0.6);
  }
  .pin-leader[hidden] { display: none; }
  /* On a light page (the Paper palette) the leader turns dark. */
  .light-page .pin-leader { background: rgba(20, 24, 36, 0.8); }
  .light-page .pin-leader::after { background: #141824; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7); }
  .pin-close {
    position: absolute;
    top: 2px;
    right: 4px;
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .deck-tooltip .estimated { color: #ffd166; }
  @media (max-width: 640px) {
    /* Phone: the legend takes the bar's first row, the chips the
       second; the controls open above the whole bar (its height is
       set by viewer.js). */
    #legend-box[open] { width: 100%; margin-right: 0; }
    #legend-box { padding: 6px 10px; }
    #legend-box .legend { margin-bottom: 4px; }
    #legend-box .legend-label { font-size: 12px; margin-bottom: 2px; }
    #about-panel { flex: 1; max-height: 40vh; padding: 6px 10px; }
    /* Opened, the Sources document takes a row of its own. */
    #about-panel[open] { flex: 1 1 100%; width: auto; max-height: 55vh; }
    #controls-chip, #share-chip { padding: 6px 10px; }
    #title-panel { padding: 6px 10px; max-width: calc(50vw - 20px); }
    #title-panel h1 { font-size: 14px; }
    #place-panel { padding: 6px 10px; }
    #legend-panel { left: 16px; right: 16px; width: auto; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="title-panel" class="panel">
  <h1 id="title">Land &amp; structure value</h1>
  <div id="status">Loading...</div>
</div>
<!-- Top right: the menu of places (viewer.js buildPlaceNav). -->
<div id="place-panel" class="panel" hidden></div>
<!-- The display controls, opened from the "Controls" chip below. -->
<div id="legend-panel" class="panel"></div>
<!-- The bottom bar: the legend, the "Controls" chip (viewer.js) and
     "Sources". -->
<div id="bottom-bar">
  <!-- The legend: open by default, can be folded. -->
  <details id="legend-box" class="panel" open>
    <summary>Legend</summary>
    <div id="legends"></div>
  </details>
  <!-- Closed by default; MassGIS asks for credit wherever its data
       are shown, and the sources' notices live here. -->
  <details id="about-panel" class="panel">
    <summary>Sources</summary>
    <div id="notices"></div>
  </details>
</div>
<script src="viewer.js"></script>
</body>
</html>
