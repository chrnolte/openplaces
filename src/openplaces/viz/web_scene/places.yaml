# Places of the value pages: an editorial list (maintainer's choices,
# 2026-10-17). Each page shows everything whose center lies within
# `radius_km` of a fixed point; phones get a smaller circle. The points
# are chosen by hand (a university plaza, city halls located by address
# in the delivered parcel bundles), never derived from the data or from
# the held land-market regions (register items 13 and LVR-1).
#
# Order: descending number of dwellings inside the circle (measured
# 2026-10-17 on the delivered building outlines).

radius_km: 15
phone_radius_km: 7

places:
# `around` completes the landing card's line "Within 15 km of ...".

