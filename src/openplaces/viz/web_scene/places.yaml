# Places of the value pages: an editorial list (maintainer's choices,
# 2026-10-17). Each page shows everything whose center lies within
# `radius_km` of a fixed point; phones get a smaller circle. The points
# are chosen by hand (a university plaza, city halls located by address
# in the delivered parcel bundles), never derived from the data or from
# the held land-market regions (register items 13 and LVR-1).
#
# Order on the site: descending number of parcels each built page
# draws (maintainer, 2026-10-20), counted at build time and sorted by
# `site.landing`, so the order of this list does not matter.
#
# The tour's first stop is downtown (maintainer, 2026-10-18): the
# place's `downtown`, else its `center` (a city hall lot). Downtown
# points are city or town halls located by address in the delivered
# parcel bundles.

radius_km: 15
phone_radius_km: 7

places:
# `around` completes the landing card's line "Within 15 km of ...".

  - slug: boston
    title: Boston area
    around: Boston University
    state: US-MA
    center: [-71.1055, 42.3503]
    center_note: Boston University, Marsh Plaza
    downtown: [-71.05801, 42.36028]
    downtown_note: City hall lot, 1 City Hall Sq
  # North Carolina keeps three places on the site: Raleigh, Asheville
  # and Wilmington (maintainer, 2026-10-25).
  - slug: raleigh
    title: Raleigh, North Carolina
    around: downtown Raleigh
    state: US-NC
    center: [-78.64298, 35.77873]
    center_note: City hall lot, 222 W Hargett St
  - slug: asheville
    title: Asheville, North Carolina
    around: downtown Asheville
    state: US-NC
    center: [-82.5515, 35.5951]
    center_note: City hall
  - slug: wilmington
    title: Wilmington, North Carolina
    around: downtown Wilmington
    state: US-NC
    center: [-77.9447, 34.2357]
    center_note: City hall
  # Houston and Madison (maintainer, 2026-10-19).
  - slug: houston
    title: Houston, Texas
    around: downtown Houston
    state: US-TX
    center: [-95.36936, 29.76019]
    center_note: City hall lot, 901 Bagby St
  - slug: madison
    title: Madison, Wisconsin
    around: downtown Madison
    state: US-WI
    center: [-89.3824, 43.07243]
    center_note: City-County Building lot, 210 Martin Luther King Jr Blvd
  # City pages show their city limits whole (maintainer, 2026-10-19):
  # `extent` names a Census place (recipe, id column, GEOID), so
  # neighboring cities never overlap. Port Arthur is the CHEER pilot;
  # both cities are drawn from the one Jefferson County bundle (region
  # jefferson-county-tx).
  - slug: port-arthur
    title: Port Arthur, Texas
    extent_note: The city of Port Arthur
    state: US-TX
    extent: {recipe: US_tile-census-2025_place, column: census_place_geoid, id: '4858820'}
    downtown: [-93.93389, 29.87015]
    downtown_note: City hall lot, 444 4th St
  - slug: beaumont
    title: Beaumont, Texas
    extent_note: The city of Beaumont
    state: US-TX
    extent: {recipe: US_tile-census-2025_place, column: census_place_geoid, id: '4807000'}
    downtown: [-94.09515, 30.08256]
    downtown_note: City hall lot, 801 Main St
  # The island, not a circle (maintainer, 2026-10-18): a place listing
  # `admin_ids` shows those units whole, with no phone page, and
  # `extent_note` is its landing card's line. The town of Nantucket
  # also holds Tuckernuck and Muskeget.
  - slug: nantucket
    title: Nantucket, Massachusetts
    extent_note: The island of Nantucket
    state: US-MA
    admin_ids: [US-MA-NTC]
    downtown: [-70.09911, 41.28501]
    downtown_note: Town building lot, 16 Broad St
  # A team page (maintainer, 2026-10-18): `team: true` reads the team
  # bundles, is published only behind a password, never appears on the
  # landing page and is left out of `--all`.
  - slug: nantucket-team
    title: Nantucket, Massachusetts (team)
    extent_note: The island of Nantucket, for the research team
    state: US-MA
    admin_ids: [US-MA-NTC]
    downtown: [-70.09911, 41.28501]
    downtown_note: Town building lot, 16 Broad St
    team: true
  # Team pages of land value models handed over as files (maintainer,
  # 2026-10-19, for the BEA meeting): `model_files` is one parquet per
  # unit under the data root, keyed by `parcel_id`, with its JSON
  # sidecar; the page reads the public bundles and is a team page by
  # its models (`local.place_models`). Whole counties.
  - slug: madison-team
    title: Dane County, Wisconsin (team)
    extent_note: Dane County, for the research team
    state: US-WI
    admin_ids: [US-WI-DA]
    downtown: [-89.3824, 43.07243]
    downtown_note: City-County Building lot, 210 Martin Luther King Jr Blvd
    team: true
    model_files: data/out/valuation/2026-10-19/predictions/{admin_id}_land-value-models.parquet
  - slug: lake-county-fl-team
    title: Lake County, Florida (team)
    extent_note: Lake County, for the research team
    state: US-FL
    admin_ids: [US-FL-LA]
    downtown: [-81.72972, 28.80171]
    downtown_note: County administration building lot, 315 W Main St, Tavares
    team: true
    model_files: data/out/valuation/2026-10-19/predictions/{admin_id}_land-value-models.parquet
  - slug: pitt-nc-team
    title: Pitt County, North Carolina (team)
    extent_note: Pitt County, for the research team
    state: US-NC
    admin_ids: [US-NC-PIT]
    downtown: [-77.37458, 35.61165]
    downtown_note: City hall lot, 200 W Fifth St, Greenville
    team: true
    model_files: data/out/valuation/2026-10-19/predictions/{admin_id}_land-value-models.parquet
  # No openplaces bundle: the model file carries the lots (MD iMAP
  # outlines, SDAT values) and the page is land alone, on flat ground
  # (`lots_in_model_file`, `terrain: false`).
  - slug: prince-georges-md-team
    title: Prince George's County, Maryland (team)
    extent_note: Prince George's County, for the research team
    state: US-MD
    admin_ids: [US-MD-PG]
    downtown: [-76.7497, 38.8156]
    downtown_note: County Administration Building, Upper Marlboro (county seat)
    team: true
    model_files: data/out/valuation/2026-10-19/predictions/{admin_id}_land-value-models.parquet
    lots_in_model_file: true
    terrain: false
  # Washington DC, a circle like every page (maintainer, 2026-10-19),
  # reaching into every state of `states`; a generic Washington tour,
  # starting downtown at city hall (maintainer, 2026-10-25). Lots and
  # buildings from the `washington-dc` team bundles (`team_bundles`:
  # Fairfax's values, team only), the models joined on their parcel ids
  # where a unit has a model file (DC, PG, MO).
  # Named washington-dc-pg-team until 2026-10-25 (when it showed DC and
  # Prince George's for the BEA meeting); a published copy under that
  # name gets a redirect here (`deploy_redirect`) when this is published.
  - slug: washington-dc-team
    title: Washington DC area (team)
    around: the John A. Wilson Building, for the research team
    state: US-DC
    states: [US-DC, US-MD, US-VA]
    center: [-77.03133, 38.89503]
    center_note: City hall lot (John A. Wilson Building), 1350 E St NW in DC's records
    team: true
    team_bundles: true
    model_files: data/out/valuation/2026-10-19/predictions/{admin_id}_land-value-models.parquet
    terrain: false
    # Arlington's values, which the bundles withhold, on a twin page
    # only the maintainer's restricted token opens (maintainer,
    # 2026-10-25): its terms allow personal use, not sharing
    # (plans/findings/northern-virginia-roll-terms.md).
    restricted_units: [US-VA-AR]
    restricted_notes:
      - name: Restricted values
        credit: >-
          Arlington County's assessed values, which the shared data
          withholds, shown here for personal use only. Arlington County
          Data API was used for this purpose, but it is not endorsed or
          certified by Arlington County.
  # Washington DC for everyone (maintainer, 2026-10-24): a public page
  # of the city itself, its tour starting downtown at city hall, with
  # no models and no tie to any agency's campus. Only the units cleared
  # for a public page.
  - slug: washington-dc
    title: Washington, DC
    around: the John A. Wilson Building (city hall)
    state: US-DC
    states: [US-DC, US-MD, US-VA]
    center: [-77.03133, 38.89503]
    center_note: City hall lot (John A. Wilson Building), 1350 E St NW in DC's records
    only_units: [US-DC-DC, US-MD-PG, US-MD-MO]
    terrain: false
    notes:
      - name: Counties shown
        credit: >-
          The District of Columbia and Prince George's and Montgomery
          counties, Maryland, whose records may be shared. The circle's
          Virginia counties are left out until their terms allow it.
