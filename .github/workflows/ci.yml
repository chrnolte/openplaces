name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      # environment.yml, not pip. The test suite needs torch, which this
      # project installs from conda-forge only: a pip build links against a
      # different ABI and the `ml` extra is deliberately empty. Several other
      # test dependencies (exactextract, rio-cogeo, lonboard, scikit-learn,
      # zipcodes, gdown) live in optional extras too, so the conda
      # environment is simply the supported install and the one CI should
      # reproduce.
      - uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: environment.yml
          activate-environment: openplaces
          miniforge-version: latest
          use-mamba: true
          auto-activate: false
          # environment.yml already lists `nodefaults`; saying it here
          # too is what setup-miniconda wants going forward, since it
          # is dropping support for the channel-list spelling.
          conda-remove-defaults: true

      # openplaces refuses to invent a data_root, so importing it on a
      # fresh machine raises DataRootNotSetError, and the prompt that
      # would otherwise ask is correctly suppressed on a runner with no
      # console. Write the directories block the error message names,
      # pointing at the runner's scratch space: outside the checkout, as
      # the config requires, and discarded with the runner.
      - name: Configure data root
        run: |
          mkdir -p "$HOME/.config/openplaces" "$RUNNER_TEMP/openplaces-data"
          cat > "$HOME/.config/openplaces/config.yaml" <<YAML
          directories:
            data_root: $RUNNER_TEMP/openplaces-data
          YAML

      - name: Environment
        run: |
          conda info
          python -c "import openplaces as op; print('openplaces imports cleanly'); print('data_root:', op.cfg.get_dir('data_root'))"

      - name: Format
        run: ruff format --check src/ tests/

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        # Agg because the suite imports matplotlib-backed modules and no
        # display is available on the runner. -n auto: one worker per runner
        # core; measured locally, parallelism cuts the suite from ~192s to
        # ~70s, and past about 8 workers the gain reverses because much of
        # the suite is disk-bound rather than CPU-bound.
        env:
          MPLBACKEND: Agg
        run: pytest -n auto
