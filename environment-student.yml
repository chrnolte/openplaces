# environment-student.yml
#
# A smaller environment for coursework and for anyone who wants to
# *use* openplaces rather than develop it. Created by
# `python dev.py setup --student`.
#
# It is a strict subset of environment.yml, and the two must stay
# consistent: every package listed here is pinned identically there.
# What is dropped is listed at the bottom, with the reason, so a
# missing import has an obvious answer rather than a broken install.
#
# The dividing line is "does the ingest -> harmonize -> enrich ->
# curate path need it", not "is it in a pyproject extra". Two packages
# from the `raster` extra are kept because they are module-level
# imports on that path, so their absence is an ImportError rather than
# a missing feature:
#   - exactextract  -> geo/raster.py, so any zonal_stats call needs it
#   - rio-cogeo     -> io/ingester/raster_ingester.py, so ingesting any
#                      raster dataset needs it
# Both are small. torch is the opposite case: needed only by the ML
# detectors in io/enricher/detectors/, and nothing on the ingest ->
# curate path imports it.
#
# Measured against the full environment on Windows, 2026-08-27:
# 373 packages vs 510, and 3.24 GB vs 4.65 GB installed. The saving is
# spread across all 137 dropped packages, not concentrated in one:
# torch, libtorch and torchvision together account for about 260 MB of
# the 1.4 GB. Note the full environment pins the conda-forge cpu_mkl
# build of pytorch, not a CUDA one, so the gap here is much smaller than
# a GPU environment would show.

name: openplaces-student
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Python version
  - python>=3.12,<3.13

  # Core geospatial dependencies (better via conda due to C/C++ libs)
  # KEEP IN SYNC WITH pyproject.toml [project.dependencies]
  - geopandas>=1.0.0
  - duckdb>=1.5.0
  - rasterio>=1.3.0
  - pyproj>=3.5.0
  - shapely>=2.0.0
  - pyogrio>=0.7.0

  # Core non-spatial dependencies
  - numpy>=1.24.0
  - scipy>=1.10.0
  - pandas>=2.0.0
  - pyarrow>=10.0.0
  - requests>=2.28.0
  - tqdm>=4.65.0
  - pyyaml>=6.0.3
  - platformdirs>=4.9.2
  - psutil>=5.9.0
  - usaddress>=0.5.14
  - rapidfuzz>=3.0.0

  # Optional: analysis (regression and zonal statistics in the labs)
  - statsmodels>=0.14.0
  - scikit-learn>=1.3.0
  - rasterstats>=0.19.0

  # Optional: viz, minus the 1M+ polygon renderers
  - matplotlib>=3.7.0
  - plotly>=5.15.0
  - folium>=0.15.0
  - seaborn>=0.12.0
  - contextily>=1.6.2
  - altair>=5.0.0

  # Optional: raster, only the two that are module-level imports on the
  # ingest/enrich path (see header)
  - rio-cogeo>=4.0.0
  - exactextract>=0.3.0

  # Optional: excel (several assessor sources ship .xlsx)
  - openpyxl>=3.1.0

  # Notebooks. nbstripout is NOT optional: notebooks are committed with
  # outputs stripped because raw pipeline output can carry personal
  # fields from upstream sources (see AGENTS.md, "Privacy: no personal
  # data, ever").
  # Anyone who might commit a notebook needs the hook installed.
  - jupyter>=1.0.0
  - jupyterlab>=4.6.1
  - jupyterlab_execute_time>=3.0.0
  - nbstripout>=0.8.2
  - ipython

  # pip for installing packages that are not on conda-forge
  - pip

  - pip:
    # Core, not on conda-forge
    - python-polylabel>=0.6
    - openlocationcode>=1.0.1
    # Optional: postal (curate-stage USPS ZIP-to-city inference)
    - zipcodes>=1.2.0
    - -e .

variables:
  PYTHONUTF8: "1"

# Deliberately NOT included, and what you lose:
#
#   pytorch, torchvision   The ML detectors (floor count, roof shape,
#                          occupancy from imagery) in
#                          io/enricher/detectors/. The single largest
#                          dropped component, ~260 MB. Use the full
#                          environment.yml if you need them.
#   lonboard, datashader,  viz/interactive.py, viz/terrain.py,
#   voila                  viz/raster.py -- GPU/WASM rendering for 1M+
#                          polygons. A county fits in matplotlib.
#   snakemake-minimal,     The workflow driver (workflow/Snakefile,
#   ...executor-plugin,    flow/submit.py, flow/scripts.py). Multi-stage
#   ipynbname              orchestration across a cluster; not needed to
#                          call op.ingest/harmonize/curate directly.
#   playwright, gdown      Browser- and Drive-driven scrapers, used by a
#                          handful of recipes (e.g. wi_retr, placeslab).
#                          A recipe that needs one will say so.
#   rioxarray,             Not imported in src/openplaces at all;
#   scikit-image, numba    present in the full env for notebook work.
#   sphinx and theme       Building these docs locally.
#   rclone                 Cloud-storage sync.
#   ruff, pytest,          Contributor tooling. `python dev.py setup`
#   pre-commit, ...        (without --student) installs all of it.
